name: Database KCI — GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v6

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah folder site (Database KCI)
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Publikasikan preview
        id: deployment
        uses: actions/deploy-pages@v4
