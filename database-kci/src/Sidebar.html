            <!--
              footer
              Tombol Ganti Password ditaruh di sini - BUKAN di dalam menu User
              Management - supaya tetap terjangkau oleh role yang tidak punya
              akses ke menu itu (misalnya ADMIN GANGSAR yang hanya melihat satu
              menu). Setiap petugas berhak mengganti passwordnya sendiri.
            -->

              Footer sidebar: avatar, nama+role, lalu dua tombol ikon - semuanya
              SEJAJAR dalam satu baris (permintaan user). Sebelumnya tombolnya

              Kunci  = ganti password akun sendiri (semua role)
              Pintu  = keluar dari sistem
            -->
            <div class="border-t border-[#1a2d4c] bg-[#070e1a] px-4 py-3 flex items-center gap-3">
