            document.getElementById('massal-daftar').innerHTML = daftar.slice(0, 8).map(function (g) {

            }).join('') + (daftar.length > 8

                : '');

        function jalankanHapusMassal_() {
            const ids = Array.from(rincianTerpilih_);
            if (!ids.length) return;

            const btn = document.getElementById('massal-btn-hapus');
            const htmlAsli = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menghapus ' + ids.length + ' data...</span>';

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    btn.innerHTML = htmlAsli;
                    if (!res.success) {
                        showToast(res.message || 'Gagal menghapus.');
                        // Server sempat membetulkan baris tanpa id - daftarnya
                        // harus dibaca ulang supaya id yang baru ikut terbawa,
                        // kalau tidak percobaan berikutnya gagal dengan cara
                        // yang persis sama.
                        if (res.perluMuatUlang) {
                            tutupHapusMassal_();
                            bersihkanPilihanRincian_();
                            loadRincianGangguan('rincian', true);
                        }
                        return;
                    }

                    tutupHapusMassal_();

                    // ═══ BARIS YANG "TIDAK DITEMUKAN" IKUT DIBUANG ═══
                    // Dulu hanya res.terhapus yang dibuang dari salinan di
                    // browser. Baris yang dilaporkan gagal karena SUDAH tidak
                    // ada di server tetap tertinggal di layar - dan tiap
                    // percobaan menghapusnya gagal lagi, sehingga tampak
                    // seperti baris yang tidak mau hilang. Padahal ia memang
                    // sudah tidak ada; yang tertinggal hanya bayangannya.
                    const hilang = new Set((res.terhapus || []).concat(res.gagal || []));
                    rincianGangguanData = rincianGangguanData.filter(function (g) { return !hilang.has(g.id); });
                    bersihkanPilihanRincian_();
                    segarkanFilterPenyebab_();   // penyebab yang sudah tak dipakai ikut hilang
                    renderRincianGangguanTable();

                    const gagal = (res.gagal || []).length;
                    showToast(res.jumlahTerhapus + ' data gangguan dihapus' +
                        (gagal ? '. ' + gagal + ' baris sudah tidak ada di lembar data & ikut dibersihkan dari layar.' : '.'));

                    // Cache server sudah dibuang; pembacaan ulang memastikan
                    // layar & lembar data benar-benar sama.
                    if (gagal || res.idDiperbaiki) loadRincianGangguan('rincian', true);
                })
                .withFailureHandler(function () {
                    btn.disabled = false;
                    btn.innerHTML = htmlAsli;
                    showToast('Terjadi kesalahan saat menghapus data.');
                })
                .gangguan_deleteBulk(currentSessionToken, ids);
        }

        let barisDitolakTerakhir_ = [];

        /**
         * Batas jumlah baris per pengiriman.
         *
         * Ada dua batas nyata yang harus dihormati:
         *   1. Ukuran data yang boleh dikirim google.script.run - kalau
         *      kelebihan, permintaannya gagal SELURUHNYA tanpa pesan jelas.
         *   2. Waktu eksekusi Apps Script maksimal 6 menit. Menulis ratusan
         *      baris sekaligus bisa melewatinya, dan yang terjadi lebih buruk
         *      daripada gagal: sebagian data sudah masuk, sisanya tidak, dan
         *      tidak ada yang tahu sampai mana.
         *
         * 50 baris per pengiriman dipilih supaya tiap potongan selesai jauh
         * di bawah batas waktu, sekaligus tidak membuat unggahan besar jadi
         * terlalu banyak perjalanan.
         */
        const EXCEL_BATCH_SIZE = 50;

        /** Batas keseluruhan satu berkas - di atas ini disarankan dipecah. */
        const EXCEL_MAKS_BARIS = 1000;

        /**
         * Mengirim data hasil baca Excel secara BERTAHAP, bukan sekaligus.
         * Kemajuannya ditampilkan supaya user tahu prosesnya berjalan, dan
         * bila satu potongan gagal, potongan yang sudah berhasil tetap
         * dilaporkan - tidak hilang tanpa jejak.
         */
        function kirimExcelBertahap_(semua, onSelesai) {
            const total = semua.length;
            // dilewatiServer dihitung terpisah dari `gagal`: baris yang
            // dilewati karena sudah ada BUKAN kegagalan - menyebutnya gagal
            // akan mendorong orang mengunggah ulang berkas yang sebenarnya
            // sudah beres, & memperbanyak duplikat yang hendak dicegah.
            let terkirim = 0, gagal = 0, dilewatiServer = 0;
            const potongan = [];
            for (let i = 0; i < total; i += EXCEL_BATCH_SIZE) {
                potongan.push(semua.slice(i, i + EXCEL_BATCH_SIZE));
            }

            const btn = document.getElementById('btn-submit-excel-import');
            let idx = 0;

            function berikutnya() {
                if (idx >= potongan.length) { onSelesai(terkirim, gagal, dilewatiServer); return; }
                const bagian = potongan[idx];
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Mengimpor ' +
                        Math.min(terkirim + bagian.length, total) + '/' + total + '...</span>';
                }
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res && res.success) {
                            terkirim += (res.inserted || 0);
                            dilewatiServer += (res.dilewati || 0);
                        } else {
                            gagal += bagian.length;
                        }
                        idx++;
                        berikutnya();
                    })
                    .withFailureHandler(function () {
                        // Satu potongan gagal TIDAK membatalkan sisanya - lebih
                        // baik sebagian masuk & dilaporkan apa adanya.
                        gagal += bagian.length;
                        idx++;
                        berikutnya();
                    })
                    .gangguan_addBulk(currentSessionToken, bagian, excelLewatiGanda_);
            }
            berikutnya();
        }

        /** Mengunduh daftar baris yang ditolak sebagai Excel, agar mudah diperbaiki. */
        function unduhLaporanDitolak() {
            if (!barisDitolakTerakhir_.length) { showToast('Tidak ada baris yang ditolak.'); return; }
            try {
                const headers = ['BARIS DI EXCEL', 'JUDUL', 'TANGGAL TERBACA', 'ALASAN DITOLAK'];
                const rows = barisDitolakTerakhir_.map(function (b) {
                    return [b.baris, b.judul, b.tanggal, b.alasan];
                });
                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                ws['!cols'] = [{ wch: 14 }, { wch: 45 }, { wch: 18 }, { wch: 55 }];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Baris Ditolak');
                XLSX.writeFile(wb, 'Baris_Ditolak_' + hariIniIso_() + '.xlsx');
                showToast(barisDitolakTerakhir_.length + ' baris ditolak diunduh - perbaiki lalu unggah ulang.');
            } catch (err) {
                console.log('unduhLaporanDitolak error:', err);
                showToast('Gagal membuat laporan.');
            }
        }

        function dataAktifRincian_() {

        // ================================================================
        // GANGGUAN LINTAS HARI (1 September 2026)
        // ================================================================
        //
        // Sebagian gangguan penanganannya melewati tengah malam, bahkan
        // berhari-hari. Sebelumnya hanya ada satu kolom tanggal, sehingga
        // waktu selesai yang lebih kecil dari waktu mulai terbaca sebagai
        // "mundur" - dan andilnya jadi keliru atau negatif.
        //
        // Sekarang ada Tanggal Selesai yang boleh dikosongkan. Dikosongkan
        // berarti selesai di hari yang sama - jadi pengisian sehari-hari
        // tidak bertambah repot, hanya kasus lintas hari yang perlu diisi.

        /** "YYYY-MM-DD" + "HH:MM" -> objek Date. null bila tidak lengkap. */
        function waktuKeDate_(tanggal, jam) {
            const t = String(tanggal || '').trim();
            const j = String(jam || '').trim();
            if (!/^\d{4}-\d{2}-\d{2}$/.test(t) || !/^\d{1,2}:\d{2}/.test(j)) return null;
            const d = new Date(t + 'T' + (j.length === 4 ? '0' + j : j).slice(0, 5) + ':00');
            return isNaN(d.getTime()) ? null : d;
        }

        /**
         * Menghitung selisih menit antara mulai & selesai, dengan
         * memperhitungkan beda tanggal.
         * @return {number|null} null bila datanya belum lengkap.
         */
        function selisihMenitGangguan_(tglMulai, jamMulai, tglSelesai, jamSelesai) {
            const mulai = waktuKeDate_(tglMulai, jamMulai);
            // Tanggal selesai kosong = hari yang sama.
            const selesai = waktuKeDate_(tglSelesai || tglMulai, jamSelesai);
            if (!mulai || !selesai) return null;
            return Math.round((selesai - mulai) / 60000);
        }

        /**
         * Memperbarui keterangan rentang waktu di form, sekaligus
         * memperingatkan bila waktunya mundur.
         *
         * Peringatan ini penting: tanpanya, salah isi tanggal selesai hanya
         * ketahuan belakangan saat andilnya terlihat aneh di laporan.
         */
        function perbaruiRentangGangguan_() {
            const el = document.getElementById('m-info-rentang');
            if (!el) return;

            const tglMulai = (document.getElementById('m-tanggal') || {}).value || '';
            const jamMulai = (document.getElementById('m-mulai') || {}).value || '';
            const tglSelesai = (document.getElementById('m-tanggal-selesai') || {}).value || '';
            const jamSelesai = (document.getElementById('m-selesai') || {}).value || '';

            if (!tglMulai || !jamMulai || !jamSelesai) { el.classList.add('hidden'); return; }

            const menit = selisihMenitGangguan_(tglMulai, jamMulai, tglSelesai, jamSelesai);
            if (menit === null) { el.classList.add('hidden'); return; }

            el.classList.remove('hidden');
            if (menit < 0) {
                el.className = 'text-[11px] font-bold px-3 py-2 rounded-lg bg-red-50 border border-red-300 text-red-800';
                el.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1.5"></i>' +
                    'Waktu selesai lebih awal dari waktu mulai. Kalau penanganannya melewati tengah malam, ' +
                    'isi <strong>Tanggal Selesai</strong> dengan tanggal berikutnya.';
                return;
            }

            const hari = Math.floor(menit / 1440);
            const jam = Math.floor((menit % 1440) / 60);
            const sisa = menit % 60;
            const lama = (hari ? hari + ' hari ' : '') + (jam ? jam + ' jam ' : '') + sisa + ' menit';
            const lintas = tglSelesai && tglSelesai !== tglMulai;

            el.className = 'text-[11px] font-bold px-3 py-2 rounded-lg ' + (lintas
                ? 'bg-amber-50 border border-amber-300 text-amber-900'
                : 'bg-slate-50 border border-slate-200 text-slate-600');
            el.innerHTML = (lintas ? '<i class="fa-solid fa-calendar-days mr-1.5"></i>Gangguan lintas hari &mdash; ' : '<i class="fa-solid fa-clock mr-1.5"></i>') +
                'Lama penanganan: <strong>' + lama + '</strong> (' + menit + ' menit). ' +
                'Klik ikon kalkulator di kolom Andil untuk memakai angka ini.';
        }

        /** Mengisi kolom Andil dari selisih waktu yang sudah dihitung. */
        function hitungAndilDariRentang_() {
            const menit = selisihMenitGangguan_(
                (document.getElementById('m-tanggal') || {}).value,
                (document.getElementById('m-mulai') || {}).value,
                (document.getElementById('m-tanggal-selesai') || {}).value,
                (document.getElementById('m-selesai') || {}).value);

            if (menit === null) { showToast('Lengkapi dulu tanggal & waktunya.'); return; }
            if (menit < 0) { showToast('Waktu selesai lebih awal dari mulai - periksa Tanggal Selesai.'); return; }

            document.getElementById('m-andil').value = menit;
            showToast('Andil diisi ' + menit + ' menit dari selisih waktu.');
        }

        /**
         * Label waktu untuk tabel & preview. Menandai gangguan lintas hari
         * supaya tidak terbaca seperti salah input.
         */
        function labelWaktuGangguan_(item) {
            const mulai = formatWaktuDisplay(item.waktuMulai);
            const selesai = formatWaktuDisplay(item.waktuSelesai);
            const tglS = String(item.tanggalSelesai || '').trim();
            const tglM = String(item.tanggal || '').trim();
            if (!tglS || tglS === tglM) return '<span class="whitespace-nowrap">' + escapeHtml(mulai) + '-' + escapeHtml(selesai) + '</span>';

            // Ditandai +Nh supaya ringkas di kolom sempit, dengan judul
            // lengkap saat kursor diarahkan ke sana.
            const menit = selisihMenitGangguan_(ubahKeIso_(tglM), item.waktuMulai, ubahKeIso_(tglS), item.waktuSelesai);
            const hari = menit !== null ? Math.floor(menit / 1440) : 1;
            return '<span title="Mulai ' + escapeHtml(formatTanggalDisplay(tglM)) + ' ' + escapeHtml(mulai) +
                ', selesai ' + escapeHtml(formatTanggalDisplay(tglS)) + ' ' + escapeHtml(selesai) + '">' +
                '<span class="whitespace-nowrap">' + escapeHtml(mulai) + '-' + escapeHtml(selesai) + '</span>' +
                '<span class="ml-1 inline-block px-1 rounded bg-amber-100 text-amber-800 text-[9px] font-black">+' +
                (hari > 0 ? hari + 'h' : '1h') + '</span></span>';
        }

        /** "DD-MM-YYYY" -> "YYYY-MM-DD" untuk keperluan hitung. */
        function ubahKeIso_(teks) {
            const m = String(teks || '').trim().match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
            if (!m) return String(teks || '').slice(0, 10);
            return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
        }



        // ================================================================
        // ATURAN BAKU PEMBACAAN TANGGAL (2 September 2026)
        // ================================================================
        //
        // Ditegaskan oleh user: pola "01/03/2026" atau "01-03-2026" SELALU
        // dibaca HARI/BULAN/TAHUN. Tidak ada penebakan, tidak ada aturan
        // "yang paling masuk akal" - 01/03 selalu berarti 1 Maret, tidak
        // pernah 3 Januari.
        //
        // Seluruh bagian aplikasi yang membaca tanggal WAJIB lewat sini,
        // supaya tidak ada satu pun tempat yang menafsirkan berbeda dari
        // tempat lain. Itulah yang dulu membuat tanggal tampak berubah-ubah:
        // penulisannya sudah benar, tapi ada bagian yang membacanya dengan
        // aturan Amerika (bulan dulu).

        /**
         * Membaca teks tanggal jadi bagian-bagiannya, dengan aturan HARI DULU.
         *
         * Yang diterima:
         *   "01-03-2026" / "01/03/2026" / "01.03.2026"  -> 1 Maret 2026
         *   "1-3-2026"                                   -> 1 Maret 2026
         *   "2026-03-01"                                 -> 1 Maret 2026 (ISO)
         *   "01-03-2026 08:30"                           -> jam diabaikan
         *
         * @param {*} teks
         * @return {{hari:number, bulan:number, tahun:number}|null}
         */
        function bacaTanggalDMY_(teks) {
            const s = String(teks === undefined || teks === null ? '' : teks).trim();
            if (!s) return null;

            const bagian = s.split(' ')[0].split(/[-\/.]/);
            if (bagian.length < 3) return null;

            let hari, bulan, tahun;
            if (String(bagian[0]).length === 4) {
                // Bentuk ISO "2026-03-01" - tidak mungkin ambigu karena
                // tahunnya 4 digit di depan.
                tahun = parseInt(bagian[0], 10);
                bulan = parseInt(bagian[1], 10);
                hari = parseInt(bagian[2], 10);
            } else {
                // Bentuk "01-03-2026" - SELALU hari dulu, sesuai ketetapan.
                hari = parseInt(bagian[0], 10);
                bulan = parseInt(bagian[1], 10);
                tahun = parseInt(bagian[2], 10);
                // Tahun dua digit ("01-03-26") dianggap tahun 2000-an.
                if (tahun < 100) tahun += 2000;
            }

            if (!tahun || !bulan || !hari) return null;
            if (bulan < 1 || bulan > 12 || hari < 1 || hari > 31) return null;
            return { hari: hari, bulan: bulan, tahun: tahun };
        }

        /**
         * Membuat objek Date dari teks tanggal, dengan aturan HARI DULU.
         *
         * Sengaja memakai new Date(tahun, bulan-1, hari) - BUKAN
         * new Date(teks). JavaScript membaca "01/03/2026" sebagai 3 JANUARI
         * (aturan Amerika), dan itu sumber kekeliruan yang sulit terlihat
         * karena hanya salah pada tanggal 1-12.
         *
         * @return {Date|null}
         */
        function tanggalDMYKeDate_(teks) {
            const p = bacaTanggalDMY_(teks);
            if (!p) return null;
            const d = new Date(p.tahun, p.bulan - 1, p.hari);
            return isNaN(d.getTime()) ? null : d;
        }

        /** Tahun dari teks tanggal. '' bila tidak terbaca. */
        function tahunDariTanggal_(teks) {
            const p = bacaTanggalDMY_(teks);
            return p ? String(p.tahun) : '';
        }

        /** Nomor bulan (1-12) dari teks tanggal. 0 bila tidak terbaca. */
        function bulanDariTanggal_(teks) {
            const p = bacaTanggalDMY_(teks);
            return p ? p.bulan : 0;
        }

        /**
         * Membuat Date dari nilai <input type="date"> yang selalu "YYYY-MM-DD".
         *
         * Tidak memakai new Date(nilai) karena JavaScript menganggap bentuk
         * itu sebagai waktu UTC - di zona WIB hasilnya bergeser 7 jam, dan di
         * zona negatif malah mundur sehari.
         */
        function inputDateKeDate_(nilai) {
            const m = String(nilai || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return null;
            return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
        }



        // ================================================================
        // FILTER PENYEBAB MENGIKUTI DATA (3 September 2026)
        // ================================================================
        //
        // Sebelumnya isi dropdown Penyebab diambil dari daftar parameter -
        // yang terus bertambah & tidak pernah menyusut. Akibatnya daftarnya
        // memanjang berisi penyebab yang gangguannya sudah dihapus, atau
        // yang sebenarnya milik tahun lain.
        //
        // Sekarang isinya dihitung dari DATA YANG BENAR-BENAR ADA pada tahun
        // yang sedang dipilih. Penyebab yang tidak dipakai lagi hilang dengan
        // sendirinya - tidak perlu dibersihkan manual.
        //
        // Catatan: yang berubah hanya isi FILTER. Daftar parameter untuk
        // form input tetap utuh, karena di sana justru semua pilihan harus
        // tersedia meski belum pernah dipakai.

        function segarkanFilterPenyebab_() {
            const sel = document.getElementById('filter-rincian-pdetail');
            if (!sel) return;

            const tahun = (document.getElementById('filter-rincian-tahun') || {}).value || 'Semua';
            const pilihanSaatIni = sel.value;

            // Dihitung dari data, disaring menurut tahun yang sedang aktif.
            const dipakai = new Set();
            (rincianGangguanData || []).forEach(function (it) {
                if (tahun !== 'Semua' && tahunDariTanggal_(it.tanggal) !== tahun) return;
                const p = String(it.penyebab || '').trim();
                if (p) dipakai.add(p);
            });

            const daftar = Array.from(dipakai).sort(function (a, b) {
                return a.localeCompare(b, 'id-ID', { sensitivity: 'base' });
            });

            sel.innerHTML = '<option value="Semua">Semua Detail</option>' +
                daftar.map(function (v) {
                    return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
                }).join('');

            // Pilihan sebelumnya dipertahankan bila masih ada. Kalau penyebab
            // itu sudah tidak dipakai di tahun ini, filternya dikembalikan ke
            // "Semua" - membiarkannya terpilih hanya akan menghasilkan tabel
            // kosong tanpa alasan yang terlihat.
            sel.value = (pilihanSaatIni && daftar.indexOf(pilihanSaatIni) !== -1) ? pilihanSaatIni : 'Semua';
        }


        // ─── URUTAN TANGGAL (item 10) ────────────────────────────────────
        //
        // Menggantikan tombol "Cek Data". Tiga keadaan bergantian:
        //   Terbaru  -> tanggal terbaru di atas (bawaan)
        //   Terlama  -> tanggal terlama di atas
        //   A-Z      -> menurut judul, untuk mencari kejadian serupa

        let urutanRincian_ = 'terbaru';

        function toggleUrutanTanggal() {
            const urutan = ['terbaru', 'terlama', 'judul'];
            urutanRincian_ = urutan[(urutan.indexOf(urutanRincian_) + 1) % urutan.length];

            const label = document.getElementById('label-urutan');
            const ikon = document.getElementById('ikon-urutan');
            const tampilan = {
                terbaru: { teks: 'Terbaru', ikon: 'fa-arrow-down-wide-short' },
                terlama: { teks: 'Terlama', ikon: 'fa-arrow-up-wide-short' },
                judul: { teks: 'Judul A-Z', ikon: 'fa-arrow-down-a-z' }
            }[urutanRincian_];

            if (label) label.textContent = tampilan.teks;
            if (ikon) ikon.className = 'fa-solid ' + tampilan.ikon;

            rincianCurrentPage_ = 1;
            renderRincianGangguanTable();
        }

        /** Mengurutkan daftar sesuai pilihan tombol urutan. */
        function urutkanRincian_(list) {
            const salinan = list.slice();
            if (urutanRincian_ === 'terlama') {
                return salinan.sort(function (a, b) { return kunciUrutTanggal_(a) - kunciUrutTanggal_(b); });
            }
            if (urutanRincian_ === 'judul') {
                return salinan.sort(function (a, b) {
                    return String(a.judul || '').localeCompare(String(b.judul || ''), 'id-ID', { sensitivity: 'base' });
                });
            }
            return salinan.sort(function (a, b) { return kunciUrutTanggal_(b) - kunciUrutTanggal_(a); });
        }


        // ════════════════════════════════════════════════════════════════
        // PERIKSA & BERSIHKAN DATA GANDA
        // ════════════════════════════════════════════════════════════════
        //
        // Dua langkah yang sengaja dipisah: MEMERIKSA dulu (tidak mengubah
        // apa pun), baru menghapus. gangguan_bersihkanGanda menerima
        // parameter `hapus` yang menentukan keduanya - dipanggil false lebih
        // dulu supaya isi laporannya bisa dibandingkan dengan berkas Excel
        // asli sebelum ada satu baris pun yang hilang.
        //
        // Yang dianggap kembar: tanggal, jam mulai & selesai, judul, nomor
        // KA, tempat, penyebab, unit, area, andil, dan jumlah KA batal -
        // semuanya sama persis. Kolom seperti Kodefikasi tidak ikut
        // dibandingkan, karena bisa saja sudah diperbaiki di salah satu
        // salinan sementara barisnya tetap kembar.

        let gandaHasil_ = null;

        function bukaPeriksaGanda() {
            gambarModalGanda_('<div class="py-10 text-center text-slate-400 font-bold text-xs">' +
                '<i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#0c1d37]"></i>' +
                'Membandingkan seluruh baris gangguan...</div>');

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) {
                        gambarModalGanda_('<div class="p-3.5 rounded-2xl bg-red-50 border border-red-200 text-[11px] font-bold text-red-800">' +
                            escapeHtml((res && res.message) || 'Pemeriksaan gagal.') + '</div>');
                        return;
                    }
                    gandaHasil_ = res;
                    gambarHasilGanda_(res);
                })
                .withFailureHandler(function () {
                    gambarModalGanda_('<div class="p-3.5 rounded-2xl bg-red-50 border border-red-200 text-[11px] font-bold text-red-800">' +
                        'Terjadi kesalahan saat menghubungi server.</div>');
                })
                .gangguan_bersihkanGanda(currentSessionToken, false);
        }

        function gambarHasilGanda_(res) {
            const bolehHapus = (typeof canDo !== 'function') || canDo('gangguan-rincian', 'hapus');

            if (!res.kelompok) {
                gambarModalGanda_(
                    '<div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200">' +
                        '<p class="text-xs font-black text-emerald-800"><i class="fa-solid fa-circle-check mr-1.5"></i>Tidak ada data ganda</p>' +
                        '<p class="text-[11px] font-semibold text-emerald-700 mt-1">Seluruh ' + (res.totalBaris || 0) +
                        ' baris gangguan unik. Tidak ada yang perlu dibersihkan.</p></div>');
                return;
            }

            const ringkas =
                '<div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-300">' +
                    '<p class="text-xs font-black text-amber-900"><i class="fa-solid fa-clone mr-1.5"></i>' +
                    res.kelompok + ' kejadian punya salinan</p>' +
                    '<p class="text-[11px] font-semibold text-amber-800 mt-1 leading-relaxed">' +
                    res.barisGanda + ' baris berlebih dari total ' + res.totalBaris + ' baris. ' +
                    'Membersihkannya menyisakan SATU salinan tiap kejadian - yang tersimpan paling awal, ' +
                    'karena kemungkinan besar itulah unggahan aslinya.</p></div>';

            const contoh = (res.contoh || []).length
                ? '<div><p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Contoh Kejadian Kembar (maks. 10)</p>' +
                    '<div class="border border-slate-200 rounded-xl overflow-hidden">' +
                    '<table class="w-full text-[11px] font-semibold"><thead class="bg-slate-100 text-slate-500 text-[9px] font-extrabold uppercase">' +
                    '<tr><th class="px-3 py-2 text-left">Tanggal</th><th class="px-3 py-2 text-left">Judul</th>' +
                    '<th class="px-3 py-2 text-left">No. KA</th><th class="px-3 py-2 text-center">Salinan</th></tr></thead><tbody>' +
                    res.contoh.map(function (c) {
                        return '<tr class="border-t border-slate-100">' +
                            '<td class="px-3 py-2 font-mono">' + escapeHtml(c.tanggal || '-') + '</td>' +
                            '<td class="px-3 py-2 truncate max-w-[200px]">' + escapeHtml(c.judul || '-') + '</td>' +
                            '<td class="px-3 py-2 font-mono">' + escapeHtml(c.noKa || '-') + '</td>' +
                            '<td class="px-3 py-2 text-center font-black text-amber-700">' + c.salinan + '&times;</td></tr>';
                    }).join('') + '</tbody></table></div></div>'
                : '';

            const catatan =
                '<div class="p-3 bg-blue-50/70 border border-blue-200 rounded-xl text-[11px] text-slate-600 font-semibold leading-relaxed">' +
                    '<i class="fa-solid fa-circle-info text-[#0c1d37] mr-1"></i>' +
                    'Penghapusan ini <strong>langsung permanen</strong> - baris ganda tidak lewat Tempat Sampah. ' +
                    'Buat cadangan lebih dulu lewat User Management &rarr; Backup Data kalau ragu.</div>';

            const tombol = bolehHapus
                ? '<button onclick="jalankanHapusGanda()" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5">' +
                  '<i class="fa-solid fa-broom"></i><span>Bersihkan ' + res.barisGanda + ' Baris</span></button>'
                : '<span class="text-[11px] font-bold text-slate-400">Role Anda tidak berizin menghapus data gangguan.</span>';

            gambarModalGanda_(ringkas + contoh + catatan, tombol);
        }

        function jalankanHapusGanda() {
            const res = gandaHasil_;
            if (!res) return;

            const lanjut = function () {
                gambarModalGanda_('<div class="py-10 text-center text-slate-400 font-bold text-xs">' +
                    '<i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#0c1d37]"></i>Menghapus baris ganda...</div>');
                google.script.run
                    .withSuccessHandler(function (r) {
                        if (!r || !r.success) {
                            showToast('Gagal membersihkan: ' + ((r && r.message) || 'tidak diketahui.'));
                            bukaPeriksaGanda();
                            return;
                        }
                        tutupPeriksaGanda();
                        showToast(r.dihapus + ' baris ganda dihapus dari ' + r.kelompok + ' kejadian.');
                        // Tabel & kartu ringkasan dimuat ulang PAKSA - angkanya
                        // pasti berubah, dan cache server sudah dibuang di sisi
                        // sana oleh gangguanBuangCache_().
                        if (typeof loadRincianGangguan === 'function') loadRincianGangguan('rincian', true);
                    })
                    .withFailureHandler(function () {
                        showToast('Terjadi kesalahan saat membersihkan data ganda.');
                        bukaPeriksaGanda();
                    })
                    .gangguan_bersihkanGanda(currentSessionToken, true);
            };

            if (typeof konfirmasi_ === 'function') {
                konfirmasi_({
                    judul: 'Hapus ' + res.barisGanda + ' baris ganda?',
                    pesan: 'Tiap kejadian disisakan satu salinan. Penghapusan ini permanen & tidak lewat Tempat Sampah.',
                    rincian: res.kelompok + ' kejadian terdampak &middot; ' + res.totalBaris + ' baris jadi ' + (res.totalBaris - res.barisGanda),
                    ya: 'Bersihkan Sekarang', ikonYa: 'fa-broom'
                }).then(function (ya) { if (ya) lanjut(); });
            } else {
                lanjut();
            }
        }

        function gambarModalGanda_(isi, tombolAksi) {
            let modal = document.getElementById('modal-periksa-ganda');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-periksa-ganda';
                modal.className = 'hidden fixed inset-0 z-[96] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                document.body.appendChild(modal);
            }
            modal.innerHTML =
                '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden">' +
                    '<div class="px-6 py-4 bg-[#0c1d37] text-white flex items-center justify-between shrink-0">' +
                        '<div><h3 class="font-extrabold text-sm tracking-tight flex items-center gap-2">' +
                            '<i class="fa-solid fa-clone text-[#d4af37]"></i><span>Periksa Data Ganda</span></h3>' +
                            '<p class="text-[11px] text-slate-400 font-medium mt-0.5">Sisa unggahan Excel yang terulang</p></div>' +
                        '<button onclick="tutupPeriksaGanda()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>' +
                    '</div>' +
                    '<div class="p-6 space-y-4 overflow-y-auto flex-1">' + isi + '</div>' +
                    '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end items-center gap-2 shrink-0">' +
                        (tombolAksi || '') +
                        '<button onclick="tutupPeriksaGanda()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Tutup</button>' +
                    '</div>' +
                '</div>';
            modal.classList.remove('hidden');
        }

        function tutupPeriksaGanda() {
            const modal = document.getElementById('modal-periksa-ganda');
            if (modal) modal.classList.add('hidden');
        }

</script>
