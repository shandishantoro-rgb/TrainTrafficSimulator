        /** Kartu KPI bergaya template - dipakai ketiga export. */
        function kartuKpiKCI_(pptx, s, daftar, y, tinggi) {
            const n = daftar.length;
            const gap = 0.13;
            const lebar = (9.1 - gap * (n - 1)) / n;
            // Kartu pastel dengan angka besar berwarna - kebalikan dari gaya
            // lama (blok pekat + tulisan putih). Warna pastelnya dihitung dari
            // warna pekat yang dikirim pemanggil, jadi tidak ada satu pun
            // pemanggil yang perlu diubah.
            daftar.forEach(function (c, i) {
                const x = 0.45 + i * (lebar + gap);
                const p = pastelDari_('#' + tanpaPagar_(c.color));
                const bg = tanpaPagar_(p.bg), fg = tanpaPagar_(p.fg);

                s.addShape(pptx.ShapeType.roundRect, {
                    x: x, y: y, w: lebar, h: tinggi, fill: { color: bg },
                    rectRadius: 0.05, line: { type: 'none' }
                });
                // Batang warna tipis di tepi kiri kartu.
                s.addShape(pptx.ShapeType.rect, {
                    x: x, y: y + 0.04, w: 0.045, h: tinggi - 0.08,
                    fill: { color: fg }, line: { type: 'none' }
                });

                const nilai = String(c.val);
                s.addText(nilai, {
                    x: x + 0.14, y: y + 0.07, w: lebar - 0.2, h: tinggi * 0.5,
                    align: 'left', valign: 'middle',
                    fontSize: nilai.length > 9 ? 12 : (nilai.length > 6 ? 15 : 21),
                    bold: true, color: fg, fontFace: 'Arial'
                });
                s.addText(String(c.label).toUpperCase(), {
                    x: x + 0.14, y: y + tinggi - 0.36, w: lebar - 0.2, h: 0.3,
                    align: 'left', valign: 'top', fontSize: 6.4, bold: true,
                    color: '6B7A91', fontFace: 'Arial', charSpacing: 0.3
                });
            });
        }

        /** Judul bagian dengan garis warna di kirinya. */
        function judulBagianKCI_(pptx, s, teks, x, y, warna) {
            s.addShape(pptx.ShapeType.rect, { x: x, y: y, w: 0.12, h: 0.19, fill: { color: warna }, line: { type: 'none' } });
            s.addText(teks, { x: x + 0.2, y: y - 0.03, w: 4.2, h: 0.24, fontSize: 9.5, bold: true, color: KCI_PPT.BIRU_TUA, fontFace: 'Arial' });
        }

        /** Gaya sel tabel - SELALU objek baru (PptxGenJS mengubah opsi di tempat). */
        function mkHeadKCI_(extra) {
            return Object.assign({
                bold: true, color: KCI_PPT.PUTIH, fill: { color: KCI_PPT.KEPALA_TABEL },
                fontFace: 'Arial', fontSize: 8, align: 'center', valign: 'middle'
            }, extra || {});
        }
        function mkSelKCI_(alt, extra) {
            const b = { fontFace: 'Arial', fontSize: 7.5, valign: 'middle', color: '1E293B' };
            // Baris selang-seling kini biru sangat muda (bukan abu), seirama
            // dengan tabel pada versi PDF & paparan resmi.
            if (alt) b.fill = { color: KCI_PPT.BARIS_ALT };
            return Object.assign(b, extra || {});
        }

        // ================================================================
        // EXPORT PPT - RINCIAN GANGGUAN (25 Agustus 2026)
        // ================================================================
        //
        // Berbeda dari exportSummaryToPPT() yang cuma satu slide ringkasan:
        // di sini SELURUH data hasil filter ikut tercetak. Susunannya:
        //   Slide 1      : sampul - kop, ringkasan filter yang dipakai, & KPI
        //   Slide 2      : sebaran - tiga tabel (penyebab / unit / wilayah)
        //   Slide 3..n   : tabel rincian, dipecah per SLIDE_ROWS baris
        // Tiap slide punya kop & footer bernomor yang sama, jadi enak
        // langsung dipakai presentasi tanpa dirapikan lagi.

        /** Jumlah baris data per slide tabel. 10 = masih terbaca dari jarak presentasi. */
        const PPT_RINCIAN_ROWS_PER_SLIDE = 10;

        /**
         * Merangkum filter yang sedang aktif jadi teks - dipakai di sampul PPT
         * supaya jelas dokumen ini menampilkan potongan data yang mana.
         * @return {{ringkas:string, daftar:Array}}
         */
        function ringkasFilterRincian_() {
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
            const daftar = [];
            const tglMulai = ambil('filter-rincian-tgl-mulai'), tglAkhir = ambil('filter-rincian-tgl-akhir');
            if (tglMulai || tglAkhir) {
                daftar.push(['Periode', (tglMulai || '...') + ' s/d ' + (tglAkhir || '...')]);
            }
            const pasangan = [
                ['Tahun', 'filter-rincian-tahun'], ['Wilayah', 'filter-rincian-area'],
                ['Penyebab', 'filter-rincian-pdetail'], ['Unit Terkait', 'filter-rincian-unit'],
                ['Kodefikasi', 'filter-rincian-kode'], ['Kategori', 'filter-rincian-kategori'],
                ['KA Batal', 'filter-rincian-batal']
            ];
            pasangan.forEach(function (p) {
                const v = ambil(p[1]);
                if (v && v !== 'Semua') daftar.push([p[0], v]);
            });
            const cari = ambil('search-rincian-input');
            if (cari) daftar.push(['Pencarian', '"' + cari + '"']);

            const ringkas = daftar.length
                ? daftar.map(function (d) { return d[0] + ': ' + d[1]; }).join('    |    ')
                : 'Seluruh data (tanpa filter khusus)';
            return { ringkas: ringkas, daftar: daftar };
        }

        /**
         * Menghitung sebaran jumlah kejadian & andil per satu field.
         * @param {Object[]} list
         * @param {string} field Nama field pengelompok.
         * @param {number} batas Ambil berapa teratas.
         * @return {Array} [{nama, jumlah, andil}]
         */
        function sebaranRincian_(list, field, batas) {
            const peta = {};
            list.forEach(function (it) {
                const kunci = String(it[field] || '(Tidak diisi)').trim() || '(Tidak diisi)';
                if (!peta[kunci]) peta[kunci] = { nama: kunci, jumlah: 0, andil: 0 };
                peta[kunci].jumlah++;
                peta[kunci].andil += Number(it.andil) || 0;
            });
            return Object.keys(peta).map(function (k) { return peta[k]; })
                .sort(function (a, b) { return b.jumlah - a.jumlah; })
                .slice(0, batas || 8);
        }

        /**
         * Memotong teks panjang supaya sel tabel PPT tidak melar tak terkendali.
         *
         * Batas karakternya disetel per kolom mengikuti lebar kolomnya: kalau
         * kepanjangan, sel membungkus jadi 3 baris atau lebih & seluruh tabel
         * memanjang sampai menembus kaki slide. Teks utuhnya tetap tersedia di
         * aplikasi maupun di export Excel - PPT memang untuk dibaca sekilas
         * saat presentasi, bukan menggantikan arsipnya.
         */
        function potongTeksPpt_(teks, maks) {
            const t = String(teks === undefined || teks === null ? '' : teks).trim();
            if (!t) return '-';
            return t.length > maks ? t.slice(0, maks - 1) + '\u2026' : t;
        }

        /**
         * Export SELURUH data yang sedang tampil (hasil filter aktif) menjadi
         * presentasi PowerPoint bertema sama dengan dashboard.
         */
        /**
         * Export SELURUH data yang sedang tampil (hasil filter aktif) menjadi
         * paparan PowerPoint bergaya template resmi KCI, lengkap dengan grafik.
         *
         * Susunan: sampul & KPI -> komposisi (pie unit + doughnut kategori) ->
         * tren bulanan (garis + batang) -> sebaran penyebab & wilayah ->
         * tabel rincian per 10 baris.
         */
        function exportRincianToPPT() {
            if (typeof PptxGenJS === 'undefined') {
                showToast('Modul pembuat PPT gagal dimuat - periksa koneksi internet lalu muat ulang halaman.');
                return;
            }
            const data = dataAktifRincian_();   // ikut pilihan bila mode pilih aktif
            if (!data.length) { showToast('Tidak ada data untuk diexport - longgarkan filternya dulu.'); return; }

            const filter = ringkasFilterRincian_();
            try {
                const pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';
                pptx.author = 'PT Kereta Commuter Indonesia';
                pptx.title = 'Rincian Rekapitulasi Gangguan';
                buatCoverKCI_(pptx, { sub: 'Rincian Gangguan Operasional', keterangan: `${data.length} kejadian · ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}` });

                const ROWS = 10;
                const totalSlideTabel = Math.ceil(data.length / ROWS);
                const totalSlide = 4 + totalSlideTabel;
                let nomor = 0;
                const slide = function (judul, sub) { nomor++; return buatSlideKCI_(pptx, { judul: judul, subJudul: sub, nomor: nomor, total: totalSlide }); };

                const totalAndil = data.reduce(function (t, i) { return t + (Number(i.andil) || 0); }, 0);
                const totalBatal = data.reduce(function (t, i) { return t + (Number(i.kaBatalJumlah) || 0); }, 0);
                const rataAndil = Math.round(totalAndil / data.length);
                const unitTeratas = sebaranRincian_(data, 'unitTerkait', 1)[0];
                const penyebabTeratas = sebaranRincian_(data, 'penyebab', 1)[0];

                // ══ SLIDE 1: RINGKASAN ══
                const s1 = slide('Rincian Rekapitulasi Gangguan', 'Ringkasan & Sebaran Penyebab');
                s1.addShape(pptx.ShapeType.roundRect, { x: 0.45, y: 0.86, w: 9.1, h: 0.44, fill: { color: KCI_PPT.ABU_MUDA }, rectRadius: 0.05, line: { type: 'none' } });
                s1.addText('FILTER AKTIF', { x: 0.6, y: 0.89, w: 1.3, h: 0.18, fontSize: 6.5, bold: true, color: '64748B', fontFace: 'Arial', charSpacing: 1 });
                s1.addText(potongTeksPpt_(filter.ringkas, 150), { x: 0.6, y: 1.04, w: 8.8, h: 0.22, fontSize: 8.5, color: '1E293B', bold: true, fontFace: 'Arial' });

                kartuKpiKCI_(pptx, s1, [
                    { label: 'TOTAL KEJADIAN', val: String(data.length), color: KCI_PPT.TEAL },
                    { label: 'TOTAL KA BATAL', val: String(totalBatal), color: KCI_PPT.MERAH_TUA },
                    { label: 'TOTAL ANDIL (MENIT)', val: String(totalAndil), color: KCI_PPT.GOLD },
                    { label: 'RATA-RATA ANDIL', val: rataAndil + ' mnt', color: KCI_PPT.NAVY },
                    { label: 'UNIT DOMINAN', val: potongTeksPpt_(unitTeratas ? unitTeratas.nama : '-', 16), color: '475569' }
                ], 1.4, 0.92);

                const topPenyebab = sebaranRincian_(data, 'penyebab', 6);
                judulBagianKCI_(pptx, s1, 'PENYEBAB TERBANYAK', 0.45, 2.52, KCI_PPT.MERAH_TUA);
                s1.addChart(pptx.ChartType.bar, [{ name: 'Kejadian', labels: topPenyebab.map(function (r) { return potongTeksPpt_(r.nama, 20); }), values: topPenyebab.map(function (r) { return r.jumlah; }) }], {
                    x: 0.45, y: 2.78, w: 4.4, h: 2.35, barDir: 'bar', chartColors: [KCI_PPT.MERAH_TUA],
                    showValue: true, dataLabelFontSize: 8.5, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 8, valAxisLabelFontSize: 7.5, showLegend: false, valGridLine: { style: 'dash', color: 'E2E8F0' }
                });

                const topUnitAndil = sebaranRincian_(data, 'unitTerkait', 6).slice().sort(function (a, b) { return b.andil - a.andil; });
                judulBagianKCI_(pptx, s1, 'UNIT TERKAIT - TOTAL ANDIL (MENIT)', 5.15, 2.52, KCI_PPT.GOLD);
                s1.addChart(pptx.ChartType.bar, [{ name: 'Andil (menit)', labels: topUnitAndil.map(function (r) { return potongTeksPpt_(r.nama, 20); }), values: topUnitAndil.map(function (r) { return r.andil; }) }], {
                    x: 5.15, y: 2.78, w: 4.4, h: 2.35, barDir: 'bar', chartColors: [KCI_PPT.GOLD],
                    showValue: true, dataLabelFontSize: 8.5, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 8, valAxisLabelFontSize: 7.5, showLegend: false, valGridLine: { style: 'dash', color: 'E2E8F0' }
                });

                // ══ SLIDE 2: KOMPOSISI ══
                const s2 = slide('Komposisi Gangguan', 'Proporsi Unit Terkait & Kategori');
                const semuaUnit = sebaranRincian_(data, 'unitTerkait', 10);
                judulBagianKCI_(pptx, s2, 'PROPORSI PER UNIT TERKAIT', 0.45, 0.92, KCI_PPT.TEAL);
                s2.addChart(pptx.ChartType.pie, [{ name: 'Unit', labels: semuaUnit.map(function (r) { return potongTeksPpt_(r.nama, 16); }), values: semuaUnit.map(function (r) { return r.jumlah; }) }], {
                    x: 0.45, y: 1.2, w: 4.4, h: 3.9, chartColors: KCI_PALET, showPercent: true, showLegend: true,
                    legendPos: 'b', legendFontSize: 8.5, dataLabelFontSize: 9, dataLabelColor: 'FFFFFF', dataLabelFontBold: true
                });
                const semuaKat = sebaranRincian_(data, 'kategori', 8);
                judulBagianKCI_(pptx, s2, 'PROPORSI PER KATEGORI', 5.15, 0.92, KCI_PPT.UNGU);
                s2.addChart(pptx.ChartType.doughnut, [{ name: 'Kategori', labels: semuaKat.map(function (r) { return potongTeksPpt_(r.nama, 16); }), values: semuaKat.map(function (r) { return r.jumlah; }) }], {
                    x: 5.15, y: 1.2, w: 4.4, h: 3.9, chartColors: KCI_PALET, holeSize: 45, showPercent: true, showLegend: true,
                    legendPos: 'b', legendFontSize: 8.5, dataLabelFontSize: 9, dataLabelColor: 'FFFFFF', dataLabelFontBold: true
                });

                // ══ SLIDE 3: TREN BULANAN ══
                const NAMA_BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const kejadianBulan = new Array(12).fill(0), andilBulan = new Array(12).fill(0);
                data.forEach(function (it) {
                    const b = bulanDariTanggal_(it.tanggal);
                    if (b >= 1 && b <= 12) { kejadianBulan[b - 1]++; andilBulan[b - 1] += Number(it.andil) || 0; }
                });
                const s3 = slide('Tren Bulanan', 'Jumlah Kejadian & Total Andil');
                judulBagianKCI_(pptx, s3, 'JUMLAH KEJADIAN PER BULAN', 0.45, 0.92, KCI_PPT.TEAL);
                s3.addChart(pptx.ChartType.line, [{ name: 'Kejadian', labels: NAMA_BULAN, values: kejadianBulan }], {
                    x: 0.45, y: 1.2, w: 9.1, h: 1.8, chartColors: [KCI_PPT.TEAL], lineDataSymbol: 'circle', lineSize: 3,
                    showValue: true, dataLabelFontSize: 8, dataLabelColor: '1E293B', catAxisLabelFontSize: 8.5,
                    valAxisLabelFontSize: 7.5, showLegend: false, valGridLine: { style: 'dash', color: 'E2E8F0' }
                });
                judulBagianKCI_(pptx, s3, 'TOTAL ANDIL PER BULAN (MENIT)', 0.45, 3.18, KCI_PPT.GOLD);
                s3.addChart(pptx.ChartType.bar, [{ name: 'Andil (menit)', labels: NAMA_BULAN, values: andilBulan }], {
                    x: 0.45, y: 3.46, w: 9.1, h: 1.65, chartColors: [KCI_PPT.GOLD],
                    showValue: true, dataLabelFontSize: 8, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 8.5, valAxisLabelFontSize: 7.5, showLegend: false, valGridLine: { style: 'dash', color: 'E2E8F0' }
                });

                // ══ SLIDE 4: SEBARAN WILAYAH & KODEFIKASI ══
                const s4 = slide('Sebaran Gangguan', 'Wilayah & Kodefikasi');
                if (penyebabTeratas) {
                    s4.addShape(pptx.ShapeType.roundRect, { x: 0.45, y: 0.86, w: 9.1, h: 0.46, fill: { color: 'FEF3C7' }, rectRadius: 0.05, line: { color: 'FDE68A', pt: 1 } });
                    s4.addText(`Penyebab dominan: ${penyebabTeratas.nama} - ${penyebabTeratas.jumlah} kejadian, ${penyebabTeratas.andil} menit andil, dari total ${data.length} kejadian.`,
                        { x: 0.62, y: 0.88, w: 8.8, h: 0.42, fontSize: 9, color: '78350F', bold: true, fontFace: 'Arial', valign: 'middle' });
                }
                const topWilayah = sebaranRincian_(data, 'area', 8);
                judulBagianKCI_(pptx, s4, 'PROPORSI PER WILAYAH', 0.45, 1.5, KCI_PPT.NAVY);
                s4.addChart(pptx.ChartType.pie, [{ name: 'Wilayah', labels: topWilayah.map(function (r) { return potongTeksPpt_(r.nama, 18); }), values: topWilayah.map(function (r) { return r.jumlah; }) }], {
                    x: 0.45, y: 1.78, w: 4.4, h: 3.3, chartColors: KCI_PALET, showPercent: true, showLegend: true,
                    legendPos: 'b', legendFontSize: 8, dataLabelFontSize: 8.5, dataLabelColor: 'FFFFFF', dataLabelFontBold: true
                });
                const topKode = sebaranRincian_(data, 'kodeTipe', 6);
                judulBagianKCI_(pptx, s4, 'JUMLAH PER KODEFIKASI', 5.15, 1.5, KCI_PPT.MERAH_TUA);
                s4.addChart(pptx.ChartType.bar, [{ name: 'Kejadian', labels: topKode.map(function (r) { return potongTeksPpt_(r.nama, 14); }), values: topKode.map(function (r) { return r.jumlah; }) }], {
                    x: 5.15, y: 1.78, w: 4.4, h: 3.3, barDir: 'bar', chartColors: [KCI_PPT.MERAH_TUA],
                    showValue: true, dataLabelFontSize: 9, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 8.5, valAxisLabelFontSize: 7.5, showLegend: false, valGridLine: { style: 'dash', color: 'E2E8F0' }
                });

                // ══ SLIDE 5..n: TABEL RINCIAN ══
                const judulKolom = ['NO', 'TANGGAL', 'JUDUL', 'NO KA', 'LOKASI', 'PENYEBAB', 'UNIT', 'ANDIL', 'BATAL'];
                // Total tetap 9.10 inci. Lebar tiap kolom disetel agar JUDUL
                // BARISNYA muat satu baris - kolom yang terlalu sempit membuat
                // "NO" terpecah jadi "N O" & nomor KA terpotong dua baris.
                const lebarKolom = [0.42, 0.90, 1.91, 0.70, 1.50, 1.55, 0.95, 0.55, 0.62];
                for (let p = 0; p < totalSlideTabel; p++) {
                    const mulai = p * ROWS;
                    const potongan = data.slice(mulai, mulai + ROWS);
                    const sT = slide('Rincian Kejadian', `Data ${mulai + 1}-${mulai + potongan.length} dari ${data.length}`);
                    const baris = [judulKolom.map(function (h) {
                        return { text: h, options: mkHeadKCI_({ align: (h === 'JUDUL' || h === 'LOKASI' || h === 'PENYEBAB' || h === 'UNIT') ? 'left' : 'center' }) };
                    })];
                    potongan.forEach(function (it, i) {
                        const alt = i % 2 === 1;
                        baris.push([
                            { text: String(mulai + i + 1), options: mkSelKCI_(alt, { align: 'center', color: '64748B' }) },
                            { text: potongTeksPpt_(formatTanggalDisplay(it.tanggal), 16), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.judul, 42), options: mkSelKCI_(alt, { bold: true }) },
                            { text: potongTeksPpt_(it.noKa, 10), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.tempat, 34), options: mkSelKCI_(alt) },
                            { text: potongTeksPpt_(it.penyebab, 34), options: mkSelKCI_(alt) },
                            { text: potongTeksPpt_(it.unitTerkait, 20), options: mkSelKCI_(alt) },
                            { text: String(Number(it.andil) || 0), options: mkSelKCI_(alt, { align: 'center', bold: true, color: 'B45309' }) },
                            { text: String(Number(it.kaBatalJumlah) || 0), options: mkSelKCI_(alt, { align: 'center', color: (Number(it.kaBatalJumlah) > 0 ? 'B91535' : '94A3B8') }) }
                        ]);
                    });
                    sT.addTable(baris, { x: 0.45, y: 0.86, w: 9.1, colW: lebarKolom, border: { type: 'solid', color: 'E2E8F0', pt: 0.75 }, autoPage: false, rowH: 0.36 });
                }

                buatPenutupKCI_(pptx);
                pptx.writeFile({ fileName: 'Rincian_Gangguan_KCI_' + hariIniIso_() + '.pptx' });
                showToast(`${data.length} baris diexport ke ${totalSlide} slide PowerPoint lengkap dengan grafik!`);
            } catch (err) {
                console.log('exportRincianToPPT error:', err);
                showToast('Gagal membuat file PPT: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
            }
        }

        // ─── MODAL KELOLA PARAMETER (pindahan dari menu Custom Parameter) ──

        function openCustomParameterModal() {
            document.getElementById('modal-custom-parameter').classList.remove('hidden');
            // Dimuat ulang tiap dibuka supaya daftar selalu mencerminkan nilai
            // terbaru - termasuk yang baru terdaftar otomatis dari input data.
            loadGangguanOptions(renderCustomOptionWorkspace);
        }

        function closeCustomParameterModal() {
            document.getElementById('modal-custom-parameter').classList.add('hidden');
        }

        // ================================================================
        // REKAP GANGGUAN SARANA (menggantikan menu Custom Parameter)
        // ================================================================
        //
        // Data barisnya BUKAN salinan: diambil dari sheet RincianGangguan yang
        // sama, disaring yang terkait Sarana di server (gangguanTerkaitSarana_
        // di Module_Gangguan.gs). Yang disimpan khusus di menu ini hanya lima
        // kolom tambahan, di sheet GangguanSarana, dihubungkan lewat
        // gangguanId. Jadi kalau tanggal/judul/andil diperbaiki di Rincian
        // Gangguan, menu ini otomatis ikut benar - tidak ada dua versi data.

        /**
         * Daftar pilihan untuk Jenis Sarana, ID Gangguan, & Stamformasi.
         *
         * Dulu ditulis mati di sini. Sekarang DIMUAT DARI SERVER (sheet
         * GangguanOptions) supaya bisa dikelola sendiri lewat tombol "Kelola
         * Parameter" di menu ini - nilai awalnya tetap sama, diisikan otomatis
         * oleh gangguan_sarana_getOptions() saat daftarnya masih kosong.
         */
        let saranaOptJenis = [];
        let saranaOptIdGangguan = [];
        let saranaOptStamformasi = [];
        let saranaOptKomponen = [];
        /** Pilihan Kodefikasi - sama dengan yang dipakai di Rincian Gangguan. */
        const SARANA_KODE_OPTIONS = ['A', 'B', 'C'];

        let saranaData = [];
        let saranaTampil_ = [];        // hasil filter - dipakai Export
        let saranaCurrentPage_ = 1;
        let saranaPageSize_ = 10;
        let saranaEditingId_ = null;
        let saranaPernahDimuat_ = false;

        /**
         * Memuat data Rekap Gangguan Sarana.
         * @param {boolean} [paksa] true = selalu ambil ulang dari server.
         */
        function loadRekapSarana(paksa) {
            const tbody = document.getElementById('sarana-table-body');
            muatOpsiSarana_(); // daftar pilihan selalu disegarkan, ringan (teks saja)
            if (saranaPernahDimuat_ && saranaData.length && !paksa) {
                renderSaranaTable();
                return;
            }
            if (tbody) tbody.innerHTML = '<tr><td colspan="14" class="text-center py-8 text-slate-400 font-bold"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#d4af37]"></i>Memuat data gangguan sarana...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) {
                        showToast('Gagal memuat data: ' + (res.message || ''));
                        if (tbody) tbody.innerHTML = '';
                        return;
                    }
                    saranaData = res.data;
                    saranaPernahDimuat_ = true;
                    populateSaranaFilters_();
                    renderSaranaTable();
                })
                .withFailureHandler(function () {
                    showToast('Terjadi kesalahan saat memuat data gangguan sarana.');
                    if (tbody) tbody.innerHTML = '';
                })
                .gangguan_sarana_getAll(currentSessionToken);
        }

        /**
         * Memuat daftar pilihan Jenis Sarana / ID Gangguan / Stamformasi /
         * Komponen dari server dalam SATU panggilan, lalu mengisi ulang semua
         * dropdown & saran isian yang memakainya.
         */
        function muatOpsiSarana_(sesudah) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.success) {
                        saranaOptJenis = res.jenisSarana || [];
                        saranaOptIdGangguan = res.idGangguanSarana || [];
                        saranaOptStamformasi = res.stamformasi || [];
                        saranaOptKomponen = res.komponenSarana || [];
                        populateSaranaFilters_();
                        renderSaranaParamWorkspace_();
                    }
                    if (typeof sesudah === 'function') sesudah();
                })
                .withFailureHandler(function () { if (typeof sesudah === 'function') sesudah(); })
                .gangguan_sarana_getOptions(currentSessionToken);
        }

        /**
         * Mengisi dropdown filter dari nilai yang BENAR-BENAR ada di data -
         * bukan daftar tetap, supaya tidak pernah menawarkan pilihan yang
         * hasilnya kosong.
         */
        function populateSaranaFilters_() {
            const tahunSet = {}, komponenSet = {};
            saranaData.forEach(function (it) {
                const th = tahunDariTanggal_(it.tanggal);
                if (th) tahunSet[th] = true;
                if (it.komponen) komponenSet[it.komponen] = true;
            });
            const isi = function (id, nilai, labelSemua) {
                const el = document.getElementById(id);
                if (!el) return;
                const terpilih = el.value;
                el.innerHTML = '<option value="Semua">' + labelSemua + '</option>' +
                    nilai.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
                if (terpilih && nilai.indexOf(terpilih) !== -1) el.value = terpilih;
            };
            // Tahun & Komponen mengikuti data yang benar-benar ada; Jenis Sarana
            // & ID Gangguan memakai daftar tetap supaya pilihannya selalu utuh
            // walau salah satu kode kebetulan belum pernah dipakai.
            isi('filter-sarana-tahun', Object.keys(tahunSet).sort().reverse(), 'Semua Tahun');
            isi('filter-sarana-komponen', Object.keys(komponenSet).sort(), 'Semua Komponen');
            isi('filter-sarana-jenis', saranaOptJenis, 'Semua Jenis');
            isi('filter-sarana-idgangguan', saranaOptIdGangguan, 'Semua ID Gangguan');

            // Dropdown di modal edit.
            const isiSelect = function (id, nilai, labelKosong) {
                const el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = '<option value="">' + labelKosong + '</option>' +
                    nilai.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
            };
            isiSelect('sarana-in-jenis', saranaOptJenis, '- Pilih Jenis Sarana -');
            isiSelect('sarana-in-idgangguan', saranaOptIdGangguan, '- Pilih ID Gangguan -');
            isiSelect('sarana-in-kode', SARANA_KODE_OPTIONS, '- Pilih Kodefikasi -');

            // Komponen & Stamformasi bebas ketik - datalist hanya menawarkan
            // nilai yang sudah terdaftar sebagai saran, nilai baru tetap boleh
            // dan otomatis ikut terdaftar saat disimpan.
            const isiDatalist = function (id, nilai) {
                const el = document.getElementById(id);
                if (el) el.innerHTML = nilai.map(function (v) { return '<option value="' + escapeHtml(v) + '"></option>'; }).join('');
            };
            isiDatalist('datalist-komponen-sarana', saranaOptKomponen.length ? saranaOptKomponen : Object.keys(komponenSet).sort());
            isiDatalist('datalist-stamformasi', saranaOptStamformasi);
        }

        function hitungSaranaTerfilter_() {
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value : 'Semua'; };
            const tahun = ambil('filter-sarana-tahun');
            const jenis = ambil('filter-sarana-jenis');
            const komponen = ambil('filter-sarana-komponen');
            const idGangguan = ambil('filter-sarana-idgangguan');
            const tglMulai = document.getElementById('filter-sarana-tgl-mulai').value;
            const tglAkhir = document.getElementById('filter-sarana-tgl-akhir').value;
            const cari = (document.getElementById('search-sarana-input').value || '').toLowerCase();

            return saranaData.filter(function (it) {
                const itemTahun = tahunDariTanggal_(it.tanggal);
                if (tahun !== 'Semua' && itemTahun !== tahun) return false;
                if (jenis !== 'Semua' && it.jenisSarana !== jenis) return false;
                if (komponen !== 'Semua' && it.komponen !== komponen) return false;
                if (idGangguan !== 'Semua' && it.idGangguan !== idGangguan) return false;

                if (tglMulai || tglAkhir) {
                    const tgl = tanggalDMYKeDate_(it.tanggal);
                    if (!tgl) return false;
                    if (tglMulai) { const m = inputDateKeDate_(tglMulai); if (m && tgl < m) return false; }
                    if (tglAkhir) { const a = inputDateKeDate_(tglAkhir); if (a) { a.setHours(23, 59, 59, 999); if (tgl > a) return false; } }
                }
                if (cari) {
                    const gabungan = [it.judul, it.tempat, it.noKa, it.jenisSarana, it.stamformasi,
                        it.komponen, it.idGangguan, it.ketSarana, it.komentar, it.penyebab].join(' ').toLowerCase();
                    if (gabungan.indexOf(cari) === -1) return false;
                }
                return true;
            })
            // Urutan yang sama dengan Rincian Gangguan: TERBARU DI ATAS.
            // Sebelumnya tabel ini mengikuti urutan datanya di sheet, jadi
            // tanggalnya tampil acak persis seperti masalah di Rincian.
            .sort(function (a, b) { return kunciUrutTanggal_(b) - kunciUrutTanggal_(a); });
        }

        function applySaranaFilters() {
            saranaCurrentPage_ = 1;
            renderSaranaTable();
        }

        let debounceSaranaSearch_ = null;
        function debounceApplySaranaFilters_() {
            clearTimeout(debounceSaranaSearch_);
            debounceSaranaSearch_ = setTimeout(applySaranaFilters, 280);
        }

        function resetSaranaFilters() {
            ['filter-sarana-tahun', 'filter-sarana-jenis', 'filter-sarana-komponen', 'filter-sarana-idgangguan']
                .forEach(function (id) { const el = document.getElementById(id); if (el) el.value = 'Semua'; });
            document.getElementById('filter-sarana-tgl-mulai').value = '';
            document.getElementById('filter-sarana-tgl-akhir').value = '';
            document.getElementById('search-sarana-input').value = '';
            applySaranaFilters();
            showToast('Filter Rekap Gangguan Sarana direset.');
        }

        function renderSaranaTable() {
            const tbody = document.getElementById('sarana-table-body');
            if (!tbody) return;
            const hasil = hitungSaranaTerfilter_();
            saranaTampil_ = hasil;

            // KPI mengikuti hasil filter, bukan seluruh data - supaya angkanya
            // selalu sesuai yang sedang dilihat.
            document.getElementById('sarana-stat-total').innerText = hasil.length;
            document.getElementById('sarana-stat-andil').innerText = hasil.reduce(function (t, i) { return t + (Number(i.andil) || 0); }, 0);
            // KPI ke-3: KA Batal - angka yang sama dengan Rincian Gangguan,
            // karena dampak paling nyata dari gangguan sarana adalah pembatalan
            // perjalanan, bukan sekadar berapa baris yang sudah diisi petugas.
            document.getElementById('sarana-stat-kabatal').innerText =
                hasil.reduce(function (t, i) { return t + (Number(i.kaBatalJumlah) || 0); }, 0);

            // KPI ke-4: ID Gangguan yang paling sering muncul - langsung
            // menunjuk jenis gangguan sarana mana yang perlu diprioritaskan.
            const hitungId = {};
            hasil.forEach(function (i) { if (i.idGangguan) hitungId[i.idGangguan] = (hitungId[i.idGangguan] || 0) + 1; });
            const urutId = Object.keys(hitungId).sort(function (a, b) { return hitungId[b] - hitungId[a]; });
            document.getElementById('sarana-stat-iddominan').innerText = urutId.length ? urutId[0] : '-';
            document.getElementById('sarana-stat-iddominan-sub').innerText =
                urutId.length ? hitungId[urutId[0]] + ' kejadian' : 'Belum ada data';
            const tahunTerpilih = document.getElementById('filter-sarana-tahun').value;
            document.getElementById('sarana-stat-scope').innerText = tahunTerpilih === 'Semua' ? '(Semua Tahun)' : '(Tahun ' + tahunTerpilih + ')';

            // Pareto ikut digambar ulang setiap filter berubah, memakai
            // kumpulan data yang SAMA dengan tabel & KPI - jadi angkanya
            // tidak mungkin berbeda dari yang terlihat di layar.
            renderParetoSarana_(hasil);

            if (!hasil.length) {
                tbody.innerHTML = '<tr><td colspan="14" class="text-center py-10 text-slate-400 font-bold">Tidak ada gangguan sarana yang cocok dengan filter ini.</td></tr>';
                document.getElementById('sarana-pagination').innerHTML = '';
                return;
            }

            const totalHalaman = Math.max(1, Math.ceil(hasil.length / saranaPageSize_));
            saranaCurrentPage_ = Math.min(Math.max(1, saranaCurrentPage_), totalHalaman);
            const mulai = (saranaCurrentPage_ - 1) * saranaPageSize_;
            const potongan = hasil.slice(mulai, mulai + saranaPageSize_);

            const bolehIsi = (typeof canDo === 'function') ? canDo('gangguan-custom', 'tambah') : true;

            tbody.innerHTML = '';
            potongan.forEach(function (it, i) {
                const kosong = '<span class="text-slate-300 font-bold">-</span>';
                const selTambahan = function (nilai) {
                    return nilai ? escapeHtml(nilai) : kosong;
                };
                // Preview selalu ada (hanya melihat), Edit mengikuti izin.
                const tombolPreview = `<button onclick="openSaranaPreviewModal('${it.gangguanId}')" title="Lihat resume gangguan" class="p-1.5 bg-blue-50 text-[#0c1d37] hover:bg-[#0c1d37] hover:text-white rounded-lg transition"><i class="fa-solid fa-eye text-[11px]"></i></button>`;
                const tombol = tombolPreview + (bolehIsi
                    ? `<button onclick="openSaranaEditModal('${it.gangguanId}')" title="Lengkapi / ubah data sarana" class="p-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white rounded-lg transition"><i class="fa-solid fa-pen-to-square text-[11px]"></i></button>`
                    : '');
                const penanda = it.lengkap
                    ? ''
                    : '<span class="ml-1.5 inline-block w-1.5 h-1.5 rounded-full bg-amber-500 align-middle" title="Data sarana belum lengkap"></span>';

                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-blue-50/40 transition ${it.lengkap ? '' : 'bg-amber-50/30'}">
                        <td class="px-2 py-2.5 text-center text-slate-400 font-mono">${mulai + i + 1}</td>
                        <td class="px-2 py-2.5 text-center text-slate-600">${selTanggalRincian_(it.tanggal)}</td>
                        <td class="px-3 py-2.5 text-[#0c1d37] font-extrabold truncate" title="${escapeHtml(it.judul)}">${escapeHtml(it.judul)}${penanda}</td>
                        <td class="px-2 py-2.5 text-center font-mono">${escapeHtml(it.noKa || '-')}</td>
                        <td class="px-3 py-2.5 text-slate-600 truncate" title="${escapeHtml(it.tempat)}">${escapeHtml(it.tempat || '-')}</td>
                        <td class="px-2 py-2.5 text-center bg-slate-50/60 truncate" title="${escapeHtml(it.jenisSarana)}">${selTambahan(it.jenisSarana)}</td>
                        <td class="px-2 py-2.5 text-center bg-slate-50/60 font-mono truncate" title="${escapeHtml(it.stamformasi)}">${selTambahan(it.stamformasi)}</td>

        function openSaranaEditModal(gangguanId) {
            const it = saranaData.find(function (d) { return d.gangguanId === gangguanId; });
            if (!it) { showToast('Baris tidak ditemukan, coba muat ulang.'); return; }
            saranaEditingId_ = gangguanId;

            document.getElementById('sarana-modal-subtitle').innerText = formatTanggalDisplay(it.tanggal) + ' \u00B7 ' + (it.noKa || 'tanpa No KA');
            document.getElementById('sarana-ref-judul').innerText = it.judul || '-';
            document.getElementById('sarana-ref-meta').innerText =
                `${it.tempat || '-'} \u00B7 ${it.area || '-'} \u00B7 Andil ${Number(it.andil) || 0} menit \u00B7 Unit: ${it.unitTerkait || '-'}`;
            document.getElementById('sarana-ref-penyebab').innerText = 'Penyebab: ' + (it.penyebab || '-');

            // Kalau nilai tersimpan tidak ada di daftar tetap (data lama/typo),
            // tambahkan sebagai opsi supaya tidak diam-diam berubah saat disimpan.
            const pasangNilai = function (id, nilai) {
                const el = document.getElementById(id);
                if (!el) return;
                el.value = nilai || '';
                if (nilai && el.value !== nilai) {
                    const opt = document.createElement('option');
                    opt.value = nilai;
                    opt.innerText = nilai + ' (nilai lama)';
                    el.appendChild(opt);
                    el.value = nilai;
                }
            };
            pasangNilai('sarana-in-jenis', it.jenisSarana);
            pasangNilai('sarana-in-idgangguan', it.idGangguan);
            pasangNilai('sarana-in-kode', it.kodeTipe || 'A');
            document.getElementById('sarana-in-stamformasi').value = it.stamformasi || '';
            document.getElementById('sarana-in-komponen').value = it.komponen || '';
            document.getElementById('sarana-in-ket').value = it.ketSarana || '';
            document.getElementById('sarana-in-komentar').value = it.komentar || '';

            // Kodefikasi hanya bisa diubah kalau user berhak mengedit Rincian
            // Gangguan - field itu memang milik menu sana.
            const bolehUbahKode = (typeof canDo === 'function') ? canDo('gangguan-rincian', 'edit') : true;
            const selKode = document.getElementById('sarana-in-kode');
            selKode.disabled = !bolehUbahKode;
            document.getElementById('sarana-kode-note').innerText = bolehUbahKode
                ? 'Tersambung ke Rincian Gangguan - perubahannya tercatat di Riwayat.'
                : 'Anda tidak berizin mengubah Kodefikasi (butuh izin edit Rincian Gangguan).';

            const jejak = document.getElementById('sarana-modal-updated');
            if (it.updatedAt) {
                jejak.innerText = 'Terakhir dilengkapi ' + formatEmpDateAman_(it.updatedAt) + ' oleh ' + (it.updatedByNama || '-');
                jejak.classList.remove('hidden');
            } else {
                jejak.classList.add('hidden');
            }

            const bolehHapus = (typeof canDo === 'function') ? canDo('gangguan-custom', 'hapus') : true;
            document.getElementById('sarana-btn-kosongkan').style.display = (bolehHapus && it.updatedAt) ? '' : 'none';

            document.getElementById('modal-edit-sarana').classList.remove('hidden');
        }

        /**
         * Format tanggal ISO -> teks Indonesia. Dibuat sendiri di sini (bukan
         * memakai formatEmpDate milik modul Sarana & Prasarana) supaya modul
         * Gangguan tidak bergantung pada berkas modul lain.
         */
        function formatEmpDateAman_(iso) {
            const d = new Date(iso);
            if (isNaN(d.getTime())) return String(iso);
            const pad = function (n) { return String(n).padStart(2, '0'); };
            return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // ─── PARETO GANGGUAN SARANA ──────────────────────────────────────
        //
        // Diagram Pareto: batang jumlah kejadian diurutkan dari terbanyak,
        // ditambah garis persentase kumulatif. Gunanya menjawab satu
        // pertanyaan yang tidak terjawab oleh tabel: SEDIKIT kategori mana
        // yang menyumbang SEBAGIAN BESAR gangguan. Garis putus-putus 80%
        // adalah batas lazim - kategori di sebelah kirinya itulah yang
        // paling layak ditangani lebih dulu.
        //
        // Digambar sebagai SVG tanpa pustaka tambahan, jadi tidak menambah
        // beban muat halaman & tidak bisa gagal karena CDN.

        /**
         * Menggambar satu diagram Pareto ke dalam elemen container.
         * @param {string} containerId
         * @param {Object[]} data [{nama, jumlah}] - belum perlu terurut.
         * @param {string} warna Warna batang (hex).
         * @param {string} labelKosong Teks bila tidak ada data.
         */
        function gambarPareto_(containerId, data, warna, labelKosong) {
            const wadah = document.getElementById(containerId);
            if (!wadah) return;

            const item = (data || []).filter(function (d) { return d.jumlah > 0; })
                .sort(function (a, b) { return b.jumlah - a.jumlah; })
                .slice(0, 10);

            if (!item.length) {
                wadah.innerHTML = `<p class="text-center text-xs font-bold text-slate-400 italic py-12">${escapeHtml(labelKosong || 'Belum ada data.')}</p>`;
                return;
            }

            const total = item.reduce(function (t, d) { return t + d.jumlah; }, 0);
            const maks = item[0].jumlah;

            // Ukuran gambar mengikuti jumlah kategori supaya batang tidak
            // gepeng saat kategorinya sedikit maupun berdesakan saat banyak.
            const W = 640, H = 300;
            const padKiri = 42, padKanan = 42, padAtas = 18, padBawah = 74;
            const lebarPlot = W - padKiri - padKanan;
            const tinggiPlot = H - padAtas - padBawah;
            const lebarSlot = lebarPlot / item.length;
            const lebarBatang = Math.min(lebarSlot * 0.62, 54);

            let kumulatif = 0;
            const titik = [];
            const batang = item.map(function (d, i) {
                const tinggi = (d.jumlah / maks) * tinggiPlot;
                const x = padKiri + i * lebarSlot + (lebarSlot - lebarBatang) / 2;
                const y = padAtas + tinggiPlot - tinggi;
                kumulatif += d.jumlah;
                const persenKum = (kumulatif / total) * 100;
                titik.push({
                    x: padKiri + i * lebarSlot + lebarSlot / 2,
                    y: padAtas + tinggiPlot - (persenKum / 100) * tinggiPlot,
                    persen: persenKum
                });
                return `<g>
                    <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${lebarBatang.toFixed(1)}" height="${Math.max(tinggi,1).toFixed(1)}"
                          rx="3" fill="${warna}" opacity="0.9"><title>${escapeHtml(d.nama)}: ${d.jumlah} kejadian (${(d.jumlah/total*100).toFixed(1)}%)</title></rect>
                    <text x="${(x + lebarBatang/2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle"
                          font-size="10" font-weight="800" fill="#0c1d37">${d.jumlah}</text>
                </g>`;
            }).join('');

            const garis = titik.map(function (t, i) { return (i === 0 ? 'M' : 'L') + t.x.toFixed(1) + ' ' + t.y.toFixed(1); }).join(' ');
            const bulatan = titik.map(function (t) {
                return `<circle cx="${t.x.toFixed(1)}" cy="${t.y.toFixed(1)}" r="3.5" fill="#0c1d37" stroke="#fff" stroke-width="1.5">
                    <title>Kumulatif ${t.persen.toFixed(1)}%</title></circle>`;
            }).join('');

            // Label sumbu X dimiringkan supaya nama panjang tetap terbaca.
            const labelX = item.map(function (d, i) {
                const x = padKiri + i * lebarSlot + lebarSlot / 2;
                const teks = String(d.nama).length > 14 ? String(d.nama).slice(0, 13) + '\u2026' : String(d.nama);
                return `<text x="${x.toFixed(1)}" y="${(padAtas + tinggiPlot + 14).toFixed(1)}" text-anchor="end"
                        font-size="9.5" font-weight="700" fill="#475569"
                        transform="rotate(-38 ${x.toFixed(1)} ${(padAtas + tinggiPlot + 14).toFixed(1)})">${escapeHtml(teks)}</text>`;
            }).join('');

            const y80 = padAtas + tinggiPlot - 0.8 * tinggiPlot;
            const sumbuY = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
                const y = padAtas + tinggiPlot - f * tinggiPlot;
                return `<line x1="${padKiri}" y1="${y.toFixed(1)}" x2="${(W-padKanan).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>
                        <text x="${padKiri-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8" font-weight="700">${Math.round(f*maks)}</text>
                        <text x="${W-padKanan+6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#94a3b8" font-weight="700">${Math.round(f*100)}%</text>`;
            }).join('');

            // Berapa kategori yang sudah menutup 80% - inti pesan Pareto.
            let jumlah80 = titik.findIndex(function (t) { return t.persen >= 80; }) + 1;
            if (jumlah80 <= 0) jumlah80 = item.length;

            wadah.innerHTML = `
                <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto">
                    ${sumbuY}
                    <line x1="${padKiri}" y1="${y80.toFixed(1)}" x2="${(W-padKanan).toFixed(1)}" y2="${y80.toFixed(1)}"
                          stroke="#e11d48" stroke-width="1.2" stroke-dasharray="5 4"/>
                    <text x="${(W-padKanan-2).toFixed(1)}" y="${(y80-5).toFixed(1)}" text-anchor="end"
                          font-size="9" font-weight="800" fill="#e11d48">Batas 80%</text>
                    ${batang}
                    <path d="${garis}" fill="none" stroke="#0c1d37" stroke-width="2" stroke-linejoin="round"/>
                    ${bulatan}
                    ${labelX}
                </svg>
                <p class="text-[11px] font-bold text-slate-500 mt-2 text-center">
                    <span class="text-[#0c1d37] font-black">${jumlah80}</span> kategori teratas menyumbang
                    <span class="text-[#0c1d37] font-black">${titik[Math.min(jumlah80,titik.length)-1].persen.toFixed(1)}%</span>
                    dari total ${total} kejadian
                </p>`;
        }

        /** Menggambar kedua Pareto sesuai data yang sedang terfilter. */
        function renderParetoSarana_(hasil) {
            const kumpulkan = function (field) {
                const peta = {};
                hasil.forEach(function (it) {
                    const kunci = String(it[field] || '').trim();
                    if (!kunci) return; // yang belum diisi tidak dihitung - bukan kategori
                    peta[kunci] = (peta[kunci] || 0) + 1;
                });
                return Object.keys(peta).map(function (k) { return { nama: k, jumlah: peta[k] }; });
            };
            gambarPareto_('pareto-jenis-sarana', kumpulkan('jenisSarana'), '#107573',
                'Belum ada data Jenis Sarana yang terisi pada filter ini.');
            gambarPareto_('pareto-komponen', kumpulkan('komponen'), '#d4af37',
                'Belum ada data Komponen yang terisi pada filter ini.');
        }

        // ─── MODAL: Kelola Parameter Rekap Gangguan Sarana ───────────────
        //
        // Tiga daftar yang dikelola di sini (Jenis Sarana, ID Gangguan,
        // Stamformasi) memang perlu dijaga bakunya - beda dengan Penyebab &
        // Unit Terkait yang wajar tumbuh bebas mengikuti kejadian di lapangan.

        const SARANA_PARAM_TIPE = {
            'jenis-sarana': 'jenisSarana',
            'id-gangguan': 'idGangguanSarana',
            'stamformasi': 'stamformasi'
        };

        function openSaranaParamModal() {
            document.getElementById('modal-param-sarana').classList.remove('hidden');
            muatOpsiSarana_(); // selalu ambil terbaru saat dibuka
        }

        function closeSaranaParamModal() {
            document.getElementById('modal-param-sarana').classList.add('hidden');
        }

        /** Menggambar ulang ketiga daftar parameter di modal. */
        function renderSaranaParamWorkspace_() {
            const bolehHapus = (typeof canDo === 'function') ? canDo('gangguan-custom', 'hapus') : true;
            const gambar = function (key, arr) {
                const wadah = document.getElementById('list-' + key);
                const hitung = document.getElementById('count-' + key);
                if (!wadah) return;
                if (hitung) hitung.innerText = arr.length;
                if (!arr.length) {
                    wadah.innerHTML = '<p class="text-[11px] text-slate-400 font-bold italic py-3 text-center">Belum ada isian.</p>';
                    return;
                }
                const bolehEdit = (typeof canDo === 'function') ? canDo('gangguan-custom', 'edit') : true;
                wadah.innerHTML = arr.map(function (v) {
                    const aman = String(v).replace(/'/g, "\\'");
                    // Tombol Edit mengganti NAMA pilihan sekaligus memperbaiki
                    // seluruh data yang memakainya - lihat gangguan_renameOption.
                    const tombolEdit = bolehEdit
                        ? `<button onclick="renameOpsiSarana('${key}','${aman}')" title="Ubah nama (data yang memakainya ikut diperbarui)" class="p-1 text-slate-300 hover:text-[#0c1d37] transition shrink-0"><i class="fa-solid fa-pen text-[10px]"></i></button>`
                        : '';
                    const tombolHapus = bolehHapus
                        ? `<button onclick="hapusOpsiSarana('${key}','${aman}')" title="Hapus" class="p-1 text-slate-300 hover:text-red-600 transition shrink-0"><i class="fa-solid fa-xmark text-xs"></i></button>`
                        : '';
                    return `<div class="flex items-center justify-between gap-1 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg">
                        <span class="text-[11px] font-bold text-slate-700 truncate flex-1" title="${escapeHtml(v)}">${escapeHtml(v)}</span>${tombolEdit}${tombolHapus}
                    </div>`;
                }).join('');
            };
            gambar('jenis-sarana', saranaOptJenis);
            gambar('id-gangguan', saranaOptIdGangguan);
            gambar('stamformasi', saranaOptStamformasi);
        }

        function tambahOpsiSarana(key) {
            const input = document.getElementById('input-add-' + key);
            const nilai = (input.value || '').trim().toUpperCase();
            if (!nilai) { showToast('Isi dulu nilainya.'); return; }
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast(res.message || 'Gagal menambah.'); return; }
                    input.value = '';
                    showToast('Parameter ditambahkan.');
                    muatOpsiSarana_();
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menambah parameter.'); })
                .gangguan_addOption(currentSessionToken, SARANA_PARAM_TIPE[key], nilai);
        }

        /**
         * Mengganti nama satu pilihan parameter. Data yang memakainya ikut
         * diperbarui di server, jadi rekap yang tadinya terpecah karena salah
         * ketik langsung menyatu kembali.
         */
        function renameOpsiSarana(key, nilaiLama) {
            const baru = prompt('Ubah nama parameter ini.\n\nSeluruh data yang memakai "' + nilaiLama +
                '" akan ikut diperbarui otomatis.', nilaiLama);
            if (baru === null) return;
            const nilaiBaru = baru.trim().toUpperCase();
            if (!nilaiBaru || nilaiBaru === nilaiLama.toUpperCase()) return;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast(res.message || 'Gagal mengubah nama.'); return; }
                    showToast(res.dataDiperbarui > 0
                        ? `Diubah jadi "${nilaiBaru}" - ${res.dataDiperbarui} baris data ikut diperbarui.`
                        : `Diubah jadi "${nilaiBaru}".`);
                    muatOpsiSarana_();
                    loadRekapSarana(true); // data di tabel ikut menyesuaikan
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat mengubah nama parameter.'); })
                .gangguan_renameOption(currentSessionToken, SARANA_PARAM_TIPE[key], nilaiLama, nilaiBaru);
        }

        function hapusOpsiSarana(key, nilai) {
            if (!confirm('Hapus "' + nilai + '" dari daftar pilihan?\n\nData yang sudah terlanjur memakai nilai ini TIDAK ikut terhapus - nilainya tetap tampil di tabel dengan penanda "(nilai lama)" saat diedit.')) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast(res.message || 'Gagal menghapus.'); return; }
                    showToast('Parameter dihapus.');
                    muatOpsiSarana_();
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus parameter.'); })
                .gangguan_removeOption(currentSessionToken, SARANA_PARAM_TIPE[key], nilai);
        }

        // ─── MODAL PREVIEW: resume gangguan (hanya baca) ─────────────────
        //
        // Sengaja modal SENDIRI, bukan memakai ulang modal Preview milik
        // Rincian Gangguan. Alasannya: modal itu membaca rincianGangguanData,
        // yang belum tentu sudah dimuat kalau user langsung membuka menu ini
        // tanpa mampir ke Rincian Gangguan dulu. Data untuk modal ini sudah
        // ikut terbawa di saranaData, jadi selalu siap tanpa permintaan
        // tambahan ke server.

        let saranaPreviewingId_ = null;

        function openSaranaPreviewModal(gangguanId) {
            const it = saranaData.find(function (d) { return d.gangguanId === gangguanId; });
            if (!it) { showToast('Data tidak ditemukan, coba muat ulang.'); return; }
            saranaPreviewingId_ = gangguanId;

            const isi = function (id, teks) {
                const el = document.getElementById(id);
                if (el) el.innerText = (teks === undefined || teks === null || teks === '') ? '-' : String(teks);
            };
            isi('sprev-judul', it.judul);
            isi('sprev-tanggal', formatTanggalDisplay(it.tanggal));
            isi('sprev-waktu', formatWaktuDisplay(it.waktuMulai) + ' - ' + formatWaktuDisplay(it.waktuSelesai) + ' WIB');
            isi('sprev-noka', it.noKa);
            isi('sprev-tempat', it.tempat);
            isi('sprev-area', it.area);
            isi('sprev-andil', (Number(it.andil) || 0) + ' menit');
            isi('sprev-uraian', it.uraian);
            isi('sprev-penyebab', it.penyebab);
            isi('sprev-tindaklanjut', it.tindakLanjut);
            isi('sprev-katerganggu', it.kaTerganggu);
            isi('sprev-keterangan', it.keteranganTambahan);

            const jumlahBatal = parseInt(it.kaBatalJumlah) || 0;
            isi('sprev-kabatal', jumlahBatal > 0
                ? jumlahBatal + ' KA batal' + (it.kaBatalNo && it.kaBatalNo !== '-' ? ' (' + it.kaBatalNo + ')' : '')
                : 'Tidak ada KA batal');

            const kategoriDisp = normalizeKategoriDisplay(it.kategori);
            const katBadge = document.getElementById('sprev-kategori-badge');
            katBadge.innerText = kategoriDisp;
            katBadge.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase border ' +
                (kategoriDisp === 'INTERNAL' ? 'bg-[#e2f1ee] text-[#107573] border-[#bcdad6]' : 'bg-orange-100 text-orange-800 border-orange-300');
            document.getElementById('sprev-unit-badge').innerText = it.unitTerkait || '-';
            document.getElementById('sprev-kode-badge').innerText = 'Kode ' + (it.kodeTipe || 'A');

            // Blok data sarana
            isi('sprev-jenis', it.jenisSarana);
            isi('sprev-stamformasi', it.stamformasi);
            isi('sprev-komponen', it.komponen);
            isi('sprev-idgangguan', it.idGangguan);
            isi('sprev-idsarana', it.ketSarana);
            isi('sprev-komentar', it.komentar);

            document.getElementById('sarana-history-box').classList.add('hidden');
            document.getElementById('modal-preview-sarana').classList.remove('hidden');
        }

        function closeSaranaPreviewModal() {
            document.getElementById('modal-preview-sarana').classList.add('hidden');
            saranaPreviewingId_ = null;
        }

        /**
         * Menampilkan riwayat perubahan baris ini - sumbernya sheet
         * GangguanHistory yang SAMA dengan menu Rincian Gangguan, jadi
         * perubahan Kodefikasi dari menu Sarana pun terbaca di sini maupun
         * di sana.
         */
        function tampilkanRiwayatSarana() {
            if (!saranaPreviewingId_) return;
            const box = document.getElementById('sarana-history-box');
            const isi = document.getElementById('sarana-history-list');
            box.classList.remove('hidden');
            isi.innerHTML = '<p class="text-[11px] text-slate-400 font-bold py-2"><i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>Memuat riwayat...</p>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { isi.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-2">Gagal memuat riwayat.</p>'; return; }
                    if (!res.data.length) { isi.innerHTML = '<p class="text-[11px] text-slate-400 font-bold py-2 italic">Belum ada perubahan tercatat untuk data ini.</p>'; return; }
                    isi.innerHTML = res.data.map(function (h) {
                        return `<div class="p-2.5 bg-white border border-slate-200 rounded-xl">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[11px] font-black text-[#0c1d37]">${escapeHtml(h.editedByNama || h.editedByUsername || '-')}</span>
                                <span class="text-[10px] text-slate-400 font-bold">${escapeHtml(formatEmpDateAman_(h.waktu))}</span>
                            </div>
                            <p class="text-[11px] text-slate-600 font-semibold mt-1">${escapeHtml(h.ringkasanPerubahan || '-')}</p>
                        </div>`;
                    }).join('');
                })
                .withFailureHandler(function () { isi.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-2">Terjadi kesalahan saat memuat riwayat.</p>'; })
                .gangguan_getHistory(currentSessionToken, saranaPreviewingId_);
        }

        /** Dari Preview langsung ke form Edit data sarana. */
        function editSaranaDariPreview() {
            const id = saranaPreviewingId_;
            closeSaranaPreviewModal();
            if (id) openSaranaEditModal(id);
        }

        // ─── EXPORT: Rekap Gangguan Sarana ───────────────────────────────

        function toggleSaranaExportDropdown() {
            toggleExportMenu_('sarana-export-menu');
        }

        /**
         * Export Excel: SELURUH kolom Rincian Gangguan + lima kolom tambahan
         * menu ini, jadi satu berkas sudah cukup untuk dilaporkan tanpa perlu
         * digabung manual dengan export dari menu sebelah.
         */
        function exportSaranaToExcel() {
            try {
                const sumber = saranaTampil_.length ? saranaTampil_ : saranaData;
                if (!sumber.length) { showToast('Tidak ada data untuk diexport.'); return; }
                const headers = [
                    // ── kolom asli Rincian Gangguan (urutan sama dgn export di sana) ──
                    'NO', 'TANGGAL', 'WAKTU MULAI', 'WAKTU SELESAI', 'JUDUL', 'NO KA', 'LOKASI',
                    'URAIAN', 'PENYEBAB', 'TINDAK LANJUT', 'JUMLAH KA BATAL', 'NOMOR KA BATAL',
                    'KA TERGANGGU', 'KATEGORI', 'UNIT TERKAIT', 'WILAYAH', 'ANDIL', 'KODEFIKASI',
                    'KETERANGAN TAMBAHAN',
                    // ── kolom tambahan Rekap Gangguan Sarana ──
                    'JENIS SARANA', 'STAMFORMASI', 'KOMPONEN', 'ID GANGGUAN', 'ID SARANA', 'KOMENTAR',
                    'DILENGKAPI OLEH', 'WAKTU DILENGKAPI'
                ];
                const rows = sumber.map(function (it, i) {
                    return [
                        i + 1, formatTanggalDisplay(it.tanggal), formatWaktuDisplay(it.waktuMulai), formatWaktuDisplay(it.waktuSelesai),
                        it.judul, it.noKa, it.tempat, it.uraian, it.penyebab, it.tindakLanjut,
                        Number(it.kaBatalJumlah) || 0, it.kaBatalNo, it.kaTerganggu,
                        normalizeKategoriDisplay(it.kategori), it.unitTerkait, it.area,
                        Number(it.andil) || 0, it.kodeTipe || 'A', it.keteranganTambahan || '',
                        it.jenisSarana, it.stamformasi, it.komponen, it.idGangguan, it.ketSarana,
                        it.komentar || '',
                        it.updatedByNama || '', it.updatedAt ? formatEmpDateAman_(it.updatedAt) : ''
                    ];
                });

                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                const lebar = { 'URAIAN': 55, 'TINDAK LANJUT': 45, 'JUDUL': 34, 'LOKASI': 28, 'ID SARANA': 26, 'KOMENTAR': 45, 'KA TERGANGGU': 26 };
                ws['!cols'] = headers.map(function (h) { return { wch: lebar[h] || 16 }; });
                ws['!freeze'] = { xSplit: 0, ySplit: 1 }; // baris judul tetap terlihat saat digulir

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Rekap Gangguan Sarana');
                XLSX.writeFile(wb, 'Rekap_Gangguan_Sarana_KCI_' + hariIniIso_() + '.xlsx');
                showToast(`${sumber.length} baris (${headers.length} kolom lengkap) berhasil diexport ke Excel!`);
            } catch (err) {
                console.log('exportSaranaToExcel error:', err);
                showToast('Gagal membuat berkas export.');
            }
        }

        /**
         * Export Rekap Gangguan Sarana ke PPT - berisi GRAFIK sungguhan
         * (pie/doughnut/bar/garis), bukan sekadar tabel angka. Grafiknya
         * dibuat lewat PptxGenJS addChart, jadi hasilnya objek chart asli
         * PowerPoint: bisa diklik, diubah warnanya, & datanya tetap bisa
         * dibaca penerima - bukan gambar mati.
         *
         * Susunan: sampul KPI -> komposisi (pie jenis sarana + doughnut ID
         * gangguan) -> dampak (bar komponen + bar andil) -> tren bulanan
         * (garis) -> tabel rincian per 10 baris.
         */
        function exportSaranaToPPT() {
            if (typeof PptxGenJS === 'undefined') {
                showToast('Modul pembuat PPT gagal dimuat - periksa koneksi internet lalu muat ulang halaman.');
                return;
            }
            const data = saranaTampil_.length ? saranaTampil_ : saranaData;
            if (!data.length) { showToast('Tidak ada data untuk diexport.'); return; }

            const NAVY = '0C1D37', GOLD = 'D4AF37', TEAL = '107573', RED = 'B91535', UNGU = '7030A0', SLATE = '475569', WHITE = 'FFFFFF';
            const KCI_PALET = [TEAL, NAVY, GOLD, UNGU, RED, '0E7490', '65A30D', 'C2410C', 'DB2777', '4338CA'];

            try {
                const pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';
                pptx.author = 'PT Kereta Commuter Indonesia';
                pptx.title = 'Rekap Gangguan Sarana';
                buatCoverKCI_(pptx, { judul2: 'GANGGUAN SARANA', sub: 'Rekap Gangguan Sarana', keterangan: `${data.length} kejadian · ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}` });

                const ROWS = 10;
                const totalSlideTabel = Math.ceil(data.length / ROWS);
                const totalSlide = 4 + totalSlideTabel;
                let nomor = 0;

                // Memakai template slide KCI yang SAMA dengan dua export lain,
                // supaya ketiga paparan tampil seragam.
                const slide = function (judul, sub) { nomor++; return buatSlideKCI_(pptx, { judul: judul, subJudul: sub, nomor: nomor, total: totalSlide }); };

                const totalAndil = data.reduce(function (t, i) { return t + (Number(i.andil) || 0); }, 0);
                const totalBatal = data.reduce(function (t, i) { return t + (Number(i.kaBatalJumlah) || 0); }, 0);
                const rataAndil = Math.round(totalAndil / data.length);

                // ══ SLIDE 1: RINGKASAN ══
                const s1 = slide('Rekap Gangguan Sarana', 'Ringkasan, Jenis Sarana & Komponen');
                const kpi = [
                    { label: 'TOTAL GANGGUAN SARANA', val: String(data.length), color: KCI_PPT.TEAL },
                    { label: 'TOTAL ANDIL (MENIT)', val: String(totalAndil), color: KCI_PPT.GOLD },
                    { label: 'RATA-RATA ANDIL', val: rataAndil + ' mnt', color: KCI_PPT.NAVY },
                    { label: 'TOTAL KA BATAL', val: String(totalBatal), color: KCI_PPT.MERAH_TUA }
                ];
                kartuKpiKCI_(pptx, s1, kpi, 0.9, 0.95);

                // Bar mendatar: 5 jenis sarana dengan kejadian terbanyak
                const topJenis = sebaranRincian_(data, 'jenisSarana', 5);
                judulBagianKCI_(pptx, s1, 'JENIS SARANA TERBANYAK', 0.45, 2.05, KCI_PPT.TEAL);
                s1.addChart(pptx.ChartType.bar, [{
                    name: 'Kejadian',
                    labels: topJenis.map(function (r) { return potongTeksPpt_(r.nama, 14); }),
                    values: topJenis.map(function (r) { return r.jumlah; })
                }], {
                    x: 0.45, y: 2.32, w: 4.4, h: 2.55, barDir: 'bar', chartColors: [KCI_PPT.TEAL],
                    showValue: true, dataLabelFontSize: 9, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 9, valAxisLabelFontSize: 8, showLegend: false,
                    valGridLine: { style: 'dash', color: 'E2E8F0' }, catAxisLabelColor: '334155'
                });

                // Bar mendatar: 5 komponen dengan andil terbesar
                const topKomponen = sebaranRincian_(data, 'komponen', 5).slice().sort(function (a, b) { return b.andil - a.andil; });
                judulBagianKCI_(pptx, s1, 'KOMPONEN - TOTAL ANDIL (MENIT)', 5.15, 2.05, KCI_PPT.GOLD);
                s1.addChart(pptx.ChartType.bar, [{
                    name: 'Andil (menit)',
                    labels: topKomponen.map(function (r) { return potongTeksPpt_(r.nama, 14); }),
                    values: topKomponen.map(function (r) { return r.andil; })
                }], {
                    x: 5.15, y: 2.32, w: 4.4, h: 2.55, barDir: 'bar', chartColors: [KCI_PPT.GOLD],
                    showValue: true, dataLabelFontSize: 9, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 9, valAxisLabelFontSize: 8, showLegend: false,
                    valGridLine: { style: 'dash', color: 'E2E8F0' }, catAxisLabelColor: '334155'
                });

                // ══ SLIDE 2: KOMPOSISI (pie + doughnut, ber-persentase) ══
                const s2 = slide('Komposisi Gangguan Sarana', 'Proporsi Jenis Sarana & ID Gangguan');
                const semuaJenis = sebaranRincian_(data, 'jenisSarana', 10);
                judulBagianKCI_(pptx, s2, 'PROPORSI PER JENIS SARANA', 0.45, 0.92, KCI_PPT.TEAL);
                s2.addChart(pptx.ChartType.pie, [{
                    name: 'Jenis Sarana',
                    labels: semuaJenis.map(function (r) { return potongTeksPpt_(r.nama, 16); }),
                    values: semuaJenis.map(function (r) { return r.jumlah; })
                }], {
                    x: 0.45, y: 1.2, w: 4.4, h: 3.9, chartColors: KCI_PALET,
                    showPercent: true, showLegend: true, legendPos: 'b', legendFontSize: 8.5,
                    dataLabelFontSize: 9, dataLabelColor: 'FFFFFF', dataLabelFontBold: true
                });

                const semuaId = sebaranRincian_(data, 'idGangguan', 10);
                judulBagianKCI_(pptx, s2, 'PROPORSI PER ID GANGGUAN', 5.15, 0.92, KCI_PPT.UNGU);
                s2.addChart(pptx.ChartType.doughnut, [{
                    name: 'ID Gangguan',
                    labels: semuaId.map(function (r) { return potongTeksPpt_(r.nama, 16); }),
                    values: semuaId.map(function (r) { return r.jumlah; })
                }], {
                    x: 5.15, y: 1.2, w: 4.4, h: 3.9, chartColors: KCI_PALET, holeSize: 45,
                    showPercent: true, showLegend: true, legendPos: 'b', legendFontSize: 8.5,
                    dataLabelFontSize: 9, dataLabelColor: 'FFFFFF', dataLabelFontBold: true
                });

                // ══ SLIDE 3: TREN BULANAN ══
                const NAMA_BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const kejadianBulan = new Array(12).fill(0);
                const andilBulan = new Array(12).fill(0);
                data.forEach(function (it) {
                    const b = bulanDariTanggal_(it.tanggal);
                    if (b >= 1 && b <= 12) { kejadianBulan[b - 1]++; andilBulan[b - 1] += Number(it.andil) || 0; }
                });
                const s3 = slide('Tren Bulanan', 'Jumlah Kejadian & Total Andil');
                judulBagianKCI_(pptx, s3, 'JUMLAH KEJADIAN PER BULAN', 0.45, 0.92, KCI_PPT.TEAL);
                s3.addChart(pptx.ChartType.line, [{ name: 'Kejadian', labels: NAMA_BULAN, values: kejadianBulan }], {
                    x: 0.45, y: 1.2, w: 9.1, h: 1.8, chartColors: [KCI_PPT.TEAL], lineDataSymbol: 'circle', lineSize: 3,
                    showValue: true, dataLabelFontSize: 8, dataLabelColor: '1E293B',
                    catAxisLabelFontSize: 8.5, valAxisLabelFontSize: 8, showLegend: false,
                    valGridLine: { style: 'dash', color: 'E2E8F0' }
                });
                judulBagianKCI_(pptx, s3, 'TOTAL ANDIL PER BULAN (MENIT)', 0.45, 3.18, KCI_PPT.GOLD);
                s3.addChart(pptx.ChartType.bar, [{ name: 'Andil (menit)', labels: NAMA_BULAN, values: andilBulan }], {
                    x: 0.45, y: 3.46, w: 9.1, h: 1.65, chartColors: [KCI_PPT.GOLD],
                    showValue: true, dataLabelFontSize: 8, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 8.5, valAxisLabelFontSize: 8, showLegend: false,
                    valGridLine: { style: 'dash', color: 'E2E8F0' }
                });

                // ══ SLIDE 4: SEBARAN PENYEBAB & WILAYAH ══
                const s4 = slide('Sebaran Penyebab & Wilayah', 'Analisis Gangguan Sarana');
                const topPenyebab = sebaranRincian_(data, 'penyebab', 6);
                judulBagianKCI_(pptx, s4, 'PENYEBAB TERBANYAK', 0.45, 0.92, KCI_PPT.MERAH_TUA);
                s4.addChart(pptx.ChartType.bar, [{
                    name: 'Kejadian', labels: topPenyebab.map(function (r) { return potongTeksPpt_(r.nama, 20); }),
                    values: topPenyebab.map(function (r) { return r.jumlah; })
                }], {
                    x: 0.45, y: 1.2, w: 4.4, h: 3.9, barDir: 'bar', chartColors: [KCI_PPT.MERAH_TUA],
                    showValue: true, dataLabelFontSize: 9, dataLabelColor: '1E293B', dataLabelPosition: 'outEnd',
                    catAxisLabelFontSize: 8.5, valAxisLabelFontSize: 8, showLegend: false,
                    valGridLine: { style: 'dash', color: 'E2E8F0' }
                });
                const topWilayah = sebaranRincian_(data, 'area', 8);
                judulBagianKCI_(pptx, s4, 'PROPORSI PER WILAYAH', 5.15, 0.92, KCI_PPT.NAVY);
                s4.addChart(pptx.ChartType.pie, [{
                    name: 'Wilayah', labels: topWilayah.map(function (r) { return potongTeksPpt_(r.nama, 18); }),
                    values: topWilayah.map(function (r) { return r.jumlah; })
                }], {
                    x: 5.15, y: 1.2, w: 4.4, h: 3.9, chartColors: KCI_PALET,
                    showPercent: true, showLegend: true, legendPos: 'b', legendFontSize: 8.5,
                    dataLabelFontSize: 9, dataLabelColor: 'FFFFFF', dataLabelFontBold: true
                });

                // ══ SLIDE 5..n: TABEL RINCIAN ══
                const judulKolom = ['NO', 'TANGGAL', 'JUDUL', 'NO KA', 'JENIS', 'STAMFORMASI', 'KOMPONEN', 'ID GANGGUAN', 'ID SARANA', 'KOMENTAR', 'ANDIL'];
                // Total tetap 9.10 inci - alasannya sama seperti di
                // exportRincianToPPT(). Jatah untuk kolom KOMENTAR diambil dari
                // JUDUL & ID SARANA, dua kolom terlebar yang isinya paling bisa
                // dipendekkan tanpa kehilangan arti.
                const lebarKolom = [0.42, 0.80, 1.22, 0.62, 0.86, 0.82, 0.86, 0.82, 0.95, 1.23, 0.50];
                for (let p = 0; p < totalSlideTabel; p++) {
                    const mulai = p * ROWS;
                    const potongan = data.slice(mulai, mulai + ROWS);
                    const s = slide('Rincian Gangguan Sarana', `Data ${mulai + 1}-${mulai + potongan.length} dari ${data.length}`);
                    const baris = [judulKolom.map(function (h) {
                        return { text: h, options: mkHeadKCI_({ align: (h === 'JUDUL' || h === 'ID SARANA' || h === 'KOMENTAR') ? 'left' : 'center' }) };
                    })];
                    potongan.forEach(function (it, i) {
                        const alt = i % 2 === 1;
                        baris.push([
                            { text: String(mulai + i + 1), options: mkSelKCI_(alt, { align: 'center', color: '64748B' }) },
                            { text: potongTeksPpt_(formatTanggalDisplay(it.tanggal), 16), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.judul, 36), options: mkSelKCI_(alt, { bold: true }) },
                            { text: potongTeksPpt_(it.noKa, 10), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.jenisSarana, 20), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.stamformasi, 16), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.komponen, 18), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.idGangguan, 16), options: mkSelKCI_(alt, { align: 'center' }) },
                            { text: potongTeksPpt_(it.ketSarana, 20), options: mkSelKCI_(alt) },
                            { text: potongTeksPpt_(it.komentar, 34), options: mkSelKCI_(alt) },
                            { text: String(Number(it.andil) || 0), options: mkSelKCI_(alt, { align: 'center', bold: true, color: 'B45309' }) }
                        ]);
                    });
                    s.addTable(baris, { x: 0.45, y: 0.86, w: 9.1, colW: lebarKolom, border: { type: 'solid', color: 'E2E8F0', pt: 0.75 }, autoPage: false, rowH: 0.36 });
                }

                buatPenutupKCI_(pptx);
                pptx.writeFile({ fileName: 'Rekap_Gangguan_Sarana_KCI_' + hariIniIso_() + '.pptx' });
                showToast(`${data.length} baris diexport ke ${totalSlide} slide PowerPoint lengkap dengan grafik!`);
            } catch (err) {
                console.log('exportSaranaToPPT error:', err);
                showToast('Gagal membuat file PPT: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
            }
        }

        // ================================================================
        // PILIH BANYAK & HAPUS SEKALIGUS (31 Agustus 2026)
        // ================================================================
        //
        // Menghapus satu per satu berarti satu perjalanan ke server untuk
        // tiap baris - 20 baris = 20 permintaan, dan tiap permintaan Apps
        // Script menanggung ongkos tetap 1-2 detik. Dengan hapus sekaligus,

        /** Id gangguan yang sedang dicentang. Set dipakai agar cek keanggotaan cepat. */
        let rincianTerpilih_ = new Set();

        function togglePilihRincian_(id, dicentang) {
            if (dicentang) rincianTerpilih_.add(id);
            else rincianTerpilih_.delete(id);

            // Baris yang dipilih diberi latar berbeda, tanpa menggambar ulang
            // seluruh tabel - menggambar ulang hanya untuk satu centang akan
            // terasa berat & membuat posisi gulir melompat.
            const baris = document.querySelector('#rincian-table-body tr[data-id="' + id + '"]');
            if (baris) baris.classList.toggle('bg-amber-50/60', dicentang);
            perbaruiBarPilihan_();
            updateRincianSummaryCards(dataAktifRincian_());   // kartu ikut menyesuaikan
        }

        /** Mencentang / melepas seluruh baris di HALAMAN yang sedang tampil. */
        function toggleSemuaRincian_(dicentang) {
            document.querySelectorAll('#rincian-table-body tr[data-id]').forEach(function (tr) {
                const id = tr.getAttribute('data-id');
                const kotak = tr.querySelector('input[type="checkbox"]');
                if (kotak) kotak.checked = dicentang;
                if (dicentang) rincianTerpilih_.add(id); else rincianTerpilih_.delete(id);

            bar.classList.toggle('hidden', jumlah === 0);

                barisHalaman.forEach(function (tr) {
                    if (rincianTerpilih_.has(tr.getAttribute('data-id'))) terpilihDiHalaman++;
                });
                kepala.checked = barisHalaman.length > 0 && terpilihDiHalaman === barisHalaman.length;
                kepala.indeterminate = terpilihDiHalaman > 0 && terpilihDiHalaman < barisHalaman.length;

        function konfirmasiHapusMassal_() {
            if (!rincianTerpilih_.size) return;
            const daftar = rincianGangguanData.filter(function (g) { return rincianTerpilih_.has(g.id); });

            // Baris tanpa id tidak bisa dihapus - dan yang lebih menyesatkan,
            // SEMUA baris tanpa id memakai kunci yang sama (string kosong),
            // sehingga mencentang satu di antaranya seolah mencentang

            const tanpaId = daftar.filter(function (g) { return !String(g.id || '').trim(); }).length;

                showToast(tanpaId + ' baris terpilih belum punya nomor identitas di lembar data. ' +

            document.getElementById('massal-jumlah').textContent = daftar.length;
