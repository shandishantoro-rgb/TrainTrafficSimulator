<!--
  Script_Gangguan.html
  Logic untuk modul Rekapitulasi Gangguan (Summary, Rincian, Custom
  Parameter). Tersambung ke backend nyata (Google Sheets, lewat
  Module_Gangguan.gs).

  SKEMA (mengikuti format Excel produksi asli - Book1.xlsx): id, tanggal,
  waktuMulai, waktuSelesai, judul, noKa, tempat, uraian, penyebab,
  tindakLanjut, kaBatalJumlah, kaBatalNo, kaTerganggu, kategori (HURUF
  KAPITAL), unitTerkait, area, andil, kodeTipe.

  Sinkronisasi Rincian <-> Custom Parameter <-> Summary:
    - "Penyebab" di form Rincian SEKARANG satu dropdown yang datanya
      persis dari Custom Parameter (dulu ada 2 field terpisah: satu bebas
      ketik, satu dropdown - sumber ketidaksinkronan). Sekarang cuma ada
      SATU sumber kebenaran.
    - Statistik "Penyebab Dominan" & grafik batang di Summary sekarang
      membaca item.penyebab (dulu keliru membaca field yang sudah tidak
      ada, penyebabDetail).
    - Grafik tren bulanan di Summary dulu mengelompokkan berdasar
      item.penyebab dicocokkan ke string hardcode ('Sarana'/'Alam') yang
      TIDAK PERNAH benar-benar cocok dengan data asli manapun (bug lama,
      sudah ada sebelum perubahan ini) - sekarang dikelompokkan berdasar
      item.unitTerkait yang make sense secara semantik.
-->
<script>
        // ─── FUNGSI DASAR (cadangan mandiri) ─────────────────────────────
        window.escapeHtml = window.escapeHtml || function (val) {
            if (val === null || val === undefined) return '';
            return String(val)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };
        window.startLoadingWatchdog = window.startLoadingWatchdog || function () { return null; };

        let rincianGangguanData = [];
        let currentlyDisplayedRincian_ = []; // list yang SEDANG tampil di tabel (setelah filter) - dipakai Export supaya hasil export sesuai yang dilihat, bukan selalu seluruh data
        let optionsPenyebabDetail = []; // dipakai sbg daftar "Penyebab" - lihat catatan tipe di Module_Gangguan.gs
        let optionsUnitTerkait = [];
        let optionsArea = []; // dipakai sbg daftar "Wilayah"
        let optionsKategori = [];
        let optionsKode = [];

        let activeInputTab = "excel";
        let lastAddedRincianId = null;
        let previewingRincianId = null;
        let deleteTargetRincianId = null;
        let rincianCurrentPage_ = 1;
        let rincianPageSize_ = 10;

        // ─── LOAD DARI SERVER ─────────────────────────────────────────

        let pendingRincianPenyebabFilter_ = null;
        let pendingRincianUnitFilter_ = null;

        let rincianDataPernahDimuat_ = false;

        /**
         * Memuat data Rincian Gangguan.
         *
         * PENTING utk performa: kalau data SUDAH pernah dimuat sebelumnya
         * di sesi ini dan renderTarget bukan permintaan force-reload, TIDAK
         * ADA panggilan server sama sekali - langsung dirender ulang dari
         * cache client (rincianGangguanData) yang sudah ada. Ini yang
         * bikin pindah-pindah menu Summary<->Rincian jadi instan, bukan
         * nunggu round-trip Apps Script tiap kali (sebelumnya bisa 1-3
         * detik tiap pindah menu walau datanya belum tentu berubah).
         *
         * Ini SEKALIGUS memperbaiki bug filter klik kartu/bar yang kadang
         * tidak ke-apply: dulu, tiap pindah tab memicu fetch ulang ASYNC
         * yang bisa selesai belakangan dan menimpa render yang sudah
         * difilter. Sekarang jalur cache dan jalur fetch-server sama-sama
         * berakhir di tampilkanUlangDariRincianCache_(), jadi hasilnya
         * konsisten dari kedua jalur, tidak ada lagi render "telat" yang
         * menimpa filter yang baru diterapkan.
         *
         * Data SUNGGUHAN cuma diambil ulang dari server saat: pertama kali
         * dibuka di sesi ini, ATAU forceReload=true (dipanggil setelah
         * data BENAR-BENAR berubah - habis tambah/edit/hapus/impor Excel).
         * @param {string} renderTarget 'rincian' | 'summary'
         * @param {boolean} [forceReload]
         */
        function loadRincianGangguan(renderTarget, forceReload) {
            if (!forceReload && rincianDataPernahDimuat_ && rincianGangguanData.length > 0) {
                tampilkanUlangDariRincianCache_(renderTarget);
                return;
            }
            const watchdog = (renderTarget === 'rincian')
                ? startLoadingWatchdog('rincian-table-body', "loadRincianGangguan('rincian', true)")
                : null;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (watchdog) clearTimeout(watchdog);
                    if (res.success) {
                        rincianGangguanData = res.data;
                        rincianDataPernahDimuat_ = true;
                        tampilkanUlangDariRincianCache_(renderTarget);
                    } else {
                        showToast('Gagal memuat data Gangguan: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () {
                    if (watchdog) clearTimeout(watchdog);
                    showToast('Terjadi kesalahan saat memuat data Gangguan.');
                })
                .gangguan_getAll(currentSessionToken);
        }

        /**
         * Fungsi privat: langkah render/terapkan filter setelah data siap -
         * dipakai baik dari jalur cache (instan) maupun setelah fetch
         * server selesai, supaya perilaku KEDUA jalur itu identik persis.
         * @param {string} renderTarget 'rincian' | 'summary'
         */
        function tampilkanUlangDariRincianCache_(renderTarget) {
            populateTahunFilters_();
            populateSummaryUnitFilter_(); // isi pilihan Unit Terkait di Summary dari data nyata
            sembunyikanFilterSummaryKosong_();
            perbaruiBadgeDataBermasalah_();
            if (renderTarget === 'summary') {
                updateSummaryStats();
            } else {
                let adaFilterPending = false;
                if (pendingRincianPenyebabFilter_) {
                    // Datang dari klik "penyebab" di Summary - terapkan
                    // filternya begitu data Rincian selesai dimuat.
                    const sel = document.getElementById('filter-rincian-pdetail');
                    if (sel) sel.value = pendingRincianPenyebabFilter_;
                    pendingRincianPenyebabFilter_ = null;
                    adaFilterPending = true;
                }
                if (pendingRincianUnitFilter_) {
                    // Datang dari klik kartu Unit Tertinggi di Summary.
                    const selUnit = document.getElementById('filter-rincian-unit');
                    if (selUnit) selUnit.value = pendingRincianUnitFilter_;
                    pendingRincianUnitFilter_ = null;
                    adaFilterPending = true;
                }
                segarkanFilterPenyebab_();   // isi filter mengikuti data
                if (adaFilterPending) applyRincianFilters();
                else renderRincianGangguanTable();
            }
        }

        let tahunFilterInitialized_ = false;

        /**
         * Mengisi dropdown filter Tahun (Rincian & Summary) berdasar tahun
         * yang benar-benar ada di data + tahun berjalan (selalu ada walau
         * belum ada data tahun ini). Default terpilih = tahun berjalan,
         * tapi kalau pengguna sudah pernah memilih tahun lain, pilihan itu
         * dipertahankan selama masih ada di daftar (tidak direset tiap kali
         * data dimuat ulang).
         */
        function populateTahunFilters_() {
            const currentYear = new Date().getFullYear();
            const yearsSet = new Set();
            rincianGangguanData.forEach(item => {
                const p = bacaTanggalDMY_(item.tanggal);
                if (p) yearsSet.add(p.tahun);
            });
            yearsSet.add(currentYear);
            const years = Array.from(yearsSet).sort((a, b) => b - a);

            ['filter-rincian-tahun', 'filter-summary-tahun'].forEach(id => {
                const sel = document.getElementById(id);
                if (!sel) return;
                const prevValue = sel.value;
                sel.innerHTML = '';
                const optSemua = document.createElement('option');
                optSemua.value = 'Semua';
                optSemua.innerText = 'Semua Tahun';
                sel.appendChild(optSemua);
                years.forEach(y => {
                    const opt = document.createElement('option');
                    opt.value = String(y);
                    opt.innerText = String(y);
                    sel.appendChild(opt);
                });
                if (id === 'filter-summary-tahun') {
                    // Summary SELALU tahun berjalan - kartu ringkasannya
                    // dimaksudkan sbg gambaran KONDISI SAAT INI, beda dgn
                    // Rincian yang memang dipakai utk telusur histori lintas
                    // tahun sehingga wajar mempertahankan pilihan terakhir.
                    sel.value = String(currentYear);
                } else if (tahunFilterInitialized_ && prevValue && Array.from(sel.options).some(o => o.value === prevValue)) {
                    sel.value = prevValue;
                } else {
                    sel.value = String(currentYear);
                }
            });
            tahunFilterInitialized_ = true;
        }

        function loadGangguanOptions(afterLoad) {
            let remaining = 5;
            function checkDone() {
                remaining--;
                if (remaining === 0) {
                    populateAllDropdowns();
                    populateTahunFilters_();
                    if (afterLoad) afterLoad();
                }
            }
            google.script.run
                .withSuccessHandler(function (res) { if (res.success) optionsPenyebabDetail = res.data; checkDone(); })
                .withFailureHandler(checkDone)
                .gangguan_getOptions(currentSessionToken, 'penyebabDetail');
            google.script.run
                .withSuccessHandler(function (res) { if (res.success) optionsUnitTerkait = res.data; checkDone(); })
                .withFailureHandler(checkDone)
                .gangguan_getOptions(currentSessionToken, 'unitTerkait');
            google.script.run
                .withSuccessHandler(function (res) { if (res.success) optionsArea = res.data; checkDone(); })
                .withFailureHandler(checkDone)
                .gangguan_getOptions(currentSessionToken, 'area');
            google.script.run
                .withSuccessHandler(function (res) { if (res.success) optionsKategori = res.data; checkDone(); })
                .withFailureHandler(checkDone)
                .gangguan_getOptions(currentSessionToken, 'kategori');
            google.script.run
                .withSuccessHandler(function (res) { if (res.success) optionsKode = res.data; checkDone(); })
                .withFailureHandler(checkDone)
                .gangguan_getOptions(currentSessionToken, 'kode');
        }

        // ─── SUMMARY ────────────────────────────────────────────────────

        function updateSummaryStats() {
            const filter = document.getElementById('summary-category-filter')?.value || 'GANGGUAN_KESELURUHAN';
            const tahun = document.getElementById('filter-summary-tahun')?.value || 'Semua';
            const wilayah = document.getElementById('filter-summary-wilayah')?.value || 'Semua';
            const unitFilter = document.getElementById('filter-summary-unit')?.value || 'Semua';
            let data = rincianGangguanData;
            if (tahun !== 'Semua') {
                data = data.filter(i => tahunDariTanggal_(i.tanggal) === tahun);
            }
            if (wilayah !== 'Semua') {
                data = data.filter(i => (i.area || '').toLowerCase() === wilayah.toLowerCase());
            }
            // Filter Unit Terkait - diterapkan di SATU tempat ini saja, sebelum
            // semua hitungan di bawah. Jadi kartu, tren, panel penyebab, pie,
            // maupun Export PPT otomatis memakai kumpulan data yang sama persis;
            // tidak mungkin ada bagian yang tertinggal & jadi tidak sinkron.
            if (unitFilter !== 'Semua') {
                data = data.filter(i => (i.unitTerkait || '') === unitFilter);
            }
            if (filter === 'GANGGUAN_INTERNAL') data = data.filter(i => (i.kategori || '').toUpperCase() === 'INTERNAL');
            else if (filter === 'GANGGUAN_EKSTERNAL') data = data.filter(i => (i.kategori || '').toUpperCase() === 'EKSTERNAL');

            document.getElementById('stat-total').innerText = data.length;
            const totalLabel = document.getElementById('stat-total-label');
            // Label cakupan tahun - elemen TERPISAH dari stat-total-label supaya
            // tidak ikut tertimpa saat totalLabel.innerText diganti di bawah.
            // Ini pasangan dari label serupa di kartu Total Kejadian Rincian -
            // begitu keduanya beda tahun, langsung kelihatan kenapa angkanya beda.
            const summaryScopeEl = document.getElementById('summary-stat-scope');
            if (summaryScopeEl) summaryScopeEl.innerText = (tahun === 'Semua') ? '(Semua Tahun)' : `(Tahun ${tahun})`;
            const brSubtitle = document.getElementById('breakdown-chart-subtitle');
            if (totalLabel) {
                if (filter === 'GANGGUAN_KESELURUHAN') { totalLabel.innerText = "TOTAL GANGGUAN"; if (brSubtitle) brSubtitle
                        .innerText = "Top 5 penyebab (Keseluruhan) - berdasarkan jumlah kejadian"; } else if (filter === 'GANGGUAN_INTERNAL') { totalLabel
                        .innerText = "TOTAL INTERNAL"; if (brSubtitle) brSubtitle.innerText = "Top 5 penyebab (Internal) - berdasarkan jumlah kejadian"; } else {
                        totalLabel.innerText = "TOTAL EKSTERNAL"; if (brSubtitle) brSubtitle.innerText =
                            "Top 5 penyebab (Eksternal) - berdasarkan jumlah kejadian"; }
            }

            // Penyebab (dipakai utk kartu "Penyebab Dominan" + panel breakdown di bawah -
            // SATU sumber: item.penyebab, sama dgn yang dikelola di Custom Parameter)
            let penyebabCounts = {};
            data.forEach(item => { let p = item.penyebab || 'Lainnya';
                penyebabCounts[p] = (penyebabCounts[p] || 0) + 1; });
            let sorted = Object.entries(penyebabCounts).sort((a, b) => b[1] - a[1]);

            // Unit Terkait Tertinggi #1-#3 (dipakai 3 kartu tengah) - dipisah dari
            // kartu "Penyebab Dominan" paling kanan supaya tidak duplikat info:
            // kartu tengah menyoroti UNIT mana yang paling sering terlibat,
            // kartu kanan menyoroti PENYEBAB spesifik yang paling dominan.
            let unitCountsForCards = {};
            data.forEach(item => { const u = item.unitTerkait || 'Lainnya';
                unitCountsForCards[u] = (unitCountsForCards[u] || 0) + 1; });
            let sortedUnits = Object.entries(unitCountsForCards).sort((a, b) => b[1] - a[1]);
            document.getElementById('stat-top1-val').innerText = sortedUnits[0] ? sortedUnits[0][1] : 0;
            const elTop1Lbl = document.getElementById('stat-top1-lbl');
            elTop1Lbl.innerText = sortedUnits[0] ? sortedUnits[0][0].toUpperCase() : "-";
            elTop1Lbl.dataset.rawValue = sortedUnits[0] ? sortedUnits[0][0] : '';
            document.getElementById('stat-top2-val').innerText = sortedUnits[1] ? sortedUnits[1][1] : 0;
            const elTop2Lbl = document.getElementById('stat-top2-lbl');
            elTop2Lbl.innerText = sortedUnits[1] ? sortedUnits[1][0].toUpperCase() : "-";
            elTop2Lbl.dataset.rawValue = sortedUnits[1] ? sortedUnits[1][0] : '';
            document.getElementById('stat-top3-val').innerText = sortedUnits[2] ? sortedUnits[2][1] : 0;
            const elTop3Lbl = document.getElementById('stat-top3-lbl');
            elTop3Lbl.innerText = sortedUnits[2] ? sortedUnits[2][0].toUpperCase() : "-";
            elTop3Lbl.dataset.rawValue = sortedUnits[2] ? sortedUnits[2][0] : '';

            // Kartu ke-4: gabungan SISA unit di luar Top 3 (supaya total ke-4
            // kartu unit selalu pas dengan Total Gangguan, tanpa ada yg "hilang").
            const top3UnitSum = (sortedUnits[0] ? sortedUnits[0][1] : 0) + (sortedUnits[1] ? sortedUnits[1][1] : 0) + (sortedUnits[2] ? sortedUnits[2][1] : 0);
            const lainnyaVal = data.length - top3UnitSum;
            const lainnyaCount = Math.max(0, sortedUnits.length - 3);
            document.getElementById('stat-lainnya-val').innerText = lainnyaVal;
            document.getElementById('stat-lainnya-lbl').innerText = lainnyaCount > 0 ? `${lainnyaCount} UNIT LAIN` : "-";

            // Penyebab dominan - dari penyebabCounts yang SAMA (dulu keliru pakai field lain)
            let dominan = sorted[0] ? sorted[0][0] : '-';
            document.getElementById('stat-dominan').innerText = dominan;

            // Grafik tren bulanan - SELALU mengikuti 2 Unit Terkait dengan
            // jumlah kejadian TERBANYAK pada data yang sedang difilter
            // (sortedUnits, sumber yang SAMA dengan kartu Unit Tertinggi di
            // atas) + 1 bucket "Lainnya" gabungan sisanya. Dulu grafik ini
            // mengelompokkan lewat pencocokan kata kunci hardcode
            // ('sarana'/'sintel'/dst) yang bisa saja tidak pernah cocok
            // dengan nilai Unit Terkait yang sungguhan ada - sekarang tidak
            // mungkin menyimpang karena sumbernya persis data asli.
            const trendUnitA = sortedUnits[0] ? sortedUnits[0][0] : null;
            const trendUnitB = sortedUnits[1] ? sortedUnits[1][0] : null;
            const legA = document.getElementById('trend-legend-a');
            const legB = document.getElementById('trend-legend-b');
            if (legA) legA.innerText = trendUnitA || 'Tidak ada data';
            if (legB) legB.innerText = trendUnitB || 'Tidak ada data';

            let trendMap = {};
            const NAMA_BULAN_TREND = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            NAMA_BULAN_TREND.forEach(m => { trendMap[m] = { a: 0, b: 0, c: 0 }; });
            let areaMap = {};
            data.forEach(item => {
                const areaName = item.area || 'Unknown';
                areaMap[areaName] = (areaMap[areaName] || 0) + 1;
                const pTgl = bacaTanggalDMY_(item.tanggal);
                if (pTgl) {
                    const mNum = pTgl.bulan;
                    const mName = NAMA_BULAN_TREND[mNum - 1];
                    if (mName) {
                        const unit = item.unitTerkait || 'Lainnya';
                        if (trendUnitA && unit === trendUnitA) trendMap[mName].a++;
                        else if (trendUnitB && unit === trendUnitB) trendMap[mName].b++;
                        else trendMap[mName].c++;
                    }
                }
            });

            const chartContainer = document.getElementById('trend-chart-container');
            if (chartContainer) {
                chartContainer.innerHTML = '';
                // Skala tinggi bar berdasar nilai TERTINGGI yang benar-benar
                // muncul di satu bulan (bukan total keseluruhan data) supaya
                // bar tetap terbaca proporsional walau datanya sedikit ATAU
                // sangat banyak.
                let puncak = 1;
                NAMA_BULAN_TREND.forEach(m => { const d = trendMap[m]; puncak = Math.max(puncak, d.a, d.b, d.c); });
                NAMA_BULAN_TREND.forEach((m, mIdx) => {
                    const d = trendMap[m];
                    const hS = Math.max(2, Math.round((d.a / puncak) * 100));
                    const hO = Math.max(2, Math.round((d.b / puncak) * 100));
                    const hK = Math.max(2, Math.round((d.c / puncak) * 100));
                    const isLastBulan = mIdx === NAMA_BULAN_TREND.length - 1;
                    chartContainer.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col items-center space-y-1.5 flex-1 animate-fade-in ${isLastBulan ? '' : 'border-r border-slate-100'}">
                            <div class="flex items-end justify-center gap-1 h-64 w-full">
                                <div class="relative flex flex-col items-center justify-end h-full" style="width: 28%">
                                    <span class="text-[10px] font-black text-slate-700 mb-1">${d.a || ''}</span>
                                    <div class="bg-[#107573] w-full rounded-t transition-all duration-500" style="height: ${hS}%"></div>
                                </div>
                                <div class="relative flex flex-col items-center justify-end h-full" style="width: 28%">
                                    <span class="text-[10px] font-black text-slate-700 mb-1">${d.b || ''}</span>
                                    <div class="bg-[#7030a0] w-full rounded-t transition-all duration-500" style="height: ${hO}%"></div>
                                </div>
                                <div class="relative flex flex-col items-center justify-end h-full" style="width: 28%">
                                    <span class="text-[10px] font-black text-slate-700 mb-1">${d.c || ''}</span>
                                    <div class="bg-[#9bbb59] w-full rounded-t transition-all duration-500" style="height: ${hK}%"></div>
                                </div>
                            </div>
                            <span class="text-[11px] font-black text-slate-500 mt-1">${m}</span>
                        </div>
                    `);
                });
            }

            const banner = document.getElementById('area-summary-banner');
            if (banner) {
                let parts = [];
                for (let a in areaMap) parts.push(`${a.toUpperCase()}: ${areaMap[a]}`);
                banner.innerText = "Per Wilayah: " + (parts.length > 0 ? parts.join(" | ") : "Tidak Ada Data");
            }

            // Panel 1: Top 5 penyebab berdasar JUMLAH KEJADIAN. PERBAIKAN BUG:
            // sebelumnya memetakan dari optionsPenyebabDetail (daftar Custom
            // Parameter) - kalau ada nilai "penyebab" di data yang belum PERSIS
            // terdaftar di situ (beda spasi/huruf/dsb), datanya tidak pernah
            // muncul di panel ini walau datanya nyata ada (padahal Panel 2/Andil
            // di bawah sudah benar, karena baca langsung dari data). Sekarang
            // KEDUANYA baca langsung dari penyebabCounts/penyebabAndil (data
            // asli), bukan dari daftar Custom Parameter - konsisten & benar.
            const barsContainer = document.getElementById('sarana-bars-container');
            if (barsContainer) {
                barsContainer.innerHTML = '';
                let detailList = Object.entries(penyebabCounts)
                    .map(([name, value]) => ({ name, value }))
                    .filter(i => i.value > 0)
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5);
                if (detailList.length === 0) {
                    barsContainer.innerHTML = '<p class="text-center text-xs font-bold text-slate-400 italic py-6">Tidak ada data pada filter ini.</p>';
                } else {
                    let highest = Math.max(...detailList.map(i => i.value), 1);
                    detailList.forEach(item => {
                        const pct = Math.max(4, (item.value / highest) * 100);
                        const namaAman = item.name.replace(/'/g, "\\'");
                        barsContainer.insertAdjacentHTML('beforeend', `
                            <div onclick="goToRincianByPenyebab('${namaAman}')" title="Klik untuk lihat Rincian Gangguan penyebab ini" class="flex items-center text-xs font-extrabold text-slate-700 animate-fade-in cursor-pointer group">
                                <span class="w-32 text-right pr-3 truncate group-hover:text-[#e11d48] transition" title="${item.name}">${item.name}</span>
                                <div class="flex-1 bg-slate-100 h-7 rounded-full overflow-hidden flex items-center group-hover:ring-2 group-hover:ring-[#e11d48]/40 transition">
                                    <div class="bg-[#e11d48] h-full rounded-full transition-all duration-700 flex items-center justify-end pr-2" style="width: ${pct}%">
                                        <span class="text-[10px] font-black text-white">${item.value}</span>
                                    </div>
                                </div>
                            </div>
                        `);
                    });
                }
            }

            // Panel 2: Top 5 penyebab berdasar TOTAL ANDIL (menit keterlambatan) -
            // sudut pandang berbeda dari sekadar jumlah kejadian: penyebab yang
            // jarang terjadi tapi dampaknya besar akan terlihat di sini.
            let penyebabAndil = {};
            data.forEach(item => { const p = item.penyebab || 'Lainnya';
                penyebabAndil[p] = (penyebabAndil[p] || 0) + (parseInt(item.andil) || 0); });
            const andilContainer = document.getElementById('andil-bars-container');
            if (andilContainer) {
                andilContainer.innerHTML = '';
                let andilList = Object.entries(penyebabAndil)
                    .map(([name, value]) => ({ name, value }))
                    .filter(i => i.value > 0)
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5);
                if (andilList.length === 0) {
                    andilContainer.innerHTML = '<p class="text-center text-xs font-bold text-slate-400 italic py-6">Tidak ada data pada filter ini.</p>';
                } else {
                    let highestAndil = Math.max(...andilList.map(i => i.value), 1);
                    andilList.forEach(item => {
                        const pct = Math.max(4, (item.value / highestAndil) * 100);
                        const namaAman = item.name.replace(/'/g, "\\'");
                        andilContainer.insertAdjacentHTML('beforeend', `
                            <div onclick="goToRincianByPenyebab('${namaAman}')" title="Klik untuk lihat Rincian Gangguan penyebab ini" class="flex items-center text-xs font-extrabold text-slate-700 animate-fade-in cursor-pointer group">
                                <span class="w-32 text-right pr-3 truncate group-hover:text-[#b8952b] transition" title="${item.name}">${item.name}</span>
                                <div class="flex-1 bg-slate-100 h-7 rounded-full overflow-hidden flex items-center group-hover:ring-2 group-hover:ring-[#d4af37]/50 transition">
                                    <div class="bg-gradient-to-r from-[#b8952b] to-[#d4af37] h-full rounded-full transition-all duration-700 flex items-center justify-end pr-2" style="width: ${pct}%">
                                        <span class="text-[10px] font-black text-white">${item.value} mnt</span>
                                    </div>
                                </div>
                            </div>
                        `);
                    });
                }
            }

            // ── PIE PERSENTASE (adaptif mengikuti tema filter) ──────────
            // Kalau Unit Terkait masih "Semua", yang paling berguna dilihat
            // adalah UNIT mana yang menyumbang porsi terbesar. Begitu satu unit
            // dipilih, pertanyaannya berubah: di dalam unit itu, PENYEBAB apa
            // yang mendominasi. Jadi sumbu pie-nya ikut berpindah sendiri -
            // bukan dua grafik terpisah yang salah satunya selalu mubazir.
            const pieByPenyebab = (unitFilter !== 'Semua');
            const pieSumber = pieByPenyebab ? penyebabCounts : unitCountsForCards;
            const pieJudul = pieByPenyebab
                ? 'Proporsi Penyebab di Unit ' + unitFilter
                : 'Proporsi Kejadian per Unit Terkait';
            const pieSub = pieByPenyebab
                ? 'Persentase jumlah kejadian per penyebab - hanya unit ' + unitFilter
                : 'Persentase jumlah kejadian per unit terkait';
            renderSummaryPie_(pieSumber, pieJudul, pieSub, data.length, pieByPenyebab ? 'penyebab' : 'unit');

            // Simpan ringkasan hasil hitungan saat ini (mengikuti filter aktif)
            // supaya Export PPT bisa memakai data yang SAMA PERSIS dengan yang
            // sedang tampil di layar, tanpa perlu menghitung ulang.
            lastSummaryContext_ = {
                filterLabel: filter === 'GANGGUAN_KESELURUHAN' ? 'Keseluruhan' : (filter === 'GANGGUAN_INTERNAL' ? 'Internal' : 'Eksternal'),
                tahunLabel: tahun === 'Semua' ? 'Semua Tahun' : tahun,
                wilayahLabel: wilayah === 'Semua' ? 'Semua Wilayah' : wilayah,
                unitLabel: unitFilter === 'Semua' ? 'Semua Unit' : unitFilter,
                total: data.length,
                top1: sortedUnits[0] ? { label: sortedUnits[0][0], val: sortedUnits[0][1] } : null,
                top2: sortedUnits[1] ? { label: sortedUnits[1][0], val: sortedUnits[1][1] } : null,
                top3: sortedUnits[2] ? { label: sortedUnits[2][0], val: sortedUnits[2][1] } : null,
                lainnya: { val: lainnyaVal, count: lainnyaCount },
                dominan: dominan,
                areaMap: areaMap,
                // Dibaca langsung dari data (bukan dari daftar Custom Parameter) -
                // Penyebab sudah tidak dikelola manual lagi, jadi satu-satunya
                // sumber yang benar adalah nilai yang nyata ada di data.
                breakdownJumlah: Object.entries(penyebabCounts).map(([name, value]) => ({ name, value })).filter(i => i.value > 0).sort((a, b) => b.value - a.value).slice(0, 5),
                breakdownAndil: Object.entries(penyebabAndil).map(([name, value]) => ({ name, value })).filter(i => i.value > 0).sort((a, b) => b.value - a.value).slice(0, 5),
                // Ikut disimpan supaya Export PPT memakai kumpulan data & sumbu
                // pie yang PERSIS SAMA dengan yang sedang tampil di layar -
                // tidak dihitung ulang, jadi tidak mungkin berbeda.
                dataTersaring: data,
                pieJudul: pieJudul,
                pieItems: Object.keys(pieSumber).map(function (k) { return { nama: k, nilai: pieSumber[k] }; })
                    .filter(function (i) { return i.nilai > 0; })
                    .sort(function (a, b) { return b.nilai - a.nilai; }).slice(0, 10)
            };
        }

        let lastSummaryContext_ = null;

        /** Palet pie Summary - dipakai berulang (cycle) kalau kategorinya banyak. */
        const SUMMARY_PIE_PALETTE = ['#107573', '#0c1d37', '#d4af37', '#7030a0', '#e11d48',
            '#0e7490', '#65a30d', '#c2410c', '#db2777', '#4338ca'];

        /**
         * Menggambar donut chart persentase langsung sebagai SVG - tanpa
         * pustaka grafik tambahan, jadi tidak menambah beban muat halaman &
         * tidak bisa gagal karena CDN.
         *
         * Cara kerjanya: satu lingkaran per irisan, semuanya bertumpuk di
         * posisi sama, dibedakan lewat stroke-dasharray (panjang garis =
         * porsinya) & stroke-dashoffset (titik mulai). Cara ini membuat total
         * irisan SELALU pas 100% - tidak mungkin ada celah atau tumpang tindih
         * akibat pembulatan, yang jadi masalah klasik kalau sudut dihitung
         * manual.
         *
         * @param {Object} peta        {nama: jumlah}
         * @param {string} judul       Judul panel
         * @param {string} subJudul    Keterangan di bawah judul
         * @param {number} totalData   Total kejadian (untuk teks di tengah donut)
         * @param {string} jenis       'unit' | 'penyebab' - menentukan aksi klik legenda
         */
        function renderSummaryPie_(peta, judul, subJudul, totalData, jenis) {
            const wadah = document.getElementById('summary-pie-container');
            const elJudul = document.getElementById('summary-pie-title');
            const elSub = document.getElementById('summary-pie-subtitle');
            if (!wadah) return;
            if (elJudul) elJudul.innerText = judul;
            if (elSub) elSub.innerText = subJudul;

            const semua = Object.keys(peta)
                .map(function (k) { return { nama: k, nilai: peta[k] }; })
                .filter(function (i) { return i.nilai > 0; })
                .sort(function (a, b) { return b.nilai - a.nilai; });

            if (!semua.length) {
                wadah.innerHTML = '<p class="text-center text-xs font-bold text-slate-400 italic py-10">Tidak ada data pada filter ini.</p>';
                return;
            }

            // Maksimal 8 irisan + satu gabungan "Lainnya", supaya tetap terbaca.
            // Yang digabung tetap dihitung penuh, jadi totalnya selalu utuh 100%.
            const BATAS = 8;
            let irisan = semua.slice(0, BATAS);
            if (semua.length > BATAS) {
                const sisa = semua.slice(BATAS).reduce(function (t, i) { return t + i.nilai; }, 0);
                irisan = irisan.concat([{ nama: (semua.length - BATAS) + ' lainnya', nilai: sisa, gabungan: true }]);
            }
            const total = irisan.reduce(function (t, i) { return t + i.nilai; }, 0) || 1;

            const R = 70, KELILING = 2 * Math.PI * R;
            let offset = 0;
            const potongan = irisan.map(function (it, i) {
                const porsi = it.nilai / total;
                const panjang = porsi * KELILING;
                const warna = SUMMARY_PIE_PALETTE[i % SUMMARY_PIE_PALETTE.length];
                const svg = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${warna}" stroke-width="34"
                    stroke-dasharray="${panjang.toFixed(3)} ${(KELILING - panjang).toFixed(3)}"
                    stroke-dashoffset="${(-offset).toFixed(3)}"
                    transform="rotate(-90 100 100)"><title>${escapeHtml(it.nama)}: ${it.nilai} (${(porsi*100).toFixed(1)}%)</title></circle>`;
                offset += panjang;
                return { svg: svg, warna: warna, porsi: porsi, item: it };
            });

            const legenda = potongan.map(function (p) {
                const persen = (p.porsi * 100).toFixed(1);
                // Irisan gabungan tidak bisa diklik - tidak mewakili satu nilai filter.
                const bisaKlik = !p.item.gabungan;
                const namaAman = String(p.item.nama).replace(/'/g, "\\'");
                const aksi = bisaKlik
                    ? (jenis === 'unit' ? `onclick="goToRincianByUnit('${namaAman}')"` : `onclick="goToRincianByPenyebab('${namaAman}')"`)
                    : '';
                return `<div ${aksi} title="${bisaKlik ? 'Klik untuk lihat rincian' : 'Gabungan kategori kecil'}"
                        class="flex items-center justify-between gap-2 py-1 px-1.5 rounded-lg ${bisaKlik ? 'cursor-pointer hover:bg-slate-50' : ''} transition">
                        <span class="flex items-center gap-2 min-w-0">
                            <span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${p.warna}"></span>
                            <span class="text-[11px] font-bold text-slate-600 truncate" title="${escapeHtml(p.item.nama)}">${escapeHtml(p.item.nama)}</span>
                        </span>
                        <span class="text-[11px] font-black text-[#0c1d37] shrink-0">${persen}% <span class="text-slate-400 font-bold">(${p.item.nilai})</span></span>
                    </div>`;
            }).join('');

            wadah.innerHTML = `
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <div class="relative shrink-0">
                        <svg viewBox="0 0 200 200" class="w-44 h-44">
                            <circle cx="100" cy="100" r="${R}" fill="none" stroke="#f1f5f9" stroke-width="34"></circle>
                            ${potongan.map(function (p) { return p.svg; }).join('')}
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span class="text-2xl font-black text-[#0c1d37] leading-none">${totalData}</span>
                            <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider mt-0.5">Kejadian</span>
                        </div>
                    </div>
                    <div class="flex-1 w-full space-y-0.5 max-h-48 overflow-y-auto custom-scrollbar pr-1">${legenda}</div>
                </div>`;
        }

        /**
         * Menyembunyikan dropdown filter di Summary yang tidak punya pilihan
         * apa pun selain "Semua" - memilihnya tidak akan mengubah hasil, jadi
         * kehadirannya cuma membingungkan. Begitu datanya bertambah & pilihan
         * muncul, dropdown-nya tampil sendiri lagi.
         */
        function sembunyikanFilterSummaryKosong_() {
            ['filter-summary-wilayah', 'filter-summary-unit', 'filter-summary-tahun'].forEach(function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                const pembungkus = el.closest('div');
                if (!pembungkus) return;
                pembungkus.classList.toggle('hidden', el.options.length <= 1);
            });
        }

        /**
         * Mengisi dropdown filter Unit Terkait di Summary dari data yang
         * benar-benar ada - bukan dari daftar Custom Parameter, supaya tidak
         * pernah menawarkan unit yang hasilnya kosong.
         */
        function populateSummaryUnitFilter_() {
            const el = document.getElementById('filter-summary-unit');
            if (!el) return;
            const terpilih = el.value;
            const daftar = {};
            rincianGangguanData.forEach(function (i) { if (i.unitTerkait) daftar[i.unitTerkait] = true; });
            const nilai = Object.keys(daftar).sort();
            el.innerHTML = '<option value="Semua">SEMUA UNIT TERKAIT</option>' +
                nilai.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
            if (terpilih && nilai.indexOf(terpilih) !== -1) el.value = terpilih;
        }


        /**
        /**
         * Menerapkan filter ke Rincian Gangguan dari LUAR pane-nya (klik
         * kartu/bar di Summary). Cakupan Tahun/Wilayah/Kategori ikut
         * disamakan dgn yang SEDANG AKTIF di Summary, supaya Total Kejadian
         * di Rincian pasti match dgn angka yang terlihat di kartu yang
         * diklik - baru filter spesifik (Unit Terkait / Penyebab) ditambah
         * di atasnya sesuai kartu/bar yang diklik.
         *
         * PENTING: kalau rincianGangguanData SUDAH ada di client (sudah
         * pernah dimuat sebelumnya di sesi ini), filter diterapkan
         * LANGSUNG saat itu juga - TIDAK menunggu switchTab() memicu load
         * ulang, karena switchTab() cuma memuat ulang di kunjungan PERTAMA
         * ke pane tsb. Filter diterapkan DUA KALI (langsung + sekali lagi
         * setelah jeda singkat) sbg pengaman - kalau switchTab() (fungsi di
         * luar modul Gangguan, isinya tidak terlihat dari sini) ternyata
         * melakukan sesuatu yang tertunda/async yang bisa menimpa dropdown
         * SETELAH baris ini jalan, penerapan kedua yang memastikan hasil
         * akhirnya tetap benar. Fallback ke pending filter (dikonsumsi
         * loadRincianGangguan()) hanya dipakai kalau data memang belum
         * pernah dimuat sama sekali.
         * @param {{unit?:string, penyebab?:string}} f
         */
        let timerInsuranceFilterRincian_ = null;

        function aplikasikanFilterRincianDariLuar_(f) {
            const terapkan = function () {
                const tahunSummary = document.getElementById('filter-summary-tahun')?.value || 'Semua';
                const wilayahSummary = document.getElementById('filter-summary-wilayah')?.value || 'Semua';
                const kategoriSummary = document.getElementById('summary-category-filter')?.value || 'GANGGUAN_KESELURUHAN';

                const selTahun = document.getElementById('filter-rincian-tahun');
                if (selTahun) selTahun.value = tahunSummary;
                const selArea = document.getElementById('filter-rincian-area');
                if (selArea) selArea.value = wilayahSummary;
                const selKategori = document.getElementById('filter-rincian-kategori');
                if (selKategori) {
                    selKategori.value = (kategoriSummary === 'GANGGUAN_INTERNAL') ? 'INTERNAL'
                        : (kategoriSummary === 'GANGGUAN_EKSTERNAL') ? 'EKSTERNAL' : 'Semua';
                }
                // PENTING: bersihkan DULU filter Unit/Penyebab dari klik
                // SEBELUMNYA, baru isi yang relevan dgn klik SAAT INI. Tanpa
                // ini, klik kotak Unit lalu klik kotak Penyebab hasilnya
                // gabungan keduanya (bukan murni kriteria klik terbaru) -
                // root cause laporan "klik kotak lain tidak langsung
                // menyesuaikan".
                const selUnit = document.getElementById('filter-rincian-unit');
                if (selUnit) selUnit.value = f.unit || 'Semua';
                const selPenyebab = document.getElementById('filter-rincian-pdetail');
                if (selPenyebab) selPenyebab.value = f.penyebab || 'Semua';

                rincianCurrentPage_ = 1;
                applyRincianFilters();
            };

            if (rincianGangguanData && rincianGangguanData.length > 0) {
                terapkan();
                // Lapisan pengaman: ulangi lagi setelah jeda singkat, supaya
                // menang atas proses lain (di luar visibilitas modul ini)
                // yang mungkin menimpa dropdown filter setelah baris di
                // atas. Timer SEBELUMNYA (dari klik kotak lain yang mungkin
                // masih pending) dibatalkan dulu, supaya klik cepat
                // berturut-turut ke kotak berbeda tidak saling menimpa -
                // yang menang selalu klik yang PALING TERAKHIR.
                clearTimeout(timerInsuranceFilterRincian_);
                timerInsuranceFilterRincian_ = setTimeout(terapkan, 120);
                const label = f.unit ? ('Unit Terkait: ' + f.unit) : (f.penyebab ? ('penyebab: ' + f.penyebab) : 'cakupan yang sama seperti Summary');
                showToast('Menampilkan Rincian Gangguan untuk ' + label);
            } else {
                pendingRincianUnitFilter_ = f.unit || null;
                pendingRincianPenyebabFilter_ = f.penyebab || null;
            }
        }

        function goToRincianByPenyebab(namaPenyebab) {
            switchTab('gangguan-rincian');
            aplikasikanFilterRincianDariLuar_({ penyebab: namaPenyebab });
        }

        /** Klik kartu Unit Tertinggi #1/#2/#3 -> Rincian Gangguan terfilter Unit Terkait itu. */
        function goToRincianByUnit(namaUnit) {
            switchTab('gangguan-rincian');
            aplikasikanFilterRincianDariLuar_({ unit: namaUnit });
        }

        /**
         * Klik kartu Unit Tertinggi #1/#2/#3 - PENTING: baca dataset.rawValue
         * (nilai ASLI sesuai data, mis. "Sarana"), BUKAN innerText (yang
         * sengaja di-uppercase jadi "SARANA" cuma untuk tampilan kartu).
         * Dropdown filter Unit Terkait berisi opsi dengan casing ASLI dari
         * data, jadi kalau yang dikirim versi uppercase, tidak akan pernah
         * cocok dan filter gagal diterapkan diam-diam (root cause laporan
         * "kotak sudah bisa diklik tapi hasil di Rincian tidak sesuai").
         * @param {string} elId ID elemen label kartu (mis. "stat-top1-lbl").
         */
        function goToRincianByCardUnit_(elId) {
            const el = document.getElementById(elId);
            const rawValue = el ? el.dataset.rawValue : '';
            if (!el || !rawValue) { showToast('Belum ada data untuk kartu ini.'); return; }
            goToRincianByUnit(rawValue);
        }

        /** Klik kartu Penyebab Dominan - sama seperti di atas, baca nilai yang sedang tampil. */
        function goToRincianByCardDominan_() {
            const el = document.getElementById('stat-dominan');
            if (!el || !el.innerText || el.innerText === '-') { showToast('Belum ada data untuk kartu ini.'); return; }
            goToRincianByPenyebab(el.innerText);
        }

        /** Klik kartu Total Gangguan - ke Rincian dgn cakupan Tahun/Wilayah/Kategori yang sama, tanpa filter Unit/Penyebab tambahan. */
        function goToRincianTotal_() {
            switchTab('gangguan-rincian');
            aplikasikanFilterRincianDariLuar_({});
        }

        // ─── RINCIAN: DATA BERMASALAH (kelengkapan klasifikasi) ──────────

        /**
         * Cek apakah satu baris data "bermasalah" - salah satu field
         * klasifikasi (Kategori/Unit Terkait/Wilayah/Kodefikasi) kosong
         * atau nilainya di luar yang dikenal sistem. Dipakai utk badge
         * notifikasi & fitur "Cek Data" supaya baris begini gampang
         * ditelusuri & diperbaiki, bukan diam-diam nyempil di data.
         * @param {Object} item
         * @return {boolean}
         */
        function itemBermasalah_(item) {
            const kategoriOk = ['INTERNAL', 'EKSTERNAL'].includes(String(item.kategori || '').toUpperCase());
            const unitOk = !!(item.unitTerkait && String(item.unitTerkait).trim());
            const wilayahOk = !!(item.area && String(item.area).trim());
            const kodeOk = ['A', 'B', 'C'].includes(String(item.kodeTipe || '').toUpperCase());
            return !kategoriOk || !unitOk || !wilayahOk || !kodeOk;
        }

        /** Perbarui badge angka merah di tombol "Cek Data" - dipanggil tiap kali rincianGangguanData baru dimuat. */
        function perbaruiBadgeDataBermasalah_() {
            const badge = document.getElementById('badge-data-bermasalah');
            const btn = document.getElementById('btn-cek-data-bermasalah');
            if (!badge || !btn) return;
            const jumlah = rincianGangguanData.filter(itemBermasalah_).length;
            if (jumlah > 0) {
                badge.innerText = jumlah > 99 ? '99+' : String(jumlah);
                badge.classList.remove('hidden');
                btn.title = jumlah + ' baris data kemungkinan bermasalah (Kategori/Unit Terkait/Wilayah/Kodefikasi kosong atau tidak dikenal) - klik untuk lihat & telusuri.';
            } else {
                badge.classList.add('hidden');
                btn.title = 'Semua data lengkap - tidak ada yang perlu dicek.';
            }
        }

        /** Klik tombol "Cek Data" - tampilkan HANYA baris yang bermasalah, lepas dari filter dropdown biasa. */
        function tampilkanDataBermasalah_() {
            const hasil = rincianGangguanData.filter(itemBermasalah_);
            if (hasil.length === 0) { showToast('Tidak ada data bermasalah - semua data sudah lengkap klasifikasinya.'); return; }

            // Kosongkan tampilan filter dropdown biasa ke "Semua" supaya tidak
            // membingungkan (baris yg tampil di sini kriterianya "bermasalah",
            // bukan hasil kombinasi filter dropdown) - TANPA memanggil
            // applyRincianFilters(), karena daftarnya sudah final di atas.
            ['filter-rincian-pdetail', 'filter-rincian-unit', 'filter-rincian-area', 'filter-rincian-kode', 'filter-rincian-kategori', 'filter-rincian-tahun'].forEach(id => {
                const el = document.getElementById(id); if (el) el.value = 'Semua';
            });
            document.getElementById('filter-rincian-tgl-mulai').value = '';
            document.getElementById('filter-rincian-tgl-akhir').value = '';
            document.getElementById('filter-rincian-batal').value = 'Semua';
            document.getElementById('filter-rincian-andil').value = 'Default';
            document.getElementById('search-rincian-input').value = '';

            rincianCurrentPage_ = 1;
            renderRincianGangguanTable(hasil);
            showToast(`Menampilkan ${hasil.length} baris data yang perlu dicek (Kategori/Unit Terkait/Wilayah/atau Kodefikasi kosong/tidak dikenal).`);
        }

        /**
         * Export Summary Gangguan ke file .pptx SUNGGUHAN lewat PptxGenJS
         * (sebelumnya cuma trik file HTML berlabel ".ppt" yang TIDAK
         * benar-benar bisa dibuka PowerPoint). Datanya persis mengikuti
         * apa yang sedang tampil di layar (lastSummaryContext_, diisi di
         * akhir updateSummaryStats()).
         */
        /**
         * Export Summary Gangguan ke SATU slide .pptx yang ringkas & elegan
         * (kop instansi, kartu statistik, 2 tabel breakdown berdampingan) -
         * lewat PptxGenJS. Datanya persis mengikuti apa yang sedang tampil
         * di layar (lastSummaryContext_, diisi di akhir updateSummaryStats()).
         */
        /**
         * Export halaman Summary Gangguan jadi paparan PowerPoint bergaya
         * template resmi KCI - kini berisi grafik, bukan hanya tabel angka.
         *
         * Datanya diambil dari lastSummaryContext_ (hasil hitungan yang SEDANG
         * tampil di layar) supaya angkanya persis sama, lalu dilengkapi
         * hitungan tren bulanan dari data yang sama.
         */
        function exportSummaryToPPT() {
            if (!lastSummaryContext_) { showToast('Data belum siap, coba beberapa saat lagi.'); return; }
            if (typeof PptxGenJS === 'undefined') {
                showToast('Modul pembuat PPT gagal dimuat - periksa koneksi internet lalu muat ulang halaman.');
                return;
            }
            const ctx = lastSummaryContext_;
            const data = ctx.dataTersaring || [];

            try {
                const pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';
                pptx.author = 'PT Kereta Commuter Indonesia';
                pptx.title = 'Summary Rekapitulasi Gangguan';
                buatCoverKCI_(pptx, { sub: 'Summary Gangguan Operasional', keterangan: `${ctx.filterLabel} · ${ctx.tahunLabel} · ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}` });

                const totalSlide = 3;

                const bj = ctx.breakdownJumlah.length ? ctx.breakdownJumlah : [{ name: 'Tidak ada data', value: 0 }];
                s1.addChart(pptx.ChartType.bar, [{ name: 'Kejadian', labels: bj.map(function (r) { return potongTeksPpt_(r.name, 22); }), values: bj.map(function (r) { return r.value; }) }], {

                // ══ SLIDE 2: PROPORSI ══
                // Sumbu pie mengikuti tema filter, PERSIS seperti panel donut di

                // ══ SLIDE 3: TREN & WILAYAH ══
                const NAMA_BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

                });
                const wilayahItems = Object.keys(ctx.areaMap || {}).map(function (k) { return { nama: k, nilai: ctx.areaMap[k] }; })

                judulBagianKCI_(pptx, s3, 'PROPORSI PER WILAYAH', 0.45, 3.28, KCI_PPT.NAVY);

                s3.addText([

                buatPenutupKCI_(pptx);

        // ─── RINCIAN: FORMAT TAMPILAN ──────────────────────────────────

        const NAMA_BULAN_SINGKAT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const NAMA_HARI_SINGKAT = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab']; // index sesuai Date.getDay()

        /**
         * Mengubah tanggal tersimpan ("dd-MM-yyyy", kadang ada " HH:mm" di
         * belakangnya karena Google Sheets otomatis mengenali string
         * tanggal - lihat sanitizeCellValue_ di Service_Sheets.gs) jadi
         * tampilan ringkas "Sen, 17 Agu 2026" (nama hari + tanggal dalam
         * satu baris efisien, sejajar gaya kolom Waktu).
         * @param {string} raw
         * @return {string}
         */
        function formatTanggalDisplay(raw) {
            if (!raw) return '-';
            const tanggalSaja = String(raw).split(' ')[0];

            // Lewat fungsi baku - sebelumnya disyaratkan p[0].length === 2,
            // sehingga tanggal yang ditulis satu digit ("1-3-2026") tidak
            // dikenali sama sekali & tampil apa adanya. Sekarang "1-3-2026"
            // dan "01/03/2026" sama-sama terbaca sebagai 1 Maret.
            const p = bacaTanggalDMY_(tanggalSaja);
            if (!p) return tanggalSaja;

            const namaBulan = NAMA_BULAN_SINGKAT[p.bulan - 1] || String(p.bulan);
            const d = new Date(p.tahun, p.bulan - 1, p.hari);
            const namaHari = !isNaN(d.getTime()) ? NAMA_HARI_SINGKAT[d.getDay()] : null;
            const hariTeks = String(p.hari).padStart(2, '0');
            return namaHari ? `${namaHari}, ${hariTeks} ${namaBulan} ${p.tahun}` : `${hariTeks} ${namaBulan} ${p.tahun}`;
        }

        /**
         * Membersihkan nilai waktu untuk tampilan - server sudah mengirim
         * "HH:mm" bersih (lihat sanitizeCellValue_), fungsi ini jaga-jaga
         * saja untuk kasus tak terduga.
         * @param {string} raw
         * @return {string}
         */
        function formatWaktuDisplay(raw) {
            if (!raw) return '-';
            const bagian = String(raw).trim().split(' ');
            return bagian[bagian.length - 1].replace('.', ':');
        }

        /**
         * Mengubah nilai KATEGORI (bisa "Internal" dari data lama atau
         * "INTERNAL" dari data baru) jadi label tampilan yang konsisten.
         * @param {string} raw
         * @return {string} "INTERNAL" | "EKSTERNAL" | raw asli kalau tak dikenali.
         */
        function normalizeKategoriDisplay(raw) {
            const up = String(raw || '').toUpperCase();
            if (up === 'INTERNAL' || up === 'EKSTERNAL') return up;
            return raw || '-';
        }

        // ─── RINCIAN: KARTU RINGKASAN ───────────────────────────────────

        function updateRincianSummaryCards(list) {
            const elTotal = document.getElementById('rincian-stat-total');
            const elBatal = document.getElementById('rincian-stat-batal');
            const elAndil = document.getElementById('rincian-stat-andil');
            const elUnit = document.getElementById('rincian-stat-unit');
            if (!elTotal) return;

            elTotal.textContent = list.length;

            // Label cakupan tahun - supaya kalau angka Total di sini beda
            // dgn Summary Gangguan, langsung kelihatan itu karena filter
            // tahun yang aktif berbeda (bukan data yang tidak sinkron).
            const elScope = document.getElementById('rincian-stat-scope');
            if (elScope) {
                // Saat mode pilih dipakai, label diganti agar jelas bahwa
                // angka di kartu ini hanya menghitung data yang dicentang -
                // bukan seluruh data tahun berjalan.
                if (typeof modePilihAktif_ !== 'undefined' && modePilihAktif_ && rincianTerpilih_.size > 0) {
                    elScope.textContent = `(${rincianTerpilih_.size} data terpilih)`;
                } else {
                    const tahun = document.getElementById('filter-rincian-tahun')?.value || 'Semua';
                    elScope.textContent = (tahun === 'Semua') ? '(Semua Tahun)' : `(Tahun ${tahun})`;
                }
            }

            const totalBatal = list.reduce((acc, it) => acc + (parseInt(it.kaBatalJumlah) || 0), 0);
            elBatal.textContent = totalBatal;

            const totalAndil = list.reduce((acc, it) => acc + (parseInt(it.andil) || 0), 0);
            elAndil.textContent = totalAndil.toLocaleString('id-ID');

            const unitCounts = {};
            list.forEach(it => { const u = it.unitTerkait || 'Lainnya'; unitCounts[u] = (unitCounts[u] || 0) + 1; });
            let topUnit = '-', maxCount = 0;
            for (const u in unitCounts) { if (unitCounts[u] > maxCount) { maxCount = unitCounts[u]; topUnit = u; } }
            elUnit.textContent = list.length > 0 ? topUnit : '-';
        }

        // ─── RINCIAN: TABEL ─────────────────────────────────────────────

        /**
         * Tanggal pada tabel Rincian dalam DUA baris: nama hari kecil di atas,
         * tanggalnya di bawah. "Min, 23 Agu 2026" sebaris butuh ±115px &
         * memaksa kolomnya lebar; dua baris cukup 84px & lebih mudah dipindai.
         */
        function selTanggalRincian_(raw) {
            const teks = formatTanggalDisplay(raw);
            const koma = teks.indexOf(', ');
            if (koma === -1) return '<span class="whitespace-nowrap">' + escapeHtml(teks) + '</span>';
            // Dibungkus satu elemen: di ponsel sel tabel menjadi flex (label :
            // nilai), & dua span lepas akan terpisah jadi dua kolom.
            return '<span class="inline-block"><span class="block text-[9px] font-extrabold uppercase tracking-wide text-slate-400">' +
                escapeHtml(teks.slice(0, koma)) + '</span><span class="block whitespace-nowrap">' +
                escapeHtml(teks.slice(koma + 2)) + '</span></span>';
        }

        function renderRincianGangguanTable(filtered) {
            const tbody = document.getElementById('rincian-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            // PENTING: fallback saat dipanggil tanpa argumen BUKAN seluruh
            // rincianGangguanData - tapi hasil hitung ulang sesuai filter
            // dropdown yang SEDANG AKTIF di layar. Ini yang menutup celah
            // akar masalah "kartu sudah diklik tapi Rincian tetap
            // menampilkan semua data" - apa pun/kapan pun yang memicu
            // render ulang tanpa argumen, hasilnya tetap konsisten dgn
            // filter yang sedang tampil, tidak pernah diam-diam ke-reset.
            let list = filtered || hitungRincianTerfilter_();

            // ═══ URUTAN TANGGAL DITEGAKKAN DI SINI ═══
            // Sengaja diletakkan di dalam fungsi render, BUKAN hanya di
            // fungsi filter. Alasannya: tabel ini juga dirender dari sumber
            // lain (mis. tombol "cek data bermasalah") yang daftarnya tidak
            // melewati fungsi filter sama sekali - jalur itu akan tetap
            // tampil acak kalau pengurutannya hanya dipasang di satu tempat.
            // Dengan ditegakkan di sini, apa pun sumber daftarnya, urutannya
            // selalu benar.
            //
            // Pengurutan andil pilihan user TIDAK ditimpa - kalau dropdown
            // Urutkan Andil sedang dipakai, urutan itu yang dihormati.
            const modeAndil = document.getElementById('filter-rincian-andil');
            const pakaiUrutAndil = modeAndil && (modeAndil.value === 'Terbesar' || modeAndil.value === 'Terkecil');
            if (!pakaiUrutAndil) {
                // Mengikuti tombol urutan - lihat urutkanRincian_().
                list = urutkanRincian_(list);
            }

            currentlyDisplayedRincian_ = list;

            // Izin dihitung SEBELUM pemeriksaan tabel kosong. Kalau ditaruh
            // setelahnya, fungsi ini keluar lebih dulu saat tidak ada data -
            // sehingga kolom centang tetap terlihat oleh role yang tidak
            // boleh menghapus, hanya karena tabelnya kebetulan kosong.
            const bisaHapus = canDo('gangguan-rincian', 'hapus');
            const thPilih = document.getElementById('rincian-th-pilih');
            if (thPilih) thPilih.style.display = (bisaHapus && modePilihAktif_) ? '' : 'none';

            // Tombol mode pilih hanya berguna bagi yang boleh menghapus.
            const btnMode = document.getElementById('btn-mode-pilih');
            if (btnMode) btnMode.style.display = bisaHapus ? '' : 'none';
            if (!bisaHapus) {
                rincianTerpilih_.clear();
                const bar = document.getElementById('rincian-bar-pilihan');
                if (bar) bar.classList.add('hidden');
            }

            updateRincianSummaryCards(list);

            if (list.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="${(canDo('gangguan-rincian', 'hapus') && modePilihAktif_) ? 15 : 14}" class="px-6 py-8 text-center text-slate-450 italic font-bold bg-white">Tidak ada data gangguan yang sesuai filter.</td></tr>`;
                renderRincianPagination_(0);
                return;
            }

            // Pagination: potong list yang FULL (utk kartu & export) jadi
            // sebagian saja utk ditampilkan di tabel.
            const totalPages = Math.max(1, Math.ceil(list.length / rincianPageSize_));
            if (rincianCurrentPage_ > totalPages) rincianCurrentPage_ = totalPages;
            if (rincianCurrentPage_ < 1) rincianCurrentPage_ = 1;
            const startIdx = (rincianCurrentPage_ - 1) * rincianPageSize_;
            const pageItems = list.slice(startIdx, startIdx + rincianPageSize_);


            let gagalRender = 0;
            // ═══ KECEPATAN ═══
            // Baris dikumpulkan dulu ke array, baru ditulis SEKALI di akhir.
            // Sebelumnya tiap baris disisipkan satu per satu dengan
            // insertAdjacentHTML - browser menghitung ulang tata letak
            // seluruh tabel pada SETIAP baris, jadi biayanya tumbuh berlipat
            // seiring jumlah baris. Dengan sekali tulis, halaman terasa
            // seketika walau ratusan baris.
            const potonganBaris = [];
            pageItems.forEach((item, idxOnPage) => {
              const idx = startIdx + idxOnPage;
              try {
                const isNew = item.id === lastAddedRincianId;
                const kode = item.kodeTipe || 'A';
                const kategoriDisp = normalizeKategoriDisplay(item.kategori);
                const kaBatalDisplay = (parseInt(item.kaBatalJumlah) > 0)
                    ? `<span class="font-black text-[#e11d48]">${escapeHtml(item.kaBatalJumlah)}</span>`
                    : `<span class="text-slate-400 font-medium">0</span>`;

                let tombolAksi = `
                    <button onclick="openPreviewModal('${item.id}')" title="Preview Detail" class="p-1.5 rounded-md bg-amber-50 text-[#8a6d1f] hover:bg-[#d4af37] hover:text-white border border-amber-200 transition">
                        <i class="fa-solid fa-eye text-[10px]"></i>
                    </button>`;
                if (bisaHapus) {
                    tombolAksi += `
                    <button onclick="confirmDeleteGangguan('${item.id}')" title="Hapus Data" class="p-1.5 rounded-md bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 transition">
                        <i class="fa-solid fa-trash-alt text-[10px]"></i>
                    </button>`;
                }

                // Gaya teks kolom NO s.d. Wilayah DISAMAKAN (font & warna sama
                // persis) supaya enak dibaca berurutan - dulu campur-campur
                // (sebagian font-mono, sebagian warna aksen berbeda tanpa
                // alasan semantik yang jelas). Badge Kategori/Kode & highlight
                // merah Batal (>0) TETAP dipertahankan beda karena itu penanda
                // status yang memang harus menonjol, bukan sekadar gaya teks.
                const isiTeks = 'text-slate-800 font-bold';
                const bermasalah = itemBermasalah_(item);
                const kelasBermasalah = bermasalah ? 'border-l-4 border-l-red-400 bg-red-50/30' : '';
                const terpilih = rincianTerpilih_.has(item.id);
                potonganBaris.push(`
                    <tr data-id="${item.id}" class="hover:bg-slate-50 transition-colors divide-x divide-slate-150 align-middle text-[11px] ${isiTeks} ${isNew ? 'row-new':''} ${kelasBermasalah} ${terpilih ? 'bg-amber-50/60' : ''}" ${bermasalah ? 'title="Ada field klasifikasi (Kategori/Unit Terkait/Wilayah/Kodefikasi) yang kosong atau tidak dikenal - klik Preview untuk detail"' : ''}>
                        ${(bisaHapus && modePilihAktif_) ? `<td class="px-2 py-3 text-center">
                            <input type="checkbox" ${terpilih ? 'checked' : ''} onchange="togglePilihRincian_('${item.id}', this.checked)"
                                class="w-3.5 h-3.5 rounded border-slate-300 text-[#0c1d37] focus:ring-1 focus:ring-amber-500 cursor-pointer align-middle">
                        </td>` : ''}
                        <td class="px-2 py-3 text-center">${bermasalah ? '<i class="fa-solid fa-triangle-exclamation text-red-400 text-[9px] mr-1"></i>' : ''}${idx+1}</td>
                        <td class="px-2 py-3 text-center leading-snug">${selTanggalRincian_(item.tanggal)}</td>
                        <td class="px-1 py-3 text-center text-[10px] leading-snug">${labelWaktuGangguan_(item)}</td>
                        <td class="px-3 py-3 text-left leading-snug break-words">${escapeHtml(item.judul) || '-'}</td>
                        <td class="px-2 py-3 text-center leading-snug break-words">${escapeHtml(item.noKa) || '-'}</td>
                        <td class="px-3 py-3 text-left leading-snug break-words">${escapeHtml(item.tempat) || '-'}</td>
                        <td class="px-3 py-3 text-left leading-snug break-words">${escapeHtml(item.penyebab) || '-'}</td>
                        <td class="px-1 py-3 text-center">${escapeHtml(item.andil)}</td>
                        <td class="px-1 py-3 text-center">${kaBatalDisplay}</td>
                        <td class="px-2 py-3 text-center align-middle">
                            <span class="inline-block px-2 py-0.5 rounded text-[9px] font-black uppercase whitespace-nowrap ${kategoriDisp === 'INTERNAL' ? 'bg-[#e2f1ee] text-[#107573]' : 'bg-orange-100 text-orange-800'}">${escapeHtml(kategoriDisp)}</span>
                        </td>
                        <!--

                          Kelas itu mengizinkan pemenggalan DI TENGAH KATA saat

                          Penggantinya: kolom dilebarkan, hurufnya sedikit
                          dikecilkan, & pembungkusan hanya boleh terjadi pada
                          SPASI. "Wilayah I Jakarta" tetap patah rapi jadi dua

                        <td class="px-2 py-3 text-center align-middle text-[10px] font-bold leading-tight" title="${escapeHtml(item.unitTerkait)}">${escapeHtml(item.unitTerkait) || '-'}</td>
                        <td class="px-2 py-3 text-center align-middle text-[10px] font-bold leading-tight" title="${escapeHtml(item.area)}">${escapeHtml(item.area) || '-'}</td>
                        <td class="px-1 py-3 text-center">

                `);
              } catch (err) {
                gagalRender++;
                console.log('[render] baris ke-' + (idx + 1) + ' gagal ditampilkan:', err, item);
              }
            });
            tbody.innerHTML = potonganBaris.join('');   // satu kali tulis
            if (gagalRender > 0) {
                showToast(gagalRender + ' baris tidak bisa ditampilkan karena datanya tidak wajar - cek baris tsb di Spreadsheet.');
            }
            perbaruiBarPilihan_();

        }

        /**
         * Render kontrol pagination (pilihan jumlah baris + Sebelumnya/
         * Selanjutnya) di bawah tabel Rincian Gangguan.
         * @param {number} totalItems Total baris SETELAH filter (sebelum dipotong halaman).
         */
        function renderRincianPagination_(totalItems) {
            const el = document.getElementById('rincian-pagination');
            if (!el) return;
            if (totalItems === 0) { el.innerHTML = ''; return; }
            const totalPages = Math.max(1, Math.ceil(totalItems / rincianPageSize_));
            const startShown = (rincianCurrentPage_ - 1) * rincianPageSize_ + 1;
            const endShown = Math.min(rincianCurrentPage_ * rincianPageSize_, totalItems);
            el.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 text-[11px] font-bold text-slate-500">
                    <div class="flex items-center gap-2 flex-wrap justify-center">
                        <span>Tampilkan</span>
                        <select onchange="changeRincianPageSize_(this.value)" class="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-[11px] font-bold outline-none focus:ring-1 focus:ring-amber-500 cursor-pointer">
                            ${[5, 10, 15, 20].map(n => `<option value="${n}" ${n === rincianPageSize_ ? 'selected' : ''}>${n} baris</option>`).join('')}
                        </select>
                        <span>&middot; ${startShown}-${endShown} dari ${totalItems} data</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="gotoRincianPage_(${rincianCurrentPage_ - 1})" ${rincianCurrentPage_ <= 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 transition">
                            <i class="fa-solid fa-chevron-left text-[9px]"></i><span>Sebelumnya</span>
                        </button>
                        <span class="px-1">Hal ${rincianCurrentPage_} / ${totalPages}</span>
                        <button onclick="gotoRincianPage_(${rincianCurrentPage_ + 1})" ${rincianCurrentPage_ >= totalPages ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 transition">
                            <span>Selanjutnya</span><i class="fa-solid fa-chevron-right text-[9px]"></i>
                        </button>
                    </div>
                </div>`;
        }

        /** Pindah ke halaman tertentu (dipanggil tombol Sebelumnya/Selanjutnya). */
        function gotoRincianPage_(page) {
            rincianCurrentPage_ = page;
            renderRincianGangguanTable(currentlyDisplayedRincian_);
        }

        /** Ganti jumlah baris per halaman (5/10/15/20), kembali ke halaman 1. */
        function changeRincianPageSize_(size) {
            rincianPageSize_ = parseInt(size, 10) || 10;
            rincianCurrentPage_ = 1;
            renderRincianGangguanTable(currentlyDisplayedRincian_);
        }

        let debounceTimerRincianSearch_ = null;
        /**
         * Jeda singkat (250ms) sebelum filter benar-benar dijalankan saat
         * mengetik di kolom pencarian - supaya tidak menyaring ulang tiap
         * satu huruf diketik. Di ~20 baris data sekarang bedanya tidak
         * kerasa, tapi ini jaring pengaman performa begitu datanya sudah
         * ratusan/ribuan baris ke depannya.
         */
        function debounceApplyRincianFilters_() {
            clearTimeout(debounceTimerRincianSearch_);
            debounceTimerRincianSearch_ = setTimeout(applyRincianFilters, 250);
        }

        /**
         * Hitung ulang daftar Rincian Gangguan sesuai state SEMUA dropdown
         * & input filter yang SEDANG AKTIF di layar saat ini.
         *
         * PENTING: dipakai baik oleh applyRincianFilters() (dipicu user
         * lewat UI filter) MAUPUN sbg fallback renderRincianGangguanTable()
         * saat dipanggil tanpa argumen eksplisit. Sebelumnya, render tanpa
         * argumen diam-diam jatuh balik ke SELURUH rincianGangguanData
         * (mengabaikan filter yang sedang aktif di dropdown) - kalau ADA
         * pemicu render ulang lain di luar modul ini (mis. dari switchTab()
         * yang logic internalnya di luar kendali/visibilitas modul
         * Gangguan) yang terjadi SETELAH sebuah filter baru saja
         * diterapkan, itu bisa diam-diam menimpa hasil terfilter dgn
         * tampilan tak terfilter - inilah akar dari laporan "kartu sudah
         * bisa diklik tapi Rincian tetap menampilkan semua data". Dengan
         * fallback ini, render APA PUN yang memicunya SELALU konsisten
         * dgn yang ditunjukkan dropdown filter - tidak mungkin lagi diam-
         * diam menampilkan semua data padahal dropdown menunjukkan sedang
         * terfilter.
         * @return {Object[]}
         */
        function hitungRincianTerfilter_() {
            const detail = document.getElementById('filter-rincian-pdetail')?.value || 'Semua';
            const unit = document.getElementById('filter-rincian-unit')?.value || 'Semua';
            const area = document.getElementById('filter-rincian-area')?.value || 'Semua';
            const kode = document.getElementById('filter-rincian-kode')?.value || 'Semua';
            const tahun = document.getElementById('filter-rincian-tahun')?.value || 'Semua';
            const batal = document.getElementById('filter-rincian-batal').value;
            const andil = document.getElementById('filter-rincian-andil').value;
            const kategori = document.getElementById('filter-rincian-kategori').value;
            const tglMulai = document.getElementById('filter-rincian-tgl-mulai').value;
            const tglAkhir = document.getElementById('filter-rincian-tgl-akhir').value;
            const search = document.getElementById('search-rincian-input').value.toLowerCase();

            let results = rincianGangguanData.filter(item => {
                const matchDetail = (detail === 'Semua') || (item.penyebab === detail);
                const matchUnit = (unit === 'Semua') || (item.unitTerkait === unit);
                const matchArea = (area === 'Semua') || ((item.area||'').toLowerCase() === area.toLowerCase());
                const matchKode = (kode === 'Semua') || ((item.kodeTipe || 'A') === kode);
                const itemTahun = tahunDariTanggal_(item.tanggal);
                const matchTahun = (tahun === 'Semua') || (itemTahun === tahun);
                let matchBatal = true;
                if (batal === 'Ada') matchBatal = item.kaBatalJumlah > 0;
                else if (batal === 'Tidak') matchBatal = item.kaBatalJumlah === 0;
                const matchKategori = (kategori === 'Semua') || (normalizeKategoriDisplay(item.kategori) === kategori);
                let matchTanggal = true;
                if (tglMulai || tglAkhir) {
                    // Semua pembacaan lewat fungsi baku - lihat bacaTanggalDMY_().
                    const itemDate = tanggalDMYKeDate_(item.tanggal);
                    if (!itemDate) matchTanggal = false;
                    if (itemDate && tglMulai) {
                        const s = inputDateKeDate_(tglMulai);
                        if (s && itemDate < s) matchTanggal = false;
                    }
                    if (itemDate && tglAkhir) {
                        const e = inputDateKeDate_(tglAkhir);
                        if (e) { e.setHours(23, 59, 59, 999); if (itemDate > e) matchTanggal = false; }
                    }
                }
                const teksGabungan = [item.judul, item.uraian, item.tempat, item.noKa, item.kaTerganggu].join(' ').toLowerCase();
                const matchSearch = teksGabungan.includes(search);
                return matchDetail && matchUnit && matchArea && matchKode && matchTahun && matchBatal && matchKategori && matchTanggal && matchSearch;
            });
            // ═══ URUTAN TANGGAL ═══
            // Bawaannya: TERBARU DI ATAS. Sebelumnya data tampil seolah acak
            // (01 Mei, 01 Jun, 01 Jul, ... lalu 13 Jan, 14 Jan) karena
            // diurutkan mengikuti urutan datanya di sheet, sementara
            // tanggalnya berformat teks "DD-MM-YYYY". Membandingkan teks
            // seperti itu membuat semua tanggal 01 berkumpul lebih dulu -
            // hari yang dibandingkan, bukan tahun-bulan-harinya.
            //
            // Sekarang dibandingkan sebagai ANGKA YYYYMMDD, jadi urutannya
            // benar apa pun isi datanya. Waktu mulai ikut dipakai supaya dua
            // kejadian di hari yang sama tetap runtut.
            if (andil === 'Terbesar') results.sort((a, b) => b.andil - a.andil);
            else if (andil === 'Terkecil') results.sort((a, b) => a.andil - b.andil);
            else results.sort(function (a, b) { return kunciUrutTanggal_(b) - kunciUrutTanggal_(a); });
            return results;
        }

        /**
         * Mengubah tanggal "DD-MM-YYYY" + waktu "HH:MM" jadi satu angka
         * YYYYMMDDHHMM yang bisa dibandingkan langsung.
         *
         * Baris yang tanggalnya tidak terbaca diberi nilai 0 supaya jatuh di
         * paling bawah - lebih baik terlihat di ujung daftar daripada
         * menyelip di tengah & mengacaukan urutan tanpa disadari.
         */
        function kunciUrutTanggal_(item) {
            const teks = String((item && item.tanggal) || '').trim();
            const bagian = teks.split(' ')[0].split(/[-/.]/);
            if (bagian.length < 3) return 0;

            let hari = parseInt(bagian[0], 10);
            let bulan = parseInt(bagian[1], 10);
            let tahun = parseInt(bagian[2], 10);
            // Sebagian data lama tersimpan terbalik (YYYY-MM-DD) - dikenali
            // dari bagian pertama yang berupa tahun 4 digit.
            if (String(bagian[0]).length === 4) {
                tahun = parseInt(bagian[0], 10);
                bulan = parseInt(bagian[1], 10);
                hari = parseInt(bagian[2], 10);
            }
            if (!tahun || !bulan || !hari) return 0;

            const waktu = String((item && item.waktuMulai) || '').trim();
            const jm = waktu.match(/^(\d{1,2})[:.](\d{2})/);
            const jam = jm ? parseInt(jm[1], 10) : 0;
            const menit = jm ? parseInt(jm[2], 10) : 0;

            return tahun * 100000000 + bulan * 1000000 + hari * 10000 + jam * 100 + menit;
        }

        /** Dipanggil saat filter TAHUN berubah - isi filter penyebab ikut menyesuaikan. */
        function ubahTahunRincian_() {
            segarkanFilterPenyebab_();
            applyRincianFilters();
        }

        function applyRincianFilters() {
            // Daftar penyebab selalu mengikuti data tahun yang sedang dipilih.
            // Dipanggil dari sini supaya berlaku untuk SEMUA jalur - ganti
            // tahun, hapus data, maupun muat ulang - tanpa perlu diingat satu
            // per satu di tiap tempat.
            if (typeof segarkanFilterPenyebab_ === 'function') segarkanFilterPenyebab_();

            // Pilihan dilepas saat filter berubah - kalau tidak, baris yang
            // sudah tidak tampil bisa ikut terhapus tanpa disadari.
            if (typeof bersihkanPilihanRincian_ === 'function') bersihkanPilihanRincian_();
            rincianCurrentPage_ = 1;
            renderRincianGangguanTable(hitungRincianTerfilter_());
        }
