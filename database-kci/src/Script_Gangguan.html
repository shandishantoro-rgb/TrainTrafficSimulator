        /**
         * Versi sebelum 2026.10.13 memotong teks di atas 2.000 karakter saat
         * DIBACA & menempelkan ekor di bawah. Bila baris seperti itu pernah
         * disunting lalu disimpan, potongannya ikut tertulis permanen ke Sheets.
         * Teks aslinya tidak bisa dipulihkan dari aplikasi - catatan ini
         * memberi tahu field mana yang perlu dilengkapi ulang.
         */
        const PENANDA_POTONG_LAMA_ = '[...dipotong, teks asli terlalu panjang]';
        function catatanTeksTerpotongLama_(row) {
            const el = document.getElementById('prev-catatan-terpotong');
            if (!el) return;
            const kena = [['judul', 'Judul'], ['tempat', 'Lokasi'], ['uraian', 'Uraian Kejadian'], ['penyebab', 'Penyebab'],
                ['tindakLanjut', 'Tindak Lanjut'], ['kaTerganggu', 'KA Terganggu'], ['keteranganTambahan', 'Keterangan Tambahan']]
                .filter(function (p) { return String(row[p[0]] || '').indexOf(PENANDA_POTONG_LAMA_) !== -1; })
                .map(function (p) { return p[1]; });
            // Atribut hidden (bukan kelas) - kelas `hidden` tetap dihitung oleh
            // space-y-4 induknya & menyisakan celah kosong di puncak modal.
            el.hidden = !kena.length;
            el.innerHTML = kena.length
                ? '<i class="fa-solid fa-triangle-exclamation mr-1.5"></i><b>' + escapeHtml(kena.join(', ')) + '</b> pernah terpotong oleh versi aplikasi lama ' +

         * terlihat sepotong & harus digulir di kotak kecil. Dibatasi 55% tinggi
         * layar; lebih dari itu kotaknya bergulir sendiri.
         */
        function tumbuhkanIsian_(el) {
            if (!el) return;
            el.style.height = 'auto';
            const batas = Math.round(window.innerHeight * 0.55);
            el.style.height = Math.min(el.scrollHeight + 2, batas) + 'px';
            el.style.overflowY = (el.scrollHeight + 2 > batas) ? 'auto' : 'hidden';
            if (el.id === 'm-uraian') {
                const h = document.getElementById('m-uraian-hitung');
                if (h) h.textContent = el.value ? el.value.length.toLocaleString('id-ID') + ' karakter' : '';
            }
        }

            ['m-uraian', 'm-tindakan', 'm-keterangan'].forEach(function (id) { tumbuhkanIsian_(document.getElementById(id)); });

            const parts = dateVal.split('-');
            const formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;

                tanggalSelesai: (function () {

                noKa: document.getElementById('m-noka').value,
                tempat: document.getElementById('m-tempat').value,

                kodeTipe: document.getElementById('m-kode-tipe').value,
                keteranganTambahan: document.getElementById('m-keterangan').value,
                tindakLanjut: document.getElementById('m-tindakan').value,
                kaBatalJumlah: parseInt(document.getElementById('m-bataljumlah').value) || 0,
                kaBatalNo: document.getElementById('m-batalno').value || "-",
                kaTerganggu: document.getElementById('m-katerganggu').value,
                andil: parseInt(document.getElementById('m-andil').value) || 0,
                kategori: document.getElementById('m-kategori').value,
                unitTerkait: document.getElementById('m-unit').value,
                area: document.getElementById('m-area').value

            const btn = document.getElementById('btn-submit-manual-rincian');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>';

            function selesai(res, pesanSukses) {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                if (res.success) {
                    lastAddedRincianId = editId || res.id;
                    closeInputMenuModal();

                    loadRincianGangguan('rincian', true);

                    showToast('Gagal menyimpan: ' + (res.message || ''));

            }

            if (editId) {
                google.script.run
                    .withSuccessHandler(function (res) { selesai(res, 'Perubahan berhasil disimpan.'); })
                    .withFailureHandler(function () { btn.disabled = false; btn.innerHTML = originalHtml; showToast('Terjadi kesalahan saat menyimpan perubahan.'); })
                    .gangguan_update(currentSessionToken, editId, item);
            } else {
                google.script.run
                    .withSuccessHandler(function (res) { selesai(res, 'Data kejadian berhasil dimasukkan.'); })
                    .withFailureHandler(function () { btn.disabled = false; btn.innerHTML = originalHtml; showToast('Terjadi kesalahan saat menyimpan data.'); })
                    .gangguan_add(currentSessionToken, item);
            }
        }

        let parsedGangguanExcelRows = [];
        /** Hasil pemilahan duplikat berkas yang sedang dipratinjau. */
        let gandaExcelTerakhir_ = null;

        let excelLewatiGanda_ = true;

        /**
         * Mengubah nilai TANGGAL hasil baca SheetJS jadi teks "dd-MM-yyyy"
         * konsisten - menerima BAIK objek Date asli (kalau file sumbernya
         * pakai format tanggal apa pun, termasuk format lokal Indonesia
         * custom spt "dddd, d-mmm-yy") MAUPUN teks yang sudah berformat
         * "dd-MM-yyyy", "yyyy-MM-dd", atau varian bergaris-miring "dd/MM/yyyy"
         * & "yyyy/MM/dd" (jaring pengaman kalau Excel gagal auto-deteksi
         * jadi Date - lihat catatan akar masalah di parseGangguanExcelRows).
         * @param {*} val
         * @return {string}
         */
        function normalizeTanggalDariExcel_(val) {
            if (!val) return '';
            if (val instanceof Date && !isNaN(val)) {
                const dd = String(val.getDate()).padStart(2, '0');
                const mm = String(val.getMonth() + 1).padStart(2, '0');
                const yyyy = val.getFullYear();
                return `${dd}-${mm}-${yyyy}`;
            }
            let s = String(val).trim();

            // Buang nama hari di depan kalau ada - user sering menulis
            // "Senin, 17-08-2026" karena itu yang terbaca alami. Dulu bentuk
            // seperti ini gagal dikenali & masuk apa adanya jadi teks aneh.
            // Sekarang diterima: nama harinya dilepas, tanggalnya tetap dipakai.
            s = s.replace(/^(senin|selasa|rabu|kamis|jum'?at|jumat|sabtu|minggu|ahad)\s*[,.\-]?\s*/i, '').trim();

            const mYmd = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
            if (mYmd) return `${String(mYmd[3]).padStart(2,'0')}-${String(mYmd[2]).padStart(2,'0')}-${mYmd[1]}`;
            const mDmy = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
            if (mDmy) return `${String(mDmy[1]).padStart(2,'0')}-${String(mDmy[2]).padStart(2,'0')}-${mDmy[3]}`;

            // Bentuk "17 Agustus 2026" / "17 Agu 2026" - juga lazim diketik manual.
            const NAMA_BULAN_PANJANG = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
            const mTeks = s.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})/);
            if (mTeks) {
                const namaBulan = mTeks[2].toLowerCase();
                const idx = NAMA_BULAN_PANJANG.findIndex(function (b) { return b.indexOf(namaBulan.slice(0, 3)) === 0; });
                if (idx !== -1) return `${String(mTeks[1]).padStart(2,'0')}-${String(idx+1).padStart(2,'0')}-${mTeks[3]}`;
            }
            return s;
        }

        /**
         * Mengubah nilai WAKTU hasil baca SheetJS jadi teks "HH:mm" - file
         * produksi asli user kadang menulis jam pakai TITIK ("05.27"),
         * bukan titik dua ("05:27"); ada juga kemungkinan berupa pecahan
         * hari (0-1, format Excel time serial yang sudah diubah SheetJS
         * jadi Date jam 1899-12-30). Fungsi ini menormalkan semuanya.
         * @param {*} val
         * @return {string}
         */
        function normalizeWaktuDariExcel_(val) {
            if (!val && val !== 0) return '';
            if (val instanceof Date && !isNaN(val)) {
                const hh = String(val.getHours()).padStart(2, '0');
                const mm = String(val.getMinutes()).padStart(2, '0');
                return `${hh}:${mm}`;
            }
            let s = String(val).trim();
            s = s.replace('.', ':');
            const m = s.match(/^(\d{1,2}):(\d{2})/);
            if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
            return s;
        }

        const GANGGUAN_EXCEL_NOTES = {

            try {
                const headers = GANGGUAN_EXCEL_COLUMNS.map(c => c.header);

                // satu kolom ke kiri, sehingga "Contoh: Pelemparan Batu" muncul
                // di bawah judul kolom TANGGAL SELESAI. Templatnya tetap bisa
                // diunduh & dipakai, jadi tidak ada yang menyadarinya kecuali
                // dengan membaca baris contohnya baik-baik.
                //
                // Sekali kolom ditambah atau dihapus tanpa menyesuaikan baris
                // contoh, hal yang sama terulang - maka sekarang dijaga.

                if (contoh.length !== headers.length) {
                    console.log('downloadGangguanTemplate: baris contoh ' + contoh.length +

                    while (contoh.length < headers.length) contoh.push('');
                    contoh.length = headers.length;
                }

                // ── SHEET 1: Petunjuk Pengisian ──────────────────────────
                const petunjukRows = [['KOLOM', 'CATATAN / FORMAT']];

        function handleExcelFileSelect(e) {
            const file = e.target.files[0];
            const label = document.getElementById('label-excel-import');
            parsedGangguanExcelRows = [];
            if (!file) return;

            label.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Membaca berkas...';

            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    // raw:true supaya cell tanggal/waktu tetap berupa objek Date
                    // asli (bukan teks hasil format tampilan file sumber, yang
                    // di file produksi user kadang custom spt "Jumat, 1-Jan-26")
                    // - normalisasi manual dilakukan sendiri di parseGangguanExcelRows.
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    // Cari sheet "Template" berdasar NAMA dulu (template terbaru
                    // punya sheet "Petunjuk Pengisian" di depannya) - fallback ke
                    // sheet pertama kalau user upload versi lama/sudah ganti nama.
                    const sheet = workbook.Sheets['Template'] || workbook.Sheets[workbook.SheetNames[0]];
                    const rawRows = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: '' });

                    if (rawRows.length === 0) {
                        label.innerHTML = '<span class="text-red-600"><i class="fa-solid fa-circle-xmark"></i> Berkas kosong atau tidak terbaca.</span>';
                        showToast('Berkas Excel kosong atau tidak ada baris data.');
                        return;
                    }

                    // Validasi kolom wajib - TRIM-TOLERANT (file produksi asli
                    // user punya header "UNIT TERKAIT " dengan spasi tambahan).
                    const actualHeadersTrimmed = Object.keys(rawRows[0]).map(h => h.trim());
                    const requiredHeaders = GANGGUAN_EXCEL_COLUMNS.filter(c => c.required).map(c => c.header);
                    const missingHeaders = requiredHeaders.filter(h => !actualHeadersTrimmed.includes(h));
                    if (missingHeaders.length > 0) {
                        label.innerHTML = `<span class="text-red-600"><i class="fa-solid fa-circle-xmark"></i> Format berkas tidak sesuai. Kolom wajib tidak ditemukan: ${escapeHtml(missingHeaders.join(', '))}.</span>`;
                        showToast('Format berkas TIDAK SESUAI - klik "Download Template" untuk lihat format kolom yang benar.');
                        parsedGangguanExcelRows = [];
                        return;
                    }

                    // Baris mentah dinormalisasi dulu key-nya (trim) supaya
                    // parseGangguanExcelRows tidak perlu tahu soal quirk spasi.
                    const rawRowsTrimmed = rawRows.map(row => {
                        const out = {};
                        Object.keys(row).forEach(k => { out[k.trim()] = row[k]; });
                        return out;
                    });

                    const hasil = parseGangguanExcelRows(rawRowsTrimmed);

                    // Duplikat dipilah SEBELUM pratinjau ditampilkan, supaya
                    // penggunanya tahu apa yang akan terjadi sebelum menekan
                    // Import - bukan setelahnya, ketika datanya sudah masuk.
                    gandaExcelTerakhir_ = pilahGandaExcel_(hasil.valid);
                    parsedGangguanExcelRows = hasil.valid;

                    if (hasil.valid.length === 0) {
                        label.innerHTML = `<span class="text-red-600"><i class="fa-solid fa-circle-xmark"></i> Tidak ada baris valid di "${escapeHtml(file.name)}".</span>`;
                        showToast('Gagal membaca: tidak ada baris data yang valid pada berkas ini.');
                        return;
                    }
                    let pesan = `<span class="text-emerald-700"><i class="fa-solid fa-circle-check"></i> "${escapeHtml(file.name)}" siap diimpor: <strong>${hasil.valid.length} baris valid</strong>`;
                    if (hasil.invalidCount > 0) pesan += `, <strong class="text-red-700">${hasil.invalidCount} baris DITOLAK</strong>`;
                    pesan += '</span>';

                    // Rincian baris yang ditolak, beserta alasannya. Dulu baris
                    // ini hanya dihitung lalu hilang tanpa keterangan - itu
                    // sebabnya dari 200 baris hanya sebagian masuk & tidak
                    // ketahuan mana yang gagal.
                    if (hasil.barisDitolak && hasil.barisDitolak.length > 0) {
                        barisDitolakTerakhir_ = hasil.barisDitolak;
                        const rincian = hasil.barisDitolak.slice(0, 10).map(function (b) {
                            return `<div class="py-0.5"><strong>Baris ${b.baris}</strong> &mdash; ${escapeHtml(b.alasan)}` +
                                `<div class="text-[10px] opacity-75 pl-3">${escapeHtml(b.judul)}</div></div>`;
                        }).join('');
                        const sisa = hasil.barisDitolak.length > 10
                            ? `<div class="text-[10px] italic mt-1">...dan ${hasil.barisDitolak.length - 10} baris lagi - unduh laporan untuk daftar lengkapnya</div>` : '';
                        pesan += `<div class="mt-2 p-2.5 bg-red-50 border border-red-300 rounded-lg text-red-800 text-[11px]">
                            <div class="flex items-center justify-between gap-2 mb-1.5">
                                <strong><i class="fa-solid fa-circle-xmark"></i> ${hasil.barisDitolak.length} baris TIDAK akan diimpor</strong>
                                <button onclick="unduhLaporanDitolak()" class="px-2 py-1 bg-white border border-red-300 hover:bg-red-100 rounded font-bold text-[10px] transition">
                                    <i class="fa-solid fa-file-excel mr-1"></i>Unduh Laporan
                                </button>
                            </div>
                            ${rincian}${sisa}
                            <div class="mt-1.5 pt-1.5 border-t border-red-200 text-[10px]">
                                Perbaiki baris tersebut di berkas Excel Anda, lalu unggah ulang berkasnya.
                            </div>
                        </div>`;
                    } else {
                        barisDitolakTerakhir_ = [];
                    }
                    // ═══ PERINGATAN DUPLIKAT ═══
                    const gd = gandaExcelTerakhir_;
                    if (gd && (gd.sudahAda.length || gd.kembarBerkas.length)) {
                        const daftar = function (arr, penjelas) {
                            return arr.slice(0, 8).map(function (b) {
                                return '&bull; Baris ' + b.no + ' &mdash; ' + escapeHtml(b.tanggal || '-') + ' ' +
                                    escapeHtml(b.waktuMulai || '') + ' &middot; ' + escapeHtml(b.judul || '-') +
                                    (penjelas ? penjelas(b) : '');
                            }).join('<br>') + (arr.length > 8 ? '<br><em>...dan ' + (arr.length - 8) + ' baris lagi</em>' : '');
                        };

                        pesan += '<div class="mt-2 p-2.5 bg-amber-50 border border-amber-300 rounded-lg text-amber-900">' +
                            '<strong><i class="fa-solid fa-copy"></i> ' +
                            (gd.sudahAda.length + gd.kembarBerkas.length) + ' baris terdeteksi KEMBAR</strong>';

                        if (gd.sudahAda.length) {
                            pesan += '<div class="mt-1.5"><strong>' + gd.sudahAda.length +
                                ' baris sudah pernah diinput</strong> &mdash; seluruh kolomnya sama persis dengan data yang ada:<br>' +
                                '<span class="text-[10px] font-semibold">' + daftar(gd.sudahAda) + '</span></div>';
                        }
                        if (gd.kembarBerkas.length) {
                            pesan += '<div class="mt-1.5"><strong>' + gd.kembarBerkas.length +
                                ' baris kembar di dalam berkas ini sendiri</strong>:<br>' +
                                '<span class="text-[10px] font-semibold">' +
                                daftar(gd.kembarBerkas, function (b) { return ' <em>(sama dengan baris ' + b.samaDengan + ')</em>'; }) +
                                '</span></div>';
                        }

                        pesan += '<label class="flex items-start gap-2 mt-2.5 pt-2.5 border-t border-amber-300 cursor-pointer">' +
                            '<input type="checkbox" id="excel-lewati-ganda" checked class="mt-0.5 w-3.5 h-3.5 rounded border-amber-400 text-amber-700 focus:ring-1 focus:ring-amber-500">' +
                            '<span class="text-[11px] font-bold">Jangan impor baris yang kembar &mdash; hanya <strong>' +
                            gd.unik.length + ' baris baru</strong> yang masuk. ' +
                            '<span class="font-semibold">Hilangkan centang bila memang ingin memasukkan semuanya.</span></span></label>';
                        pesan += '</div>';

                        showToast(gd.sudahAda.length
                            ? gd.sudahAda.length + ' baris sudah pernah diinput & akan dilewati. Periksa daftarnya sebelum Import.'
                            : gd.kembarBerkas.length + ' baris kembar di dalam berkas ini & akan dilewati.');
                    }

                    if (hasil.barisPerluDicek && hasil.barisPerluDicek.length > 0) {
                        const daftarBaris = hasil.barisPerluDicek.slice(0, 8).map(b => `Baris ${b.baris} (Tanggal: "${escapeHtml(b.tanggal)}", Waktu: "${escapeHtml(b.waktuMulai)}-${escapeHtml(b.waktuSelesai)}")`).join('<br>');
                        const sisa = hasil.barisPerluDicek.length > 8 ? `<br>...dan ${hasil.barisPerluDicek.length - 8} baris lain` : '';
                        pesan += `<div class="mt-2 p-2.5 bg-amber-50 border border-amber-300 rounded-lg text-amber-800">
                            <i class="fa-solid fa-triangle-exclamation"></i> <strong>${hasil.barisPerluDicek.length} baris formatnya tidak baku, WAJIB dicek dulu</strong> (kemungkinan Excel salah menebak tanggal/waktu saat file disimpan):<br>${daftarBaris}${sisa}
                        </div>`;
                        showToast(`Berkas terbaca, tapi ${hasil.barisPerluDicek.length} baris tanggal/waktunya perlu dicek manual dulu sebelum Import.`);
                    } else {
                        showToast(`Berkas terbaca: ${hasil.valid.length} baris siap diimpor` +
                            (hasil.invalidCount ? `, ${hasil.invalidCount} baris DITOLAK - lihat rinciannya di bawah.` : '.'));
                    }
                    label.innerHTML = pesan;
                } catch (err) {
                    label.innerHTML = '<span class="text-red-600"><i class="fa-solid fa-circle-xmark"></i> Gagal membaca berkas. Pastikan formatnya .xlsx yang valid.</span>';
                    showToast('Gagal membaca berkas Excel - pastikan formatnya benar.');
                    parsedGangguanExcelRows = [];
                }
            };
            reader.onerror = function () {
                showToast('Gagal membaca berkas dari komputer Anda.');
            };
            reader.readAsArrayBuffer(file);
        }

        /**
         * Menyimpulkan tanggal selesai dari jam operasional.
         *
         * Kalau jam selesai LEBIH KECIL dari jam mulai, kejadiannya melewati
         * tengah malam - jadi selesainya keesokan hari. Selain itu, selesai di
         * hari yang sama & nilainya dikosongkan (menyimpan tanggal kembar
         * hanya menambah berat data tanpa guna).
         *
         * ═══ BATASNYA ═══
         * Cara ini hanya bisa mengenali SATU kali penyeberangan tengah malam.
         * Gangguan yang berlangsung lebih dari 24 jam tidak bisa disimpulkan
         * dari jam saja - untuk kasus langka itu, tanggal selesainya disunting
         * lewat formulir input manual setelah data masuk.
         *
         * @param {string} tanggal  "dd-MM-yyyy"
         * @param {string} mulai    "HH:mm"
         * @param {string} selesai  "HH:mm"
         * @return {string} "dd-MM-yyyy" bila beda hari, "" bila hari yang sama.
         */
        function turunkanTanggalSelesai_(tanggal, mulai, selesai) {
            const m = /^(\d{1,2}):(\d{2})$/.exec(String(mulai || '').trim());
            const s = /^(\d{1,2}):(\d{2})$/.exec(String(selesai || '').trim());
            if (!m || !s) return '';

            const menitMulai = Number(m[1]) * 60 + Number(m[2]);
            const menitSelesai = Number(s[1]) * 60 + Number(s[2]);
            // Sama persis dianggap hari yang sama, bukan 24 jam penuh.
            if (menitSelesai >= menitMulai) return '';

            const t = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(String(tanggal || '').trim());
            if (!t) return '';
            const d = new Date(Number(t[3]), Number(t[2]) - 1, Number(t[1]));
            if (isNaN(d.getTime())) return '';
            d.setDate(d.getDate() + 1);

            return String(d.getDate()).padStart(2, '0') + '-' +
                   String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear();
        }

        /**
         * Kolom yang menentukan apakah dua baris gangguan "sama persis".
         * HARUS sama dengan GANGGUAN_KOLOM_TANDA di Module_Gangguan.gs -
         * kalau berbeda, peringatan di layar tidak akan cocok dengan apa yang
         * sebenarnya dilewati server, dan itu lebih membingungkan daripada
         * tidak ada peringatan sama sekali.
         */
        const KOLOM_TANDA_GANGGUAN = ['tanggal', 'waktuMulai', 'waktuSelesai', 'judul', 'noKa',
            'tempat', 'uraian', 'penyebab', 'tindakLanjut', 'jumlahKaBatal', 'nomorKaBatal',
            'kaTerganggu', 'kategori', 'unitTerkait', 'area', 'andil', 'kodefikasi', 'keterangan'];

        /** Tanda tangan isi satu baris - lihat gangguanTandaTangan_ di server. */
        function tandaTanganGangguan_(baris) {
            return KOLOM_TANDA_GANGGUAN.map(function (k) {
                const v = baris ? baris[k] : '';
                return String(v === undefined || v === null ? '' : v)
                    .replace(/\s+/g, ' ').trim().toUpperCase();
            }).join('\u0001');
        }

        /**
         * Memilah baris hasil baca Excel: mana yang benar-benar baru, mana yang
         * sudah ada, & mana yang kembar di dalam berkasnya sendiri.
         *
         * Dibandingkan dengan rincianGangguanData - salinan data yang sudah
         * ada di browser. Salinan itu bisa tertinggal beberapa menit dari
         * keadaan sebenarnya, jadi hasilnya adalah PERINGATAN AWAL, bukan
         * keputusan akhir; server memeriksanya sekali lagi saat menyimpan.
         *
         * Kembar di dalam satu berkas dipisah sendiri karena sebabnya berbeda:
         * itu bukan "sudah pernah diinput", melainkan baris yang tertulis dua
         * kali di berkas yang sama - biasanya karena hasil salin-tempel.
         */
        function pilahGandaExcel_(barisBaru) {
            const adaDiSistem = {};
            (rincianGangguanData || []).forEach(function (r) { adaDiSistem[tandaTanganGangguan_(r)] = r; });

            const unik = [], sudahAda = [], kembarBerkas = [];
            const terlihat = {};

            (barisBaru || []).forEach(function (b, i) {
                const tanda = tandaTanganGangguan_(b);
                const info = { no: i + 1, tanggal: b.tanggal, waktuMulai: b.waktuMulai, judul: b.judul, noKa: b.noKa };
                if (adaDiSistem[tanda]) { sudahAda.push(info); return; }
                if (terlihat[tanda]) { kembarBerkas.push(Object.assign({ samaDengan: terlihat[tanda] }, info)); return; }
                terlihat[tanda] = i + 1;
                unik.push(b);
            });

            return { unik: unik, sudahAda: sudahAda, kembarBerkas: kembarBerkas };
        }

        function parseGangguanExcelRows(rawRows) {
            const valid = [];
            let invalidCount = 0;
            const barisDitolak = [];   // baris yang TIDAK jadi diimpor, beserta alasannya
            const barisPerluDicek = []; // nomor baris (1-based, termasuk header) yang tanggal/waktunya lolos normalisasi tapi hasilnya TIDAK sesuai format baku - kemungkinan besar salah baca gara-gara Excel mengonversi ketikan user jadi tanggal versi lain (lihat catatan di normalizeTanggalDariExcel_)
            rawRows.forEach((row, rowIdx) => {
                const entry = {};
                let kolomWajibKosong = false;
                const kolomKosong = [];   // nama kolom yang wajib tapi kosong
                GANGGUAN_EXCEL_COLUMNS.forEach(col => {
                    let val = row[col.header];
                    if (col.field === 'tanggal') { val = normalizeTanggalDariExcel_(val); }
                    else if (col.field === 'waktuMulai' || col.field === 'waktuSelesai') { val = normalizeWaktuDariExcel_(val); }
                    else {
                        if (val === undefined || val === null) val = '';
                        val = String(val).trim();
                    }
                    // Yang dianggap kosong HANYA sel yang benar-benar tidak
                    // berisi apa-apa. Tanda "-" & angka "0" DITERIMA sebagai
                    // isian sah - itu cara pengisi menyatakan "sudah diperiksa,
                    // memang tidak ada", yang berbeda maknanya dari terlewat.
                    if (col.required && String(val).trim() === '') {
                        kolomWajibKosong = true;
                        kolomKosong.push(col.header);
                    }
                    entry[col.field] = val;
                });
                // Tanggal selesai DITURUNKAN, tidak lagi diminta. Ditaruh
                // setelah seluruh kolom terbaca supaya jam mulai & selesainya
                // sudah dinormalisasi lebih dulu.
                entry.tanggalSelesai = turunkanTanggalSelesai_(entry.tanggal, entry.waktuMulai, entry.waktuSelesai);

                if (kolomWajibKosong) {
                    // ═══ PERBAIKAN ═══
                    // Dulu baris yang ditolak hanya DIHITUNG lalu dibuang diam-diam,
                    // jadi dari 200 baris bisa masuk 100-an tanpa ada keterangan
                    // mana yang gagal & kenapa. Sekarang tiap penolakan dicatat
                    // lengkap dengan nomor barisnya di file Excel & kolom mana yang
                    // kosong, supaya bisa langsung diperbaiki di berkas aslinya.
                    invalidCount++;
                    barisDitolak.push({
                        baris: rowIdx + 2,   // +2: baris 1 header, index mulai 0
                        alasan: 'Kolom wajib kosong: ' + kolomKosong.join(', '),
                        judul: String(row['JUDUL'] || '(tanpa judul)').slice(0, 60),
                        tanggal: entry.tanggal || '(kosong)'
                    });
                    return;
                }

                // Validasi format AKHIR - kalau setelah dinormalisasi bentuknya
                // masih tidak persis "dd-MM-yyyy" / "HH:mm", besar kemungkinan
                // nilai aslinya ambigu (mis. Excel salah menebak lokal
                // dd/MM vs MM/dd) dan HASILNYA BISA SALAH TANPA KETAHUAN.
                // Baris tetap diimpor (supaya tidak menghalangi data lain),
                // tapi ditandai supaya user WAJIB cek manual dulu sebelum
                // menekan "Import Sekarang".
                const tanggalOk = /^\d{2}-\d{2}-\d{4}$/.test(entry.tanggal);
                const waktuMulaiOk = /^\d{2}:\d{2}$/.test(entry.waktuMulai);
                const waktuSelesaiOk = /^\d{2}:\d{2}$/.test(entry.waktuSelesai);
                if (!tanggalOk || !waktuMulaiOk || !waktuSelesaiOk) {
                    barisPerluDicek.push({ baris: rowIdx + 2, tanggal: entry.tanggal, waktuMulai: entry.waktuMulai, waktuSelesai: entry.waktuSelesai });
                }

                entry.kaBatalJumlah = parseInt(entry.kaBatalJumlah) || 0;
                entry.kaBatalNo = entry.kaBatalNo || '-';
                entry.andil = parseInt(entry.andil) || 0;
                entry.kategori = (String(entry.kategori).toUpperCase() === 'EKSTERNAL') ? 'EKSTERNAL' : 'INTERNAL';
                entry.kodeTipe = ['A', 'B', 'C'].includes(String(entry.kodeTipe).toUpperCase()) ? String(entry.kodeTipe).toUpperCase() : 'A';
                valid.push(entry);
            });
            return { valid, invalidCount, barisPerluDicek, barisDitolak };
        }

        function submitExcelImport() {
            if (!parsedGangguanExcelRows || parsedGangguanExcelRows.length === 0) {
                showToast('Belum ada berkas terbaca. Pilih file Excel yang valid terlebih dahulu.');
                return;
            }
            // Centang "jangan impor yang kembar" hanya ada bila memang ada
            // yang kembar; kalau tidak ada, penyaringan tetap menyala - server
            // yang akan memutuskan, dan tidak ada yang dirugikan.
            const kotak = document.getElementById('excel-lewati-ganda');
            const lewatiGanda = kotak ? kotak.checked : true;
            const gd = gandaExcelTerakhir_;
            const dikirim = (lewatiGanda && gd && gd.unik) ? gd.unik : parsedGangguanExcelRows;

            if (!dikirim.length) {
                showToast('Seluruh baris pada berkas ini sudah ada di sistem - tidak ada yang perlu diimpor.');
                return;
            }

            const btn = document.getElementById('btn-submit-excel-import');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Mengimpor...</span>';

            excelLewatiGanda_ = lewatiGanda;
            const dilewatiDiLayar = parsedGangguanExcelRows.length - dikirim.length;

            // Dikirim BERTAHAP - lihat kirimExcelBertahap_ untuk alasannya.
            kirimExcelBertahap_(dikirim, function (terkirim, gagal, dilewatiServer) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-file-excel"></i><span>Input by Excel</span>';

                if (terkirim > 0) {
                    closeInputMenuModal();
                    parsedGangguanExcelRows = [];
                    gandaExcelTerakhir_ = null;
                    document.getElementById('rincian-excel-file').value = '';
                    document.getElementById('label-excel-import').innerText = 'Seret File Excel (.xlsx) Rekapitulasi ke Sini';
                    loadRincianGangguan('rincian', true);
                }

                // Dua angka "dilewati" disebut terpisah karena sebabnya beda.
                // Yang di layar: ketahuan sejak pratinjau. Yang dari server:
                // baru ketahuan saat menyimpan - biasanya karena petugas lain
                // memasukkannya lebih dulu, beberapa menit yang lalu.
                const totalDilewati = dilewatiDiLayar + (dilewatiServer || 0);
                let pesanAkhir = terkirim + ' baris berhasil diimpor ke Rincian Gangguan.';
                if (totalDilewati) {
                    pesanAkhir = terkirim + ' baris diimpor, ' + totalDilewati + ' baris dilewati karena sudah ada';
                    pesanAkhir += (dilewatiServer ? ' (' + dilewatiServer + ' di antaranya baru ketahuan saat menyimpan).' : '.');
                }
                if (gagal > 0) pesanAkhir += ' ' + gagal + ' baris GAGAL dikirim - coba unggah ulang.';
                showToast(pesanAkhir);
            });
        }

        // ─── EXPORT (Excel & PDF, format mengikuti Book1.xlsx) ──────────

        function exportToExcel() {
            try {
                const headers = ['NO', 'TANGGAL', 'WAKTU MULAI', 'WAKTU SELESAI', 'JUDUL', 'NO KA', 'LOKASI',
                    'URAIAN', 'PENYEBAB', 'TINDAK LANJUT', 'JUMLAH KA BATAL', 'NOMOR KA BATAL', 'KA TERGANGGU',
                    'KATEGORI', 'UNIT TERKAIT', 'WILAYAH', 'ANDIL', 'KODEFIKASI', 'KETERANGAN TAMBAHAN'];
                const sumber = dataAktifRincian_();   // ikut pilihan bila mode pilih aktif
                const rows = sumber.map((item, idx) => [
                    idx + 1, formatTanggalDisplay(item.tanggal), formatWaktuDisplay(item.waktuMulai), formatWaktuDisplay(item.waktuSelesai),
                    item.judul, item.noKa, item.tempat, item.uraian, item.penyebab, item.tindakLanjut,
                    item.kaBatalJumlah, item.kaBatalNo, item.kaTerganggu, normalizeKategoriDisplay(item.kategori),
                    item.unitTerkait, item.area, item.andil, item.kodeTipe || 'A', item.keteranganTambahan || ''
                ]);
                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                ws['!cols'] = headers.map(h => ({ wch: (h === 'URAIAN' || h === 'TINDAK LANJUT') ? 40 : 18 }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Rincian Gangguan');
                XLSX.writeFile(wb, 'Rincian_Gangguan_KCI.xlsx');
                showToast(`${sumber.length} baris (sesuai filter aktif) berhasil diexport ke Excel (.xlsx)!`);
            } catch (err) {
                showToast('Gagal membuat berkas export.');
            }
        }

        /** Export/cetak SELURUH data yang sedang tampil (hasil filter aktif) sebagai laporan PDF rapi. */
        /**
         * Palet warna konsisten untuk pie chart Unit Terkait - dipakai
         * berulang (cycle) kalau unitnya lebih banyak dari jumlah warna.
         */
        const PIE_CHART_PALETTE = ['#107573', '#0c1d37', '#d4af37', '#7030a0', '#e11d48', '#0e7490', '#65a30d', '#c2410c'];

        /**
         * Membangun HTML pie chart (murni CSS conic-gradient, tanpa gambar/
         * canvas - supaya tetap tajam & pasti tercetak saat "Save as PDF")
         * berisi breakdown persentase per Unit Terkait, plus daftar
         * legenda di sampingnya.
         * @param {Object[]} list Data yang mau dihitung (sesuai filter aktif).
         * @return {string} HTML siap tempel.
         */
        function buildUnitPieChartHtml_(list) {
            const counts = {};
            list.forEach(item => { const u = item.unitTerkait || 'Lainnya'; counts[u] = (counts[u] || 0) + 1; });
            const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const total = list.length || 1;

            if (entries.length === 0) {
                return '<p style="color:#94A3B8;font-style:italic;font-size:11px;">Tidak ada data untuk grafik Unit Terkait.</p>';
            }

            let gradientParts = [];
            let cursor = 0;
            const legendRows = entries.map((entry, i) => {
                const [name, count] = entry;
                const pct = (count / total) * 100;
                const color = PIE_CHART_PALETTE[i % PIE_CHART_PALETTE.length];
                gradientParts.push(`${color} ${cursor.toFixed(2)}% ${(cursor + pct).toFixed(2)}%`);
                cursor += pct;
                return `
                    <div style="display:flex;align-items:center;margin-bottom:9px;">
                        <span style="width:4px;height:20px;border-radius:2px;background:${color};margin-right:9px;flex-shrink:0;"></span>
                        <span style="flex:1;font-size:10.5px;font-weight:700;color:#334155;">${escapeHtml(name)}</span>
                        <span style="font-size:11px;font-weight:900;color:#0C1D37;margin-left:8px;">${count}</span>
                        <span style="font-size:9px;font-weight:700;color:#94A3B8;margin-left:4px;width:38px;">(${pct.toFixed(1)}%)</span>
                    </div>`;
            }).join('');

            const gradient = gradientParts.join(', ');
            return `
                <div style="display:flex;align-items:center;gap:32px;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
                    <div style="flex-shrink:0;position:relative;width:172px;height:172px;">
                        <div style="width:172px;height:172px;border-radius:50%;background:conic-gradient(${gradient});box-shadow:0 4px 16px rgba(12,29,55,0.18);"></div>
                        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
                            <div style="width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #E2E8F0, 0 1px 3px rgba(0,0,0,0.06);display:flex;flex-direction:column;align-items:center;justify-content:center;">
                                <span style="font-size:23px;font-weight:900;color:#0C1D37;line-height:1;">${list.length}</span>
                                <span style="font-size:7px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px;margin-top:3px;">Kejadian</span>
                            </div>
                        </div>
                    </div>
                    <div style="flex:1;">${legendRows}</div>

        /**
         * Export/cetak data Rincian yang SEDANG TAMPIL (hasil filter aktif)

        // ================================================================

        // Sebelumnya hanya Rincian Gangguan yang punya export PDF, dengan
        // gaya sendiri. Sekarang ketiga submenu memakai KERANGKA YANG SAMA -

        // sehingga hasil cetaknya terasa satu keluarga. Yang berbeda hanya
        // isinya, sesuai konten masing-masing menu.
        //
        // Kenapa lewat jendela cetak browser & bukan pustaka PDF: hasilnya
        // memakai mesin cetak browser sendiri, jadi warna, tabel panjang, &
        // pemenggalan halaman ditangani dengan benar tanpa perlu mengatur
        // koordinat satu per satu. User tinggal memilih "Save as PDF".

        const PDF_WARNA = {
            navy: '#0c1d37', gold: '#d4af37', teal: '#107573',
            merah: '#e11d48', ungu: '#7030a0', abu: '#94a3b8', abuMuda: '#f1f5f9',

            // ── Palet korporat (mengikuti gaya paparan resmi KAI Commuter) ──
            // Dipakai oleh kerangka cetak di bawah. Warna lama di atas TIDAK
            // dihapus karena masih dirujuk puluhan kali oleh isi tabel di
            // ketiga menu - keduanya hidup berdampingan dengan rukun.
            biruTua: '#12275E',     // judul utama

        const PDF_STRIP = ['#E31E24', '#1B64B5', '#19A974', '#7030A0', '#E8871E', '#0E9594'];

        // ── Pembantu warna ──────────────────────────────────────────────
        // Kartu KPI gaya lama memakai blok warna pekat + tulisan putih.
        // Gaya korporat memakai kebalikannya: latar pastel lembut dengan
        // angka besar berwarna pekat. Supaya SELURUH pemanggil lama tetap
        // jalan tanpa diubah satu per satu, warna pastelnya DIHITUNG dari
        // warna pekat yang sudah mereka kirim.
        function hexKeRgb_(h) {
            h = String(h || '#000000').replace('#', '');
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            return [parseInt(h.slice(0, 2), 16) || 0, parseInt(h.slice(2, 4), 16) || 0, parseInt(h.slice(4, 6), 16) || 0];
        }
        function rgbKeHex_(r, g, b) {
            const f = function (n) { return ('0' + Math.max(0, Math.min(255, Math.round(n))).toString(16)).slice(-2); };
            return '#' + f(r) + f(g) + f(b);
        }
        /** Mencampur warna dengan putih; porsi 0 = asli, 1 = putih penuh. */
        function campurPutih_(hex, porsi) {
            const c = hexKeRgb_(hex);
            return rgbKeHex_(c[0] + (255 - c[0]) * porsi, c[1] + (255 - c[1]) * porsi, c[2] + (255 - c[2]) * porsi);
        }
        function gelapkan_(hex, porsi) {
            const c = hexKeRgb_(hex);
            return rgbKeHex_(c[0] * (1 - porsi), c[1] * (1 - porsi), c[2] * (1 - porsi));
        }
        /**
         * Pasangan warna kartu KPI dari satu warna pekat.
         * @return {{bg:string, fg:string}} latar pastel & warna angka.
         */
        function pastelDari_(hex) {
            const c = hexKeRgb_(hex);
            const terang = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
            return {
                bg: campurPutih_(hex, 0.88),
                // Warna terang (emas) terlalu pudar untuk angka - digelapkan
                // dulu supaya tetap terbaca saat dicetak hitam putih pun.
                fg: terang > 0.55 ? gelapkan_(hex, 0.38) : hex
            };
        }

                                color: #111; margin: 12pt 0 4pt; padding-bottom: 2pt; border-bottom: 0.6pt solid #111; }

                                letter-spacing: .4pt; padding: 4pt 4pt; border: 0.5pt solid #2b2b2b; }

            </style></head><body>
                <table class="layout kop"><tr>
                    <td>

                        <div class="kop-judul">${escapeHtml(opsi.judul)}</div>
                        ${opsi.subJudul ? `<div class="kop-sub">${escapeHtml(opsi.subJudul)}</div>` : ''}
                    </td>
                    <td class="kop-meta" style="width:42%">
                        Dicetak <b>${tglCetak}, ${jamCetak} WIB</b><br>

                        Sumber: Database KCI – COTP
                    </td>

        /** Membuka jendela cetak berisi dokumen yang sudah dirangkai. */
        function cetakDokumenPdf_(html) {
            const win = window.open('', '_blank');
            if (!win) { showToast('Popup diblokir browser - izinkan popup untuk mencetak PDF.'); return; }
            win.document.write(html);
            win.document.close();
            win.onload = function () { win.focus(); win.print(); };
        }

        /** Membuat tabel HTML dari daftar kolom & baris (gaya diatur CSS kerangka). */
        function tabelPdf_(kolom, baris) {
            const th = kolom.map(function (k) {
                return `<th style="width:${k.lebar || 'auto'};text-align:${k.rata || 'left'}">${escapeHtml(k.judul)}</th>`;
            }).join('');
            const tr = baris.map(function (r) {
                return '<tr>' + r.map(function (sel, i) {
                    const k = kolom[i] || {};
                    return `<td style="text-align:${k.rata || 'left'}">${sel}</td>`;
                }).join('') + '</tr>';
            }).join('');
            return `<table class="data"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
        }

        // ─── PDF 2: SUMMARY GANGGUAN ─────────────────────────────────────

        function exportSummaryToPDF() {
            if (!lastSummaryContext_) { showToast('Data belum siap, coba beberapa saat lagi.'); return; }
            const ctx = lastSummaryContext_;

            const tabelSebaran = function (judul, daftar, warna) {
                if (!daftar || !daftar.length) return '';
                const total = daftar.reduce(function (t, r) { return t + (r.value !== undefined ? r.value : r.nilai); }, 0) || 1;
                const baris = daftar.map(function (r, i) {
                    const nilai = r.value !== undefined ? r.value : r.nilai;
                    const nama = r.name !== undefined ? r.name : r.nama;
                    return [
                        `<span style="color:${PDF_WARNA.abu};font-weight:bold">${i + 1}</span>`,
                        `<b>${escapeHtml(nama)}</b>`,
                        `<b style="color:${warna}">${nilai}</b>`,
                        `${(nilai / total * 100).toFixed(1)}%`
                    ];
                });
                return `<div class="judul-bagian">${escapeHtml(judul)}</div>` + tabelPdf_([
                    { judul: 'NO', lebar: '6%', rata: 'center' }, { judul: 'NAMA', lebar: '56%' },
                    { judul: 'JUMLAH', lebar: '18%', rata: 'center' }, { judul: 'PORSI', lebar: '20%', rata: 'center' }
                ], baris);
            };

            const pieItems = (ctx.pieItems || []).map(function (r) { return { nama: r.nama, nilai: r.nilai }; });

            cetakDokumenPdf_(bangunDokumenPdf_({
                judul: 'Summary Rekapitulasi Gangguan',
                subJudul: `${ctx.filterLabel} - ${ctx.tahunLabel}`,
                filterTeks: `${ctx.filterLabel} | ${ctx.wilayahLabel} | ${ctx.unitLabel} | ${ctx.tahunLabel}`,
                kpi: [

                    { label: 'UNIT #1 ' + (ctx.top1 ? ctx.top1.label : '-'), nilai: String(ctx.top1 ? ctx.top1.val : 0), warna: PDF_WARNA.navy },
                    { label: 'UNIT #2 ' + (ctx.top2 ? ctx.top2.label : '-'), nilai: String(ctx.top2 ? ctx.top2.val : 0), warna: PDF_WARNA.ungu },
                    { label: 'UNIT #3 ' + (ctx.top3 ? ctx.top3.label : '-'), nilai: String(ctx.top3 ? ctx.top3.val : 0), warna: PDF_WARNA.merah },
                    { label: 'UNIT LAINNYA', nilai: String(ctx.lainnya ? ctx.lainnya.val : 0), warna: '#475569' }
                ],
                sorotan: ctx.dominan ? `Penyebab dominan pada cakupan ini: <u>${escapeHtml(ctx.dominan)}</u>.` : '',

            showToast('Summary disiapkan untuk dicetak - pilih "Save as PDF" di jendela cetak.');
        }

                    return [
                        `<span style="color:${PDF_WARNA.abu};font-weight:bold">${i + 1}</span>`,
                        `<b>${escapeHtml(r.nama)}</b>`,
                        `<b style="color:${warna}">${r.jumlah}</b>`,

            const kolom = [
                { judul: 'NO', lebar: '3%', rata: 'center' }, { judul: 'TANGGAL', lebar: '7%' },
                { judul: 'JUDUL', lebar: '18%' }, { judul: 'NO KA', lebar: '6%', rata: 'center' },
                { judul: 'JENIS SARANA', lebar: '9%', rata: 'center' }, { judul: 'STAMFORMASI', lebar: '9%', rata: 'center' },
                { judul: 'KOMPONEN', lebar: '9%', rata: 'center' }, { judul: 'ID GANGGUAN', lebar: '8%', rata: 'center' },
                { judul: 'ID SARANA', lebar: '9%', rata: 'center' },

                { judul: 'ANDIL', lebar: '5%', rata: 'center' },
                { judul: 'KODE', lebar: '4%', rata: 'center' }

            const kosong = `<span style="color:#cbd5e1">-</span>`;
            const baris = rows.map(function (it, i) {

                    `<span style="color:${PDF_WARNA.abu};font-weight:bold">${i + 1}</span>`,
                    `<b>${escapeHtml(formatTanggalDisplay(it.tanggal))}</b>`,

                    it.jenisSarana ? `<b style="color:${PDF_WARNA.teal}">${escapeHtml(it.jenisSarana)}</b>` : kosong,

                    it.idGangguan ? `<b>${escapeHtml(it.idGangguan)}</b>` : kosong,

                    { label: 'JENIS SARANA DOMINAN', nilai: topJenis ? topJenis.nama : '-', warna: PDF_WARNA.navy },

                    : '',

                   + paretoTabel('PARETO - KOMPONEN DOMINAN', 'komponen', PDF_WARNA.gold)

            }));
            showToast(`${rows.length} baris disiapkan untuk dicetak - pilih "Save as PDF" di jendela cetak.`);

        /** Rangkuman filter Rekap Sarana - untuk ditulis di kop dokumen cetak. */
        function ringkasFilterSarana_() {
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
            const bagian = [];
            const m = ambil('filter-sarana-tgl-mulai'), a = ambil('filter-sarana-tgl-akhir');
            if (m || a) bagian.push('Periode: ' + (m || '...') + ' s/d ' + (a || '...'));
            [['Tahun', 'filter-sarana-tahun'], ['Jenis Sarana', 'filter-sarana-jenis'],
             ['Komponen', 'filter-sarana-komponen'], ['ID Gangguan', 'filter-sarana-idgangguan']].forEach(function (p) {
                const v = ambil(p[1]);
                if (v && v !== 'Semua') bagian.push(p[0] + ': ' + v);
            });
            const cari = ambil('search-sarana-input');
            if (cari) bagian.push('Pencarian: "' + cari + '"');
            return bagian.length ? bagian.join('   |   ') : 'Seluruh data (tanpa filter khusus)';
        }

        /**

        function toggleExportMenu_(menuId) {

        // ── TEMPLATE RESMI (26 Okt 2026) ──────────────────────────────────
