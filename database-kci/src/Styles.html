<!--
  Styles.html
  Semua CSS kustom untuk seluruh halaman (dipisah dari markup supaya
  gampang dicari & diubah tanpa menyentuh file pane/menu lain).
  Tailwind CSS dimuat lewat CDN di Index.html; file ini hanya berisi
  override/utility class tambahan yang tidak ada di Tailwind bawaan.
-->
<style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: #f4f6f9;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(12, 29, 55, 0.05);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(12, 29, 55, 0.2);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(12, 29, 55, 0.4);
        }
        .filter-scroll::-webkit-scrollbar {
            display: none;
        }
        .filter-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .row-new {
            animation: highlightGold 2.5s ease-out;
        }
        @keyframes highlightGold {
            0% {
                background: rgba(212, 175, 55, 0.25);
            }
            100% {
                background: transparent;
            }
        }
        .text-kci-navy {
            color: #0c1d37;
        }
        .bg-kci-navy {
            background: #0c1d37;
        }
        .text-kci-red {
            color: #e11d48;
        }
        .bg-kci-red {
            background: #e11d48;
        }
        .text-kci-gold {
            color: #d4af37;
        }
        .bg-kci-gold {
            background: #d4af37;
        }
        .border-kci-gold {
            border-color: #d4af37;
        }
        .border-kci-red {
            border-color: #e11d48;
        }
        .sidebar-btn-active {
            color: #d4af37 !important;
            border-left: 2px solid #d4af37 !important;
            background: rgba(255, 255, 255, 0.06) !important;
        }
        .sidebar-btn {
            transition: all 0.2s;
        }
        .sidebar-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        .accordion-arrow {
            transition: transform 0.2s;
        }
        .accordion-arrow.open {
            transform: rotate(90deg);
        }
        /* modal backdrop */
        .modal-backdrop {
            background: rgba(12, 29, 55, 0.7);
            backdrop-filter: blur(4px);
        }
        /* card hover */
        .stat-card {
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        /* table sticky header */
        .sticky-header th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        /* toggle switch */
        .toggle-track {
            transition: background 0.2s;
        }
        .toggle-thumb {
            transition: transform 0.2s;
        }
        .toggle-track.active {
            background: #0c1d37;
        }
        .toggle-track.active .toggle-thumb {
            transform: translateX(100%);
        }
        /* print-friendly */
        /* ══════════════════════════════════════════════════════════════
           TAMPILAN PONSEL  (lebar layar 767px ke bawah)
           ══════════════════════════════════════════════════════════════

           Aplikasi ini disusun untuk layar lebar: sidebar 20rem yang selalu
           tampak, isi ber-padding 2rem, & tabel selebar 15 kolom. Di layar
           ponsel ketiganya tidak sekadar sempit - mereka membuat isinya tidak
           bisa dibaca sama sekali.

           Batasnya dipasang di 767px, sama dengan titik `md` milik Tailwind,
           supaya kelas seperti `md:flex` yang sudah dipakai di beberapa berkas
           tetap sejalan dengan aturan di sini. Tablet (768px ke atas) tetap
           memakai tata letak lebar.

           Seluruh aturan di bawah ditulis sebagai media query murni, BUKAN
           bergantung pada kelas yang dipasang JavaScript. Kalau JavaScript-nya
           gagal dimuat, tata letaknya tetap menyesuaikan; yang hilang hanya
           label pada tabel kartu.
           ══════════════════════════════════════════════════════════════ */
        @media (max-width: 767px) {

            /* ── Kerangka: sidebar jadi laci yang menggeser dari kiri ── */
            #main-sidebar {
                position: fixed;
                top: 0; bottom: 0; left: 0;
                width: 17.5rem !important;
                transform: translateX(-100%);
                transition: transform .26s cubic-bezier(.4, 0, .2, 1);
                z-index: 100;
            }
            body.laci-buka #main-sidebar { transform: translateX(0); }

            /* Ragam sidebar yang menyempit tidak dipakai di ponsel: di laci
               yang menutupi layar, menyempitkannya jadi 5rem tidak ada
               gunanya & hanya menyisakan ikon tanpa keterangan. */
            #sidebar-collapsed-view { display: none !important; }
            #sidebar-expanded-view { display: flex !important; }

            #laci-backdrop { display: none; }
            body.laci-buka #laci-backdrop {
                display: block;
                position: fixed; inset: 0;
                background: rgba(15, 23, 42, .55);
                backdrop-filter: blur(2px);
                z-index: 99;
            }
            /* Isi halaman dikunci saat laci terbuka supaya gulirannya tidak
               menembus ke belakang laci - kebiasaan yang membingungkan di
               layar sentuh. */
            body.laci-buka { overflow: hidden; }

            /* ── Ruang layar dipakai sehemat mungkin ── */
            #main-scroll { padding: 0.7rem !important; }
            #main-scroll > .space-y-6 > * + * { margin-top: 0.9rem !important; }
            header.bg-white { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
            #page-title { font-size: 0.8rem !important; }

            /* ── Huruf terkecil dinaikkan sedikit ──
               9-10px terbaca di layar 27 inci berjarak 60cm, tidak di layar
               genggam. Dinaikkan satu tingkat, bukan lebih: menaikkannya
               terlalu jauh membuat tabel pecah ke mana-mana. */
            #main-scroll .text-\[9px\]  { font-size: 10px !important; }
            #main-scroll .text-\[10px\] { font-size: 11px !important; }
            #main-scroll .text-\[11px\] { font-size: 12px !important; }

            /* ── Petak berjajar diciutkan ──
               Tiga kolom ke atas tidak muat di layar selebar ±360px. Turun ke
               dua, bukan satu: kartu angka ringkas justru lebih enak dibaca
               berdampingan daripada menumpuk sepanjang layar. */
            #main-scroll .grid-cols-3,
            #main-scroll .grid-cols-4,
            #main-scroll .grid-cols-5,
            #main-scroll .grid-cols-6 {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }
            /* Kecuali petak yang berisi ISIAN - kolom isian yang sempit
               memaksa orang mengetik di ruang selebar dua kata. Satu kolom.
               Memakai :has(); browser lama yang belum mendukungnya hanya
               kehilangan penghalusan ini, tata letaknya tetap benar. */
            #main-scroll .grid:has(> div > input),
            #main-scroll .grid:has(> div > select),
            #main-scroll .grid:has(> div > textarea),
            #main-scroll .grid:has(> input),
            #main-scroll .grid:has(> select) {
                grid-template-columns: minmax(0, 1fr) !important;
            }

            /* ── Bilah tombol & penyaring dibuat melipat ── */
            #main-scroll .flex.items-center.justify-between { flex-wrap: wrap; gap: .5rem; }
            #main-scroll .overflow-x-auto { -webkit-overflow-scrolling: touch; }

            /* Sasaran sentuh: tombol setinggi 20px sulit dikenai jari. */
            #main-scroll button, #main-scroll select, #main-scroll input[type="date"],
            #main-scroll input[type="month"] { min-height: 38px; }

            /* ══ TABEL MENJADI KARTU ══
               Tabel 15 kolom di layar 360px hanya menyisakan 24px per kolom -
               tidak terbaca sekeras apa pun kita menggesernya.

               Tiap baris diubah jadi satu kartu, & tiap sel jadi satu baris
               "Label : Nilai". Labelnya diambil JavaScript dari baris judul
               masing-masing tabel (lihat labeliTabelPonsel_ di
               SharedScripts.html), jadi tidak ada satu pun berkas pane yang
               perlu disentuh - & tabel yang ditambahkan nanti ikut tertangani
               dengan sendirinya. */
            .tabel-kartu table { display: block; width: 100% !important; min-width: 0 !important; }
            .tabel-kartu thead { display: none; }
            .tabel-kartu tbody { display: block; }
            .tabel-kartu tbody tr {
                display: block;
                background: #fff;
                border: 1px solid #e2e8f0;
                border-radius: 14px;
                padding: 0.35rem 0.75rem;
                margin-bottom: 0.6rem;
                box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
            }
            .tabel-kartu tbody tr:last-child { margin-bottom: 0; }
            .tabel-kartu tbody td {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 0.75rem;
                width: auto !important;
                max-width: none !important;
                white-space: normal !important;
                text-align: right !important;
                padding: 0.4rem 0 !important;
                border: 0 !important;
                border-bottom: 1px dashed #f1f5f9 !important;
            }
            .tabel-kartu tbody tr td:last-child { border-bottom: 0 !important; }
            .tabel-kartu tbody td::before {
                content: attr(data-label);
                flex: 0 0 40%;
                text-align: left;
                font-size: 9px;
                font-weight: 800;
                letter-spacing: .04em;
                text-transform: uppercase;
                color: #94a3b8;
                padding-top: 1px;
            }
            /* Sel tanpa judul kolom (kotak centang, tombol aksi) tampil
               melebar penuh tanpa label kosong yang menyita ruang. */
            .tabel-kartu tbody td[data-label=""]::before,
            .tabel-kartu tbody td:not([data-label])::before { display: none; }
            .tabel-kartu tbody td[data-label=""] { justify-content: flex-end; }
            /* Baris "tidak ada data" memakai colspan - jangan dibuat berlabel. */
            .tabel-kartu tbody td[colspan]::before { display: none; }
            .tabel-kartu tbody td[colspan] { justify-content: center; text-align: center !important; }
            .tabel-kartu tbody td[colspan] { border-bottom: 0 !important; }

            /* ══ TABEL MATRIKS TETAP DIGESER ══
               Kalender roster & sejenisnya punya satu kolom per tanggal.
               Menjadikannya kartu berarti 31 baris "Label : Nilai" per orang -
               jauh lebih buruk daripada menggesernya. Kolom pertamanya
               dilekatkan supaya nama petugasnya tetap terlihat saat digeser. */
            .tabel-geser { overflow-x: auto; }
            .tabel-geser table { min-width: 640px; }
            .tabel-geser thead th:first-child,
            .tabel-geser tbody td:first-child {
                position: sticky; left: 0; z-index: 2;
            }
            .tabel-geser tbody td:first-child { background: #fff; }

            /* ── Modal jadi lembar yang naik dari bawah ──
               Modal melayang di tengah menyisakan ruang kosong di atas & bawah
               yang tidak terpakai, sementara isinya sendiri berdesakan. Di
               ponsel ia ditempelkan ke dasar layar & dibiarkan setinggi
               mungkin - bentuk yang sudah dikenal dari aplikasi ponsel lain. */
            .modal-backdrop { padding: 0 !important; align-items: flex-end !important; }
            .modal-backdrop > div {
                width: 100% !important;
                max-width: 100% !important;
                max-height: 94vh !important;
                border-bottom-left-radius: 0 !important;
                border-bottom-right-radius: 0 !important;
            }
            .modal-backdrop > div > div:last-child { flex-wrap: wrap; gap: .5rem; }
            .modal-backdrop > div > div:last-child > button { flex: 1 1 auto; justify-content: center; }

            /* Sel yang memang kosong tidak perlu menampilkan labelnya.
               Pada tabel Resume yang dikelompokkan per tanggal, kolom tanggal
               sengaja dikosongkan di dalam kelompok - sebagai kartu ia akan
               tampil sebagai "TANGGAL : " tanpa isi, yaitu baris yang tidak
               memberi tahu apa pun. */
            .tabel-kartu tbody td:empty { display: none; }

            /* Modal digambar langsung ke dalam body, di luar #main-scroll,
               jadi penyesuaian ukuran huruf di atas tidak menjangkaunya. */
            .modal-backdrop .text-\[9px\]  { font-size: 10px !important; }
            .modal-backdrop .text-\[10px\] { font-size: 11px !important; }
            .modal-backdrop .text-\[11px\] { font-size: 12px !important; }
            .modal-backdrop button, .modal-backdrop select, .modal-backdrop input { min-height: 38px; }
            .modal-backdrop .grid-cols-2,
            .modal-backdrop .grid-cols-3 { grid-template-columns: minmax(0, 1fr) !important; }

            /* Halaman tidak boleh bergeser mendatar. Tabel lebar tetap bisa
               digeser karena pembungkusnya punya gulir sendiri; yang dicegah
               di sini adalah SELURUH halaman ikut melar & membuat sidebar
               serta header ikut bergeser saat digulir ke samping. */
            #main-scroll { overflow-x: hidden !important; }

            /* Kotak pesan menempel di puncak layar & tidak melebihi lebarnya. */
            #custom-toast { width: calc(100vw - 1.2rem) !important; top: 0.6rem !important; }
        }

        /* Tombol laci hanya ada di ponsel - di layar lebar sidebar-nya memang
           selalu tampak, jadi tombolnya tidak punya guna. */
        @media (min-width: 768px) {
            #btn-laci { display: none !important; }
        }

        @media print {
            .no-print {
                display: none !important;
            }
            .print-block {
                display: block !important;
            }
        }

        /* Tab pemilih arsip di menu Peraturan Perusahaan.
           Warna aktif/nonaktif diatur lewat class dari JavaScript
           (terapkanArsipSubMenu_); di sini hanya transisi & kursornya. */
        .arsip-tab { cursor: pointer; }
        .arsip-tab:focus { outline: none; }

        /* Memotong keterangan dokumen jadi maksimal 2 baris di tabel arsip -
           supaya tinggi tiap baris tetap seragam walau keterangannya panjang. */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
</style>
