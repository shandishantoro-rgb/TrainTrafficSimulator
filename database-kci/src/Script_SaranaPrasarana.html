        function closeEmpDocEditSubModal() {
            document.getElementById('emp-doc-edit-submodal').classList.add('hidden');
            empDocSedangDiperbaiki = null;
            empHalamanPerbaikan = [];
            empBerkasAsliPerbaikan = null;
        }

        /** Konversi berkas pengganti begitu dipilih (tanpa deretan gambar - cukup ringkasan). */
        async function handleEmpDocEditFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const status = document.getElementById('emp-docedit-status');
            const kotakPv = document.getElementById('emp-docedit-preview');
            const stripPv = document.getElementById('emp-docedit-preview-strip');
            const judulPv = document.getElementById('emp-docedit-preview-title');

            status.classList.remove('hidden');
            status.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[#d4af37] mr-1.5"></i>Mengubah berkas jadi JPG...';
            kotakPv.classList.remove('hidden');
            stripPv.innerHTML = '<div class="flex items-center gap-2.5 text-slate-400 py-4"><i class="fa-solid fa-circle-notch fa-spin text-[#d4af37]"></i><span class="text-[11px] font-bold">Menyiapkan pratinjau...</span></div>';
            judulPv.textContent = 'Pratinjau Berkas Pengganti';
            empHalamanPerbaikan = [];
            empBerkasAsliPerbaikan = null;
            try {
                const hasil = await empKonversiBerkasKeJpg_(file, function (selesai, total, ket) {
                    status.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-[#d4af37] mr-1.5"></i>${escapeHtml(ket)} (${selesai}/${total})`;
                });
                empBerkasAsliPerbaikan = { base64: await empBacaFileSebagaiBase64_(file), name: file.name, mimeType: file.type || 'application/octet-stream' };
                if (hasil.pages.length === 0) {
                    status.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1.5"></i>' + escapeHtml(hasil.alasan || 'Berkas tidak bisa dikonversi.');
                    stripPv.innerHTML = '<div class="flex items-start gap-3 text-slate-300 py-2">' +
                        '<i class="fa-solid fa-triangle-exclamation text-2xl text-amber-400 shrink-0"></i>' +
                        '<div class="flex-1 min-w-0 text-left"><p class="text-xs font-bold break-all">' + escapeHtml(file.name) + '</p>' +
                        '<p class="text-[10px] text-slate-500 mt-0.5">Tidak bisa dipratinjau, tapi berkasnya tetap tersimpan utuh.</p></div></div>';
                    return;
                }
                empHalamanPerbaikan = hasil.pages;
                const totalByte = hasil.pages.reduce(function (t, p) { return t + p.base64.length * 0.75; }, 0);
                status.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500 mr-1.5"></i>Siap menggantikan isi versi ini: <strong>${escapeHtml(file.name)}</strong> - ${hasil.pages.length} halaman (${empFormatUkuran_(totalByte)}).`;

                judulPv.textContent = `Pratinjau Berkas Pengganti - ${hasil.pages.length} halaman (${empFormatUkuran_(totalByte)})`;
                stripPv.innerHTML = hasil.pages.map(function (p, i) {
                    return `<div class="inline-block align-top mr-2 mb-2 text-center">
                        <img src="data:image/jpeg;base64,${p.base64}" class="h-40 rounded-lg border border-slate-800 bg-white" alt="Halaman ${i + 1}">
                        <p class="text-[9px] text-slate-500 font-bold mt-1">Hal. ${i + 1} &middot; ${p.lebar}&times;${p.tinggi}px</p>
                    </div>`;
                }).join('');
            } catch (err) {
                status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-500 mr-1.5"></i>' + escapeHtml('Gagal memproses berkas: ' + (err.message || err));
                stripPv.innerHTML = '<div class="flex items-center gap-2.5 text-red-300 py-3"><i class="fa-solid fa-circle-exclamation"></i><span class="text-[11px] font-bold">Pratinjau tidak tersedia.</span></div>';
            }
        }

        async function simpanEmpDocEdit() {
            if (!empDocSedangDiperbaiki) return;
            const docId = empDocSedangDiperbaiki.id;
            const versi = empDocSedangDiperbaiki.versi;
            const catatan = document.getElementById('emp-docedit-catatan').value.trim();
            const adaBerkasBaru = empHalamanPerbaikan.length > 0 || !!empBerkasAsliPerbaikan;

            const btn = document.getElementById('emp-docedit-save-btn');
            const htmlAsli = btn.innerHTML;
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Menyimpan...</span>';

            function tutup(pesan) {
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
                btn.innerHTML = htmlAsli;
                if (pesan) {
                    closeEmpDocEditSubModal();
                    showToast(pesan);
                    empPageCache = {}; // gambar lama sudah tidak berlaku
                    empMuatUlangUntukModalEdit_();
                }
            }

            try {
                // Data stasiun & tanggal dokumen disimpan lebih dulu - keduanya
                // berlaku baik saat berkasnya diganti maupun tidak.
                const hasilData = await simpanDataStasiunDariPerbaikan_(docId);
                if (hasilData && hasilData.gagal) { showToast(hasilData.pesan); tutup(); return; }

                // Hanya catatan & data yang diubah - berkasnya tidak disentuh.
                if (!adaBerkasBaru) {
                    const res = await empPanggil_('sap_emplasemen_updateDocNote', [currentSessionToken, docId, catatan]);
                    if (!res.success) { showToast('Gagal menyimpan: ' + (res.message || '')); tutup(); return; }
                    tutup('Data & catatan versi ' + versi + ' diperbarui.');
                    return;
                }

                const setujuGanti = await konfirmasi_({
                    judul: 'Ganti isi dokumen versi ' + versi + '?',
                    pesan: 'Seluruh halaman dan berkas asli versi ini akan <strong>dihapus permanen</strong> dari Google Drive, lalu digantikan berkas baru. Nomor versi dan statusnya tidak berubah.',
                    rincian: '<i class="fa-solid fa-arrows-rotate text-amber-500 mr-1.5"></i>Isi lama versi ' + versi + ' tidak bisa dikembalikan',
                    ya: 'Ya, Ganti Isinya', ikonYa: 'fa-arrows-rotate', bahaya: false
                });
                if (!setujuGanti) { tutup(); return; }

                const bar = document.getElementById('emp-docedit-progress');
                const barIsi = document.getElementById('emp-docedit-progress-bar');
                const barTeks = document.getElementById('emp-docedit-progress-text');
                bar.classList.remove('hidden');
                const total = empHalamanPerbaikan.length;
                function progres(n, teks) {
                    barIsi.style.width = Math.round((n / (total + 1)) * 100) + '%';
                    barTeks.innerText = teks;
                }

                progres(0, 'Menghapus berkas lama dari Drive...');
                const mulai = await empPanggil_('sap_emplasemen_beginReplaceDoc', [currentSessionToken, docId, {
                    namaAsli: empBerkasAsliPerbaikan ? empBerkasAsliPerbaikan.name : '',
                    mimeAsli: empBerkasAsliPerbaikan ? empBerkasAsliPerbaikan.mimeType : ''
                }]);
                if (!mulai.success) throw new Error(mulai.message || 'Gagal menyiapkan penggantian.');

                for (let i = 0; i < total; i++) {
                    progres(i + 1, `Mengunggah halaman ${i + 1} dari ${total}...`);
                    const pg = empHalamanPerbaikan[i];
                    const res = await empPanggil_('sap_emplasemen_addDocPage', [currentSessionToken, docId, i + 1, pg.base64, pg.lebar, pg.tinggi]);
                    if (!res.success) throw new Error(res.message || ('Halaman ' + (i + 1) + ' gagal diunggah.'));
                }

                progres(total + 1, 'Menyelesaikan...');
                const simpanAsli = document.getElementById('emp-docedit-simpan-asli').checked || total === 0;
                const tutupRes = await empPanggil_('sap_emplasemen_finishReplaceDoc', [
                    currentSessionToken, docId,
                    simpanAsli && empBerkasAsliPerbaikan ? empBerkasAsliPerbaikan.base64 : null,
                    simpanAsli && empBerkasAsliPerbaikan ? empBerkasAsliPerbaikan.name : null,
                    simpanAsli && empBerkasAsliPerbaikan ? empBerkasAsliPerbaikan.mimeType : null,
                    catatan
                ]);
                if (!tutupRes.success) throw new Error(tutupRes.message || 'Gagal menutup penggantian.');
                tutup('Dokumen versi ' + versi + ' berhasil diperbaiki.');
            } catch (err) {
                console.log('[emp perbaiki dokumen] gagal:', err);
                showToast('Gagal memperbaiki dokumen: ' + (err.message || err));
                tutup();
            }
        }

        /** Unduh berkas asli (pra-konversi) satu versi dokumen. */
        function empUnduhBerkasAsli(docId) {
            showToast('Menyiapkan berkas asli...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal: ' + (res.message || '')); return; }
                    empUnduhDataUri_(res.base64, res.mimeType, res.fileName);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat mengambil berkas asli.'); })
                .sap_emplasemen_getOriginalFile(currentSessionToken, docId);
        }

        /**
         * Memicu unduhan dari data URI + atribut download - satu-satunya cara
         * mengunduh yang konsisten dari dalam iframe sandbox Apps Script
         * (Blob URL diblokir di lingkungan ini).
         */
        function empUnduhDataUri_(base64, mimeType, fileName) {
            try {
                const a = document.createElement('a');
                a.href = 'data:' + (mimeType || 'application/octet-stream') + ';base64,' + base64;
                a.download = fileName || 'dokumen';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (err) {
                console.log('[emp unduh] gagal:', err);
                showToast('Unduhan diblokir browser.');
            }
        }

        // ─── VIEWER: preview dengan zoom & geser ──────────────────────────

        function openEmpPreviewModal(id) {
            const station = empStations.find(s => s.id === id);
            if (!station) return;
            const docAktif = (station.docs || []).find(function (d) { return d.id === station.docAktifId; }) || (station.docs || [])[0] || null;
            empBukaViewer_(station, docAktif);
        }

        /**
         * Membuka viewer dokumen. Yang diminta ke server HANYA halaman yang
         * sedang dilihat (halaman 1 lebih dulu) - halaman lain menyusul di
         * latar belakang. Halaman yang sudah pernah diambil tersimpan di
         * empPageCache, jadi membuka ulang stasiun yang sama seketika tanpa
         * permintaan apa pun ke server.
         * @param {Object} station
         * @param {Object|null} doc Versi dokumen yang mau ditampilkan.
         */
        function empBukaViewer_(station, doc) {
            activeEmpStation = station;
            empViewerDoc = doc;
            empViewerHalaman = 1;
            empViewerRotasi = 0;
            empResetZoom();

            document.getElementById('emp-preview-title').innerText = `Layout ${station.nama} (${station.singkatan})`;
            document.getElementById('emp-preview-subtitle').innerText =
                `${station.wilayah} • Status: ${station.status}` + (doc ? ` • Dokumen v${doc.versi} (${doc.jumlahHalaman} halaman)` : '');
            empResetPreviewSize();
            document.getElementById('emp-preview-modal').classList.remove('hidden');

            if (!doc || !doc.pages || doc.pages.length === 0) {
                empSetDocViewState(doc ? 'openexternal' : 'empty');
                if (doc) {
                    document.getElementById('emp-doc-openexternal-name').innerText = doc.namaAsli || 'Berkas';
                    document.getElementById('emp-doc-openexternal-desc').innerText =
                        'Versi ini tersimpan sebagai berkas asli saja (format yang tidak bisa diubah jadi gambar). Silakan unduh berkasnya.';
                }
                return;
            }
            empTampilkanHalaman_(1);
            empPrefetchHalamanLain_(doc);
        }

        /** Tampilkan tepat SATU state di dalam modal Preview. */
        function empSetDocViewState(state) {
            const idMap = { loading: 'emp-doc-loading', empty: 'emp-doc-empty', image: 'emp-doc-stage', openexternal: 'emp-doc-openexternal', 'doc-error': 'emp-doc-error' };
            Object.keys(idMap).forEach(function (key) {
                document.getElementById(idMap[key]).classList.toggle('hidden', key !== state);
            });
            document.getElementById('emp-doc-toolbar').classList.toggle('hidden', state !== 'image');
        }

        /**
         * Menampilkan satu halaman. Kalau gambarnya sudah ada di cache,
         * tampil seketika; kalau belum, diambil dari server sekali lalu
         * disimpan ke cache.
         * @param {number} nomor Nomor halaman (mulai 1).
         */
        function empTampilkanHalaman_(nomor) {
            if (!empViewerDoc || !empViewerDoc.pages.length) return;
            const total = empViewerDoc.pages.length;
            empViewerHalaman = Math.min(Math.max(1, nomor), total);
            const page = empViewerDoc.pages[empViewerHalaman - 1];
            document.getElementById('emp-doc-page-info').innerText = `Halaman ${empViewerHalaman} / ${total}`;
            document.getElementById('emp-doc-prev-btn').disabled = empViewerHalaman <= 1;
            document.getElementById('emp-doc-next-btn').disabled = empViewerHalaman >= total;

            const img = document.getElementById('emp-doc-image');
            if (empPageCache[page.id]) {
                img.src = empPageCache[page.id];
                empSetDocViewState('image');
                empTerapkanTransformasi_();
                return;
            }

            empSetDocViewState('loading');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) {
                        document.getElementById('emp-doc-error-desc').innerText = res.message || 'Halaman ini gagal diambil dari Drive.';
                        empSetDocViewState('doc-error');
                        return;
                    }
                    empPageCache[page.id] = 'data:' + (res.mimeType || 'image/jpeg') + ';base64,' + res.base64;
                    // Kalau user sudah pindah halaman/stasiun sebelum ini datang, jangan timpa tampilan.
                    if (empViewerDoc && empViewerDoc.pages[empViewerHalaman - 1] && empViewerDoc.pages[empViewerHalaman - 1].id === page.id) {
                        img.src = empPageCache[page.id];
                        empSetDocViewState('image');
                        empTerapkanTransformasi_();
                    }
                })
                .withFailureHandler(function () {
                    document.getElementById('emp-doc-error-desc').innerText = 'Terjadi kesalahan saat mengambil halaman dokumen.';
                    empSetDocViewState('doc-error');
                })
                .sap_emplasemen_getPageImage(currentSessionToken, page.id);
        }

        /**
         * Mengambil halaman-halaman lain diam-diam di latar belakang, satu per
         * satu (tidak berbarengan, supaya tidak menyita jatah permintaan &
         * memperlambat halaman yang sedang dilihat). Hasilnya: pindah halaman
         * saat presentasi terasa tanpa jeda.
         */
        /**
         * Mengambil sisa halaman dokumen diam-diam di latar belakang, dalam
         * panggilan BORONGAN (bukan satu per satu seperti sebelumnya) - satu
         * panggilan bisa membawa beberapa halaman sekaligus, sehingga ongkos
         * tetap tiap panggilan cuma dibayar sekali. Server memotong sendiri
         * kalau responsnya sudah terlalu besar, dan sisanya diminta lagi di
         * putaran berikutnya.
         * @param {Object} doc
         */
        function empPrefetchHalamanLain_(doc) {
            const sisa = doc.pages.filter(function (p) { return !empPageCache[p.id]; }).map(function (p) { return p.id; });
            if (!sisa.length) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) return;
                    if (!empViewerDoc || empViewerDoc.id !== doc.id) return; // dokumen sudah ditutup/diganti
                    (res.items || []).forEach(function (it) {
                        empPageCache[it.pageId] = 'data:' + (it.mimeType || 'image/jpeg') + ';base64,' + it.base64;
                    });
                    // Kalau server memotong karena ukuran, lanjutkan sisanya.
                    if ((res.items || []).length && (res.items || []).length < sisa.length) empPrefetchHalamanLain_(doc);
                })
                .withFailureHandler(function () { /* diabaikan - halaman tetap bisa diambil satuan saat dibuka */ })
                .sap_emplasemen_getPagesBatch(currentSessionToken, sisa);
        }

        function empHalamanSebelumnya() { empTampilkanHalaman_(empViewerHalaman - 1); }
        function empHalamanBerikutnya() { empTampilkanHalaman_(empViewerHalaman + 1); }

        // Zoom & geser - dibuat untuk dipakai saat presentasi: perbesar
        // bagian tertentu layout lalu geser dengan menyeret mouse.

        /**
         * Menerapkan geser + zoom + ROTASI sekaligus ke satu CSS transform.
         * Urutannya penting: translate dulu, lalu scale, baru rotate - dengan
         * urutan ini arah menyeret tetap terasa wajar bagi user walau
         * gambarnya sedang diputar.
         */
        function empTerapkanTransformasi_() {
            const img = document.getElementById('emp-doc-image');
            img.style.transform = `translate(${empViewerPanX}px, ${empViewerPanY}px) scale(${empViewerZoom}) rotate(${empViewerRotasi}deg)`;
            document.getElementById('emp-doc-zoom-label').innerText = Math.round(empViewerZoom * 100) + '%';
            const labelRotasi = document.getElementById('emp-doc-rotate-label');
            if (labelRotasi) labelRotasi.innerText = empViewerRotasi + '\u00B0';
            img.style.cursor = empViewerZoom > 1 ? 'grab' : 'default';
        }

        /**
         * Memutar gambar 90 derajat. Nilainya selalu dijaga di rentang
         * 0-359 dengan sisa bagi, jadi memutar terus-menerus ke arah mana pun
         * akan kembali sendiri ke 0 setelah satu putaran penuh - tidak pernah
         * menumpuk jadi angka besar atau negatif.
         * @param {number} derajat +90 (kanan) atau -90 (kiri).
         */
        function empPutar(derajat) {
            empViewerRotasi = (empViewerRotasi + derajat + 360) % 360;
            empTerapkanTransformasi_();
        }
        function empPutarKiri() { empPutar(-90); }
        function empPutarKanan() { empPutar(90); }
        function empResetRotasi() { empViewerRotasi = 0; empTerapkanTransformasi_(); }

        function empZoomIn() { empViewerZoom = Math.min(empViewerZoom * 1.25, 8); empTerapkanTransformasi_(); }
        function empZoomOut() {
            empViewerZoom = Math.max(empViewerZoom / 1.25, 0.25);
            if (empViewerZoom <= 1) { empViewerPanX = 0; empViewerPanY = 0; } // kembali ke tengah saat sudah tidak diperbesar
            empTerapkanTransformasi_();
        }
        /** Kembalikan tampilan ke keadaan awal: zoom 100%, tanpa geser, tanpa putaran. */
        function empResetZoom() {
            empViewerZoom = 1; empViewerPanX = 0; empViewerPanY = 0; empViewerRotasi = 0;
            empTerapkanTransformasi_();
        }

        /** Zoom dengan roda mouse (tanpa perlu menekan tombol apa pun di dalam area gambar). */
        function empWheelZoom(e) {
            if (!empViewerDoc) return;
            e.preventDefault();
            if (e.deltaY < 0) empZoomIn(); else empZoomOut();
        }

        function empMulaiGeser(e) {
            if (empViewerZoom <= 1) return;
            empViewerDragging = true;
            empViewerDragStartX = e.clientX - empViewerPanX;
            empViewerDragStartY = e.clientY - empViewerPanY;
            document.getElementById('emp-doc-image').style.cursor = 'grabbing';
        }
        function empSedangGeser(e) {
            if (!empViewerDragging) return;
            empViewerPanX = e.clientX - empViewerDragStartX;
            empViewerPanY = e.clientY - empViewerDragStartY;
            empTerapkanTransformasi_();
        }
        function empSelesaiGeser() {
            if (!empViewerDragging) return;
            empViewerDragging = false;
            document.getElementById('emp-doc-image').style.cursor = empViewerZoom > 1 ? 'grab' : 'default';
        }

        function closeEmpPreviewModal() {
            document.getElementById('emp-preview-modal').classList.add('hidden');
            empViewerDoc = null;
            empSelesaiGeser();
        }

        /** Kembalikan modal Preview ke ukuran normal. */
        function empResetPreviewSize() {
            empPreviewFullscreen = false;
            const modal = document.getElementById('emp-preview-modal');
            const card = document.getElementById('emp-preview-card');
            const btn = document.getElementById('emp-fullscreen-btn');
            if (modal) modal.classList.add('p-4');
            if (card) card.className = 'bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[88vh] flex flex-col overflow-hidden border border-slate-700';
            if (btn) btn.innerHTML = '<i class="fa-solid fa-expand"></i> Layar Penuh';
        }

        /** Perbesar modal memenuhi layar - murni CSS (bukan Fullscreen API), supaya tetap konsisten di dalam iframe Apps Script. */
        function empTogglePreviewFullscreen() {
            empPreviewFullscreen = !empPreviewFullscreen;
            const modal = document.getElementById('emp-preview-modal');
            const card = document.getElementById('emp-preview-card');
            const btn = document.getElementById('emp-fullscreen-btn');
            if (empPreviewFullscreen) {
                modal.classList.remove('p-4');
                card.className = 'bg-white shadow-2xl w-full h-full flex flex-col overflow-hidden';
                btn.innerHTML = '<i class="fa-solid fa-compress"></i> Kecilkan';
            } else {
                empResetPreviewSize();
            }
        }

        /** Unduh halaman yang sedang tampil sebagai JPG. */
        function empUnduhHalamanAktif() {
            if (!empViewerDoc || !empViewerDoc.pages.length) { showToast('Tidak ada halaman yang sedang dibuka.'); return; }
            const page = empViewerDoc.pages[empViewerHalaman - 1];
            const dataUrl = empPageCache[page.id];
            if (!dataUrl) { showToast('Halaman belum selesai dimuat, coba sebentar lagi.'); return; }
            const nama = (activeEmpStation ? activeEmpStation.singkatan : 'layout') + '_v' + empViewerDoc.versi + '_hal' + empViewerHalaman + '.jpg';
            empUnduhDataUri_(dataUrl.split(',')[1], 'image/jpeg', nama);
        }

        /** Unduh berkas asli versi yang sedang dibuka. */
        function empUnduhAsliDariViewer() {
            if (!empViewerDoc) { showToast('Tidak ada dokumen yang sedang dibuka.'); return; }
            if (!empViewerDoc.punyaBerkasAsli) { showToast('Versi dokumen ini tidak menyimpan berkas asli.'); return; }
            empUnduhBerkasAsli(empViewerDoc.id);
        }

        // ─── SUB-MODAL: konfigurasi jalur (dipakai saat Tambah) ───────────

            document.getElementById('emp-track-config-submodal').classList.remove('hidden');

        // ─── TRACK DETAIL MODAL (jalur milik stasiun yang SUDAH ada) ──────

        function openEmpTrackDetailModal(id) {
            const station = empStations.find(s => s.id === id);
            if (!station) return;
            activeEmpStation = station;
            document.getElementById('emp-track-detail-title').innerHTML = `<i class="fa-solid fa-ruler-horizontal text-[#d4af37]"></i><span>Rincian Jalur - ${escapeHtml(station.nama)} (${escapeHtml(station.singkatan)})</span>`;

        function renderEmpHistoryTimeline() {
            if (!activeEmpStation) return;
            const timeline = document.getElementById('emp-history-timeline');
            timeline.innerHTML = '';

            // ═══ DIURUTKAN & DISELARASKAN DENGAN DOKUMEN ═══
            // Riwayat diurutkan menurut nomor versi, dan tiap catatan
            // dicocokkan dengan dokumen versinya. Dengan begitu terlihat
            // langsung mana catatan yang punya berkas, mana yang versinya
            // sedang aktif, dan mana yang catatannya ada tapi berkasnya belum
            // pernah diunggah.
            // ═══ HANYA VERSI YANG MASIH ADA ═══
            // Catatan bertanda "(dihapus)" disaring keluar. Dokumennya sudah
            // tidak ada, jadi tombol Preview & Unduh di situ pasti gagal -
            // menampilkannya hanya membuat daftar terlihat lebih panjang dari
            // isi yang sebenarnya tersimpan.
            const daftar = (activeEmpStation.history || [])
                .filter(function (h) { return String(h.version || '').indexOf('(dihapus)') === -1; })
                .slice().sort(function (a, b) {
                const va = parseFloat(String(a.version || '').replace(/[^0-9.]/g, '')) || 0;
                const vb = parseFloat(String(b.version || '').replace(/[^0-9.]/g, '')) || 0;
                return va - vb;
            });

            daftar.forEach((hist, idx) => {
                const pasangan = cariDokumenUntukRiwayat_(hist.id);
                const doc = pasangan ? pasangan.doc : null;
                const lencanaDoc = doc
                    ? (doc.status === 'aktif'
                        ? '<span class="text-[9px] font-black px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 border border-emerald-200">DOKUMEN AKTIF</span>'
                        : '<span class="text-[9px] font-black px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 border border-slate-200">ARSIP</span>')
                    : '<span class="text-[9px] font-black px-2 py-0.5 rounded-md bg-amber-50 text-amber-700 border border-amber-200">TANPA BERKAS</span>';
                const infoDoc = doc
                    ? '<p class="text-[10px] text-slate-400 font-semibold mt-1"><i class="fa-solid fa-file-lines mr-1"></i>' +
                      doc.jumlahHalaman + ' halaman &middot; ' + escapeHtml(doc.fileName || 'dokumen') + '</p>'
                    : '';
                timeline.insertAdjacentHTML('beforeend', `
                    <li class="mb-6 ml-6 relative">
                        <span class="absolute flex items-center justify-center w-6 h-6 bg-blue-100 rounded-full -left-9 ring-8 ring-white text-[#0c1d37] font-bold text-xs">${idx+1}</span>
                        <div class="p-4 bg-slate-50/80 border border-slate-200 rounded-2xl">
                            <div class="flex items-center justify-between mb-1">
                                <span class="flex items-center gap-1.5">
                                    <span class="text-xs font-bold px-2.5 py-0.5 bg-[#0c1d37] text-white rounded-md">${escapeHtml(hist.version)}</span>
                                    ${lencanaDoc}
                                </span>
                                <span class="text-[11px] text-slate-400 font-medium"><i class="fa-regular fa-clock mr-1"></i>${formatEmpDate(hist.date)}</span>
                            </div>
                            <p class="text-xs font-semibold text-slate-800 mt-1.5">${escapeHtml(hist.desc)}</p>
                            <p class="text-[11px] text-slate-500 mt-1 font-medium"><i class="fa-solid fa-train text-amber-500 text-[10px] mr-1"></i>Gapeka: <span class="font-bold text-slate-800">${escapeHtml(hist.gapeka || 'Gapeka 2025')}</span></p>
                            ${infoDoc}
                            <div class="mt-3 pt-2.5 border-t border-slate-200 flex items-center justify-end space-x-2">
                                <!--
                                  Tombol Delete SENGAJA tidak ada di sini (3 September 2026).
                                  Riwayat adalah catatan perubahan - menghapusnya berarti
                                  menghilangkan jejak, dan itu bertentangan dengan gunanya
                                  sendiri. Penghapusan dipusatkan di modal Edit Dokumen,
                                  tempat versinya memang dikelola.
                                -->
                                <button onclick="lihatDokumenRiwayat_('${hist.id}')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-700 rounded-lg text-[11px] font-bold transition"><i class="fa-regular fa-eye text-[10px] mr-1"></i>Preview</button>
                                <button onclick="unduhDokumenRiwayat_('${hist.id}')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-700 rounded-lg text-[11px] font-bold transition"><i class="fa-solid fa-download text-[10px] mr-1"></i>Unduh</button>
                                <button onclick="editEmpHistoryEntry('${hist.id}')" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg text-[11px] font-bold"><i class="fa-solid fa-pen-to-square text-[10px] mr-1"></i>Edit</button>
                            </div>
                        </div>
                    </li>
                `);
            });
        }

        function empActivityLogSetSort(sort) {
            empActivityLogSort = sort;
            empActivityLogPage = 1;
            const activeCls = 'px-3 py-1.5 rounded-lg text-[11px] font-bold transition bg-[#0c1d37] text-white';
            const inactiveCls = 'px-3 py-1.5 rounded-lg text-[11px] font-bold transition text-slate-500 hover:bg-slate-100';
            document.getElementById('emp-log-sort-terbaru').className = sort === 'terbaru' ? activeCls : inactiveCls;
            document.getElementById('emp-log-sort-abjad').className = sort === 'abjad' ? activeCls : inactiveCls;
            renderEmpActivityLogPage();
        }

        function renderEmpActivityLogPage() {
            const tbody = document.getElementById('emp-activity-log-body');
            const emptyState = document.getElementById('emp-log-empty-state');
            document.getElementById('emp-log-count-info').innerText = empActivityLogData.length + ' aktivitas';

            if (empActivityLogData.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                document.getElementById('emp-log-page-info').innerText = 'Halaman 0 / 0';
                return;
            }
            emptyState.classList.add('hidden');

            const sorted = empActivityLogData.slice().sort(function (a, b) {
                if (empActivityLogSort === 'abjad') return String(a.stationNama || '').localeCompare(String(b.stationNama || ''));
                return String(b.timestamp).localeCompare(String(a.timestamp));
            });

            const totalPages = Math.max(1, Math.ceil(sorted.length / EMP_ACTIVITY_LOG_PAGE_SIZE));
            empActivityLogPage = Math.min(Math.max(1, empActivityLogPage), totalPages);
            const start = (empActivityLogPage - 1) * EMP_ACTIVITY_LOG_PAGE_SIZE;
            const pageItems = sorted.slice(start, start + EMP_ACTIVITY_LOG_PAGE_SIZE);

            tbody.innerHTML = '';
            pageItems.forEach(function (log) {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-blue-50/40 transition">
                        <td class="py-2.5 px-4 text-slate-500 font-mono text-[11px] whitespace-nowrap">${formatEmpDate(log.timestamp)}</td>
                        <td class="py-2.5 px-4">${escapeHtml(log.nama || log.username || '-')}</td>
                        <td class="py-2.5 px-4"><span class="px-2 py-0.5 bg-blue-50 text-[#0c1d37] border border-blue-200 rounded-lg text-[10px] font-extrabold whitespace-nowrap">${escapeHtml(log.aksi)}</span></td>
                        <td class="py-2.5 px-4">${escapeHtml(log.stationNama || '-')}</td>
                        <td class="py-2.5 px-4 text-slate-500">${escapeHtml(log.keterangan || '-')}</td>
                    </tr>
                `);
            });
            document.getElementById('emp-log-page-info').innerText = `Halaman ${empActivityLogPage} / ${totalPages}`;
        }

        function empActivityLogPrevPage() {
            if (empActivityLogPage > 1) { empActivityLogPage--; renderEmpActivityLogPage(); }
        }

        function empActivityLogNextPage() {
            const totalPages = Math.max(1, Math.ceil(empActivityLogData.length / EMP_ACTIVITY_LOG_PAGE_SIZE));
            if (empActivityLogPage < totalPages) { empActivityLogPage++; renderEmpActivityLogPage(); }
        }

        // ─── KONFIRMASI BERGAYA APLIKASI ─────────────────────────────────
        //
        // Menggantikan confirm() bawaan browser, yang di dalam sandbox Apps
        // Script muncul bertuliskan "An embedded page at ...googleusercontent
        // .com says" - alamat acak yang terlihat mencurigakan & membuat user
        // ragu menekannya, padahal itu sistem mereka sendiri.
        //
        // Dibuat dengan Promise supaya pemakaiannya tetap sederhana:
        //   if (!await konfirmasi_({...})) return;

        function konfirmasi_(opsi) {
            return new Promise(function (selesai) {
                let modal = document.getElementById('modal-konfirmasi-umum');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'modal-konfirmasi-umum';
                    modal.className = 'hidden fixed inset-0 z-[95] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                    document.body.appendChild(modal);
                }

                const bahaya = opsi.bahaya !== false;
                const warnaIkon = bahaya ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600';
                const warnaTombol = bahaya ? 'bg-red-600 hover:bg-red-700' : 'bg-[#0c1d37] hover:bg-slate-800';

                modal.innerHTML =
                    '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">' +
                        '<div class="px-6 py-5 flex items-start gap-4">' +
                            '<div class="w-12 h-12 rounded-2xl ' + warnaIkon + ' flex items-center justify-center text-xl shrink-0">' +
                                '<i class="fa-solid ' + (opsi.ikon || 'fa-triangle-exclamation') + '"></i></div>' +
                            '<div class="min-w-0">' +
                                '<h3 class="text-sm font-black text-slate-900">' + escapeHtml(opsi.judul || 'Konfirmasi') + '</h3>' +
                                '<p class="text-[11px] text-slate-500 font-semibold mt-1 leading-relaxed">' +
                                    (opsi.pesan || '') + '</p>' +
                                (opsi.rincian
                                    ? '<div class="mt-2.5 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-[11px] font-bold text-slate-700">' +
                                      opsi.rincian + '</div>'
                                    : '') +
                            '</div>' +
                        '</div>' +
                        '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">' +
                            '<button id="konf-batal" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">' +
                                escapeHtml(opsi.batal || 'Batal') + '</button>' +
                            '<button id="konf-ya" class="px-5 py-2.5 ' + warnaTombol + ' text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5">' +
                                '<i class="fa-solid ' + (opsi.ikonYa || 'fa-check') + '"></i><span>' + escapeHtml(opsi.ya || 'Ya, Lanjutkan') + '</span></button>' +
                        '</div>' +
                    '</div>';

                modal.classList.remove('hidden');
                const tutup = function (jawaban) {
                    modal.classList.add('hidden');
                    selesai(jawaban);
                };
                modal.querySelector('#konf-batal').onclick = function () { tutup(false); };
                modal.querySelector('#konf-ya').onclick = function () { tutup(true); };
            });
        }


        // ─── PREVIEW & UNDUH DOKUMEN DARI RIWAYAT ────────────────────────
        //
        // Catatan riwayat menunjuk ke versi dokumen lewat nomor versinya.
        // Kalau dokumennya belum ada, dikatakan apa adanya - lebih baik
        // daripada membuka viewer kosong yang membingungkan.

        function cariDokumenUntukRiwayat_(historyId) {
            const hist = (activeEmpStation.history || []).find(function (h) { return h.id === historyId; });
            if (!hist) return null;

            // Nomor versi catatan ("v1.0") dicocokkan dengan nomor versi
            // dokumen (1). Dibandingkan sebagai angka supaya "v1.0" & "v1"
            // sama-sama cocok.
            const angka = parseFloat(String(hist.version || '').replace(/[^0-9.]/g, ''));
            // Bidangnya bernama `docs` di balasan server - `documents` tidak
            // pernah ada, itu sebabnya tombol Preview & Unduh diam saja.
            const docs = activeEmpStation.docs || [];
            if (!docs.length) return { hist: hist, doc: null };

            const cocok = docs.find(function (d) { return Math.floor(Number(d.versi)) === Math.floor(angka); });
            return { hist: hist, doc: cocok || null };
        }

        function lihatDokumenRiwayat_(historyId) {
            const hasil = cariDokumenUntukRiwayat_(historyId);
            if (!hasil) return;
            if (!hasil.doc) {
                showToast('Catatan ' + (hasil.hist.version || '') + ' belum punya dokumen terlampir. ' +
                    'Unggah dokumennya lewat menu Edit Emplasemen.');
                return;
            }
            // ═══ HARUS LEWAT empLihatVersiDokumen ═══
            // empBukaViewer_ mengharapkan doc.pages sudah terisi, padahal
            // sap_emplasemen_getAll sengaja TIDAK mengirim isi halaman (agar
            // pemuatan daftar tetap ringan). Memanggil viewer langsung membuat
            // halamannya kosong, dan viewer menyimpulkan dokumen ini "berkas
            // asli saja" - persis yang terlihat di layar.
            //
            // empLihatVersiDokumen memuat halamannya dulu, baru membuka viewer.
            if (typeof empLihatVersiDokumen === 'function') {
                empLihatVersiDokumen(activeEmpStation.id, hasil.doc.id);
            } else {
                showToast('Pratinjau dokumen belum tersedia.');
            }
        }

        function unduhDokumenRiwayat_(historyId) {
            const hasil = cariDokumenUntukRiwayat_(historyId);
            if (!hasil) return;
            if (!hasil.doc) {
                showToast('Catatan ' + (hasil.hist.version || '') + ' belum punya dokumen terlampir.');
                return;
            }
            if (typeof empUnduhBerkasAsli === 'function') empUnduhBerkasAsli(hasil.doc.id);
            else showToast('Unduhan dokumen belum tersedia.');
        }


        // ─── PENUNJANG SUNTING VERSI DOKUMEN ─────────────────────────────

        /** Mengisi pilihan wilayah pada sebuah <select>, lalu memilih nilainya. */
        function isiPilihanWilayah_(idSelect, terpilih) {
            const sel = document.getElementById(idSelect);
            if (!sel) return;
            sel.innerHTML = EMP_WILAYAH_LIST.map(function (w) {
                return '<option value="' + escapeHtml(w) + '">' + escapeHtml(w) + '</option>';
            }).join('');
            if (terpilih) sel.value = terpilih;
        }

        /**
         * Mengubah tanggal tersimpan jadi nilai <input type="date">.
         * Menerima ISO maupun "dd-MM-yyyy", karena data lama & baru bisa
         * bercampur di sheet yang sama.
         */
        function empTanggalKeInput_(nilai) {
            const t = String(nilai || '').trim();
            if (!t) return '';
            const iso = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];
            const dmy = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
            if (dmy) return dmy[3] + '-' + String(dmy[2]).padStart(2, '0') + '-' + String(dmy[1]).padStart(2, '0');
            return '';
        }


        /**
         * Menyimpan perubahan data stasiun & tanggal dokumen dari modal
         * Perbaiki.
         *
         * Dipisah jadi fungsi sendiri karena dipakai di dua jalur - saat
         * berkasnya diganti maupun tidak. Kegagalannya dilaporkan balik,
         * bukan dilempar, supaya pemanggilnya bisa menutup tombol dengan rapi.
         */
        async function simpanDataStasiunDariPerbaikan_(docId) {
            const station = empStations.find(function (s) { return s.id === empEditingStationId; });
            if (!station) return { gagal: true, pesan: 'Data stasiun tidak ditemukan.' };

            const nama = document.getElementById('emp-docedit-nama').value.trim();
            const singkatan = document.getElementById('emp-docedit-singkatan').value.trim().toUpperCase();
            const wilayah = document.getElementById('emp-docedit-wilayah').value;
            const status = document.getElementById('emp-docedit-status-emp').value;
            const tanggal = document.getElementById('emp-docedit-tanggal').value;

            if (!nama || !singkatan) return { gagal: true, pesan: 'Nama stasiun & singkatan wajib diisi.' };

            try {
                // Data stasiun hanya dikirim bila memang berubah - menyimpan
                // nilai yang sama hanya menambah baris riwayat tanpa guna.
                const berubah = nama !== station.nama || singkatan !== station.singkatan ||
                                wilayah !== station.wilayah || status !== station.status;
                if (berubah) {
                    const res = await empPanggil_('sap_emplasemen_update', [currentSessionToken, station.id, {
                        nama: nama, singkatan: singkatan, wilayah: wilayah, status: status
                    }]);
                    if (!res.success) return { gagal: true, pesan: 'Gagal menyimpan data stasiun: ' + (res.message || '') };
                }

                // Tanggal dokumen disimpan terpisah karena melekat pada VERSI,
                // bukan pada stasiunnya - dua versi bisa punya tanggal berbeda.
                const tglLama = empTanggalKeInput_((station.docs || []).find(function (d) { return d.id === docId; })?.tanggalUpload);
                if (tanggal && tanggal !== tglLama) {
                    const res2 = await empPanggil_('sap_emplasemen_updateDocTanggal', [currentSessionToken, docId, tanggal]);
                    if (!res2.success) return { gagal: true, pesan: 'Gagal menyimpan tanggal dokumen: ' + (res2.message || '') };
                }
                return { gagal: false };
            } catch (err) {
                return { gagal: true, pesan: 'Terjadi kesalahan: ' + (err.message || err) };
            }
        }

</script>
