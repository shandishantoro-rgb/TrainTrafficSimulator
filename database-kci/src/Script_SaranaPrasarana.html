<!--
  Script_SaranaPrasarana.html
  Logic browser untuk modul Sarana & Prasarana:
  Spesifikasi Sarana, Perlintasan Sebidang, & Emplasemen Stasiun.

  EMPLASEMEN STASIUN v3 (25 Agustus 2026) - perubahan besar:
  berkas yang diupload (PDF/PNG/apa pun) DIUBAH JADI JPG MUTU TINGGI DI
  BROWSER INI sebelum dikirim ke server, satu JPG per halaman. Gambar JPG
  bisa ditampilkan di mana saja tanpa syarat apa pun, jadi masalah
  "dokumen tidak bisa dibuka" tidak bisa muncul lagi - bukan ditambal,
  tapi dihilangkan sumbernya. Penjelasan lengkap ada di komentar bagian
  "EMPLASEMEN STASIUN v3" di bawah.
-->
<script>
        // ─── FUNGSI DASAR (cadangan mandiri) ─────────────────────────────
        // Definisi cadangan fungsi umum yang dipakai file ini. Ditanam di
        // SETIAP Script_*.html dengan pola idempotent (window.x = window.x
        // || ...) supaya file ini TETAP BERFUNGSI walau SharedScripts.html
        // kebetulan belum ter-update ke versi terbaru. Ini mencegah satu
        // file yang ketinggalan versi merusak seluruh modul lain.
        window.escapeHtml = window.escapeHtml || function (val) {
            if (val === null || val === undefined) return '';
            return String(val)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };
        window.startLoadingWatchdog = window.startLoadingWatchdog || function () { return null; };


        // ================================================================
        // SPESIFIKASI SARANA & PERLINTASAN SEBIDANG (tidak diubah)
        // ================================================================
        let sapDataCache = { spesifikasi: [], perlintasan: [] };
        const SAP_TBODY_ID = { spesifikasi: 'spesifikasi-table-body', perlintasan: 'perlintasan-table-body' };

        function loadSapData(type) {
            const tbody = document.getElementById(SAP_TBODY_ID[type]);
            if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 font-bold">Memuat data...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { sapDataCache[type] = res.data; renderSapTable(type); }
                    else { showToast('Gagal memuat data: ' + (res.message || '')); if (tbody) tbody.innerHTML = ''; }
                })
                .withFailureHandler(function () {
                    showToast('Terjadi kesalahan saat memuat data.');
                    if (tbody) tbody.innerHTML = '';
                })
                .sap_getData(currentSessionToken, type);
        }

        function renderSapTable(type) {
            if (type === 'spesifikasi') renderSpesifikasiTable();
            else renderPerlintasanTable();
        }

        function renderSpesifikasiTable() {
            const tbody = document.getElementById('spesifikasi-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            sapDataCache.spesifikasi.forEach((item, idx) => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 text-xs font-semibold h-12">
                        <td class="px-4 py-2 border-r border-slate-200 text-center text-slate-400 font-mono">${idx+1}</td>
                        <td class="px-5 py-2 border-r border-slate-200 text-left text-[#0c1d37] font-extrabold">${escapeHtml(item.seri)}</td>
                        <td class="px-5 py-2 border-r border-slate-200 text-left text-slate-600">${escapeHtml(item.sf)}</td>
                        <td class="px-5 py-2 border-r border-slate-200 text-left text-emerald-600">${escapeHtml(item.status)}</td>
                        <td class="px-4 py-2 text-center">
                            <button onclick="removeSapAssetItem('spesifikasi', '${item.id}')" class="text-red-500 font-black tracking-wider text-[9px] uppercase bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg">DELETE</button>
                        </td>
                    </tr>
                `);
            });
            if (sapDataCache.spesifikasi.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 font-bold">Belum ada data.</td></tr>';
            }
        }

        function renderPerlintasanTable() {
            const tbody = document.getElementById('perlintasan-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            sapDataCache.perlintasan.forEach((item, idx) => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 text-xs font-semibold h-12">
                        <td class="px-4 py-2 border-r border-slate-200 text-center text-slate-400 font-mono">${idx+1}</td>
                        <td class="px-5 py-2 border-r border-slate-200 text-left text-[#0c1d37] font-extrabold">${escapeHtml(item.nama)}</td>
                        <td class="px-5 py-2 border-r border-slate-200 text-left text-slate-600">${escapeHtml(item.lokasi)}</td>
                        <td class="px-5 py-2 border-r border-slate-200 text-left text-emerald-600">${escapeHtml(item.klasifikasi)}</td>
                        <td class="px-4 py-2 text-center">
                            <button onclick="removeSapAssetItem('perlintasan', '${item.id}')" class="text-red-500 font-black tracking-wider text-[9px] uppercase bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg">DELETE</button>
                        </td>
                    </tr>
                `);
            });
            if (sapDataCache.perlintasan.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 font-bold">Belum ada data.</td></tr>';
            }
        }

        async function removeSapAssetItem(type, id) {
            const setujuHapus = await konfirmasi_({
                judul: 'Hapus data ini?',
                pesan: 'Data yang dihapus tidak bisa dikembalikan dari aplikasi. Pastikan sudah ada cadangan bila datanya masih diperlukan.',
                ya: 'Ya, Hapus', ikonYa: 'fa-trash-can'
            });
            if (!setujuHapus) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { showToast('Data berhasil dihapus.'); loadSapData(type); }
                    else { showToast('Gagal menghapus: ' + (res.message || '')); }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus data.'); })
                .sap_deleteAsset(currentSessionToken, type, id);
        }

        function openSapInputModal(type) {
            document.getElementById('modal-input-sap').classList.remove('hidden');
            document.getElementById('sap-type').value = type;
            const container = document.getElementById('sap-form-fields');
            container.innerHTML = '';
            if (type === 'spesifikasi') {
                document.getElementById('sap-modal-title').innerText = "Registrasi Spesifikasi Sarana";
                container.innerHTML = `
                    <div><label class="font-bold">Seri Armada</label><input type="text" id="sap-f1" required class="w-full p-2 border rounded-lg mt-1"></div>
                    <div><label class="font-bold">Formasi Car (SF)</label><input type="text" id="sap-f2" required class="w-full p-2 border rounded-lg mt-1"></div>
                    <div><label class="font-bold">Status Operasi</label><input type="text" id="sap-f3" required class="w-full p-2 border rounded-lg mt-1"></div>
                `;
            } else {
                document.getElementById('sap-modal-title').innerText = "Registrasi Perlintasan Sebidang";
                container.innerHTML = `
                    <div><label class="font-bold">Nama Perlintasan (KM)</label><input type="text" id="sap-f1" required class="w-full p-2 border rounded-lg mt-1"></div>
                    <div><label class="font-bold">Lokasi Lintas</label><input type="text" id="sap-f2" required class="w-full p-2 border rounded-lg mt-1"></div>
                    <div><label class="font-bold">Klasifikasi Penjagaan</label><input type="text" id="sap-f3" required class="w-full p-2 border rounded-lg mt-1"></div>
                `;
            }
        }

        function closeSapInputModal() { document.getElementById('modal-input-sap').classList.add('hidden'); }

        function handleSapSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('sap-type').value;
            const f1 = document.getElementById('sap-f1').value;
            const f2 = document.getElementById('sap-f2').value;
            const f3 = document.getElementById('sap-f3').value;
            const payload = (type === 'spesifikasi') ? { seri: f1, sf: f2, status: f3 } : { nama: f1, lokasi: f2, klasifikasi: f3 };

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { closeSapInputModal(); showToast(`Sukses menyimpan data ${f1}!`); loadSapData(type); }
                    else { showToast('Gagal menyimpan: ' + (res.message || '')); }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menyimpan data.'); })
                .sap_addAsset(currentSessionToken, type, payload);
        }

        // ================================================================
        // EMPLASEMEN STASIUN v3 (25 Agustus 2026)
        // ================================================================
        //
        // INTI PERUBAHAN: berkas apa pun (PDF/PNG/WEBP/dll) DIUBAH JADI JPG
        // MUTU TINGGI DI BROWSER INI sebelum dikirim ke server. Gambar JPG
        // bisa ditampilkan di mana saja tanpa syarat apa pun - itulah yang
        // menghentikan masalah "dokumen tidak bisa dibuka" secara permanen.
        //
        // Kenapa konversinya di browser, bukan di server: Apps Script memang
        // tidak punya cara resmi mengubah PDF jadi gambar. Di browser, PDF.js
        // bisa menggambar tiap halaman ke <canvas> pada resolusi berapa pun,
        // jadi mutunya justru bisa dikendalikan (lihat EMP_JPG_TARGET_WIDTH).
        //
        // Berkas ASLI tetap ikut disimpan sebagai arsip (bisa dimatikan lewat
        // centang di form) - jadi mutu aslinya tidak pernah hilang.

        const EMP_WILAYAH_LIST = [
            "Daop 1 Jakarta", "Daop 2 Bandung", "Daop 3 Cirebon", "Daop 4 Semarang",
            "Daop 5 Purwokerto", "Daop 6 Yogyakarta", "Daop 7 Madiun", "Daop 8 Surabaya",
            "Daop 9 Jember", "Divre I Sumatera Utara & Aceh", "Divre II Sumatera Barat",
            "Divre III Palembang", "Divre IV Tanjungkarang"
        ];

        // ── Pengaturan mutu konversi JPG ──────────────────────────────────
        // 2600 px lebar ≈ 220 DPI untuk kertas A3 - cukup tajam untuk dizoom
        // dalam-dalam saat presentasi, tapi ukuran berkasnya masih wajar
        // (±400-900 KB/halaman) sehingga tetap cepat dibuka. Mutu 0.92
        // adalah titik di mana artefak JPEG praktis tidak terlihat pada
        // gambar teknis bergaris.
        const EMP_JPG_TARGET_WIDTH = 3000;  // disamakan dengan Document Repository - tajam sampai zoom 250%
        const EMP_JPG_QUALITY = 0.94;
        const EMP_JPG_MAX_PAGES = 40;

        let empStations = [];       // cache dari server
        let activeEmpStation = null;
        let tempEmpTrackDetails = []; // dipakai selama form Tambah (sebelum stasiun benar-benar ada)
        /** true selama pemeriksaan nama stasiun berjalan di latar. */
        let empSedangCekNama_ = false;
        let empCekNamaBatasTimer_ = null;

        let pendingDeleteEmpTrackIdx = -1;
        let pendingDeleteEmpStationId = null;
        let editingEmpHistoryId = null;
        let empEditingStationId = null;   // null = mode TAMBAH, berisi id = mode EDIT
        let empUploadInProgress = false;  // guard cegah double-submit
        let empHalamanSiapKirim = [];     // hasil konversi: [{base64, lebar, tinggi}]
        let empBerkasAsliPayload = null;  // {base64, name, mimeType} berkas pra-konversi
        let empDokumenTargetStationId = null; // stasiun tujuan saat menambah versi dokumen dari modal Kelola

        // Cache gambar halaman di memori: pageId -> dataURL. Inilah yang
        // membuat membuka ulang stasiun yang sama jadi seketika (poin
        // kecepatan) - tidak ada permintaan ke server sama sekali.
        let empPageCache = {};

        // Riwayat Aktivitas
        let empActivityLogData = [];
        let empActivityLogSort = 'terbaru';
        let empActivityLogPage = 1;
        const EMP_ACTIVITY_LOG_PAGE_SIZE = 10;

        // Paginasi tabel: 5 stasiun per halaman (permintaan user).
        const EMP_TABLE_PAGE_SIZE = 5;
        let empTablePage = 1;

        // Penanda bahwa data sudah pernah dimuat - dipakai supaya berpindah
        // ke menu ini untuk KEDUA kalinya menampilkan tabel seketika dari
        // ingatan, lalu menyegarkan diri diam-diam di latar belakang.
        let empSudahPernahDimuat = false;

        // Sub-modal perbaiki dokumen
        let empDocSedangDiperbaiki = null; // {id, versi}
        let empHalamanPerbaikan = [];      // hasil konversi berkas pengganti
        let empBerkasAsliPerbaikan = null;

        // Viewer
        let empViewerDoc = null;      // objek dokumen yang sedang dibuka
        let empViewerHalaman = 1;
        let empViewerZoom = 1;
        let empViewerRotasi = 0;      // derajat: 0 / 90 / 180 / 270
        let empViewerPanX = 0, empViewerPanY = 0;
        let empViewerDragging = false, empViewerDragStartX = 0, empViewerDragStartY = 0;
        let empPreviewFullscreen = false;

        /** Format tanggal ISO ke "dd-mm-yyyy HH:MM WIB". */
        function formatEmpDate(isoString) {
            if (!isoString) return '-';
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return isoString;
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())} WIB`;
        }

        /**
         * "dd-MM-yyyy HH:mm" (bentuk yang dikembalikan Sheets setelah teks
         * tanggal otomatis dikenali sebagai tanggal) -> "yyyy-MM-dd" yang
         * dimengerti <input type="date">.
         */
        function empTanggalUntukInputDate_(nilai) {
            const teks = String(nilai || '').trim();
            if (!teks) return '';
            let m = teks.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return m[1] + '-' + m[2] + '-' + m[3];
            m = teks.match(/^(\d{2})-(\d{2})-(\d{4})/);
            if (m) return m[3] + '-' + m[2] + '-' + m[1];
            return '';
        }

        // ─── PDF.js (dipakai HANYA saat konversi, bukan saat menampilkan) ──

        const EMP_PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let empPdfjsSiap_ = false;

        /**
         * Menyiapkan PDF.js sekali saja. Worker-nya dimuat lewat Blob kecil
         * yang meng-importScripts URL CDN - trik standar supaya worker
         * lintas-domain tetap boleh dibuat browser. Kalau ditolak, workerSrc
         * diarahkan langsung ke CDN & PDF.js jatuh ke mode tanpa worker.
         * @return {boolean} false kalau pustakanya sendiri gagal dimuat.
         */
        function empSiapkanPdfJs_() {
            if (typeof pdfjsLib === 'undefined') {
                console.log('[emp] pustaka pdfjsLib tidak tersedia - cek <script> PDF.js di Index.html & akses ke cdnjs.cloudflare.com.');
                return false;
            }
            if (empPdfjsSiap_) return true;
            try {
                const blob = new Blob(["importScripts('" + EMP_PDFJS_WORKER_URL + "');"], { type: 'application/javascript' });
                pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
            } catch (err) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = EMP_PDFJS_WORKER_URL;
            }
            empPdfjsSiap_ = true;
            return true;
        }

        /** base64 -> Uint8Array (bentuk yang diminta PDF.js). */
        function empBase64KeBytes_(base64) {
            const biner = atob(base64);
            const bytes = new Uint8Array(biner.length);
            for (let i = 0; i < biner.length; i++) bytes[i] = biner.charCodeAt(i);
            return bytes;
        }

        // ─── KONVERSI BERKAS -> JPG ───────────────────────────────────────

        /**
         * Mengubah berkas apa pun jadi daftar halaman JPG mutu tinggi.
         *  - PDF   : tiap halaman digambar PDF.js ke canvas lalu di-JPG-kan.
         *  - Gambar: digambar ulang ke canvas (sekaligus menormalkan PNG/WEBP/
         *            HEIC-yang-didukung-browser jadi JPG). JPG yang sudah
         *            sesuai ukuran dipakai apa adanya tanpa dikompres ulang,
         *            supaya tidak turun mutu dua kali.
         *  - Lainnya (DXF/CAD): TIDAK bisa dikonversi di browser mana pun -
         *            dikembalikan sebagai daftar kosong & berkasnya tetap
         *            tersimpan utuh sebagai arsip.
         * @param {File} file
         * @param {function(number,number,string)} onProgress (selesai, total, keterangan)
         * @return {Promise<{pages:Array, jenis:string, alasan?:string}>}
         */
        async function empKonversiBerkasKeJpg_(file, onProgress) {
            const tipe = file.type || '';
            const namaKecil = (file.name || '').toLowerCase();
            const isPdf = tipe === 'application/pdf' || namaKecil.endsWith('.pdf');
            const isGambar = tipe.indexOf('image/') === 0;

            if (isPdf) {
                if (!empSiapkanPdfJs_()) {
                    return { pages: [], jenis: 'gagal', alasan: 'Pustaka pembaca PDF gagal dimuat (periksa koneksi ke cdnjs.cloudflare.com).' };
                }
                const base64 = await empBacaFileSebagaiBase64_(file);
                const pdf = await pdfjsLib.getDocument({ data: empBase64KeBytes_(base64) }).promise;
                const total = Math.min(pdf.numPages, EMP_JPG_MAX_PAGES);
                const pages = [];
                for (let n = 1; n <= total; n++) {
                    if (onProgress) onProgress(n - 1, total, 'Mengubah halaman ' + n + ' jadi JPG...');
                    const page = await pdf.getPage(n);
                    const asli = page.getViewport({ scale: 1 });
                    // Skala dipilih agar lebar hasil ≈ EMP_JPG_TARGET_WIDTH, tapi
                    // tidak pernah MEMPERBESAR halaman yang aslinya sudah besar
                    // secara berlebihan (batas 6x) - itu cuma menambah ukuran
                    // berkas tanpa menambah detail.
                    const skala = Math.min(EMP_JPG_TARGET_WIDTH / asli.width, 6);
                    const viewport = page.getViewport({ scale: skala });
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    const ctx = canvas.getContext('2d');
                    // Latar putih: PDF berlatar transparan kalau langsung
                    // di-JPG-kan akan jadi HITAM (JPG tidak kenal transparansi).
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    pages.push({
                        base64: canvas.toDataURL('image/jpeg', EMP_JPG_QUALITY).split(',')[1],
                        lebar: canvas.width, tinggi: canvas.height
                    });
                    canvas.width = 0; canvas.height = 0; // lepaskan memori canvas
                }
                if (onProgress) onProgress(total, total, 'Konversi selesai.');
                return { pages: pages, jenis: 'pdf', jumlahAsli: pdf.numPages };
            }

            if (isGambar) {
                if (onProgress) onProgress(0, 1, 'Menyiapkan gambar...');
                const gambar = await empMuatGambar_(file);
                const skala = Math.min(EMP_JPG_TARGET_WIDTH / gambar.naturalWidth, 1); // gambar kecil tidak diperbesar
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(gambar.naturalWidth * skala);
                canvas.height = Math.round(gambar.naturalHeight * skala);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(gambar, 0, 0, canvas.width, canvas.height);
                const hasil = {
                    base64: canvas.toDataURL('image/jpeg', EMP_JPG_QUALITY).split(',')[1],
                    lebar: canvas.width, tinggi: canvas.height
                };
                canvas.width = 0; canvas.height = 0;
                if (onProgress) onProgress(1, 1, 'Konversi selesai.');
                return { pages: [hasil], jenis: 'gambar' };
            }

            return {
                pages: [], jenis: 'tidak-didukung',
                alasan: 'Format ini (mis. DXF/DWG/CAD) tidak bisa diubah jadi gambar oleh browser. Berkasnya tetap tersimpan utuh sebagai arsip & bisa diunduh, tapi tidak bisa dipratinjau.'
            };
        }

        /** Baca File jadi base64 (tanpa prefix data:). */
        function empBacaFileSebagaiBase64_(file) {
            return new Promise(function (resolve, reject) {
                const reader = new FileReader();
                reader.onload = function () { resolve(reader.result.split(',')[1]); };
                reader.onerror = function () { reject(new Error('Gagal membaca berkas.')); };
                reader.readAsDataURL(file);
            });
        }

        /** Muat File gambar jadi objek <img> yang siap digambar ke canvas. */
        function empMuatGambar_(file) {
            return new Promise(function (resolve, reject) {
                const reader = new FileReader();
                reader.onload = function () {
                    const img = new Image();
                    img.onload = function () { resolve(img); };
                    img.onerror = function () { reject(new Error('Berkas gambar tidak bisa dibaca (kemungkinan rusak).')); };
                    img.src = reader.result;
                };
                reader.onerror = function () { reject(new Error('Gagal membaca berkas.')); };
                reader.readAsDataURL(file);
            });
        }

        // ─── MUAT & TAMPILKAN TABEL ───────────────────────────────────────

        /**
         * Memuat data stasiun.
         *
         * PERILAKU CACHE (perbaikan kecepatan): kalau data sudah pernah
         * dimuat di sesi ini, tabel langsung digambar dari ingatan supaya
         * berpindah ke menu ini terasa seketika, lalu data disegarkan
         * diam-diam di latar belakang. Menunggu layar kosong cuma terjadi
         * pada pemuatan pertama saja.
         * @param {boolean} [paksa] true = selalu tunggu data baru dari server.
         */
        function loadEmpStations(paksa) {
            const tbody = document.getElementById('emplasemen-table-body');
            setupEmpWilayahDropdowns();

            const pakaiCache = empSudahPernahDimuat && empStations.length > 0 && !paksa;
            if (pakaiCache) {
                renderEmplasemenTable();
                empTandaiMenyegarkan_(true);
            } else if (tbody) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-slate-400 font-bold"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#d4af37]"></i>Memuat data...</td></tr>';
            }

            const watchdog = pakaiCache ? null : startLoadingWatchdog('emplasemen-table-body', 'loadEmpStations()');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (watchdog) clearTimeout(watchdog);
                    empTandaiMenyegarkan_(false);
                    if (res.success) {
                        empStations = res.data;
                        empSudahPernahDimuat = true;
                        renderEmplasemenTable();
                    } else {
                        showToast('Gagal memuat data Emplasemen: ' + (res.message || ''));
                        if (!pakaiCache && tbody) tbody.innerHTML = '';
                    }
                })
                .withFailureHandler(function (err) {
                    if (watchdog) clearTimeout(watchdog);
                    empTandaiMenyegarkan_(false);
                    console.log('[emp] gagal memuat:', err);
                    if (!pakaiCache) {
                        showToast('Terjadi kesalahan saat memuat data Emplasemen.');
                        if (tbody) tbody.innerHTML = '';
                    }
                })
                .sap_emplasemen_getAll(currentSessionToken);
        }

        /** Penanda halus "sedang menyegarkan" saat tabel tampil dari cache. */

            if (el) el.classList.toggle('hidden', !sedang);

        function setupEmpWilayahDropdowns() {

        /** Isi kolom JALUR KA: daftar ringkas nama + panjang, bisa diklik untuk buka rincian. */
        function buildEmpTrackListCell(item) {
            const tracks = item.trackDetails || [];
            if (tracks.length === 0) {
                return `<button onclick="openEmpTrackDetailModal('${item.id}')" class="text-slate-400 font-bold hover:text-[#0c1d37] transition">+ Atur Jalur</button>`;
            }
            const rows = tracks.map(function (t) {
                return `<div class="flex items-center justify-between gap-2">
                    <span class="text-slate-600 truncate">${escapeHtml(t.name)}</span>
                    <span class="text-[#0c1d37] font-mono font-bold shrink-0">${escapeHtml(t.length)}m</span>
                </div>`;
            }).join('');

            // ═══ TANPA GULIR DI DALAM SEL ═══
            // Dulu tingginya dibatasi (max-h-20) sehingga stasiun berjalur
            // banyak seperti Bekasi harus digulir di dalam selnya sendiri -
            // gulir kecil di dalam tabel sulit disadari & merepotkan dibaca.
            //
            // Sekarang seluruh jalur ditampilkan. Untuk stasiun berjalur
            // sangat banyak, daftarnya dipecah jadi dua kolom supaya barisnya
            // tidak menjulang - lebih terbaca daripada satu kolom panjang.
            const duaKolom = tracks.length > 6;
            return `<button onclick="openEmpTrackDetailModal('${item.id}')" title="Lihat/atur semua jalur (${tracks.length} total)" class="w-full text-left hover:text-[#0c1d37] transition block">
                <div class="${duaKolom ? 'grid grid-cols-2 gap-x-3 gap-y-0.5' : 'space-y-0.5'}">${rows}</div>
                ${tracks.length > 1 ? `<div class="text-[9px] text-slate-400 font-bold mt-1 pt-1 border-t border-slate-100">${tracks.length} jalur</div>` : ''}
            </button>`;
        }

        function renderEmplasemenTable() {
            const tbody = document.getElementById('emplasemen-table-body');
            const emptyState = document.getElementById('emp-empty-state');
            if (!tbody) return;

            const search = (document.getElementById('emp-search').value || '').toLowerCase();
            const wilayah = document.getElementById('emp-filter-wilayah').value;
            const status = document.getElementById('emp-filter-status').value;

            const filtered = empStations.filter(function (s) {
                const matchSearch = (s.nama || '').toLowerCase().includes(search) || (s.singkatan || '').toLowerCase().includes(search);
                const matchWilayah = (wilayah === 'ALL') || (s.wilayah === wilayah);
                const matchStatus = (status === 'ALL') || (s.status === status);
                return matchSearch && matchWilayah && matchStatus;
            });

            // KPI dihitung dari SELURUH data, bukan cuma hasil filter/halaman.
            document.getElementById('emp-stat-total').innerText = empStations.length;
            document.getElementById('emp-stat-aktif').innerText = empStations.filter(s => s.status === 'Aktif').length;
            document.getElementById('emp-stat-nonaktif').innerText = empStations.filter(s => s.status === 'Tidak Aktif').length;
            let totalTracks = 0;
            empStations.forEach(s => totalTracks += (s.tracks || 0));
            document.getElementById('emp-stat-jalur').innerText = totalTracks;

            tbody.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                empPerbaruiKontrolHalaman_(0, 1, 0);
                return;
            }
            emptyState.classList.add('hidden');

            // ── Potong per halaman: 5 stasiun sekaligus ──
            const totalPages = Math.max(1, Math.ceil(filtered.length / EMP_TABLE_PAGE_SIZE));
            empTablePage = Math.min(Math.max(1, empTablePage), totalPages);
            const mulai = (empTablePage - 1) * EMP_TABLE_PAGE_SIZE;
            const halamanIni = filtered.slice(mulai, mulai + EMP_TABLE_PAGE_SIZE);

            // Dihitung SEKALI di luar loop - canDo() menelusuri array izin.
            const bolehEditEmp = (typeof canDo === 'function') ? canDo('sap-emplasemen', 'edit') : true;
            const bolehHapusEmp = (typeof canDo === 'function') ? canDo('sap-emplasemen', 'hapus') : true;

            let gagalRenderEmp = 0;
            halamanIni.forEach((item, i) => {
                const idx = mulai + i; // nomor urut ikut halaman, bukan mulai dari 1 terus
                try {
                    const badge = item.status === 'Aktif'
                        ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Aktif</span>`
                        : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold bg-slate-100 text-slate-600 border border-slate-200"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>Tidak Aktif</span>`;

                    const jumlahDok = item.jumlahDokumen || 0;
                    const badgeDok = jumlahDok > 0
                        ? `<span class="ml-1.5 px-1.5 py-0.5 rounded-md bg-[#d4af37]/20 text-[#8a6d1f] text-[9px] font-extrabold align-middle" title="${jumlahDok} versi dokumen tersimpan">${jumlahDok}v</span>`
                        : '';

                    const tombolEdit = bolehEditEmp
                        ? `<button onclick="openEmpEditModal('${item.id}')" title="Edit data & kelola dokumen" class="p-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white rounded-lg transition"><i class="fa-solid fa-pen-to-square text-xs"></i></button>`
                        : '';
                    const tombolHapus = bolehHapusEmp
                        ? `<button onclick="confirmDeleteEmplasemen('${item.id}')" title="Hapus" class="p-2 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-lg transition"><i class="fa-solid fa-trash-can text-xs"></i></button>`
                        : '';

                    tbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-blue-50/40 transition">
                            <td class="py-3 px-3 text-center text-slate-400 border-r border-slate-100 font-mono">${idx+1}</td>
                            <td class="py-3 px-4 border-r border-slate-100 text-[#0c1d37] font-extrabold truncate" title="${escapeHtml(item.nama)}">${escapeHtml(item.nama)}${badgeDok}</td>
                            <td class="py-3 px-3 text-center border-r border-slate-100"><span class="bg-slate-100 px-2.5 py-1 rounded-lg border border-slate-200 font-mono">${escapeHtml(item.singkatan)}</span></td>
                            <td class="py-3 px-4 border-r border-slate-100 text-slate-600 truncate" title="${escapeHtml(item.wilayah)}"><i class="fa-solid fa-location-dot text-red-500 mr-1.5 text-[10px]"></i>${escapeHtml(item.wilayah)}</td>
                            <td class="py-3 px-3 text-center border-r border-slate-100">${badge}</td>
                            <td class="py-3 px-3 border-r border-slate-100">${buildEmpTrackListCell(item)}</td>
                            <td class="py-3 px-3 text-center">
                                <div class="flex items-center justify-center gap-1.5">
                                    <button onclick="openEmpPreviewModal('${item.id}')" title="Preview dokumen" class="p-2 bg-blue-50 text-[#0c1d37] hover:bg-[#0c1d37] hover:text-white rounded-lg transition"><i class="fa-solid fa-eye text-xs"></i></button>
                                    ${tombolEdit}
                                    <button onclick="openEmpHistoryModal('${item.id}')" title="Riwayat versi GAPEKA" class="p-2 bg-[#d4af37]/15 text-[#b8902c] hover:bg-[#d4af37] hover:text-white rounded-lg transition"><i class="fa-solid fa-clock-rotate-left text-xs"></i></button>
                                    ${tombolHapus}
                                </div>
                            </td>
                        </tr>
                    `);
                } catch (err) {
                    // Satu stasiun bermasalah TIDAK boleh menghapus seluruh tabel.
                    gagalRenderEmp++;
                    console.log('[emp render] stasiun ke-' + (idx + 1) + ' gagal ditampilkan:', err, item);
                }
            });
            if (gagalRenderEmp > 0) {
                showToast(gagalRenderEmp + ' stasiun tidak bisa ditampilkan karena datanya tidak wajar - cek di Spreadsheet.');
            }

            empPerbaruiKontrolHalaman_(filtered.length, totalPages, halamanIni.length, mulai);
            empPramuatHalamanPertama_(halamanIni);
        }

        /** Perbarui teks & tombol navigasi halaman tabel. */
        function empPerbaruiKontrolHalaman_(totalData, totalPages, jumlahDitampilkan, mulai) {
            const info = document.getElementById('emp-page-info');
            const rentang = document.getElementById('emp-page-range');
            const prev = document.getElementById('emp-page-prev');
            const next = document.getElementById('emp-page-next');
            if (info) info.innerText = `Halaman ${totalData ? empTablePage : 0} / ${totalData ? totalPages : 0}`;
            if (rentang) {
                rentang.innerText = totalData
                    ? `Menampilkan ${mulai + 1}-${mulai + jumlahDitampilkan} dari ${totalData} stasiun`
                    : 'Tidak ada data untuk ditampilkan';
            }
            if (prev) prev.disabled = empTablePage <= 1 || !totalData;
            if (next) next.disabled = empTablePage >= totalPages || !totalData;
        }

        function empHalamanTabelSebelumnya() {
            if (empTablePage > 1) { empTablePage--; renderEmplasemenTable(); }
        }
        function empHalamanTabelBerikutnya() {
            empTablePage++; renderEmplasemenTable();
        }
        /** Filter/pencarian selalu mengembalikan tampilan ke halaman 1. */
        function empFilterBerubah() { empTablePage = 1; renderEmplasemenTable(); }

        /**
         * Pramuat gambar halaman PERTAMA dari dokumen aktif milik stasiun yang
         * sedang tampil di layar (maksimal 5 karena satu halaman tabel berisi 5
         * stasiun) - dalam SATU panggilan borongan.
         *
         * Efeknya: saat user menekan tombol Preview, gambarnya sudah ada di
         * ingatan, jadi terbuka seketika tanpa menunggu server. Ini jawaban
         * untuk keluhan "preview dokumen juga cukup lama".
         * @param {Object[]} stasiunTampil
         */
        function empPramuatHalamanPertama_(stasiunTampil) {
            const idHalaman = [];
            stasiunTampil.forEach(function (st) {
                const doc = (st.docs || []).find(function (d) { return d.id === st.docAktifId; });
                if (doc && doc.pages && doc.pages.length && !empPageCache[doc.pages[0].id]) idHalaman.push(doc.pages[0].id);
            });
            if (!idHalaman.length) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) return;
                    (res.items || []).forEach(function (it) {
                        empPageCache[it.pageId] = 'data:' + (it.mimeType || 'image/jpeg') + ';base64,' + it.base64;
                    });
                    console.log('[emp pramuat] ' + (res.items || []).length + ' halaman disiapkan di ingatan.');
                })
                .withFailureHandler(function () { /* pramuat gagal tidak apa-apa - preview tetap jalan, hanya perlu menunggu sesaat */ })
                .sap_emplasemen_getPagesBatch(currentSessionToken, idHalaman);
        }

        /**
         * Mode EDIT: memakai ulang modal Tambah. Selain mengubah data pokok,
         * di sini tersedia PENGELOLA DOKUMEN - daftar semua versi yang pernah
         * diupload, lengkap dengan tombol jadikan-aktif, lihat, & hapus
         * permanen; plus jalur untuk menambah versi baru.
         * @param {string} stationId
         */
        function openEmpEditModal(stationId) {
            const station = empStations.find(function (s) { return s.id === stationId; });
            if (!station) { showToast('Data stasiun tidak ditemukan, coba muat ulang halaman.'); return; }

            empResetUploadModal_();
            empEditingStationId = stationId;
            empDokumenTargetStationId = stationId;
            activeEmpStation = station;

            document.getElementById('emp-upload-modal-title').innerText = 'Edit Data & Dokumen Emplasemen';
            document.getElementById('emp-upload-modal-icon').className = 'fa-solid fa-pen-to-square text-[#d4af37]';
            document.getElementById('emp-upload-submit-btn').innerHTML = '<i class="fa-solid fa-check text-[#d4af37]"></i><span>Simpan Perubahan</span>';
            document.getElementById('emp-track-config-section').classList.add('hidden');
            document.getElementById('emp-edit-track-note').classList.remove('hidden');
            document.getElementById('emp-doc-manager').classList.remove('hidden');

            document.getElementById('emp-input-nama').value = station.nama || '';
            document.getElementById('emp-input-singkatan').value = station.singkatan || '';
            document.getElementById('emp-input-status').value = station.status || 'Aktif';
            document.getElementById('emp-input-tanggal').value = empTanggalUntukInputDate_(station.tanggalUpload);

            // Wilayah: kalau nilai tersimpan tidak ada di daftar (data lama/typo),
            // tambahkan sebagai opsi supaya tidak diam-diam berubah saat disimpan.
            const selWilayah = document.getElementById('emp-input-wilayah');
            selWilayah.value = station.wilayah || '';
            if (selWilayah.value !== (station.wilayah || '') && station.wilayah) {
                const opt = document.createElement('option');
                opt.value = station.wilayah;
                opt.innerText = station.wilayah + ' (nilai lama)';
                selWilayah.appendChild(opt);
                selWilayah.value = station.wilayah;
            }

            renderEmpDocManager_();
            document.getElementById('emp-upload-modal').classList.remove('hidden');
        }

        /**
         * Peringatan dini kalau nama/singkatan yang diketik ternyata sudah
         * terdaftar - user langsung tahu bahwa simpanan ini akan MEMPERBARUI
         * stasiun yang ada (bukan bikin data kembar), sebelum menekan Simpan.
         */
        let empCekDuplikatTimer_ = null;
        function empCekDuplikatStasiun() {
            clearTimeout(empCekDuplikatTimer_);
            empSedangCekNama_ = true;   // menyala sejak user masih mengetik

            // Jaring pengaman: apa pun yang terjadi, penanda dimatikan setelah
            // 6 detik. Tanpa ini, satu balasan yang tidak pernah datang akan
            // membuat tombol Simpan tertahan selamanya tanpa penjelasan.
            clearTimeout(empCekNamaBatasTimer_);
            empCekNamaBatasTimer_ = setTimeout(function () { empSedangCekNama_ = false; }, 6000);
            empCekDuplikatTimer_ = setTimeout(function () {
                const nama = document.getElementById('emp-input-nama').value.trim();
                const singkatan = document.getElementById('emp-input-singkatan').value.trim();
                const notice = document.getElementById('emp-duplikat-notice');
                if (!nama && !singkatan) { notice.classList.add('hidden'); empSedangCekNama_ = false; return; }

                // Penanda dinyalakan tepat sebelum permintaan dikirim &
                // dimatikan di kedua jalur balasannya - kalau hanya
                // dimatikan di jalur sukses, satu kegagalan jaringan akan
                // membuat tombol Simpan tertahan selamanya.
                empSedangCekNama_ = true;
                const tandaiSelesai = function () { empSedangCekNama_ = false; };

                google.script.run
                    .withSuccessHandler(function (res) {
                        tandaiSelesai();
                        if (res && res.success && res.ditemukan) {
                            document.getElementById('emp-duplikat-text').innerHTML =
                                `<strong>${escapeHtml(res.station.nama)}</strong> (${escapeHtml(res.station.singkatan)}) sudah terdaftar dengan ${res.station.jumlahDokumen} versi dokumen. ` +
                                `Menyimpan sekarang akan <strong>memperbarui</strong> data stasiun itu &amp; menambah versi dokumen baru - dokumen lama tetap tersimpan sebagai arsip.`;
                            notice.classList.remove('hidden');
                        } else {
                            notice.classList.add('hidden');
                        }
                    })
                    .withFailureHandler(function () { tandaiSelesai(); notice.classList.add('hidden'); })
                    .sap_emplasemen_cekDuplikat(currentSessionToken, nama, singkatan, empEditingStationId);
            }, 450);
        }

        // ─── PILIH BERKAS -> KONVERSI -> PRATINJAU LANGSUNG ───────────────

        /**
         * Dipanggil begitu user memilih berkas. Berkasnya LANGSUNG dikonversi
         * jadi JPG di sini (bukan nanti saat disimpan), supaya user bisa
         * melihat persis apa yang akan tersimpan - sekaligus memenuhi
         * permintaan "pratinjau langsung muncul".
         */
        /**
         * Dipanggil begitu user memilih berkas. Berkasnya LANGSUNG dikonversi
         * jadi JPG di sini, supaya user melihat persis apa yang akan tersimpan.
         *
         * Tampilan hasilnya berbeda menurut mode:
         *  - TAMBAH : deretan gambar tiap halaman (stasiun ini belum punya apa
         *             pun, jadi pratinjau di sini memang satu-satunya cara
         *             memastikan berkasnya benar).
         *  - EDIT   : cukup SATU BARIS ringkas berisi nama berkas & jumlah
         *             halaman - permintaan user, karena di modal Edit sudah ada
         *             pengelola dokumen di atasnya yang punya tombol Lihat
         *             sendiri, jadi deretan gambar di bawah cuma mengulang.
         */
        async function handleEmpFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const modeEdit = !!empEditingStationId;

            const display = document.getElementById('emp-file-name-display');
            display.innerText = file.name + ' (' + empFormatUkuran_(file.size) + ')';
            display.classList.remove('hidden');

            const kotak = document.getElementById('emp-upload-file-preview');
            const strip = document.getElementById('emp-upload-preview-strip');
            const judul = document.getElementById('emp-upload-preview-title');
            const baris = document.getElementById('emp-upload-status-line');

            // ═══ PRATINJAU DI KEDUA MODE ═══
            // Dulu pratinjau disembunyikan saat mode Edit & hanya menyisakan
            // satu baris status. Padahal justru saat MENGGANTI berkas
            // pratinjau paling dibutuhkan: yang lama akan dihapus permanen,
            // jadi memastikan berkas penggantinya benar itu penting.
            baris.classList.remove('hidden');
            baris.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[#d4af37] mr-1.5"></i>Mengubah berkas jadi JPG mutu tinggi...';
            kotak.classList.remove('hidden');
            strip.innerHTML = '<div class="flex items-center gap-2.5 text-slate-400 py-4"><i class="fa-solid fa-circle-notch fa-spin text-[#d4af37]"></i><span class="text-[11px] font-bold">Mengubah berkas jadi JPG mutu tinggi...</span></div>';
            judul.textContent = 'Pratinjau Berkas';

            empHalamanSiapKirim = [];
            empBerkasAsliPayload = null;

            try {
                const hasil = await empKonversiBerkasKeJpg_(file, function (selesai, total, ket) {
                    const teks = `${ket} (${selesai}/${total})`;
                    if (modeEdit) baris.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[#d4af37] mr-1.5"></i>' + escapeHtml(teks);
                    else strip.innerHTML = `<div class="flex items-center gap-2.5 text-slate-400 py-4"><i class="fa-solid fa-circle-notch fa-spin text-[#d4af37]"></i><span class="text-[11px] font-bold">${escapeHtml(teks)}</span></div>`;
                });

                // Berkas asli selalu disiapkan - dipakai kalau centang "simpan
                // berkas asli" aktif, atau kalau formatnya memang tak bisa dikonversi.
                empBerkasAsliPayload = { base64: await empBacaFileSebagaiBase64_(file), name: file.name, mimeType: file.type || 'application/octet-stream' };

                if (hasil.pages.length === 0) {
                    document.getElementById('emp-simpan-asli').checked = true;
                    const pesan = hasil.alasan || 'Berkas tidak bisa dikonversi.';
                    baris.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1.5"></i>' + escapeHtml(pesan);
                    {
                        strip.innerHTML = `<div class="flex items-start gap-3 text-slate-300 py-2">
                            <i class="fa-solid fa-triangle-exclamation text-2xl text-amber-400 shrink-0"></i>
                            <div class="flex-1 min-w-0 text-left">
                                <p class="text-xs font-bold break-all">${escapeHtml(file.name)}</p>
                                <p class="text-[10px] text-slate-500 mt-0.5">${escapeHtml(pesan)}</p>
                            </div>
                        </div>`;
                    }
                    return;
                }

                empHalamanSiapKirim = hasil.pages;
                const totalByte = hasil.pages.reduce(function (t, p) { return t + p.base64.length * 0.75; }, 0);

                // Baris status & pratinjau gambar ditampilkan bersama di
                // kedua mode - keterangannya berbeda, gambarnya sama.
                baris.innerHTML = modeEdit
                    ? `<i class="fa-solid fa-circle-check text-emerald-500 mr-1.5"></i>Siap diunggah sebagai versi baru: <strong>${escapeHtml(file.name)}</strong> - ${hasil.pages.length} halaman JPG (${empFormatUkuran_(totalByte)}).`
                    : `<i class="fa-solid fa-circle-check text-emerald-500 mr-1.5"></i><strong>${escapeHtml(file.name)}</strong> - ${hasil.pages.length} halaman JPG (${empFormatUkuran_(totalByte)}).`;

                judul.textContent = `Pratinjau Berkas - ${hasil.pages.length} halaman JPG (${empFormatUkuran_(totalByte)})`;
                strip.innerHTML = hasil.pages.map(function (p, i) {
                    return `<div class="inline-block align-top mr-2 mb-2 text-center">
                        <img src="data:image/jpeg;base64,${p.base64}" class="h-40 rounded-lg border border-slate-800 bg-white" alt="Halaman ${i+1}">
                        <p class="text-[9px] text-slate-500 font-bold mt-1">Hal. ${i+1} &middot; ${p.lebar}&times;${p.tinggi}px</p>
                    </div>`;
                }).join('');
            } catch (err) {
                console.log('[emp konversi] gagal:', err);
                const pesan = 'Gagal memproses berkas: ' + (err.message || err);
                baris.innerHTML = '<i class="fa-solid fa-circle-exclamation text-red-500 mr-1.5"></i>' + escapeHtml(pesan);
                strip.innerHTML = `<div class="flex items-center gap-2.5 text-red-300 py-3"><i class="fa-solid fa-circle-exclamation"></i><span class="text-[11px] font-bold">${escapeHtml(pesan)}</span></div>`;
            }
        }

        /** Format ukuran byte jadi teks pendek yang mudah dibaca. */
        function empFormatUkuran_(bytes) {
            if (!bytes) return '0 KB';
            if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        // ─── SIMPAN (tambah/edit + upload dokumen bertahap) ───────────────

        async function handleEmpUploadForm(e) {
            // ═══ HARUS PALING ATAS ═══
            // Sebelumnya penjaga di bawah ini melakukan `return` SEBELUM
            // preventDefault dipanggil. Akibatnya form tersubmit seperti form
            // HTML biasa & halaman termuat ulang - persis gejala "simpan tidak
            // berjalan, tampilan tidak berubah". Apa pun yang terjadi setelah
            // ini, pengiriman bawaan browser harus dicegah lebih dulu.
            e.preventDefault();

            // Pemeriksaan nama berjalan di latar sambil user mengetik. Kalau
            // Simpan ditekan saat pemeriksaan masih jalan, stasiun kembar bisa
            // lolos & baru ketahuan setelah datanya terlanjur ganda.
            if (empSedangCekNama_) {
                showToast('Sedang memeriksa nama stasiun - tunggu sebentar lalu simpan lagi.');
                return;
            }
            if (empUploadInProgress) { showToast('Masih dalam proses menyimpan, mohon tunggu sebentar...'); return; }
            empUploadInProgress = true;

            const btn = document.getElementById('emp-upload-submit-btn');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Menyimpan...</span>';

            function selesai(pesanSukses) {
                empUploadInProgress = false;
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
                btn.innerHTML = originalBtnHtml;
                document.getElementById('emp-upload-progress').classList.add('hidden');
                if (pesanSukses) {
                    closeEmpUploadModal();
                    showToast(pesanSukses);
                    loadEmpStations();
                }
            }

            const meta = {
                // Nama & singkatan SELALU kapital (server juga menegakkan hal
                // yang sama lewat kapitalkanMetaEmp_, jadi apa pun jalur
                // masuknya hasil akhirnya tetap seragam).
                nama: document.getElementById('emp-input-nama').value.trim().toUpperCase(),
                singkatan: document.getElementById('emp-input-singkatan').value.trim().toUpperCase(),
                wilayah: document.getElementById('emp-input-wilayah').value,
                status: document.getElementById('emp-input-status').value,
                tanggalUpload: document.getElementById('emp-input-tanggal').value
            };

            try {
                // 1. Simpan data pokok stasiun (tambah / perbarui otomatis / edit).
                let stationId, mode;
                if (empEditingStationId) {
                    const res = await empPanggil_('sap_emplasemen_update', [currentSessionToken, empEditingStationId, meta]);
                    if (!res.success) { showToast('Gagal menyimpan: ' + (res.message || '')); selesai(); return; }
                    stationId = empEditingStationId; mode = 'edit';
                } else {
                    const trackList = tempEmpTrackDetails.length ? tempEmpTrackDetails : [{ name: 'Jalur 1', length: 750 }];
                    const res = await empPanggil_('sap_emplasemen_add', [currentSessionToken, meta, trackList]);
                    if (!res.success) { showToast('Gagal menyimpan: ' + (res.message || '')); selesai(); return; }
                    stationId = res.id; mode = res.mode;
                }

                // 2. Kalau tidak ada berkas baru, cukup sampai di sini.
                if (empHalamanSiapKirim.length === 0 && !empBerkasAsliPayload) {
                    selesai(mode === 'update'
                        ? `Data ${meta.nama} diperbarui (stasiun sudah terdaftar sebelumnya).`
                        : (mode === 'edit' ? `Data ${meta.nama} berhasil diperbarui.` : `Emplasemen ${meta.nama} berhasil ditambahkan!`));
                    return;
                }

                // 3. Upload dokumen bertahap dengan progres yang terlihat.
                await empUploadDokumen_(stationId, meta.nama);
                selesai(mode === 'update'
                    ? `Data ${meta.nama} diperbarui & dokumen versi baru ditambahkan. Dokumen lama tersimpan sebagai arsip.`
                    : `Emplasemen ${meta.nama} tersimpan lengkap dengan dokumennya.`);
            } catch (err) {
                console.log('[emp simpan] gagal:', err);
                showToast('Gagal menyimpan: ' + (err.message || err));
                selesai();
            }
        }

        /**
         * Membungkus google.script.run jadi Promise, supaya alur simpan yang
         * berlapis (stasiun -> dokumen -> tiap halaman) bisa ditulis lurus
         * dengan await, bukan callback bersarang yang sulit dibaca & rawan
         * salah urutan.
         * @param {string} namaFungsi Nama fungsi backend.
         * @param {Array} args Argumen fungsi itu.
         * @return {Promise<Object>}
         */
        function empPanggil_(namaFungsi, args) {
            return new Promise(function (resolve, reject) {
                // runner disimpan dulu lalu dipakai sebagai konteks .apply() -
                // google.script.run mengandalkan `this`, jadi memanggil
                // runner[nama].apply(null, ...) akan gagal.
                const runner = google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(function (err) { reject(new Error((err && err.message) || 'Server tidak merespons.')); });
                runner[namaFungsi].apply(runner, args);
            });
        }

        /**
         * Mengirim hasil konversi ke server: mulai versi baru -> kirim tiap
         * halaman satu per satu -> tutup. Kalau gagal di tengah, versi draft
         * beserta halaman yang sudah terkirim DIBERSIHKAN dari Drive supaya
         * tidak ada berkas nyangkut yang memakan kuota.
         * @param {string} stationId
         * @param {string} namaStasiun
         */
        async function empUploadDokumen_(stationId, namaStasiun) {
            const bar = document.getElementById('emp-upload-progress');
            const barIsi = document.getElementById('emp-upload-progress-bar');
            const barTeks = document.getElementById('emp-upload-progress-text');
            bar.classList.remove('hidden');

            const total = empHalamanSiapKirim.length;
            const simpanAsli = document.getElementById('emp-simpan-asli').checked;
            // Format yang tidak bisa dikonversi WAJIB menyimpan berkas asli -
            // kalau tidak, tidak ada apa pun yang tersimpan.
            const wajibSimpanAsli = total === 0;

            function progres(n, teks) {
                const persen = total ? Math.round((n / (total + 1)) * 100) : 50;
                barIsi.style.width = persen + '%';
                barTeks.innerText = teks;
            }

            progres(0, 'Menyiapkan versi dokumen baru...');
            const mulai = await empPanggil_('sap_emplasemen_startDoc', [currentSessionToken, stationId, {
                namaAsli: empBerkasAsliPayload ? empBerkasAsliPayload.name : '',
                mimeAsli: empBerkasAsliPayload ? empBerkasAsliPayload.mimeType : '',
                jumlahHalaman: total, catatan: ''
            }]);
            if (!mulai.success) throw new Error(mulai.message || 'Gagal memulai penyimpanan dokumen.');

            try {
                for (let i = 0; i < total; i++) {
                    progres(i, `Mengunggah halaman ${i + 1} dari ${total}...`);
                    const p = empHalamanSiapKirim[i];
                    const res = await empPanggil_('sap_emplasemen_addDocPage', [currentSessionToken, mulai.docId, i + 1, p.base64, p.lebar, p.tinggi]);
                    if (!res.success) throw new Error(res.message || ('Halaman ' + (i + 1) + ' gagal diunggah.'));
                }

                progres(total, (simpanAsli || wajibSimpanAsli) ? 'Menyimpan berkas asli sebagai arsip...' : 'Menyelesaikan...');
                const kirimAsli = (simpanAsli || wajibSimpanAsli) && empBerkasAsliPayload;
                const tutup = await empPanggil_('sap_emplasemen_finishDoc', [
                    currentSessionToken, mulai.docId,
                    kirimAsli ? empBerkasAsliPayload.base64 : null,
                    kirimAsli ? empBerkasAsliPayload.name : null,
                    kirimAsli ? empBerkasAsliPayload.mimeType : null
                ]);
                if (!tutup.success) throw new Error(tutup.message || 'Gagal menutup penyimpanan dokumen.');
                progres(total + 1, 'Selesai.');

                // Cache halaman stasiun ini tidak valid lagi - dokumen aktifnya berubah.
                empBersihkanCacheStasiun_(stationId);
            } catch (err) {
                // Bersihkan draft yang gagal supaya tidak jadi sampah di Drive.
                try { await empPanggil_('sap_emplasemen_cancelDoc', [currentSessionToken, mulai.docId]); } catch (e2) { /* diabaikan */ }
                throw err;
            }
        }

        /** Buang cache gambar milik satu stasiun (dipanggil setelah dokumennya berubah). */
        function empBersihkanCacheStasiun_(stationId) {
            const station = empStations.find(function (s) { return s.id === stationId; });
            if (!station || !station.docs) { empPageCache = {}; return; }
            station.docs.forEach(function (d) {
                (d.pages || []).forEach(function (p) { delete empPageCache[p.id]; });
            });
        }

        // ─── PENGELOLA VERSI DOKUMEN (di dalam modal Edit) ────────────────

        /**
         * Menampilkan seluruh versi dokumen stasiun yang sedang diedit:
         * mana yang aktif, kapan & oleh siapa diunggah, berapa halaman, plus
         * tombol jadikan-aktif / lihat / hapus permanen. Inilah "opsi untuk
         * memperbaharui atau menghapus dokumen terdahulu" yang diminta.
         */
        function renderEmpDocManager_() {
            const wadah = document.getElementById('emp-doc-list');
            const station = empStations.find(function (s) { return s.id === empEditingStationId; });
            if (!wadah || !station) return;

            // ═══ URUTAN BERDASARKAN TANGGAL DOKUMEN ═══
            // Sebelumnya mengikuti nomor versi (urutan unggah). Yang lebih
            // berarti bagi pembaca adalah TANGGAL dokumennya - sebuah layout
            // bisa saja diunggah belakangan padahal tanggal sahnya lebih lama.
            // Kalau tanggalnya sama, nomor versi yang lebih besar didahulukan.
            const docs = (station.docs || []).slice().sort(function (a, b) {
                const ta = String(a.tanggalUpload || ''), tb = String(b.tanggalUpload || '');
                if (ta !== tb) return tb.localeCompare(ta);
                return (Number(b.versi) || 0) - (Number(a.versi) || 0);
            });
            document.getElementById('emp-doc-count-badge').textContent = docs.length + ' versi';

            if (docs.length === 0) {
                wadah.innerHTML = `<p class="text-[11px] text-slate-400 font-semibold py-3 text-center">Belum ada dokumen tersimpan untuk stasiun ini. Pilih berkas di bawah untuk mengunggah versi pertama.</p>`;
                return;
            }

            const bolehHapus = (typeof canDo === 'function') ? canDo('sap-emplasemen', 'hapus') : true;
            const bolehEdit = (typeof canDo === 'function') ? canDo('sap-emplasemen', 'edit') : true;
            wadah.innerHTML = docs.map(function (d) {
                const aktif = d.status === 'aktif';
                const tglDok = d.tanggalUpload ? formatEmpDate(d.tanggalUpload) : '-';
                const badgeStatus = aktif
                    ? `<span class="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 border border-emerald-200 text-[9px] font-extrabold">AKTIF</span>`
                    : `<span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 border border-slate-200 text-[9px] font-extrabold">ARSIP</span>`;
                const tombolAktif = aktif ? '' :
                    `<button type="button" onclick="empJadikanDokumenAktif('${d.id}')" title="Jadikan dokumen aktif" class="px-2.5 py-1 bg-[#0c1d37] hover:bg-slate-800 text-white rounded-lg text-[10px] font-bold transition"><i class="fa-solid fa-arrow-up-from-bracket mr-1"></i>Aktifkan</button>`;
                const tombolHapus = bolehHapus
                    ? `<button type="button" onclick="empHapusVersiDokumen('${d.id}', ${d.versi})" title="Hapus versi ini permanen dari Drive" class="px-2 py-1 bg-red-50 hover:bg-red-600 hover:text-white text-red-600 rounded-lg text-[10px] font-bold transition"><i class="fa-solid fa-trash-can"></i></button>`
                    : '';
                const tombolLihat = d.jumlahHalaman > 0
                    ? `<button type="button" onclick="empLihatVersiDokumen('${station.id}','${d.id}')" title="Lihat isi versi ini" class="px-2.5 py-1 bg-blue-50 hover:bg-[#0c1d37] hover:text-white text-[#0c1d37] rounded-lg text-[10px] font-bold transition"><i class="fa-solid fa-eye mr-1"></i>Lihat</button>`
                    : `<span class="text-[10px] text-slate-400 font-bold px-1">tanpa pratinjau</span>`;
                const tombolAsli = d.punyaBerkasAsli
                    ? `<button type="button" onclick="empUnduhBerkasAsli('${d.id}')" title="Unduh berkas asli sebelum konversi" class="px-2 py-1 bg-slate-100 hover:bg-slate-700 hover:text-white text-slate-600 rounded-lg text-[10px] font-bold transition"><i class="fa-solid fa-download"></i></button>`
                    : '';
                // Perbaiki: untuk versi yang isinya keliru/tidak tepat - ganti
                // berkasnya di tempat, tanpa membuat versi baru & tanpa
                // meninggalkan berkas lama yang membebani kuota Drive.
                const tombolPerbaiki = bolehEdit
                    ? `<button type="button" onclick="openEmpDocEditSubModal('${d.id}', ${d.versi})" title="Perbaiki: ganti berkas / ubah catatan versi ini" class="px-2 py-1 bg-amber-50 hover:bg-amber-500 hover:text-white text-amber-700 rounded-lg text-[10px] font-bold transition"><i class="fa-solid fa-screwdriver-wrench"></i></button>`
                    : '';

                return `<div class="p-3 rounded-xl border ${aktif ? 'border-emerald-200 bg-emerald-50/40' : 'border-slate-200 bg-slate-50/60'}">
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="px-2 py-0.5 rounded-md bg-[#0c1d37] text-white text-[10px] font-extrabold">v${d.versi}</span>
                            ${badgeStatus}
                            <span class="text-[11px] font-bold text-slate-700">${d.jumlahHalaman} halaman</span>
                        </div>
                        <div class="flex items-center gap-1.5">${tombolLihat}${tombolAktif}${tombolPerbaiki}${tombolAsli}${tombolHapus}</div>
                    </div>
                    <p class="text-[10px] text-slate-500 font-semibold mt-1.5 break-all">
                        <i class="fa-regular fa-clock mr-1"></i>${escapeHtml(formatEmpDate(d.tanggalUpload))}
                        &middot; ${escapeHtml(d.uploadedByNama || '-')}
                        ${d.namaAsli ? '&middot; ' + escapeHtml(d.namaAsli) : ''}
                    </p>
                    ${d.catatan ? `<p class="text-[10px] text-slate-600 font-bold mt-1 italic"><i class="fa-solid fa-note-sticky text-[#d4af37] mr-1"></i>${escapeHtml(d.catatan)}</p>` : ''}
                </div>`;
            }).join('');
        }

        function empJadikanDokumenAktif(docId) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal: ' + (res.message || '')); return; }
                    showToast('Versi dokumen ini sekarang jadi dokumen aktif.');
                    // Modal ditutup setelah selesai - pekerjaannya sudah rampung,
                    // dan membiarkannya terbuka membuat user ragu apakah masih
                    // ada yang perlu ditekan.
                    empMuatUlangUntukModalEdit_();
                    setTimeout(function () { tutupModalEditEmp_(); }, 500);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat mengganti dokumen aktif.'); })
                .sap_emplasemen_setActiveDoc(currentSessionToken, docId);
        }

        async function empHapusVersiDokumen(docId, versi) {
            const setuju = await konfirmasi_({
                judul: 'Hapus dokumen versi ' + versi + '?',
                pesan: 'Seluruh halaman JPG dan berkas aslinya akan dihapus <strong>permanen</strong> dari Google Drive. Tindakan ini tidak bisa dibatalkan.',
                rincian: '<i class="fa-solid fa-file-pdf text-red-500 mr-1.5"></i>Versi ' + versi + ' &mdash; termasuk berkas asli di Drive',
                ya: 'Ya, Hapus Permanen', ikonYa: 'fa-trash-can'
            });
            if (!setuju) return;
            google.script.run
                .withSuccessHandler(function (res) {

        /** Muat ulang data lalu segarkan daftar dokumen di modal Edit yang sedang terbuka. */
        /** Menutup modal Edit Data & Dokumen Emplasemen. */
        function tutupModalEditEmp_() {
            const modal = document.getElementById('emp-upload-modal');
            if (modal) modal.classList.add('hidden');

        function empMuatUlangUntukModalEdit_() {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) return;
                    empStations = res.data;
                    renderEmplasemenTable();
                    if (empEditingStationId) {
                        activeEmpStation = empStations.find(function (s) { return s.id === empEditingStationId; }) || null;

        /**
         * Buka viewer untuk satu versi tertentu (dipanggil dari pengelola
         * dokumen). Untuk versi ARSIP, daftar halamannya belum ikut terkirim
         * di sap_emplasemen_getAll (sengaja, demi kecepatan muat pertama),
         * jadi diambil dulu di sini baru viewer dibuka.
         */
        function empLihatVersiDokumen(stationId, docId) {
            const station = empStations.find(function (s) { return s.id === stationId; });
            if (!station) return;
            const doc = (station.docs || []).find(function (d) { return d.id === docId; });
            if (!doc) return;

            if (doc.pagesDimuat || (doc.pages && doc.pages.length)) { empBukaViewer_(station, doc); return; }

            showToast('Menyiapkan dokumen versi ' + doc.versi + '...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat halaman dokumen.'); return; }
                    doc.pages = res.pages || [];
                    doc.pagesDimuat = true;
                    empBukaViewer_(station, doc);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat halaman dokumen.'); })
                .sap_emplasemen_getDocPages(currentSessionToken, docId);

        // ─── SUB-MODAL: perbaiki satu versi dokumen ───────────────────────
        //
        // Untuk versi yang isinya keliru atau tidak tepat: berkasnya bisa
        // diganti DI TEMPAT (nomor versi & status aktif/arsipnya tetap),
        // dan/atau catatannya diperbaiki. Berkas lama dihapus permanen dari
        // Drive supaya tidak menumpuk jadi beban kuota.

        function openEmpDocEditSubModal(docId, versi) {
            const station = empStations.find(function (s) { return s.id === empEditingStationId; });
            const doc = station ? (station.docs || []).find(function (d) { return d.id === docId; }) : null;
            if (!doc) { showToast('Versi dokumen tidak ditemukan.'); return; }

            empHalamanPerbaikan = [];
            empBerkasAsliPerbaikan = null;

            document.getElementById('emp-docedit-subtitle').innerText = `${station.nama} - ${doc.jumlahHalaman} halaman tersimpan saat ini`;
            document.getElementById('emp-docedit-catatan').value = doc.catatan || '';

            // Isian stasiun & tanggal dokumen ikut dimuat, supaya modal ini
            // bisa dipakai menyunting seluruh data - bukan hanya catatan.
            document.getElementById('emp-docedit-nama').value = station.nama || '';
            document.getElementById('emp-docedit-singkatan').value = station.singkatan || '';
            document.getElementById('emp-docedit-status-emp').value = station.status || 'Aktif';

            document.getElementById('emp-docedit-file').value = '';
            const pvKotak = document.getElementById('emp-docedit-preview');

            document.getElementById('emp-docedit-status').classList.add('hidden');
            document.getElementById('emp-docedit-progress').classList.add('hidden');
            document.getElementById('emp-doc-edit-submodal').classList.remove('hidden');
