            const judul = ['NO.', 'RESOR', 'NO JPL', 'LOKASI (KM/HM)', 'LINTAS', 'ANTARA', 'KORIDOR',
                'LEBAR JPL (M)', 'NAMA JALAN', 'KATEGORI JALAN', 'KODYA/KAB', 'PROVINSI',
                'REGISTER/TIDAK REGISTER', 'DIJAGA/TIDAK DIJAGA', 'DOMAIN PENJAGAAN',
                'LALU LINTAS PADAT / TIDAK', 'POSISI PUSAT KOTA / TIDAK', 'KETERANGAN'];

            const contoh = [1, '1.1 JAKARTAKOTA', '7A', '2 + 876', 'Jakk - Tpk', 'Kpb - Ac', 'Jak - Tpk',
                '6', 'Jl. Contoh', 'Jalan Kota', 'Jakarta Utara', 'DKI JAKARTA',
                'REGISTER', 'TIDAK DIJAGA', 'TAK TERJAGA',
                'PADAT', 'PUSAT KOTA', 'CONTOH - ' + JPL_PENANDA_CONTOH];

            // Baris panduan isian. Ditaruh di baris ketiga & dimulai dengan
            // tanda "-" supaya pembaca melewatinya (baris tanpa Resor, Nama
            // Jalan, maupun Lokasi KM memang dilewati), tapi tetap terlihat
            // oleh orang yang membuka berkasnya.
            const panduan = ['', '', '', '', '', '', '', '', '', '', '', '',
                'REGISTER / TIDAK REGISTER', 'DIJAGA / TIDAK DIJAGA',
                'JJ / OP / DISHUB / SWADAYA MASYARAKAT / INSTANSI LAIN / TAK TERJAGA',
                'PADAT / TIDAK', 'PUSAT KOTA / TIDAK', 'bebas - tidak akan tertimpa kosong saat impor'];

            const ws = XLSX.utils.aoa_to_sheet([judul, contoh, panduan]);
            ws['!cols'] = judul.map(function (h, i) { return { wch: (i === 0 ? 5 : (i === 17 ? 40 : Math.max(14, h.length + 2))) }; });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Register Perlintasan');
            XLSX.writeFile(wb, 'Template_Register_Perlintasan.xlsx');
            showToast('Template diunduh. Isi datanya, lalu pilih berkasnya di langkah berikut.');
        }

        function jplExportExcel_() {
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat.'); return; }
            const d = jplTampil_ || [];
            if (!d.length) { showToast('Tidak ada data untuk diexport - longgarkan penyaringnya dulu.'); return; }
            const j = jplJudulEkspor_();
            const judul = j.tetap.concat(j.tahun).concat(j.ekor);
            const aoa = [judul].concat(d.map(function (x, i) { return jplBarisEkspor_(x, i, j.tahun); }));

            const ws = XLSX.utils.aoa_to_sheet(aoa);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Register Perlintasan');
            XLSX.writeFile(wb, 'Register_Perlintasan_' + new Date().toISOString().slice(0, 10) + '.xlsx');
            showToast(d.length + ' baris diexport. Berkas ini bisa langsung dipakai untuk impor balik.');
        }

        /**
         * Cetak daftar - memakai kerangka cetak yang SAMA dengan menu
         * Rekapitulasi Gangguan (bangunDokumenPdf_ di Script_Gangguan.html),
         * jadi hasilnya satu keluarga dengan cetakan lain di aplikasi ini.
         */
        function jplCetak_() {
            const d = jplTampil_ || [];
            if (!d.length) { showToast('Tidak ada data untuk dicetak.'); return; }
            if (typeof bangunDokumenPdf_ !== 'function' || typeof cetakDokumenPdf_ !== 'function') {
                showToast('Modul cetak belum termuat - muat ulang halaman.');
                return;
            }

            // Susunan kolom cetakan DISAMAKAN dengan tabel di layar: tanpa
            // LAKA & PRIORITAS, dengan KETERANGAN yang lega. Cetakan yang
            // berbeda susunan dari layarnya memaksa pembacanya mencocokkan
            // dua bentuk yang seharusnya satu.
            const kolom = [
                { judul: 'NO', lebar: '3%', rata: 'center' }, { judul: 'RESOR', lebar: '14%' },
                { judul: 'JPL', lebar: '5%', rata: 'center' }, { judul: 'KM', lebar: '7%' },
                { judul: 'NAMA JALAN', lebar: '20%' }, { judul: 'LINTAS', lebar: '10%' },
                { judul: 'PENJAGAAN', lebar: '12%' }, { judul: 'STATUS', lebar: '9%', rata: 'center' },
                { judul: 'KETERANGAN', lebar: '20%' }
            ];
            const baris = d.map(function (x, i) {
                return [
                    '<span style="color:#94a3b8;font-weight:bold">' + (i + 1) + '</span>',
                    escapeHtml(x.resor),
                    '<b>' + escapeHtml(x.noJpl || '-') + '</b>',
                    escapeHtml(x.lokasiKm),
                    '<b>' + escapeHtml(x.namaJalan || '-') + '</b>',
                    escapeHtml(x.lintas),
                    escapeHtml(x.domainJaga || '-'),
                    '<span style="font-weight:bold;color:' + (x.statusJaga === 'DIJAGA' ? '#107573' : '#e11d48') + '">' +
                        escapeHtml(x.statusJaga || '-') + '</span>',
                    escapeHtml(x.keterangan)
                ];
            });

            const takJaga = d.filter(function (x) { return x.statusJaga === 'TIDAK DIJAGA'; }).length;
            const takReg = d.filter(function (x) { return x.statusRegister === 'TIDAK REGISTER'; }).length;
            const jmlLaka = d.reduce(function (t, x) { return t + x.totalLaka; }, 0);
            const tinggi = d.filter(function (x) { return x.tingkat === 'Tinggi'; }).length;

            // Penyaring yang sedang menyala dicetak di kepala dokumen. Tanpa
            // itu, cetakan hasil saringan tidak bisa dibedakan dari cetakan
            // seluruh data - & itu jenis kesalahan yang baru ketahuan saat
            // dokumennya sudah beredar.
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value : 'Semua'; };
            const labelLaka = { ada: 'pernah ada kecelakaan', tidak: 'belum pernah kecelakaan' };
            const saring = [['Resor', 'jpl-f-resor'], ['Lintas', 'jpl-f-lintas'], ['Provinsi', 'jpl-f-provinsi'],
                ['Terdaftar resmi', 'jpl-f-register'], ['Penjagaan', 'jpl-f-jaga'], ['Dijaga oleh', 'jpl-f-domain'],
                ['Riwayat kecelakaan', 'jpl-f-laka'], ['Prioritas', 'jpl-f-prioritas']]
                .map(function (p) {
                    const v = ambil(p[1]);
                    if (!v || v === 'Semua') return '';
                    return p[0] + ': ' + (labelLaka[v] || v);
                })
                .filter(Boolean);

            cetakDokumenPdf_(bangunDokumenPdf_({
                judul: 'Register Perlintasan Sebidang KA',
                subJudul: d.length + ' titik perlintasan',
                filterTeks: saring.length ? saring.join('    |    ') : 'Seluruh data (tanpa penyaring khusus)',
                kpi: [
                    { label: 'Total Titik', nilai: String(d.length), warna: PDF_WARNA.teal },
                    { label: 'Tidak Dijaga', nilai: String(takJaga), warna: PDF_WARNA.merah },
                    { label: 'Tidak Register', nilai: String(takReg), warna: PDF_WARNA.gold },
                    { label: 'Kejadian Kecelakaan', nilai: String(jmlLaka), warna: PDF_WARNA.merahKai || PDF_WARNA.merah },
                    { label: 'Prioritas Tinggi', nilai: String(tinggi), warna: PDF_WARNA.navy }
                ],
                sorotan: tinggi
                    ? '<u>' + tinggi + ' titik</u> berprioritas tinggi &mdash; seluruhnya pernah mengalami kecelakaan. ' +
                      'Prioritas adalah alat bantu urut, bukan penilaian risiko resmi.'
                    : '',
                isi: '<div class="judul-bagian">DAFTAR PERLINTASAN</div>' + tabelPdf_(kolom, baris)
            }));
            showToast(d.length + ' baris disiapkan - pilih "Save as PDF" di jendela cetak.');
        }
</script>
