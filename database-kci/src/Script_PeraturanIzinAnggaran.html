<!--
  Script_PeraturanIzinAnggaran.html
  Logic untuk modul Peraturan Perusahaan dan Izin Linpel & IOPS. SUDAH
  tersambung ke backend nyata (Google Sheets, lewat Module_PeraturanIzin.gs).
  Modul Serapan Anggaran pada desain awal masih statis (tidak ada data
  dinamis/tabel), jadi tidak ada logic tambahan untuk itu.
-->
<script>
        // ─── FUNGSI DASAR (cadangan mandiri) ─────────────────────────────
        // Definisi cadangan fungsi umum yang dipakai file ini. Ditanam di
        // SETIAP Script_*.html dengan pola idempotent (window.x = window.x
        // || ...) supaya file ini TETAP BERFUNGSI walau SharedScripts.html
        // kebetulan belum ter-update ke versi terbaru. Ini mencegah satu
        // file yang ketinggalan versi merusak seluruh modul lain.
        window.escapeHtml = window.escapeHtml || function (val) {
            if (val === null || val === undefined) return '';
            return String(val)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };
        window.startLoadingWatchdog = window.startLoadingWatchdog || function () { return null; };


        // Cache data dari server - BUKAN dummy lagi.
        let regulasiData = [];
        let linpelData = [];
        let iopsData = [];
        let listPeraturanCategories = [];

        let activeDeleteContext = "regulasi";
        let documentToDeleteId = null;

        // ─── LOAD DARI SERVER ─────────────────────────────────────────

        /**
         * Menu Peraturan Perusahaan sekarang memakai Arsip Dokumen v2
         * (lima submenu). Nama fungsi ini dipertahankan karena dipanggil
         * dari switchTab() di SharedScripts.html.
         */
        function loadPeraturanDokumen() { loadArsipDokumen(); }


        // ════════════════════════════════════════════════════════════════
        // AUDIT BERBAGI - dokumen yang masih terbuka untuk umum di Drive
        // ════════════════════════════════════════════════════════════════
        //
        // Tiga pemeriksaan dijalankan sekaligus saat modal dibuka:
        //   1. peraturan_arsip_auditBerbagi  - berkas arsip yang aksesnya
        //      masih ANYONE / ANYONE_WITH_LINK di Google Drive.
        //   2. peraturan_getDokumen          - sisa baris di sheet LAMA
        //      'PeraturanDokumen', peninggalan rancangan sebelum arsip
        //      berversi dipakai. Sheet itu tidak lagi dibaca menu mana pun,
        //      jadi isinya tidak pernah terlihat - padahal ikut memakan
        //      kuota sel & ikut tersalin tiap kali mencadangkan.
        //   3. (tombol) peraturan_arsip_cabutAksesPublik - menutup semuanya.

        let auditBerbagiHasil_ = null;

        function bukaAuditBerbagi() {
            if (typeof canDo === 'function' && !canDo('peraturan-dokumen', 'edit')) {
                showToast('Hanya petugas yang boleh mengubah dokumen yang bisa menjalankan audit berbagi.');
                return;
            }
            gambarModalAudit_('<div class="py-10 text-center text-slate-400 font-bold text-xs">' +
                '<i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#0c1d37]"></i>' +
                'Memeriksa berkas satu per satu di Google Drive...</div>');

            let sisa = 2;
            const hasil = { audit: null, lama: null };
            const selesai = function () { if (--sisa === 0) { auditBerbagiHasil_ = hasil; gambarIsiAudit_(hasil); } };

            google.script.run
                .withSuccessHandler(function (res) { hasil.audit = res; selesai(); })
                .withFailureHandler(function () { hasil.audit = { success: false, message: 'Pemeriksaan gagal dijalankan.' }; selesai(); })
                .peraturan_arsip_auditBerbagi(currentSessionToken);

            google.script.run
                .withSuccessHandler(function (res) { hasil.lama = res; selesai(); })
                .withFailureHandler(function () { hasil.lama = { success: false }; selesai(); })
                .peraturan_getDokumen(currentSessionToken);
        }

        function gambarIsiAudit_(hasil) {
            const a = hasil.audit || {};
            if (!a.success) {
                gambarModalAudit_('<div class="p-3.5 rounded-2xl bg-red-50 border border-red-200 text-[11px] font-bold text-red-800">' +
                    escapeHtml(a.message || 'Pemeriksaan gagal.') + '</div>');
                return;
            }

            const terbuka = a.terbuka || [];
            const bolehCabut = (typeof canDo !== 'function') || canDo('peraturan-dokumen', 'hapus');

            const ringkas = terbuka.length
                ? '<div class="p-3.5 rounded-2xl bg-red-50 border border-red-300">' +
                    '<p class="text-xs font-black text-red-900"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>' +
                    terbuka.length + ' dokumen terbuka untuk umum</p>' +
                    '<p class="text-[11px] font-semibold text-red-800 mt-1 leading-relaxed">Siapa pun yang punya tautannya bisa membuka berkas ini tanpa login, ' +
                    'termasuk orang di luar KCI. Dari ' + (a.jumlahDiperiksa || 0) + ' berkas yang diperiksa.</p></div>'
                : '<div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200">' +
                    '<p class="text-xs font-black text-emerald-800"><i class="fa-solid fa-circle-check mr-1.5"></i>Tidak ada dokumen yang terbuka untuk umum</p>' +
                    '<p class="text-[11px] font-semibold text-emerald-700 mt-1">Seluruh ' + (a.jumlahDiperiksa || 0) + ' berkas arsip hanya bisa dibuka lewat aplikasi.</p></div>';

            const daftar = terbuka.length
                ? '<div><p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Dokumen Terbuka</p>' +
                    terbuka.map(function (d) {
                        return '<div class="p-2.5 bg-red-50 border border-red-200 rounded-xl mb-1.5">' +
                            '<p class="text-[11px] font-black text-red-900">' + escapeHtml(d.judul || '(tanpa judul)') + '</p>' +
                            '<p class="text-[10px] text-red-700 font-bold mt-0.5">' + escapeHtml(d.subMenu || '-') +
                            ' &middot; <span class="font-mono">' + escapeHtml(d.akses || '') + '</span></p></div>';
                    }).join('') + '</div>'
                : '';

            // ── Sisa data di sheet lama ──
            const l = hasil.lama || {};
            const jumlahLama = (l.success && l.data) ? l.data.length : 0;
            const bagianLama = jumlahLama
                ? '<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl">' +
                    '<p class="text-[11px] font-black text-amber-900"><i class="fa-solid fa-box-archive mr-1.5"></i>' +
                    jumlahLama + ' baris tersisa di sheet lama <span class="font-mono">PeraturanDokumen</span></p>' +
                    '<p class="text-[11px] text-amber-800 font-semibold mt-1 leading-relaxed">Sheet itu peninggalan rancangan sebelum arsip berversi dipakai, ' +
                    'dan sudah tidak dibaca menu mana pun. Cocokkan isinya dengan Document Repository; kalau semuanya sudah ada di sana, ' +
                    'sheet itu aman dihapus lewat Google Sheets untuk membebaskan kuota sel.</p>' +
                    '<p class="text-[10px] text-amber-700 font-bold mt-1.5">Contoh: ' +
                    escapeHtml((l.data || []).slice(0, 3).map(function (x) { return x.title || x.number || x.id; }).join(' \u00B7 ')) + '</p></div>'
                : '<div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-[11px] font-semibold text-slate-500">' +
                    '<i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i>Sheet lama <span class="font-mono">PeraturanDokumen</span> sudah kosong.</div>';

            const tombolCabut = terbuka.length
                ? (bolehCabut
                    ? '<button onclick="jalankanCabutAksesPublik()" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5">' +
                      '<i class="fa-solid fa-lock"></i><span>Cabut Semua Akses Publik</span></button>'
                    : '<span class="text-[11px] font-bold text-slate-400">Hanya role dengan izin hapus yang bisa mencabut akses.</span>')
                : '';

            gambarModalAudit_(ringkas + daftar + bagianLama, tombolCabut);
        }

        /**
         * Mencabut akses publik seluruh dokumen arsip sekaligus.
         *
         * Setelah ini, dokumen HANYA bisa dibuka dari dalam aplikasi. Tautan
         * ke Drive yang terlanjur dibagikan ke luar akan berhenti berfungsi -
         * itu memang tujuannya, tapi perlu disebut lebih dulu supaya tidak
         * mengagetkan.
         */
        function jalankanCabutAksesPublik() {
            const jumlah = ((auditBerbagiHasil_ && auditBerbagiHasil_.audit && auditBerbagiHasil_.audit.terbuka) || []).length;

            const lanjut = function () {
                gambarModalAudit_('<div class="py-10 text-center text-slate-400 font-bold text-xs">' +
                    '<i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#0c1d37]"></i>Menutup akses publik...</div>');
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) {
                            showToast('Gagal mencabut akses: ' + ((res && res.message) || 'tidak diketahui.'));
                            bukaAuditBerbagi();
                            return;
                        }
                        showToast('Akses publik ' + res.dicabut + ' dokumen dicabut' +
                            (res.gagal ? ', ' + res.gagal + ' berkas tidak terbaca.' : '.'));
                        bukaAuditBerbagi();   // periksa ulang supaya hasilnya terlihat
                    })
                    .withFailureHandler(function () {
                        showToast('Terjadi kesalahan saat mencabut akses publik.');
                        bukaAuditBerbagi();
                    })
                    .peraturan_arsip_cabutAksesPublik(currentSessionToken);
            };

            if (typeof konfirmasi_ === 'function') {
                konfirmasi_({
                    judul: 'Cabut akses publik ' + jumlah + ' dokumen?',
                    pesan: 'Dokumen hanya bisa dibuka dari dalam aplikasi setelah ini. Tautan Drive yang sudah terlanjur dibagikan ke luar akan berhenti berfungsi.',
                    ya: 'Cabut Sekarang', ikonYa: 'fa-lock', ikon: 'fa-shield-halved'
                }).then(function (ya) { if (ya) lanjut(); });
            } else {
                lanjut();
            }
        }

        /** Modal audit dibangun saat dipakai, jadi tidak menambah berkas Modals_*. */
        function gambarModalAudit_(isi, tombolAksi) {
            let modal = document.getElementById('modal-audit-berbagi');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-audit-berbagi';
                modal.className = 'hidden fixed inset-0 z-[96] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                document.body.appendChild(modal);
            }
            modal.innerHTML =
                '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">' +
                    '<div class="px-6 py-4 bg-[#0c1d37] text-white flex items-center justify-between shrink-0">' +
                        '<div><h3 class="font-extrabold text-sm tracking-tight flex items-center gap-2">' +
                            '<i class="fa-solid fa-shield-halved text-[#d4af37]"></i><span>Audit Berbagi Dokumen</span></h3>' +
                            '<p class="text-[11px] text-slate-400 font-medium mt-0.5">Siapa saja yang bisa membuka berkas arsip di Google Drive</p></div>' +
                        '<button onclick="tutupAuditBerbagi()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>' +
                    '</div>' +
                    '<div class="p-6 space-y-4 overflow-y-auto flex-1">' + isi + '</div>' +
                    '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end items-center gap-2 shrink-0">' +
                        (tombolAksi || '') +
                        '<button onclick="tutupAuditBerbagi()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Tutup</button>' +
                    '</div>' +
                '</div>';
            modal.classList.remove('hidden');
        }

        function tutupAuditBerbagi() {
            const modal = document.getElementById('modal-audit-berbagi');
            if (modal) modal.classList.add('hidden');
        }



        function loadLinpelData() {
            const tbody = document.getElementById('linpel-table-body');
            if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 font-bold">Memuat data...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { linpelData = res.data; renderLinpelTable(); }
                    else { showToast('Gagal memuat data: ' + (res.message || '')); if (tbody) tbody.innerHTML = ''; }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat data.'); })
                .peraturan_getLinpel(currentSessionToken);
        }

        function loadIopsData() {
            const tbody = document.getElementById('iops-table-body');
            if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 font-bold">Memuat data...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { iopsData = res.data; renderIopsTable(); }
                    else { showToast('Gagal memuat data: ' + (res.message || '')); if (tbody) tbody.innerHTML = ''; }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat data.'); })
                .peraturan_getIops(currentSessionToken);
        }

        /**
         * Mengambil daftar kategori dari server, lalu mengisi SEMUA
         * dropdown yang butuh daftar kategori (form upload & filter tabel).
         */
        function loadPeraturanKategori() {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        listPeraturanCategories = res.data.map(function (k) { return k.nama; });
                        populateSelect('input-doc-category', listPeraturanCategories);
                        populateSelect('filter-reg-doc-type', listPeraturanCategories, 'Semua', 'Semua Kategori');
                        renderPeraturanCategories();
                    } else {
                        showToast('Gagal memuat kategori: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat kategori.'); })
                .peraturan_getKategori(currentSessionToken);
        }

        // ─── DOKUMEN REGULASI ─────────────────────────────────────────

        function renderPeraturanTable() {
            const tbody = document.getElementById('peraturan-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            regulasiData.forEach((doc, idx) => {
                const badge = { "Berlaku": "bg-emerald-100 text-emerald-800", "Dalam Revisi": "bg-amber-100 text-amber-800",
                    "Tidak Berlaku": "bg-red-100 text-red-800" } [doc.status] || "bg-slate-100 text-slate-800";
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 transition text-center h-12">
                        <td class="px-4 py-3 border-r border-slate-200 font-extrabold text-slate-400 text-center">${idx+1}</td>
                        <td class="px-5 py-3 border-r border-slate-200 font-mono text-[#0c1d37] font-extrabold text-center">${escapeHtml(doc.number)}</td>
                        <td class="px-5 py-3 border-r border-slate-200 text-left text-slate-800 text-xs">${escapeHtml(doc.title)}</td>
                        <td class="px-5 py-3 border-r border-slate-200 text-left text-slate-500 font-medium leading-normal">${escapeHtml(doc.desc)}</td>
                        <td class="px-4 py-3 border-r border-slate-200 text-center">
                            <span class="px-2.5 py-0.5 rounded text-[9px] font-black uppercase tracking-wider ${badge}">${escapeHtml(doc.status)}</span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center space-x-1.5">
                                <button onclick="openFullscreenReader('regulasi', '${doc.id}')" class="p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg"><i class="fa-solid fa-eye text-xs"></i></button>
                                <button onclick="triggerFileDownload('${doc.id}', 'regulasi')" class="p-2 bg-[#d4af37]/20 text-[#d4af37] hover:bg-[#d4af37]/40 rounded-lg"><i class="fa-solid fa-cloud-arrow-down text-xs"></i></button>
                                <button onclick="openConfirmModal('regulasi', '${doc.id}')" class="p-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg"><i class="fa-solid fa-trash-can text-xs"></i></button>
                            </div>
                        </td>
                    </tr>
                `);
            });
            if (regulasiData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400 font-bold">Belum ada dokumen.</td></tr>';
            }
        }


        // ─── KATEGORI DOKUMEN ─────────────────────────────────────────

        function renderPeraturanCategories() {
            const container = document.getElementById('list-peraturan-categories');
            if (!container) return;
            container.innerHTML = '';
            listPeraturanCategories.forEach((cat, idx) => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center justify-between bg-slate-50 p-2.5 border border-slate-200 rounded-xl font-bold text-xs animate-fade-in">
                        <span>${cat}</span>
                        <button onclick="removePeraturanCategory('${cat}')" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `);
            });
        }

        /**
         * Sisa dari menu "Kategori Peraturan" yang sudah digantikan Summary
         * Arsip. Elemennya tidak ada lagi, jadi fungsinya berhenti dengan
         * aman - dibiarkan supaya pemanggilan lama (kalau ada) tidak error.
         * Pengelolaan kategori kini ada di tombol Kelola Parameter tiap arsip.
         */
        function addPeraturanCategory() {
            const input = document.getElementById('add-reg-cat-input');
            if (!input) return;
            const val = input.value.trim();
            if (!val || listPeraturanCategories.includes(val)) return;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        input.value = '';
                        showToast(`Kategori ${val} berhasil ditambahkan.`);
                        loadPeraturanKategori();
                    } else {
                        showToast('Gagal menambah kategori: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menambah kategori.'); })
                .peraturan_addKategori(currentSessionToken, val);
        }

        function removePeraturanCategory(nama) {
            if (!confirm(`Yakin ingin menghapus kategori "${nama}"?`)) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        showToast("Kategori berhasil dihapus.");
                        loadPeraturanKategori();
                    } else {
                        showToast('Gagal menghapus: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus kategori.'); })
                .peraturan_deleteKategori(currentSessionToken, nama);
        }

        // ─── LINPEL / IOPS ──────────────────────────────────────────────

        function renderLinpelTable() {
            const tbody = document.getElementById('linpel-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            linpelData.forEach((doc, idx) => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 transition text-center h-12">
                        <td class="px-4 py-3 border-r border-slate-200 font-extrabold text-slate-400 text-center">${idx+1}</td>
                        <td class="px-5 py-3 border-r border-slate-200 font-mono text-[#0c1d37] text-left font-extrabold">${escapeHtml(doc.number)}</td>
                        <td class="px-5 py-3 border-r border-slate-200 font-bold text-slate-800 text-xs">${escapeHtml(doc.validTill)}</td>
                        <td class="px-5 py-3 border-r border-slate-200 text-left text-slate-500 font-medium leading-normal">${escapeHtml(doc.desc)}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center space-x-1.5">
                                <button onclick="openFullscreenReader('linpel', '${doc.id}')" class="p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg"><i class="fa-solid fa-eye text-xs"></i></button>
                                <button onclick="triggerFileDownload('${doc.id}', 'linpel')" class="p-2 bg-[#d4af37]/20 text-[#d4af37] hover:bg-[#d4af37]/40 rounded-lg"><i class="fa-solid fa-cloud-arrow-down text-xs"></i></button>
                                <button onclick="openConfirmModal('linpel', '${doc.id}')" class="p-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg"><i class="fa-solid fa-trash-can text-xs"></i></button>
                            </div>
                        </td>
                    </tr>
                `);
            });
            if (linpelData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 font-bold">Belum ada data.</td></tr>';
            }
        }

        function renderIopsTable() {
            const tbody = document.getElementById('iops-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            iopsData.forEach((doc, idx) => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 transition text-center h-12">
                        <td class="px-4 py-3 border-r border-slate-200 font-extrabold text-slate-400 text-center">${idx+1}</td>
                        <td class="px-5 py-3 border-r border-slate-200 font-mono text-[#0c1d37] text-left font-extrabold">${escapeHtml(doc.number)}</td>
                        <td class="px-5 py-3 border-r border-slate-200 font-black text-[#e11d48] text-center font-mono">${escapeHtml(doc.frekuensi)} <span class="text-[9px] font-normal text-slate-400">KA</span></td>
                        <td class="px-5 py-3 border-r border-slate-200 text-center text-emerald-600 font-black">${escapeHtml(doc.sinergi)}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center space-x-1.5">
                                <button onclick="openFullscreenReader('iops', '${doc.id}')" class="p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg"><i class="fa-solid fa-eye text-xs"></i></button>
                                <button onclick="triggerFileDownload('${doc.id}', 'iops')" class="p-2 bg-[#d4af37]/20 text-[#d4af37] hover:bg-[#d4af37]/40 rounded-lg"><i class="fa-solid fa-cloud-arrow-down text-xs"></i></button>
                                <button onclick="openConfirmModal('iops', '${doc.id}')" class="p-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg"><i class="fa-solid fa-trash-can text-xs"></i></button>
                            </div>
                        </td>
                    </tr>
                `);
            });
            let total = 0;
            iopsData.forEach(item => total += Number(item.frekuensi) || 0);
            const totalEl = document.getElementById('iops-total-registered');
            if (totalEl) totalEl.innerText = total;
            if (iopsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400 font-bold">Belum ada data.</td></tr>';
            }
        }

        // ─── READER ──────────────────────────────────────────────────────

        function openFullscreenReader(type, id) {
            let doc = null;
            if (type === 'regulasi') doc = regulasiData.find(d => d.id === id);
            else if (type === 'linpel') doc = linpelData.find(d => d.id === id);
            else if (type === 'iops') doc = iopsData.find(d => d.id === id);
            if (!doc) return;
            document.getElementById('reader-doc-type').innerText = doc.category || type.toUpperCase();
            document.getElementById('reader-doc-title').innerText = doc.title || doc.number;
            document.getElementById('reader-doc-number').innerText = `PRODUK HUKUM: ${doc.number}`;
            document.getElementById('reader-doc-desc').innerText = doc.desc ||
                `Sertifikat izin resmi perjalanan KCI dengan nomor surat ${doc.number}.`;
            const fileLink = document.getElementById('reader-doc-file-link');
            if (fileLink) {
                if (doc.fileUrl) { fileLink.href = doc.fileUrl; fileLink.classList.remove('hidden'); }
                else { fileLink.classList.add('hidden'); }
            }
            document.getElementById('document-reader-fullscreen').classList.remove('hidden');
        }

        function closeFullscreenReader() { document.getElementById('document-reader-fullscreen').classList.add('hidden'); }

        /**
         * Membuka berkas asli di Drive kalau ada lampirannya (mengganti
         * toast simulasi "Mengunduh..." di desain awal dengan link nyata).
         */
        function triggerFileDownload(id, type) {
            let doc = null;
            if (type === 'regulasi') doc = regulasiData.find(d => d.id === id);
            else if (type === 'linpel') doc = linpelData.find(d => d.id === id);
            else if (type === 'iops') doc = iopsData.find(d => d.id === id);
            if (doc && doc.fileUrl) {
                window.open(doc.fileUrl, '_blank');
            } else {
                showToast('Dokumen ini belum punya berkas terlampir.');
            }
        }

        function openConfirmModal(context, id) {
            activeDeleteContext = context;
            documentToDeleteId = id;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            documentToDeleteId = null;
        }

        document.getElementById('btn-confirm-delete').addEventListener('click', () => {
            if (!documentToDeleteId) { closeConfirmModal(); return; }
            const context = activeDeleteContext;
            const id = documentToDeleteId;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        showToast("Berkas berhasil dihapus.");
                        if (context === 'regulasi') loadPeraturanDokumen();
                        else if (context === 'linpel') loadLinpelData();
                        else if (context === 'iops') loadIopsData();
                    } else {
                        showToast('Gagal menghapus: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus berkas.'); })
                .peraturan_deleteDocument(currentSessionToken, context, id);
            closeConfirmModal();
        });

        function openUploadModal() { document.getElementById('modal-upload').classList.remove('hidden'); }

        function closeUploadModal() { document.getElementById('modal-upload').classList.add('hidden'); }

        function handleFormSubmission(e) {
            e.preventDefault();
            const number = document.getElementById('input-doc-number').value;
            const title = document.getElementById('input-doc-title').value;
            const category = document.getElementById('input-doc-category').value;
            const status = document.getElementById('input-doc-status').value;
            const desc = document.getElementById('input-doc-desc').value;
            const meta = { number: number, title: title, desc: desc, category: category, status: status };

            const fileInput = document.getElementById('input-doc-file');
            const file = fileInput && fileInput.files && fileInput.files[0];

            function submit(base64Data, fileName, mimeType) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res.success) {
                            closeUploadModal();
                            document.getElementById('form-upload-internal').reset();
                            showToast("Berkas berhasil disimpan & disinkronisasikan!");
                            if (res.target === 'linpel') loadLinpelData();
                            else if (res.target === 'iops') loadIopsData();
                            else loadPeraturanDokumen();
                        } else {
                            showToast('Gagal menyimpan: ' + (res.message || ''));
                        }
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat menyimpan dokumen.'); })
                    .peraturan_submitDocument(currentSessionToken, meta, base64Data, fileName, mimeType);
            }

            if (file) {
                const reader = new FileReader();
                reader.onload = function () {
                    const base64Data = reader.result.split(',')[1];
                    submit(base64Data, file.name, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                submit(null, null, null);
            }
        }

            document.getElementById('reader-doc-type').innerText = "PREVIEW RANCANGAN";
            document.getElementById('reader-doc-title').innerText = title;
            document.getElementById('reader-doc-number').innerText = `PRODUK HUKUM: ${num}`;
            document.getElementById('reader-doc-desc').innerText = desc;
            const fileLink = document.getElementById('reader-doc-file-link');
            if (fileLink) fileLink.classList.add('hidden');
            document.getElementById('document-reader-fullscreen').classList.remove('hidden');
        }

        let arsipSubMenu = 'peraturan';

        /** Konfigurasi arsip yang sedang dibuka. */

        /**
         * Dipanggil dari kelima tombol arsip di sidebar: pindah ke pane
         * Peraturan Perusahaan sekaligus membuka arsip yang dipilih.
         */
        function bukaArsip(key) {
            if (!ARSIP_CONFIG[key]) return;
            arsipSubMenu = key;
            if (typeof switchTab === 'function') switchTab('peraturan-dokumen');
            loadArsipDokumen();
        }

        function loadArsipDokumen(paksa) {
            const tbody = document.getElementById('arsip-table-body');
            if (arsipPernahDimuat && !paksa) { terapkanArsipSubMenu_(); return; }
            if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="text-center py-10 text-slate-400 font-semibold"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-red-500"></i>Memuat arsip dokumen...</td></tr>';

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal memuat arsip: ' + (res.message || '')); if (tbody) tbody.innerHTML = ''; return; }
                    arsipDokumen = res.dokumen || [];
                    arsipParameter = res.parameter || {};
                    arsipPernahDimuat = true;
                    terapkanArsipSubMenu_();
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat arsip dokumen.'); if (tbody) tbody.innerHTML = ''; })
                .peraturan_arsip_getAll(currentSessionToken);
        }

        /** Nama lama - dipertahankan supaya pemanggilan lama tidak putus. */
        function switchArsipSubMenu(target) { bukaArsip(target); }

        /** Menyesuaikan seluruh tampilan dengan arsip yang sedang dibuka. */
        function terapkanArsipSubMenu_() {
            const cfg = cfgArsip_();

            // Tandai tombol arsip yang aktif di sidebar.
            Object.keys(ARSIP_CONFIG).forEach(function (key) {
                const btn = document.getElementById('btn-arsip-' + key);
                if (!btn) return;
                btn.classList.toggle('text-[#d4af37]', key === arsipSubMenu);
                btn.classList.toggle('text-slate-400', key !== arsipSubMenu);
            });

            // Judul di topbar ikut berganti - di rancangan, judul halaman
            // memang menjelaskan arsip mana yang sedang dibuka.
            const judulTopbar = document.getElementById('page-title');
            if (judulTopbar) judulTopbar.textContent = cfg.judul.toUpperCase();

            const btnUpload = document.getElementById('btn-arsip-upload-text');
            if (btnUpload) btnUpload.textContent = cfg.tombol;

            document.getElementById('arsip-filter-status-wrap').classList.toggle('hidden', !cfg.pakaiStatus);

            const daftar = arsipParameter[arsipSubMenu] || [];
            const sel = document.getElementById('arsip-filter-kategori');
            sel.innerHTML = '<option value="Semua">Semua Kategori</option>' +
                daftar.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>'; }).join('');

            renderArsipTable();
        }

        function hitungArsipTerfilter_() {
            const cari = (document.getElementById('arsip-search').value || '').toLowerCase();
            const kategori = document.getElementById('arsip-filter-kategori').value;
            const status = document.getElementById('arsip-filter-status').value;
            const cfg = cfgArsip_();

            return arsipDokumen.filter(function (d) {
                if (d.subMenu !== arsipSubMenu) return false;
                if (kategori !== 'Semua' && d.kategori !== kategori) return false;
                if (cfg.pakaiStatus && status !== 'Semua' && d.status !== status) return false;
                if (cari) {
                    const gabung = [d.judul, d.nomor, d.deskripsi, d.kategori, d.versi, d.lintas].join(' ').toLowerCase();
                    if (gabung.indexOf(cari) === -1) return false;
                }
                return true;
            });
        }

        /** Tombol aksi per baris - Gapeka mendapat tombol Update Revisi tambahan. */
        function tombolAksiArsip_(d) {
            const bolehEdit = (typeof canDo === 'function') ? canDo('peraturan-dokumen', 'edit') : true;
            const bolehHapus = (typeof canDo === 'function') ? canDo('peraturan-dokumen', 'hapus') : true;

                html += '<button onclick="openArsipVersiModal(\'' + d.id + '\')" title="Update Revisi Dokumen (Versi Baru)" ' +

                    '<i class="fa-solid fa-clock-rotate-left text-xs"></i></button>';

            // Preview membuka VIEWER penuh (zoom/putar/layar penuh/unduh)
            // kalau dokumennya punya berkas; kalau tidak, jatuh ke modal

            const aksiPreview = d.punyaBerkas
                ? 'bukaViewerDokumen(\'' + d.id + '\')'
                : 'openArsipPreviewModal(\'' + d.id + '\')';
            html += '<button onclick="' + aksiPreview + '" title="' + (d.punyaBerkas ? 'Buka Dokumen' : 'Lihat Detail') + '" ' +
                'class="w-7 h-7 bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-600 rounded transition flex items-center justify-center">' +
                '<i class="fa-regular fa-eye text-xs"></i></button>';

                html += '<button onclick="openArsipPreviewModal(\'' + d.id + '\')" title="Detail & Riwayat Versi" ' +
                    'class="w-7 h-7 bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-600 rounded transition flex items-center justify-center">' +
                    '<i class="fa-solid fa-circle-info text-xs"></i></button>';

                html += '<button onclick="openArsipFormModal(\'' + d.id + '\')" title="Edit Dokumen" ' +
                    'class="w-7 h-7 bg-slate-100 hover:bg-amber-500 hover:text-white text-slate-600 rounded transition flex items-center justify-center">' +
                    '<i class="fa-solid fa-pen-to-square text-xs"></i></button>';

            if (bolehHapus) {
                html += '<button onclick="hapusArsipDokumen(\'' + d.id + '\')" title="Hapus Dokumen" ' +
                    'class="w-7 h-7 bg-slate-100 hover:bg-red-600 hover:text-white text-slate-600 rounded transition flex items-center justify-center">' +
                    '<i class="fa-regular fa-trash-can text-xs"></i></button>';

            return html + '</div>';

        function renderArsipTable() {
            const cfg = cfgArsip_();
            const thead = document.getElementById('arsip-table-head');
            const tbody = document.getElementById('arsip-table-body');
            const kosong = document.getElementById('arsip-empty-state');
            if (!tbody) return;

            // Judul kolom: sebagian menyesuaikan arsip (mis. "Perihal Dokumen"

            thead.innerHTML = '<tr class="bg-slate-900 text-white text-[11px] uppercase tracking-wider font-semibold">' +
                cfg.kolom.map(function (key, i) {
                    const k = ARSIP_KOLOM[key];
                    let judul = k.judul;
                    if (key === 'judul' || key === 'judulDesk' || key === 'gapeka') judul = cfg.labelJudul.toUpperCase();
                    if (key === 'nomor') judul = cfg.labelNomor.toUpperCase();
                    // Di arsip Gapeka, kolom deskripsi juga memuat catatan
                    // perubahan versi - judulnya menyesuaikan (sesuai rancangan).
                    if (key === 'deskripsi' && cfg.pakaiVersi) judul = 'DESKRIPSI / CATATAN';
                    const garis = i < cfg.kolom.length - 1 ? ' border-r border-slate-800' : '';
                    return '<th class="py-3.5 px-4 ' + (k.lebar || '') + ' ' + (k.rata || '') + garis + '">' + escapeHtml(judul) + '</th>';

            const hasil = hitungArsipTerfilter_();
            const semuaArsipIni = arsipDokumen.filter(function (d) { return d.subMenu === arsipSubMenu; });

            document.getElementById('arsip-showing-count').textContent = hasil.length;
            document.getElementById('arsip-total-count').textContent = semuaArsipIni.length;
            document.getElementById('arsip-kategori-info').textContent =
                (arsipParameter[arsipSubMenu] || []).length + ' kategori terdaftar';

            tbody.innerHTML = '';
            if (!hasil.length) { kosong.classList.remove('hidden'); return; }
            kosong.classList.add('hidden');

            tbody.innerHTML = hasil.map(function (d, i) {
                return '<tr class="hover:bg-slate-50 transition border-b border-slate-100">' +
                    cfg.kolom.map(function (key, ki) {
                        const k = ARSIP_KOLOM[key];
                        const garis = ki < cfg.kolom.length - 1 ? ' border-r border-slate-100' : '';
                        return '<td class="py-3.5 px-4 ' + (k.rata || '') + garis + '">' + k.sel(d, i) + '</td>';
                    }).join('') + '</tr>';
            }).join('');
        }


        /** "2026-01-12" -> "12 Jan 2026". Nilai yang tidak dikenali dikembalikan apa adanya. */
        function formatTanggalArsip_(nilai) {
            const teks = String(nilai || '').trim();
            const m = teks.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (!m) return teks || '-';
            const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            return parseInt(m[3], 10) + ' ' + bulan[parseInt(m[2], 10) - 1] + ' ' + m[1];
        }

        /** Badge status - tiga nilai sesuai rancangan, lengkap dengan titik warna. */
        function badgeStatusArsip_(status) {
            const s = String(status || '').trim();
            const gaya = {
                'Berlaku': ['bg-emerald-50 text-emerald-700 border-emerald-200', 'bg-emerald-500', 'Berlaku'],
                'Perlu Review': ['bg-amber-50 text-amber-700 border-amber-200', 'bg-amber-500', 'Perlu Review'],
                'Dicabut': ['bg-rose-50 text-rose-700 border-rose-200', 'bg-rose-500', 'Dicabut']
            }[s];
            if (!gaya) return '<span class="text-slate-300">-</span>';
            return '<span class="' + gaya[0] + ' border px-2 py-0.5 rounded-full text-[10px] font-semibold inline-flex items-center gap-1">' +
                '<span class="w-1.5 h-1.5 rounded-full ' + gaya[1] + '"></span>' + gaya[2] + '</span>';
        }

        function handleArsipFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const el = document.getElementById('arsip-file-name');
            el.textContent = file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
            el.classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = async function () {
                arsipFilePayload = { base64: reader.result.split(',')[1], name: file.name, mimeType: file.type || 'application/octet-stream' };
                arsipHalamanSiapKirim = [];

                // Berkas langsung dikonversi jadi halaman JPG di sini juga -
                // hasil konversinya sekaligus dipakai sebagai pratinjau, jadi
                // apa yang dilihat user SEBELUM menyimpan sama persis dengan
                // yang nanti tampil di viewer.
                el.textContent = file.name + ' (' + Math.round(file.size / 1024) + ' KB) - menyiapkan pratinjau...';
                try {
                    arsipHalamanSiapKirim = await arsipKonversiKeJpg_(arsipFilePayload, function (i, total) {
                        el.textContent = file.name + ' - memproses halaman ' + i + '/' + total + '...';
                    });
                } catch (err) {
                    console.log('[arsip] konversi gagal:', err);
                    arsipHalamanSiapKirim = [];
                }
                el.textContent = file.name + ' (' + Math.round(file.size / 1024) + ' KB)' +
                    (arsipHalamanSiapKirim.length ? ' - ' + arsipHalamanSiapKirim.length + ' halaman siap' : '');
                gambarPratinjauForm_();
            };
            reader.readAsDataURL(file);
        }

        function handleArsipSubmit(e) {
            e.preventDefault();
            if (arsipSedangProses) { showToast('Masih menyimpan, mohon tunggu...'); return; }

            const err = document.getElementById('arsip-form-error');
            err.classList.add('hidden');
            const kategori = document.getElementById('arsip-in-kategori').value;
            if (!kategori) {
                err.textContent = 'Kategori wajib dipilih. Kalau daftarnya kosong, tambahkan dulu lewat Kelola Kategori.';
                err.classList.remove('hidden');
                return;
            }

            arsipSedangProses = true;
            const btn = document.getElementById('arsip-submit-btn');
            const htmlAsli = btn.innerHTML;
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>';

            function selesai(pesan) {
                arsipSedangProses = false;
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
                btn.innerHTML = htmlAsli;
                if (pesan) { closeArsipFormModal(); showToast(pesan); loadArsipDokumen(true); }
            }

            const meta = {
                id: arsipEditingId || '',
                subMenu: arsipSubMenu,
                nomor: cfgArsip_().pakaiVersi ? '' : document.getElementById('arsip-in-nomor').value.trim(),
                tanggal: document.getElementById('arsip-in-tanggal').value,
                judul: document.getElementById('arsip-in-judul').value.trim(),
                deskripsi: document.getElementById('arsip-in-deskripsi').value.trim(),
                kategori: kategori,
                status: document.getElementById('arsip-in-status').value,
                versi: document.getElementById('arsip-in-versi').value.trim(),
                lintas: document.getElementById('arsip-in-lintas').value.trim()
            };
            const f = arsipFilePayload;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) {
                        err.textContent = res.message || 'Penyimpanan ditolak server.';
                        err.classList.remove('hidden');
                        selesai();
                        return;
                    }
                    // Halaman pratinjau dikirim SETELAH dokumennya punya id.
                    if (arsipHalamanSiapKirim.length && res.id) {
                        arsipKirimHalaman_(res.id, arsipHalamanSiapKirim, function () {
                            arsipHalamanSiapKirim = [];
                            selesai(arsipEditingId ? 'Dokumen diperbarui beserta pratinjaunya.' : 'Dokumen tersimpan beserta pratinjaunya.');
                        });
                        return;
                    }
                    selesai(arsipEditingId ? 'Dokumen berhasil diperbarui.' : 'Dokumen berhasil disimpan ke arsip.');
                })
                .withFailureHandler(function () {
                    err.textContent = 'Terjadi kesalahan saat menghubungi server.';
                    err.classList.remove('hidden');
                    selesai();
                })
                .peraturan_arsip_save(currentSessionToken, meta,
                    f ? f.base64 : null, f ? f.name : null, f ? f.mimeType : null);
        }

        /**
         * Mengunduh berkas lewat data URI + atribut download - cara yang
         * konsisten dari dalam iframe sandbox Apps Script (Blob URL diblokir).
         */
        function unduhArsipBerkas_(id, dariVersi) {
            if (!id) return;
            showToast('Menyiapkan berkas...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal: ' + (res.message || '')); return; }
                    try {
                        const a = document.createElement('a');
                        a.href = 'data:' + (res.mimeType || 'application/octet-stream') + ';base64,' + res.base64;
                        a.download = res.fileName || 'dokumen';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } catch (err) { showToast('Unduhan diblokir browser.'); }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat mengambil berkas.'); })
                .peraturan_arsip_getFile(currentSessionToken, id, !!dariVersi);
        }

        function renameArsipParam(lama) {
            const baru = prompt('Ubah nama kategori.\n\nSeluruh dokumen yang memakai "' + lama + '" akan ikut diperbarui otomatis.', lama);
            if (baru === null) return;
            const nilaiBaru = baru.trim();
            if (!nilaiBaru || nilaiBaru === lama) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast(res.message || 'Gagal mengubah nama.'); return; }
                    showToast(res.dokumenDiperbarui > 0
                        ? 'Diubah jadi "' + nilaiBaru + '" - ' + res.dokumenDiperbarui + ' dokumen ikut diperbarui.'
                        : 'Kategori diubah jadi "' + nilaiBaru + '".');
                    loadArsipDokumen(true);
                    setTimeout(function () { renderArsipParamList_(); }, 600);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat mengubah nama kategori.'); })
                .peraturan_arsip_renameParam(currentSessionToken, arsipSubMenu, lama, nilaiBaru);
        }

        // ================================================================
        // VIEWER DOKUMEN - zoom, putar 360, layar penuh, unduh
        // ================================================================
        //
        // Berkas digambar sendiri di dalam kotak yang diatur lewat CSS
        // transform, bukan diserahkan ke pemutar bawaan browser. Alasannya:
        // aplikasi ini berjalan di dalam iframe sandbox Apps Script, di mana
        // window.open(blob:) diblokir - dokumen tidak akan pernah terbuka.
        // Dengan menggambar sendiri, zoom & rotasi juga sepenuhnya terkendali.

        let viewerSkala = 1;
        let viewerRotasi = 0;
        let viewerBerkas = null;   // {base64, mimeType, fileName}
        let viewerSumberId = null;
        let viewerDariVersi = false;

        // Posisi geser (pan) saat gambar diperbesar.
        let viewerGeserX = 0, viewerGeserY = 0;
        let viewerSedangGeser = false, viewerMulaiX = 0, viewerMulaiY = 0;

        function terapkanTransformViewer_() {
            const isi = document.getElementById('viewer-isi');
            if (!isi) return;
            // Urutan: geser dulu, lalu perbesar, baru putar. Kalau dibalik,
            // arah geser & pembesaran ikut berputar sehingga terasa meleset.
            isi.style.transform =
                'translate(' + viewerGeserX + 'px,' + viewerGeserY + 'px) ' +
                'scale(' + viewerSkala + ') rotate(' + viewerRotasi + 'deg)';

            // Kursor menandakan gambar bisa digeser - hanya saat diperbesar.
            const panggung = document.getElementById('viewer-panggung');
            if (panggung) panggung.style.cursor = viewerSkala > 1 ? 'grab' : 'default';
            const lz = document.getElementById('viewer-zoom-label');
            const lr = document.getElementById('viewer-rotasi-label');
            if (lz) lz.textContent = Math.round(viewerSkala * 100) + '%';
            if (lr) lr.textContent = ((viewerRotasi % 360) + 360) % 360 + '\u00B0';
        }

        function viewerZoom(delta) {
            viewerSkala = Math.min(5, Math.max(0.2, viewerSkala + delta));
            terapkanTransformViewer_();
        }

        function viewerPutar(derajat) {
            // Dibiarkan menumpuk terus supaya bisa berputar penuh 360 dan
            // seterusnya - labelnya yang dinormalkan ke 0-359.
            viewerRotasi += derajat;
            terapkanTransformViewer_();
        }

        function viewerReset() {
            viewerSkala = 1;
            viewerRotasi = 0;
            viewerGeserX = 0;
            viewerGeserY = 0;
            terapkanTransformViewer_();
        }

        /**
         * Memasang geser (drag) untuk memindahkan gambar yang diperbesar.
         *
         * MASALAH YANG DISELESAIKAN: setelah zoom, bagian gambar yang keluar
         * dari layar tidak bisa dijangkau. Scrollbar panggung tidak menolong
         * karena yang membesar adalah hasil CSS transform - ukuran elemennya
         * sendiri tidak ikut berubah, jadi tidak ada yang bisa digulir.
         * Penyelesaiannya: gambar digeser lewat translate, dikendalikan
         * dengan tarikan mouse maupun sentuhan jari.
         *
         * Dipasang sekali saja; penanda pasang dijaga agar tidak menumpuk.
         */
        let viewerGeserTerpasang_ = false;
        function pasangGeserViewer_() {
            if (viewerGeserTerpasang_) return;
            const panggung = document.getElementById('viewer-panggung');
            if (!panggung) return;
            viewerGeserTerpasang_ = true;

            const mulai = function (x, y) {
                if (viewerSkala <= 1) return; // belum diperbesar - tidak perlu digeser
                viewerSedangGeser = true;
                viewerMulaiX = x - viewerGeserX;
                viewerMulaiY = y - viewerGeserY;
                panggung.style.cursor = 'grabbing';
            };
            const gerak = function (x, y) {
                if (!viewerSedangGeser) return;
                viewerGeserX = x - viewerMulaiX;
                viewerGeserY = y - viewerMulaiY;
                terapkanTransformViewer_();
            };
            const selesai = function () {
                viewerSedangGeser = false;
                panggung.style.cursor = viewerSkala > 1 ? 'grab' : 'default';
            };

            panggung.addEventListener('mousedown', function (e) { e.preventDefault(); mulai(e.clientX, e.clientY); });
            window.addEventListener('mousemove', function (e) { gerak(e.clientX, e.clientY); });
            window.addEventListener('mouseup', selesai);
            panggung.addEventListener('mouseleave', selesai);

            panggung.addEventListener('touchstart', function (e) {
                if (e.touches.length === 1) mulai(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            panggung.addEventListener('touchmove', function (e) {
                if (e.touches.length === 1 && viewerSedangGeser) {
                    e.preventDefault();
                    gerak(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });
            panggung.addEventListener('touchend', selesai);

            // Zoom dengan roda mouse - lebih cepat daripada menekan tombol
            // berkali-kali saat memeriksa detail dokumen.
            panggung.addEventListener('wheel', function (e) {
                if (!e.ctrlKey && !e.shiftKey) return; // biarkan gulir biasa tetap jalan
                e.preventDefault();
                viewerZoom(e.deltaY < 0 ? 0.15 : -0.15);
            }, { passive: false });
        }

        function viewerLayarPenuh() {
            const el = document.getElementById('modal-arsip-viewer');
            if (!el) return;
            if (document.fullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
            } else if (el.requestFullscreen) {
                el.requestFullscreen().catch(function () { showToast('Browser menolak mode layar penuh.'); });
            } else {
                showToast('Browser ini tidak mendukung mode layar penuh.');
            }
        }

        function tutupViewer() {
            if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
            document.getElementById('modal-arsip-viewer').classList.add('hidden');
            document.getElementById('viewer-isi').innerHTML = '';
            document.getElementById('viewer-nav').classList.add('hidden');
            viewerBerkas = null;
            viewerHalamanLokal_ = [];
        }

        /**
         * Menggambar isi berkas ke dalam viewer.
         * PDF memakai <iframe> (pembaca PDF bawaan browser), gambar memakai
         * <img>. Jenis lain tidak bisa ditampilkan di halaman, jadi diberi
         * tawaran unduh - lebih jujur daripada menampilkan kotak kosong.
         */
        function gambarIsiViewer_(base64, mimeType, fileName) {
            const isi = document.getElementById('viewer-isi');
            const src = 'data:' + (mimeType || 'application/octet-stream') + ';base64,' + base64;

            if (String(mimeType).indexOf('image/') === 0) {
                isi.innerHTML = '<img src="' + src + '" class="max-w-none shadow-2xl rounded" style="max-height:78vh" alt="' + escapeHtml(fileName || '') + '">';
            } else if (String(mimeType).indexOf('pdf') !== -1) {
                isi.innerHTML = '<iframe src="' + src + '" class="bg-white shadow-2xl rounded" style="width:80vw;height:78vh;border:0"></iframe>';
            } else {
                isi.innerHTML = '<div class="bg-white rounded-2xl p-8 text-center shadow-2xl max-w-md">' +
                    '<i class="fa-solid fa-file-lines text-4xl text-slate-300 mb-3"></i>' +
                    '<p class="text-sm font-bold text-slate-700">' + escapeHtml(fileName || 'Dokumen') + '</p>' +
                    '<p class="text-xs text-slate-500 font-semibold mt-2">Jenis berkas ini tidak bisa ditampilkan langsung di halaman.</p>' +
                    '<button onclick="viewerUnduh()" class="mt-4 px-5 py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition">' +
                    '<i class="fa-solid fa-download mr-1.5 text-[#d4af37]"></i>Unduh untuk membuka</button></div>';
            }
            viewerReset();
        }


        /** Membuka viewer untuk berkas yang BARU dipilih (belum tersimpan). */
        function bukaViewerBerkasBaru() {
            if (!arsipFilePayload) { showToast('Belum ada berkas yang dipilih.'); return; }
            if (arsipHalamanSiapKirim.length) {
                // Tampilkan hasil konversi - sama dengan yang akan tersimpan.
                viewerHalaman = [];
                viewerSumberId = null;
                viewerBerkas = { base64: arsipFilePayload.base64, mimeType: arsipFilePayload.mimeType, fileName: arsipFilePayload.name };
                document.getElementById('viewer-judul').textContent = arsipFilePayload.name;
                document.getElementById('viewer-sub').textContent = 'Pratinjau sebelum disimpan - ' + arsipHalamanSiapKirim.length + ' halaman';
                document.getElementById('modal-arsip-viewer').classList.remove('hidden');
                pasangGeserViewer_();
                viewerHalamanLokal_ = arsipHalamanSiapKirim;
                tampilkanHalamanLokal_(0);
                return;
            }
            viewerBerkas = { base64: arsipFilePayload.base64, mimeType: arsipFilePayload.mimeType, fileName: arsipFilePayload.name };
            viewerSumberId = null;
            document.getElementById('viewer-judul').textContent = arsipFilePayload.name;
            document.getElementById('viewer-sub').textContent = 'Pratinjau sebelum disimpan';
            document.getElementById('modal-arsip-viewer').classList.remove('hidden');
            gambarIsiViewer_(arsipFilePayload.base64, arsipFilePayload.mimeType, arsipFilePayload.name);
        }

        function viewerUnduh() {
            if (viewerBerkas) { unduhDataUri_(viewerBerkas.base64, viewerBerkas.mimeType, viewerBerkas.fileName); return; }
            if (viewerSumberId) unduhArsipBerkas_(viewerSumberId, viewerDariVersi);
        }

        /** Unduh lewat data URI - cara yang bekerja di dalam iframe sandbox. */
        function unduhDataUri_(base64, mimeType, fileName) {
            try {
                const a = document.createElement('a');
                a.href = 'data:' + (mimeType || 'application/octet-stream') + ';base64,' + base64;
                a.download = fileName || 'dokumen';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (err) { showToast('Unduhan diblokir browser.'); }
        }

        // ─── PRATINJAU BERKAS SEBELUM SIMPAN ─────────────────────────────

        /** Menggambar pratinjau kecil di dalam form upload. */
        function gambarPratinjauForm_() {
            const kotak = document.getElementById('arsip-file-pratinjau');
            const isi = document.getElementById('arsip-file-pratinjau-isi');
            if (!kotak || !isi) return;
            if (!arsipFilePayload) { kotak.classList.add('hidden'); isi.innerHTML = ''; return; }

            const f = arsipFilePayload;
            // Yang ditampilkan adalah HASIL KONVERSI (JPG), bukan berkas
            // aslinya. Ini yang membuat pratinjau selalu tampil - PDF mentah
            // di dalam iframe diblokir browser pada sandbox Apps Script.
            if (arsipHalamanSiapKirim.length) {
                isi.innerHTML = '<div class="text-center w-full">' +
                    '<img src="data:image/jpeg;base64,' + arsipHalamanSiapKirim[0].base64 + '" class="max-h-56 mx-auto rounded shadow bg-white" alt="pratinjau halaman 1">' +
                    (arsipHalamanSiapKirim.length > 1
                        ? '<p class="text-[10px] font-bold text-slate-500 mt-2">Halaman 1 dari ' + arsipHalamanSiapKirim.length + ' - seluruhnya ikut tersimpan</p>'
                        : '') + '</div>';
                kotak.classList.remove('hidden');
                return;
            }
            if (false) {
                isi.innerHTML = '<div class="text-center py-6"><i class="fa-solid fa-file-lines text-3xl text-slate-300 mb-2"></i>' +
                    '<p class="text-[11px] font-bold text-slate-600">' + escapeHtml(f.name) + '</p>' +
                    '<p class="text-[10px] text-slate-400 font-semibold mt-1">Jenis berkas ini tidak bisa dipratinjau, tapi tetap tersimpan dengan benar.</p></div>';
            }
            kotak.classList.remove('hidden');
        }

        function toggleArsipRiwayat() {
            const box = document.getElementById('arsip-riwayat-box');
            if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            const daftar = document.getElementById('arsip-riwayat-list');
            daftar.innerHTML = '<p class="text-[11px] text-slate-400 font-bold py-2"><i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>Memuat riwayat...</p>';

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { daftar.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-2">Gagal memuat riwayat.</p>'; return; }
                    if (!res.data.length) { daftar.innerHTML = '<p class="text-[11px] text-slate-400 font-bold py-2 italic">Belum ada perubahan tercatat.</p>'; return; }
                    const warna = { 'Dibuat': 'bg-emerald-100 text-emerald-700', 'Diubah': 'bg-amber-100 text-amber-700',
                        'Versi Baru': 'bg-violet-100 text-violet-700', 'Dihapus': 'bg-red-100 text-red-700' };
                    daftar.innerHTML = res.data.map(function (h) {
                        return '<div class="p-2.5 bg-white border border-slate-200 rounded-xl">' +
                            '<div class="flex items-center justify-between gap-2 flex-wrap">' +
                                '<span class="px-2 py-0.5 rounded text-[9px] font-black uppercase ' + (warna[h.aksi] || 'bg-slate-100 text-slate-600') + '">' + escapeHtml(h.aksi) + '</span>' +
                                '<span class="text-[10px] text-slate-400 font-bold">' + escapeHtml(formatWaktuArsip_(h.waktu)) + '</span>' +
                            '</div>' +
                            '<p class="text-[11px] text-slate-600 font-semibold mt-1.5 break-words">' + escapeHtml(h.ringkasan || '-') + '</p>' +
                            '<p class="text-[9px] text-slate-400 font-bold mt-1">oleh ' + escapeHtml(h.olehNama || '-') + '</p>' +
                            '</div>';
                    }).join('');
                })
                .withFailureHandler(function () { daftar.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-2">Terjadi kesalahan saat memuat riwayat.</p>'; })
                .peraturan_arsip_getLog(currentSessionToken, arsipEditingId);
        }

        /** "2026-08-27T04:12:00Z" -> "27 Agu 2026, 11:12". */
        function formatWaktuArsip_(iso) {
            try {
                const d = new Date(iso);
                if (isNaN(d.getTime())) return String(iso || '-');
                const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear() + ', ' +
                    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            } catch (err) { return String(iso || '-'); }
        }

        // ─── KONFIRMASI HAPUS ────────────────────────────────────────────

        let arsipHapusId = null;

        function hapusArsipDokumen(id) {
            const d = arsipDokumen.find(function (x) { return x.id === id; });
            if (!d) return;
            arsipHapusId = id;
            document.getElementById('arsip-hapus-nama').textContent = d.judul;
            document.getElementById('arsip-hapus-detail').textContent =
                [d.nomor, d.kategori, formatTanggalArsip_(d.tanggal)].filter(Boolean).join('  \u00B7  ');
            document.getElementById('arsip-hapus-catatan').innerHTML = (d.riwayat && d.riwayat.length)
                ? 'Berkas <strong>dan ' + d.riwayat.length + ' riwayat versinya</strong> ikut terhapus permanen dari Google Drive.'
                : 'Berkas dokumen ini ikut terhapus permanen dari Google Drive.';
            document.getElementById('modal-arsip-hapus').classList.remove('hidden');
        }

        function tutupKonfirmasiHapusArsip() {
            document.getElementById('modal-arsip-hapus').classList.add('hidden');
            arsipHapusId = null;
        }

        function jalankanHapusArsip() {
            if (!arsipHapusId) return;
            const btn = document.getElementById('arsip-hapus-btn');
            const htmlAsli = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menghapus...</span>';

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    btn.innerHTML = htmlAsli;
                    if (!res.success) { showToast('Gagal menghapus: ' + (res.message || '')); return; }
                    tutupKonfirmasiHapusArsip();
                    showToast('Dokumen dihapus dari arsip.');
                    loadArsipDokumen(true);
                })
                .withFailureHandler(function () {
                    btn.disabled = false;
                    btn.innerHTML = htmlAsli;
                    showToast('Terjadi kesalahan saat menghapus dokumen.');
                })
                .peraturan_arsip_delete(currentSessionToken, arsipHapusId);
        }

        // Menggabungkan kelima arsip dalam satu tabel umum. Datanya SAMA
        // dengan yang dipakai tiap arsip (arsipDokumen), jadi tidak ada
        // pembacaan server tambahan & angkanya mustahil berbeda dari yang
        // terlihat di masing-masing menu.

        const SUM_ARSIP_LABEL = {
            peraturan: 'Peraturan Perusahaan',
            notulen: 'Notulen & Risalah',
            surat: 'Surat Masuk & Keluar',
            kajian: 'Kajian / Studi',
            gapeka: 'Gapeka'
        };
        const SUM_ARSIP_WARNA = {
            peraturan: ['bg-red-50', 'text-red-600', 'fa-scale-balanced'],
            notulen: ['bg-sky-50', 'text-sky-600', 'fa-clipboard-list'],
            surat: ['bg-emerald-50', 'text-emerald-600', 'fa-envelope-open-text'],
            kajian: ['bg-violet-50', 'text-violet-600', 'fa-file-lines'],
            gapeka: ['bg-amber-50', 'text-amber-600', 'fa-train-subway']

        function loadSummaryArsip(paksa) {
            if (arsipPernahDimuat && !paksa) { renderSummaryArsip(); return; }
            const tbody = document.getElementById('sum-arsip-body');
            if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="text-center py-10 text-slate-400 font-semibold"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-red-500"></i>Memuat seluruh arsip...</td></tr>';

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal memuat arsip: ' + (res.message || '')); return; }
                    arsipDokumen = res.dokumen || [];
                    arsipParameter = res.parameter || {};
                    arsipPernahDimuat = true;
                    isiFilterKategoriSummary_();
                    renderSummaryArsip();

                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat arsip.'); })
                .peraturan_arsip_getAll(currentSessionToken);

        /** Pilihan kategori digabung dari kelima arsip, tanpa duplikat. */
        function isiFilterKategoriSummary_() {
            const sel = document.getElementById('sum-arsip-kategori');
            if (!sel) return;
            const unik = {};
            Object.keys(arsipParameter).forEach(function (sub) {
                (arsipParameter[sub] || []).forEach(function (v) { unik[v] = true; });
            });
            const terpilih = sel.value;
            const daftar = Object.keys(unik).sort();
            sel.innerHTML = '<option value="Semua">Semua Kategori</option>' +
                daftar.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
            if (terpilih && daftar.indexOf(terpilih) !== -1) sel.value = terpilih;
        }

        function resetSummaryArsipFilter() {
            ['sum-arsip-search', 'sum-arsip-tgl-mulai', 'sum-arsip-tgl-akhir'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            ['sum-arsip-jenis', 'sum-arsip-kategori', 'sum-arsip-status'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.value = 'Semua';
            });
            renderSummaryArsip();
        }

        function hitungSummaryArsip_() {
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
            const cari = (ambil('sum-arsip-search') || '').toLowerCase();
            const jenis = ambil('sum-arsip-jenis');
            const kategori = ambil('sum-arsip-kategori');
            const status = ambil('sum-arsip-status');
            const mulai = ambil('sum-arsip-tgl-mulai');
            const akhir = ambil('sum-arsip-tgl-akhir');

            return arsipDokumen.filter(function (d) {
                if (jenis !== 'Semua' && d.subMenu !== jenis) return false;
                if (kategori !== 'Semua' && d.kategori !== kategori) return false;
                if (status !== 'Semua') {
                    // "(tanpa status)" untuk arsip yang memang tidak memakai status.
                    if (status === '(tanpa status)') { if (d.status) return false; }
                    else if (d.status !== status) return false;
                }
                const tgl = String(d.tanggal || '').slice(0, 10);
                if (mulai && tgl < mulai) return false;
                if (akhir && tgl > akhir) return false;
                if (cari) {
                    const gabung = [d.judul, d.nomor, d.deskripsi, d.kategori, d.versi, d.lintas].join(' ').toLowerCase();
                    if (gabung.indexOf(cari) === -1) return false;
                }
                return true;
            }).sort(function (a, b) { return String(b.tanggal).localeCompare(String(a.tanggal)); });
        }

                    '<td class="py-3.5 px-4 font-mono font-bold text-slate-700 text-[11px] border-r border-slate-100">' + escapeHtml(d.nomor || '-') + '</td>' +

        // ================================================================
        // KONVERSI BERKAS -> HALAMAN JPG (agar pratinjau selalu tampil)
        // ================================================================
        //
        // Cara & alasannya SAMA PERSIS dengan menu Emplasemen Stasiun -
        // memang masalah yang sama: <iframe src="data:application/pdf">
        // diblokir browser di dalam sandbox Apps Script, jadi PDF tidak
        // akan pernah tampil apa pun yang dicoba. Yang tidak pernah
        // diblokir adalah <img>. Maka berkasnya dikonversi jadi JPG per
        // halaman DI BROWSER lewat PDF.js + canvas, dan itulah yang
        // ditampilkan. Berkas aslinya tetap disimpan untuk tombol Unduh.

        const ARSIP_PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        // Lebar 3000 px dipilih supaya dokumen A4 tetap TAJAM sampai zoom 250%.
        // Hitungannya: panggung viewer ±1100 px, pada 250% dokumen digambar
        // selebar ±2750 px - kalau sumbernya hanya 2000 px, browser terpaksa
        // memperbesar gambar & hasilnya kabur. Dengan 3000 px, sumbernya masih
        // lebih besar dari kebutuhan sehingga tidak pernah diperbesar paksa.
        // Mutu 0.94 (naik dari 0.9) menghilangkan artefak JPEG pada teks kecil
        // & garis tipis, yang paling terlihat justru saat dizoom dalam.
        const ARSIP_JPG_TARGET_WIDTH = 3000;
        const ARSIP_JPG_QUALITY = 0.94;
        const ARSIP_JPG_MAX_PAGES = 30;

        let arsipPdfjsSiap_ = false;
        let arsipHalamanSiapKirim = [];   // hasil konversi: [{base64, lebar, tinggi}]

        function arsipSiapkanPdfJs_() {
            if (typeof pdfjsLib === 'undefined') {
                console.log('[arsip] pdfjsLib tidak tersedia - periksa <script> PDF.js di Index.html.');
                return false;
            }
            if (arsipPdfjsSiap_) return true;
            try {
                const blob = new Blob(["importScripts('" + ARSIP_PDFJS_WORKER_URL + "');"], { type: 'application/javascript' });
                pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
            } catch (err) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = ARSIP_PDFJS_WORKER_URL;
            }
            arsipPdfjsSiap_ = true;
            return true;
        }

        function arsipBase64KeBytes_(base64) {
            const biner = atob(base64);
            const bytes = new Uint8Array(biner.length);
            for (let i = 0; i < biner.length; i++) bytes[i] = biner.charCodeAt(i);
            return bytes;
        }

        /**
         * Mengubah berkas jadi daftar halaman JPG.
         *  - PDF   : tiap halaman digambar ke canvas lalu di-JPG-kan.
         *  - Gambar: digambar ulang ke canvas (menormalkan PNG/WEBP jadi JPG).
         *  - Lainnya (DOC/XLS): dilewati - tidak bisa digambar di browser.
         *    Dokumennya tetap tersimpan & bisa diunduh, hanya tidak punya
         *    pratinjau. Itu dijelaskan apa adanya ke user, bukan dibiarkan
         *    tampil sebagai kotak kosong tanpa keterangan.
         * @return {Promise<Object[]>} [{base64, lebar, tinggi}]
         */
        async function arsipKonversiKeJpg_(payload, onProgress) {
            const mime = String(payload.mimeType || '');

            if (mime.indexOf('pdf') !== -1) {
                if (!arsipSiapkanPdfJs_()) return [];
                const pdf = await pdfjsLib.getDocument({ data: arsipBase64KeBytes_(payload.base64) }).promise;
                const jumlah = Math.min(pdf.numPages, ARSIP_JPG_MAX_PAGES);
                const hasil = [];
                for (let i = 1; i <= jumlah; i++) {
                    if (onProgress) onProgress(i, jumlah);
                    const page = await pdf.getPage(i);
                    const asli = page.getViewport({ scale: 1 });
                    const skala = Math.min(ARSIP_JPG_TARGET_WIDTH / asli.width, 6);
                    const viewport = page.getViewport({ scale: skala });
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(viewport.width);
                    canvas.height = Math.round(viewport.height);
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    hasil.push({
                        base64: canvas.toDataURL('image/jpeg', ARSIP_JPG_QUALITY).split(',')[1],
                        lebar: canvas.width, tinggi: canvas.height
                    });
                }
                return hasil;
            }

            if (mime.indexOf('image/') === 0) {
                return new Promise(function (resolve) {
                    const gambar = new Image();
                    gambar.onload = function () {
                        const skala = Math.min(ARSIP_JPG_TARGET_WIDTH / gambar.naturalWidth, 1);
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(gambar.naturalWidth * skala);
                        canvas.height = Math.round(gambar.naturalHeight * skala);
                        canvas.getContext('2d').drawImage(gambar, 0, 0, canvas.width, canvas.height);
                        resolve([{ base64: canvas.toDataURL('image/jpeg', ARSIP_JPG_QUALITY).split(',')[1],
                                   lebar: canvas.width, tinggi: canvas.height }]);
                    };
                    gambar.onerror = function () { resolve([]); };
                    gambar.src = 'data:' + mime + ';base64,' + payload.base64;
                });
            }

            return []; // DOC/XLS dll - tidak bisa dipratinjau di browser
        }

        /** Mengirim halaman hasil konversi ke server, satu per satu. */
        function arsipKirimHalaman_(dokumenId, daftar, selesai) {
            let i = 0;
            const btn = document.getElementById('arsip-submit-btn');
            function berikutnya() {
                if (i >= daftar.length) { selesai(); return; }
                const h = daftar[i];
                if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan halaman ' + (i + 1) + '/' + daftar.length + '...</span>';
                google.script.run
                    .withSuccessHandler(function () { i++; berikutnya(); })
                    .withFailureHandler(function () { i++; berikutnya(); }) // satu halaman gagal tidak membatalkan sisanya
                    .peraturan_arsip_addHalaman(currentSessionToken, dokumenId, h.base64, i + 1, h.lebar, h.tinggi);
            }
            berikutnya();
        }

                    : 'Dokumen ini tidak punya berkas terlampir.') +
