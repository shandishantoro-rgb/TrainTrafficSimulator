        /** Menampilkan satu halaman; gambarnya diambil sekali lalu disimpan di memori. */
        function tampilkanHalamanViewer_(idx) {
            if (!viewerHalaman.length) return;
            viewerHalamanAktif = Math.max(0, Math.min(viewerHalaman.length - 1, idx));
            const h = viewerHalaman[viewerHalamanAktif];

            const nav = document.getElementById('viewer-nav');
            nav.classList.toggle('hidden', viewerHalaman.length < 2);
            document.getElementById('viewer-hal-label').textContent =
                'Halaman ' + (viewerHalamanAktif + 1) + ' dari ' + viewerHalaman.length;

            const gambar = function (dataUrl) {
                document.getElementById('viewer-isi').innerHTML =
                    '<img src="' + dataUrl + '" class="max-w-none shadow-2xl rounded bg-white" style="max-height:78vh" alt="halaman">';
            };

            if (viewerCacheGambar[h.id]) { gambar(viewerCacheGambar[h.id]); return; }
            document.getElementById('viewer-isi').innerHTML =
                '<div class="text-slate-300 text-sm font-bold"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat halaman ' + (viewerHalamanAktif + 1) + '...</div>';

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { document.getElementById('viewer-isi').innerHTML = '<div class="text-red-300 text-sm font-bold">Halaman gagal dimuat.</div>'; return; }
                    const dataUrl = 'data:' + (res.mimeType || 'image/jpeg') + ';base64,' + res.base64;
                    viewerCacheGambar[h.id] = dataUrl;
                    gambar(dataUrl);
                })
                .withFailureHandler(function () { document.getElementById('viewer-isi').innerHTML = '<div class="text-red-300 text-sm font-bold">Terjadi kesalahan saat memuat halaman.</div>'; })
                .peraturan_arsip_getHalamanImage(currentSessionToken, h.id);
        }

        // Halaman hasil konversi yang BELUM tersimpan - dipakai saat
        // memperbesar pratinjau dari dalam form upload.
        let viewerHalamanLokal_ = [];

        function tampilkanHalamanLokal_(idx) {

            document.getElementById('viewer-hal-label').textContent =

        function viewerHalamanSebelumnya() {
            if (viewerHalamanLokal_.length) { tampilkanHalamanLokal_(viewerHalamanAktif - 1); return; }

        }

            if (viewerHalamanLokal_.length) { tampilkanHalamanLokal_(viewerHalamanAktif + 1); return; }
            tampilkanHalamanViewer_(viewerHalamanAktif + 1);
        }

                            '</div>' +
                            '<p class="text-[11px] text-slate-700 font-semibold mt-1.5 break-words">' + escapeHtml(h.ringkasan || '-') + '</p>' +
                            '<p class="text-[9px] text-slate-400 font-bold mt-1">' + escapeHtml(h.olehNama || '-') +
                                (h.roleId && h.roleId !== '-' ? ' \u00B7 ' + escapeHtml(h.roleId) : '') + '</p>' +
                            '</div>';
                    }).join('');
                })
                .withFailureHandler(function () { wadah.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-6 text-center">Terjadi kesalahan saat memuat aktivitas.</p>'; })
                .activity_getAll(currentSessionToken, filter, 500);
        }

        function isiFilterModulAktivitas_(daftar) {
            const sel = document.getElementById('aktivitas-filter-modul');
            if (!sel || sel.options.length > 1) return; // cukup sekali diisi
            sel.innerHTML = '<option value="Semua">Semua Menu</option>' +
                daftar.map(function (m) { return '<option value="' + escapeHtml(m.id) + '">' + escapeHtml(m.label) + '</option>'; }).join('');
        }

        function resetFilterAktivitas() {
            ['aktivitas-filter-cari', 'aktivitas-filter-dari', 'aktivitas-filter-sampai'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            const sel = document.getElementById('aktivitas-filter-modul');
            if (sel) sel.value = 'Semua';
            muatPusatAktivitas_();
        }

        /** Unduh jejak aktivitas menyeluruh sebagai Excel. */
        function unduhAktivitas() {
            if (!aktivitasTerakhir_.length) { showToast('Belum ada aktivitas untuk diunduh.'); return; }
            try {
                const headers = ['NO', 'WAKTU', 'MENU', 'AKSI', 'KETERANGAN', 'OLEH', 'USERNAME', 'ROLE'];
                const rows = aktivitasTerakhir_.map(function (h, i) {
                    return [i + 1, formatWaktuArsip_(h.waktu), h.modulLabel || '', h.aksi || '',
                        h.ringkasan || '', h.olehNama || '', h.olehUsername || '', h.roleId || ''];
                });
                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                ws['!cols'] = [{ wch: 5 }, { wch: 20 }, { wch: 24 }, { wch: 12 }, { wch: 65 }, { wch: 22 }, { wch: 14 }, { wch: 16 }];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Aktivitas Pengguna');
                XLSX.writeFile(wb, 'Riwayat_Aktivitas_KCI_' + hariIniIso_() + '.xlsx');
                showToast(aktivitasTerakhir_.length + ' baris aktivitas diunduh.');
            } catch (err) {
                console.log('unduhAktivitas error:', err);
                showToast('Gagal membuat berkas riwayat.');
            }
        }

        function closePusatAktivitas() {
            document.getElementById('modal-pusat-aktivitas').classList.add('hidden');
        }

        // ─── EXPORT SUMMARY: EXCEL & PDF ─────────────────────────────────

        function openSummaryExportMenu() {
            const m = document.getElementById('sum-export-menu');
            if (!m) return;
            m.classList.toggle('hidden');

            // Menutup sendiri saat diklik di luar - kalau tidak, menunya
            // menggantung menutupi tabel & terlihat seperti macet.
            if (!m.classList.contains('hidden') && !m.dataset.terpasang) {
                m.dataset.terpasang = '1';
                setTimeout(function () {
                    document.addEventListener('click', function (e) {
                        const wadah = m.parentElement;
                        if (wadah && !wadah.contains(e.target)) m.classList.add('hidden');
                    });
                }, 0);
            }
        }

        /**
         * Menyiapkan tautan Drive "hanya bisa dilihat" untuk dokumen yang
         * sedang tampil, lalu menjalankan export.
         *
         * Izin berkasnya diubah jadi ANYONE_WITH_LINK + VIEW di server -
         * penerima laporan bisa membuka dokumennya, tapi tidak bisa mengubah
         * maupun menghapus arsip resmi perusahaan.
         */
        function exportSummaryArsip(format) {
            const hasil = hitungSummaryArsip_();
            if (!hasil.length) { showToast('Tidak ada dokumen untuk diexport.'); return; }
            const m = document.getElementById('sum-export-menu');
            if (m) m.classList.add('hidden');

            showToast('Menyiapkan tautan dokumen (hanya-lihat)...');
            const idBerkas = hasil.filter(function (d) { return d.punyaBerkas; }).map(function (d) { return d.id; });

            google.script.run
                .withSuccessHandler(function (res) {
                    const tautan = (res && res.success) ? (res.tautan || {}) : {};
                    const gagal = (res && res.gagalIzin) || [];
                    if (gagal.length) {
                        // Dilaporkan apa adanya - tautannya tetap ada, hanya
                        // mungkin belum bisa dibuka orang luar organisasi.
                        showToast(gagal.length + ' dokumen tautannya belum bisa disetel "hanya-lihat" (izin berbagi Drive). Tautan tetap disertakan.');
                    }
                    if (format === 'pdf') cetakSummaryArsipPdf_(hasil, tautan);
                    else tulisSummaryArsipExcel_(hasil, tautan);
                })
                .withFailureHandler(function () {
                    showToast('Gagal menyiapkan tautan - export tetap dibuat tanpa kolom tautan.');
                    if (format === 'pdf') cetakSummaryArsipPdf_(hasil, {});
                    else tulisSummaryArsipExcel_(hasil, {});
                })
                .peraturan_arsip_buatTautanLihat(currentSessionToken, idBerkas);
        }

        function tulisSummaryArsipExcel_(hasil, tautan) {
            try {
                const headers = ['NO', 'TANGGAL', 'JENIS ARSIP', 'NOMOR DOKUMEN', 'JUDUL / PERIHAL',
                    'KATEGORI', 'STATUS', 'VERSI', 'LINTAS', 'KETERANGAN', 'DIINPUT OLEH', 'LINK DOKUMEN (HANYA LIHAT)'];
                const rows = hasil.map(function (d, i) {
                    return [i + 1, formatTanggalArsip_(d.tanggal), SUM_ARSIP_LABEL[d.subMenu] || d.subMenu,
                        d.nomor || '', d.judul || '', d.kategori || '', d.status || '', d.versi || '',
                        d.lintas || '', d.deskripsi || '', d.dibuatOleh || '', tautan[d.id] || (d.punyaBerkas ? '(tautan gagal dibuat)' : '(tanpa berkas)')];
                });
                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                ws['!cols'] = headers.map(function (h) {
                    return { wch: (h.indexOf('JUDUL') === 0 || h === 'KETERANGAN') ? 45 : (h.indexOf('LINK') === 0 ? 55 : (h === 'NO' ? 5 : 18)) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Summary Arsip');
                XLSX.writeFile(wb, 'Summary_Arsip_KCI_' + hariIniIso_() + '.xlsx');
                showToast(hasil.length + ' dokumen diexport ke Excel beserta tautannya.');
            } catch (err) {
                console.log('tulisSummaryArsipExcel_ error:', err);
                showToast('Gagal membuat berkas Excel.');
            }
        }

        function cetakSummaryArsipPdf_(hasil, tautan) {
            const now = new Date();
            const baris = hasil.map(function (d, i) {
                const link = tautan[d.id];
                return '<tr style="page-break-inside:avoid">' +
                    '<td style="padding:4px;border:1px solid #e2e8f0;text-align:center">' + (i + 1) + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0">' + escapeHtml(formatTanggalArsip_(d.tanggal)) + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0">' + escapeHtml(SUM_ARSIP_LABEL[d.subMenu] || d.subMenu) + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0;font-family:monospace">' + escapeHtml(d.nomor || '-') + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0"><b>' + escapeHtml(d.judul) + '</b>' +
                        (d.versi ? '<br><span style="color:#dc2626;font-size:7px">' + escapeHtml(d.versi) + '</span>' : '') + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0">' + escapeHtml(d.kategori || '-') + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0;text-align:center">' + escapeHtml(d.status || '-') + '</td>' +
                    '<td style="padding:4px;border:1px solid #e2e8f0;word-break:break-all;font-size:6.5px">' +
                        (link ? '<a href="' + link + '" style="color:#1d4ed8">' + link + '</a>' : '<span style="color:#cbd5e1">-</span>') + '</td>' +
                    '</tr>';
            }).join('');

            const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Summary Arsip</title><style>' +
                '@page{size:A4 landscape;margin:11mm 9mm}' +
                'body{font-family:Arial,Helvetica,sans-serif;color:#1e293b;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
                'table{width:100%;border-collapse:collapse;font-size:7.5px}thead{display:table-header-group}' +
                'th{background:#0c1d37;color:#fff;padding:5px 4px;border:1px solid #1a3d6d;text-align:left;font-size:7px}' +
                '</style></head><body>' +
                '<table style="width:100%;border-collapse:collapse;background:#0c1d37;border-top:4px solid #d4af37"><tr>' +
                    '<td style="padding:10px 14px;border:none">' +
                        '<div style="font-size:6.5px;letter-spacing:2px;color:#8fa3bf;font-weight:bold">PT KERETA COMMUTER INDONESIA</div>' +
                        '<div style="font-size:15px;font-weight:bold;color:#d4af37;margin-top:2px">SUMMARY ARSIP - DOCUMENT REPOSITORY</div>' +
                    '</td>' +
                    '<td style="padding:10px 14px;text-align:right;color:#cbd5e1;font-size:8px;font-weight:bold;border:none">' + hasil.length + ' DOKUMEN</td>' +
                '</tr></table>' +
                '<p style="background:#f1f5f9;border-left:3px solid #d4af37;padding:6px 10px;margin:9px 0;font-size:8.5px;font-weight:bold;color:#334155">' +
                    'Tautan dokumen bersifat HANYA-LIHAT - penerima dapat membuka berkasnya, tetapi tidak dapat mengubah atau menghapusnya.</p>' +
                '<table><thead><tr>' +
                    '<th style="width:4%;text-align:center">NO</th><th style="width:8%">TANGGAL</th><th style="width:10%">JENIS ARSIP</th>' +
                    '<th style="width:12%">NOMOR</th><th style="width:24%">JUDUL / PERIHAL</th><th style="width:12%">KATEGORI</th>' +
                    '<th style="width:9%;text-align:center">STATUS</th><th style="width:21%">LINK DOKUMEN</th>' +
                '</tr></thead><tbody>' + baris + '</tbody></table>' +
                '<table style="width:100%;margin-top:12px;border-top:1px solid #dde3ea;font-size:6.5px;color:#9aa7b5"><tr>' +
                    '<td style="border:none;padding-top:4px">COTP DEPARTMENT DATABASE &middot; <b style="color:#d4af37">CONFIDENTIAL</b></td>' +
                    '<td style="border:none;padding-top:4px;text-align:right">Dicetak ' + now.toLocaleDateString('id-ID') + ' ' +
                        now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB</td>' +
                '</tr></table></body></html>';

            const win = window.open('', '_blank');
            if (!win) { showToast('Popup diblokir browser - izinkan popup untuk mencetak PDF.'); return; }
            win.document.write(html);
            win.document.close();
            win.onload = function () { win.focus(); win.print(); };
            showToast(hasil.length + ' dokumen disiapkan - pilih "Save as PDF" di jendela cetak.');
        }

</script>
