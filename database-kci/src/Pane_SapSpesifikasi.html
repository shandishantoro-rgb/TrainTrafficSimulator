            <section id="pane-sap-spesifikasi" class="hidden space-y-6 animate-fade-in">
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                        <div>
                            <h4 class="font-extrabold text-[#0c1d37] text-sm tracking-tight">Spesifikasi Sarana KCI</h4>
                            <p class="text-[11px] text-slate-400 font-bold mt-1">Detail teknis armada KRL Commuter Line yang beroperasi</p>
                        </div>
                        <button id="btn-add-sap-spesifikasi" onclick="openSapInputModal('spesifikasi')" class="bg-[#0c1d37] text-white px-5 py-2.5 rounded-xl font-black text-xs uppercase shadow transition">

                        </button>
                    </div>
                    <div class="overflow-x-auto border border-slate-200 rounded-2xl mt-5">
                        <table class="w-full text-left text-xs border-collapse font-bold text-slate-700">
                            <thead>
                                <tr class="bg-[#0c1d37] text-white text-[10px] font-extrabold uppercase tracking-wider">
                                    <th class="px-4 py-3.5 w-12 text-center border-r border-[#1a3d6d]">NO</th>
                                    <th class="px-5 py-3.5 w-64 border-r border-[#1a3d6d]">SERI ARMADA (KRL)</th>
                                    <th class="px-5 py-3.5 w-48 border-r border-[#1a3d6d]">FORMASI KERETA (SF)</th>
                                    <th class="px-5 py-3.5 border-r border-[#1a3d6d]">STATUS OPERASI</th>
                                    <th class="px-4 py-3.5 w-40 text-center">ACTION</th>
                                </tr>
                            </thead>
                            <tbody id="spesifikasi-table-body" class="divide-y divide-slate-200 bg-white text-center"></tbody>
                        </table>
                    </div>
                </div>
            </section>
