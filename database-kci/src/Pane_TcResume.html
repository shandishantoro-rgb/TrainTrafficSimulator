<!--
  ══════════════════════════════════════════════════════════════════
  RESUME LAPORAN  (menu: tc-resume)
  ══════════════════════════════════════════════════════════════════

  Rekap lintas-hari dari seluruh serah terima dalam satu rentang tanggal.
  Empat bagian, sesuai isi formulir Serah Terima:

    1. KA Jalan (KLB Jalan)
    2. Rekayasa Pola Operasi
    3. Pembatalan KA / Perjalanan
    4. Catatan PERKA & Jumlah Perjalanan

  Menu Laporan Dinasan menampilkan serah terima SATU per satu; halaman ini
  menggabungkan isinya supaya pertanyaan seperti "berapa KLB bulan ini" atau
  "KA mana saja yang batal minggu lalu" bisa dijawab tanpa membuka laporan
  harian satu demi satu.

  Tiap baris membawa tanggal & shift asalnya - tanpa itu, daftar gabungan
  lintas-hari kehilangan keterangan kapan kejadiannya, dan justru itulah yang
  dicari dalam sebuah rekap.
-->
<section id="pane-tc-resume" class="hidden animate-fade-in">
    <div class="space-y-5">

        <!-- ══ PENYARING ══ -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div class="flex items-start justify-between gap-3 flex-wrap">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-[#0c1d37] text-[#d4af37] flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-clipboard-list"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-black text-[#0c1d37] tracking-tight leading-tight">Resume Laporan</h3>
                        <p class="text-[11px] text-slate-400 font-bold mt-0.5">Rekap laporan yang sudah di-Closing, otomatis tersusun per tanggal</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="exportResume()" class="px-3 py-2 bg-white hover:bg-slate-50 text-[#0c1d37] border border-slate-200 hover:border-[#d4af37]/60 font-bold text-[11px] rounded-lg flex items-center gap-1.5 shadow-sm transition">
                        <span class="w-5 h-5 rounded-md bg-emerald-500/15 text-emerald-600 flex items-center justify-center text-[10px]"><i class="fa-solid fa-file-excel"></i></span>
                        <span>Export Excel</span>
                    </button>
                    <button onclick="cetakResume()" class="px-3 py-2 bg-white hover:bg-slate-50 text-[#0c1d37] border border-slate-200 hover:border-[#d4af37]/60 font-bold text-[11px] rounded-lg flex items-center gap-1.5 shadow-sm transition">
                        <span class="w-5 h-5 rounded-md bg-red-500/10 text-red-600 flex items-center justify-center text-[10px]"><i class="fa-solid fa-file-pdf"></i></span>
                        <span>Cetak</span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">Dari Tanggal</label>
                    <input type="date" id="resume-dari" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">Sampai Tanggal</label>
                    <input type="date" id="resume-sampai" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <!--
                  PILIHAN "STATUS LAPORAN" SUDAH DIHAPUS.
                  Resume kini SELALU berisi laporan yang sudah di-Closing di
                  menu Serah Terima Dinasan - tidak ada lagi pilihan yang bisa
                  memasukkan draf ke dalam rekap resmi.

                  Alasannya: resume adalah catatan yang dikutip, dicetak, &
                  dibandingkan antar periode. Begitu draf boleh ikut masuk,
                  angka yang sama bisa berubah esok hari tanpa ada yang
                  menyunting apa pun - & tidak ada cara mengetahui versi mana
                  yang pernah dikutip orang. Satu-satunya pintu masuk ke menu
                  ini sekarang adalah tombol Close Laporan.

                  Laporan yang sudah ada tapi belum ditutup TIDAK hilang: ia
                  tetap terbaca di menu Laporan Dinasan, & jumlahnya
                  diberitahukan pada keterangan di bawah tombol Tampilkan.
                -->

                <div>
                    <label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1">Urutan Tanggal</label>
                    <select id="resume-urutan" onchange="loadResume(true)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                        <option value="lama">Terlama &rarr; Terbaru</option>
                        <option value="baru">Terbaru &rarr; Terlama</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 mt-3">
                <button onclick="loadResume(true)" class="px-5 py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-magnifying-glass"></i><span>Tampilkan</span>
                </button>
                <button onclick="resumeRentangCepat_('bulan')" title="Bulan berjalan" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-[11px] rounded-xl transition">Bulan Ini</button>
                <button onclick="resumeRentangCepat_('minggu')" title="Tujuh hari terakhir" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-[11px] rounded-xl transition">7 Hari</button>
                <p id="resume-keterangan" class="text-[11px] font-bold text-slate-400 ml-1"></p>
            </div>
        </div>

        <!-- ══ KARTU RINGKAS ══ -->
        <div id="resume-kartu" class="grid grid-cols-2 lg:grid-cols-6 gap-3"></div>

        <!-- ══ KELENGKAPAN SIKLUS PER TANGGAL ══ -->
        <div id="resume-siklus"></div>

        <!-- ══ EMPAT BAGIAN REKAP ══ -->
        <div id="resume-isi" class="space-y-5"></div>

        <div id="resume-kosong" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 py-16 text-center">
            <div class="w-14 h-14 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-folder-open text-lg"></i>
            </div>
            <p class="font-bold text-slate-600 text-sm">Belum ada laporan yang di-Closing pada rentang ini.</p>
            <p class="text-xs text-slate-400 mt-1">Laporan masuk ke sini otomatis setelah di-Close di Serah Terima Dinasan.</p>
        </div>

    </div>

    <!--
      MODAL: SUNTING SATU BARIS RESUME (11 Oktober 2026).
      Kolomnya dibangkitkan JavaScript dari susunan tabel Serah Terima
      (TABEL_PERJALANAN), bukan ditulis di sini - supaya kolom yang
      ditambahkan di sana otomatis ikut bisa disunting, tanpa ada dua
      daftar kolom yang harus dijaga agar tetap sama.
    -->
    <div id="modal-resume-baris" class="hidden fixed inset-0 z-[88] flex items-center justify-center p-4 modal-backdrop animate-fade-in">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 bg-[#0c1d37] text-white flex items-center justify-between shrink-0">
                <div class="min-w-0">
                    <h3 class="font-extrabold text-sm tracking-tight flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-[#d4af37]"></i><span id="rsb-judul" class="truncate">Ubah Baris</span>
                    </h3>
                    <p id="rsb-subjudul" class="text-[11px] text-slate-400 font-medium mt-0.5 truncate">-</p>
                </div>
                <button onclick="tutupSuntingBarisResume_()" class="text-slate-400 hover:text-white transition shrink-0"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="rsb-isi" class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-3.5 overflow-y-auto flex-1"></div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-2 shrink-0">
                <p class="text-[10px] text-slate-400 font-bold">Perubahan langsung tersimpan ke laporan asalnya.</p>
                <div class="flex items-center gap-2">
                    <button onclick="tutupSuntingBarisResume_()" class="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 font-bold rounded-xl text-xs transition">Batal</button>
                    <button id="rsb-simpan" onclick="simpanBarisResume_()" class="px-5 py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5">
                        <i class="fa-solid fa-check text-[#d4af37]"></i><span>Simpan</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
