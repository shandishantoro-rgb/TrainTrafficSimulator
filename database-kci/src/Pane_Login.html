<!--
  Pane_Login.html
  Layar login penuh (full-screen overlay), ditampilkan SEBELUM dashboard
  utama kalau belum ada sesi yang valid. Warna & font mengikuti identitas
  visual dashboard yang sudah ada (navy #0c1d37 + gold #d4af37, Plus
  Jakarta Sans) - BUKAN warna dari desain Emplasemen yang baru.
-->
<div id="login-screen" class="fixed inset-0 z-[100] bg-[#0c1d37] flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto bg-gradient-to-br from-[#d4af37] to-amber-600 rounded-2xl flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-train-subway text-2xl text-[#0c1d37]"></i>
            </div>
            <h1 class="text-white font-extrabold text-lg tracking-wide">DATABASE KCI</h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">COTP Department</p>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl p-7 space-y-4">
            <div>
                <h2 class="font-extrabold text-slate-900 text-sm">Masuk ke Sistem</h2>
                <p class="text-xs text-slate-400 font-semibold mt-0.5">Gunakan NIP & password akun Anda.</p>
            </div>

            <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-3.5">
                <div>
                    <label class="font-bold text-slate-700 text-xs block mb-1">Username / NIP</label>
                    <input type="text" id="login-username" required autocomplete="username"
                        class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-[#d4af37]" />
                </div>
                <div>
                    <label class="font-bold text-slate-700 text-xs block mb-1">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password"
                        class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-[#d4af37]" />
                </div>

                <p id="login-error" class="hidden text-[11px] font-bold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></p>

                <button type="submit" id="login-submit-btn"
                    class="w-full py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Masuk</span>
                </button>
            </form>
        </div>

        <p class="text-center text-slate-500 text-[10px] font-semibold mt-6">
            Sistem Pusdalops KCI &middot; Akses terbatas untuk personil berwenang
        </p>
    </div>
</div>
