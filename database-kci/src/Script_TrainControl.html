        /** Menggambar kepala tabel sesuai susunan kolomnya. */
        function renderKepalaKlb_(jenis) {
            const cfg = TABEL_PERJALANAN[jenis];
            const thead = document.getElementById('serah-kepala-' + jenis);
            if (!thead || !cfg) return;
            thead.innerHTML = '<tr>' +
                '<th class="px-3 py-2.5 text-center" style="width:46px">NO</th>' +
                cfg.kolom.map(function (c) {
                    return '<th class="px-3 py-2.5" style="width:' + c.px + 'px">' + escapeHtml(c.label) + '</th>';
                }).join('') +
                '<th class="px-3 py-2.5" style="width:44px"></th></tr>';

            // Lebar tetap hanya dipatuhi bila tabelnya memang table-fixed &
            // punya lebar minimum sebesar jumlah kolomnya. Tanpa keduanya,
            // browser tetap bebas memeras kolom - & RELASI yang jadi korban.
            const tabel = thead.parentElement;
            if (tabel) {
                const total = 46 + 44 + cfg.kolom.reduce(function (t, c) { return t + (c.px || 120); }, 0);
                tabel.style.tableLayout = 'fixed';
                tabel.style.minWidth = total + 'px';
            }
        }

        function renderKlb_(jenis) {
            const cfg = TABEL_PERJALANAN[jenis];
            const tbody = document.getElementById('serah-klb-' + jenis);
            if (!tbody || !cfg) return;
            renderKepalaKlb_(jenis);

            const daftar = barisPerjalanan_[jenis] || [];
            tbody.innerHTML = daftar.map(function (baris, i) {
                return '<tr class="hover:bg-slate-50/60">' +
                    '<td class="px-3 py-2 text-center text-[11px] font-bold text-slate-400">' + (i + 1) + '</td>' +
                    cfg.kolom.map(function (c) {
                        // Kolom waktu memakai <input type="time"> supaya jam
                        // selalu berformat sama - mengetik bebas membuat
                        // "8.05", "08:05", & "0805" bercampur di satu kolom.
                        const jenisInput = c.waktu ? 'time' : 'text';
                        const gaya = c.mono ? 'font-mono' : '';
                        // Nilai jam diseragamkan dulu - lihat jamHHMM_().
                        // Tanpa ini, jam yang tersimpan dalam bentuk lain
                        // ditolak diam-diam & kolomnya tampil kosong.
                        const nilai = c.waktu ? jamHHMM_(baris[c.k]) : (baris[c.k] || '');
                        return '<td class="px-2 py-1.5">' +
                            '<input type="' + jenisInput + '" value="' + escapeHtml(nilai) + '" ' +
                            'oninput="ubahKlb_(\'' + jenis + '\',' + i + ',\'' + c.k + '\',this.value)" ' +
                            'onchange="ubahKlb_(\'' + jenis + '\',' + i + ',\'' + c.k + '\',this.value)" ' +
                            'class="w-full px-2 py-1.5 bg-transparent hover:bg-white border border-transparent hover:border-slate-200 focus:bg-white focus:border-amber-400 rounded-lg text-[11px] ' + gaya + ' font-semibold focus:outline-none transition"></td>';
                    }).join('') +
                    '<td class="px-2 py-1.5 text-center">' +
                        '<button onclick="hapusBarisKlb_(\'' + jenis + '\',' + i + ')" title="Hapus baris" class="p-1 text-slate-300 hover:text-red-600 transition"><i class="fa-solid fa-xmark text-xs"></i></button>' +
                    '</td></tr>';
            }).join('');
        }

        /**
         * Mengunggah isi tabel dari berkas Excel.
         *
         * Judul kolom di berkas dicocokkan dengan label kolom tabel - jadi
         * susunan kolomnya boleh berbeda, asal namanya cocok. Ini lebih
         * memaafkan daripada menuntut urutan persis, dan berkas dari sumber
         * lain biasanya memang urutannya lain.
         */
        function uploadKlb_(jenis) {
            // Dipertahankan sebagai jalur cadangan: input berkas tersembunyi di
            // Pane_TcSerah.html masih ada, jadi kalau modalnya belum terpasang
            // (berkas pane ketinggalan versi) unggahan tetap bisa dilakukan.
            const input = document.getElementById('file-klb-' + jenis);
            if (input) input.click();
        }

        // ════════════════════════════════════════════════════════════════
        // UNGGAH TABEL PERJALANAN - alur disamakan dengan Rincian Gangguan
        // ════════════════════════════════════════════════════════════════
        //
        // Yang berubah 6 September 2026: tombol Upload tidak lagi langsung
        // membuka dialog berkas sistem. Sebelumnya syarat kolom & templatnya
        // baru terlihat SETELAH berkas ditolak - urutan yang terbalik, karena
        // saat itu berkasnya sudah terlanjur dibuat dengan susunan yang salah.
        //
        // Sekarang urutannya: templat & kolom wajib dulu, area seret-lepas,
        // baru pratinjau - persis seperti di Rincian Gangguan.

        let uploadKlbJenis_ = null;
        let uploadKlbBerkas_ = null;

        function bukaUploadKlb_(jenis) {
            const modal = document.getElementById('modal-upload-klb');
            if (!modal) { uploadKlb_(jenis); return; }   // pane versi lama

            const cfg = TABEL_PERJALANAN[jenis];
            uploadKlbJenis_ = jenis;
            uploadKlbBerkas_ = null;

            document.getElementById('uk-judul').textContent = 'Unggah ' + cfg.judul;

            // Tiga kolom pertama tiap tabel adalah yang wajib - aturan yang
            // sama dipakai saat memeriksa berkasnya di bacaBerkasKlbDari_.
            const wajib = cfg.kolom.slice(0, 3);
            const opsional = cfg.kolom.slice(3);

            document.getElementById('uk-wajib-judul').textContent =
                wajib.length + ' kolom ini WAJIB ada - berkas tanpa salah satunya akan ditolak';
            document.getElementById('uk-wajib').innerHTML = wajib.map(function (c) {
                return '<span class="px-2 py-1 bg-white border border-amber-200 rounded-lg text-[10px] font-bold text-amber-900 text-center">' +
                    escapeHtml(c.label) + '</span>';
            }).join('');
            document.getElementById('uk-opsional').innerHTML = opsional.length
                ? 'Kolom lain (' + opsional.map(function (c) { return escapeHtml(c.label); }).join(', ') +
                  ') boleh dikosongkan. Urutan kolom bebas &mdash; yang dicocokkan judulnya, bukan posisinya.'
                : 'Urutan kolom bebas &mdash; yang dicocokkan judulnya, bukan posisinya.';

            document.getElementById('uk-unduh').onclick = function () { unduhTemplatKlb_(jenis); };
            document.getElementById('uk-label').textContent = 'Seret File Excel (.xlsx) ' + cfg.judul + ' ke Sini';
            const berkas = document.getElementById('uk-berkas');
            if (berkas) berkas.value = '';

            modal.classList.remove('hidden');
        }

        function tutupUploadKlb() {
            const modal = document.getElementById('modal-upload-klb');
            if (modal) modal.classList.add('hidden');
            uploadKlbJenis_ = null;
            uploadKlbBerkas_ = null;
        }

        /** Berkas dipilih/diseret - baru dicatat, belum diproses. */
        function pilihBerkasKlb_(event) {
            const file = event.target.files[0];
            const label = document.getElementById('uk-label');
            if (!file) { uploadKlbBerkas_ = null; return; }
            uploadKlbBerkas_ = file;
            if (label) label.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i>' +
                escapeHtml(file.name) + ' &mdash; tekan <strong>Input by Excel</strong>';
        }

        function prosesBerkasKlb_() {
            if (!uploadKlbJenis_) return;
            if (!uploadKlbBerkas_) { showToast('Pilih berkas Excel-nya dulu.'); return; }
            const jenis = uploadKlbJenis_, file = uploadKlbBerkas_;
            tutupUploadKlb();
            bacaBerkasKlbDari_(jenis, file);
        }

        /** Jalur lama: input berkas tersembunyi di pane. */
        function bacaBerkasKlb_(jenis, event) {
            const file = event.target.files[0];
            if (!file) return;
            bacaBerkasKlbDari_(jenis, file);
            event.target.value = '';
        }

        /**
         * Membaca satu berkas Excel jadi baris tabel.
         *
         * Judul kolom di berkas dicocokkan dengan label kolom tabel - jadi
         * susunan kolomnya boleh berbeda, asal namanya cocok. Ini lebih
         * memaafkan daripada menuntut urutan persis, dan berkas dari sumber
         * lain biasanya memang urutannya lain.
         */
        function bacaBerkasKlbDari_(jenis, file) {
            const cfg = TABEL_PERJALANAN[jenis];

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, defval: '' });
                    if (!rows.length) { showToast('Berkas kosong atau tidak terbaca.'); return; }

                    // ═══ DIPERIKSA DI DEPAN ═══
                    // Judul kolom diperiksa lebih dulu. Kalau berkasnya salah,
                    // lebih baik ditolak sekarang dengan keterangan jelas
                    // daripada dimuat setengah-setengah lalu baru terlihat
                    // aneh setelah tersimpan.
                    const judulBerkas = Object.keys(rows[0] || {}).map(function (k) { return String(k).trim().toUpperCase(); });
                    const wajib = cfg.kolom.slice(0, 3).map(function (c) { return c.label; });
                    const hilang = wajib.filter(function (w) { return judulBerkas.indexOf(w) === -1; });
                    if (hilang.length) {
                        tampilkanTolakUpload_(jenis, cfg,
                            'Kolom wajib tidak ditemukan: <strong>' + hilang.join(', ') + '</strong>',
                            judulBerkas);
                        return;
                    }

                    const baru = [], ditolak = [];
                    rows.forEach(function (r, idx) {
                        const isi = {};
                        cfg.kolom.forEach(function (c) {
                            // Dicocokkan tanpa peduli huruf besar/kecil & spasi berlebih.
                            const kunci = Object.keys(r).find(function (k) {
                                return String(k).trim().toUpperCase() === c.label;
                            });
                            isi[c.k] = kunci ? String(r[kunci]).trim() : '';
                        });
                        const adaIsi = Object.keys(isi).some(function (k) { return isi[k]; });
                        if (!adaIsi) return;                       // baris kosong - dilewati diam-diam
                        if (!isi.noKa && !isi.namaKa) {
                            ditolak.push({ baris: idx + 2, alasan: 'Nomor KA & Nama KA sama-sama kosong' });
                            return;
                        }
                        baru.push(isi);
                    });

                    if (!baru.length) {
                        tampilkanTolakUpload_(jenis, cfg, 'Tidak ada baris yang bisa dipakai dari berkas ini.', judulBerkas);
                        return;
                    }

                    // ═══ PRATINJAU DULU ═══
                    // Data TIDAK langsung dimuat. User melihat isinya lebih
                    // dulu & menekan Terapkan - sama seperti alur di Rincian
                    // Gangguan. Berkas yang isinya keliru ketahuan sebelum
                    // menimpa apa yang sudah diketik di tabel.
                    tampilkanPratinjauUpload_(jenis, cfg, baru, ditolak);
                } catch (err) {
                    console.log('bacaBerkasKlbDari_ error:', err);
                    showToast('Berkas tidak bisa dibaca. Pastikan formatnya .xlsx.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        /** Data hasil baca yang menunggu persetujuan user. */
        let pratinjauUpload_ = { jenis: null, baris: [] };

        /**
         * Menampilkan isi berkas sebelum diterapkan.
         *
         * Maksimal 8 baris ditampilkan - cukup untuk memastikan kolomnya
         * masuk ke tempat yang benar, tanpa membuat modalnya jadi tabel
         * panjang yang justru tidak dibaca.
         */
        function tampilkanPratinjauUpload_(jenis, cfg, baris, ditolak) {
            pratinjauUpload_ = { jenis: jenis, baris: baris };

            document.getElementById('pu-judul').textContent = 'Pratinjau - ' + cfg.judul;
            document.getElementById('pu-ringkas').innerHTML =
                '<strong>' + baris.length + ' baris</strong> siap diterapkan' +
                (ditolak.length
                    ? ' &middot; <span class="text-red-600"><strong>' + ditolak.length +
                      '</strong> ditolak (Nomor &amp; Nama KA kosong)</span>'
                    : '');

            const kolomTampil = cfg.kolom.slice(0, 6);
            document.getElementById('pu-tabel').innerHTML =
                '<table class="w-full text-left text-[11px] border-collapse">' +
                    '<thead class="bg-[#0c1d37] text-white text-[9px] uppercase font-black">' +
                        '<tr><th class="px-2 py-2 w-8 text-center">NO</th>' +
                        kolomTampil.map(function (c) { return '<th class="px-2 py-2">' + escapeHtml(c.label) + '</th>'; }).join('') +
                        (cfg.kolom.length > kolomTampil.length ? '<th class="px-2 py-2 text-center">...</th>' : '') +
                        '</tr></thead><tbody class="divide-y divide-slate-100">' +
                    baris.slice(0, 8).map(function (b, i) {
                        return '<tr class="hover:bg-slate-50">' +
                            '<td class="px-2 py-1.5 text-center text-slate-400 font-bold">' + (i + 1) + '</td>' +
                            kolomTampil.map(function (c) {
                                return '<td class="px-2 py-1.5 font-semibold text-slate-700 truncate max-w-[130px]">' +
                                    escapeHtml(b[c.k] || '-') + '</td>';
                            }).join('') +
                            (cfg.kolom.length > kolomTampil.length ? '<td class="px-2 py-1.5 text-center text-slate-300">...</td>' : '') +
                            '</tr>';
                    }).join('') +
                '</tbody></table>' +
                (baris.length > 8
                    ? '<p class="text-[10px] text-slate-400 font-bold italic mt-2 text-center">' +
                      '...dan ' + (baris.length - 8) + ' baris lagi</p>'
                    : '');

            document.getElementById('modal-pratinjau-upload').classList.remove('hidden');
        }

        function tutupPratinjauUpload() {
            document.getElementById('modal-pratinjau-upload').classList.add('hidden');
            pratinjauUpload_ = { jenis: null, baris: [] };
        }

        /** Menerapkan data pratinjau ke tabel. */
        function terapkanPratinjauUpload() {
            const { jenis, baris } = pratinjauUpload_;
            if (!jenis || !baris.length) return;
            const cfg = TABEL_PERJALANAN[jenis];

            barisPerjalanan_[jenis] = baris;
            renderKlb_(jenis);
            tutupPratinjauUpload();
            showToast(baris.length + ' baris diterapkan ke ' + cfg.judul + '.');
        }

        /**
         * Menampilkan penolakan berkas beserta contoh susunan yang benar.
         *
         * Menyebut apa yang salah saja tidak cukup - orang perlu tahu bentuk
         * yang diharapkan. Karena itu contoh judul kolomnya ikut ditampilkan,
         * lengkap dengan tombol mengunduh templatnya.
         */
        function tampilkanTolakUpload_(jenis, cfg, alasan, judulBerkas) {
            const modal = document.getElementById('modal-tolak-upload');
            if (!modal) { showToast(alasan.replace(/<[^>]+>/g, '')); return; }

            document.getElementById('tu-judul').textContent = 'Berkas ditolak - ' + cfg.judul;
            document.getElementById('tu-alasan').innerHTML = alasan;
            document.getElementById('tu-diharap').innerHTML = cfg.kolom.map(function (c, i) {
                return '<span class="px-2 py-1 rounded-lg text-[10px] font-bold ' +
                    (i < 3 ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-slate-100 text-slate-600 border border-slate-200') +
                    '">' + escapeHtml(c.label) + (i < 3 ? ' *' : '') + '</span>';
            }).join('');
            document.getElementById('tu-ditemukan').textContent =
                (judulBerkas && judulBerkas.length) ? judulBerkas.join(', ') : '(berkas kosong)';
            document.getElementById('tu-unduh').onclick = function () { unduhTemplatKlb_(jenis); };
            modal.classList.remove('hidden');
        }

        function tutupTolakUpload() { document.getElementById('modal-tolak-upload').classList.add('hidden'); }

        /** Mengunduh templat Excel dengan judul kolom yang benar. */
        function unduhTemplatKlb_(jenis) {
            const cfg = TABEL_PERJALANAN[jenis];
            try {
                const judul = cfg.kolom.map(function (c) { return c.label; });
                // Satu baris contoh disertakan supaya bentuk isinya terlihat -
                // templat kosong sering diisi dengan format yang berbeda-beda.
                const contoh = cfg.kolom.map(function (c) {
                    if (c.k === 'noKa') return '1234';
                    if (c.k === 'namaKa') return 'CL JABODETABEK';
                    if (c.k === 'relasi') return 'JAKK - BOO';
                    if (c.waktu) return '08:15';
                    if (c.k === 'telex') return 'TLX/001/IX/2026';
                    if (c.k === 'masinis') return 'BUDI / ASP ANDI';
                    return '';
                });
                const ws = XLSX.utils.aoa_to_sheet([judul, contoh]);
                ws['!cols'] = judul.map(function () { return { wch: 18 }; });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, cfg.judul.slice(0, 28));
                XLSX.writeFile(wb, 'Templat_' + jenis + '.xlsx');
                showToast('Templat diunduh - isi lalu unggah kembali.');
            } catch (err) {
                console.log('unduhTemplatKlb_ error:', err);
                showToast('Gagal membuat templat.');
            }
        }

        /**
         * Mengambil data perjalanan dari modul Kinerja Operasi.
         *
         * Modul itu masih dalam pengembangan, jadi di sini dibuat "gagal
         * dengan sopan": kalau datanya belum tersedia, user diberi tahu apa
         * adanya & tetap bisa mengisi manual - bukan dibiarkan menunggu
         * sesuatu yang belum ada.
         */
        function sinkronKlb_(jenis) {
            const tanggal = (document.getElementById('serah-tanggal') || {}).value;
            if (!tanggal) { showToast('Isi tanggal dinas dulu sebelum menarik data.'); return; }

            showToast('Menarik data perjalanan dari Kinerja Operasi...');
            try {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success || !(res.data || []).length) {
                            showToast('Belum ada data perjalanan untuk tanggal ini di Kinerja Operasi. Silakan isi manual atau unggah Excel.');
                            return;
                        }
                        const cfg = TABEL_PERJALANAN[jenis];
                        barisPerjalanan_[jenis] = res.data.map(function (d) {
                            const isi = {};
                            cfg.kolom.forEach(function (c) { isi[c.k] = String(d[c.k] || ''); });
                            return isi;
                        });
                        renderKlb_(jenis);
                        showToast(res.data.length + ' baris ditarik dari Kinerja Operasi.');
                    })
                    .withFailureHandler(function () {
                        showToast('Data Kinerja Operasi belum bisa diakses. Silakan isi manual atau unggah Excel.');
                    })
                    .kinop_getPerjalananUntukDinasan(currentSessionToken, tanggal, jenis);
            } catch (err) {
                showToast('Penarikan data belum tersedia - modul Kinerja Operasi masih dikembangkan. Isi manual atau unggah Excel.');
            }
        }

        function tambahBarisSarana_() { serahSarana.push({}); renderSarana_(); }

        function hapusBarisSarana_(idx) {
            serahSarana.splice(idx, 1);
            if (!serahSarana.length) serahSarana.push({});
            renderSarana_();
        }

        function renderSarana_() {
            const wadah = document.getElementById('serah-sarana');
            if (!wadah) return;
            // Kolom KETERANGAN ditambahkan 6 September 2026. Depo & nomor TS
            // hanya menyebut sarana mana yang jadi cadangan, bukan keadaannya -
            // padahal itulah yang dicari dinas berikutnya.
            wadah.innerHTML = serahSarana.map(function (s, i) {
                return '<div class="flex items-center gap-2">' +
                    '<span class="text-[10px] font-bold text-slate-400 w-5 text-center shrink-0">' + (i + 1) + '.</span>' +
                    '<input type="text" value="' + escapeHtml(s.depo || '') + '" placeholder="Depo (mis. Dp)" ' +
                        'oninput="serahSarana[' + i + '].depo=this.value" class="w-28 shrink-0 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">' +
                    '<input type="text" value="' + escapeHtml(s.ts || '') + '" placeholder="TS (mis. 205JR132+133 (SF8))" ' +
                        'oninput="serahSarana[' + i + '].ts=this.value" class="flex-1 min-w-0 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">' +
                    '<input type="text" value="' + escapeHtml(s.keterangan || '') + '" placeholder="Keterangan (mis. siap operasi)" ' +
                        'oninput="serahSarana[' + i + '].keterangan=this.value" class="flex-1 min-w-0 px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">' +
                    '<button onclick="hapusBarisSarana_(' + i + ')" title="Hapus" class="p-1.5 text-slate-300 hover:text-red-600 transition shrink-0"><i class="fa-solid fa-xmark text-xs"></i></button>' +
                    '</div>';
            }).join('');
        }

        /** Mengumpulkan seluruh isian formulir jadi satu objek. */
        function kumpulkanFormSerah_() {
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
            const peralatan = SERAH_PERALATAN.map(function (a) {
                const dipilih = document.querySelector('input[name="serah-alat-' + a.no + '"]:checked');
                const kondisi = dipilih ? dipilih.value : '';
                const rusak = (kondisi === 'GANGGUAN' || kondisi === 'TIADA');
                return { no: a.no, nama: a.nama, kondisi: kondisi,
                         catatan: rusak ? String(catatanPeralatan_[a.no] || '') : '' };
            });
            const bersih = function (daftar) {
                return daftar.filter(function (b) {
                    return Object.keys(b).some(function (k) { return String(b[k] || '').trim(); });
                });
            };
            return {
                hari: ambil('serah-hari'), tanggal: ambil('serah-tanggal'), jam: ambil('serah-jam'),
                dariDinas: ambil('serah-dari-dinas'), keDinas: ambil('serah-ke-dinas'), keadaan: ambil('serah-keadaan'),
                keadaanCatatan: ambil('serah-keadaan-catatan'),
                nomorDokumen: document.getElementById('serah-nomor-dok').textContent,
                peralatan: peralatan, alatLain: ambil('serah-alat-lain'),
                klbJalan: bersih(barisPerjalanan_.jalan),
                rekayasa: bersih(barisPerjalanan_.rekayasa),
                pembatalan: bersih(barisPerjalanan_.batal),
                perkaAcuan: ambil('serah-perka-acuan'),
                // Enam lintas sesuai wilayah kerja (3 September 2026).
                // Tiap lintas kini punya DUA angka: jumlah perka & jumlah
                // trainset. Digabung jadi satu teks "1032 KA / 87 TS" supaya
                // muat di satu kolom sheet tanpa menambah 6 kolom baru.
                jumlahKa: LINTAS_CETAK.reduce(function (o, l) {
                    const ka = ambil('serah-ka-' + l.k);
                    const ts = ambil('serah-ts-' + l.k);
                    o[l.k] = (ka || ts) ? ((ka || '-') + ' KA / ' + (ts || '-') + ' TS') : '';
                    return o;
                }, {}),
                sarana: bersih(serahSarana),
                situasiLintas: {
                    jabodetabek: ambil('serah-lintas-a'), basoetta: ambil('serah-lintas-b'),
                    merak: ambil('serah-lintas-c'), bandung: ambil('serah-lintas-d'),
                    yogyakarta: ambil('serah-lintas-e'), surabaya: ambil('serah-lintas-f')
                },
                catatan: ambil('serah-catatan'),
                menyerahkan: { nama: ambil('serah-dari-nama'), nipp: ambil('serah-dari-nipp'), jabatan: ambil('serah-dari-jabatan') },
                menerima: { nama: ambil('serah-ke-nama'), nipp: ambil('serah-ke-nipp'), jabatan: ambil('serah-ke-jabatan') }
            };
        }

        // ════════════════════════════════════════════════════════════════
        // PEMERIKSAAN KELENGKAPAN SEBELUM MENGIRIM
        // ════════════════════════════════════════════════════════════════
        //
        // Ketiga tabel perjalanan (KLB Jalan, Rekayasa Pola Operasi,
        // Pembatalan) SENGAJA dikecualikan: shift yang berjalan tanpa satu pun
        // KLB adalah shift yang berjalan normal, dan memaksa mengisinya justru
        // mendorong orang menuliskan baris karangan supaya tombolnya menyala.
        //
        // Cadangan / SO Sarana diperlakukan di tengah: tidak wajib ada
        // barisnya, tapi baris yang SUDAH diisi sebagian harus dilengkapi -
        // depo tanpa nomor TS tidak memberi tahu siapa pun sarana mana yang
        // dimaksud.

        function periksaKelengkapanSerah_(d) {
            const kurang = [];
            const wajib = function (nilai, label, langkah) {
                if (!String(nilai === undefined || nilai === null ? '' : nilai).trim()) {
                    kurang.push({ label: label, langkah: langkah });
                }
            };

            wajib(d.tanggal, 'Tanggal dinas', 1);
            wajib(d.hari, 'Hari', 1);
            wajib(d.jam, 'Jam dinas', 1);
            wajib(d.dariDinas, 'Diserahkan dinas', 1);
            wajib(d.keDinas, 'Ke dinas monitoring', 1);
            wajib(d.keadaan, 'Dalam keadaan', 1);
            if (d.keadaan === 'Ada Catatan') wajib(d.keadaanCatatan, 'Catatan keadaan dinas', 1);

            (d.peralatan || []).forEach(function (a) {
                if (!a.kondisi) kurang.push({ label: 'Kondisi peralatan ' + a.no + '. ' + a.nama, langkah: 2 });
                else if ((a.kondisi === 'GANGGUAN' || a.kondisi === 'TIADA') && !String(a.catatan || '').trim()) {
                    kurang.push({ label: 'Catatan untuk ' + a.nama + ' (' + a.kondisi + ')', langkah: 2 });
                }
            });
            wajib(d.alatLain, 'Lain-lain (tulis "Tiada" bila kosong)', 2);

            wajib(d.perkaAcuan, 'Acuan PERKA', 4);
            LINTAS_CETAK.forEach(function (l) {
                wajib((d.jumlahKa || {})[l.k], 'Jumlah Perka & Trainset - ' + l.label, 4);
                wajib((d.situasiLintas || {})[l.k], 'Situasi lintas - ' + l.label, 4);
            });
            wajib(d.catatan, 'Catatan lain (tulis "Tiada" bila kosong)', 4);

            (d.sarana || []).forEach(function (s, i) {
                const adaIsi = ['depo', 'ts', 'keterangan'].some(function (k) { return String(s[k] || '').trim(); });
                if (!adaIsi) return;
                ['depo', 'ts', 'keterangan'].forEach(function (k) {
                    if (!String(s[k] || '').trim()) {
                        kurang.push({ label: 'Cadangan/SO Sarana baris ' + (i + 1) + ' - kolom ' + k, langkah: 4 });
                    }
                });
            });

            [['menyerahkan', 'Yang menyerahkan'], ['menerima', 'Yang menerima']].forEach(function (pasangan) {
                const o = d[pasangan[0]] || {};
                wajib(o.nama, pasangan[1] + ' - nama', 5);
                wajib(o.nipp, pasangan[1] + ' - NIPP/NIK', 5);
                wajib(o.jabatan, pasangan[1] + ' - jabatan', 5);
            });

            return kurang;
        }

        /** Menampilkan daftar isian yang belum lengkap, tiap baris bisa diklik. */
        function tampilkanKurangSerah_(kurang) {
            let modal = document.getElementById('modal-kurang-serah');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-kurang-serah';
                modal.className = 'hidden fixed inset-0 z-[92] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                document.body.appendChild(modal);
            }

            const perLangkah = {};
            kurang.forEach(function (k) { (perLangkah[k.langkah] = perLangkah[k.langkah] || []).push(k.label); });

            const isi = Object.keys(perLangkah).sort().map(function (n) {
                return '<div class="p-3 bg-slate-50 border border-slate-200 rounded-xl">' +
                    '<button onclick="tutupKurangSerah(); loncatKeLangkah_(' + n + ');" ' +
                        'class="text-[11px] font-black text-[#0c1d37] hover:underline flex items-center gap-1.5 mb-1.5">' +
                        '<i class="fa-solid fa-arrow-right-long text-[9px]"></i>' + n + '. ' + escapeHtml(LANGKAH_JUDUL[n] || '') +
                        '<span class="font-bold text-slate-400">(' + perLangkah[n].length + ')</span></button>' +
                    '<ul class="space-y-0.5">' + perLangkah[n].map(function (l) {
                        return '<li class="text-[11px] font-semibold text-slate-600 flex items-start gap-1.5">' +
                            '<i class="fa-solid fa-circle text-[4px] mt-1.5 text-red-400"></i><span>' + escapeHtml(l) + '</span></li>';
                    }).join('') + '</ul></div>';
            }).join('');

            modal.innerHTML =
                '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">' +
                    '<div class="px-6 py-5 flex items-start gap-4 shrink-0">' +
                        '<div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl shrink-0">' +
                            '<i class="fa-solid fa-list-check"></i></div>' +
                        '<div class="min-w-0"><h3 class="text-sm font-black text-slate-900">Belum bisa dikirim</h3>' +
                        '<p class="text-[11px] text-slate-500 font-semibold mt-1 leading-relaxed">' + kurang.length +
                        ' isian masih kosong. Tabel KLB Jalan, Rekayasa Pola Operasi, &amp; Pembatalan tidak ikut diperiksa &mdash; ' +
                        'shift tanpa KLB memang berjalan normal.</p></div>' +
                    '</div>' +
                    '<div class="px-6 pb-4 space-y-2 overflow-y-auto flex-1">' + isi + '</div>' +
                    '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2 shrink-0">' +
                        '<button onclick="tutupKurangSerah()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Tutup</button>' +
                        '<button onclick="tutupKurangSerah(); simpanFormSerah();" class="px-5 py-2.5 bg-white border border-slate-300 hover:border-[#0c1d37] text-[#0c1d37] font-bold rounded-xl text-xs transition">Simpan sebagai Draf</button>' +
                    '</div>' +
                '</div>';
            modal.classList.remove('hidden');
        }

        function tutupKurangSerah() {
            const modal = document.getElementById('modal-kurang-serah');
            if (modal) modal.classList.add('hidden');
        }

        let serahEditingId = null;
        let serahSedangSimpan = false;

        /**
         * Simpan = menyimpan isian ke SIKLUS YANG SEDANG BERJALAN.
         *
         * ═══ KENAPA TIDAK LAGI LEWAT dinasan_save ═══
         * dinasan_save membuat BARIS BARU bila idnya kosong. Di model satu
         * laporan per siklus, itu berarti setiap kali seseorang menekan Simpan
         * di tengah dinasnya, lahir satu laporan tambahan yang tidak
         * seharusnya ada - & siklus yang sebenarnya tidak ikut terisi.
         *
         * dinasan_simpanSiklus selalu menulis ke siklus yang berjalan, &
         * menolak bila penekannya bukan pemegang tahapnya.
         */
        function simpanFormSerah() {
            if (serahSedangSimpan) { showToast('Masih menyimpan, mohon tunggu...'); return; }
            if (siklusAktif_ && !siklusAktif_.bolehEdit) {
                showToast('Laporan ini sedang dipegang ' + (siklusAktif_.pemegangNama || 'dinas lain') +
                    '. Anda baru bisa mengubahnya setelah menerima serah terimanya.');
                return;
            }
            const data = kumpulkanFormSerah_();
            if (!data.tanggal) { showToast('Tanggal dinas wajib diisi.'); return; }

            data.id = serahEditingId || '';

            // ═══ BAHAYA YANG DITUTUP DI SINI ═══
            // dinasan_simpanSiklus selalu menulis ke SIKLUS YANG BERJALAN,
            // apa pun yang sedang tampil di layar. Kalau Super Admin membuka
            // sebuah laporan ARSIP lewat tombol Sunting lalu menekan Simpan,
            // isi arsip itu akan menimpa siklus yang sedang berjalan - dua
            // laporan rusak sekaligus, tanpa satu pun pesan.
            //
            // Karena itu jalurnya dipilih dari APA yang sedang dibuka:
            // siklus aktif lewat dinasan_simpanSiklus, laporan lain lewat
            // dinasan_save yang menulis ke barisnya sendiri.
            const menyuntingArsip = !!(serahEditingId && siklusAktif_ && serahEditingId !== siklusAktif_.id);
            serahSedangSimpan = true;
            const btn = document.getElementById('btn-add-tc-serah');
            const htmlAsli = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>'; }

            const selesai = function () {
                serahSedangSimpan = false;
                if (btn) { btn.disabled = false; btn.innerHTML = htmlAsli; }
            };

            google.script.run
                .withSuccessHandler(function (res) {
                    selesai();
                    if (!res.success) { showToast('Gagal menyimpan: ' + (res.message || '')); return; }
                    // Draf TIDAK mengosongkan formulir. Menyimpan di tengah
                    // pengisian lalu mendapati layar kembali kosong adalah cara
                    // tercepat membuat orang berhenti menyimpan sama sekali.
                    // Formulir baru dikosongkan setelah benar-benar DIKIRIM.
                    showToast(menyuntingArsip
                        ? 'Perubahan tersimpan ke ' + (res.nomorDokumen || 'laporan arsip') + '.'
                        : 'Isian tersimpan ke laporan siklus ' +
                          ((siklusAktif_ && siklusAktif_.siklusKe) || '') + ' (' + (res.nomorDokumen || '') + ').');
                    serahEditingId = res.id || serahEditingId;
                    serahNomorDok_ = res.nomorDokumen || serahNomorDok_;
                    dinasanCache_ = null; // paksa Laporan Dinasan mengambil data terbaru
                })
                .withFailureHandler(function () { selesai(); showToast('Terjadi kesalahan saat menyimpan serah terima.'); })
                [menyuntingArsip ? 'dinasan_save' : 'dinasan_simpanSiklus'](currentSessionToken, data);
        }

        // ════════════════════════════════════════════════════════════════
        // ALUR KIRIM -> TERIMA -> TUTUP
        // ════════════════════════════════════════════════════════════════
        //
        // Serah terima tidak lagi selesai dengan satu klik. Tiga langkah,
        // masing-masing oleh pihak yang berbeda:
        //
        //   1. Pengirim menekan KIRIM      -> status 'terkirim'
        //   2. Penerima menekan TERIMA     -> status 'diterima'
        //   3. Pengirim menekan TUTUP      -> status 'selesai'
        //
        // Baru setelah langkah 2, penerima boleh melanjutkan pengisian dinas
        // berikutnya - sebelum itu tongkatnya belum benar-benar berpindah.
        // Sisi server menegakkan aturan yang sama (dinasan_terima menolak
        // orang selain penerima), jadi tombol yang disembunyikan di sini
        // hanyalah kenyamanan, bukan pengamanannya.

        /**
         * false bila pengguna masih punya laporan yang sudah diserahkan tapi
         * BELUM diterima dinas berikutnya. Dibaca handleLogout di
         * Script_Login.html sebelum sesi diakhiri.
         *
         * Disimpan di sini, bukan ditanyakan ulang saat menekan Logout,
         * supaya keputusan logout tidak menunggu jaringan. Nilainya
         * disegarkan setiap kali kotak notifikasi dimuat.
         */
        let bolehLogoutDinasan_ = true;

        let serahStatus_ = 'draft';
        let serahNomorDok_ = '';
        let serahSedangAlur_ = false;

        const SERAH_LENCANA = {
            // 'diisi' adalah status model siklus; tanpa baris ini lencananya
            // jatuh ke 'draft' & tertulis "belum dikirim" pada laporan yang
            // justru sedang dipegang seseorang.
            diisi:    { warna: 'bg-slate-100 border-slate-200 text-slate-600',       ikon: 'fa-pen-to-square',  teks: 'Sedang diisi dinas yang memegang' },
            draft:    { warna: 'bg-slate-100 border-slate-200 text-slate-600',       ikon: 'fa-pen-to-square',  teks: 'Draf - belum dikirim' },
            terkirim: { warna: 'bg-amber-50 border-amber-300 text-amber-800',        ikon: 'fa-paper-plane',    teks: 'Terkirim - menunggu penerima' },
            diterima: { warna: 'bg-sky-50 border-sky-300 text-sky-800',              ikon: 'fa-lock',           teks: 'Diterima - laporan terkunci' },
            selesai:  { warna: 'bg-emerald-50 border-emerald-300 text-emerald-800',  ikon: 'fa-circle-check',   teks: 'Selesai - siklus hari ini ditutup' }
        };

        function gambarStatusSerah_() {
            const panel = document.getElementById('serah-status-panel');
            const tombolKirim = document.getElementById('btn-serah-kirim');
            const tombolSimpan = document.getElementById('btn-serah-simpan');
            if (!panel) return;

            const s = SERAH_LENCANA[serahStatus_] || SERAH_LENCANA.draft;
            panel.innerHTML =
                '<div class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border ' + s.warna + '">' +
                    '<i class="fa-solid ' + s.ikon + ' text-xs"></i>' +
                    '<span class="text-[11px] font-black">' + escapeHtml(s.teks) + '</span>' +
                    (serahNomorDok_ ? '<span class="text-[10px] font-mono font-bold opacity-70">&middot; ' + escapeHtml(serahNomorDok_) + '</span>' : '') +
                '</div>' +
                // ═══ TIDAK ADA LAGI TOMBOL "TUTUP SERAH TERIMA" ═══
                // Menerima sudah berarti mengunci; tidak ada keputusan yang
                // tersisa bagi pengirim. Yang digantikan di sini hanyalah
                // keterangan tentang apa yang sedang ditunggu.
                (serahStatus_ === 'terkirim'
                    ? '<p class="mt-2 text-[10px] font-bold text-amber-700 text-center">' +
                      'Menunggu dinas berikutnya menekan <strong>Terima</strong>. ' +
                      'Anda belum bisa logout sampai laporan ini diterima.</p>'
                    : '') +
                (serahStatus_ === 'diterima'
                    ? '<p class="mt-2 text-[10px] font-bold text-sky-700 text-center">' +
                      'Sudah diterima dinas berikutnya - laporan ini terkunci &amp; tidak bisa diubah lagi.</p>'
                    : '');

            // ═══ INI YANG MEMBUAT TOMBOL SERAHKAN MATI ═══
            // Baris lama di sini berbunyi `terkunci = (serahStatus_ !== 'draft')`
            // lalu mematikan tombol Serahkan & Simpan. Pada model siklus,
            // status laporan yang sedang berjalan adalah 'diisi' - bukan
            // 'draft' - sehingga syarat itu SELALU benar & kedua tombol mati
            // sejak laporan dimuat. Tidak ada pesan apa pun; tombolnya sekadar
            // tidak bisa ditekan.
            //
            // Keadaan tombol sekarang SEPENUHNYA diatur gambarTahapSiklus_,
            // yang membacanya dari server (bolehSerahkan / bolehEdit /
            // bolehClosing). Dua tempat yang mengatur satu tombol pasti
            // bertengkar, & yang menang adalah yang kebetulan berjalan
            // belakangan - persis bug yang terjadi.
            //
            // Jadi fungsi ini kini hanya menggambar lencana status.
            [tombolKirim, tombolSimpan].forEach(function (b) {
                if (b) b.classList.remove('opacity-40', 'cursor-not-allowed');
            });
        }

        /** Mengirim formulir ke petugas penerima - hanya bila isinya lengkap. */
        /**
         * Tombol Serahkan. Namanya dipertahankan karena dipakai beberapa
         * tempat; isinya kini meneruskan ke pengendali siklus.
         */
        function kirimSerahTerima() { serahkanTahapSiklus_(); }

        function kirimSerahTerimaLama_() {
            if (serahSedangSimpan || serahSedangAlur_) { showToast('Masih diproses, mohon tunggu...'); return; }
            if (serahStatus_ !== 'draft') { showToast('Serah terima ini sudah dikirim.'); return; }

            const data = kumpulkanFormSerah_();
            const kurang = periksaKelengkapanSerah_(data);
            if (kurang.length) { tampilkanKurangSerah_(kurang); return; }

            const lanjut = function () {
                data.id = serahEditingId || '';
                serahSedangAlur_ = true;
                const btn = document.getElementById('btn-serah-kirim');
                const htmlAsli = btn ? btn.innerHTML : '';
                if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Mengirim...</span>'; }
                const selesai = function () {
                    serahSedangAlur_ = false;
                    if (btn) { btn.disabled = false; btn.innerHTML = htmlAsli; }
                };

                google.script.run
                    .withSuccessHandler(function (res) {
                        selesai();
                        if (!res || !res.success) { showToast('Gagal mengirim: ' + ((res && res.message) || '')); return; }
                        serahEditingId = res.id;
                        serahNomorDok_ = res.nomorDokumen || '';
                        serahStatus_ = 'terkirim';
                        gambarStatusSerah_();
                        dinasanCache_ = null;
                        showToast('Serah terima ' + res.nomorDokumen + ' dikirim ke ' + (data.menerima.nama || 'penerima') + '.');
                        muatNotifikasiDinasan_();
                    })
                    .withFailureHandler(function () { selesai(); showToast('Terjadi kesalahan saat mengirim serah terima.'); })
                    .dinasan_kirim(currentSessionToken, data);
            };

            if (typeof konfirmasi_ === 'function') {
                konfirmasi_({
                    judul: 'Kirim ke ' + (data.menerima.nama || 'penerima') + '?',
                    pesan: 'Setelah dikirim, isinya tidak bisa diubah lagi sampai penerima menekan Terima.',
                    rincian: escapeHtml(data.tanggal) + ' &middot; dinas ' + escapeHtml(data.dariDinas) + ' ke ' + escapeHtml(data.keDinas),
                    ya: 'Kirim Sekarang', ikonYa: 'fa-paper-plane', ikon: 'fa-paper-plane'
                }).then(function (ya) { if (ya) lanjut(); });
            } else { lanjut(); }
        }

        function terimaSerahTerima(id) {
            if (serahSedangAlur_) return;
            serahSedangAlur_ = true;
            google.script.run
                .withSuccessHandler(function (res) {
                    serahSedangAlur_ = false;
                    if (!res || !res.success) { showToast('Gagal menerima: ' + ((res && res.message) || '')); return; }
                    showToast('Serah terima ' + (res.nomorDokumen || '') + ' diterima.' +
                        (res.mewakili ? ' Dicatat sebagai MEWAKILI petugas penerima.' : ''));
                    dinasanCache_ = null;
                    // Pada model siklus, yang dimuat ke formulir SELALU siklus
                    // yang sedang berjalan - bukan catatan lama. Pemanggilan
                    // lanjutkanDariDinasan_ di sini yang dulu membuat layar
                    // menampilkan dokumen yang berbeda dari yang dinilai
                    // tombol Serahkan.
                    muatSiklusAktif_();
                })
                .withFailureHandler(function () { serahSedangAlur_ = false; showToast('Terjadi kesalahan saat menerima.'); })
                .dinasan_terima(currentSessionToken, id);
        }

        // ═══ tutupSerahTerima DIHAPUS 7 September 2026 ═══
        // Fungsi ini menjalankan langkah ketiga yang sudah tidak ada lagi:
        // pengirim menutup laporannya setelah penerima menyatakan menerima.
        // Sejak "menerima = mengunci", langkah itu tidak punya keputusan apa
        // pun yang tersisa.
        //
        // Fungsi servernya, dinasan_tutup di Module_Dinasan.gs, ikut menjadi
        // menganggur. Ia dibiarkan ada - menghapus API publik berisiko
        // memutus hal lain - tapi tidak lagi dipanggil dari mana pun.

        // ── KOTAK TINDAKAN ──────────────────────────────────────────────

        /**
         * ═══ DIPENSIUNKAN ═══
         * Kotak notifikasi versi lama memasang tombol "Lanjutkan Pengisian" &
         * "Terima" yang bekerja pada MODEL PER-DOKUMEN. Keduanya memuat
         * catatan lama ke formulir, sehingga layar menampilkan satu laporan
         * sementara tombol Serahkan menilai laporan yang lain.
         *
         * Penggantinya gambarKotakTindakanSiklus_, yang digambar dari siklus
         * aktif. Badan lamanya dipindah ke muatNotifikasiDinasanLama_ &
         * tidak dipanggil siapa pun.
         */
        function muatNotifikasiDinasan_() { return; }

        function muatNotifikasiDinasanLama_() {
            const wadah = document.getElementById('serah-notifikasi');
            if (!wadah) return;
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { wadah.classList.add('hidden'); return; }
                    gambarNotifikasiDinasan_(res);
                })
                .withFailureHandler(function () { wadah.classList.add('hidden'); })
                .dinasan_notifikasi(currentSessionToken);
        }

        function gambarNotifikasiDinasan_(res) {
            const wadah = document.getElementById('serah-notifikasi');
            const terima = res.perluDiterima || [];
            const menunggu = res.menungguDiterima || [];
            const lanjut = res.siapDilanjutkan || [];
            bolehLogoutDinasan_ = (res.bolehLogout !== false);

            if (!terima.length && !menunggu.length && !lanjut.length) {
                wadah.classList.add('hidden');
                wadah.innerHTML = '';
                return;
            }

            const kartu = function (d, warna, ikon, judul, tombol) {
                return '<div class="p-3 rounded-xl border ' + warna + ' flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">' +
                    '<div class="min-w-0">' +
                        '<p class="text-[11px] font-black flex items-center gap-1.5"><i class="fa-solid ' + ikon + '"></i>' + judul + '</p>' +
                        '<p class="text-[10px] font-bold opacity-80 mt-0.5 truncate">' +
                            escapeHtml(d.nomorDokumen || '-') + ' &middot; ' + escapeHtml(formatTanggalDinasan_(d.tanggal)) +
                            ' &middot; dinas ' + escapeHtml(d.dariDinas || '-') + ' ke ' + escapeHtml(d.keDinas || '-') + '</p>' +
                    '</div>' + tombol + '</div>';
            };

            const bagian = [];

            terima.forEach(function (d) {
                bagian.push(kartu(d, 'bg-amber-50 border-amber-300 text-amber-900', 'fa-inbox',
                    'Menunggu Anda menerima &mdash; dari ' + escapeHtml(d.menyerahkanNama || '-'),
                    '<button onclick="terimaSerahTerima(\'' + d.id + '\')" class="shrink-0 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-black text-[11px] rounded-lg shadow-sm transition flex items-center gap-1.5">' +
                    '<i class="fa-solid fa-check"></i><span>Terima</span></button>'));
            });

            // ═══ LANGKAH "TUTUP" DIHAPUS ═══
            // Dulu di sini ada tombol Tutup: setelah penerima menyatakan
            // menerima, pengirim masih harus menekannya untuk mengunci
            // laporannya. Langkah itu tidak punya keputusan apa pun yang
            // tersisa - menerima SUDAH berarti mengunci.
            //
            // Yang menggantikannya adalah keterangan: laporan yang saya
            // serahkan & belum diterima. Bukan pekerjaan saya, tapi selama ini
            // ada saya belum boleh logout - jadi harus terlihat, lengkap
            // dengan nama orang yang sedang ditunggu.
            menunggu.forEach(function (d) {
                bagian.push(kartu(d, 'bg-amber-50 border-amber-300 text-amber-900', 'fa-hourglass-half',
                    'Menunggu ' + escapeHtml(d.menerimaNama || 'dinas berikutnya') + ' menerima',
                    '<span class="shrink-0 px-3 py-2 bg-white border border-amber-300 text-amber-800 font-bold text-[10px] rounded-lg">' +
                    'Belum bisa logout</span>'));
            });

            lanjut.slice(0, 2).forEach(function (d) {
                bagian.push(kartu(d, 'bg-slate-50 border-slate-200 text-slate-700', 'fa-forward',
                    'Dinas sebelumnya sudah Anda terima',
                    '<button onclick="lanjutkanDariDinasan_(\'' + d.id + '\')" class="shrink-0 px-4 py-2 bg-[#0c1d37] hover:bg-slate-800 text-white font-black text-[11px] rounded-lg shadow-sm transition flex items-center gap-1.5">' +
                    '<i class="fa-solid fa-pen-to-square"></i><span>Lanjutkan Pengisian</span></button>'));
            });

            wadah.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2.5';
            wadah.innerHTML =
                '<div class="flex items-center justify-between gap-2">' +
                    '<p class="text-[11px] font-black text-[#0c1d37] uppercase tracking-wider flex items-center gap-2">' +
                        '<span class="w-6 h-6 rounded-lg bg-[#0c1d37] text-[#d4af37] inline-flex items-center justify-center text-[10px]"><i class="fa-solid fa-bell"></i></span>' +
                        'Menunggu Tindakan Anda</p>' +
                    '<button onclick="muatNotifikasiDinasan_()" title="Muat ulang" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-500 flex items-center justify-center transition"><i class="fa-solid fa-rotate text-[10px]"></i></button>' +
                '</div>' + bagian.join('');
            wadah.classList.remove('hidden');
        }

        /**
         * Melanjutkan pengisian dari dinas sebelumnya.
         *
         * Yang DIBAWA: kondisi peralatan beserta catatannya, cadangan/SO sarana,
         * situasi lintas, acuan PERKA, dan jumlah perka/trainset - semuanya
         * keadaan yang bertahan melewati pergantian shift, dan mengetik ulang
         * hanya membuka peluang salah salin.
         *
         * Yang TIDAK dibawa: ketiga tabel perjalanan & catatan lain. KLB milik
         * shift yang menerbitkannya; membawanya berarti melaporkan kejadian
         * orang lain sebagai kejadian shift ini.
         */
        function lanjutkanDariDinasan_(id) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat dinas sebelumnya: ' + ((res && res.message) || '')); return; }
                    const d = res.data;

                    resetFormSerah();
                    serahEditingId = null;
                    serahNomorDok_ = '';
                    serahStatus_ = 'draft';

                    // Shift berikutnya & tanggalnya. Dinas Malam menyerahkan ke
                    // Pagi HARI BERIKUTNYA - shiftnya menyeberangi tengah malam.
                    const shiftBaru = SERAH_BERIKUT[d.dariDinas] || d.dariDinas;
                    const tanggalBaru = (d.dariDinas === 'Malam')
                        ? geserTanggalSerah_(d.tanggal, 1) : d.tanggal;

                    const setEl = function (idEl, nilai) { const el = document.getElementById(idEl); if (el) el.value = nilai || ''; };
                    setEl('serah-tanggal', tanggalBaru);
                    shiftDipilihManual_ = true;      // shift sudah ditentukan di sini
                    petugasDariManual_ = true;
                    isiHariSerah_();
                    shiftDipilihManual_ = true;
                    petugasDariManual_ = true;
                    setEl('serah-dari-dinas', shiftBaru);
                    terapkanJamShift_();

                    setEl('serah-perka-acuan', d.perkaAcuan);
                    LINTAS_CETAK.forEach(function (l) {
                        const gabung = String(d['ka' + l.k.charAt(0).toUpperCase() + l.k.slice(1)] || '');
                        const cocok = gabung.match(/^\s*(.*?)\s*KA\s*\/\s*(.*?)\s*TS\s*$/i);
                        setEl('serah-ka-' + l.k, cocok ? (cocok[1] === '-' ? '' : cocok[1]) : '');
                        setEl('serah-ts-' + l.k, cocok ? (cocok[2] === '-' ? '' : cocok[2]) : '');
                        setEl('serah-lintas-' + l.huruf, d['lintas' + l.k.charAt(0).toUpperCase() + l.k.slice(1)] || '');
                    });

                    // Peralatan: kondisi & catatannya dibawa apa adanya.
                    catatanPeralatan_ = {};
                    (d.peralatan || []).forEach(function (a) {
                        const radio = document.querySelector('input[name="serah-alat-' + a.no + '"][value="' + a.kondisi + '"]');
                        if (radio) radio.checked = true;
                        if (a.catatan) catatanPeralatan_[a.no] = a.catatan;
                    });
                    renderPeralatanSerah_();
                    (d.peralatan || []).forEach(function (a) {
                        const radio = document.querySelector('input[name="serah-alat-' + a.no + '"][value="' + a.kondisi + '"]');
                        if (radio) radio.checked = true;
                    });
                    perbaruiRingkasAlat_();
                    setEl('serah-alat-lain', d.alatLain);

                    serahSarana = (d.sarana || []).map(function (s) {
                        return { depo: s.depo || '', ts: s.ts || '', keterangan: s.keterangan || '' };
                    });
                    if (!serahSarana.length) serahSarana = [{}, {}];
                    renderSarana_();

                    // Penerima dinas sebelumnya = yang sekarang menyerahkan.
                    isiPetugasDari_({
                        nama: d.menerimaNama, nipp: d.menerimaNipp, jabatan: d.menerimaJabatan
                    });

                    gambarStatusSerah_();
                    loncatKeLangkah_(1);
                    showToast('Isian dilanjutkan dari ' + (d.nomorDokumen || 'dinas sebelumnya') +
                        '. Tabel KLB sengaja dikosongkan - itu milik shift sebelumnya.');
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat dinas sebelumnya.'); })
                .dinasan_getSatu(currentSessionToken, id);
        }

        // ================================================================
        // LAPORAN DINASAN - riwayat serah terima (menu tc-dinasan)
        // ================================================================
        //
        // Sumber datanya SAMA dengan formulir Serah Terima, jadi apa yang
        // baru saja disimpan langsung muncul di sini tanpa langkah tambahan.

        let dinasanCache_ = null;

        /**
         * Berganti antara dua jenis laporan di menu Laporan Dinasan.
         *
         * Keduanya memakai data yang sama (dinasanCache_) & hanya berbeda cara
         * membacanya - jadi tidak ada pengambilan ulang ke server saat tab
         * ditukar. Keterangan di bawah tab ikut berubah, karena perbedaan
         * keduanya bukan soal tampilan melainkan soal APA yang dilihat.
         */
        // ════════════════════════════════════════════════════════════════
        // DUA JENIS LAPORAN, DUA SUMBER DATA
        // ════════════════════════════════════════════════════════════════
        //
        // Sebelumnya kedua tab membaca sumber yang sama - daftar baris
        // laporan. Itu keliru: pada model siklus satu laporan berpindah
        // tangan tiga kali tapi tetap SATU baris, jadi tab "Laporan Dinasan"
        // hanya menampilkan satu catatan per siklus. Yang dicari di sana
        // justru catatan TIAP ORANG.
        //
        //   Tab Laporan Dinasan -> dinasan_getSerahTerima  (per pergantian)
        //   Tab Laporan Harian  -> dinasan_getSiklus       (per tanggal, pasca Closing)

        let serahTerimaCache_ = null;
        let harianCache_ = null;

        function muatDaftarSerahTerima_(paksa) {
            if (!paksa && serahTerimaCache_) { renderDaftarSerahTerima_(); return; }
            const tbody = document.getElementById('lapdin-body');
            if (tbody) tbody.innerHTML = '<tr><td colspan="9" class="py-8 text-center text-slate-400 font-bold text-xs">Memuat...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat serah terima.'); return; }
                    serahTerimaCache_ = res.data || [];
                    renderDaftarSerahTerima_();
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat serah terima.'); })
                .dinasan_getSerahTerima(currentSessionToken,
                    (document.getElementById('lapdin-mulai') || {}).value || '',
                    (document.getElementById('lapdin-akhir') || {}).value || '');
        }

        function renderDaftarSerahTerima_() {
            const tbody = document.getElementById('lapdin-body');
            if (!tbody) return;
            const cari = String((document.getElementById('lapdin-cari') || {}).value || '').toLowerCase();
            const dinas = String((document.getElementById('lapdin-dinas') || {}).value || '');

            const baris = (serahTerimaCache_ || []).filter(function (r) {
                // Nilai pilihan "Semua Dinas" adalah string "Semua", BUKAN
                // string kosong. Pemeriksaan `if (dinas && ...)` menganggapnya
                // sebuah pilihan nyata, lalu membandingkannya dengan shift -
                // & karena tidak ada shift bernama "Semua", seluruh baris
                // tersaring habis. Itulah sebabnya penyaringnya tampak mati.
                if (dinas && dinas !== 'Semua' && r.dariShift !== dinas) return false;
                if (!cari) return true;
                return [r.nomorDokumen, r.menyerahkanNama, r.menerimaNama, r.tahapLabel]
                    .join(' ').toLowerCase().indexOf(cari) !== -1;
            });

            // IZIN KOLOM AKSI
            //
            // Dulu ketiga tombol memakai satu syarat yang sama, akuSuperAdmin_().
            // Dua hal keliru di situ:
            //
            // 1. Tombol PREVIEW ikut terkunci, padahal ia hanya membaca &
            //    mencetak - tidak mengubah apa pun. Petugas yang berhak
            //    melihat menu ini tentu berhak melihat isi laporannya.
            // 2. Sunting & hapus menilai ROLE MENTAH, bukan izin menu. Akibatnya
            //    pengaturan izin yang diatur di User Management tidak
            //    berpengaruh sama sekali di tabel ini.
            //
            // Sekarang: preview untuk siapa pun yang bisa membuka menu ini,
            // sunting & hapus mengikuti canDo() - pola yang sama dengan menu
            // Rekap Gangguan Sarana & dengan penggambar lama di bawah.
            //
            // Ini hanya mengatur tombolnya terlihat atau tidak. Penjagaan
            // sebenarnya tetap di server: dinasan_save & dinasan_delete
            // menolak sendiri role yang tidak berhak.
            const bolehSunting = (typeof canDo === 'function') ? canDo('tc-serah', 'edit') : akuSuperAdmin_();
            const bolehHapus = (typeof canDo === 'function') ? canDo('tc-serah', 'hapus') : akuSuperAdmin_();

            tbody.innerHTML = baris.length ? baris.map(function (r, i) {
                const lencana = r.status === 'menunggu'
                    ? '<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[9px] font-black">Menunggu diterima</span>'
                    : '<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[9px] font-black">Diterima</span>';
                return '<tr class="hover:bg-slate-50 transition">' +
                    '<td class="py-2.5 px-3 text-center text-[10px] text-slate-400">' + (i + 1) + '</td>' +
                    '<td class="py-2.5 px-3"><p class="font-mono text-[10px] text-slate-600">' + escapeHtml(r.nomorDokumen || '-') + '</p>' +
                        '<p class="text-[9px] text-slate-400 font-bold">Siklus ' + escapeHtml(String(r.siklusKe || '-')) + '</p></td>' +
                    '<td class="py-2.5 px-3"><p class="font-bold text-slate-800">' + escapeHtml(formatTanggalDinasan_(r.tanggal)) + '</p>' +
                        '<p class="text-[9px] text-slate-400 font-bold">' + escapeHtml(r.hari || '') + '</p></td>' +
                    '<td class="py-2.5 px-3"><span class="px-1.5 py-0.5 rounded ' + warnaShiftResume_(r.dariShift) + ' text-[9px] font-black whitespace-nowrap">' +
                        escapeHtml(r.dariShift || '-') + ' &rarr; ' + escapeHtml(r.keShift || '-') + '</span></td>' +
                    '<td class="py-2.5 px-3"><p class="font-bold text-slate-800">' + escapeHtml(r.menyerahkanNama || '-') + '</p>' +
                        '<p class="text-[9px] font-mono text-slate-400">' + escapeHtml(r.menyerahkanNipp || '') + '</p></td>' +
                    '<td class="py-2.5 px-3"><p class="font-bold text-slate-800">' + escapeHtml(r.menerimaNama || '-') + '</p>' +
                        '<p class="text-[9px] font-mono text-slate-400">' + escapeHtml(r.menerimaNipp || '') + '</p></td>' +
                    '<td class="py-2.5 px-3 text-center">' + lencana + '</td>' +
                    '<td class="py-2.5 px-3 text-center text-[10px] text-slate-500">' +
                        escapeHtml(r.diterimaPada ? formatTanggalDinasan_(tanggalDariCapWaktu_(r.diterimaPada)) : '-') + '</td>' +
                    '<td class="py-2.5 px-3"><div class="flex items-center justify-center gap-1">' +
                        // Preview: selalu ada - hanya membaca & mencetak.
                        '<button onclick="lihatSerahTerima_(\'' + r.dinasanId + '\', ' + (Number(r.urut) || 0) + ')" ' +
                            'title="Preview &amp; cetak laporan pergantian ini" class="w-7 h-7 bg-blue-50 text-[#0c1d37] hover:bg-[#0c1d37] hover:text-white rounded transition flex items-center justify-center"><i class="fa-regular fa-eye text-xs"></i></button>' +
                        (bolehSunting ? '<button onclick="suntingDinasan_(\'' + r.dinasanId + '\')" title="Edit laporan siklus ini" class="w-7 h-7 bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white rounded transition flex items-center justify-center"><i class="fa-regular fa-pen-to-square text-xs"></i></button>' : '') +
                        (bolehHapus ? '<button onclick="hapusDariResume_(\'' + r.dinasanId + '\', \'' + escapeHtml(r.nomorDokumen || '') + '\')" title="Hapus laporan siklus ini" class="w-7 h-7 bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white rounded transition flex items-center justify-center"><i class="fa-regular fa-trash-can text-xs"></i></button>' : '') +
                    '</div></td></tr>';
            }).join('')
            : '<tr><td colspan="9" class="py-10 text-center text-slate-400 font-bold text-[11px] italic">Belum ada serah terima pada rentang ini.</td></tr>';

            const el = function (id, v) { const x = document.getElementById(id); if (x) x.textContent = v; };
            el('lapdin-showing', baris.length);
            el('lapdin-total', (serahTerimaCache_ || []).length);
            const kosong = document.getElementById('lapdin-empty');
            if (kosong) kosong.classList.add('hidden');
        }

        function muatLaporanHarian_(paksa) {
            if (!paksa && harianCache_) { renderLaporanHarian_(); return; }
            const wadah = document.getElementById('lapdin-harian');
            if (wadah) wadah.innerHTML = '<p class="text-center text-slate-400 font-bold text-xs py-8">Memuat...</p>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat laporan harian.'); return; }
                    harianCache_ = res.data || [];
                    renderLaporanHarian_();
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat laporan harian.'); })
                .dinasan_getSiklus(currentSessionToken,
                    (document.getElementById('lapdin-mulai') || {}).value || '',
                    (document.getElementById('lapdin-akhir') || {}).value || '');
        }

        function renderLaporanHarian_() {
            const wadah = document.getElementById('lapdin-harian');
            if (!wadah) return;
            const d = harianCache_ || [];

            const info = document.getElementById('lapdin-hari-info');
            if (info) info.textContent = d.length + ' laporan harian';

            if (!d.length) {
                wadah.innerHTML =
                    '<tr><td colspan="9" class="py-12 text-center">' +
                        '<div class="w-14 h-14 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">' +
                            '<i class="fa-solid fa-calendar-xmark text-lg"></i></div>' +
                        '<p class="font-bold text-slate-600 text-sm">Belum ada laporan harian.</p>' +
                        '<p class="text-xs text-slate-400 mt-1 font-semibold">Laporan harian terbentuk setelah dinas Malam menekan <strong>Close Laporan</strong>.</p>' +
                    '</td></tr>';
                return;
            }

            const bolehUbah = akuSuperAdmin_();
            wadah.innerHTML = d.map(function (s, i) {
                const r = s.ringkas || {};
                const pt = s.petugas || {};
                const kolom = function (o) {
                    const nama = (o && o.nama) || '';
                    if (!nama) return '<td class="py-2.5 px-3 text-slate-300 italic text-[10px]">belum ada</td>';
                    return '<td class="py-2.5 px-3">' +
                        '<p class="font-bold text-slate-800 leading-tight">' + escapeHtml(nama) + '</p>' +
                        '<p class="text-[9px] font-mono text-slate-400">' + escapeHtml((o && o.nipp) || '') + '</p></td>';
                };
                return '<tr class="hover:bg-slate-50 transition align-top">' +
                    '<td class="py-2.5 px-3 text-center text-[10px] text-slate-400">' + (i + 1) + '</td>' +
                    '<td class="py-2.5 px-3">' +
                        '<p class="font-mono text-[10px] text-slate-700">' + escapeHtml(s.nomorHarian || '-') + '</p>' +
                        '<p class="text-[9px] font-bold text-slate-400">Close Laporan ' + escapeHtml(String(r.siklusKe || '')) + '</p></td>' +
                    '<td class="py-2.5 px-3">' +
                        '<p class="font-bold text-slate-800">' + escapeHtml(formatTanggalDinasan_(s.tanggal)) + '</p>' +
                        '<p class="text-[9px] font-bold text-slate-400">' + escapeHtml(r.hari || '') + '</p></td>' +
                    kolom(pt.satu) + kolom(pt.dua) + kolom(pt.tiga) + kolom(pt.empat) +
                    '<td class="py-2.5 px-3 text-center">' +
                        '<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-black">Finish</span></td>' +
                    '<td class="py-2.5 px-3"><div class="flex items-center justify-center gap-1">' +
                        '<button onclick="lihatLaporanHarian_(\'' + s.tanggal + '\')" title="Preview laporan final" class="w-7 h-7 bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-600 rounded transition flex items-center justify-center"><i class="fa-regular fa-eye text-xs"></i></button>' +
                        (bolehUbah ? '<button onclick="suntingLaporanHarian_(\'' + s.tanggal + '\')" title="Buka kembali &amp; sunting" class="w-7 h-7 bg-slate-100 hover:bg-[#d4af37] hover:text-[#0c1d37] text-slate-600 rounded transition flex items-center justify-center"><i class="fa-regular fa-pen-to-square text-xs"></i></button>' : '') +
                        (bolehUbah ? '<button onclick="hapusLaporanHarian_(\'' + s.tanggal + '\', \'' + escapeHtml(s.nomorHarian || '') + '\')" title="Hapus laporan harian ini" class="w-7 h-7 bg-slate-100 hover:bg-red-600 hover:text-white text-slate-600 rounded transition flex items-center justify-center"><i class="fa-regular fa-trash-can text-xs"></i></button>' : '') +
                    '</div></td></tr>';
            }).join('');
            return;
        }

        /**
         * Menyunting laporan harian = membuka kembali siklusnya lebih dulu.
         *
         * Laporan final sengaja terkunci. Menyuntingnya langsung berarti
         * mengubah dokumen yang sudah dinyatakan selesai tanpa jejak; jadi
         * jalannya dibuat lewat pembukaan siklus, yang tercatat di Riwayat
         * Aktivitas.
         */
        /**
         * Menghapus laporan harian beserta lembar siklusnya.
         *
         * Peringatannya menyebut KEDUANYA, karena yang terhapus memang bukan
         * hanya barisnya di daftar ini: seluruh isi laporannya - KLB, cadangan
         * sarana, catatan - ikut hilang. Menyebutnya sebagai "hapus baris"
         * akan membuat orang menekan Ya tanpa menyadari apa yang lenyap.
         */
        function hapusLaporanHarian_(tanggal, nomor) {
            if (!akuSuperAdmin_()) { showToast('Hanya Administrator & Super Admin yang bisa menghapus laporan harian.'); return; }
            konfirmasi_({
                judul: 'Hapus laporan harian ini?',
                pesan: 'Seluruh isi laporannya ikut terhapus - KLB, cadangan sarana, catatan dinas, & tanda tangannya. ' +
                       'Tindakan ini tidak bisa dibatalkan.',
                rincian: escapeHtml(nomor || '-') + ' &middot; ' + escapeHtml(formatTanggalDinasan_(tanggal)),
                ya: 'Hapus Permanen', ikonYa: 'fa-trash-can', ikon: 'fa-triangle-exclamation', bahaya: true
            }).then(function (ya) {
                if (!ya) return;
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) { showToast('Gagal menghapus: ' + ((res && res.message) || '')); return; }
                        showToast('Laporan harian ' + (res.nomorHarian || '') + ' dihapus.');
                        harianCache_ = null; dinasanCache_ = null;
                        muatLaporanHarian_(true);
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus laporan harian.'); })
                    .dinasan_hapusLaporanHarian(currentSessionToken, tanggal);
            });
        }

        function suntingLaporanHarian_(tanggal) {
            if (!akuSuperAdmin_()) { showToast('Hanya Administrator & Super Admin yang bisa menyunting laporan final.'); return; }
            konfirmasi_({
                judul: 'Buka kembali laporan ' + formatTanggalDinasan_(tanggal) + '?',
                pesan: 'Laporan final tidak bisa disunting selagi terkunci. Membukanya mengembalikannya ke siklus berjalan ' +
                       'sehingga isinya bisa diubah, lalu ditutup lagi. Tindakan ini tercatat di Riwayat Aktivitas.',
                ya: 'Buka & Sunting', ikonYa: 'fa-lock-open', ikon: 'fa-triangle-exclamation'
            }).then(function (ya) {
                if (!ya) return;
                bukaSiklusHarian_(tanggal);
                setTimeout(function () { switchTab('tc-serah'); }, 600);
            });
        }

        function renderLaporanHarianKartuLama_() {
            const wadah = document.getElementById('lapdin-harian');
            const d = harianCache_ || [];

            wadah.innerHTML = d.map(function (s) {
                const r = s.ringkas || {};
                // ═══ RANTAI PERGANTIAN TIDAK DITAMPILKAN DI SINI ═══
                // Laporan Harian adalah laporan FINAL satu hari, bukan
                // riwayat siapa menyerahkan ke siapa - riwayat itu tempatnya
                // di tab Laporan Dinasan, & menampilkannya di kedua tempat
                // membuat keduanya terlihat memuat hal yang sama.
                //
                // Yang ditampilkan di sini isi laporannya: nomor dokumen,
                // acuan PERKA, & angka kejadiannya.
                const keterangan = [
                    r.perkaAcuan ? 'PERKA ' + escapeHtml(r.perkaAcuan) : '',
                    (r.alatBermasalah || []).length ? (r.alatBermasalah.length + ' peralatan bermasalah') : 'Peralatan baik',
                    (r.catatan || []).length ? (r.catatan.length + ' catatan dinas') : ''
                ].filter(Boolean).join(' &middot; ');
                return '<div class="p-4 rounded-2xl border border-slate-200 bg-white hover:border-[#0c1d37]/30 transition">' +
                    '<div class="flex items-start justify-between gap-3 flex-wrap">' +
                        '<div class="min-w-0">' +

                            '<p class="text-[10px] font-bold text-slate-400 mt-0.5">' +
                                escapeHtml(r.hari || '') + (r.siklusKe ? ' &middot; Siklus ' + escapeHtml(String(r.siklusKe)) : '') +
                                ' &middot; ditutup ' + escapeHtml(s.ditutupOleh || '-') + '</p>' +
                        '</div>' +
                        '<div class="flex items-center gap-2">' +
                            '<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-black">' +
                                '<i class="fa-solid fa-flag-checkered mr-1"></i>Final</span>' +
                            '<button onclick="lihatLaporanHarian_(\'' + s.tanggal + '\')" class="px-3 py-1.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold text-[10px] rounded-lg transition flex items-center gap-1.5">' +
                                '<i class="fa-solid fa-file-lines text-[#d4af37]"></i><span>Buka Laporan</span></button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="grid grid-cols-3 gap-2 mt-3">' +
                        ['KLB Jalan|klbJalan|emerald', 'Rekayasa|rekayasa|amber', 'Pembatalan|pembatalan|red'].map(function (x) {
                            const b = x.split('|');
                            return '<div class="px-2.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-center">' +
                                '<p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">' + b[0] + '</p>' +
                                '<p class="text-base font-black text-' + b[2] + '-600 leading-none mt-0.5">' + (r[b[1]] || 0) + '</p></div>';
                        }).join('') +
                    '</div>' +
                    '<p class="text-[10px] font-semibold text-slate-500 mt-2.5">' +
                        '<i class="fa-solid fa-file-lines mr-1 text-slate-300"></i>' +
