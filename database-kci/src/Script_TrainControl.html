            L: 'bg-emerald-100 text-emerald-700'
        };
        const JADWAL_WARNA_CETAK_ = {
            DP41: '#fde68a', DS52: '#bae6fd', DM4: '#4f46e5', N: '#e2e8f0', L: '#d1fae5'
        };
        const NAMA_BULAN_JADWAL_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli',
            'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const NAMA_HARI_JADWAL_ = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

        // ── Pembantu kecil ──────────────────────────────────────────────

        function kunciHariJadwal_(d) { return (d < 10 ? '0' : '') + d; }
        function nippBakuJadwal_(v) { return String(v === undefined || v === null ? '' : v).replace(/\D/g, '').replace(/^0+/, ''); }
        function namaBakuJadwal_(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
        function jadwalBolehUbah_() { return typeof canDo === 'function' && canDo('tc-roster', 'tambah'); }
        function adalahPetugasJadwal_(r) { return !!String((r && r.nama) || '').trim(); }

        /** "dp 41" -> "DP41"; kode di luar daftar dibiarkan apa adanya (mis. CUTI SAKIT). */
        function kodeBakuJadwal_(v) {
            const s = String(v === undefined || v === null ? '' : v).replace(/\s+/g, ' ').trim();
            if (!s) return '';
            const rapat = s.toUpperCase().replace(/\s+/g, '');
            const baku = Object.keys(jadwalKode_);
            return baku.indexOf(rapat) !== -1 ? rapat : s;
        }
        function kodeAdalahBakuJadwal_(k) { return Object.keys(jadwalKode_).indexOf(k) !== -1; }
        function warnaKodeJadwal_(k) { return JADWAL_WARNA[k] || (k ? 'bg-rose-100 text-rose-700' : ''); }
        /** Keterangan panjang diringkas di sel selebar 34px - teks utuhnya di tooltip. */
        function singkatKodeJadwal_(k) {
            if (!k) return '';
            if (k.length <= 4) return k;
            const kata = k.split(/\s+/).filter(Boolean);
            return kata.length > 1 ? kata.slice(0, 3).map(function (w) { return w.charAt(0); }).join('').toUpperCase() : k.slice(0, 4);
        }
        function bulanTerpilihJadwal_() {
            return (document.getElementById('jadwal-bulan') || {}).value || jadwalBulanDimuat_ || bulanIniIso_();
        }
        function labelBulanJadwal_(b) {
            const p = String(b || '').split('-');
            return (NAMA_BULAN_JADWAL_[Number(p[1]) - 1] || '?') + ' ' + (p[0] || '');
        }
        function jumlahHariBulanJadwal_(b) {
            const p = String(b || bulanTerpilihJadwal_()).split('-');
            return new Date(Number(p[0]), Number(p[1]), 0).getDate() || 31;
        }
        /** Dipertahankan untuk pemanggil lama. */
        function jadwalJumlahHari_() { return jumlahHariBulanJadwal_(jadwalBulanDimuat_ || bulanTerpilihJadwal_()); }
        function hariPekanJadwal_(b, d) {
            const p = String(b).split('-');
            return new Date(Number(p[0]), Number(p[1]) - 1, d).getDay();
        }

        // ── Memuat ──────────────────────────────────────────────────────

        function loadJadwalDinasan() {
            const sel = document.getElementById('jadwal-bulan');
            if (!sel) return;
            if (!sel.value) sel.value = bulanIniIso_();
            pasangPeristiwaKisiJadwal_();
            terapkanIzinJadwal_();
            // Perubahan yang belum disimpan tidak dibuang hanya karena pengguna
            // sempat berpindah menu.
            if (jadwalBerubah_ && jadwalBulanDimuat_ === sel.value) { gambarJadwal_(); return; }
            muatJadwal_();

        function muatJadwal_(bulanPaksa, setelah) {
            const sel = document.getElementById('jadwal-bulan');
            const bulan = bulanPaksa || (sel && sel.value) || bulanIniIso_();
            const body = document.getElementById('jadwal-body');
            if (body) body.innerHTML = '<tr><td colspan="40" class="py-10 text-center text-slate-400 font-bold text-[11px]">' +
                '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Memuat jadwal ' + escapeHtml(labelBulanJadwal_(bulan)) + '...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) {
                        showToast('Gagal memuat jadwal: ' + ((res && res.message) || ''));
                        if (body) body.innerHTML = '';
                        return;
                    }
                    jadwalBulanDimuat_ = res.bulan || bulan;
                    if (sel) sel.value = jadwalBulanDimuat_;
                    jadwalBaris_ = (res.baris || []).map(function (r) {
                        return {
                            grup: String(r.grup || ''), nipp: String(r.nipp || ''), nama: String(r.nama || ''),
                            jabatan: String(r.jabatan || ''), kode: r.kode || {}, realisasi: r.realisasi || {}
                        };
                    });
                    jadwalTtd_ = res.ttd || [];
                    if (res.kode) jadwalKode_ = res.kode;
                    jadwalHariIni_ = res.hariIni || hariIniIso_();
                    susunIndeksOtomatisJadwal_(res.otomatis || []);
                    tandaiBerubahJadwal_(false);

                .jadwal_get(currentSessionToken, bulan);

        /** Mengganti bulan - perubahan yang belum disimpan tidak dibuang diam-diam. */
        function gantiBulanJadwal_() {
            const sel = document.getElementById('jadwal-bulan');
            if (!sel || !sel.value) { if (sel) sel.value = jadwalBulanDimuat_ || bulanIniIso_(); return; }
            if (!jadwalBerubah_ || sel.value === jadwalBulanDimuat_) { muatJadwal_(sel.value); return; }
            const tujuan = sel.value;
            sel.value = jadwalBulanDimuat_;
            konfirmasi_({
                judul: 'Buang perubahan yang belum disimpan?',
                pesan: 'Jadwal ' + escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) + ' punya perubahan yang belum disimpan. ' +
                    'Pindah ke ' + escapeHtml(labelBulanJadwal_(tujuan)) + ' akan membuangnya.',
                ya: 'Buang & Pindah', ikon: 'fa-calendar-xmark'
            }).then(function (ok) { if (ok) { tandaiBerubahJadwal_(false); muatJadwal_(tujuan); } });
        }

        function geserBulanJadwal_(n) {
            const sel = document.getElementById('jadwal-bulan');
            if (!sel) return;
            const p = String(sel.value || bulanIniIso_()).split('-');
            const d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1);
            sel.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            gantiBulanJadwal_();
        }

        function terapkanIzinJadwal_() {
            const boleh = jadwalBolehUbah_();
            document.querySelectorAll('.jadwal-perlu-izin').forEach(function (el) {
                if (!boleh) el.classList.add('hidden');

        }

        function tandaiBerubahJadwal_(nilai) {
            jadwalBerubah_ = (nilai !== false);
            const lencana = document.getElementById('jadwal-status-simpan');
            if (lencana) lencana.classList.toggle('hidden', !jadwalBerubah_);
            const btn = document.getElementById('btn-jadwal-simpan');
            if (btn) {
                btn.classList.toggle('ring-4', jadwalBerubah_);
                btn.classList.toggle('ring-amber-300', jadwalBerubah_);

        }

        // ── Realisasi otomatis ─────────────────────────────────────────

        function susunIndeksOtomatisJadwal_(daftar) {
            jadwalOtoIndeks_ = { nipp: {}, nama: {} };
            jadwalLiputan_ = {};
            const gabung = function (lama, baru) {
                if (!lama) return { nipp: baru.nipp, nama: baru.nama, hari: Object.assign({}, baru.hari), sumber: Object.assign({}, baru.sumber) };
                Object.keys(baru.hari || {}).forEach(function (dd) {
                    if (!lama.hari[dd] || (baru.sumber || {})[dd] === 'siklus') { lama.hari[dd] = baru.hari[dd]; lama.sumber[dd] = (baru.sumber || {})[dd]; }
                });
                return lama;
            };
            (daftar || []).forEach(function (o) {
                const n = nippBakuJadwal_(o.nipp), nm = namaBakuJadwal_(o.nama);
                if (n) jadwalOtoIndeks_.nipp[n] = gabung(jadwalOtoIndeks_.nipp[n], o);
                if (nm) jadwalOtoIndeks_.nama[nm] = gabung(jadwalOtoIndeks_.nama[nm], o);
                Object.keys(o.hari || {}).forEach(function (dd) {
                    const k = o.hari[dd];
                    if (JADWAL_SHIFT_.indexOf(k) === -1) return;
                    jadwalLiputan_[dd] = jadwalLiputan_[dd] || {};
                    jadwalLiputan_[dd][k] = jadwalLiputan_[dd][k] || [];
                    const siapa = o.nama || o.nipp;
                    if (jadwalLiputan_[dd][k].indexOf(siapa) === -1) jadwalLiputan_[dd][k].push(siapa);
                });
            });
        }

        /** Catatan otomatis milik satu baris - dicocokkan lewat NIPP, lalu nama. */
        function otomatisBarisJadwal_(r) {
            const a = jadwalOtoIndeks_.nipp[nippBakuJadwal_(r.nipp)] || null;
            const b = jadwalOtoIndeks_.nama[namaBakuJadwal_(r.nama)] || null;
            if (a && b && a !== b) return { hari: Object.assign({}, b.hari, a.hari), sumber: Object.assign({}, b.sumber, a.sumber) };
            return a || b;
        }

        /**
         * Keadaan satu sel pada tampilan aktif.
         * @return {{kode:string, prog:string, sumber:string, status:string, ket:string, lampau:boolean}}
         *   status: '' | 'sesuai' | 'beda' | 'belum'
         */
        function keadaanSelJadwal_(r, d, mode) {
            const k = kunciHariJadwal_(d);
            const prog = (r.kode || {})[k] || '';
            if ((mode || jadwalMode_) === 'prog') return { kode: prog, prog: prog, sumber: '', status: '', ket: '', lampau: false };

            const lampau = (jadwalBulanDimuat_ + '-' + k) <= (jadwalHariIni_ || hariIniIso_());
            const manual = (r.realisasi || {})[k] || '';
            let kode = manual, sumber = manual ? 'manual' : '', ket = '';
            if (!kode) {
                const o = r._oto || otomatisBarisJadwal_(r);
                if (o && o.hari && o.hari[k]) { kode = o.hari[k]; sumber = 'otomatis'; }
            }
            if (!kode && lampau && prog) {
                const lip = jadwalLiputan_[k] || {};
                // Hanya untuk petugas SHIFT: bagi petugas kantor, lengkapnya
                // ketiga shift hari itu tidak mengatakan apa pun tentang dirinya.
                const petugasShift = Object.keys(r.kode || {}).some(function (x) { return JADWAL_SHIFT_.indexOf(r.kode[x]) !== -1; });
                if (prog === 'L' && petugasShift && lip.DP41 && lip.DS52 && lip.DM4) { kode = 'L'; sumber = 'simpulan'; }
                else if (JADWAL_SHIFT_.indexOf(prog) !== -1 && lip[prog] && lip[prog].length) { sumber = 'digantikan'; ket = lip[prog].join(', '); }
            }
            let status = '';
            if (lampau && prog) status = (sumber === 'digantikan') ? 'beda' : (!kode ? 'belum' : (kode === prog ? 'sesuai' : 'beda'));
            else if (lampau && !prog && kode && JADWAL_SHIFT_.indexOf(kode) !== -1) status = 'beda';
            return { kode: kode, prog: prog, sumber: sumber, status: status, ket: ket, lampau: lampau };
        }

        /** Hitungan kesesuaian satu baris / seluruh jadwal (hanya tanggal s.d. hari ini). */
        function hitungKesesuaianJadwal_(daftar) {
            const hari = jumlahHariBulanJadwal_(jadwalBulanDimuat_);
            const hasil = { sesuai: 0, beda: 0, belum: 0 };
            (daftar || jadwalBaris_).forEach(function (r) {
                if (!adalahPetugasJadwal_(r)) return;
                r._oto = otomatisBarisJadwal_(r);
                for (let d = 1; d <= hari; d++) {
                    const s = keadaanSelJadwal_(r, d, 'real').status;
                    if (s) hasil[s]++;
                }
            });
            const dinilai = hasil.sesuai + hasil.beda;
            hasil.persen = dinilai ? Math.round(hasil.sesuai / dinilai * 100) : null;
            return hasil;
        }

        // ── Menggambar ──────────────────────────────────────────────────

        function aturModeJadwal_(mode) {
            jadwalMode_ = (mode === 'real') ? 'real' : 'prog';
            if (jadwalMode_ === 'prog') jadwalBedaSaja_ = false;

            gambarJadwal_();
        }

        function toggleBedaSajaJadwal_() {
            jadwalBedaSaja_ = !jadwalBedaSaja_;
            gambarJadwal_();
        }

        function gambarJadwal_() {
            const head = document.getElementById('jadwal-head');
            const body = document.getElementById('jadwal-body');
            if (!head || !body) return;
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            const hari = jumlahHariBulanJadwal_(bulan);
            const boleh = jadwalBolehUbah_();
            const real = jadwalMode_ === 'real';
            const hariIni = jadwalHariIni_ || hariIniIso_();

            // Saklar mode
            [['prog', 'jadwal-mode-prog'], ['real', 'jadwal-mode-real']].forEach(function (p) {
                const b = document.getElementById(p[1]);
                if (!b) return;
                const aktif = jadwalMode_ === p[0];
                b.className = 'px-4 py-1.5 rounded-lg text-[11px] font-black transition flex items-center gap-1.5 ' +
                    (aktif ? (p[0] === 'real' ? 'bg-emerald-600 text-white shadow' : 'bg-[#0c1d37] text-white shadow') : 'text-slate-500 hover:text-slate-800');
            });
            const ket = document.getElementById('jadwal-mode-ket');
            if (ket) ket.innerHTML = real
                ? 'Dinas yang benar-benar dijalani. Terisi <b class="text-sky-600">otomatis dari Laporan Dinasan</b> &amp; bisa dikoreksi manual. Bingkai <b class="text-red-600">merah</b> = berbeda dari Program.'
                : 'Jadwal rencana. ' + (boleh ? 'Pilih kuas lalu klik / seret sel, atau klik sel untuk memilih kode.' : 'Hanya dapat dilihat.');
            const btnBeda = document.getElementById('btn-jadwal-beda');
            if (btnBeda) {
                btnBeda.classList.toggle('hidden', !real);

            }
            const btnSalin = document.getElementById('btn-jadwal-salin');
            if (btnSalin) btnSalin.classList.toggle('hidden', !(real && boleh));
            ['btn-jadwal-grup', 'btn-jadwal-petugas'].forEach(function (id) {
                const b = document.getElementById(id);
                if (b) b.classList.toggle('hidden', real || !boleh);
            });

            // ── Kepala ──
            let kepala = '<tr><th class="sticky left-0 z-20 bg-[#0c1d37] py-2 px-3 text-left min-w-[210px] border-r border-white/10">Petugas</th>';
            for (let d = 1; d <= hari; d++) {
                const w = hariPekanJadwal_(bulan, d);
                const iniHari = (bulan + '-' + kunciHariJadwal_(d)) === hariIni;
                kepala += '<th class="py-1.5 px-0 text-center w-[32px] min-w-[32px] ' +
                    (iniHari ? 'bg-[#d4af37] text-[#0c1d37]' : ((w === 0 || w === 6) ? 'bg-[#16304f]' : '')) + '"' +
                    (iniHari ? ' title="Hari ini"' : '') + '>' + d +
                    '<br><span class="' + (iniHari ? '' : 'opacity-60') + ' font-bold">' + NAMA_HARI_JADWAL_[w] + '</span></th>';
            }
            // Aksi (sunting / hapus) menumpang di sel Petugas - kolom sendiri
            // membuat kisi 31 hari melebihi lebar layar laptop.
            kepala += '<th class="py-2 px-1.5 text-center min-w-[56px]" title="' + (real ? 'Persentase sel yang sesuai Program s.d. hari ini' : 'Hari kerja: DP41, DS52, DM4 & N') + '">' +
                (real ? 'Sesuai' : '&Sigma; Kerja') + '</th></tr>';
            head.innerHTML = kepala;

            // ── Isi ──
            jadwalBaris_.forEach(function (r) { if (adalahPetugasJadwal_(r)) r._oto = otomatisBarisJadwal_(r); });
            const tampil = barisTampilJadwal_(hari);

            body.innerHTML = html.join('') || ('<tr><td colspan="' + kolom + '" class="py-12 text-center">' +
                (jadwalBaris_.length && jadwalBedaSaja_
                    ? '<p class="text-emerald-700 font-black text-xs"><i class="fa-solid fa-circle-check mr-1"></i>Tidak ada perbedaan antara Program &amp; Realisasi s.d. hari ini.</p>'
                    : '<div class="w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-calendar-xmark text-lg"></i></div>' +
                      '<p class="font-bold text-slate-600 text-sm">Belum ada jadwal untuk ' + escapeHtml(labelBulanJadwal_(bulan)) + '.</p>' +
                      (boleh ? '<button onclick="bukaInputJadwal_(\'excel\')" class="mt-3 px-4 py-2 bg-[#0c1d37] text-white font-bold text-xs rounded-xl hover:bg-slate-800 transition"><i class="fa-solid fa-file-circle-plus text-[#d4af37] mr-1.5"></i>Input Jadwal (Excel / Manual)</button>' : '')) +

        /** Baris mana yang tampil - penyaring "Hanya yang beda" menyembunyikan baris tanpa selisih. */
        function barisTampilJadwal_(hari) {
            const tampil = jadwalBaris_.map(function () { return true; });
            if (!(jadwalMode_ === 'real' && jadwalBedaSaja_)) return tampil;
            let grupTerakhir = -1, adaDiGrup = false;
            jadwalBaris_.forEach(function (r, i) {
                if (!adalahPetugasJadwal_(r)) {
                    if (grupTerakhir !== -1) tampil[grupTerakhir] = adaDiGrup;
                    grupTerakhir = i; adaDiGrup = false; return;
                }
                let beda = false;
                for (let d = 1; d <= hari && !beda; d++) beda = keadaanSelJadwal_(r, d).status === 'beda';
                tampil[i] = beda;
                if (beda) adaDiGrup = true;
            });
            if (grupTerakhir !== -1) tampil[grupTerakhir] = adaDiGrup;
            return tampil;
        }

        function barisJadwalHtml_(i, no, hari, bulan) {
            const r = jadwalBaris_[i];
            const boleh = jadwalBolehUbah_();
            const real = jadwalMode_ === 'real';
            const hariIni = jadwalHariIni_ || hariIniIso_();

            // Baris GRUP - judul unit, tanpa kode harian.
            if (!adalahPetugasJadwal_(r)) {
                return '<tr data-i="' + i + '" class="bg-slate-100 border-t-2 border-slate-200">' +
                    '<td class="sticky left-0 z-10 bg-slate-100 py-1.5 px-3 border-r border-slate-200">' +
                        '<div class="flex items-center gap-2">' +
                            '<i class="fa-solid fa-layer-group text-[10px] text-slate-400"></i>' +
                            (boleh && !real
                                ? '<input value="' + escapeHtml(r.grup) + '" oninput="ubahGrupJadwal_(' + i + ', this.value)" ' +
                                  'class="flex-1 min-w-0 bg-transparent text-[10px] font-black uppercase tracking-wider text-slate-600 focus:outline-none focus:bg-white rounded px-1 py-0.5">' +
                                  '<button onclick="hapusBarisJadwal_(' + i + ')" title="Hapus judul grup" class="text-slate-300 hover:text-red-600 transition"><i class="fa-solid fa-xmark text-xs"></i></button>'
                                : '<span class="text-[10px] font-black uppercase tracking-wider text-slate-600">' + escapeHtml(r.grup) + '</span>') +
                        '</div></td>' +
                    '<td colspan="' + (hari + 1) + '" class="bg-slate-100"></td></tr>';
            }

            // ── Sel harian, sel berisi keterangan yang sama & berurutan digabung ──
            const sel = [];
            for (let d = 1; d <= hari; d++) sel.push(keadaanSelJadwal_(r, d));
            let isi = '', d = 1, dinas = 0, sesuai = 0, dinilai = 0, belum = 0;
            while (d <= hari) {
                const s = sel[d - 1];
                let n = 1;
                if (s.kode && !kodeAdalahBakuJadwal_(s.kode)) {
                    while (d + n <= hari) {
                        const t = sel[d + n - 1];
                        if (t.kode !== s.kode || t.status !== s.status || t.sumber !== s.sumber) break;
                        n++;
                    }
                }
                for (let x = 0; x < n; x++) {
                    const sx = sel[d - 1 + x];
                    if (JADWAL_SHIFT_.indexOf(sx.kode) !== -1 || sx.kode === 'N') dinas++;
                    if (sx.status === 'sesuai') { sesuai++; dinilai++; }
                    else if (sx.status === 'beda') dinilai++;
                    else if (sx.status === 'belum') belum++;
                }
                isi += selJadwalHtml_(i, d, n, s, bulan, hariIni, boleh);
                d += n;
            }

            let total;
            if (real) {
                const persen = dinilai ? Math.round(sesuai / dinilai * 100) : null;
                const warna = persen === null ? 'text-slate-300' : (persen === 100 ? 'text-emerald-600' : (persen >= 80 ? 'text-amber-600' : 'text-red-600'));
                total = '<td class="py-1 px-1.5 text-center">' +
                    '<div class="font-black text-[11px] ' + warna + '">' + (persen === null ? '-' : persen + '%') + '</div>' +
                    '<div class="text-[8px] font-bold text-slate-400">' + sesuai + '/' + dinilai + (belum ? ' &middot; ' + belum + ' kosong' : '') + '</div></td>';
            } else {
                total = '<td class="py-1 px-1.5 text-center font-black text-[#0c1d37]">' + dinas + '</td>';
            }

            const namaHtml = (boleh && !real)
                ? '<button onclick="bukaInputJadwal_(\'manual\', ' + i + ')" title="Sunting petugas & polanya" class="text-left font-black text-slate-800 hover:text-[#0c1d37] hover:underline truncate block max-w-[150px]">' + escapeHtml(r.nama) + '</button>'
                : '<span class="font-black text-slate-800 truncate block max-w-[170px]" title="' + escapeHtml(r.nama) + '">' + escapeHtml(r.nama) + '</span>';
            const aksi = (boleh && !real)
                ? '<span class="ml-auto flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition shrink-0">' +
                    '<button onclick="bukaInputJadwal_(\'manual\', ' + i + ')" title="Sunting petugas" class="w-5 h-5 rounded text-slate-400 hover:bg-slate-100 hover:text-[#0c1d37]"><i class="fa-solid fa-pen text-[9px]"></i></button>' +
                    '<button onclick="hapusBarisJadwal_(' + i + ')" title="Hapus petugas" class="w-5 h-5 rounded text-slate-300 hover:bg-red-50 hover:text-red-600"><i class="fa-solid fa-xmark text-[10px]"></i></button>' +
                  '</span>'
                : '';

            return '<tr data-i="' + i + '" class="group border-t border-slate-100 hover:bg-amber-50/40 transition-colors">' +
                '<td class="sticky left-0 z-10 bg-white group-hover:bg-amber-50 py-1.5 pl-2 pr-1.5 border-r border-slate-200 min-w-[210px] max-w-[230px]">' +
                    '<div class="flex items-start gap-1.5">' +
                        '<span class="text-[9px] font-black text-slate-300 w-4 pt-0.5 text-right shrink-0">' + no + '</span>' +
                        '<div class="min-w-0 flex-1">' +
                            '<div class="flex items-center gap-1">' + namaHtml + aksi + '</div>' +
                            '<div class="text-[9px] font-semibold text-slate-400 truncate max-w-[180px]" title="' + escapeHtml(r.jabatan || '') + '">' +
                                '<span class="font-mono">' + escapeHtml(r.nipp || '-') + '</span>' + (r.jabatan ? ' &middot; ' + escapeHtml(r.jabatan) : '') +
                            '</div></div></div></td>' +
                isi + total + '</tr>';
        }

        function selJadwalHtml_(i, d, n, s, bulan, hariIni, boleh) {
            const w = hariPekanJadwal_(bulan, d);
            const iniHari = (bulan + '-' + kunciHariJadwal_(d)) === hariIni;
            const latar = iniHari ? 'bg-amber-50' : ((w === 0 || w === 6) && n === 1 ? 'bg-slate-50' : '');
            const real = jadwalMode_ === 'real';

            let kotak = 'h-7 rounded-md flex items-center justify-center text-[9px] font-black leading-none transition ';
            let teks = '';
            const judul = ['Tgl ' + d + (n > 1 ? '-' + (d + n - 1) : '')];
            if (s.kode) {
                kotak += warnaKodeJadwal_(s.kode) + ' ';
                teks = n > 1 ? '<span class="truncate px-1.5">' + escapeHtml(s.kode) + '</span>' : escapeHtml(singkatKodeJadwal_(s.kode));
                judul.push(s.kode + (jadwalKode_[s.kode] ? ' (' + jadwalKode_[s.kode] + ')' : ''));
            } else if (s.sumber === 'digantikan') {
                kotak += 'bg-white text-red-500 ';
                teks = '&ndash;';
            } else if (real && s.status === 'belum') {
                kotak += 'border border-dashed border-slate-200 ';
            } else if (boleh) {
                kotak += 'hover:bg-slate-100 ';
            }
            if (real) {
                if (s.sumber === 'otomatis') { kotak += 'shadow-[inset_0_-3px_0_0_rgba(14,165,233,0.95)] '; judul.push('Tercatat otomatis dari Laporan Dinasan'); }
                if (s.sumber === 'manual') judul.push('Diisi manual');
                if (s.sumber === 'simpulan') { kotak += 'opacity-50 italic '; judul.push('Disimpulkan: ketiga dinas hari itu tercatat & petugas ini tidak termasuk'); }
                if (s.sumber === 'digantikan') judul.push('Dinas ' + s.prog + ' hari itu tercatat dijalankan oleh ' + s.ket);
                if (s.status === 'beda') { kotak += 'ring-2 ring-inset ring-red-500 '; judul.push('BERBEDA - Program: ' + (s.prog || '(kosong)')); }
                if (s.status === 'belum') judul.push('Belum ada realisasi - Program: ' + s.prog);
                if (s.status === 'sesuai') judul.push('Sesuai Program');
            }
            if (boleh) kotak += 'cursor-pointer ';
            return '<td data-i="' + i + '" data-d="' + d + '" data-n="' + n + '"' + (n > 1 ? ' colspan="' + n + '"' : '') +
                ' class="sel-jadwal p-[2px] text-center ' + latar + '" title="' + escapeHtml(judul.join(' | ')) + '">' +
                '<div class="' + kotak + '">' + teks + '</div></td>';
        }

        /** Menggambar ulang SATU baris - dipakai saat mengecat supaya kisi tidak berkedip. */
        function perbaruiBarisJadwal_(i) {
            const tr = document.querySelector('#jadwal-body tr[data-i="' + i + '"]');
            if (!tr) { gambarJadwal_(); return; }
            let no = 0;
            for (let x = 0; x <= i; x++) if (adalahPetugasJadwal_(jadwalBaris_[x])) no++;
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            jadwalBaris_[i]._oto = otomatisBarisJadwal_(jadwalBaris_[i]);
            tr.outerHTML = barisJadwalHtml_(i, no, jumlahHariBulanJadwal_(bulan), bulan);
        }

        function gambarKuasJadwal_() {
            const wadah = document.getElementById('jadwal-kuas');
            if (!wadah) return;
            if (!jadwalBolehUbah_()) { wadah.classList.add('hidden'); return; }
            wadah.classList.remove('hidden');
            const kode = Object.keys(jadwalKode_);
            const tombol = function (k, label, kelas, ikon) {
                const aktif = jadwalKuas_ === k;
                return '<button type="button" onclick="pilihKuasJadwal_(' + escapeHtml(JSON.stringify(k)) + ')" ' +
                    'class="px-2.5 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1.5 transition ' + kelas + ' ' +
                    (aktif ? 'ring-2 ring-offset-1 ring-[#0c1d37] scale-105 shadow' : 'opacity-80 hover:opacity-100') + '">' +
                    (ikon ? '<i class="fa-solid ' + ikon + '"></i>' : '') + escapeHtml(label) + '</button>';
            };
            wadah.innerHTML =
                '<span class="text-[10px] font-black text-slate-500 uppercase tracking-wider mr-1"><i class="fa-solid fa-paintbrush mr-1"></i>Kuas ' +
                    (jadwalMode_ === 'real' ? '<span class="text-emerald-600">Realisasi</span>' : '<span class="text-[#0c1d37]">Program</span>') + '</span>' +
                kode.map(function (k) { return tombol(k, k, warnaKodeJadwal_(k)); }).join('') +
                tombol('', 'Hapus', 'bg-white border border-slate-200 text-slate-500', 'fa-eraser') +
                '<span class="flex items-center gap-1 ml-1">' +
                    '<input id="jadwal-kuas-teks" placeholder="Teks lain, mis. CUTI" onkeydown="if(event.key===\'Enter\'){pakaiKuasTeksJadwal_();}" ' +
                        'class="w-36 px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-[10px] font-bold focus:outline-none focus:ring-1 focus:ring-amber-500">' +
                    '<button type="button" onclick="pakaiKuasTeksJadwal_()" class="px-2 py-1.5 bg-rose-100 text-rose-700 rounded-lg text-[10px] font-black hover:bg-rose-200 transition">Pakai</button>' +
                '</span>' +
                '<span class="text-[10px] font-semibold text-slate-400 ml-auto">' +
                    (jadwalKuas_ === null
                        ? 'Pilih kuas lalu klik / seret di sel &middot; tanpa kuas: klik sel untuk memilih'
                        : '<b class="text-[#0c1d37]">Kuas aktif: ' + escapeHtml(jadwalKuas_ || 'Hapus') + '</b> &middot; klik lagi atau Esc untuk melepas') +
                '</span>';
        }

        function pilihKuasJadwal_(k) {
            jadwalKuas_ = (jadwalKuas_ === k) ? null : k;
            tutupPilihKodeJadwal_();
            gambarKuasJadwal_();
        }

        function pakaiKuasTeksJadwal_() {
            const el = document.getElementById('jadwal-kuas-teks');
            const v = kodeBakuJadwal_(el && el.value);
            if (!v) { showToast('Tulis dulu teksnya, mis. CUTI SAKIT.'); return; }
            jadwalKuas_ = v;
            gambarKuasJadwal_();
        }

        function gambarLegendaJadwal_() {
            const leg = document.getElementById('jadwal-legenda');
            if (!leg) return;
            const lain = {};
            jadwalBaris_.forEach(function (r) {
                [r.kode, r.realisasi].forEach(function (o) {
                    Object.keys(o || {}).forEach(function (k) { const v = o[k]; if (v && !kodeAdalahBakuJadwal_(v)) lain[v] = 1; });
                });
            });
            const chip = function (k, label, kelas) {
                return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[9px] font-black ' + kelas + '">' +
                    escapeHtml(k) + (label ? '<span class="font-bold opacity-70">' + escapeHtml(label) + '</span>' : '') + '</span>';
            };
            let html = Object.keys(jadwalKode_).map(function (k) { return chip(k, jadwalKode_[k], warnaKodeJadwal_(k)); }).join('') +
                Object.keys(lain).slice(0, 6).map(function (k) { return chip(singkatKodeJadwal_(k), k.length > 4 ? k : '', 'bg-rose-100 text-rose-700'); }).join('');
            if (jadwalMode_ === 'real') {
                html += '<span class="w-px h-4 bg-slate-300 mx-1"></span>' +
                    '<span class="inline-flex items-center gap-1 text-[9px] font-bold text-slate-500"><span class="w-4 h-3 rounded-sm bg-slate-200 shadow-[inset_0_-3px_0_0_rgba(14,165,233,0.95)]"></span>otomatis</span>' +
                    '<span class="inline-flex items-center gap-1 text-[9px] font-bold text-slate-500"><span class="w-4 h-3 rounded-sm ring-2 ring-inset ring-red-500"></span>beda</span>' +
                    '<span class="inline-flex items-center gap-1 text-[9px] font-bold text-slate-500"><span class="w-4 h-3 rounded-sm border border-dashed border-slate-400"></span>belum ada</span>';
            }
            leg.innerHTML = html;

            const ringkas = document.getElementById('jadwal-ringkas');
            if (ringkas) {
                const petugas = jadwalBaris_.filter(adalahPetugasJadwal_).length;
                ringkas.innerHTML = '<span class="font-bold text-slate-800">' + petugas + '</span> petugas &middot; ' +
                    jumlahHariBulanJadwal_(jadwalBulanDimuat_) + ' hari &middot; ' + escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) +
                    (jadwalBerubah_ ? ' &middot; <b class="text-amber-700">belum disimpan</b>' : '');
            }
        }

        function gambarKartuJadwal_() {
            const wadah = document.getElementById('jadwal-kartu');
            if (!wadah) return;
            const petugas = jadwalBaris_.filter(adalahPetugasJadwal_);
            const grup = jadwalBaris_.length - petugas.length;
            const hitung = { DP41: 0, DS52: 0, DM4: 0 };
            petugas.forEach(function (r) { Object.keys(r.kode || {}).forEach(function (k) { if (hitung[r.kode[k]] !== undefined) hitung[r.kode[k]]++; }); });
            const kes = hitungKesesuaianJadwal_();
            const kartu = function (judul, nilai, sub, ikon, warna, aksi) {
                return '<div ' + (aksi ? 'onclick="' + aksi + '" role="button" ' : '') +
                    'class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex items-center gap-3 ' + (aksi ? 'cursor-pointer hover:border-[#0c1d37] hover:shadow-md transition' : '') + '">' +
                    '<div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ' + warna + '"><i class="fa-solid ' + ikon + '"></i></div>' +
                    '<div class="min-w-0"><p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">' + judul + '</p>' +
                    '<p class="text-xl font-black text-slate-800 leading-tight">' + nilai + '</p>' +
                    '<p class="text-[10px] font-bold text-slate-400 truncate">' + sub + '</p></div></div>';
            };
            wadah.innerHTML =
                kartu('Petugas', petugas.length, grup + ' grup unit', 'fa-users', 'bg-slate-100 text-[#0c1d37]') +
                kartu('Dinas Terprogram', hitung.DP41 + hitung.DS52 + hitung.DM4,
                    hitung.DP41 + ' pagi &middot; ' + hitung.DS52 + ' siang &middot; ' + hitung.DM4 + ' malam', 'fa-clipboard-list', 'bg-amber-100 text-amber-700',
                    "aturModeJadwal_('prog')") +
                kartu('Kesesuaian s.d. Hari Ini', kes.persen === null ? '-' : kes.persen + '%',
                    kes.sesuai + ' sesuai &middot; <span class="text-red-600">' + kes.beda + ' beda</span>', 'fa-scale-balanced',
                    kes.persen === null ? 'bg-slate-100 text-slate-400' : (kes.persen >= 90 ? 'bg-emerald-100 text-emerald-700' : (kes.persen >= 75 ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')),
                    "jadwalBedaSaja_=true; aturModeJadwal_('real')") +
                kartu('Belum Ada Realisasi', kes.belum, 'sel program tanpa catatan', 'fa-hourglass-half', 'bg-sky-100 text-sky-700',
                    "jadwalBedaSaja_=false; aturModeJadwal_('real')");
        }

        // ── Menyunting sel ──────────────────────────────────────────────

        function pasangPeristiwaKisiJadwal_() {
            const body = document.getElementById('jadwal-body');
            if (!body || body.getAttribute('data-siap')) return;
            body.setAttribute('data-siap', '1');
            const dariPeristiwa = function (e) {
                const td = e.target.closest ? e.target.closest('td.sel-jadwal') : null;
                if (!td) return null;
                const i = Number(td.getAttribute('data-i'));
                const awal = Number(td.getAttribute('data-d'));
                const n = Number(td.getAttribute('data-n') || 1);
                let d = awal;
                if (n > 1) {
                    const kotak = td.getBoundingClientRect();
                    d = awal + Math.min(n - 1, Math.max(0, Math.floor((e.clientX - kotak.left) / kotak.width * n)));
                }
                return { i: i, d: d, td: td };
            };
            body.addEventListener('mousedown', function (e) {
                if (e.button !== 0 || !jadwalBolehUbah_()) return;
                const p = dariPeristiwa(e);
                if (!p) return;
                if (jadwalKuas_ !== null) {
                    e.preventDefault();
                    jadwalSeret_ = true;
                    if (setelKodeJadwal_(p.i, p.d, jadwalKuas_)) sesudahUbahSelJadwal_(p.i);
                } else {
                    bukaPilihKodeJadwal_(p.i, p.d, p.td);
                }
            });
            body.addEventListener('mousemove', function (e) {
                if (!jadwalSeret_ || jadwalKuas_ === null) return;
                const p = dariPeristiwa(e);
                if (p && setelKodeJadwal_(p.i, p.d, jadwalKuas_)) sesudahUbahSelJadwal_(p.i);
            });
            document.addEventListener('mouseup', function () {
                if (jadwalSeret_) { jadwalSeret_ = false; gambarKartuJadwal_(); gambarLegendaJadwal_(); }
            });
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                tutupPilihKodeJadwal_();
                if (jadwalKuas_ !== null) { jadwalKuas_ = null; gambarKuasJadwal_(); }
            });
            document.addEventListener('mousedown', function (e) {
                const pop = document.getElementById('jadwal-popover');
                if (pop && !pop.contains(e.target) && !(e.target.closest && e.target.closest('td.sel-jadwal'))) tutupPilihKodeJadwal_();
                const menu = document.getElementById('jadwal-menu-ekspor');
                if (menu && !menu.classList.contains('hidden') && !(e.target.closest && e.target.closest('#jadwal-menu-ekspor, [onclick^="toggleMenuEksporJadwal_"]'))) menu.classList.add('hidden');
            });
            const wadah = document.getElementById('jadwal-wadah-kisi');
            if (wadah) wadah.addEventListener('scroll', tutupPilihKodeJadwal_);
        }

        /** Menulis satu kode ke tampilan aktif. @return {boolean} true bila ada yang berubah. */
        function setelKodeJadwal_(i, d, kode) {
            const r = jadwalBaris_[i];
            if (!adalahPetugasJadwal_(r)) return false;
            const k = kunciHariJadwal_(d);
            const kunci = jadwalMode_ === 'real' ? 'realisasi' : 'kode';
            r[kunci] = r[kunci] || {};
            const v = kodeBakuJadwal_(kode);
            if (v) {
                if (r[kunci][k] === v) return false;
                r[kunci][k] = v;
            } else {
                if (!Object.prototype.hasOwnProperty.call(r[kunci], k)) return false;
                delete r[kunci][k];
            }
            tandaiBerubahJadwal_();
            return true;
        }

        function sesudahUbahSelJadwal_(i) {
            perbaruiBarisJadwal_(i);
            if (!jadwalSeret_) { gambarKartuJadwal_(); gambarLegendaJadwal_(); }
        }

        function bukaPilihKodeJadwal_(i, d, td) {
            const r = jadwalBaris_[i];
            if (!r) return;
            tutupPilihKodeJadwal_();
            const s = keadaanSelJadwal_(r, d);
            const real = jadwalMode_ === 'real';
            const pop = document.createElement('div');
            pop.id = 'jadwal-popover';
            pop.className = 'fixed z-[70] w-60 bg-white rounded-2xl shadow-2xl border border-slate-200 p-3 animate-fade-in';
            const tombol = function (k) {
                return '<button type="button" onclick="pilihKodeSelJadwal_(' + i + ',' + d + ',' + escapeHtml(JSON.stringify(k)) + ')" ' +
                    'class="py-2 rounded-lg text-[10px] font-black transition hover:scale-105 ' + warnaKodeJadwal_(k) + ' ' +
                    ((real ? (r.realisasi || {}) : (r.kode || {}))[kunciHariJadwal_(d)] === k ? 'ring-2 ring-offset-1 ring-[#0c1d37]' : '') + '">' +
                    escapeHtml(k) + '</button>';
            };
            pop.innerHTML =
                '<div class="flex items-center justify-between gap-2 mb-2">' +
                    '<div class="min-w-0"><p class="text-[11px] font-black text-slate-800 truncate">' + escapeHtml(r.nama) + '</p>' +
                    '<p class="text-[9px] font-bold text-slate-400">' + NAMA_HARI_JADWAL_[hariPekanJadwal_(jadwalBulanDimuat_, d)] + ', ' + d + ' ' +
                        escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) + ' &middot; ' + (real ? 'Realisasi' : 'Program') + '</p></div>' +
                    '<button onclick="tutupPilihKodeJadwal_()" class="text-slate-300 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>' +
                '</div>' +
                (real ? '<p class="text-[10px] font-bold mb-2 px-2 py-1.5 rounded-lg ' + (s.status === 'beda' ? 'bg-red-50 text-red-700' : 'bg-slate-50 text-slate-500') + '">' +
                    'Program: <b>' + escapeHtml(s.prog || '(kosong)') + '</b>' +
                    (s.sumber === 'otomatis' ? ' &middot; tercatat otomatis: <b>' + escapeHtml(s.kode) + '</b>' : '') +
                    (s.sumber === 'digantikan' ? '<br>Dijalankan oleh ' + escapeHtml(s.ket) : '') + '</p>' : '') +
                '<div class="grid grid-cols-3 gap-1.5">' + Object.keys(jadwalKode_).map(tombol).join('') +
                    '<button type="button" onclick="pilihKodeSelJadwal_(' + i + ',' + d + ',\'\')" class="py-2 rounded-lg text-[10px] font-black bg-white border border-slate-200 text-slate-500 hover:bg-slate-50"><i class="fa-solid fa-eraser mr-1"></i>Kosong</button>' +
                '</div>' +
                '<div class="flex items-center gap-1.5 mt-2">' +
                    '<input id="jadwal-popover-teks" placeholder="Teks lain, mis. DIKLAT" onkeydown="if(event.key===\'Enter\'){pilihKodeSelJadwal_(' + i + ',' + d + ',this.value);}" ' +
                        'class="flex-1 min-w-0 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-[10px] font-bold focus:outline-none focus:ring-1 focus:ring-amber-500">' +
                    '<button type="button" onclick="pilihKodeSelJadwal_(' + i + ',' + d + ',document.getElementById(\'jadwal-popover-teks\').value)" class="px-2.5 py-1.5 bg-rose-100 text-rose-700 rounded-lg text-[10px] font-black">Pakai</button>' +
                '</div>' +
                (real && s.prog ? '<button type="button" onclick="pilihKodeSelJadwal_(' + i + ',' + d + ',' + escapeHtml(JSON.stringify(s.prog)) + ')" class="w-full mt-2 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-[10px] font-black hover:bg-emerald-100 transition"><i class="fa-solid fa-equals mr-1"></i>Samakan dengan Program (' + escapeHtml(s.prog) + ')</button>' : '');
            document.body.appendChild(pop);
            const k = td.getBoundingClientRect(), p = pop.getBoundingClientRect();
            let kiri = Math.min(window.innerWidth - p.width - 8, Math.max(8, k.left + k.width / 2 - p.width / 2));
            let atas = k.bottom + 6;
            if (atas + p.height > window.innerHeight - 8) atas = Math.max(8, k.top - p.height - 6);
            pop.style.left = kiri + 'px';
            pop.style.top = atas + 'px';
        }

        function pilihKodeSelJadwal_(i, d, kode) {
            if (setelKodeJadwal_(i, d, kode)) sesudahUbahSelJadwal_(i);

            gambarLegendaJadwal_();

            if (jenis === 'grup') {
                jadwalBaris_.push({ grup: 'UNIT BARU', nama: '', nipp: '', jabatan: '', kode: {}, realisasi: {} });

        function hapusBarisJadwal_(i) {
            const r = jadwalBaris_[i];
            if (!r) return;
            const petugas = adalahPetugasJadwal_(r);
            konfirmasi_({
                judul: petugas ? 'Hapus petugas dari jadwal?' : 'Hapus judul grup?',
                pesan: petugas
                    ? '<b>' + escapeHtml(r.nama) + '</b> beserta Program &amp; Realisasi manualnya di ' + escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) + ' akan dihapus dari kisi.'
                    : 'Judul <b>' + escapeHtml(r.grup) + '</b> dihapus. Petugas di bawahnya tetap ada &amp; ikut grup di atasnya.',
                rincian: 'Lembar datanya baru berubah setelah Anda menekan Simpan Jadwal.',

            }).then(function (ok) {

        /** Mengisi sel Realisasi yang masih kosong dengan kode Program-nya, s.d. hari ini. */
        function salinProgKeReal_() {
            const hari = jumlahHariBulanJadwal_(jadwalBulanDimuat_);
            let jumlah = 0;
            const rencana = [];
            jadwalBaris_.forEach(function (r, i) {
                if (!adalahPetugasJadwal_(r)) return;
                r._oto = otomatisBarisJadwal_(r);
                for (let d = 1; d <= hari; d++) {
                    const s = keadaanSelJadwal_(r, d, 'real');
                    if (s.lampau && s.prog && !s.kode && s.sumber !== 'digantikan') { rencana.push([i, d, s.prog]); jumlah++; }
                }
            });
            if (!jumlah) { showToast('Tidak ada sel Realisasi kosong s.d. hari ini yang bisa diisi dari Program.'); return; }
            konfirmasi_({
                judul: 'Salin Program ke Realisasi?',
                pesan: jumlah + ' sel Realisasi yang masih kosong (s.d. hari ini) akan diisi sama dengan Program-nya. ' +
                    'Sel yang sudah tercatat otomatis, sudah diisi manual, atau dinasnya dijalankan orang lain TIDAK diubah.',
                ya: 'Salin ' + jumlah + ' Sel', ikonYa: 'fa-copy', ikon: 'fa-copy', bahaya: false
            }).then(function (ok) {
                if (!ok) return;
                rencana.forEach(function (x) {
                    const r = jadwalBaris_[x[0]];
                    r.realisasi = r.realisasi || {};
                    r.realisasi[kunciHariJadwal_(x[1])] = x[2];
                });
                tandaiBerubahJadwal_();
                gambarJadwal_();
                showToast(jumlah + ' sel Realisasi diisi dari Program. Tekan Simpan Jadwal untuk menyimpannya.');
            });
        }

        // ── Menyimpan ───────────────────────────────────────────────────

        function simpanJadwal_(setelah) {
            const selesai = (typeof setelah === 'function') ? setelah : function () {};
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            if (!bulan) { showToast('Pilih bulannya lebih dulu.'); selesai(false); return; }
            if (!jadwalBolehUbah_()) { showToast('Role Anda tidak punya izin mengubah jadwal.'); selesai(false); return; }
            const btn = document.getElementById('btn-jadwal-simpan');
            const asli = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>'; }
            const kembali = function () { if (btn) { btn.disabled = false; btn.innerHTML = asli; } };
            const kirim = jadwalBaris_.map(function (r) {
                return { grup: r.grup || '', nipp: r.nipp || '', nama: r.nama || '', jabatan: r.jabatan || '', kode: r.kode || {}, realisasi: r.realisasi || {} };
            });
            google.script.run
                .withSuccessHandler(function (res) {
                    kembali();
                    if (!res || !res.success) { showToast('Gagal menyimpan jadwal: ' + ((res && res.message) || '')); selesai(false); return; }
                    tandaiBerubahJadwal_(false);
                    gambarLegendaJadwal_();
                    showToast('Jadwal ' + labelBulanJadwal_(bulan) + ' tersimpan - ' + (res.petugas !== undefined ? res.petugas : res.jumlah) + ' petugas.');
                    selesai(true);
                })
                .withFailureHandler(function (err) {
                    kembali();
                    showToast('Terjadi kesalahan saat menyimpan jadwal: ' + ((err && err.message) || ''));
                    selesai(false);
                })
                .jadwal_simpan(currentSessionToken, bulan, kirim, jadwalTtd_);
        }

        // ── Cara 1: Upload Excel ─────────────────────────────────────────

        function aturTujuanUnggahJadwal_(tujuan) {
            jadwalTujuanUnggah_ = tujuan === 'real' ? 'real' : 'prog';
            [['prog', 'jadwal-tujuan-prog'], ['real', 'jadwal-tujuan-real']].forEach(function (p) {

            });
            if (jadwalHasilBaca_ && !jadwalHasilBaca_.galat) tampilkanHasilBacaJadwal_();
        }

        function resetUnggahJadwal_() {
            jadwalHasilBaca_ = null;
            const label = document.getElementById('jadwal-label-berkas');
            if (label) label.textContent = 'Seret File Excel (.xlsx) Jadwal Dinasan ke Sini';
            const hasil = document.getElementById('jadwal-hasil-baca');
            if (hasil) { hasil.innerHTML = ''; hasil.classList.add('hidden'); }
            const btn = document.getElementById('btn-jadwal-kirim-excel');
