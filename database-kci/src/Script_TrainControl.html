        }

        function seretBerkasJadwal_(masuk) {
            const k = document.getElementById('jadwal-seret-kotak');
            if (!k) return;
            k.classList.toggle('bg-emerald-100', !!masuk);
            k.classList.toggle('border-emerald-500', !!masuk);
            k.classList.toggle('scale-[1.01]', !!masuk);
        }

        function pilihBerkasJadwal_(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            seretBerkasJadwal_(false);
            if (!file) return;
            const label = document.getElementById('jadwal-label-berkas');
            if (label) label.textContent = file.name;
            if (!/\.xlsx?$/i.test(file.name)) {
                jadwalHasilBaca_ = { galat: 'Berkas "' + file.name + '" bukan Excel. Pilih berkas .xlsx.' };
                tampilkanHasilBacaJadwal_();
                return;
            }
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat, muat ulang halaman.'); return; }
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    jadwalHasilBaca_ = uraiBerkasJadwal_(wb);
                } catch (err) {
                    console.log('uraiBerkasJadwal_ error:', err);
                    jadwalHasilBaca_ = { galat: 'Berkas tidak bisa dibaca (' + (err && err.message ? err.message : 'format tidak dikenali') + '). Pastikan formatnya .xlsx.' };
                }
                jadwalHasilBaca_.namaBerkas = file.name;
                if (!jadwalHasilBaca_.galat) jadwalHasilBaca_.bulanTujuan = jadwalHasilBaca_.bulanBerkas || jadwalBulanDimuat_ || bulanTerpilihJadwal_();
                tampilkanHasilBacaJadwal_();
            };
            reader.readAsArrayBuffer(file);
        }

        /**
         * Membaca berkas jadwal Excel apa adanya.
         *
         * Susunannya tidak baku: judul di beberapa baris pertama, baris judul
         * kolom di tengah, baris grup yang hanya berisi satu sel, keterangan
         * seperti "KONSEP GAPEKA 2026 DI BANDUNG" yang DIGABUNG (merge)
         * melintasi seluruh tanggal, & legenda jam dinas di bagian bawah.
         *
         *  - Baris judul = baris pertama yang memuat NAMA dan NIPP/NIK atau JABATAN.
         *  - Kolom tanggal dikenali dari ISINYA ("1-Sep", "1", tanggal Excel),
         *    bukan dari posisinya.
         *  - Sel gabungan mendatar di area tanggal diisikan ke SETIAP tanggal
         *    yang dicakupnya - dulu hanya tanggal pertamanya yang terbaca.
         *  - Baris yang NIPP-nya bukan angka dilewati (legenda, keterangan).
         *
         * Fungsi ini murni (tidak menyentuh layar) supaya bisa diuji terpisah.
         */
        function uraiBerkasJadwal_(wb) {
            const namaLembar = wb.SheetNames[0];
            const ws = wb.Sheets[namaLembar];
            if (!ws || !ws['!ref']) return { galat: 'Lembar pertama berkas ini kosong.' };
            const rentang = XLSX.utils.decode_range(ws['!ref']);
            const teks = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
            const mentah = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: true });
            const up = function (v) { return String(v === undefined || v === null ? '' : v).toUpperCase().replace(/\s+/g, ' ').trim(); };

            // 1. Baris judul kolom
            let iJudul = -1;
            for (let i = 0; i < teks.length && iJudul === -1; i++) {
                const r = (teks[i] || []).map(up);
                if (r.indexOf('NAMA') !== -1 && r.some(function (x) { return x.indexOf('JABATAN') === 0 || /\bNIPP?\b|\bNIK\b/.test(x); })) iJudul = i;
            }
            if (iJudul === -1) return { galat: 'Baris judul kolom tidak ditemukan. Berkas harus memuat judul NAMA beserta NIPP/NIK atau JABATAN.' };
            const judul = teks[iJudul].map(up);
            const kNama = judul.indexOf('NAMA');
            const kNipp = judul.findIndex(function (x) { return /\bNIPP?\b|\bNIK\b/.test(x); });
            const kJab = judul.findIndex(function (x) { return x.indexOf('JABATAN') === 0; });
            if (kNipp === -1) return { galat: 'Kolom NIPP / NIK tidak ditemukan di baris judul. Kolom ini wajib - dipakai mencocokkan Program dengan Realisasi.' };
            const awalHari = Math.max(kNama, kNipp, kJab) + 1;

            // 2. Kolom tanggal - dari isinya
            let bulanDariSel = '';
            const bacaHari = function (i, c) {
                const raw = (mentah[i] || [])[c];
                if (typeof raw === 'number' && raw > 20000 && raw < 80000 && XLSX.SSF && XLSX.SSF.parse_date_code) {
                    const p = XLSX.SSF.parse_date_code(raw);
                    if (p && p.d) { if (!bulanDariSel) bulanDariSel = p.y + '-' + String(p.m).padStart(2, '0'); return p.d; }
                }
                const m = String((teks[i] || [])[c] || '').trim().match(/^(\d{1,2})(?!\d)/);
                if (m) { const d = Number(m[1]); if (d >= 1 && d <= 31) return d; }
                return 0;
            };
            const kolomHari = {};
            const pakai = {};
            const kumpulkan = function (i) {
                const baris = teks[i] || [];
                for (let c = awalHari; c < baris.length; c++) {
                    if (kolomHari[c]) continue;
                    const d = bacaHari(i, c);
                    if (d && !pakai[d]) { kolomHari[c] = d; pakai[d] = true; }
                }
            };
            kumpulkan(iJudul);
            if (Object.keys(kolomHari).length < 7) kumpulkan(iJudul + 1);   // judul bertingkat
            const kolom = Object.keys(kolomHari).map(Number).sort(function (a, b) { return a - b; });
            if (!kolom.length) return { galat: 'Kolom tanggal (1, 2, 3, ...) tidak ditemukan di sebelah kanan kolom NAMA / JABATAN.' };
            const kolomPertama = kolom[0];

            // 3. Bulan berkas - dari judul, nama lembar, atau tanggal Excel
            const cariBulan = function (s) {
                const u = up(s);
                for (let b = 0; b < 12; b++) {
                    const m = u.match(new RegExp('\\b' + NAMA_BULAN_JADWAL_[b].toUpperCase() + '\\s+(\\d{4})\\b'));
                    if (m) return m[1] + '-' + String(b + 1).padStart(2, '0');
                }
                return '';
            };
            let bulanBerkas = '';
            for (let i = 0; i < iJudul && !bulanBerkas; i++) (teks[i] || []).forEach(function (v) { if (!bulanBerkas) bulanBerkas = cariBulan(v); });
            if (!bulanBerkas) bulanBerkas = cariBulan(namaLembar) || bulanDariSel;

            // 4. Sel gabungan mendatar di area tanggal
            (ws['!merges'] || []).forEach(function (m) {
                const r0 = m.s.r - rentang.s.r, r1 = m.e.r - rentang.s.r;
                const c0 = m.s.c - rentang.s.c, c1 = m.e.c - rentang.s.c;
                if (r0 <= iJudul || c1 === c0 || c0 < kolomPertama) return;
                const nilai = (teks[r0] || [])[c0];
                for (let r = r0; r <= r1; r++) {
                    teks[r] = teks[r] || [];
                    for (let c = c0; c <= c1; c++) teks[r][c] = nilai;
                }
            });

            // 5. Baris data
            const baris = [], dilewati = [];
            for (let i = iJudul + 1; i < teks.length; i++) {
                const r = teks[i] || [];
                const nama = String(r[kNama] || '').replace(/\s+/g, ' ').trim();
                const nipp = String(r[kNipp] || '').replace(/^'/, '').trim();
                if (up(nama) === 'NAMA') continue;                      // judul berulang
                if (!nama && !nipp) {
                    const depan = r.slice(0, kolomPertama).map(function (x) { return String(x || '').trim(); }).filter(Boolean);
                    const unik = depan.filter(function (x, j) { return depan.indexOf(x) === j; });
                    if (unik.length === 1 && !/^\d+$/.test(unik[0])) {
                        baris.push({ grup: unik[0], nama: '', nipp: '', jabatan: '', kode: {}, realisasi: {} });
                    }
                    continue;
                }
                // NIPP petugas selalu ANGKA; baris legenda ("DP41 | 6:00") tidak pernah.
                // Baris "CONTOH - ..." dari templat juga dilewati bila lupa dihapus.
                if (!/^\d{3,}$/.test(nipp) || !nama || /^CONTOH\b/i.test(nama)) { dilewati.push(i + rentang.s.r + 1); continue; }
                const kode = {};
                kolom.forEach(function (c) {
                    const v = kodeBakuJadwal_(r[c]);
                    if (v) kode[kunciHariJadwal_(kolomHari[c])] = v;
                });
                baris.push({ grup: '', nipp: nipp, nama: nama, jabatan: kJab >= 0 ? String(r[kJab] || '').replace(/\s+/g, ' ').trim() : '', kode: kode, realisasi: {} });
            }
            if (!baris.some(adalahPetugasJadwal_)) return { galat: 'Tidak ada baris petugas yang terbaca. Pastikan kolom NIPP berisi angka (baris "CONTOH - ..." dari templat selalu dilewati).' };
            // Judul grup tanpa satu pun anggota (mis. anggotanya baris CONTOH
            // yang dilewati) tidak ikut dibawa.
            const rapi = baris.filter(function (r, j) {
                return adalahPetugasJadwal_(r) || (j + 1 < baris.length && adalahPetugasJadwal_(baris[j + 1]));
            });
            return { baris: rapi, dilewati: dilewati, bulanBerkas: bulanBerkas, jumlahKolomHari: kolom.length, namaLembar: namaLembar };
        }

        function tampilkanHasilBacaJadwal_() {
            const wadah = document.getElementById('jadwal-hasil-baca');
            const btn = document.getElementById('btn-jadwal-kirim-excel');
            const h = jadwalHasilBaca_;
            if (!wadah) return;
            wadah.classList.remove('hidden');
            if (!h || h.galat) {
                if (btn) btn.disabled = true;
                wadah.innerHTML = '<div class="p-3.5 bg-red-50 border border-red-300 rounded-xl text-[11px] font-bold text-red-800 flex items-start gap-2">' +
                    '<i class="fa-solid fa-circle-xmark mt-0.5"></i><span>' + escapeHtml((h && h.galat) || 'Berkas tidak bisa dibaca.') + '</span></div>';
                return;
            }
            const bulan = h.bulanTujuan;
            const hari = jumlahHariBulanJadwal_(bulan);
            const petugas = h.baris.filter(adalahPetugasJadwal_);
            const grup = h.baris.length - petugas.length;

            const catatan = [];
            if (h.dilewati.length) catatan.push(h.dilewati.length + ' baris keterangan/legenda dilewati (NIPP-nya bukan angka): baris ' + h.dilewati.slice(0, 6).join(', ') + (h.dilewati.length > 6 ? ', ...' : '') + '.');
            const kurang = petugas.filter(function (r) { return Object.keys(r.kode).length < hari; });
            if (kurang.length) catatan.push(kurang.length + ' petugas harinya belum terisi penuh (' + hari + ' hari): ' + kurang.slice(0, 3).map(function (r) { return escapeHtml(r.nama); }).join(', ') + (kurang.length > 3 ? ', ...' : '') + '.');
            const asing = {};
            petugas.forEach(function (r) { Object.keys(r.kode).forEach(function (k) { if (!kodeAdalahBakuJadwal_(r.kode[k])) asing[r.kode[k]] = 1; }); });
            if (Object.keys(asing).length) catatan.push('Keterangan di luar kode baku tetap dipakai apa adanya: ' + Object.keys(asing).slice(0, 4).map(escapeHtml).join(', ') + '.');
            if (h.jumlahKolomHari < hari) catatan.push('Berkas hanya memuat ' + h.jumlahKolomHari + ' kolom tanggal, sedangkan ' + escapeHtml(labelBulanJadwal_(bulan)) + ' punya ' + hari + ' hari.');

            // Dampak terhadap jadwal yang sudah ada
            let dampak = '';
            if (jadwalTujuanUnggah_ === 'prog') {
                const ada = (bulan === jadwalBulanDimuat_) ? jadwalBaris_.filter(adalahPetugasJadwal_).length : null;
                dampak = (ada ? '<b>Program ' + escapeHtml(labelBulanJadwal_(bulan)) + ' (' + ada + ' petugas) akan DIGANTI</b> dengan isi berkas ini. ' : 'Isi berkas disimpan sebagai <b>Program ' + escapeHtml(labelBulanJadwal_(bulan)) + '</b>. ') +
                    'Realisasi yang sudah ada tetap dipertahankan (dicocokkan lewat NIPP).';
            } else {
                let cocok = 0, baru = 0;
                if (bulan === jadwalBulanDimuat_) petugas.forEach(function (r) { if (cariBarisJadwal_(r.nipp, r.nama) !== -1) cocok++; else baru++; });
                dampak = 'Isi berkas disimpan sebagai <b>Realisasi ' + escapeHtml(labelBulanJadwal_(bulan)) + '</b> (isian manual, menimpa realisasi manual sebelumnya untuk petugas yang sama). ' +
                    (bulan === jadwalBulanDimuat_ ? cocok + ' petugas cocok dengan Program' + (baru ? ', <b>' + baru + ' petugas baru</b> ditambahkan di grup "DI LUAR PROGRAM"' : '') + '.' : '');
            }

            const bedaBulan = h.bulanBerkas && jadwalBulanDimuat_ && h.bulanBerkas !== jadwalBulanDimuat_;
            const chip = function (k) {
                return '<span class="inline-flex items-center justify-center w-9 h-5 rounded text-[8px] font-black ' + warnaKodeJadwal_(k) + '" title="' + escapeHtml(k) + '">' + escapeHtml(singkatKodeJadwal_(k) || '-') + '</span>';
            };

            wadah.innerHTML =
                '<div class="p-4 border border-slate-200 rounded-2xl space-y-3 bg-white">' +
                    '<div class="flex items-center justify-between gap-2 flex-wrap">' +
                        '<p class="text-[11px] font-black text-slate-800"><i class="fa-solid fa-file-circle-check text-emerald-600 mr-1.5"></i>Hasil Baca &middot; ' + escapeHtml(h.namaBerkas || '') + '</p>' +
                        '<span class="text-[10px] font-bold text-slate-400">Lembar "' + escapeHtml(h.namaLembar || '') + '"</span>' +
                    '</div>' +
                    '<div class="grid grid-cols-3 gap-2.5">' +
                        [['Petugas', petugas.length, 'text-emerald-600'], ['Grup Unit', grup, 'text-slate-600'], ['Kolom Tanggal', h.jumlahKolomHari, 'text-sky-600']].map(function (x) {
                            return '<div class="p-2.5 rounded-xl border border-slate-200 text-center"><p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">' + x[0] + '</p>' +
                                '<p class="text-xl font-black leading-none mt-1 ' + x[2] + '">' + x[1] + '</p></div>';
                        }).join('') +
                    '</div>' +
                    (bedaBulan
                        ? '<div class="p-3 bg-sky-50 border border-sky-200 rounded-xl text-[11px] font-semibold text-sky-900 space-y-1.5">' +
                            '<p><i class="fa-solid fa-calendar-days mr-1"></i>Berkas ini untuk <b>' + escapeHtml(labelBulanJadwal_(h.bulanBerkas)) + '</b>, sedangkan yang sedang dibuka <b>' + escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) + '</b>. Simpan ke bulan:</p>' +
                            '<div class="flex gap-2 flex-wrap">' +
                                [h.bulanBerkas, jadwalBulanDimuat_].map(function (b) {
                                    return '<button type="button" onclick="jadwalHasilBaca_.bulanTujuan=' + escapeHtml(JSON.stringify(b)) + '; tampilkanHasilBacaJadwal_()" class="px-3 py-1 rounded-lg text-[10px] font-black transition ' +
                                        (bulan === b ? 'bg-sky-600 text-white' : 'bg-white border border-sky-200 text-sky-700 hover:bg-sky-100') + '">' + escapeHtml(labelBulanJadwal_(b)) + (b === h.bulanBerkas ? ' (bulan berkas)' : '') + '</button>';
                                }).join('') +
                            '</div></div>'
                        : '') +
                    (catatan.length
                        ? '<div class="p-3 bg-amber-50 border border-amber-300 rounded-xl"><p class="text-[11px] font-black text-amber-900 mb-1"><i class="fa-solid fa-circle-exclamation mr-1"></i>Perlu diperhatikan</p>' +
                          catatan.map(function (c) { return '<p class="text-[11px] font-semibold text-amber-800">&bull; ' + c + '</p>'; }).join('') + '</div>'
                        : '<p class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-[11px] font-bold text-emerald-800"><i class="fa-solid fa-circle-check mr-1"></i>Tidak ada yang janggal &mdash; seluruh baris terbaca utuh.</p>') +
                    '<p class="text-[11px] font-semibold text-slate-600 leading-relaxed">' + dampak + '</p>' +
                    '<div><p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">Cuplikan ' + Math.min(6, petugas.length) + ' petugas pertama &middot; tanggal 1-10</p>' +
                        '<div class="border border-slate-200 rounded-xl overflow-x-auto"><table class="w-full text-[10px] font-semibold">' +
                        '<tbody>' + petugas.slice(0, 6).map(function (r) {
                            let sepuluh = '';
                            for (let d = 1; d <= 10; d++) sepuluh += chip((r.kode || {})[kunciHariJadwal_(d)] || '');
                            return '<tr class="border-t border-slate-100 first:border-t-0"><td class="px-2.5 py-1.5 whitespace-nowrap"><span class="font-black text-slate-800">' + escapeHtml(r.nama) + '</span>' +
                                '<span class="font-mono text-slate-400 ml-1.5">' + escapeHtml(r.nipp) + '</span></td>' +
                                '<td class="px-2 py-1.5"><div class="flex gap-0.5">' + sepuluh + '</div></td></tr>';
                        }).join('') + '</tbody></table></div></div>' +
                '</div>';
            if (btn) btn.disabled = false;
        }

        /** Letak baris seorang petugas di kisi - NIPP dulu, lalu nama. */
        function cariBarisJadwal_(nipp, nama, kecuali) {
            const n = nippBakuJadwal_(nipp), nm = namaBakuJadwal_(nama);
            let i = n ? jadwalBaris_.findIndex(function (r, j) { return j !== kecuali && adalahPetugasJadwal_(r) && nippBakuJadwal_(r.nipp) === n; }) : -1;
            if (i === -1 && nm) i = jadwalBaris_.findIndex(function (r, j) { return j !== kecuali && adalahPetugasJadwal_(r) && namaBakuJadwal_(r.nama) === nm; });
            return i;
        }

        function kirimUnggahJadwal_() {
            const h = jadwalHasilBaca_;
            if (!h || h.galat) return;
            const bulan = h.bulanTujuan;
            const btn = document.getElementById('btn-jadwal-kirim-excel');
            const asli = btn ? btn.innerHTML : '';
            const kembali = function () { if (btn) { btn.disabled = false; btn.innerHTML = asli; } };

            const terapkan = function () {
                if (jadwalTujuanUnggah_ === 'prog') {
                    // Realisasi manual yang sudah ada dibawa ke baris barunya.
                    const lama = jadwalBaris_.filter(adalahPetugasJadwal_);
                    jadwalBaris_ = h.baris.map(function (r) {
                        const salin = Object.assign({}, r, { kode: Object.assign({}, r.kode), realisasi: {} });
                        if (!adalahPetugasJadwal_(r)) return salin;
                        const n = nippBakuJadwal_(r.nipp), nm = namaBakuJadwal_(r.nama);
                        const pasangan = lama.find(function (x) { return n && nippBakuJadwal_(x.nipp) === n; }) ||
                            lama.find(function (x) { return namaBakuJadwal_(x.nama) === nm; });
                        if (pasangan) salin.realisasi = Object.assign({}, pasangan.realisasi || {});
                        return salin;
                    });
                } else {
                    const baru = [];
                    h.baris.filter(adalahPetugasJadwal_).forEach(function (r) {
                        const j = cariBarisJadwal_(r.nipp, r.nama);
                        if (j !== -1) jadwalBaris_[j].realisasi = Object.assign({}, r.kode);
                        else baru.push({ grup: '', nipp: r.nipp, nama: r.nama, jabatan: r.jabatan, kode: {}, realisasi: Object.assign({}, r.kode) });
                    });
                    if (baru.length) {
                        const adaGrup = jadwalBaris_.some(function (r) { return !adalahPetugasJadwal_(r) && namaBakuJadwal_(r.grup) === 'DI LUAR PROGRAM'; });
                        if (!adaGrup) jadwalBaris_.push({ grup: 'DI LUAR PROGRAM', nama: '', nipp: '', jabatan: '', kode: {}, realisasi: {} });
                        jadwalBaris_ = jadwalBaris_.concat(baru);
                    }
                }
                tandaiBerubahJadwal_();
                jadwalMode_ = jadwalTujuanUnggah_;
                gambarJadwal_();
                if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>'; }
                simpanJadwal_(function (ok) {
                    kembali();
                    if (ok) tutupInputJadwal_();
                });
            };

            if (bulan === jadwalBulanDimuat_) { terapkan(); return; }
            const lanjut = function () {
                if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Memuat ' + escapeHtml(labelBulanJadwal_(bulan)) + '...</span>'; }
                muatJadwal_(bulan, function () { kembali(); terapkan(); });
            };
            if (!jadwalBerubah_) { lanjut(); return; }
            konfirmasi_({
                judul: 'Buang perubahan yang belum disimpan?',
                pesan: 'Berkas akan disimpan ke ' + escapeHtml(labelBulanJadwal_(bulan)) + '. Perubahan di ' + escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) + ' yang belum disimpan akan dibuang.',
                ya: 'Lanjutkan', ikon: 'fa-calendar-xmark'
            }).then(function (ok) { if (ok) { tandaiBerubahJadwal_(false); lanjut(); } });
        }

        /**
         * Templat kosong yang susunannya SAMA dengan yang dibaca pengunggah -
         * judul, baris judul kolom, baris grup, contoh petugas, & legenda.
         */
        function unduhTemplatJadwal_() {
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat.'); return; }
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            const hari = jumlahHariBulanJadwal_(bulan);
            const kepala = ['NO', 'NIPP / NIK', 'NAMA', 'JABATAN'];
            const namaHari = ['', '', '', ''];
            for (let d = 1; d <= hari; d++) {
                kepala.push(String(d));
                namaHari.push(['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][hariPekanJadwal_(bulan, d)]);
            }
            const contoh = function (no, nipp, nama, jab, pola, geser) {
                const b = [no, nipp, nama, jab];
                for (let d = 1; d <= hari; d++) b.push(pola(d, geser));
                return b;
            };
            const rotasi = function (d, g) { return ['DS52', 'DP41', 'L', 'DM4'][(d - 1 + g) % 4]; };
            const kantor = function (d) { const w = hariPekanJadwal_(bulan, d); return (w === 0 || w === 6) ? 'L' : 'N'; };
            const isi = [
                ['JADWAL KERJA TRAIN PLANNING MONITORING & EVALUATION DEPARTMENT'],
                ['PROGRAM BULAN ' + labelBulanJadwal_(bulan).toUpperCase()],
                [],
                kepala, namaHari,
                ['KANTOR OPERASI DEPOK'],
                contoh(1, '12345', 'CONTOH - PETUGAS KANTOR', 'Train Traffic Planning Specialist', kantor, 0),
                [],
                ['OCC MANGGARAI'],
                contoh(2, '51820', 'CONTOH - PETUGAS SHIFT A', 'Train Traffic Control Technical Junior Specialist', rotasi, 0),
                contoh(3, '51814', 'CONTOH - PETUGAS SHIFT B', 'Train Traffic Control Technical Junior Specialist', rotasi, 1),
                [],
                ['', '', 'KETERANGAN KODE'],
                ['', '', 'DP41', 'Dinas Pagi', '06:00 - 14:00'],
                ['', '', 'DS52', 'Dinas Siang', '14:00 - 22:00'],
                ['', '', 'DM4', 'Dinas Malam', '22:00 - 06:00 (dicatat pada tanggal mulainya)'],
                ['', '', 'N', 'Normal / kantor'],
                ['', '', 'L', 'Libur'],
                [],
                ['', '', 'PETUNJUK: hapus baris CONTOH; NIPP wajib angka; keterangan lain (CUTI SAKIT, DIKLAT) boleh ditulis apa adanya atau digabung (merge) melintasi beberapa tanggal.']
            ];
            const ws = XLSX.utils.aoa_to_sheet(isi);
            ws['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 30 }, { wch: 42 }].concat(Array.from({ length: hari }, function () { return { wch: 6 }; }));
            ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 + hari } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 3 + hari } }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, labelBulanJadwal_(bulan).toUpperCase().slice(0, 31));
            XLSX.writeFile(wb, 'Template_Jadwal_Dinasan_' + bulan + '.xlsx');
            showToast('Template jadwal ' + labelBulanJadwal_(bulan) + ' diunduh. Hapus baris CONTOH sebelum mengunggahnya.');
        }

        // ── Cara 2: Input Manual ─────────────────────────────────────────

        const POLA_JADWAL_ = {
            rotasi: { label: 'Rotasi Shift', ikon: 'fa-arrows-rotate', urutan: ['DS52', 'DP41', 'L', 'DM4'] },
            kantor: { label: 'Kantor', ikon: 'fa-building', urutan: [] },
            kustom: { label: 'Kustom', ikon: 'fa-sliders', urutan: [] },
            kosong: { label: 'Kosong', ikon: 'fa-square', urutan: [] }
        };

        function resetManualJadwal_(pertahankanGrup) {
            const grup = pertahankanGrup ? (document.getElementById('jm-grup') || {}).value : '';
            ['jm-indeks', 'jm-nipp', 'jm-nama', 'jm-jabatan', 'jm-ket-teks'].forEach(function (id) { const el = document.getElementById(id); if (el) el.value = ''; });
            const g = document.getElementById('jm-grup');
            if (g) g.value = grup || '';
            const p = document.getElementById('jm-pilih-pegawai');
            if (p) p.value = '';
            if (!pertahankanGrup) jadwalPola_ = { jenis: 'rotasi', urutan: POLA_JADWAL_.rotasi.urutan.slice(), mulai: 0 };
            jadwalPolaUbah_ = {};
            const dl = document.getElementById('jm-grup-daftar');
            if (dl) dl.innerHTML = jadwalBaris_.filter(function (r) { return !adalahPetugasJadwal_(r) && r.grup; })
                .map(function (r) { return '<option value="' + escapeHtml(r.grup) + '"></option>'; }).join('');
            isiPilihTanggalKetJadwal_();
            const w = document.getElementById('jm-peringatan');
            if (w) w.classList.add('hidden');
            const b = document.getElementById('btn-jm-simpan');
            if (b) b.innerHTML = '<i class="fa-solid fa-check text-[#d4af37]"></i><span>Simpan ke Jadwal</span>';
            const lanjut = document.getElementById('btn-jm-lanjut');
            if (lanjut) lanjut.classList.remove('hidden');
            gambarPilihanPolaJadwal_();
        }

        function isiPilihTanggalKetJadwal_() {
            const hari = jumlahHariBulanJadwal_(jadwalBulanDimuat_);
            ['jm-ket-dari', 'jm-ket-sampai'].forEach(function (id, j) {
                const el = document.getElementById(id);
                if (!el) return;
                let o = '';
                for (let d = 1; d <= hari; d++) o += '<option value="' + d + '"' + ((j === 0 ? d === 1 : d === hari) ? ' selected' : '') + '>' + d + '</option>';
                el.innerHTML = o;
            });
        }

        function isiManualDariBarisJadwal_(i) {
            const r = jadwalBaris_[i];
            document.getElementById('jm-indeks').value = String(i);
            document.getElementById('jm-nipp').value = r.nipp || '';
            document.getElementById('jm-nama').value = r.nama || '';
            document.getElementById('jm-jabatan').value = r.jabatan || '';
            let grup = '';
            for (let x = i - 1; x >= 0; x--) if (!adalahPetugasJadwal_(jadwalBaris_[x])) { grup = jadwalBaris_[x].grup || ''; break; }
            document.getElementById('jm-grup').value = grup;
            // Jadwal yang sudah ada dipertahankan persis - pola baru hanya
            // diterapkan bila pengguna memilihnya sendiri.
            jadwalPola_ = { jenis: 'saatini', urutan: [], mulai: 0, dasar: Object.assign({}, r.kode || {}) };
            jadwalPolaUbah_ = {};
            document.getElementById('btn-jm-simpan').innerHTML = '<i class="fa-solid fa-check text-[#d4af37]"></i><span>Simpan Perubahan</span>';
            document.getElementById('btn-jm-lanjut').classList.add('hidden');
            gambarPilihanPolaJadwal_();
        }

        function isiPilihPegawaiJadwal_() {
            const sel = document.getElementById('jm-pilih-pegawai');
            if (!sel) return;
            const daftar = (personilStruktur_ || []).filter(function (p) { return p && p.nama; })
                .slice().sort(function (a, b) { return String(a.nama).localeCompare(String(b.nama)); });
            sel.innerHTML = '<option value="">' + (daftar.length ? '- Pilih pegawai, NIPP &amp; jabatan terisi sendiri -' : '- Daftar Struktur Organisasi kosong -') + '</option>' +
                daftar.map(function (p) {
                    return '<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.nama) + (p.nik ? ' (' + escapeHtml(p.nik) + ')' : '') + '</option>';
                }).join('');
        }

        function pilihPegawaiJadwal_(id) {
            const p = (personilStruktur_ || []).find(function (x) { return String(x.id) === String(id); });
            if (!p) return;
            document.getElementById('jm-nipp').value = p.nik || '';
            document.getElementById('jm-nama').value = String(p.nama || '').toUpperCase();
            document.getElementById('jm-jabatan').value = p.jabatan || '';
            cekNippManualJadwal_();
        }

        /** Petugas yang sudah ada di kisi tidak digandakan - pola barunya menimpa yang lama. */
        function cekNippManualJadwal_() {
            const w = document.getElementById('jm-peringatan');
            if (!w) return;
            const indeks = document.getElementById('jm-indeks').value;
            const kecuali = indeks === '' ? -1 : Number(indeks);
            const j = cariBarisJadwal_(document.getElementById('jm-nipp').value, document.getElementById('jm-nama').value, kecuali);
            if (j === -1) { w.classList.add('hidden'); return; }
            w.classList.remove('hidden');
            w.innerHTML = '<i class="fa-solid fa-user-check mr-1"></i><b>' + escapeHtml(jadwalBaris_[j].nama) + '</b> sudah ada di jadwal ' +
                escapeHtml(labelBulanJadwal_(jadwalBulanDimuat_)) + '. Menyimpan akan <b>memperbarui</b> baris tersebut, bukan menambah baris baru.';
        }

        function gambarPilihanPolaJadwal_() {
            const wadah = document.getElementById('jm-pola-pilih');
            if (!wadah) return;
            const jenis = Object.keys(POLA_JADWAL_);
            if (jadwalPola_.jenis === 'saatini') jenis.unshift('saatini');
            wadah.innerHTML = jenis.map(function (k) {
                const p = k === 'saatini' ? { label: 'Jadwal saat ini', ikon: 'fa-user-clock' } : POLA_JADWAL_[k];
                const on = jadwalPola_.jenis === k;
                return '<button type="button" onclick="aturPolaJadwal_(\'' + k + '\')" class="px-2.5 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1.5 transition ' +
                    (on ? 'bg-[#0c1d37] text-white shadow' : 'bg-slate-100 text-slate-500 hover:bg-slate-200') + '"><i class="fa-solid ' + p.ikon + '"></i>' + p.label + '</button>';
            }).join('');

            const atur = document.getElementById('jm-pola-atur');
            if (!atur) return;
            const chip = function (k, aksi, kecil) {
                return '<button type="button" onclick="' + aksi + '" class="' + (kecil ? 'px-2 py-1' : 'px-2.5 py-1.5') + ' rounded-lg text-[10px] font-black transition hover:scale-105 ' + warnaKodeJadwal_(k) + '">' + escapeHtml(k) + '</button>';
            };
            if (jadwalPola_.jenis === 'rotasi' || jadwalPola_.jenis === 'kustom') {
                const urutan = jadwalPola_.urutan;
                atur.innerHTML =
                    '<div class="flex items-center gap-1.5 flex-wrap">' +
                        '<span class="text-[10px] font-bold text-slate-500 w-20">Urutan</span>' +
                        (urutan.length
                            ? urutan.map(function (k, j) {
                                return '<span class="inline-flex items-center gap-0.5">' + chip(k, 'hapusKodePolaJadwal_(' + j + ')', true) +
                                    (j < urutan.length - 1 ? '<i class="fa-solid fa-chevron-right text-[8px] text-slate-300 mx-0.5"></i>' : '') + '</span>';
                              }).join('') + '<i class="fa-solid fa-rotate-left text-[9px] text-slate-300 ml-1" title="Lalu berulang dari awal"></i>'
                            : '<span class="text-[10px] italic text-slate-400">klik kode di bawah untuk menyusun urutan</span>') +
                    '</div>' +
                    '<div class="flex items-center gap-1.5 flex-wrap">' +
                        '<span class="text-[10px] font-bold text-slate-500 w-20">Tambah</span>' +
                        Object.keys(jadwalKode_).map(function (k) { return chip(k, 'tambahKodePolaJadwal_(' + escapeHtml(JSON.stringify(k)) + ')', true); }).join('') +
                        (urutan.length ? '<button type="button" onclick="jadwalPola_.urutan=[]; jadwalPola_.mulai=0; jadwalPola_.jenis=\'kustom\'; gambarPilihanPolaJadwal_()" class="px-2 py-1 rounded-lg text-[10px] font-bold text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash-can mr-1"></i>Kosongkan</button>' : '') +
                    '</div>' +
                    (urutan.length
                        ? '<div class="flex items-center gap-1.5 flex-wrap">' +
                            '<span class="text-[10px] font-bold text-slate-500 w-20">Tanggal 1 =</span>' +
                            urutan.map(function (k, j) {
                                const on = jadwalPola_.mulai === j;
                                return '<button type="button" onclick="jadwalPola_.mulai=' + j + '; gambarPilihanPolaJadwal_()" class="px-2 py-1 rounded-lg text-[10px] font-black border transition ' +
                                    (on ? 'border-[#0c1d37] bg-[#0c1d37] text-white' : 'border-slate-200 text-slate-500 hover:border-slate-400') + '">' + (j + 1) + '. ' + escapeHtml(k) + '</button>';
                            }).join('') +
                          '</div>'
                        : '');
            } else if (jadwalPola_.jenis === 'kantor') {
                atur.innerHTML = '<p class="text-[10px] font-semibold text-slate-500"><b class="text-slate-700">N</b> Senin s.d. Jumat, <b class="text-slate-700">L</b> Sabtu &amp; Minggu. Libur nasional bisa diganti per tanggal di pratinjau.</p>';
            } else if (jadwalPola_.jenis === 'saatini') {
                atur.innerHTML = '<p class="text-[10px] font-semibold text-slate-500">Jadwal petugas ini dipertahankan apa adanya. Pilih pola lain untuk menyusun ulang sebulan penuh.</p>';
            } else {
                atur.innerHTML = '<p class="text-[10px] font-semibold text-slate-500">Tanpa pola - isi per tanggal lewat pratinjau di bawah, atau langsung di kisi setelah disimpan.</p>';
            }
            pratinjauPolaJadwal_();
        }

        function aturPolaJadwal_(jenis) {
            if (jenis === 'saatini') return;
            jadwalPola_ = { jenis: jenis, urutan: (POLA_JADWAL_[jenis].urutan || []).slice(), mulai: 0 };
            jadwalPolaUbah_ = {};
            gambarPilihanPolaJadwal_();
        }
        function tambahKodePolaJadwal_(k) {
            if (jadwalPola_.jenis !== 'kustom') jadwalPola_.jenis = 'kustom';
            jadwalPola_.urutan.push(k);
            jadwalPolaUbah_ = {};
            gambarPilihanPolaJadwal_();
        }
        function hapusKodePolaJadwal_(j) {
            jadwalPola_.jenis = 'kustom';
            jadwalPola_.urutan.splice(j, 1);
            if (jadwalPola_.mulai >= jadwalPola_.urutan.length) jadwalPola_.mulai = 0;
            jadwalPolaUbah_ = {};
            gambarPilihanPolaJadwal_();
        }

        /** Kode sebulan hasil pola + keterangan khusus + koreksi per tanggal. */
        function polaManualJadwal_() {
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            const hari = jumlahHariBulanJadwal_(bulan);
            // Urutan penerapan: dasar (pola / jadwal saat ini) -> keterangan
            // khusus -> klik per tanggal di pratinjau (paling akhir, paling kuat).
            const kode = jadwalPola_.jenis === 'saatini' ? Object.assign({}, jadwalPola_.dasar || {}) : {};
            for (let d = 1; d <= hari; d++) {
                let v = '';
                if ((jadwalPola_.jenis === 'rotasi' || jadwalPola_.jenis === 'kustom') && jadwalPola_.urutan.length) {
                    v = jadwalPola_.urutan[(d - 1 + jadwalPola_.mulai) % jadwalPola_.urutan.length];
                } else if (jadwalPola_.jenis === 'kantor') {
                    const w = hariPekanJadwal_(bulan, d);
                    v = (w === 0 || w === 6) ? 'L' : 'N';
                }
                if (v) kode[kunciHariJadwal_(d)] = v;
            }
            const ket = kodeBakuJadwal_((document.getElementById('jm-ket-teks') || {}).value);
            if (ket) {
                const a = Number((document.getElementById('jm-ket-dari') || {}).value) || 1;
                const b = Number((document.getElementById('jm-ket-sampai') || {}).value) || hari;
                for (let d = Math.min(a, b); d <= Math.max(a, b); d++) kode[kunciHariJadwal_(d)] = ket;
            }
            Object.keys(jadwalPolaUbah_).forEach(function (k) {
                if (jadwalPolaUbah_[k]) kode[k] = jadwalPolaUbah_[k]; else delete kode[k];
            });
            return kode;
        }

        function pratinjauPolaJadwal_() {
            const wadah = document.getElementById('jm-pratinjau');
            if (!wadah) return;
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            const hari = jumlahHariBulanJadwal_(bulan);
            const kode = polaManualJadwal_();
            const kosongAwal = (hariPekanJadwal_(bulan, 1) + 6) % 7;      // kalender mulai Senin
            let html = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(function (h, j) {
                return '<div class="text-center text-[9px] font-black uppercase ' + (j >= 5 ? 'text-red-400' : 'text-slate-400') + '">' + h + '</div>';
            }).join('');
            for (let x = 0; x < kosongAwal; x++) html += '<div></div>';
            const hitung = {};
            for (let d = 1; d <= hari; d++) {
                const k = kode[kunciHariJadwal_(d)] || '';
                if (k) hitung[k] = (hitung[k] || 0) + 1;
                const w = hariPekanJadwal_(bulan, d);
                html += '<button type="button" onclick="putarKodePratinjauJadwal_(' + d + ')" title="Klik untuk mengganti kode tanggal ' + d + '" ' +
                    'class="rounded-lg border p-1 text-left transition hover:border-[#0c1d37] ' + ((w === 0 || w === 6) ? 'border-red-100 bg-red-50/40' : 'border-slate-200 bg-white') + '">' +
                    '<span class="block text-[9px] font-bold ' + ((w === 0 || w === 6) ? 'text-red-400' : 'text-slate-400') + '">' + d + '</span>' +
                    '<span class="mt-0.5 h-5 rounded flex items-center justify-center text-[9px] font-black ' + (k ? warnaKodeJadwal_(k) : 'bg-slate-50 text-slate-300') + '">' +
                        (k ? escapeHtml(singkatKodeJadwal_(k)) : '&middot;') + '</span></button>';
            }
            wadah.innerHTML = html;
            const r = document.getElementById('jm-ringkas');
            if (r) r.innerHTML = Object.keys(hitung).map(function (k) { return escapeHtml(singkatKodeJadwal_(k)) + ' ' + hitung[k]; }).join(' &middot; ') || 'belum ada kode';
        }

        /** Klik tanggal di pratinjau: kode berganti bergiliran - kode baku, lalu kosong. */
        function putarKodePratinjauJadwal_(d) {
            const k = kunciHariJadwal_(d);
            const kini = polaManualJadwal_()[k] || '';
            const daftar = Object.keys(jadwalKode_).concat(['']);
            const j = daftar.indexOf(kini);
            jadwalPolaUbah_[k] = daftar[(j + 1) % daftar.length];
            pratinjauPolaJadwal_();
        }

        function simpanManualJadwal_(lanjut) {
            const nipp = String(document.getElementById('jm-nipp').value || '').trim();
            const nama = String(document.getElementById('jm-nama').value || '').replace(/\s+/g, ' ').trim();
            const jabatan = String(document.getElementById('jm-jabatan').value || '').trim();
            const grup = String(document.getElementById('jm-grup').value || '').replace(/\s+/g, ' ').trim().toUpperCase();
            if (!nama) { showToast('Nama petugas wajib diisi.'); document.getElementById('jm-nama').focus(); return; }
            if (!/^\d{3,}$/.test(nipp)) { showToast('NIPP / NIK wajib berupa angka (min. 3 digit) - dipakai mencocokkan Realisasi.'); document.getElementById('jm-nipp').focus(); return; }

            const indeksTeks = document.getElementById('jm-indeks').value;
            let indeks = indeksTeks === '' ? -1 : Number(indeksTeks);
            if (indeks !== -1) {
                // Menyunting: NIPP baru tidak boleh milik petugas LAIN - dua
                // baris ber-NIPP sama membuat Realisasi tidak tahu milik siapa.
                const lain = jadwalBaris_.findIndex(function (r, j) {
                    return j !== indeks && adalahPetugasJadwal_(r) && nippBakuJadwal_(r.nipp) === nippBakuJadwal_(nipp);
                });
                if (lain !== -1) { showToast('NIPP ' + nipp + ' sudah dipakai ' + jadwalBaris_[lain].nama + ' di jadwal ini.'); document.getElementById('jm-nipp').focus(); return; }
            } else {
                indeks = cariBarisJadwal_(nipp, nama);
            }
            const kode = polaManualJadwal_();
            const lama = indeks !== -1 ? jadwalBaris_[indeks] : null;
            const baris = { grup: '', nipp: nipp, nama: nama, jabatan: jabatan, kode: kode, realisasi: lama ? (lama.realisasi || {}) : {} };

            // Grup lama petugas ini (kalau sedang diperbarui)
            let grupLama = '';
            if (indeks !== -1) for (let x = indeks - 1; x >= 0; x--) if (!adalahPetugasJadwal_(jadwalBaris_[x])) { grupLama = jadwalBaris_[x].grup || ''; break; }

            if (indeks !== -1 && namaBakuJadwal_(grupLama) === namaBakuJadwal_(grup)) {
                jadwalBaris_[indeks] = baris;                     // tetap di tempatnya
            } else {
                if (indeks !== -1) jadwalBaris_.splice(indeks, 1);
                sisipkanKeGrupJadwal_(baris, grup);
            }
            tandaiBerubahJadwal_();
            gambarJadwal_();

            const btn = document.getElementById(lanjut ? 'btn-jm-lanjut' : 'btn-jm-simpan');
            const asli = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>';
            simpanJadwal_(function (ok) {
                btn.disabled = false;
                btn.innerHTML = asli;
                if (!ok) return;
                if (lanjut) {
                    resetManualJadwal_(true);
                    pratinjauPolaJadwal_();
                    document.getElementById('jm-nipp').focus();
                } else {
                    tutupInputJadwal_();
                }
            });
        }

        /** Menaruh petugas di akhir grupnya; grup baru dibuat di ujung kisi bila belum ada. */
        function sisipkanKeGrupJadwal_(baris, grup) {
            if (!grup) { jadwalBaris_.push(baris); return; }
            const g = jadwalBaris_.findIndex(function (r) { return !adalahPetugasJadwal_(r) && namaBakuJadwal_(r.grup) === namaBakuJadwal_(grup); });
            if (g === -1) {
                jadwalBaris_.push({ grup: grup, nama: '', nipp: '', jabatan: '', kode: {}, realisasi: {} });
                jadwalBaris_.push(baris);
                return;
            }
            let akhir = g + 1;
            while (akhir < jadwalBaris_.length && adalahPetugasJadwal_(jadwalBaris_[akhir])) akhir++;
            jadwalBaris_.splice(akhir, 0, baris);
        }

        // ── EKSPOR ──────────────────────────────────────────────────────

        function toggleMenuEksporJadwal_() {
            const m = document.getElementById('jadwal-menu-ekspor');
            if (m) m.classList.toggle('hidden');
        }

        function pilihEksporJadwal_(jenis) {
            const m = document.getElementById('jadwal-menu-ekspor');
            if (m) m.classList.add('hidden');
            if (jenis === 'pdf') cetakJadwal_(); else exportJadwal_();
        }

        /** Kode Realisasi yang BERLAKU (manual / otomatis / simpulan) untuk satu sel. */
        function kodeRealJadwal_(r, d) { return keadaanSelJadwal_(r, d, 'real').kode || ''; }

        function exportJadwal_() {
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat.'); return; }
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            const hari = jumlahHariBulanJadwal_(bulan);
            jadwalBaris_.forEach(function (r) { if (adalahPetugasJadwal_(r)) r._oto = otomatisBarisJadwal_(r); });

            const lembar = function (judul, ambil, ekor) {
                const kepala = ['NO', 'NIPP / NIK', 'NAMA', 'JABATAN'];
                const namaHari = ['', '', '', ''];
                for (let d = 1; d <= hari; d++) {
                    kepala.push(String(d));
                    namaHari.push(NAMA_HARI_JADWAL_[hariPekanJadwal_(bulan, d)]);
                }
                if (ekor) kepala.push(ekor);
                const isi = [];
                let no = 0;
                jadwalBaris_.forEach(function (r) {
                    if (!adalahPetugasJadwal_(r)) { isi.push([String(r.grup || '')]); return; }
                    no++;
                    const b = [no, r.nipp || '', r.nama || '', r.jabatan || ''];
                    for (let d = 1; d <= hari; d++) b.push(ambil(r, d));
                    if (ekor) b.push(ekor === 'SESUAI' ? (function () {
                        let s = 0, n = 0;
                        for (let d = 1; d <= hari; d++) { const st = keadaanSelJadwal_(r, d, 'real').status; if (st === 'sesuai') { s++; n++; } else if (st === 'beda') n++; }
                        return n ? Math.round(s / n * 100) + '% (' + s + '/' + n + ')' : '-';
                    })() : '');
                    isi.push(b);
                });
                const atas = [['JADWAL KERJA TRAIN PLANNING MONITORING & EVALUATION DEPARTMENT'], [judul + ' BULAN ' + labelBulanJadwal_(bulan).toUpperCase()], []];
                const ttd = jadwalTtd_.filter(function (t) { return t.nama; }).map(function (t) { return ['', t.peran || '', t.nama || '', 'NIPP ' + (t.nipp || '-'), t.jabatan || '']; });
                const ws = XLSX.utils.aoa_to_sheet(atas.concat([kepala, namaHari]).concat(isi).concat(ttd.length ? [[], ['', 'PENGESAHAN']].concat(ttd) : []));
                ws['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 30 }, { wch: 40 }].concat(Array.from({ length: hari }, function () { return { wch: 6 }; })).concat(ekor ? [{ wch: 14 }] : []);
                return ws;
            };

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, lembar('PROGRAM', function (r, d) { return (r.kode || {})[kunciHariJadwal_(d)] || ''; }), 'Program');
            XLSX.utils.book_append_sheet(wb, lembar('REALISASI', kodeRealJadwal_, 'SESUAI'), 'Realisasi');
            XLSX.writeFile(wb, 'Jadwal_Dinasan_' + bulan + '.xlsx');
            showToast('Jadwal ' + labelBulanJadwal_(bulan) + ' diunduh (lembar Program & Realisasi).');
        }

        function cetakJadwal_() {
            const bulan = jadwalBulanDimuat_ || bulanTerpilihJadwal_();
            const hari = jumlahHariBulanJadwal_(bulan);
            const real = jadwalMode_ === 'real';
            jadwalBaris_.forEach(function (r) { if (adalahPetugasJadwal_(r)) r._oto = otomatisBarisJadwal_(r); });

            let kepala = '<tr><th>NO</th><th>NIPP</th><th style="text-align:left">NAMA</th><th style="text-align:left">JABATAN</th>';
            for (let d = 1; d <= hari; d++) {
                const w = hariPekanJadwal_(bulan, d);
                kepala += '<th' + ((w === 0 || w === 6) ? ' style="background:#334155"' : '') + '>' + d + '<br>' + NAMA_HARI_JADWAL_[w] + '</th>';
            }
            kepala += (real ? '<th>SESUAI</th>' : '<th>&Sigma;</th>') + '</tr>';

            let no = 0;
            const isi = jadwalBaris_.map(function (r) {
                if (!adalahPetugasJadwal_(r)) {
                    return '<tr><td colspan="' + (hari + 5) + '" style="background:#e2e8f0;font-weight:bold;text-align:left">' + escapeHtml(r.grup || '') + '</td></tr>';
                }
                no++;
                let sel = '', s = 0, n = 0, dinas = 0;
                for (let d = 1; d <= hari; d++) {
                    const st = keadaanSelJadwal_(r, d, real ? 'real' : 'prog');
                    const k = st.kode;
                    if (JADWAL_SHIFT_.indexOf(k) !== -1) dinas++;
                    if (st.status === 'sesuai') { s++; n++; } else if (st.status === 'beda') n++;
                    const latar = JADWAL_WARNA_CETAK_[k] || (k ? '#ffe4e6' : '');
                    const gaya = (latar ? 'background:' + latar + ';' : '') + (k === 'DM4' ? 'color:#fff;' : '') +
                        (st.status === 'beda' ? 'outline:1.5px solid #dc2626;outline-offset:-1.5px;' : '');
                    sel += '<td style="' + gaya + '" title="' + escapeHtml(k) + '">' + escapeHtml(k.length > 4 ? singkatKodeJadwal_(k) : k) + (st.sumber === 'digantikan' ? '&ndash;' : '') + '</td>';
                }
                return '<tr><td>' + no + '</td><td>' + escapeHtml(r.nipp || '') + '</td>' +
                    '<td style="text-align:left">' + escapeHtml(r.nama || '') + '</td>' +
                    '<td style="text-align:left">' + escapeHtml(r.jabatan || '') + '</td>' + sel +
                    '<td><b>' + (real ? (n ? Math.round(s / n * 100) + '%' : '-') : dinas) + '</b></td></tr>';
            }).join('');

            const lain = {};
            jadwalBaris_.forEach(function (r) { Object.keys(r.kode || {}).concat(Object.keys(r.realisasi || {})).forEach(function (k) { const v = (r.kode || {})[k] || (r.realisasi || {})[k]; if (v && !kodeAdalahBakuJadwal_(v) && v.length > 4) lain[singkatKodeJadwal_(v)] = v; }); });
            const legenda = Object.keys(jadwalKode_).map(function (k) { return '<b>' + escapeHtml(k) + '</b> ' + escapeHtml(jadwalKode_[k]); })
                .concat(Object.keys(lain).map(function (k) { return '<b>' + escapeHtml(k) + '</b> ' + escapeHtml(lain[k]); })).join(' &nbsp;&middot;&nbsp; ');
            const kes = real ? hitungKesesuaianJadwal_() : null;

            const ttd = jadwalTtd_.filter(function (t) { return t.nama; }).length
                ? '<table style="margin-top:14px;border:0;width:auto;margin-left:auto;margin-right:auto"><tr>' + jadwalTtd_.filter(function (t) { return t.nama; }).map(function (t) {
                    const qr = typeof qrPetugasDataUrl_ === 'function' ? qrPetugasDataUrl_({ nama: t.nama, nipp: t.nipp }) : '';
                    return '<td style="border:0;text-align:center;padding:6px 22px">' +
                        '<div style="font-size:7px;font-weight:bold;text-transform:uppercase">' + escapeHtml(t.peran || '') + '</div>' +
                        (qr ? '<img src="' + qr + '" style="width:66px;height:66px;margin:4px 0">' : '<div style="height:66px"></div>') +
                        '<div style="font-size:8px;font-weight:bold">' + escapeHtml(t.nama || '-') + '</div>' +
                        '<div style="font-size:7px">NIPP ' + escapeHtml(t.nipp || '-') + '</div>' +
                        '<div style="font-size:7px;color:#475569">' + escapeHtml(t.jabatan || '') + '</div></td>';
                }).join('') + '</tr></table>'
                : '';

            const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + (real ? 'Realisasi' : 'Program') + ' Jadwal Dinasan ' + escapeHtml(labelBulanJadwal_(bulan)) + '</title><style>' +
                '@page{size:A4 landscape;margin:9mm}' +
                'body{font-family:Arial,sans-serif;font-size:7.5px;margin:0;color:#0f172a;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
                'h2{font-size:11px;margin:0 0 2px;text-align:center}' +
                'table{width:100%;border-collapse:collapse}' +
                'th,td{border:1px solid #cbd5e1;padding:2px 2px;text-align:center}' +
                'th{background:#0c1d37;color:#fff;font-size:6.5px}' +
                '.ket{font-size:6.5px;color:#334155;margin-top:5px;text-align:center}' +
                '</style></head><body>' +
                '<h2>JADWAL KERJA TRAIN PLANNING MONITORING &amp; EVALUATION DEPARTMENT</h2>' +
