        /**
         * Laporan harian utuh - satu hari sebagai SATU dokumen.
         *
         * ═══ APA BEDANYA DENGAN DAFTAR SERAH TERIMA ═══
         * Daftar di bawah menampilkan tiap serah terima sebagai barisnya
         * sendiri: tiga baris untuk satu hari. Itu berguna untuk menelusuri
         * pergantian, tapi tidak menjawab "apa yang terjadi hari itu".
         *
         * Laporan ini menggabungkan ketiganya jadi satu: rantai pergantiannya,
         * total KLB, peralatan yang bermasalah, & catatan tiap dinas.
         *
         * Isinya diambil dari RINGKASAN YANG DIBEKUKAN saat siklus ditutup,
         * bukan dihitung ulang dari data terkini. Itu yang membuatnya tetap
         * menampilkan keadaan pada saat ditutup sekalipun baris sumbernya
         * kelak dibetulkan Administrator - laporan yang sudah ditandatangani
         * tidak boleh berubah sendiri.
         */
        /**
         * Pratinjau laporan harian = LEMBAR FINAL-nya, bukan ringkasan.
         *
         * Versi sebelumnya membuka modal berisi angka-angka & satu kalimat
         * keadaan. Itu ringkasan, & bukan yang dimaksud "laporan final":
         * laporan final adalah lembar FR.KCI.0287 hasil estafet seluruh
         * shift, lengkap dengan isian & tanda tangan berlapisnya.
         *
         * Lembarnya disusun penyusun yang SAMA dengan yang dipakai mencetak,
         * lalu ditampilkan di dalam bingkai - jadi yang dilihat benar-benar
         * berkas yang akan keluar di kertas.
         */
        function lihatLaporanHarian_(tanggal) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat laporan harian.'); return; }
                    const s = (res.data || []).find(function (x) { return String(x.tanggal) === String(tanggal); });
                    if (!s) { showToast('Laporan harian tanggal ini belum ditutup.'); return; }

                    const id = (s.ringkas && s.ringkas.dinasanId) || '';
                    if (!id) {
                        // Arsip lama tanpa rujukan ke lembarnya - hanya
                        // ringkasannya yang tersimpan. Dikatakan apa adanya.
                        showToast('Laporan ini ditutup sebelum lembarnya ikut diarsipkan, jadi hanya ringkasannya yang ada.');
                        gambarModalLaporanHarian_(s);
                        return;
                    }

                    google.script.run
                        .withSuccessHandler(function (r2) {
                            if (!r2 || !r2.success) { showToast('Gagal memuat lembar laporannya.'); return; }
                            const d = r2.data;
                            d._riwayatTtd = (s.ringkas && s.ringkas.riwayat) || [];
                            d._ditutupOleh = s.ditutupOleh || '';
                            d._nomorHarian = s.nomorHarian || '';
                            laporanHarianAktif_ = s;
                            gambarPratinjauLembar_(d, s);
                        })
                        .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat lembar laporan.'); })
                        .dinasan_getSatu(currentSessionToken, id);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat laporan harian.'); })
                .dinasan_getSiklus(currentSessionToken, tanggal, tanggal);
        }

        let lembarHarianAktif_ = null;

        function gambarPratinjauLembar_(d, s) {
            bukaPratinjauLembar_(d, 'Laporan Final Dinasan',
                escapeHtml(s.nomorHarian || '') + ' &middot; ' + escapeHtml(formatTanggalDinasan_(s.tanggal)),
                'Hasil estafet seluruh shift &middot; ditutup oleh ' + escapeHtml(s.ditutupOleh || '-'));
        }

        /**
         * Membuka pratinjau satu lembar FR.KCI.0287 di dalam modal.
         *
         * Dipakai dua pemanggil dengan judul berbeda - Laporan Harian (hasil
         * estafet seluruh shift) & Laporan Dinasan (satu pergantian saja).
         * Isinya sama-sama digambar oleh susunLembarDinasan_, jadi keduanya
         * TIDAK mungkin berbeda tampilan: perbedaan antara apa yang dilihat
         * di layar & apa yang keluar di kertas adalah kesalahan yang baru
         * ketahuan setelah dokumennya beredar.
         */
        function bukaPratinjauLembar_(d, judul, baris1, baris2) {
            lembarHarianAktif_ = d;
            let modal = document.getElementById('modal-lembar-harian');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-lembar-harian';
                modal.className = 'fixed inset-0 z-[96] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                document.body.appendChild(modal);
            }
            modal.innerHTML =
                '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl h-[92vh] flex flex-col overflow-hidden">' +
                    '<div class="px-6 py-4 bg-[#0c1d37] text-white flex items-start justify-between gap-3 shrink-0">' +
                        '<div><h3 class="font-extrabold text-sm tracking-tight flex items-center gap-2">' +
                            '<i class="fa-solid fa-file-lines text-[#d4af37]"></i><span>' + judul + '</span></h3>' +
                            '<p class="text-[11px] text-slate-300 font-bold mt-0.5">' + baris1 + '</p>' +
                            '<p class="text-[10px] text-slate-400 font-semibold mt-0.5">' + baris2 + '</p></div>' +
                        '<button onclick="tutupPratinjauLembar_()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>' +
                    '</div>' +
                    '<iframe id="bingkai-lembar-harian" class="flex-1 w-full border-0 bg-slate-100"></iframe>' +
                    '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2 shrink-0">' +
                        '<button onclick="cetakLembarHarian_()" class="px-5 py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition flex items-center gap-1.5">' +
                            '<i class="fa-solid fa-print text-[#d4af37]"></i><span>Cetak / Simpan PDF</span></button>' +
                        '<button onclick="tutupPratinjauLembar_()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Tutup</button>' +
                    '</div>' +
                '</div>';

            const bingkai = document.getElementById('bingkai-lembar-harian');
            if (bingkai) {
                const doc = bingkai.contentDocument || bingkai.contentWindow.document;
                doc.open(); doc.write(susunLembarDinasan_(d)); doc.close();
            }
        }

        function tutupPratinjauLembar_() {
            const m = document.getElementById('modal-lembar-harian');
            if (m) m.remove();
            lembarHarianAktif_ = null;
        }

        function cetakLembarHarian_() {
            if (lembarHarianAktif_) cetakDinasanDariData_(lembarHarianAktif_);
        }

        let laporanHarianAktif_ = null;

        function gambarModalLaporanHarian_(s) {
            laporanHarianAktif_ = s;
            const r = s.ringkas || {};

            let modal = document.getElementById('modal-laporan-harian');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-laporan-harian';
                modal.className = 'hidden fixed inset-0 z-[96] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                document.body.appendChild(modal);
            }

            const angka = function (label, nilai, warna) {
                return '<div class="p-2.5 rounded-xl border border-slate-200 bg-white text-center">' +
                    '<p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider">' + label + '</p>' +
                    '<p class="text-lg font-black ' + warna + ' leading-none mt-1">' + (nilai || 0) + '</p></div>';
            };

            // ═══ TANDA TANGAN, BUKAN RIWAYAT ═══
            // Bagian ini dulu berisi daftar pergantian - riwayat. Yang
            // seharusnya ada di laporan final adalah TANDA TANGAN tiap dinas
            // yang pernah memegangnya, dalam bentuk barcode. Riwayat
            // pergantiannya sendiri sudah punya tempat di tab Laporan Dinasan.
            const ttd = (r.riwayat || []).map(function (x) {
                const kotak = function (nama, nipp, label) {
                    return '<div class="text-center">' +
                        '<div class="w-[74px] h-[74px] mx-auto bg-white border border-slate-200 rounded-lg flex items-center justify-center overflow-hidden" ' +
                             'data-qr-nama="' + escapeHtml(nama || '') + '" data-qr-nipp="' + escapeHtml(nipp || '') + '"></div>' +
                        '<p class="text-[9px] font-black text-slate-700 mt-1 leading-tight">' + escapeHtml(nama || '-') + '</p>' +
                        '<p class="text-[8px] font-mono text-slate-400">' + escapeHtml(nipp || '') + '</p>' +
                        '<p class="text-[8px] font-bold text-slate-400 uppercase tracking-wider">' + label + '</p></div>';
                };
                return '<div class="p-3 rounded-xl border border-slate-200 bg-slate-50">' +
                    '<p class="text-[9px] font-black uppercase tracking-wider text-slate-400 mb-2 text-center">' +
                        escapeHtml(x.tahapLabel || x.tahap || '') + '</p>' +
                    '<div class="grid grid-cols-2 gap-2">' +
                        kotak(x.menyerahkanNama, x.menyerahkanNipp, 'Menyerahkan') +
                        kotak(x.menerimaNama, x.menerimaNipp, 'Menerima') +
                    '</div></div>';
            }).join('');

            const daftar = function (judul, arr, warna) {
                if (!arr || !arr.length) return '';
                return '<div><p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">' + judul + '</p>' +
                    arr.map(function (x) {
                        return '<p class="text-[11px] font-semibold ' + warna + ' leading-relaxed">&bull; ' + escapeHtml(x) + '</p>';
                    }).join('') + '</div>';
            };

            modal.innerHTML =
                '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">' +
                    '<div class="px-6 py-4 bg-[#0c1d37] text-white flex items-start justify-between gap-3 shrink-0">' +
                        '<div><h3 class="font-extrabold text-sm tracking-tight flex items-center gap-2">' +
                            '<i class="fa-solid fa-file-lines text-[#d4af37]"></i><span>Laporan Harian Dinasan</span></h3>' +
                            '<p class="text-[11px] text-slate-300 font-bold mt-0.5">' +
                                escapeHtml(formatTanggalDinasan_(s.tanggal)) +
                                (r.hari ? ' &middot; ' + escapeHtml(r.hari) : '') + '</p>' +
                            '<p class="text-[10px] text-slate-400 font-semibold mt-0.5">Ditutup oleh ' +
                                escapeHtml(s.ditutupOleh || '-') + '</p></div>' +
                        '<button onclick="tutupLaporanHarian_()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>' +
                    '</div>' +
                    '<div class="p-6 space-y-4 overflow-y-auto flex-1">' +
                        '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">' +
                            angka('KLB Jalan', r.klbJalan, 'text-emerald-600') +
                            angka('Rekayasa', r.rekayasa, 'text-amber-600') +
                            angka('Pembatalan', r.pembatalan, 'text-red-600') +
                            angka('Petugas', (r.petugas || []).length, 'text-[#0c1d37]') +
                        '</div>' +
                        (r.perkaAcuan
                            ? '<p class="text-[11px] font-bold text-slate-600">Acuan PERKA: <span class="font-mono">' +
                              escapeHtml(r.perkaAcuan) + '</span></p>' : '') +
                        (ttd
                            ? '<div><p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">' +
                              'Tanda Tangan Digital &mdash; tiap dinas dalam siklus ini</p>' +
                              '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">' + ttd + '</div></div>'
                            : '') +
                        daftar('Peralatan Bermasalah', r.alatBermasalah, 'text-rose-700') +
                        daftar('Catatan Keadaan Dinas', r.catatan, 'text-amber-800') +
                        (s.catatan ? '<div class="p-3 bg-slate-50 border border-slate-200 rounded-xl">' +
                            '<p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">Catatan Penutup</p>' +
                            '<p class="text-[11px] font-semibold text-slate-700">' + escapeHtml(s.catatan) + '</p></div>' : '') +
                        ((!r.alatBermasalah || !r.alatBermasalah.length) && (!r.catatan || !r.catatan.length)
                            ? '<p class="text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-3">' +
                              '<i class="fa-solid fa-circle-check mr-1.5"></i>Hari ini berjalan tanpa catatan &mdash; seluruh peralatan dilaporkan baik.</p>' : '') +
                    '</div>' +
                    '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2 shrink-0">' +
                        '<button onclick="cetakLaporanHarian_()" class="px-4 py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition flex items-center gap-1.5">' +
                            '<i class="fa-solid fa-print text-[#d4af37]"></i><span>Cetak Laporan Final</span></button>' +
                        '<button onclick="tutupLaporanHarian_()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Tutup</button>' +
                    '</div>' +
                '</div>';
            modal.classList.remove('hidden');
            gambarQrTandaTangan_(modal);
        }

        /**
         * Menggambar barcode pada tiap kotak tanda tangan.
         *
         * Dilakukan SETELAH modalnya ada di layar, bukan saat menyusun HTML -
         * QRCode.js perlu elemen yang sudah menempel di dokumen untuk
         * menggambar ke dalamnya.
         */
        function gambarQrTandaTangan_(akar) {
            (akar || document).querySelectorAll('[data-qr-nama]').forEach(function (el) {
                if (el.childElementCount) return;            // sudah tergambar
                const url = qrPetugasDataUrl_({
                    nama: el.getAttribute('data-qr-nama'),
                    nipp: el.getAttribute('data-qr-nipp')
                });
                el.innerHTML = url
                    ? '<img src="' + url + '" class="w-full h-full object-contain">'
                    : '<i class="fa-solid fa-qrcode text-slate-200 text-xl"></i>';
            });
        }

        function tutupLaporanHarian_() {
            const m = document.getElementById('modal-laporan-harian');
            if (m) m.classList.add('hidden');
        }

        /**
         * Laporan harian dicetak memakai lembar FR.KCI.0287 yang sama.
         *
         * ═══ KENAPA BUKAN RINGKASAN SENDIRI ═══
         * Laporan harian BUKAN dokumen berformat lain - ia laporan serah
         * terima yang sama, dalam keadaan final setelah Closing Report.
         * Mencetaknya dengan susunan berbeda membuat dua berkas tentang hari
         * yang sama terlihat seperti dua dokumen yang berbeda.
         *
         * Yang membedakan hanya bagian tanda tangan: bukan sepasang QR,
         * melainkan SELURUH RIWAYAT pergantian dari awal siklus sampai
         * Closing - karena laporan final ini memang ditandatangani berlapis
         * oleh setiap petugas yang pernah memegangnya.
         */
        function cetakLaporanHarian_() {
            const s = laporanHarianAktif_;
            if (!s) return;
            if (s.dinasanId || (s.ringkas && s.ringkas.dinasanId)) {
                cetakLaporanHarianFormulir_(s);
                return;
            }
            cetakLaporanHarianRingkas_(s);
        }

        /**
         * Mengambil laporan aslinya lalu mencetaknya sebagai formulir penuh,
         * dengan deretan tanda tangan seluruh pergantian di bagian bawah.
         */
        function cetakLaporanHarianFormulir_(s) {
            const id = s.dinasanId || (s.ringkas && s.ringkas.dinasanId);
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat laporan aslinya.'); return; }
                    const d = res.data;
                    d._riwayatTtd = (s.ringkas && s.ringkas.riwayat) || [];
                    d._ditutupOleh = s.ditutupOleh || '';
                    cetakDinasanDariData_(d);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat laporan.'); })
                .dinasan_getSatu(currentSessionToken, id);
        }

        function cetakLaporanHarianRingkas_(s) {
            const r = s.ringkas || {};
            const baris = function (a, b) {
                return '<tr><td style="padding:4px 6px;border:1px solid #cbd5e1;width:28%"><b>' + a + '</b></td>' +
                    '<td style="padding:4px 6px;border:1px solid #cbd5e1">' + b + '</td></tr>';
            };
            const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Laporan Harian ' + escapeHtml(s.tanggal) + '</title>' +

        // ================================================================
        // STRUKTUR ORGANISASI (4 September 2026, dirombak)
        // ================================================================
        //
        // Dua hal yang dipisah:
        //   PERSONIL - daftar orang (nama, NIK, jabatan, foto)
        //   JABATAN  - kotak di bagan, yang bisa diisi salah satu personil
        //
        // Dipisah karena keduanya berubah dengan irama berbeda: orang
        // dimutasi jauh lebih sering daripada susunan jabatannya.

        let strukturPersonil_ = [];
        let strukturNode_ = [];
        let nodeSedangDisunting_ = null;
        let personilSedangDisunting_ = null;

        function loadTcStruktur() {
            muatStrukturDariServer_();
        }

        function muatStrukturDariServer_() {
            const bagan = document.getElementById('struktur-bagan');
            if (bagan) bagan.innerHTML = '<p class="text-[11px] text-slate-400 font-bold py-10 text-center w-full"><i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>Memuat susunan organisasi...</p>';

            google.script.run

                    }
                    strukturPersonil_ = res.personil || [];
                    strukturNode_ = res.node || [];
                    gambarBagan_();
                    gambarKolamPersonil_();
                })
                .withFailureHandler(function () {
                    if (bagan) bagan.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-10 text-center w-full">Terjadi kesalahan saat memuat.</p>';
                })
                .struktur_getAll(currentSessionToken);

        /**
         * Membuka bagan selebar layar.
         *
         * Memakai Fullscreen API bila tersedia; kalau browser menolak (Safari
         * lama, atau halaman di dalam iframe tanpa izin), bagannya tetap
         * dibesarkan dengan posisi tetap - hasilnya sama di mata pengguna,
         * hanya tanpa keluar dari jendela browser.
         */
        let baganLayarPenuh_ = false;

        function layarPenuhBagan_() {
            const panggung = document.getElementById('struktur-panggung');
            if (!panggung) return;

            if (!baganLayarPenuh_) {
                const minta = panggung.requestFullscreen || panggung.webkitRequestFullscreen || panggung.msRequestFullscreen;
                if (minta) {
                    try { minta.call(panggung); } catch (e) { paksaLayarPenuhBagan_(true); }
                } else {
                    paksaLayarPenuhBagan_(true);
                }
                baganLayarPenuh_ = true;
            } else {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    const keluar = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                    if (keluar) { try { keluar.call(document); } catch (e) { /* diabaikan */ } }
                }
                paksaLayarPenuhBagan_(false);
                baganLayarPenuh_ = false;
            }
            perbaruiTombolLayarPenuh_();
            // Skala dihitung ulang setelah lebarnya berubah - tanpa ini,
            // bagannya tetap sekecil saat masih di dalam kartu.
            setTimeout(function () { sesuaikanSkalaBagan_(true); }, 220);
        }

        /** Layar penuh tiruan: kartunya dipasang menutupi jendela. */
        function paksaLayarPenuhBagan_(nyala) {
            const panggung = document.getElementById('struktur-panggung');
            if (!panggung) return;
            panggung.classList.toggle('fixed', nyala);
            panggung.classList.toggle('inset-0', nyala);
            panggung.classList.toggle('z-[80]', nyala);
            panggung.classList.toggle('rounded-2xl', !nyala);
            panggung.classList.toggle('overflow-auto', nyala);
            document.body.style.overflow = nyala ? 'hidden' : '';
        }

        function perbaruiTombolLayarPenuh_() {
            const btn = document.getElementById('btn-bagan-penuh');
            if (!btn) return;
            btn.innerHTML = baganLayarPenuh_
                ? '<i class="fa-solid fa-compress text-[10px]"></i>'
                : '<i class="fa-solid fa-expand text-[10px]"></i>';
            btn.title = baganLayarPenuh_ ? 'Keluar dari layar penuh' : 'Lihat bagan selebar layar';
        }

        // Tombol Esc & tombol keluar bawaan browser tidak lewat fungsi di atas,
        // jadi keadaannya disamakan lewat kejadian resmi fullscreen.
        ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
            document.addEventListener(ev, function () {
                const aktif = !!(document.fullscreenElement || document.webkitFullscreenElement);
                if (!aktif && baganLayarPenuh_) {
                    paksaLayarPenuhBagan_(false);
                    baganLayarPenuh_ = false;
                    perbaruiTombolLayarPenuh_();
                    setTimeout(function () { sesuaikanSkalaBagan_(true); }, 220);
                }
            });
        });

        function cariPersonil_(id) {
            return strukturPersonil_.find(function (p) { return p.id === id; }) || null;
        }

        function inisial_(teks) {
            return String(teks || '?').trim().split(/\s+/).slice(0, 2)
                .map(function (x) { return x.charAt(0); }).join('').toUpperCase();
        }

        // ── BAGAN ─────────────────────────────────────────────────────────

        /**
         * Menggambar pohon sebagai daftar bersarang.
         * Garis penghubungnya dari CSS (lihat <style> di pane), bukan SVG -
         * dengan begitu kotak boleh setinggi apa pun dan garisnya tetap
         * menempel, berapa pun jumlah cabangnya.
         */
        function gambarBagan_() {
            const wadah = document.getElementById('struktur-bagan');
            if (!wadah) return;

            const akar = strukturNode_.find(function (n) { return !n.indukId; });
            if (!akar) {
                wadah.innerHTML = '<p class="text-[11px] text-slate-400 font-bold py-10 text-center w-full italic">Susunan organisasi belum diisi.</p>';
                return;
            }
            wadah.innerHTML = '<ul>' + gambarSimpul_(akar.id) + '</ul>';
            // Skala disesuaikan setelah tergambar - lebar isinya baru bisa
            // diukur ketika elemennya sudah ada di halaman.
            setTimeout(function () { sesuaikanSkalaBagan_(); }, 60);
        }

        // ═══════════════════════════════════════════════════════════════
        // NAMA JABATAN: PLACEHOLDER vs ISIAN SUNGGUHAN
        // ═══════════════════════════════════════════════════════════════
        //
        // Kotak yang lahir dari tombol "Tambah Bawahan" diberi nama sementara
        // "Jabatan Baru". Nama itu BUKAN isian petugas - hanya penanda agar
        // kotaknya punya judul sebelum diisi.
        //
        // Masalahnya, sisa kode memperlakukannya seperti nama sungguhan:
        //
        //   1. Saat personil dipilih, jabatannya TIDAK ikut terisi karena
        //      kolomnya "sudah ada isinya" - padahal isinya cuma penanda.
        //      Akibatnya nama "Jabatan Baru" ikut tersimpan selamanya.
        //   2. Daftar Personil menampilkan nama itu apa adanya sebagai
        //      lencana, sehingga orang yang jelas-jelas sudah punya jabatan
        //      tetap berlencana "Jabatan Baru".
        //
        // Dua fungsi di bawah ini menjadi satu-satunya tempat yang menentukan
        // "apakah ini nama sungguhan", supaya tidak ada lagi tempat yang
        // menilainya dengan cara berbeda.

        const PERAN_PENANDA = ['', 'jabatan baru', 'baru', '-'];

        function peranMasihPenanda_(teks) {
            return PERAN_PENANDA.indexOf(String(teks || '').trim().toLowerCase()) !== -1;
        }

        /**
         * Nama jabatan yang layak ditampilkan untuk sebuah kotak.
         *
         * Nama yang diketik petugas selalu menang - sebuah kotak boleh saja
         * sengaja diberi nama struktural ("Assistant Manager 1") yang berbeda
         * dari jabatan administratif orang yang mengisinya. Jabatan personil
         * hanya dipakai saat nama kotaknya memang belum pernah diisi.
         */
        function namaJabatanNode_(n) {
            if (!n) return '';
            if (!peranMasihPenanda_(n.peran)) return String(n.peran).trim();
            const o = cariPersonil_(n.personilId);
            return (o && o.jabatan) ? String(o.jabatan).trim() : '';
        }

        function gambarSimpul_(nodeId) {
            const n = strukturNode_.find(function (x) { return x.id === nodeId; });
            if (!n) return '';

            const orang = cariPersonil_(n.personilId);
            const terisi = !!orang;
            const anak = strukturNode_
                .filter(function (x) { return x.indukId === nodeId; })
                .sort(function (a, b) { return (Number(a.urutan) || 0) - (Number(b.urutan) || 0); });

            // Jabatan yang ditampilkan mengikuti jabatan PERSONIL bila sudah
            // diisi - jabatan pada data orang lebih spesifik daripada peran
            // umum di bagan.
            // Lewat namaJabatanNode_ - lihat catatan di atasnya. Dulu jabatan
            // personil SELALU menang, sehingga nama struktural yang sengaja
            // diketik petugas ikut tertimpa di tampilan.
            const peranTampil = namaJabatanNode_(n);

            const akar = !n.indukId;

            // ═══ PASFOTO ═══
            // Diperbesar dari 36px ke 52px & dibuat persegi membulat, bukan
            // lingkaran: lingkaran memotong dagu & dahi pada pasfoto resmi yang
            // memang dibingkai persegi. Kosongnya pun tidak lagi menampilkan
            // lencana - sebuah huruf di dalam lingkaran tidak memberi tahu
            // apa-apa; ikon orang langsung terbaca sebagai "belum ada orang".
            const gambarWajah = (terisi && orang.foto)
                ? '<img src="' + orang.foto + '" class="w-full h-full object-cover">'
                : (terisi
                    ? '<span class="text-[13px] font-black text-[#d4af37]">' + escapeHtml(inisial_(orang.nama)) + '</span>'
                    : '<i class="fa-solid fa-user text-slate-300 text-base"></i>');

            const isiOrang = terisi
                ? '<p class="text-[11.5px] font-black text-white leading-tight">' + escapeHtml(orang.nama) + '</p>' +
                  (orang.nik ? '<p class="text-[9px] text-emerald-400 font-bold mt-0.5">NIK ' + escapeHtml(orang.nik) + '</p>' : '')
                : '<p class="text-[10px] text-slate-400 italic">Belum ada personil</p>';

            // Kotak tanpa nama jabatan diberi tanda: itulah yang membuat
            // Simpan-nya ditolak, dan tanpa penanda pengguna tidak punya cara
            // mengetahuinya selain mencoba satu per satu.
            const belumBernama = !peranTampil;
            const judulKartu = belumBernama
                ? '<span class="italic text-amber-500">Belum ada nama jabatan</span>'
                : escapeHtml(peranTampil);

            // ═══ LENCANA SINGKAT DIHAPUS DARI BAGAN ═══
            // "BARU", "M", "AM" tidak menambah keterangan apa pun di atas
            // nama jabatan yang sudah tertulis persis di bawahnya - ia hanya
            // memakan baris pertama tiap kartu. Yang dulu terlihat sebagai
            // "BARU" bahkan bukan singkatan jabatan sama sekali, melainkan
            // nilai bawaan yang dipasang tombol Tambah Bawahan.
            //
            // Barisnya kini dipakai bidang (subPeran) saja, & hanya muncul
            // kalau memang diisi.
            // Penanda tupoksi: emas bila sudah diisi, kelabu bila belum.
            // Tanpa penanda, satu-satunya cara mengetahui jabatan mana yang
            // tupoksinya masih kosong adalah membuka kotaknya satu per satu.
            const adaTupoksi = !!String(n.tupoksi || '').trim();

            const kartu =
                '<div onclick="bukaTugaskan(\'' + n.id + '\')" ' +
                     'onmouseenter="tipTupoksiMasuk_(event, \'' + n.id + '\')" ' +
                     'onmouseleave="tipTupoksiKeluar_()" ' +
                     'class="org-node inline-block p-3 w-60 text-left cursor-pointer relative group overflow-hidden ' +
                     (terisi ? 'org-terisi' : 'org-kosong') + (akar ? ' org-akar' : '') + '">' +
                    (String(n.subPeran || '').trim()
                        ? '<p class="text-[9px] font-bold uppercase tracking-wider mb-1.5 pr-6 leading-tight ' +
                          (terisi ? 'text-slate-400' : 'text-slate-400') + '">' +
                          escapeHtml(n.subPeran) + '</p>'
                        : '') +
                    '<div class="flex items-start gap-3">' +
                        '<div class="w-[52px] h-[52px] rounded-xl flex items-center justify-center shrink-0 overflow-hidden ' +
                            (terisi
                                ? 'bg-[#12294d] ring-2 ring-[#d4af37]/50 shadow-inner'
                                : 'bg-slate-100 ring-1 ring-slate-200') + '">' +
                            gambarWajah + '</div>' +
                        '<div class="min-w-0 flex-1">' +
                            // ═══ JABATAN DITULIS UTUH ═══
                            // Dulu `truncate` memotongnya jadi "Train Traffic
                            // Planning Sp..." - dan justru bagian yang terpotong
                            // (Specialist 1 / 2 / 3) yang membedakan satu
                            // jabatan dari jabatan lain di bawahnya. Sekarang
                            // dibiarkan turun sampai tiga baris.
                            '<h4 class="text-[10.5px] font-bold leading-[1.25] mb-1 ' +
                                (terisi ? 'text-[#d4af37]' : 'text-slate-700') + '" ' +
                                'style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden" ' +
                                'title="' + escapeHtml(peranTampil || '') + '">' + judulKartu + '</h4>' +
                            isiOrang +
                        '</div>' +
                    '</div>' +
                    // ═══ CHIP AKSI, BUKAN TIRAI SEPENUH KARTU ═══
                    // Tirai gelap yang dulu menutupi seluruh kartu saat
                    // disorot menyembunyikan nama & jabatan persis pada saat
                    // orang sedang membacanya - dan membuat tooltip tupoksi
                    // mustahil dipakai, karena yang tertutup justru kotak
                    // yang sedang ditanyakan. Chip kecil di pojok bawah
                    // menyampaikan hal yang sama tanpa menutupi apa pun.
                    '<span class="org-aksi absolute bottom-1.5 right-1.5 z-10 text-[9px] font-black px-2 py-0.5 bg-[#d4af37] text-[#0c1d37] rounded-full shadow flex items-center gap-1">' +
                        '<i class="fa-solid fa-user-tag text-[8px]"></i>' + (terisi ? 'Ubah' : 'Tugaskan') + '</span>' +
                    // Tombol tupoksi tetap ada untuk membuka rinciannya
                    // (tooltip sengaja ringkas & tidak bisa digulir).
                    '<button onclick="event.stopPropagation(); bukaTupoksi(\'' + n.id + '\')" ' +
                        'title="' + (adaTupoksi ? 'Lihat tugas pokok &amp; fungsi' : 'Tupoksi belum diisi - klik untuk melihat') + '" ' +
                        'class="org-tupoksi-btn absolute top-1.5 right-1.5 z-10 w-5 h-5 rounded-md hover:bg-[#d4af37] hover:text-[#0c1d37] flex items-center justify-center transition ' +
                        (adaTupoksi
                            ? 'bg-[#d4af37]/20 text-[#d4af37]'
                            : (terisi ? 'bg-white/10 text-slate-500' : 'bg-slate-100 text-slate-300')) + '">' +
                        '<i class="fa-solid fa-circle-info text-[9px]"></i></button>' +
                '</div>';

            const anakHtml = anak.length
                ? '<ul>' + anak.map(function (a) { return gambarSimpul_(a.id); }).join('') + '</ul>'
                : '';

            return '<li>' + kartu + anakHtml + '</li>';
        }

        // ── KOLAM PERSONIL ────────────────────────────────────────────────

        function gambarKolamPersonil_() {
            const wadah = document.getElementById('struktur-personil');
            if (!wadah) return;

            document.getElementById('struktur-jumlah').textContent = strukturPersonil_.length + ' personil';

            if (!strukturPersonil_.length) {
                wadah.innerHTML = '<p class="col-span-full text-[11px] text-slate-400 font-bold py-6 text-center italic">' +
                    'Belum ada personil. Klik <strong>Tambah Personil</strong> untuk mengisi.</p>';
                return;
            }

            // Ditandai bila sudah menempati jabatan - supaya terlihat siapa
            // yang belum ditempatkan tanpa perlu memeriksa bagan satu per satu.
            const terpakai = {};
            strukturNode_.forEach(function (n) { if (n.personilId) terpakai[n.personilId] = n; });

            wadah.innerHTML = strukturPersonil_.map(function (p) {
                const node = terpakai[p.id];
                const wajah = p.foto
                    ? '<img src="' + p.foto + '" class="w-full h-full object-cover">'
                    : '<span class="text-[11px] font-black text-[#d4af37]">' + escapeHtml(inisial_(p.nama)) + '</span>';
                // Lencana memakai namaJabatanNode_, bukan node.peran mentah.
                // Dengan node.peran, orang yang menempati kotak hasil "Tambah
                // Bawahan" selalu berlencana "Jabatan Baru" walau jabatannya
                // sudah jelas tercatat - inilah bug yang terlihat di layar.
                const namaJab = node ? namaJabatanNode_(node) : '';
                const lencana = node
                    ? '<span title="' + escapeHtml(namaJab || 'Jabatan belum dinamai') + '" class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-[9px] font-black max-w-[120px] truncate inline-block align-middle">' +
                      escapeHtml(namaJab || 'BERTUGAS') + '</span>'
                    : '<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-400 border border-slate-200 text-[9px] font-black">BELUM</span>';

                return '<button onclick="bukaFormPersonil(\'' + p.id + '\')" ' +
                    'class="flex items-center gap-2.5 p-2.5 bg-slate-50 border border-slate-200 hover:border-[#0c1d37] rounded-xl text-left transition">' +
                    '<div class="w-9 h-9 rounded-lg bg-[#0c1d37] flex items-center justify-center shrink-0 overflow-hidden">' + wajah + '</div>' +
                    '<div class="min-w-0 flex-1">' +
                        '<p class="text-[11px] font-bold text-slate-800 truncate">' + escapeHtml(p.nama) + '</p>' +
                        '<p class="text-[9px] text-slate-400 font-semibold truncate">' +
                            (p.nik ? 'NIK ' + escapeHtml(p.nik) : '') +
                            (p.jabatan ? (p.nik ? ' \u00B7 ' : '') + escapeHtml(p.jabatan) : '') + '</p>' +
                    '</div>' + lencana + '</button>';
            }).join('');
        }

        // ── MODAL: TUGASKAN / SUNTING JABATAN ─────────────────────────────

        function bukaTugaskan(nodeId) {
            if (!canDo('tc-struktur', 'edit')) { showToast('Anda tidak punya izin mengubah struktur organisasi.'); return; }
            const n = strukturNode_.find(function (x) { return x.id === nodeId; });
            if (!n) return;
            nodeSedangDisunting_ = nodeId;

            document.getElementById('tg-judul').textContent = n.peran || 'Jabatan';
            document.getElementById('tg-subjudul').textContent = n.subPeran || 'Tanpa keterangan bidang';
            document.getElementById('tg-peran').value = n.peran || '';
            document.getElementById('tg-subperan').value = n.subPeran || '';
            lencanaNodeTersimpan_ = n.lencana || '';
            document.getElementById('tg-tupoksi').value = n.tupoksi || '';
            // Pratinjau diperbarui saat dibuka, bukan hanya saat diketik -
            // kalau tidak, isian lama tampil dengan pratinjau milik jabatan
            // yang dibuka sebelumnya.
            pratinjauTupoksi_();

            // Jabatan tertinggi tidak boleh dihapus - bagan harus punya akar.
            document.getElementById('btn-tg-hapus').style.display =
                (n.indukId && canDo('tc-struktur', 'hapus')) ? '' : 'none';

            tampilkanGalatJabatan_('');
            peranDariOtomatis_ = '';
            if (!String(n.peran || '').trim()) {
                tampilkanGalatJabatan_('Kotak ini belum punya nama jabatan. Pilih personilnya di bawah - nama jabatannya ikut terisi sendiri dari Struktur Personil. Atau ketik sendiri di kolom "Jabatan".');
            }
            personilTerpilihModal_ = n.personilId || '';
            gambarPilihanPersonil_(personilTerpilihModal_);
            document.getElementById('modal-tugaskan').classList.remove('hidden');
        }

        function gambarPilihanPersonil_(terpilihId) {
            const wadah = document.getElementById('tg-daftar-personil');
            const baris = function (id, nama, ket, aktif, wajahHtml) {
                return '<button onclick="pilihPersonilUntukJabatan_(\'' + id + '\')" ' +
                    'class="w-full flex items-center gap-2.5 p-2.5 rounded-xl border text-left transition ' +
                    (aktif ? 'bg-[#0c1d37] border-[#0c1d37] text-white' : 'bg-slate-50 border-slate-200 hover:border-slate-400') + '">' +
                    wajahHtml +
                    '<div class="min-w-0 flex-1">' +
                        '<p class="text-[11px] font-bold truncate ' + (aktif ? 'text-white' : 'text-slate-800') + '">' + escapeHtml(nama) + '</p>' +
                        '<p class="text-[9px] font-semibold truncate ' + (aktif ? 'text-slate-400' : 'text-slate-400') + '">' + escapeHtml(ket) + '</p>' +
                    '</div>' +
                    (aktif ? '<i class="fa-solid fa-circle-check text-[#d4af37]"></i>' : '') + '</button>';
            };

            const kosong = baris('', 'Kosongkan jabatan ini', 'Tidak ada personil yang ditugaskan', !terpilihId,
                '<div class="w-8 h-8 rounded-lg bg-slate-200 text-slate-400 flex items-center justify-center shrink-0"><i class="fa-solid fa-user-slash text-[10px]"></i></div>');

            const daftar = strukturPersonil_.map(function (p) {
                const wajah = p.foto
                    ? '<div class="w-8 h-8 rounded-lg overflow-hidden shrink-0"><img src="' + p.foto + '" class="w-full h-full object-cover"></div>'
                    : '<div class="w-8 h-8 rounded-lg bg-[#0c1d37] text-[#d4af37] flex items-center justify-center shrink-0 text-[10px] font-black">' +
                      escapeHtml(inisial_(p.nama)) + '</div>';
                const ket = [p.nik ? 'NIK ' + p.nik : '', p.jabatan].filter(Boolean).join(' \u00B7 ') || 'Tanpa keterangan';
                return baris(p.id, p.nama, ket, p.id === terpilihId, wajah);
            }).join('');

            wadah.innerHTML = kosong + (daftar || '<p class="text-[11px] text-slate-400 font-bold py-3 text-center italic">Belum ada personil. Tambahkan lewat tombol di atas.</p>');
        }

        /**
         * Personil yang sedang DIPILIH di modal - belum tentu tersimpan.
         *
         * ═══ KENAPA TIDAK LANGSUNG DIKIRIM KE SERVER ═══
         * Dulu memilih nama langsung memanggil struktur_tugaskan, lalu memuat
         * ulang seluruh bagan. Dua akibatnya, keduanya merugikan:
         *
         *   1. Tombol Simpan mengirim personilId dari salinan bagan di browser.
         *      Kalau pemuatan ulang itu belum selesai saat Simpan ditekan,
         *      yang terkirim adalah personilId LAMA - penugasan yang baru saja
         *      dipilih tertimpa kembali, tanpa pesan apa pun. Inilah sebabnya
         *      penugasan "tidak bisa disimpan".
         *   2. Tombol Batal tidak membatalkan apa pun, karena penugasannya
         *      sudah terlanjur tertulis begitu namanya diklik.
         *
         * Sekarang memilih nama hanya mengubah keadaan di layar. Semuanya -
         * nama jabatan, bidang, lencana, tupoksi, DAN penugasan - dikirim
         * sekali saja saat Simpan ditekan.
         */
        let personilTerpilihModal_ = '';
        /** Nilai lencana milik kotak yang sedang dibuka - lihat simpanJabatan. */
        let lencanaNodeTersimpan_ = '';

        /**
         * Nama jabatan yang PERNAH diisikan sendiri oleh sistem.
         *
         * Dipakai membedakan "kolom ini masih hasil isian otomatis, boleh
         * ditimpa" dari "kolom ini sudah diketik petugas, jangan disentuh".
         * Tanpa pembeda itu, mencoba beberapa nama berturut-turut akan
         * menghapus judul jabatan yang sudah susah payah diketik sendiri.
         */
        let peranDariOtomatis_ = '';

        function pilihPersonilUntukJabatan_(personilId) {
            if (!nodeSedangDisunting_) return;
            personilTerpilihModal_ = String(personilId || '');
            gambarPilihanPersonil_(personilTerpilihModal_);

            const orang = personilTerpilihModal_ ? cariPersonil_(personilTerpilihModal_) : null;

            // ═══ JABATAN IKUT TERISI SENDIRI ═══
            // Jabatan orangnya sudah tercatat di Struktur Personil; memintanya
            // diketik ulang di sini hanya menyalin data yang sudah ada, dan
            // salinannya berpeluang berbeda dari aslinya. Karena kolom itu
            // wajib, memintanya juga berarti memasang penghalang di depan
            // pekerjaan yang sebenarnya - menugaskan orang.
            //
            // Yang TIDAK ditimpa: judul jabatan yang sudah diketik petugas.
            // Sebuah kotak bisa saja sengaja diberi nama jabatan struktural
            // ("Assistant Manager 1") yang berbeda dari jabatan administratif
            // orang yang mengisinya.
            let ikutTerisi = false;
            if (orang) {
                const elPeran = document.getElementById('tg-peran');
                const sekarang = String((elPeran && elPeran.value) || '').trim();
                // peranMasihPenanda_ ikut diperiksa - INI AKAR BUG "Jabatan
                // Baru". Kotak hasil "Tambah Bawahan" berisi penanda
                // "Jabatan Baru", yang dulu dianggap isian sungguhan,
                // sehingga jabatan personil tidak pernah ikut terisi & nama
                // penanda itu ikut tersimpan ke sheet untuk selamanya.
                const bolehDiisi = !sekarang || sekarang === peranDariOtomatis_ || peranMasihPenanda_(sekarang);
                if (elPeran && orang.jabatan && bolehDiisi) {
                    elPeran.value = orang.jabatan;
                    peranDariOtomatis_ = orang.jabatan;
                    ikutTerisi = true;
                    tampilkanGalatJabatan_('');   // syaratnya sudah terpenuhi
                }
            }

            const tanda = document.getElementById('tg-pilihan-info');
            if (!tanda) return;

            if (!orang) {
                tanda.innerHTML = '<i class="fa-solid fa-user-slash text-slate-400 mr-1"></i>' +
                    'Jabatan akan dikosongkan &mdash; tekan <strong>Simpan</strong> untuk menerapkannya.';
            } else if (ikutTerisi) {
                tanda.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i>' +
                    escapeHtml(orang.nama) + ' akan ditugaskan. Nama jabatannya ikut terisi dari Struktur Personil &mdash; ' +
                    'tinggal tekan <strong>Simpan</strong>.';
            } else if (!orang.jabatan) {
                tanda.innerHTML = '<i class="fa-solid fa-circle-info text-amber-600 mr-1"></i>' +
                    escapeHtml(orang.nama) + ' akan ditugaskan, tapi jabatannya belum tercatat di Struktur Personil &mdash; ' +
                    'isi kolom "Jabatan" di atas lebih dulu.';
            } else {
                tanda.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i>' +
                    escapeHtml(orang.nama) + ' akan ditugaskan. Nama jabatan yang sudah Anda ketik dibiarkan apa adanya &mdash; ' +
                    'tekan <strong>Simpan</strong>.';
            }
            tanda.classList.remove('hidden');
        }

        /** Menampilkan (atau membersihkan) pesan galat di dalam modal jabatan. */
        function tampilkanGalatJabatan_(pesan) {
            const el = document.getElementById('tg-galat');
            const isian = document.getElementById('tg-peran');
            if (isian && pesan === '') isian.classList.remove('ring-2', 'ring-red-400', 'border-red-300');
            if (!el) return;
            if (!pesan) { el.classList.add('hidden'); el.innerHTML = ''; return; }
            el.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1.5"></i>' + escapeHtml(pesan);
            el.classList.remove('hidden');
        }

        function tutupTugaskan() {
            tampilkanGalatJabatan_('');
            document.getElementById('modal-tugaskan').classList.add('hidden');
            nodeSedangDisunting_ = null;
            personilTerpilihModal_ = '';
            const tanda = document.getElementById('tg-pilihan-info');
            if (tanda) tanda.classList.add('hidden');
        }

        function simpanJabatan() {
            if (!nodeSedangDisunting_) return;
            const n = strukturNode_.find(function (x) { return x.id === nodeSedangDisunting_; });
            const data = {
                id: nodeSedangDisunting_,
                indukId: n ? n.indukId : '',
                urutan: n ? n.urutan : 99,
                // Diambil dari pilihan di layar, BUKAN dari salinan bagan:
                // salinan itu bisa tertinggal & menimpa balik penugasan baru.
                personilId: personilTerpilihModal_,
                peran: document.getElementById('tg-peran').value.trim(),
                subPeran: document.getElementById('tg-subperan').value.trim(),
                // Dipertahankan apa adanya: isiannya sudah tidak ada di
                // formulir, & mengirim string kosong berarti menghapus data
                // lama setiap kali jabatan disunting.
                lencana: lencanaNodeTersimpan_,
                tupoksi: document.getElementById('tg-tupoksi').value
            };

            // Jaring terakhir: kalau yang tersisa di kolom hanyalah penanda
            // ("Jabatan Baru") sementara personilnya sudah punya jabatan,
            // jabatan itulah yang disimpan. Dengan begitu data lama ikut
            // bersih dengan sendirinya setiap kali kotaknya disunting -
            // tanpa perlu membetulkan satu per satu di spreadsheet.
            if (peranMasihPenanda_(data.peran) && data.personilId) {
                const orangTerpilih = cariPersonil_(data.personilId);
                if (orangTerpilih && orangTerpilih.jabatan) data.peran = String(orangTerpilih.jabatan).trim();
            }
            // ═══ KENAPA INI JADI JEBAKAN ═══
            // Sebagian kotak pada bagan lahir tanpa nama jabatan (mis. hasil
            // penyusunan awal dari data personil yang kolom jabatannya masih
            // kosong). Kotak itu tampil apa adanya & tetap bisa dibuka, tapi
            // Simpan-nya SELALU ditolak di sini - dan penolakannya dulu hanya
            // lewat toast yang tertutup latar modal. Yang terlihat: tombol
            // Simpan tidak berbuat apa-apa.
            //
            // Sekarang alasannya ditulis di dalam modal & kolomnya disorot.
            if (!data.peran) {
                tampilkanGalatJabatan_('Nama jabatan masih kosong. Pilih personilnya di bawah agar terisi sendiri, atau ketik langsung di kolom "Jabatan".');
                const el = document.getElementById('tg-peran');
                if (el) {
                    el.classList.add('ring-2', 'ring-red-400', 'border-red-300');
                    el.focus();
                }
                return;
            }
            tampilkanGalatJabatan_('');

            const btn = document.getElementById('btn-tg-simpan');
            const asli = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>';

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false; btn.innerHTML = asli;
                    if (!res.success) {
                        tampilkanGalatJabatan_(res.message || 'Gagal menyimpan.');
                        showToast(res.message || 'Gagal menyimpan.');
                        return;
                    }
                    const orang = personilTerpilihModal_ ? cariPersonil_(personilTerpilihModal_) : null;
                    tutupTugaskan();
                    showToast(orang
                        ? 'Jabatan diperbarui - ' + orang.nama + ' ditugaskan.'
                        : 'Jabatan diperbarui.');
                    muatStrukturDariServer_();
                })
                .withFailureHandler(function () {
                    btn.disabled = false; btn.innerHTML = asli;
                    tampilkanGalatJabatan_('Server tidak merespons. Periksa sambungan, lalu coba simpan lagi.');
                    showToast('Terjadi kesalahan saat menyimpan jabatan.');
                })
                .struktur_saveNode(currentSessionToken, data);
        }

        function tambahBawahan() {
            if (!nodeSedangDisunting_) return;
            const induk = strukturNode_.find(function (x) { return x.id === nodeSedangDisunting_; });
            if (!induk) return;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast(res.message || 'Gagal menambah.'); return; }
                    tutupTugaskan();
                    showToast('Jabatan bawahan ditambahkan - klik kotaknya untuk mengisi.');
                    muatStrukturDariServer_();
                })

        /**
         * Membaca foto & MENGECILKANNYA sebelum disimpan.
         *
         * Sel Google Sheets punya batas 50.000 karakter. Foto kamera ponsel
         * jauh melewatinya, dan kalau dikirim apa adanya penyimpanan gagal
         * dengan pesan yang tidak menjelaskan apa-apa.
         */
        // ════════════════════════════════════════════════════════════════
        // PEMOTONG PASFOTO
        // ════════════════════════════════════════════════════════════════
        //
        // Dulu foto langsung dipotong dari TENGAH gambar. Untuk foto yang
        // wajahnya memang di tengah itu berhasil; untuk foto setengah badan,
        // foto miring, atau foto berlatar lebar, yang tersisa justru dada atau
        // bahu - dan tidak ada satu pun cara membetulkannya selain memotong
        // fotonya lebih dulu di aplikasi lain.
        //
        // Sekarang gambarnya ditampilkan lebih dulu di dalam bingkai persegi
        // yang bisa DIGESER & DIPERBESAR, persis seperti mengatur foto profil.
        // Pemotongan sebenarnya baru dilakukan saat ditekan Gunakan Foto.

        let potongGambar_ = null;      // objek Image sumber
        let potongSkala_ = 1;          // perbesaran terhadap ukuran "pas bingkai"
        let potongX_ = 0, potongY_ = 0; // pergeseran dalam piksel bingkai
        let potongSeret_ = null;

        const POTONG_BINGKAI = 260;    // sisi bingkai di layar (piksel)
        const POTONG_HASIL = 240;      // sisi gambar yang disimpan

        function pilihFotoPersonil_(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!/^image\//.test(file.type)) { showToast('Pilih berkas gambar (JPG/PNG).'); return; }

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () { bukaPemotongFoto_(img); };
                img.onerror = function () { showToast('Gambar tidak bisa dibaca.'); };
                img.src = e.target.result;
            };
            reader.onerror = function () { showToast('Berkas tidak bisa dibaca dari perangkat Anda.'); };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function bukaPemotongFoto_(img) {
            potongGambar_ = img;
            potongSkala_ = 1;
            potongX_ = 0;
            potongY_ = 0;

            let modal = document.getElementById('modal-potong-foto');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'modal-potong-foto';
                modal.className = 'fixed inset-0 z-[110] flex items-center justify-center p-4 modal-backdrop animate-fade-in';
                document.body.appendChild(modal);
            }
            modal.innerHTML =
                '<div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">' +
                    '<div class="px-6 py-4 bg-[#0c1d37] text-white">' +
                        '<h3 class="font-extrabold text-sm tracking-tight flex items-center gap-2">' +
                            '<i class="fa-solid fa-crop-simple text-[#d4af37]"></i><span>Atur Pasfoto</span></h3>' +
                        '<p class="text-[11px] text-slate-400 font-medium mt-0.5">Seret gambarnya untuk menggeser, lalu atur perbesaran.</p>' +
                    '</div>' +
                    '<div class="p-5 flex flex-col items-center">' +
                        '<div id="potong-bingkai" style="width:' + POTONG_BINGKAI + 'px;height:' + POTONG_BINGKAI + 'px" ' +
                             'class="relative rounded-2xl overflow-hidden bg-slate-900 cursor-move select-none touch-none ring-2 ring-[#d4af37]/60">' +
                            '<canvas id="potong-kanvas" width="' + POTONG_BINGKAI + '" height="' + POTONG_BINGKAI + '"></canvas>' +
                            // Panduan wajah: lingkaran tipis sebagai patokan,
                            // bukan pemotong. Hasil akhirnya tetap persegi.
                            '<div class="absolute inset-0 pointer-events-none flex items-center justify-center">' +
                                '<div class="w-[68%] h-[78%] rounded-full border-2 border-white/35"></div></div>' +
                        '</div>' +
                        '<div class="w-full mt-4">' +
                            '<label class="block text-[10px] font-extrabold text-slate-500 uppercase tracking-wider mb-1.5">Perbesaran</label>' +
                            '<input type="range" id="potong-zoom" min="100" max="300" value="100" ' +
                                'oninput="ubahZoomPotong_(this.value)" class="w-full accent-[#0c1d37] cursor-pointer">' +
                        '</div>' +
                        '<button onclick="pusatkanPotong_()" class="mt-2 text-[10px] font-bold text-slate-400 hover:text-[#0c1d37] transition">' +
                            '<i class="fa-solid fa-arrows-to-dot mr-1"></i>Kembalikan ke tengah</button>' +
                    '</div>' +
                    '<div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">' +
                        '<button onclick="tutupPemotongFoto_()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Batal</button>' +
                        '<button onclick="terapkanPotongFoto_()" class="px-5 py-2.5 bg-[#0c1d37] hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center gap-1.5">' +
                            '<i class="fa-solid fa-check text-[#d4af37]"></i><span>Gunakan Foto</span></button>' +
                    '</div>' +
                '</div>';

            pasangSeretPotong_();
            gambarPotong_();
        }

        function tutupPemotongFoto_() {
            const modal = document.getElementById('modal-potong-foto');
            if (modal) modal.remove();
            potongGambar_ = null;
        }

        function pusatkanPotong_() {
            potongX_ = 0; potongY_ = 0; potongSkala_ = 1;
            const z = document.getElementById('potong-zoom');
            if (z) z.value = 100;
            gambarPotong_();
        }

        function ubahZoomPotong_(nilai) {
            potongSkala_ = Math.max(1, Number(nilai) / 100);
            batasiGeserPotong_();
            gambarPotong_();
        }

        /**
         * Menjaga gambar tetap menutupi bingkai.
         *
         * Tanpa pembatasan ini, gambar bisa digeser sampai menyisakan bidang
         * kosong di tepi bingkai - dan bidang kosong itu ikut tersimpan sebagai
         * bagian pasfoto.
         */
        function batasiGeserPotong_() {
            const lebih = (POTONG_BINGKAI * potongSkala_ - POTONG_BINGKAI) / 2;
            potongX_ = Math.max(-lebih, Math.min(lebih, potongX_));
            potongY_ = Math.max(-lebih, Math.min(lebih, potongY_));
        }

        function gambarPotong_() {
            const kanvas = document.getElementById('potong-kanvas');
            if (!kanvas || !potongGambar_) return;
            const ctx = kanvas.getContext('2d');
            ctx.clearRect(0, 0, POTONG_BINGKAI, POTONG_BINGKAI);

            // Gambar diskalakan agar SISI TERPENDEKNYA pas bingkai ("cover"),
            // jadi tidak pernah ada tepi kosong pada perbesaran 100%.
            const dasar = Math.max(POTONG_BINGKAI / potongGambar_.width, POTONG_BINGKAI / potongGambar_.height);
            const s = dasar * potongSkala_;
            const w = potongGambar_.width * s;
            const h = potongGambar_.height * s;
            ctx.drawImage(potongGambar_, (POTONG_BINGKAI - w) / 2 + potongX_, (POTONG_BINGKAI - h) / 2 + potongY_, w, h);
        }

        function pasangSeretPotong_() {
            const bingkai = document.getElementById('potong-bingkai');
            if (!bingkai) return;

            // Pointer events dipakai supaya satu penanganan berlaku untuk
            // tetikus maupun sentuhan - tanpa menulis dua jalur terpisah.
            bingkai.addEventListener('pointerdown', function (e) {
                potongSeret_ = { x: e.clientX - potongX_, y: e.clientY - potongY_ };
                bingkai.setPointerCapture(e.pointerId);
            });
            bingkai.addEventListener('pointermove', function (e) {
                if (!potongSeret_) return;
                potongX_ = e.clientX - potongSeret_.x;
                potongY_ = e.clientY - potongSeret_.y;
                batasiGeserPotong_();
                gambarPotong_();
            });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
                bingkai.addEventListener(ev, function () { potongSeret_ = null; });
            });
        }

        function terapkanPotongFoto_() {
            if (!potongGambar_) { tutupPemotongFoto_(); return; }
            const kanvas = document.createElement('canvas');
            kanvas.width = POTONG_HASIL; kanvas.height = POTONG_HASIL;
            const ctx = kanvas.getContext('2d');

            // Perbandingan yang sama persis dengan yang terlihat di bingkai,
            // hanya dikalikan rasio ukuran simpan terhadap ukuran bingkai -
            // jadi hasilnya identik dengan pratinjaunya.
            const rasio = POTONG_HASIL / POTONG_BINGKAI;
            const dasar = Math.max(POTONG_BINGKAI / potongGambar_.width, POTONG_BINGKAI / potongGambar_.height);
            const s = dasar * potongSkala_ * rasio;
            const w = potongGambar_.width * s;
            const h = potongGambar_.height * s;
            ctx.drawImage(potongGambar_, (POTONG_HASIL - w) / 2 + potongX_ * rasio, (POTONG_HASIL - h) / 2 + potongY_ * rasio, w, h);

            const hasil = kanvas.toDataURL('image/jpeg', 0.82);
            document.getElementById('ps-foto-data').value = hasil;
            gambarPratinjauFoto_(hasil);
            tutupPemotongFoto_();
            showToast('Foto siap disimpan (' + Math.round(hasil.length / 1024) + ' KB).');
        }

        /**
         * Menyusun berkas HTML mandiri berisi bagan + daftar jabatan.
         * Dipakai bersama oleh Cetak & Unduh - satu sumber, jadi keduanya
         * mustahil menghasilkan tampilan yang berbeda.
         */
        /**
         * Ukuran bagan pada skala 1:1, apa pun skala yang sedang tampil.
         * Dipakai bersama oleh Cetak & Unduh - keduanya harus memakai angka
         * yang sama, kalau tidak hasilnya berbeda tanpa sebab yang jelas.
         * @return {{lebar:number, tinggi:number}}
         */
        function ukuranBaganAsli_() {
            const bagan = document.getElementById('struktur-bagan');
            const skala = document.getElementById('struktur-skala');
            if (!bagan || !skala) return { lebar: 1, tinggi: 1 };
            const simpan = { t: skala.style.transform, w: skala.style.width, h: skala.style.height };
            skala.style.transform = 'scale(1)';
            skala.style.width = 'max-content';
            skala.style.height = 'auto';
            const hasil = { lebar: Math.max(1, bagan.scrollWidth), tinggi: Math.max(1, bagan.scrollHeight) };
            skala.style.transform = simpan.t;
            skala.style.width = simpan.w;
            skala.style.height = simpan.h;
            return hasil;
        }

                // Math.floor, BUKAN ceil: satu piksel kelebihan sudah cukup

                '<div style="width:' + Math.floor(uk.lebar * skalaUnduh) + 'px;height:' +
                     Math.floor(uk.tinggi * skalaUnduh) + 'px;margin:12px auto 0;overflow:hidden">' +

                (hanyaBagan ? '' :

                    '<div style="page-break-before:always;break-before:page">' +

        /**
         * Mencetak bagan di jendela terpisah - A4 mendatar, diperkecil
         * otomatis supaya UTUH dalam satu halaman.
         *
         * ═══ AKAR MASALAH "TERPOTONG" ═══
         * Versi lama menyalin bagan ke jendela cetak pada UKURAN ASLI. Bagan
         * selebar ±2.000 piksel pada A4 mendatar yang hanya memuat ±1.040
         * piksel otomatis terpenggal di tepi kanan, & cabang terbawah hilang
         * di tepi bawah. Tidak ada setelan printer yang bisa menyelamatkannya
         * karena halamannya memang sudah lebih kecil daripada isinya.
         *
         * Sekarang skalanya dihitung DI SINI - tempat ukuran sebenarnya bisa
         * diukur - lalu ditanam ke dalam HTML cetak sebagai transform tetap.
         * Jendela cetak tidak perlu mengukur apa pun.
         *
         * Tetap lewat jendela terpisah, bukan mencetak halaman ini langsung:
         * aplikasi berjalan di dalam iframe Apps Script, & perilaku
         * window.print() dari dalam iframe berbeda-beda antar peramban.
         * Cara ini sudah terbukti bekerja.
         */
        function cetakStruktur() {
            const html = susunHtmlBagan_();
            if (!html) { showToast('Bagan belum siap.'); return; }

            const win = window.open('', '_blank',
                'width=' + screen.availWidth + ',height=' + screen.availHeight + ',left=0,top=0');
            if (!win) { showToast('Popup diblokir browser - izinkan popup untuk mencetak.'); return; }
            win.document.write(html);
            win.document.close();
            win.onload = function () {
                try { win.moveTo(0, 0); win.resizeTo(screen.availWidth, screen.availHeight); } catch (e) { /* sebagian browser menolak - diabaikan */ }
                win.focus();
                setTimeout(function () { win.print(); }, 700);
            };
            showToast('Pastikan orientasi Landscape, lalu pilih "Save as PDF" atau printer.');
        }

        // ─── KODE PENGESAHAN (QR) ────────────────────────────────────────
        //
        // Dibuat dari isi serah terima itu sendiri, bukan tautan ke sistem -
        // supaya tetap bisa diperiksa dari lembar cetak, termasuk oleh orang
        // yang tidak punya akses aplikasi.

        function isiQrSerah_() {
            const d = kumpulkanFormSerah_();
            return [
                'SERAH TERIMA DINASAN MONITORING - PT KCI',
                'Nomor  : ' + d.nomorDokumen,

            ].join('\n');

        /** Menggambar QR. Dilewati dengan tenang bila pustakanya belum dimuat. */
        function gambarQrSerah_() {
            const wadah = document.getElementById('serah-qr');
            if (!wadah) return;
            if (typeof QRCode === 'undefined') {
                wadah.innerHTML = '<p class="text-[10px] text-slate-400 font-bold p-4 text-center">' +

            try {
                new QRCode(wadah, {

                    correctLevel: QRCode.CorrectLevel.M

                console.log('gambarQrSerah_ dilewati:', err);

        }

        /** Mengambil QR sebagai gambar untuk disisipkan ke lembar cetak. */
        /** Satu sel tanda tangan pada lembar cetak - QR menggantikan tanda tangan basah. */
        function selTtd_(judul, orang, qr) {
            return '<td style="width:50%;padding:8px;border:1px solid #cbd5e1;vertical-align:top">' +
                '<b>' + judul + '</b>' +
                '<div style="text-align:center;margin:6px 0">' +
                    (qr
                        ? '<img src="' + qr + '" style="width:74px;height:74px">' +
                          '<div style="font-size:6px;color:#64748b;margin-top:1px">Tanda tangan digital &mdash; pindai untuk profil &amp; pasfoto</div>'
                        : '<div style="height:74px;line-height:74px;font-size:6.5px;color:#94a3b8">(QR tidak tersedia)</div>') +
                '</div>' +
                'Nama Lengkap : <b>' + escapeHtml(orang.nama || '-') + '</b><br>' +
                'NIPP / NIK : ' + escapeHtml(orang.nipp || '-') + '<br>' +
                'Jabatan : ' + escapeHtml(orang.jabatan || '-') + '</td>';
        }

        /**
         * Membuat QR seorang petugas untuk lembar cetak.
         *
         * TIDAK membaca kotak QR di formulir: saat mencetak dari Laporan
         * Dinasan, kotak itu berisi petugas yang sedang diketik di formulir,
         * bukan petugas pada laporan yang dicetak - hasilnya tanda tangan
         * milik orang lain. Karena itu QR-nya dibuat ulang dari data laporan
         * yang bersangkutan, pada elemen sementara di luar layar.
         */
        function qrPetugasDataUrl_(orang) {
            if (!orang || typeof QRCode === 'undefined') return '';
            const nipp = String(orang.nipp || '').trim();
            const nama = String(orang.nama || '').trim();
            if (!nipp && !nama) return '';

            const p = (personilStruktur_ || []).find(function (x) {
                return (nipp && String(x.nik || '').trim() === nipp) ||
                       (nama && String(x.nama || '').trim().toUpperCase() === nama.toUpperCase());
            });

            const isi = (p && URL_APLIKASI)
                ? URL_APLIKASI + '?kartu=' + encodeURIComponent(p.id)
                : ['KCI-DINASAN', nama, nipp, orang.jabatan || ''].filter(Boolean).join(' | ');

            const tmp = document.createElement('div');
            tmp.style.cssText = 'position:absolute;left:-9999px;top:0';
            document.body.appendChild(tmp);
            let hasil = '';
            try {
                new QRCode(tmp, { text: isi, width: 148, height: 148, colorDark: '#0c1d37', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
                const img = tmp.querySelector('img');
                const canvas = tmp.querySelector('canvas');
                if (img && img.src) hasil = img.src;
                else if (canvas) hasil = canvas.toDataURL('image/png');
            } catch (err) {
                console.log('qrPetugasDataUrl_ dilewati:', err);
            }
            tmp.remove();
            return hasil;
        }

        function qrSerahDataUrl_() {
            const img = document.querySelector('#serah-qr img');
            if (img && img.src) return img.src;
            const canvas = document.querySelector('#serah-qr canvas');
            if (canvas) { try { return canvas.toDataURL('image/png'); } catch (e) { return ''; } }
            return '';
        }


        // ─── PETUGAS DARI STRUKTUR ORGANISASI (D5) ───────────────────────
        //
        // Nama dipilih dari daftar personil Struktur Organisasi; NIPP &
        // jabatan terisi sendiri. Mengetiknya ulang hanya membuka peluang
        // salah ketik pada data yang sebenarnya sudah ada di sistem.

        let personilStruktur_ = [];
        let URL_APLIKASI = '';   // diisi dari server saat form dibuka

        function muatPersonilStruktur_() {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) return;
                    personilStruktur_ = res.personil || [];
                    // URL dipakai menyusun tautan QR kartu petugas.
                    google.script.run
                        // Alamat aplikasi tiba BELAKANGAN, dan tanpanya QR
                        // hanya berisi teks. Penguncian petugas diulang begitu
                        // alamatnya ada supaya QR-nya benar-benar mengarah ke
                        // kartu petugas, bukan sekadar teks identitas.
                        .withSuccessHandler(function (u) { URL_APLIKASI = u || ''; terapkanPetugasAkun_(); })
                        .withFailureHandler(function () { /* QR memakai teks biasa - tetap berguna */ })
                        .getUrlAplikasi();
                    ['dari', 'ke'].forEach(function (sisi) {
                        const sel = document.getElementById('serah-' + sisi + '-pilih');
                        if (!sel) return;
                        sel.innerHTML = '<option value="">- Pilih dari Struktur Organisasi -</option>' +
                            personilStruktur_.map(function (p) {
                                return '<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.nama) +
                                    (p.nik ? ' (' + escapeHtml(p.nik) + ')' : '') + '</option>';
                            }).join('');
                    });
                    // Daftar personil baru tiba SETELAH resetFormSerah, jadi
                    // pencocokan akun ke Struktur Organisasi diulang di sini -
                    // tanpa ini, kolom petugas ADMIN_TRAFFIC tidak pernah
                    // terkunci & QR-nya tidak pernah terbentuk.
                    terapkanPetugasAkun_();
                })
                .withFailureHandler(function () { /* pengisian manual tetap bisa - diabaikan */ })
                .struktur_getAll(currentSessionToken);
        }

        function pilihPetugasDinasan_(sisi) {
            const id = document.getElementById('serah-' + sisi + '-pilih').value;
            const p = personilStruktur_.find(function (x) { return x.id === id; });
            if (!p) return;

            // Dipilih sendiri dari daftar - tandai supaya pengisian otomatis
            // dari rantai dinasan tidak menimpanya belakangan.
            if (sisi === 'dari') petugasDariManual_ = true;

            document.getElementById('serah-' + sisi + '-nama').value = p.nama || '';
            document.getElementById('serah-' + sisi + '-nipp').value = p.nik || '';
            document.getElementById('serah-' + sisi + '-jabatan').value = p.jabatan || '';

            // ═══ PASFOTO TIDAK LAGI DITAMPILKAN ═══
            // Sebelumnya foto petugas muncul di sebelah QR. Sekarang hanya QR:
            // fotonya baru terlihat setelah dipindai, di halaman kartu petugas.
            // Lembar ini dicetak & dibagikan, dan foto yang ikut tercetak
            // menyebar ke mana pun lembarnya pergi - sementara QR mengambil
            // foto langsung dari Struktur Organisasi setiap kali dipindai,
            // jadi selalu yang terbaru & tidak tertinggal di atas kertas.
            gambarQrPetugas_(sisi, p);
            gambarQrSerah_();
        }

        /** Isi kotak QR saat belum ada petugas terpilih. */
        function kosongkanQrPetugas_(sisi) {
            const wadah = document.getElementById('qr-' + sisi);
            if (!wadah) return;
            wadah.innerHTML =
                '<div class="text-center px-2">' +
                    '<i class="fa-solid fa-qrcode text-slate-200 text-3xl"></i>' +
                    '<p class="text-[9px] font-bold text-slate-300 mt-1.5 leading-tight">Pilih petugas<br>untuk membuat QR</p>' +
                '</div>';
        }

        /** QR identitas per petugas - dipindai untuk memastikan yang bertugas. */
        function gambarQrPetugas_(sisi, p) {
            const wadah = document.getElementById('qr-' + sisi);
            if (!wadah) return;
            if (typeof QRCode === 'undefined') { wadah.innerHTML = ''; return; }

            // ═══ ISI QR ═══
            // Yang dipindai adalah TAUTAN ke halaman identitas petugas, bukan
            // teks biasa - dengan begitu pemindai ponsel membukanya sebagai
            // halaman & FOTO petugas bisa ditampilkan, mewakili tanda tangan.
            //
            // Foto tidak bisa ditaruh langsung di dalam QR: data URL foto
            // berukuran puluhan ribu karakter, sementara QR hanya memuat
            // sekitar 2.900 karakter. Karena itu yang disimpan tautannya.
            const alamat = (typeof URL_APLIKASI !== 'undefined' && URL_APLIKASI)
                ? URL_APLIKASI + '?kartu=' + encodeURIComponent(p.id)
                : '';
            const isi = alamat || [
                'PETUGAS MONITORING - PT KCI',
                'Nama    : ' + (p.nama || '-'),
                'NIPP/NIK: ' + (p.nik || '-'),
                'Jabatan : ' + (p.jabatan || '-')
            ].join('\n');

            wadah.innerHTML = '';
            try {
                // Diperbesar dari 78px ke 112px (6 September 2026): QR ini kini
                // satu-satunya cara melihat pasfoto petugas, jadi harus tetap
                // terbaca pemindai ponsel setelah lembarnya dicetak.
                new QRCode(wadah, {
                    text: isi, width: 112, height: 112,
                    colorDark: '#0c1d37', colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (err) { console.log('gambarQrPetugas_ dilewati:', err); }

            // Kalau URL aplikasi belum terbaca, QR hanya berisi teks identitas -
            // masih berguna, tapi TIDAK akan menampilkan foto saat dipindai.
            // Itu perlu dikatakan, bukan dibiarkan jadi kejutan di lapangan.
            if (!alamat) {
                wadah.insertAdjacentHTML('beforeend',
                    '<p class="text-[8px] font-bold text-amber-600 leading-tight px-1 text-center mt-1">Tanpa foto &mdash; alamat aplikasi belum terbaca</p>');
            }
        }

        // ─── PARAMETER SITUASI LINTAS (D6) ───────────────────────────────
        //
        // Pilihannya bisa ditambah/dikurangi, tapi HANYA oleh Administrator &
        // Super Admin - kalau semua petugas bisa mengubahnya, istilah yang
        // dipakai akan berbeda-beda antar-shift dan rekapnya jadi tidak
        // sebanding.

        const SITUASI_BAWAAN = ['Lancar', 'Terganggu', 'Padat'];
        let situasiLintas_ = SITUASI_BAWAAN.slice();

        function muatParameterSituasi_() {
            const dl = document.getElementById('datalist-situasi');
            const isiDatalist = function () {
                if (dl) dl.innerHTML = situasiLintas_.map(function (v) {
                    return '<option value="' + escapeHtml(v) + '">';
                }).join('');
            };
            isiDatalist();

            // Tombol kelola hanya untuk role yang berhak.
            const btn = document.getElementById('btn-kelola-situasi');
            if (btn) {
                const boleh = (typeof currentUser !== 'undefined' && currentUser &&
                    ['SUPERADMIN', 'ADMINISTRATOR'].indexOf(String(currentUser.roleId || '').toUpperCase()) !== -1);
                btn.style.display = boleh ? '' : 'none';
            }

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.success && (res.data || []).length) {
                        situasiLintas_ = res.data;

                .withFailureHandler(function () { /* pakai bawaan - diabaikan */ })
                .dinasan_getParameterSituasi(currentSessionToken);
