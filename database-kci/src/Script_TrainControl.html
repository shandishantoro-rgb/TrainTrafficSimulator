        function bukaKelolaSituasi() {
            const daftar = situasiLintas_.join('\n');
            const modal = document.getElementById('modal-kelola-situasi');
            if (!modal) return;
            document.getElementById('ks-daftar').value = daftar;
            modal.classList.remove('hidden');
        }

        function tutupKelolaSituasi() {
            document.getElementById('modal-kelola-situasi').classList.add('hidden');
        }

        function simpanKelolaSituasi() {
            const isi = document.getElementById('ks-daftar').value
                .split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
            if (!isi.length) { showToast('Isi minimal satu pilihan situasi.'); return; }

            const btn = document.getElementById('btn-ks-simpan');
            const asli = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan...</span>';

            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false; btn.innerHTML = asli;
                    if (!res.success) { showToast(res.message || 'Gagal menyimpan.'); return; }
                    situasiLintas_ = isi;
                    muatParameterSituasi_();
                    tutupKelolaSituasi();
                    showToast(isi.length + ' pilihan situasi lintas disimpan.');
                })
                .withFailureHandler(function () { btn.disabled = false; btn.innerHTML = asli; showToast('Terjadi kesalahan.'); })
                .dinasan_setParameterSituasi(currentSessionToken, isi);
        }


        // ─── SKALA BAGAN, TUPOKSI, & UNDUH (S2/S3/S4) ────────────────────

        let skalaBagan_ = 1;

        /**
         * Mengecilkan bagan agar muat selebar layar.
         *
         * Untuk bagan organisasi, melihat keseluruhannya sekaligus justru
         * inti gunanya - menggeser kanan-kiri membuat hubungan antar-jabatan
         * sulit ditangkap. Karena itu skalanya menyesuaikan sendiri, dan
         * hanya mengecilkan (tidak pernah membesarkan melebihi 100%) supaya
         * bagan kecil tidak jadi kabur.
         */
        function sesuaikanSkalaBagan_(paksa) {
            const wadah = document.getElementById('struktur-wadah');
            const skala = document.getElementById('struktur-skala');
            const bagan = document.getElementById('struktur-bagan');
            if (!wadah || !skala || !bagan) return;

            // Dikembalikan ke ukuran penuh dulu supaya yang terukur adalah
            // lebar SEBENARNYA, bukan lebar yang sudah terpengaruh skala &
            // lebar tetap dari pemanggilan sebelumnya.
            skala.style.transform = 'scale(1)';
            skala.style.width = 'max-content';

            const lebarIsi = bagan.scrollWidth;
            const tinggiIsi = bagan.scrollHeight;
            // Panggung berpadding 24px di tiap sisi (lihat CSS). Dulu hanya
            // 8px yang dikurangi, sehingga "pas ke lebar" selalu menyisakan
            // bilah gulir mendatar walau bagannya sudah dikecilkan.
            const SELA = 48;
            const lebarWadah = wadah.clientWidth - SELA;
            if (lebarIsi < 1 || lebarWadah < 1) return;

            // ═══ DI LAYAR PENUH, TINGGI IKUT DIPERHITUNGKAN ═══
            // Di dalam kartu, bagan hanya perlu muat MELEBAR - tingginya
            // bebas karena halamannya bisa digulir. Di layar penuh tidak
            // begitu: seluruh bagan harus terlihat sekaligus, & itulah satu-
            // satunya alasan tombol ini ada.
            //
            // Dulu skalanya tetap dihitung dari lebar saja, sehingga bagan
            // yang tinggi tetap terpotong di bawah - persis keluhan "dimensinya
            // belum satu layar penuh". Sekarang diambil yang paling ketat di
            // antara muat-lebar & muat-tinggi.
            if (baganLayarPenuh_) {
                const tinggiTersedia = window.innerHeight - wadah.getBoundingClientRect().top - SELA;
                const muatLebar = lebarWadah / lebarIsi;
                const muatTinggi = (tinggiTersedia > 40 && tinggiIsi > 0)
                    ? tinggiTersedia / tinggiIsi : muatLebar;
                skalaBagan_ = Math.min(1, muatLebar, muatTinggi);
                if (skalaBagan_ < 0.25) skalaBagan_ = 0.25;   // batas bawah lebih longgar di layar penuh
            } else {
                skalaBagan_ = Math.min(1, lebarWadah / lebarIsi);
                if (skalaBagan_ < 0.4) skalaBagan_ = 0.4;    // di bawah ini tidak terbaca lagi
            }
            terapkanSkalaBagan_();
        }

        function zoomBagan_(delta) {
            skalaBagan_ = Math.min(1.6, Math.max(0.4, skalaBagan_ + delta));
            terapkanSkalaBagan_();
        }

        function terapkanSkalaBagan_() {
            const skala = document.getElementById('struktur-skala');
            const wadah = document.getElementById('struktur-wadah');
            const bagan = document.getElementById('struktur-bagan');
            if (!skala) return;
            // Ukur SEBELUM menyetel lebar tetap, kalau tidak yang terukur
            // adalah hasil setelan sebelumnya.
            skala.style.width = 'max-content';
            const lebarAsli = bagan.scrollWidth;
            const tinggiAsli = bagan.scrollHeight;

            skala.style.transformOrigin = 'top left';
            skala.style.transform = 'scale(' + skalaBagan_ + ')';

            // ═══ KENAPA LEBARNYA DISETEL TANGAN ═══
            // transform TIDAK mengubah ukuran yang diperhitungkan tata letak:
            // bagi induknya, elemen ini tetap selebar aslinya. Tanpa penyetelan
            // ini, mengecilkan bagan tetap menyisakan bilah gulir sepanjang
            // ukuran penuh, dan memusatkannya menjadi mustahil.
            skala.style.width = Math.ceil(lebarAsli * skalaBagan_) + 'px';
            skala.style.height = Math.ceil(tinggiAsli * skalaBagan_) + 'px';

            // Tinggi wadah ikut menyesuaikan; tanpa ini, mengecilkan bagan
            // menyisakan ruang kosong sebesar ukuran aslinya.
            //
            // Di layar penuh, wadahnya justru harus MENGISI sisa layar - kalau
            // tingginya dipatok mengikuti isi, bagian bawah layar tersisa
            // putih & bagannya menggantung di atas, seperti pada tangkapan
            // layar yang Anda kirim.
            // ═══ TINGGI PANGGUNG: TETAP, BUKAN MENGIKUTI ISI ═══
            // Dulu tingginya dipatok sebesar isi, sehingga tidak pernah ada
            // yang bisa digeser tegak: memperbesar bagan hanya memanjangkan
            // halaman, & cabang terbawah harus dicari dengan menggulir
            // SELURUH halaman, bukan bagannya.
            //
            // Dengan tinggi tetap, bagan punya "panggung" sendiri - digeser
            // ke empat arah di dalamnya (lihat pasangGeserBagan_), & tata
            // letak halaman di sekitarnya tidak ikut melompat tiap kali
            // skalanya diubah.
            if (wadah) {
                wadah.style.display = 'flex';
                wadah.style.alignItems = '';
                wadah.style.justifyContent = '';
                if (baganLayarPenuh_) {
                    const atas = wadah.getBoundingClientRect().top;
                    wadah.style.height = Math.max(240, window.innerHeight - atas) + 'px';
                } else {
                    // Mengikuti tinggi layar dalam batas wajar: di laptop
                    // pendek panggung tidak menelan seluruh halaman, di layar
                    // besar ia tidak menyisakan ruang kosong yang sia-sia.
                    const ideal = Math.round(window.innerHeight * 0.62);
                    wadah.style.height = Math.max(420, Math.min(760, ideal)) + 'px';
                }
            }

            pasangGeserBagan_();

            const label = document.getElementById('bagan-persen');
            if (label) label.textContent = Math.round(skalaBagan_ * 100) + '%';
        }

        // ═══════════════════════════════════════════════════════════════
        // MENGGESER BAGAN (pan) - tekan & seret ke segala arah
        // ═══════════════════════════════════════════════════════════════
        //
        // Hanya untuk TETIKUS & PENA. Pada layar sentuh, geser bawaan
        // peramban sudah mengerjakan hal yang sama dengan lebih baik
        // (termasuk inersia); ikut menanganinya hanya akan saling berebut
        // dengan gerakan jari - lihat `touch-action: pan-x pan-y` di CSS.

        let baganSeret_ = null;
        let baganAbaikanKlik_ = false;

        function pasangGeserBagan_() {
            const w = document.getElementById('struktur-wadah');
            if (!w || w.dataset.geserSiap === '1') return;
            w.dataset.geserSiap = '1';

            w.addEventListener('pointerdown', function (e) {
                if (e.pointerType === 'touch') return;
                if (e.button !== 0) return;                       // hanya tombol kiri
                // Menyeret dari dalam kotak jabatan tetap boleh - justru itu
                // yang paling sering dipakai. Klik-nya dibatalkan belakangan
                // bila ternyata jadi seretan.
                baganSeret_ = {
                    x: e.clientX, y: e.clientY,
                    kiri: w.scrollLeft, atas: w.scrollTop,
                    jadi: false, id: e.pointerId
                };
            });

            w.addEventListener('pointermove', function (e) {
                if (!baganSeret_ || baganSeret_.id !== e.pointerId) return;
                const dx = e.clientX - baganSeret_.x;
                const dy = e.clientY - baganSeret_.y;

                // Ambang 6 piksel: tanpa ini, getaran kecil saat mengklik
                // sudah dihitung sebagai seretan & kotaknya tidak pernah
                // bisa dibuka.
                if (!baganSeret_.jadi) {
                    if (Math.abs(dx) + Math.abs(dy) < 6) return;
                    baganSeret_.jadi = true;
                    w.classList.add('sedang-geser');
                    tipTupoksiKeluar_();                          // tooltip tidak ikut menempel
                    try { w.setPointerCapture(e.pointerId); } catch (err) { /* diabaikan */ }
                }
                w.scrollLeft = baganSeret_.kiri - dx;
                w.scrollTop = baganSeret_.atas - dy;
                e.preventDefault();
            });

            const selesaiSeret = function () {
                if (!baganSeret_) return;
                if (baganSeret_.jadi) baganAbaikanKlik_ = true;
                try { w.releasePointerCapture(baganSeret_.id); } catch (err) { /* diabaikan */ }
                baganSeret_ = null;
                w.classList.remove('sedang-geser');
            };
            w.addEventListener('pointerup', selesaiSeret);
            w.addEventListener('pointercancel', selesaiSeret);

            // Penghadang klik pada tahap CAPTURE - berjalan sebelum onclick
            // kotak jabatan. Memakai setTimeout untuk membersihkan penanda
            // tidak dapat diandalkan: urutan pointerup -> click terjadi dalam
            // satu rangkaian, & modal penugasan bisa keburu terbuka setiap
            // kali bagan digeser.
            w.addEventListener('click', function (e) {
                if (!baganAbaikanKlik_) return;
                baganAbaikanKlik_ = false;
                e.stopPropagation();
                e.preventDefault();
            }, true);

            // Ctrl + roda tetikus = perbesar/perkecil, kebiasaan yang sudah
            // umum di aplikasi berkanvas. Tanpa Ctrl, rodanya tetap menggeser
            // seperti biasa.
            w.addEventListener('wheel', function (e) {
                if (!e.ctrlKey) return;
                e.preventDefault();
                zoomBagan_(e.deltaY < 0 ? 0.08 : -0.08);
            }, { passive: false });
        }


        // ═══════════════════════════════════════════════════════════════
        // TOOLTIP TUPOKSI SAAT KOTAK DISOROT
        // ═══════════════════════════════════════════════════════════════

        let tipTupoksiJeda_ = null;

        function tipTupoksiMasuk_(ev, nodeId) {
            // Saat bagan sedang diseret, tooltip hanya akan berkedip
            // mengikuti kotak yang terlewati.
            if (baganSeret_ && baganSeret_.jadi) return;

            clearTimeout(tipTupoksiJeda_);
            const kotak = ev.currentTarget;
            // Jeda singkat: tanpa ini, menyapukan tetikus melintasi bagan
            // memunculkan selusin tooltip beruntun.
            tipTupoksiJeda_ = setTimeout(function () { tipTupoksiGambar_(kotak, nodeId); }, 280);
        }

        function tipTupoksiKeluar_() {
            clearTimeout(tipTupoksiJeda_);
            const tip = document.getElementById('tupoksi-tip');
            if (tip) tip.classList.add('hidden');
        }

        function tipTupoksiGambar_(kotak, nodeId) {
            const tip = document.getElementById('tupoksi-tip');
            const n = strukturNode_.find(function (x) { return x.id === nodeId; });
            if (!tip || !n || !kotak || !document.body.contains(kotak)) return;

            const orang = cariPersonil_(n.personilId);
            const rantai = rantaiTupoksi_(nodeId);

            document.getElementById('tip-peran').textContent =
                (orang && orang.jabatan ? orang.jabatan : n.peran) || 'Jabatan belum dinamai';
            document.getElementById('tip-orang').textContent =
                (orang ? orang.nama : 'Belum ada personil') + (n.subPeran ? ' · ' + n.subPeran : '');

            let isi;
            if (!rantai.length) {
                isi = '<p class="text-[10.5px] text-slate-400 font-semibold italic leading-relaxed">' +
                      'Tupoksi belum diisi. Klik kotak ini, lalu isi kolom ' +
                      '<span class="text-[#d4af37] not-italic font-black">Tugas Pokok &amp; Fungsi</span>.</p>';
            } else {
                // Dibatasi 6 butir milik sendiri + ringkasan turunan. Tooltip
                // yang sepanjang satu layar tidak lagi berguna sebagai
                // tooltip - untuk itu ada tombol info yang membuka modal.
                const sendiri = rantai[rantai.length - 1];
                const milikSendiri = sendiri && sendiri.peran === n.peran ? sendiri : null;
                const butir = milikSendiri
                    ? String(milikSendiri.tupoksi).split('\n').map(function (x) { return x.trim(); }).filter(Boolean)
                    : [];
                const tampil = butir.slice(0, 6);
                const sisa = butir.length - tampil.length;
                const jmlTurunan = rantai.length - (milikSendiri ? 1 : 0);

                isi = tampil.length
                    ? '<ul class="space-y-1.5">' + tampil.map(function (b) {
                        return '<li class="flex items-start gap-2 text-[10.5px] font-semibold text-slate-100 leading-snug">' +
                               '<i class="fa-solid fa-circle text-[3px] mt-[6px] text-[#d4af37] shrink-0"></i>' +
                               '<span>' + escapeHtml(b) + '</span></li>';
                      }).join('') + '</ul>'
                    : '<p class="text-[10.5px] text-slate-400 font-semibold italic">Tupoksi jabatan ini belum diisi.</p>';

                const kaki = [];
                if (sisa > 0) kaki.push('+' + sisa + ' butir lagi');
                if (jmlTurunan > 0) kaki.push(jmlTurunan + ' tupoksi turunan dari atasan');
                if (kaki.length) {
                    isi += '<p class="mt-2 pt-2 border-t border-white/10 text-[9px] font-black text-slate-400 uppercase tracking-wider">' +
                           kaki.join(' · ') + ' · klik ikon info</p>';
                }
            }
            document.getElementById('tip-isi').innerHTML = isi;

            // ── Penempatan ──
            // Ditampilkan dulu (tapi tak terlihat) supaya tingginya terukur;
            // menempatkan sebelum diukur akan selalu meleset untuk tooltip
            // yang tingginya berbeda-beda.
            tip.classList.remove('hidden');
            tip.style.visibility = 'hidden';
            tip.style.left = '0px';
            tip.style.top = '0px';

            const k = kotak.getBoundingClientRect();
            const t = tip.getBoundingClientRect();
            const sela = 10;

            // Kanan kotak bila muat; kalau tidak, kiri; kalau dua-duanya
            // sempit, dirapatkan ke tepi layar.
            let x = k.right + sela;
            if (x + t.width > window.innerWidth - 8) x = k.left - t.width - sela;
            if (x < 8) x = Math.max(8, Math.min(window.innerWidth - t.width - 8, k.left));

            let y = k.top + (k.height / 2) - (t.height / 2);
            if (y < 8) y = 8;
            if (y + t.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - t.height - 8);

            tip.style.left = Math.round(x) + 'px';
            tip.style.top = Math.round(y) + 'px';
            tip.style.visibility = 'visible';
        }


        /** Pratinjau butir tupoksi di formulir - lihat Pane_TcStruktur.html. */
        function pratinjauTupoksi_() {
            const ta = document.getElementById('tg-tupoksi');
            const wadah = document.getElementById('tg-tupoksi-pratinjau');
            const hitung = document.getElementById('tg-tupoksi-hitung');
            if (!ta || !wadah) return;

            const butir = String(ta.value || '').split('\n')
                .map(function (x) { return x.trim(); }).filter(Boolean);

            if (hitung) hitung.textContent = butir.length + ' butir';

            if (!butir.length) {
                wadah.innerHTML = '<p class="text-[10px] text-slate-300 font-semibold italic">Belum ada tugas yang ditulis.</p>';
                return;
            }
            wadah.innerHTML = '<ul class="space-y-1">' + butir.map(function (b, i) {
                return '<li class="flex items-start gap-2 text-[10.5px] font-semibold text-slate-700 leading-snug">' +
                       '<span class="text-[9px] font-black text-[#d4af37] shrink-0 mt-[1px]">' + (i + 1) + '.</span>' +
                       '<span>' + escapeHtml(b) + '</span></li>';
            }).join('') + '</ul>';
        }

        /** Rangkaian tupoksi dari jabatan tertinggi sampai jabatan ini. */
        function rantaiTupoksi_(nodeId) {
            const rantai = [];
            let kini = strukturNode_.find(function (x) { return x.id === nodeId; });
            while (kini) {
                if (String(kini.tupoksi || '').trim()) {
                    rantai.unshift({ peran: kini.peran, subPeran: kini.subPeran, tupoksi: kini.tupoksi });
                }
                kini = kini.indukId ? strukturNode_.find(function (x) { return x.id === kini.indukId; }) : null;
            }
            return rantai;
        }

        function bukaTupoksi(nodeId) {
            const n = strukturNode_.find(function (x) { return x.id === nodeId; });
            if (!n) return;
            const rantai = rantaiTupoksi_(nodeId);
            const orang = cariPersonil_(n.personilId);

            const isi = rantai.length
                ? rantai.map(function (r, i) {
                    const milikSendiri = (i === rantai.length - 1 && r.peran === n.peran);
                    const butir = String(r.tupoksi).split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
                    return '<div class="p-3 rounded-xl border ' +
                        (milikSendiri ? 'bg-[#0c1d37] border-[#0c1d37] text-white' : 'bg-slate-50 border-slate-200') + '">' +
                        '<p class="text-[10px] font-black uppercase tracking-wider ' +
                            (milikSendiri ? 'text-[#d4af37]' : 'text-slate-400') + '">' +
                            escapeHtml(r.peran) + (r.subPeran ? ' \u00B7 ' + escapeHtml(r.subPeran) : '') +
                            (milikSendiri ? '' : ' (turunan)') + '</p>' +
                        '<ul class="mt-1.5 space-y-1">' + butir.map(function (b) {
                            return '<li class="text-[11px] font-semibold flex items-start gap-1.5 ' +
                                (milikSendiri ? 'text-white' : 'text-slate-700') + '">' +
                                '<i class="fa-solid fa-circle text-[3px] mt-1.5 ' +
                                (milikSendiri ? 'text-[#d4af37]' : 'text-slate-300') + '"></i>' +
                                '<span>' + escapeHtml(b) + '</span></li>';
                        }).join('') + '</ul></div>';
                }).join('')
                : '<p class="text-[11px] text-slate-400 font-bold py-6 text-center italic">' +
                  'Tupoksi belum diisi. Klik kotak jabatan lalu isi kolom Tugas Pokok &amp; Fungsi.</p>';

            document.getElementById('tp-judul').textContent = n.peran || 'Tupoksi';
            document.getElementById('tp-subjudul').textContent =
                (orang ? orang.nama : '(belum diisi)') + (n.subPeran ? ' \u00B7 ' + n.subPeran : '');
            document.getElementById('tp-isi').innerHTML = isi;
            document.getElementById('modal-tupoksi').classList.remove('hidden');
        }

        function tutupTupoksi() { document.getElementById('modal-tupoksi').classList.add('hidden'); }

        /**
         * Mengunduh HANYA bagan organisasi - satu halaman mendatar penuh.
         * Daftar jabatan sengaja tidak ikut: lembar ini dipakai untuk
         * ditempel & dipaparkan, bukan dibaca baris per baris.
         */
        function unduhBagan() {
            const html = susunHtmlBagan_(true);
            if (!html) { showToast('Bagan belum siap.'); return; }
            try {
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'Struktur_Organisasi_COTP_' + hariIniIso_() + '.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
                showToast('Bagan diunduh - bisa dibuka di browser mana pun.');
            } catch (err) {
                console.log('unduhBagan error:', err);
                showToast('Gagal mengunduh bagan.');
            }
        }

        // REALISASI ROSTER - dilebur ke "Prog & Real Jadwal Dinasan" (v2026.10.13)

        // Tabel realisasi terpisah (loadRosterRealisasi dkk.) dicabut. Ia

        // ════════════════════════════════════════════════════════════════
        // RESUME LAPORAN (menu tc-resume)
        // ════════════════════════════════════════════════════════════════
        //
        // Menggabungkan isi seluruh serah terima dalam satu rentang tanggal.
        // Penyaringan & penggabungan induk-anak dikerjakan di server
        // (dinasan_getResume) - satu bulan bisa berisi 90 serah terima dengan
        // ratusan baris KLB, dan mengirim semuanya ke browser untuk disaring
        // di sini berarti memindahkan data yang sebagian besar tidak dipakai.

        let resumeData_ = null;
        let resumeRentang_ = '';

        function loadResume(paksa) {
            const elDari = document.getElementById('resume-dari');
            const elSampai = document.getElementById('resume-sampai');
            if (!elDari || !elSampai) return;

            // Bawaan: bulan berjalan. Rekap tanpa rentang apa pun akan menarik
            // seluruh riwayat sejak hari pertama - lambat, dan hampir tidak
            // pernah itu yang dicari saat menu baru dibuka.
            if (!elDari.value || !elSampai.value) resumeRentangCepat_('bulan', true);

            // Resume SELALU 'selesai'. Pilihan Status Laporan sudah dihapus
            // dari tampilan: satu-satunya pintu masuk ke menu ini adalah
            // tombol Close Laporan di Serah Terima Dinasan. Nilainya tetap
            // dikirim ke server supaya dinasan_getResume tidak perlu diubah.
            const elUrutan = document.getElementById('resume-urutan');
            const saring = 'selesai';
            const urutan = (elUrutan && elUrutan.value) || 'lama';

            const kunci = [elDari.value, elSampai.value, saring, urutan].join('|');
            if (!paksa && resumeData_ && resumeRentang_ === kunci) { gambarResume_(); return; }

            const isi = document.getElementById('resume-isi');
            if (isi) isi.innerHTML = '<div class="bg-white rounded-2xl border border-slate-200 py-14 text-center text-slate-400 font-bold text-xs">' +
                '<i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#0c1d37]"></i>Mengumpulkan laporan...</div>';

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) {
                        showToast('Gagal memuat resume: ' + ((res && res.message) || ''));
                        if (isi) isi.innerHTML = '';
                        return;
                    }
                    resumeData_ = res;
                    resumeRentang_ = kunci;
                    gambarResume_();
                })
                .withFailureHandler(function () {
                    showToast('Terjadi kesalahan saat memuat resume.');
                    if (isi) isi.innerHTML = '';
                })
                .dinasan_getResume(currentSessionToken, elDari.value, elSampai.value, saring, urutan);
        }

        function resumeRentangCepat_(jenis, diamSaja) {
            const kini = new Date();
            let dari;
            if (jenis === 'minggu') {
                dari = new Date(kini.getTime());
                dari.setDate(dari.getDate() - 6);
            } else {
                dari = new Date(kini.getFullYear(), kini.getMonth(), 1);
            }
            const teks = function (d) {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            };
            document.getElementById('resume-dari').value = teks(dari);
            document.getElementById('resume-sampai').value = teks(kini);
            if (!diamSaja) loadResume(true);
        }

        function gambarResume_() {
            const r = resumeData_;
            const kartu = document.getElementById('resume-kartu');
            const isi = document.getElementById('resume-isi');
            const kosong = document.getElementById('resume-kosong');
            if (!r || !isi) return;

            const s = r.ringkas || {};
            const sel = function (label, nilai, warna, ikon) {
                return '<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5">' +
                    '<div class="flex items-center gap-2 mb-1.5">' +
                        '<span class="w-6 h-6 rounded-lg ' + warna + ' flex items-center justify-center text-[10px]"><i class="fa-solid ' + ikon + '"></i></span>' +
                        '<p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider leading-tight">' + label + '</p>' +
                    '</div>' +
                    '<p class="text-2xl font-black text-[#0c1d37] leading-none">' + (nilai || 0) + '</p></div>';
            };
            if (kartu) {
                kartu.innerHTML =
                    sel('Tanggal', s.siklusDitutup || 0, 'bg-slate-100 text-slate-600', 'fa-calendar-check') +
                    sel('KLB Jalan', s.klbJalan, 'bg-emerald-100 text-emerald-700', 'fa-train') +
                    sel('Rekayasa', s.rekayasa, 'bg-amber-100 text-amber-700', 'fa-shuffle') +
                    sel('Pembatalan', s.pembatalan, 'bg-red-100 text-red-700', 'fa-ban') +
                    sel('Gangguan Alat', s.gangguanAlat || 0, 'bg-rose-100 text-rose-700', 'fa-screwdriver-wrench') +
                    sel('Cadangan Sarana', s.cadangan || 0, 'bg-indigo-100 text-indigo-700', 'fa-train-subway');
            }

            gambarSiklusResume_(r);

            const ket = document.getElementById('resume-keterangan');
            if (ket) {
                // Hanya satu mode sekarang, jadi keterangannya tidak lagi
                // bercabang. Yang tetap penting disebut: berapa laporan yang
                // ADA tapi belum ditutup - tanpa itu, orang mengira datanya
                // hilang lalu mengisi ulang laporan yang sebenarnya sudah ada.
                ket.innerHTML = 'Rekapitulasi per tanggal dari laporan yang sudah di-Closing' +
                    (s.tersaringKeluar > 0
                        ? ' &middot; <span class="text-amber-600">' + s.tersaringKeluar +
                          ' laporan sudah terisi tapi harinya belum ditutup, jadi belum masuk sini</span>'
                        : '');
            }

            if (!s.serahTerima) {
                isi.innerHTML = '';
                if (kosong) {
                    kosong.classList.remove('hidden');
                    // Kosong karena BELUM ADA DATA & kosong karena TERSARING
                    // adalah dua hal berbeda. Menyamakan keduanya membuat orang
                    // mengira datanya hilang, lalu mengisi ulang laporan yang
                    // sebenarnya sudah ada - hanya belum ditutup.
                    const judul = kosong.querySelector('p');
                    const sub = kosong.querySelectorAll('p')[1];
                    if (s.tersaringKeluar > 0) {
                        if (judul) judul.textContent = 'Belum ada siklus yang ditutup pada rentang ini.';
                        // Tidak lagi menyarankan mengubah Status Laporan -
                        // pilihan itu sudah dihapus. Yang ditunjukkan sekarang
                        // adalah SATU langkah nyata yang menyelesaikannya.
                        if (sub) sub.innerHTML = '<strong>' + s.tersaringKeluar + ' serah terima</strong> sudah terisi, ' +
                            'tetapi harinya belum ditutup petugas dinas Malam lewat tombol ' +
                            '<strong>Close Laporan</strong> di menu Serah Terima Dinasan. ' +
                            'Begitu ditutup, laporannya otomatis muncul di sini.';
                    } else {
                        if (judul) judul.textContent = 'Tidak ada serah terima pada rentang ini.';
                        if (sub) sub.textContent = 'Coba lebarkan rentang tanggalnya.';
                    }
                }
                return;
            }
            if (kosong) kosong.classList.add('hidden');

            isi.innerHTML =
                blokResume_('1. Rekap KLB Jalan', 'fa-train', 'emerald', 'jalan', r.klbJalan) +
                blokResume_('2. Rekayasa Pola Operasi', 'fa-shuffle', 'amber', 'rekayasa', r.rekayasa) +
                // ═══ BAGIAN 4 DIHAPUS ═══
                // "Catatan PERKA & Jumlah Perjalanan" adalah isian per serah
                // terima, bukan rekapitulasi kejadian. Tempatnya di Laporan
                // Dinasan, bukan di sini - Resume dibuat untuk menjawab "apa
                // saja yang terjadi", & angka PERKA tidak menjawab itu.
                blokResume_('3. Pembatalan KA / Perjalanan', 'fa-ban', 'red', 'batal', r.pembatalan) +
                blokBebasResume_('5. Rekap Gangguan Peralatan', 'fa-screwdriver-wrench', 'rose', 'alat',
                    r.gangguanAlat, [
                        { k: 'no', label: 'No' }, { k: 'nama', label: 'Peralatan' },
                        { k: 'kondisi', label: 'Kondisi' }, { k: 'catatan', label: 'Catatan' }
                    ]) +
                blokBebasResume_('6. Rekap Cadangan / SO Sarana', 'fa-train-subway', 'indigo', 'cadangan',
                    r.cadangan, [
                        { k: 'depo', label: 'Depo' }, { k: 'ts', label: 'Trainset' },
                        { k: 'keterangan', label: 'Keterangan' }
                    ]);
        }

        /**
         * Menyisipkan baris pemisah setiap kali tanggalnya berganti.
         *
         * Urutan barisnya TIDAK diubah di sini - server sudah mengurutkannya
         * sesuai pilihan "Urutan Tanggal", dan mengurutkan ulang di browser
         * hanya membuka peluang hasilnya berbeda dari yang diminta.
         *
         * @param {Object[]} baris Sudah terurut dari server.
         * @param {string} jenis 'jenis' (baris KLB, pakai _tanggal) atau 'perka'.
         * @param {number} lebarTotal Jumlah kolom, untuk colspan pemisah.
         * @param {Function} gambarBaris Penggambar satu baris data.
         * @return {string}
         */
        function kelompokkanPerTanggal_(baris, jenis, lebarTotal, gambarBaris) {
            let tanggalTerakhir = null;
            let keluaran = '';
            (baris || []).forEach(function (b) {
                const tgl = String((jenis === 'perka' ? b.tanggal : b._tanggal) || '');
                if (tgl !== tanggalTerakhir) {
                    tanggalTerakhir = tgl;
                    const jumlah = (baris || []).filter(function (x) {
                        return String((jenis === 'perka' ? x.tanggal : x._tanggal) || '') === tgl;
                    }).length;
                    keluaran +=
                        '<tr class="bg-[#0c1d37]/[0.04] border-y border-slate-200">' +
                            '<td colspan="' + lebarTotal + '" class="py-1.5 px-3">' +
                                '<span class="text-[10px] font-black text-[#0c1d37]">' +
                                    '<i class="fa-regular fa-calendar mr-1.5 text-slate-400"></i>' +
                                    escapeHtml(formatTanggalDinasan_(tgl)) + '</span>' +
                                '<span class="text-[10px] font-bold text-slate-400 ml-2">' + jumlah + ' baris</span>' +
                            '</td>' +
                        '</tr>';
                }
                keluaran += gambarBaris(b);
            });
            return keluaran;
        }

        /**
         * Menghapus satu serah terima dari halaman Resume - Super Admin.
         *
         * Dipisahkan dari hapusDinasan_ karena sumber datanya berbeda:
         * hapusDinasan_ mencari barisnya di dinasanCache_ milik menu Laporan
         * Dinasan, yang belum tentu terisi saat pengguna berada di Resume.
         */
        function hapusDariResume_(id, nomorDokumen) {
            // Disamakan dengan syarat munculnya tombol Hapus di tabel Laporan
            // Dinasan - lihat alasannya di suntingDinasan_.
            const bolehHapusIni = (typeof canDo === 'function') ? canDo('tc-serah', 'hapus') : akuSuperAdmin_();
            if (!bolehHapusIni) { showToast('Anda tidak punya izin menghapus laporan ini.'); return; }

            const lanjut = function () {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) { showToast('Gagal menghapus: ' + ((res && res.message) || '')); return; }
                        showToast('Serah terima ' + (nomorDokumen || '') + ' dihapus.');
                        dinasanCache_ = null;
                        resumeData_ = null;   // paksa baca ulang, jangan pakai salinan lama
                        loadResume(true);
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus.'); })
                    .dinasan_delete(currentSessionToken, id);
            };

            if (typeof konfirmasi_ === 'function') {
                konfirmasi_({
                    judul: 'Hapus serah terima ini?',
                    pesan: 'Seluruh baris KLB & cadangan sarana di dalamnya ikut terhapus. ' +
                           'Kalau harinya sudah ditutup, laporan hariannya jadi tidak lagi cocok dengan isinya.',
                    rincian: escapeHtml(nomorDokumen || '-'),
                    ya: 'Hapus', ikonYa: 'fa-trash-can', bahaya: true
                }).then(function (ya) { if (ya) lanjut(); });
            } else { lanjut(); }
        }

        /**
         * Membuka kembali siklus yang sudah ditutup - Super Admin.
         *
         * Laporan yang ditutup sengaja dikunci, tapi kesalahan tetap mungkin
         * terjadi. Tanpa jalan keluar ini, satu-satunya pilihan adalah
         * menyunting sheet langsung - jauh lebih berbahaya & tanpa jejak.
         */
        function bukaSiklusHarian_(tanggal) {
            if (!akuSuperAdmin_()) { showToast('Hanya Super Admin yang bisa membuka kembali laporan.'); return; }

            const lanjut = function () {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) { showToast('Gagal membuka: ' + ((res && res.message) || '')); return; }
                        showToast('Laporan ' + formatTanggalDinasan_(tanggal) + ' dibuka kembali. ' +
                            'Ia keluar dari rekapitulasi sampai ditutup lagi.');
                        dinasanCache_ = null;
                        resumeData_ = null;
                        if (typeof loadLaporanDinasan === 'function') loadLaporanDinasan(true);
                        muatRantaiDinasan_();
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat membuka laporan.'); })
                    .dinasan_bukaSiklus(currentSessionToken, tanggal, '');
            };

            if (typeof konfirmasi_ === 'function') {
                konfirmasi_({
                    judul: 'Buka kembali laporan ' + formatTanggalDinasan_(tanggal) + '?',
                    pesan: 'Hari ini keluar dari rekapitulasi resmi sampai ditutup lagi, & isinya bisa disunting kembali. ' +
                           'Tindakan ini tercatat di Riwayat Aktivitas.',
                    ya: 'Buka Kembali', ikonYa: 'fa-lock-open', ikon: 'fa-triangle-exclamation'
                }).then(function (ya) { if (ya) lanjut(); });
            } else { lanjut(); }
        }

        /** Warna lencana shift - membedakan Pagi/Siang/Malam sekali pandang. */
        function warnaShiftResume_(shift) {
            return {
                Pagi: 'bg-amber-100 text-amber-800',
                Siang: 'bg-sky-100 text-sky-800',
                Malam: 'bg-indigo-100 text-indigo-800'
            }[String(shift || '')] || 'bg-slate-100 text-slate-600';
        }

        /**
         * Panel kelengkapan siklus per tanggal.
         *
         * Satu hari dinasan baru utuh bila ketiga shift-nya (Pagi, Siang,
         * Malam) sudah ditutup. Panel ini menunjukkan hari mana yang sudah
         * begitu & hari mana yang masih menggantung - beserta shift yang
         * kurang, supaya jelas apa yang perlu dikejar.
         */
        /**
         * ═══ DIHAPUS 7 Oktober 2026 ═══
         * Panel "Kelengkapan Siklus per Tanggal" dibuat saat satu hari berisi
         * tiga dokumen terpisah & kelengkapannya memang perlu dipantau. Pada
         * model siklus, sebuah tanggal hanya muncul di Resume KALAU siklusnya
         * sudah di-Closing - jadi seluruh petaknya selalu hijau & panel itu
         * tidak lagi memberi tahu apa pun.
         */
        function gambarSiklusResume_(r) {
            const wadah = document.getElementById('resume-siklus');
            if (wadah) { wadah.innerHTML = ''; wadah.className = 'hidden'; }
            return;
        }

        function gambarSiklusResumeLama_(r) {
            const wadah = document.getElementById('resume-siklus');
            if (!wadah) return;
            const daftar = (r && r.siklus) || [];
            if (!daftar.length) { wadah.innerHTML = ''; return; }

            const lengkap = daftar.filter(function (s) { return s.ditutup; }).length;

            const petak = daftar.map(function (s) {
                const isiShift = ['Pagi', 'Siang', 'Malam'].map(function (nama) {
                    const d = s.shift[nama];
                    const kelas = !d ? 'bg-slate-100 text-slate-300 line-through'
                        : d.status === 'selesai' ? 'bg-emerald-100 text-emerald-800'
                        : 'bg-amber-100 text-amber-800';
                    const judul = !d ? nama + ': belum ada serah terima'
                        : nama + ': ' + d.status + (d.nomorDokumen ? ' (' + d.nomorDokumen + ')' : '');
                    return '<span title="' + escapeHtml(judul) + '" class="px-1.5 py-0.5 rounded text-[9px] font-black ' + kelas + '">' +
                        nama.charAt(0) + '</span>';
                }).join('');

                // Tiga keadaan, bukan dua: belum lengkap, lengkap tapi belum
                // ditutup, & sudah ditutup. Yang di tengah paling perlu
                // terlihat - itulah hari yang tinggal menunggu satu klik.
                const gaya = s.ditutup ? 'bg-emerald-50/60 border-emerald-200'
                    : (s.lengkap ? 'bg-amber-50/60 border-amber-200' : 'bg-white border-slate-200');
                const tanda = s.ditutup
                    ? '<i class="fa-solid fa-flag-checkered text-emerald-600 text-[10px] ml-0.5" title="Siklus ditutup oleh ' + escapeHtml(s.ditutupOleh || '-') + '"></i>'
                    : (s.lengkap
                        ? '<i class="fa-solid fa-circle-exclamation text-amber-500 text-[10px] ml-0.5" title="Lengkap, tapi belum ditutup petugas dinas Malam"></i>'
                        : '<i class="fa-solid fa-hourglass-half text-slate-400 text-[10px] ml-0.5" title="Belum lengkap"></i>');

                return '<div class="px-2.5 py-2 rounded-xl border ' + gaya + '">' +
                        '<p class="text-[10px] font-black text-slate-700 whitespace-nowrap">' +
                            escapeHtml(formatTanggalDinasan_(s.tanggal)) + '</p>' +
                        '<div class="flex items-center gap-1 mt-1">' + isiShift + tanda +
                        '</div></div>';
            }).join('');

            wadah.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-4';
            wadah.innerHTML =
                '<div class="flex items-center justify-between gap-2 mb-3">' +
                    '<p class="text-xs font-black text-slate-800 flex items-center gap-2">' +
                        '<span class="w-6 h-6 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center text-[10px]"><i class="fa-solid fa-calendar-check"></i></span>' +
                        'Kelengkapan Siklus per Tanggal</p>' +
                    '<span class="text-[10px] font-black ' + (lengkap === daftar.length ? 'text-emerald-600' : 'text-amber-600') + '">' +
                        lengkap + ' dari ' + daftar.length + ' tanggal ditutup</span>' +
                '</div>' +
                '<div class="flex flex-wrap gap-2">' + petak + '</div>' +
                '<p class="text-[10px] text-slate-400 font-semibold mt-2.5">' +
                    'P / S / M = Pagi, Siang, Malam. Hijau = serah terimanya sudah ditutup, kuning = belum, abu bercoret = belum ada. ' +
                    'Tanda <i class="fa-solid fa-flag-checkered text-emerald-600"></i> = siklus harian sudah ditutup petugas dinas Malam; ' +
                    '<i class="fa-solid fa-circle-exclamation text-amber-500"></i> = lengkap tapi belum ditutup.' +
                '</p>';
        }

        /**
         * Sepasang tombol ekspor pada kepala tiap bagian Resume.
         *
         * Ekspor keseluruhan yang sudah ada menghasilkan satu berkas berisi
         * lima lembar. Itu tepat untuk mengarsipkan, tapi tidak untuk
         * mengirimkan satu bagian saja - mis. hanya rekap pembatalan KA ke
         * unit terkait. Memisahkannya lembar demi lembar di Excel adalah
         * pekerjaan yang tidak perlu ada.
         */
        function tombolBagianResume_(jenis, judul) {
            const j = escapeHtml(judul).replace(/'/g, '&#39;');
            return '<span class="flex items-center gap-1">' +
                '<button onclick="exportBagianResume_(\'' + jenis + '\')" title="Unduh bagian ini sebagai Excel" ' +
                    'class="w-7 h-7 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 flex items-center justify-center transition">' +
                    '<i class="fa-solid fa-file-excel text-[11px]"></i></button>' +
                '<button onclick="cetakBagianResume_(\'' + jenis + '\')" title="Cetak / simpan PDF bagian ini" ' +
                    'class="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 flex items-center justify-center transition">' +
                    '<i class="fa-solid fa-file-pdf text-[11px]"></i></button>' +
                '</span>';
        }

        /** Susunan kolom & isi satu bagian - dipakai bersama oleh Excel & cetak. */
        function isiBagianResume_(jenis) {
            if (!resumeData_) return null;
            const judul = {
                jalan: '1. Rekap KLB Jalan', rekayasa: '2. Rekayasa Pola Operasi',
                batal: '3. Pembatalan KA / Perjalanan', perka: '4. Catatan PERKA & Jumlah Perjalanan',
                alat: '5. Rekap Gangguan Peralatan', cadangan: '6. Rekap Cadangan / SO Sarana'
            }[jenis];

            if (jenis === 'alat' || jenis === 'cadangan') {
                const kol = (jenis === 'alat')
                    ? [['no', 'No'], ['nama', 'Peralatan'], ['kondisi', 'Kondisi'], ['catatan', 'Catatan']]
                    : [['depo', 'Depo'], ['ts', 'Trainset'], ['keterangan', 'Keterangan']];
                const sumber = (jenis === 'alat' ? resumeData_.gangguanAlat : resumeData_.cadangan) || [];
                return {
                    judul: judul,
                    kepala: ['Tanggal', 'Hari', 'Dinas', 'No. Dokumen'].concat(kol.map(function (c) { return c[1]; })),
                    baris: sumber.map(function (b) {
                        return [b._tanggal || '', b._hari || '', b._shift || '', b._nomorDokumen || '']
                            .concat(kol.map(function (c) { return b[c[0]] || ''; }));
                    })
                };
            }

            if (jenis === 'perka') {
                const kepala = ['Tanggal', 'Hari', 'Dinas', 'No. Dokumen', 'Acuan PERKA']
                    .concat(LINTAS_CETAK.map(function (l) { return l.label; }))
                    .concat(['Keadaan', 'Catatan Keadaan', 'Menyerahkan', 'Menerima']);
                const baris = (resumeData_.dinasan || []).map(function (b) {
                    return [b.tanggal || '', b.hari || '', b.shift || '', b.nomorDokumen || '', b.perkaAcuan || '']
                        .concat(LINTAS_CETAK.map(function (l) { return b['ka' + l.k.charAt(0).toUpperCase() + l.k.slice(1)] || ''; }))
                        .concat([b.keadaan || '', b.keadaanCatatan || '', b.menyerahkanNama || '', b.menerimaNama || '']);
                });
                return { judul: judul, kepala: kepala, baris: baris };
            }

            const cfg = TABEL_PERJALANAN[jenis];
            const sumber = { jalan: resumeData_.klbJalan, rekayasa: resumeData_.rekayasa, batal: resumeData_.pembatalan }[jenis] || [];
            const kepala = ['Tanggal', 'Hari', 'Dinas', 'No. Dokumen'].concat(cfg.kolom.map(function (c) { return c.label; }));
            const baris = sumber.map(function (b) {
                return [b._tanggal || '', b._hari || '', b._shift || '', b._nomorDokumen || '']
                    .concat(cfg.kolom.map(function (c) {
                        return c.waktu ? jamHHMM_(b[c.k]) : (b[c.k] || '');
                    }));
            });
            return { judul: judul, kepala: kepala, baris: baris };
        }

        function exportBagianResume_(jenis) {
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat, coba muat ulang halaman.'); return; }
            const b = isiBagianResume_(jenis);
            if (!b) { showToast('Tampilkan dulu datanya sebelum diunduh.'); return; }
            if (!b.baris.length) { showToast('Bagian ini tidak punya data pada rentang yang dipilih.'); return; }

            const dari = document.getElementById('resume-dari').value;
            const sampai = document.getElementById('resume-sampai').value;

            // Baris keterangan ikut disertakan di atas tabel: berkas yang
            // dikirim ke unit lain harus bisa menjelaskan sendiri rentang &
            // penyaring yang dipakai, tanpa bertanya balik.
            const kepalaBerkas = [
                [b.judul],
                ['Rentang', dari + ' s.d. ' + sampai],
                ['Status', resumeData_.mode === 'semua' ? 'Semua siklus termasuk draf' : 'Hanya siklus yang sudah ditutup'],
                []
            ];
            const ws = XLSX.utils.aoa_to_sheet(kepalaBerkas.concat([b.kepala]).concat(b.baris));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, b.judul.slice(0, 28).replace(/[\\\/\[\]\*\?:]/g, ''));
            XLSX.writeFile(wb, 'Resume_' + jenis + '_' + dari + '_sd_' + sampai + '.xlsx');
            showToast(b.judul + ' diunduh (' + b.baris.length + ' baris).');
        }

        function cetakBagianResume_(jenis) {
            const b = isiBagianResume_(jenis);
            if (!b) { showToast('Tampilkan dulu datanya sebelum dicetak.'); return; }
            if (!b.baris.length) { showToast('Bagian ini tidak punya data pada rentang yang dipilih.'); return; }

            const dari = document.getElementById('resume-dari').value;
            const sampai = document.getElementById('resume-sampai').value;

            const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + escapeHtml(b.judul) + '</title><style>' +
                'body{font-family:Arial,sans-serif;font-size:8.5px;margin:14px;color:#0f172a}' +
                'h2{font-size:12px;margin:0 0 2px}table{width:100%;border-collapse:collapse}' +
                'th,td{border:1px solid #cbd5e1;padding:3px 4px;text-align:left;vertical-align:top}' +
                'th{background:#0c1d37;color:#fff;font-size:7.5px;text-transform:uppercase}' +
                '.kop{border-bottom:2px solid #0c1d37;padding-bottom:6px;margin-bottom:8px}' +
                '</style></head><body>' +
                '<div class="kop"><h2>' + escapeHtml(b.judul.toUpperCase()) + '</h2>' +
                '<div style="font-size:8px;color:#475569">PT Kereta Commuter Indonesia &mdash; COTP Department<br>' +
                'Rentang : ' + escapeHtml(dari) + ' s.d. ' + escapeHtml(sampai) + ' &middot; ' +
                escapeHtml(resumeData_.mode === 'semua' ? 'Semua siklus termasuk draf' : 'Hanya siklus yang sudah ditutup') +
                ' &middot; ' + b.baris.length + ' baris</div></div>' +
                '<table><tr>' + b.kepala.map(function (h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') + '</tr>' +
                b.baris.map(function (r) {
                    return '<tr>' + r.map(function (c) { return '<td>' + escapeHtml(String(c === undefined || c === null ? '' : c)) + '</td>'; }).join('') + '</tr>';
                }).join('') + '</table>' +
                '<p style="text-align:center;font-size:7px;color:#64748b;margin-top:10px">Dicetak dari Sistem Pusdalops KCI &mdash; ' +
                new Date().toLocaleString('id-ID') + '</p></body></html>';

            const win = window.open('', '_blank');
            if (!win) { showToast('Popup diblokir browser - izinkan popup untuk mencetak.'); return; }
            win.document.write(html);
            win.document.close();
            setTimeout(function () { win.print(); }, 400);
        }

        /** Satu blok tabel KLB, memakai susunan kolom yang sama dengan formulir. */
        // ═══════════════════════════════════════════════════════════════
        // SUNTING / HAPUS SATU BARIS LANGSUNG DARI RESUME
        // ═══════════════════════════════════════════════════════════════
        //
        // Membetulkan satu salah ketik dulu berarti mencari laporan asalnya,
        // membukanya, menyunting, lalu kembali ke Resume. Di sini cukup satu
        // tombol pada barisnya sendiri.

        let barisResumeSedangDisunting_ = null;   // { jenis, id }

        /** Mencari satu baris pada salinan resume yang sedang tampil. */
        function cariBarisResume_(jenis, id) {
            if (!resumeData_) return null;
            const sumber = { jalan: resumeData_.klbJalan, rekayasa: resumeData_.rekayasa, batal: resumeData_.pembatalan }[jenis] || [];
            return sumber.find(function (b) { return String(b.id) === String(id); }) || null;
        }

        function bukaSuntingBarisResume_(jenis, id) {
            const cfg = TABEL_PERJALANAN[jenis];
            const b = cariBarisResume_(jenis, id);
            if (!cfg || !b) { showToast('Baris tidak ditemukan - coba muat ulang Resume.'); return; }

            barisResumeSedangDisunting_ = { jenis: jenis, id: id };

            document.getElementById('rsb-judul').textContent = cfg.judul.replace(/^[A-D]\.\s*/, '');
            document.getElementById('rsb-subjudul').textContent =
                (b._tanggal ? formatTanggalDinasan_(b._tanggal) : '-') +
                (b._shift ? ' · Dinas ' + b._shift : '') +
                (b._nomorDokumen ? ' · ' + b._nomorDokumen : '');

            // Kolomnya dibangkitkan dari susunan tabel yang sama dengan
            // formulir Serah Terima - satu sumber kebenaran, jadi kolom baru
            // di sana otomatis ikut bisa disunting di sini.
            document.getElementById('rsb-isi').innerHTML = cfg.kolom.map(function (c) {
                const nilai = c.waktu ? jamHHMM_(b[c.k]) : String(b[c.k] || '');
                const lebar = (c.k === 'keterangan' || c.k === 'relasi') ? 'sm:col-span-2' : '';
                return '<div class="' + lebar + '">' +
                    '<label class="block text-[9px] font-black text-slate-400 uppercase tracking-wider mb-1">' + escapeHtml(c.label) + '</label>' +
                    '<input id="rsb-f-' + c.k + '" type="' + (c.waktu ? 'time' : 'text') + '" value="' + escapeHtml(nilai) + '" ' +
                    'class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs ' +
                    (c.mono ? 'font-mono ' : '') + 'font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">' +
                    '</div>';
            }).join('');

            document.getElementById('modal-resume-baris').classList.remove('hidden');
        }

        function tutupSuntingBarisResume_() {
            const m = document.getElementById('modal-resume-baris');
            if (m) m.classList.add('hidden');
            barisResumeSedangDisunting_ = null;
        }

        function simpanBarisResume_() {
            if (!barisResumeSedangDisunting_) return;
            const { jenis, id } = barisResumeSedangDisunting_;
            const cfg = TABEL_PERJALANAN[jenis];
            if (!cfg) return;

            const isi = {};
            cfg.kolom.forEach(function (c) {
                const el = document.getElementById('rsb-f-' + c.k);
                if (el) isi[c.k] = String(el.value || '').trim();
            });

            const tombol = document.getElementById('rsb-simpan');
            if (tombol) { tombol.disabled = true; tombol.classList.add('opacity-60', 'cursor-not-allowed'); }
            const pulih = function () {
                if (tombol) { tombol.disabled = false; tombol.classList.remove('opacity-60', 'cursor-not-allowed'); }
            };

            google.script.run
                .withSuccessHandler(function (res) {
                    pulih();
                    if (!res || !res.success) { showToast('Gagal menyimpan: ' + ((res && res.message) || '')); return; }
                    tutupSuntingBarisResume_();
                    showToast('Baris berhasil diperbarui.');
                    resumeData_ = null;            // paksa baca ulang dari server
                    loadResume(true);
                })
                .withFailureHandler(function () { pulih(); showToast('Terjadi kesalahan saat menyimpan.'); })
                .dinasan_updateBarisResume(currentSessionToken, id, isi);
        }

        function hapusBarisResume_(jenis, id) {
            const b = cariBarisResume_(jenis, id);
            if (!b) { showToast('Baris tidak ditemukan - coba muat ulang Resume.'); return; }
            const nama = 'KA ' + (b.noKa || '-') + (b.namaKa ? ' (' + b.namaKa + ')' : '');
            if (!confirm('Hapus baris ' + nama + '?\n\n' +
                    'Baris ini dihapus dari laporan asalnya, bukan hanya dari Resume.\n' +
                    'Isinya tetap tercatat di Riwayat Aktivitas.')) return;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal menghapus: ' + ((res && res.message) || '')); return; }
                    showToast('Baris dihapus.');
                    resumeData_ = null;
                    loadResume(true);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus.'); })
                .dinasan_deleteBarisResume(currentSessionToken, id);
        }

        function blokResume_(judul, ikon, warna, jenis, baris) {
            const cfg = TABEL_PERJALANAN[jenis];
            const daftar = baris || [];

            // Kolom aksi hanya ditambahkan bila pengguna memang berhak.
            // Menambahkan kolom kosong untuk yang hanya melihat berarti
            // menyisakan lajur menganga di tepi tabel tanpa guna.
            const bolehUbahBaris = (typeof canDo === 'function') ? canDo('tc-serah', 'edit') : false;
            const bolehHapusBaris = (typeof canDo === 'function') ? canDo('tc-serah', 'hapus') : false;
            const adaAksi = bolehUbahBaris || bolehHapusBaris;

            const kepala = '<th class="py-2.5 px-3 text-left w-24">Tanggal</th>' +
                cfg.kolom.map(function (c) { return '<th class="py-2.5 px-3 text-left">' + escapeHtml(c.label) + '</th>'; }).join('') +
                (adaAksi ? '<th class="py-2.5 px-3 text-center w-20">Aksi</th>' : '');

            // ═══ DIKELOMPOKKAN PER TANGGAL ═══
            // Tanpa pengelompokan, daftar sebulan tampil sebagai ratusan baris
            // dengan kolom tanggal yang terus berulang - dan mata harus
            // membandingkan teks tanggal baris demi baris untuk tahu di mana
            // satu hari berakhir. Baris pemisah membuat batas harinya terlihat
            // sekali pandang, dan kolom tanggal tidak perlu diulang lagi di
            // dalam kelompoknya.
            const lebarTotal = cfg.kolom.length + 1 + (adaAksi ? 1 : 0);
            const isi = daftar.length
                ? kelompokkanPerTanggal_(daftar, 'jenis', lebarTotal, function (b) {
                    const tombol = adaAksi
                        ? '<td class="py-2 px-3"><div class="flex items-center justify-center gap-1.5">' +
                            (bolehUbahBaris ? '<button onclick="bukaSuntingBarisResume_(\'' + jenis + '\',\'' + escapeHtml(b.id || '') + '\')" title="Ubah baris ini" class="w-6 h-6 rounded-md bg-white border border-slate-200 hover:bg-[#d4af37] hover:border-[#d4af37] hover:text-[#0c1d37] text-slate-500 flex items-center justify-center transition"><i class="fa-regular fa-pen-to-square text-[10px]"></i></button>' : '') +
                            (bolehHapusBaris ? '<button onclick="hapusBarisResume_(\'' + jenis + '\',\'' + escapeHtml(b.id || '') + '\')" title="Hapus baris ini" class="w-6 h-6 rounded-md bg-white border border-slate-200 hover:bg-rose-600 hover:border-rose-600 hover:text-white text-slate-500 flex items-center justify-center transition"><i class="fa-regular fa-trash-can text-[10px]"></i></button>' : '') +
                          '</div></td>'
                        : '';
                    return '<tr class="hover:bg-slate-50 transition">' +
                        '<td class="py-2 px-3 text-[10px] text-slate-400 whitespace-nowrap"></td>' +
                        cfg.kolom.map(function (c) {
                            // Jam diseragamkan juga di sini - baris lama bisa
                            // tersimpan dalam bentuk yang tidak terbaca.
                            const nilai = c.waktu ? (jamHHMM_(b[c.k]) || '-') : (b[c.k] || '-');
                            return '<td class="py-2 px-3">' + escapeHtml(nilai) + '</td>';
                        }).join('') + tombol + '</tr>';
                  })
                : '<tr><td colspan="' + lebarTotal + '" class="py-8 text-center text-slate-400 font-bold text-[11px] italic">Tidak ada data pada rentang ini.</td></tr>';

            return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">' +
                '<div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between gap-2 flex-wrap">' +
                    '<p class="text-xs font-black text-slate-800 flex items-center gap-2">' +
                        '<span class="w-6 h-6 rounded-lg bg-' + warna + '-100 text-' + warna + '-700 flex items-center justify-center text-[10px]"><i class="fa-solid ' + ikon + '"></i></span>' +
                        escapeHtml(judul) + '</p>' +
                    '<div class="flex items-center gap-2">' +
                        '<span class="text-[10px] font-black text-slate-400">' + daftar.length + ' baris</span>' +
                        tombolBagianResume_(jenis, judul) +
                    '</div>' +
                '</div>' +
                '<div class="overflow-x-auto"><table class="min-w-full text-[11px]">' +
                    '<thead class="bg-slate-50 text-slate-500 text-[9px] font-extrabold uppercase tracking-wider"><tr>' + kepala + '</tr></thead>' +
                    '<tbody class="divide-y divide-slate-100 font-semibold text-slate-700">' + isi + '</tbody>' +
                '</table></div></div>';
        }

        /**
         * Blok rekap bebas - dipakai poin 5 & 6.
         *
         * Susunannya sama persis dengan ketiga blok KLB (pengelompokan per
         * tanggal, tombol Excel & Cetak di kepalanya), hanya kolomnya yang
         * ditentukan pemanggil. Menyalin blokResume_ akan menghasilkan dua
         * fungsi yang harus dijaga sejalan selamanya; satu fungsi dengan
         * kolom sebagai parameter tidak punya masalah itu.
         */
        function blokBebasResume_(judul, ikon, warna, jenis, daftar, kolom) {
            const d = daftar || [];
            const lebarTotal = kolom.length + 1;
            const kepala = '<th class="py-2.5 px-3 text-left w-24">Tanggal</th>' +
                kolom.map(function (c) { return '<th class="py-2.5 px-3 text-left">' + escapeHtml(c.label) + '</th>'; }).join('');

            const isi = d.length
                ? kelompokkanPerTanggal_(d, 'jenis', lebarTotal, function (b) {
                    return '<tr class="hover:bg-slate-50 transition">' +
                        '<td class="py-2 px-3 text-[10px] text-slate-400 whitespace-nowrap"></td>' +
                        kolom.map(function (c) {
                            const nilai = String(b[c.k] === undefined || b[c.k] === null ? '' : b[c.k]);
                            if (c.k !== 'kondisi') return '<td class="py-2 px-3">' + (escapeHtml(nilai) || '-') + '</td>';
                            const gaya = nilai === 'GANGGUAN' ? 'bg-red-100 text-red-800' : 'bg-slate-200 text-slate-700';
                            return '<td class="py-2 px-3"><span class="px-1.5 py-0.5 rounded text-[9px] font-black ' + gaya + '">' +
                                (escapeHtml(nilai) || '-') + '</span></td>';
                        }).join('') + '</tr>';
                  })
                : '<tr><td colspan="' + lebarTotal + '" class="py-8 text-center text-slate-400 font-bold text-[11px] italic">Tidak ada data pada rentang ini.</td></tr>';

            return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">' +
                '<div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between gap-2 flex-wrap">' +
                    '<p class="text-xs font-black text-slate-800 flex items-center gap-2">' +
                        '<span class="w-6 h-6 rounded-lg bg-' + warna + '-100 text-' + warna + '-700 flex items-center justify-center text-[10px]"><i class="fa-solid ' + ikon + '"></i></span>' +
                        escapeHtml(judul) + '</p>' +
                    '<div class="flex items-center gap-2">' +
                        '<span class="text-[10px] font-black text-slate-400">' + d.length + ' baris</span>' +
                        tombolBagianResume_(jenis, judul) +
                    '</div>' +
                '</div>' +
                '<div class="overflow-x-auto"><table class="min-w-full text-[11px]">' +
                    '<thead class="bg-slate-50 text-slate-500 text-[9px] font-extrabold uppercase tracking-wider"><tr>' + kepala + '</tr></thead>' +
                    '<tbody class="divide-y divide-slate-100 font-semibold text-slate-700">' + isi + '</tbody>' +
                '</table></div></div>';
        }

        /** Blok keempat: acuan PERKA & jumlah perjalanan per lintas. */
        function blokPerkaResume_(daftar) {
            const d = daftar || [];
            // Kolom AKSI hanya untuk Super Admin. Menyunting & menghapus dari
            // halaman rekapitulasi adalah tindakan yang berbeda tingkat dari
            // membacanya - siapa pun yang boleh membuka Resume belum tentu
            // boleh mengubah isinya.
            const bolehUbah = akuSuperAdmin_();
            const kepala = '<th class="py-2.5 px-3 text-left w-24">Tanggal</th>' +
                '<th class="py-2.5 px-3 text-left w-16">Dinas</th>' +
                '<th class="py-2.5 px-3 text-left w-28">Acuan PERKA</th>' +
                LINTAS_CETAK.map(function (l) { return '<th class="py-2.5 px-3 text-left">' + escapeHtml(l.label) + '</th>'; }).join('') +
                '<th class="py-2.5 px-3 text-left">Keadaan</th>' +
                (bolehUbah ? '<th class="py-2.5 px-3 text-center w-20">Aksi</th>' : '');

            const lebarTotal = LINTAS_CETAK.length + 4 + (akuSuperAdmin_() ? 1 : 0);
            const isi = d.length
                ? kelompokkanPerTanggal_(d, 'perka', lebarTotal, function (b) {
                    return '<tr class="hover:bg-slate-50 transition align-top">' +
                        '<td class="py-2 px-3 text-[10px] text-slate-400 whitespace-nowrap"></td>' +
                        '<td class="py-2 px-3"><span class="px-1.5 py-0.5 rounded ' + warnaShiftResume_(b.shift) + ' text-[9px] font-black">' + escapeHtml(b.shift || '-') + '</span></td>' +
                        '<td class="py-2 px-3 font-mono text-[10px]">' + escapeHtml(b.perkaAcuan || '-') + '</td>' +
                        LINTAS_CETAK.map(function (l) {
                            const kunci = 'ka' + l.k.charAt(0).toUpperCase() + l.k.slice(1);
                            return '<td class="py-2 px-3 whitespace-nowrap text-[10px]">' + escapeHtml(b[kunci] || '-') + '</td>';
                        }).join('') +
                        '<td class="py-2 px-3">' +
                            (b.keadaan === 'Ada Catatan'
                                ? '<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[9px] font-black">Ada Catatan</span>' +
                                  (b.keadaanCatatan ? '<p class="text-[10px] text-slate-500 font-semibold mt-1 max-w-[240px]">' + escapeHtml(b.keadaanCatatan) + '</p>' : '')
                                : '<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[9px] font-black">Baik</span>') +
                        '</td>' +
                        (bolehUbah
                            ? '<td class="py-2 px-3 text-center"><div class="flex items-center justify-center gap-1">' +
                                '<button onclick="suntingDinasan_(\'' + b.id + '\')" title="Sunting serah terima ini" ' +
                                    'class="w-7 h-7 bg-slate-100 hover:bg-[#d4af37] hover:text-[#0c1d37] text-slate-600 rounded transition flex items-center justify-center">' +
                                    '<i class="fa-regular fa-pen-to-square text-xs"></i></button>' +
                                '<button onclick="hapusDariResume_(\'' + b.id + '\', \'' + escapeHtml(b.nomorDokumen || '') + '\')" title="Hapus serah terima ini" ' +
                                    'class="w-7 h-7 bg-slate-100 hover:bg-red-600 hover:text-white text-slate-600 rounded transition flex items-center justify-center">' +
                                    '<i class="fa-regular fa-trash-can text-xs"></i></button>' +
                              '</div></td>'
                            : '') +
                        '</tr>';
                  })
                : '<tr><td colspan="' + lebarTotal + '" class="py-8 text-center text-slate-400 font-bold text-[11px] italic">Tidak ada data pada rentang ini.</td></tr>';

            return '<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">' +
                '<div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between gap-2 flex-wrap">' +
                    '<p class="text-xs font-black text-slate-800 flex items-center gap-2">' +
                        '<span class="w-6 h-6 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center text-[10px]"><i class="fa-solid fa-list-ol"></i></span>' +
                        '4. Catatan PERKA &amp; Jumlah Perjalanan</p>' +
                    '<div class="flex items-center gap-2">' +
                        '<span class="text-[10px] font-black text-slate-400">' + d.length + ' serah terima</span>' +
                        tombolBagianResume_('perka', '4. Catatan PERKA & Jumlah Perjalanan') +
                    '</div>' +
                '</div>' +
                '<div class="overflow-x-auto"><table class="min-w-full text-[11px]">' +
                    '<thead class="bg-slate-50 text-slate-500 text-[9px] font-extrabold uppercase tracking-wider"><tr>' + kepala + '</tr></thead>' +
                    '<tbody class="divide-y divide-slate-100 font-semibold text-slate-700">' + isi + '</tbody>' +
                '</table></div></div>';
        }

        /** Satu berkas .xlsx berisi empat lembar - satu per bagian rekap. */
        function exportResume() {
            if (typeof XLSX === 'undefined') { showToast('Pustaka Excel belum termuat, coba muat ulang halaman.'); return; }
            if (!resumeData_ || !(resumeData_.ringkas || {}).serahTerima) { showToast('Belum ada data untuk diunduh.'); return; }

            const wb = XLSX.utils.book_new();
            const lembarKlb = function (nama, jenis, baris) {
                const cfg = TABEL_PERJALANAN[jenis];
                const kepala = ['Tanggal', 'Hari', 'Dinas', 'No. Dokumen'].concat(cfg.kolom.map(function (c) { return c.label; }));
                const isi = (baris || []).map(function (b) {
                    return [b._tanggal || '', b._hari || '', b._shift || '', b._nomorDokumen || '']
                        .concat(cfg.kolom.map(function (c) { return b[c.k] || ''; }));
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([kepala].concat(isi)), nama);
            };

            lembarKlb('KLB Jalan', 'jalan', resumeData_.klbJalan);
            lembarKlb('Rekayasa Pola Operasi', 'rekayasa', resumeData_.rekayasa);
            lembarKlb('Pembatalan', 'batal', resumeData_.pembatalan);

            // Lembar PERKA dipertahankan pada ekspor KESELURUHAN - berkas
            // arsip memang sebaiknya memuat segalanya. Yang dihapus hanya
            // tampilannya di layar, karena di sanalah ia mengaburkan maksud
            // halaman ini.
            const kepalaPerka = ['Tanggal', 'Hari', 'Dinas', 'No. Dokumen', 'Acuan PERKA']
                .concat(LINTAS_CETAK.map(function (l) { return l.label; }))
                .concat(['Keadaan', 'Catatan Keadaan', 'Catatan Lain', 'Menyerahkan', 'Menerima', 'Status']);
            const isiPerka = (resumeData_.dinasan || []).map(function (b) {
                return [b.tanggal || '', b.hari || '', b.shift || '', b.nomorDokumen || '', b.perkaAcuan || '']
                    .concat(LINTAS_CETAK.map(function (l) { return b['ka' + l.k.charAt(0).toUpperCase() + l.k.slice(1)] || ''; }))
                    .concat([b.keadaan || '', b.keadaanCatatan || '', b.catatan || '',
                             b.menyerahkanNama || '', b.menerimaNama || '', b.status || '']);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([kepalaPerka].concat(isiPerka)), 'PERKA & Perjalanan');

            // Lembar kelima: kelengkapan siklus. Tanpa ini, pembaca berkas
            // tidak punya cara mengetahui tanggal mana yang datanya memang
            // utuh & mana yang kebetulan sedikit karena shift-nya belum
            // ditutup - dua hal yang terlihat sama persis di lembar lain.
            const kepalaSiklus = ['Tanggal', 'Hari', 'Pagi', 'Siang', 'Malam', 'Siklus Lengkap', 'Shift Belum Ada'];
            const isiSiklus = (resumeData_.siklus || []).map(function (s) {
                const st = function (nama) { return s.shift[nama] ? s.shift[nama].status : '(tidak ada)'; };
                return [s.tanggal, s.hari, st('Pagi'), st('Siang'), st('Malam'),
                        s.lengkap ? 'YA' : 'BELUM', (s.shiftKurang || []).join(', ')];
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([kepalaSiklus].concat(isiSiklus)), 'Kelengkapan Siklus');

            const dari = document.getElementById('resume-dari').value;
            const sampai = document.getElementById('resume-sampai').value;
            XLSX.writeFile(wb, 'Resume_Laporan_' + dari + '_sd_' + sampai +
                '_' + (resumeData_.mode || 'selesai') + '.xlsx');
            showToast('Resume ' + dari + ' s.d. ' + sampai + ' diunduh.');
        }

        function cetakResume() {
            if (!resumeData_ || !(resumeData_.ringkas || {}).serahTerima) { showToast('Belum ada data untuk dicetak.'); return; }
            const dari = document.getElementById('resume-dari').value;
            const sampai = document.getElementById('resume-sampai').value;

            const tabel = function (judul, jenis, baris) {
                const cfg = TABEL_PERJALANAN[jenis];
                const d = baris || [];
                return '<h3>' + judul + ' (' + d.length + ')</h3><table><tr><th>Tanggal</th><th>Dinas</th>' +
                    cfg.kolom.map(function (c) { return '<th>' + escapeHtml(c.label) + '</th>'; }).join('') + '</tr>' +
                    (d.length ? d.map(function (b) {
                        return '<tr><td>' + escapeHtml(b._tanggal || '') + '</td><td>' + escapeHtml(b._shift || '') + '</td>' +
                            cfg.kolom.map(function (c) { return '<td>' + escapeHtml(b[c.k] || '-') + '</td>'; }).join('') + '</tr>';
                    }).join('') : '<tr><td colspan="' + (cfg.kolom.length + 2) + '" style="text-align:center">Tidak ada data</td></tr>') +
                    '</table>';
            };

            const perka = '<h3>4. Catatan PERKA &amp; Jumlah Perjalanan (' + (resumeData_.dinasan || []).length + ')</h3><table>' +
                '<tr><th>Tanggal</th><th>Dinas</th><th>Acuan PERKA</th>' +
                LINTAS_CETAK.map(function (l) { return '<th>' + escapeHtml(l.label) + '</th>'; }).join('') + '<th>Keadaan</th></tr>' +
                (resumeData_.dinasan || []).map(function (b) {
                    return '<tr><td>' + escapeHtml(b.tanggal || '') + '</td><td>' + escapeHtml(b.shift || '') + '</td>' +
                        '<td>' + escapeHtml(b.perkaAcuan || '-') + '</td>' +
                        LINTAS_CETAK.map(function (l) {
                            return '<td>' + escapeHtml(b['ka' + l.k.charAt(0).toUpperCase() + l.k.slice(1)] || '-') + '</td>';
                        }).join('') +
                        '<td>' + escapeHtml(b.keadaan || '-') + (b.keadaanCatatan ? ': ' + escapeHtml(b.keadaanCatatan) : '') + '</td></tr>';
                }).join('') + '</table>';

            const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Resume Laporan</title><style>' +
                'body{font-family:Arial,sans-serif;font-size:8.5px;margin:14px;color:#0f172a}' +
                'h2{font-size:12px;margin:0 0 2px}h3{font-size:9.5px;margin:12px 0 4px;color:#0c1d37}' +
                'table{width:100%;border-collapse:collapse;margin-bottom:4px}' +
                'th,td{border:1px solid #cbd5e1;padding:3px 4px;text-align:left;vertical-align:top}' +
                'th{background:#0c1d37;color:#fff;font-size:7.5px;text-transform:uppercase}' +
                '.kop{border-bottom:2px solid #0c1d37;padding-bottom:6px;margin-bottom:8px}' +
                '</style></head><body>' +
                '<div class="kop"><h2>RESUME LAPORAN SERAH TERIMA DINASAN</h2>' +
                '<div style="font-size:8px;color:#475569">PT Kereta Commuter Indonesia &mdash; COTP Department<br>' +
                'Rentang : ' + escapeHtml(dari) + ' s.d. ' + escapeHtml(sampai) + '<br>' +
                'Status : ' + escapeHtml({
                    selesai: 'hanya laporan yang sudah ditutup',
                    diterima: 'laporan yang sudah diterima & yang sudah ditutup',
                    semua: 'seluruh laporan termasuk draf'
                }[resumeData_.mode || 'selesai']) +
                ' &middot; Urutan : ' + escapeHtml(resumeData_.urutan === 'baru' ? 'terbaru lebih dulu' : 'terlama lebih dulu') +
                ' &middot; Siklus lengkap : ' + ((resumeData_.ringkas || {}).siklusLengkap || 0) +
                ' dari ' + ((resumeData_.ringkas || {}).tanggal || 0) + ' tanggal' +
                '</div></div>' +
                tabel('1. Rekap KLB Jalan', 'jalan', resumeData_.klbJalan) +
                tabel('2. Rekayasa Pola Operasi', 'rekayasa', resumeData_.rekayasa) +
                tabel('3. Pembatalan KA / Perjalanan', 'batal', resumeData_.pembatalan) +
                perka +
                '<p style="text-align:center;font-size:7px;color:#64748b;margin-top:10px">' +
                'Dicetak dari Sistem Pusdalops KCI &mdash; ' + new Date().toLocaleString('id-ID') + '</p>' +
                '</body></html>';

            const win = window.open('', '_blank');
            if (!win) { showToast('Popup diblokir browser - izinkan popup untuk mencetak.'); return; }

        // ════════════════════════════════════════════════════════════════

        let jadwalBaris_ = [];
        let jadwalTtd_ = [];
        let jadwalKode_ = { DP41: 'Dinas Pagi', DS52: 'Dinas Siang', DM4: 'Dinas Malam', N: 'Normal / kantor', L: 'Libur' };
        let jadwalMode_ = 'prog';
        let jadwalKuas_ = null;            // null = tanpa kuas, '' = penghapus, selain itu kode
        let jadwalSeret_ = false;

        let jadwalBulanDimuat_ = '';
        let jadwalHariIni_ = '';
        let jadwalOtoIndeks_ = { nipp: {}, nama: {} };
        let jadwalLiputan_ = {};           // 'dd' -> { DP41: [nama], DS52: [...], DM4: [...] }
        let jadwalHasilBaca_ = null;       // hasil baca berkas Excel yang menunggu "Input by Excel"
        let jadwalTujuanUnggah_ = 'prog';
        let jadwalPola_ = { jenis: 'rotasi', urutan: ['DS52', 'DP41', 'L', 'DM4'], mulai: 0 };
        let jadwalPolaUbah_ = {};          // koreksi per tanggal di pratinjau Input Manual

        const JADWAL_SHIFT_ = ['DP41', 'DS52', 'DM4'];
        const JADWAL_WARNA = {
