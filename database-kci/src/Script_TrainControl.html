                        (keterangan ? ' &middot; ' + keterangan : '') + '</p>' +
                    '</div>';
            }).join('');
        }

        function gantiTabLaporan_(jenis) {
            const serah = jenis !== 'harian';
            const bs = document.getElementById('lapdin-blok-serah');
            const bh = document.getElementById('lapdin-blok-harian');
            if (bs) bs.classList.toggle('hidden', !serah);
            if (bh) bh.classList.toggle('hidden', serah);

            const aktif = 'flex-1 px-4 py-2.5 rounded-xl text-xs font-black transition bg-[#0c1d37] text-white';
            const diam = 'flex-1 px-4 py-2.5 rounded-xl text-xs font-black transition text-slate-500 hover:bg-slate-100';
            const ts = document.getElementById('lapdin-tab-serah');
            const th = document.getElementById('lapdin-tab-harian');
            if (ts) ts.className = serah ? aktif : diam;
            if (th) th.className = serah ? diam : aktif;

            if (serah) muatDaftarSerahTerima_(); else muatLaporanHarian_();

            const ket = document.getElementById('lapdin-tab-ket');
            if (ket) {
                ket.innerHTML = serah
                    ? '<i class="fa-solid fa-circle-info text-slate-400 mr-1"></i>' +
                      'Satu baris per serah terima &mdash; catatan tiap petugas saat menyerahkan tugasnya. ' +
                      'Bisa dilihat, disunting, &amp; dihapus.'
                    : '<i class="fa-solid fa-circle-info text-slate-400 mr-1"></i>' +
                      'Hasil <strong>Closing Report</strong> &mdash; satu laporan utuh per tanggal. ' +
                      'Ini arsip, jadi tidak disunting per baris; untuk mengubahnya, buka kembali siklusnya lebih dulu.';
            }
        }

        function loadLaporanDinasan(paksa) {
            // Kedua tab memuat sumbernya masing-masing. Yang tampil saat menu
            // dibuka adalah tab Laporan Dinasan.
            const tabHarian = document.getElementById('lapdin-blok-harian');
            const diHarian = tabHarian && !tabHarian.classList.contains('hidden');
            if (diHarian) muatLaporanHarian_(paksa); else muatDaftarSerahTerima_(paksa);
            if (paksa) { serahTerimaCache_ = null; harianCache_ = null; }
            return loadLaporanDinasanLama_(paksa);
        }

        function loadLaporanDinasanLama_(paksa) {
            const tbody = document.getElementById('lapdin-body');
            if (!tbody) return;
            if (dinasanCache_ && !paksa) { renderLaporanDinasan(); return; }
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-10 text-slate-400 font-bold"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-[#d4af37]"></i>Memuat laporan dinasan...</td></tr>';

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal memuat laporan: ' + (res.message || '')); tbody.innerHTML = ''; return; }
                    dinasanCache_ = res.data || [];
                    renderLaporanDinasan();
                    muatSummaryHarian_();
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat laporan dinasan.'); tbody.innerHTML = ''; })
                .dinasan_getAll(currentSessionToken, true);
        }

        function hitungLaporanDinasan_() {
            const ambil = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
            const cari = (ambil('lapdin-cari') || '').toLowerCase();
            const dinas = ambil('lapdin-dinas');
            const mulai = ambil('lapdin-mulai');
            const akhir = ambil('lapdin-akhir');

            return (dinasanCache_ || []).filter(function (d) {
                if (dinas && dinas !== 'Semua' && d.dariDinas !== dinas) return false;
                const tgl = String(d.tanggal || '').slice(0, 10);
                if (mulai && tgl < mulai) return false;
                if (akhir && tgl > akhir) return false;
                if (cari) {
                    const gabung = [d.nomorDokumen, d.menyerahkan.nama, d.menerima.nama, d.catatan, d.perkaAcuan].join(' ').toLowerCase();
                    if (gabung.indexOf(cari) === -1) return false;
                }
                return true;
            });
        }

        /** Perubahan rentang tanggal ikut menyusun ulang rekap harian. */
        function ubahRentangLaporan_() {
            // Rentang tanggal menentukan kedua sumber, jadi keduanya dibuang
            // & diambil ulang.
            serahTerimaCache_ = null;
            harianCache_ = null;
            setTimeout(function () { loadLaporanDinasan(true); }, 10);
            return ubahRentangLaporanLama_();
        }

        function ubahRentangLaporanLama_() {
            renderLaporanDinasan();
            muatSummaryHarian_();
        }

        function renderLaporanDinasan() {
            // Tabelnya digambar daftar pergantian; penggambar lama hanya
            // mengisi kartu ringkas di atasnya. Memanggil keduanya untuk
            // elemen yang sama adalah cara pasti membuat salah satunya
            // menimpa yang lain.
            renderKartuRingkasDinasan_();
            renderDaftarSerahTerima_();
        }

        /** Hanya kartu ringkas - tabelnya milik renderDaftarSerahTerima_. */
        function renderKartuRingkasDinasan_() {
            const hasil = hitungLaporanDinasan_();
            const totalKlb = hasil.reduce(function (t, d) { return t + (d.jumlahKlbJalan || 0) + (d.jumlahRekayasa || 0) + (d.jumlahKlbBatal || 0); }, 0);
            const adaGangguan = hasil.filter(function (d) { return (d.jumlahGangguanAlat || 0) > 0; }).length;
            const set = function (id, v) { const el = document.getElementById(id); if (el) el.textContent = v; };
            set('lapdin-stat-total', hasil.length);
            set('lapdin-stat-klb', totalKlb);
            set('lapdin-stat-alat', adaGangguan);
        }

        function renderLaporanDinasanLama_() {
            const tbody = document.getElementById('lapdin-body');
            const kosong = document.getElementById('lapdin-empty');
            if (!tbody) return;
            const hasil = hitungLaporanDinasan_();

            tbody.innerHTML = '';
            if (!hasil.length) { kosong.classList.remove('hidden'); return; }
            kosong.classList.add('hidden');

            const bolehHapus = (typeof canDo === 'function') ? canDo('tc-serah', 'hapus') : false;
            // Menyunting laporan yang sudah jadi rujukan pihak lain adalah
            // tindakan yang berbeda tingkat dari mengisi formulir. Dibatasi
            // ke Super Admin, & setiap perubahannya tercatat di ActivityLog
            // oleh dinasan_save.
            const bolehSunting = akuSuperAdmin_();
            tbody.innerHTML = hasil.map(function (d, i) {
                const alat = (d.jumlahGangguanAlat || 0) > 0
                    ? '<span class="px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-black">' + d.jumlahGangguanAlat + ' bermasalah</span>'
                    : '<span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-black">Baik</span>';
                return '<tr class="hover:bg-slate-50 transition">' +
                    '<td class="px-3 py-3 text-center text-slate-400 font-mono">' + (i + 1) + '</td>' +
                    '<td class="px-4 py-3 font-mono text-[11px] font-bold text-slate-700">' + escapeHtml(d.nomorDokumen || '-') + '</td>' +
                    '<td class="px-4 py-3"><b>' + escapeHtml(formatTanggalDinasan_(d.tanggal)) + '</b>' +
                        '<div class="text-[10px] text-slate-400 font-bold">' + escapeHtml(d.hari || '') + ' &middot; ' + escapeHtml(d.jam || '') + '</div></td>' +
                    '<td class="px-4 py-3"><span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[10px] font-bold">' +
                        escapeHtml(d.dariDinas || '-') + ' &rarr; ' + escapeHtml(d.keDinas || '-') + '</span></td>' +
                    '<td class="px-4 py-3">' + escapeHtml(d.menyerahkan.nama || '-') +
                        '<div class="text-[10px] text-slate-400 font-mono">' + escapeHtml(d.menyerahkan.nipp || '') + '</div></td>' +
                    '<td class="px-4 py-3">' + escapeHtml(d.menerima.nama || '-') +
                        '<div class="text-[10px] text-slate-400 font-mono">' + escapeHtml(d.menerima.nipp || '') + '</div></td>' +
                    '<td class="px-4 py-3 text-center font-bold text-slate-600">' + ((d.jumlahKlbJalan || 0) + (d.jumlahRekayasa || 0) + (d.jumlahKlbBatal || 0)) + '</td>' +
                    '<td class="px-4 py-3 text-center">' + alat + '</td>' +
                    '<td class="px-4 py-3 text-center"><div class="flex items-center justify-center gap-1">' +
                        '<button onclick="lihatDinasan_(\'' + d.id + '\')" title="Lihat & cetak" class="w-7 h-7 bg-slate-100 hover:bg-slate-800 hover:text-white text-slate-600 rounded transition flex items-center justify-center"><i class="fa-regular fa-eye text-xs"></i></button>' +
                        (bolehSunting ? '<button onclick="suntingDinasan_(\'' + d.id + '\')" title="Sunting laporan ini" class="w-7 h-7 bg-slate-100 hover:bg-[#d4af37] hover:text-[#0c1d37] text-slate-600 rounded transition flex items-center justify-center"><i class="fa-regular fa-pen-to-square text-xs"></i></button>' : '') +
                        (bolehHapus ? '<button onclick="hapusDinasan_(\'' + d.id + '\')" title="Hapus" class="w-7 h-7 bg-slate-100 hover:bg-red-600 hover:text-white text-slate-600 rounded transition flex items-center justify-center"><i class="fa-regular fa-trash-can text-xs"></i></button>' : '') +
                    '</div></td></tr>';
            }).join('');
        }

        function formatTanggalDinasan_(nilai) {
            const teks = String(nilai || '').trim();
            const m = teks.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (!m) return teks || '-';
            const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            return parseInt(m[3], 10) + ' ' + bulan[parseInt(m[2], 10) - 1] + ' ' + m[1];
        }

        function resetFilterLaporanDinasan() {
            ['lapdin-cari', 'lapdin-mulai', 'lapdin-akhir'].forEach(function (id) {
                const el = document.getElementById(id); if (el) el.value = '';
            });
            const sel = document.getElementById('lapdin-dinas');
            if (sel) sel.value = 'Semua';
            renderLaporanDinasan();
            muatSummaryHarian_();
        }

        /** Membuka satu serah terima lengkap lalu langsung menyiapkan cetaknya. */
        /**
         * Membuka laporan SATU pergantian - isinya sebagaimana diserahkan.
         *
         * ═══ KENAPA BUKAN lihatDinasan_ ═══
         * Ketiga baris pergantian di tabel Laporan Dinasan berasal dari satu
         * siklus yang sama, jadi semuanya ber-dinasanId sama. Memanggil
         * lihatDinasan_(dinasanId) membuat ketiganya membuka dokumen yang
         * sama persis - yaitu isi TERAKHIR siklus itu, sesudah dilengkapi
         * dinas-dinas berikutnya. Yang membedakan satu pergantian dari yang
         * lain adalah NOMOR URUTNYA, jadi nomor itulah yang dikirim ke
         * server bersama id siklusnya.
         */
        function lihatSerahTerima_(dinasanId, urut) {
            showToast('Menyiapkan dokumen...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) {
                        showToast('Gagal memuat dokumen: ' + ((res && res.message) || ''));
                        return;
                    }
                    const d = res.data;
                    const ket = 'Pergantian ke-' + (d._urut || '?') + ' &middot; ' +
                        escapeHtml(d._tahapLabel || '') +
                        (d._tanpaArsip ? ' &middot; isi akhir siklus' : '');
                    bukaPratinjauLembar_(d, 'Laporan Serah Terima Dinasan',
                        escapeHtml(d.nomorDokumen || '') + ' &middot; ' +
                            escapeHtml(formatTanggalDinasan_(d.tanggal)),
                        ket);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat dokumen.'); })
                .dinasan_getDokSerahTerima(currentSessionToken, dinasanId, urut);
        }

        function lihatDinasan_(id) {
            showToast('Menyiapkan dokumen...');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { showToast('Gagal memuat dokumen.'); return; }
                    const d = (res.data || []).find(function (x) { return x.id === id; });
                    if (!d) { showToast('Data tidak ditemukan.'); return; }
                    cetakDinasanDariData_(d);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat dokumen.'); })
                .dinasan_getAll(currentSessionToken, false);
        }

        /**
         * true bila pengguna berperan SUPERADMIN atau ADMINISTRATOR.
         *
         * Dulu hanya SUPERADMIN. Diperluas karena Administrator memang peran
         * yang mengurus pembetulan laporan sehari-hari - membatasinya ke satu
         * akun Super Admin berarti setiap salah ketik harus menunggu orang
         * itu, & dalam praktiknya berujung pada penyuntingan sheet langsung
         * yang jauh lebih berbahaya.
         *
         * Penjagaan sebenarnya tetap di server (dinasan_save menolak role
         * lain); fungsi ini hanya menentukan tombolnya terlihat atau tidak.
         */
        function akuSuperAdmin_() {
            const r = String((typeof currentUser !== 'undefined' && currentUser && currentUser.roleId) || '').toUpperCase();
            return r === 'SUPERADMIN' || r === 'ADMINISTRATOR';
        }

        /**
         * Memuat satu serah terima ke formulir untuk disunting - Super Admin.
         *
         * Memakai lanjutkanDariDinasan_ TIDAK bisa: fungsi itu MENYALIN isi ke
         * formulir baru untuk shift berikutnya, bukan membuka barisnya sendiri.
         * Di sini yang dibuka adalah baris itu juga, lengkap dengan id-nya,
         * supaya Simpan menimpa barisnya & tidak melahirkan salinan.
         */
        function suntingDinasan_(id) {
            // Syaratnya disamakan dengan syarat munculnya tombol Edit di
            // tabel (canDo). Kalau keduanya berbeda, tombolnya tampil tapi
            // menolak saat diklik - kegagalan yang paling membingungkan
            // karena tidak terlihat sebagai larangan, melainkan sebagai rusak.
            const bolehSuntingIni = (typeof canDo === 'function') ? canDo('tc-serah', 'edit') : akuSuperAdmin_();
            if (!bolehSuntingIni) { showToast('Anda tidak punya izin menyunting laporan ini.'); return; }

            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) { showToast('Gagal memuat laporan: ' + ((res && res.message) || '')); return; }
                    const d = res.data;

                    switchTab('tc-serah');
                    // Digambar setelah pane-nya tampil, supaya seluruh elemen
                    // formulir sudah ada saat diisi.
                    //
                    // Yang dibuka di sini adalah LAPORAN ARSIP, bukan siklus
                    // yang sedang berjalan. Simpan akan menulis ke barisnya
                    // sendiri - lihat penjaga di simpanFormSerah - & tombol
                    // Serahkan tetap menilai siklus aktif, bukan arsip ini.
                    setTimeout(function () {
                        isiFormulirDariDinasan_(d);
                        // Mode sunting arsip dinyalakan SESUDAH formulir
                        // terisi: isiFormulirDariDinasan_ memanggil
                        // resetFormSerah yang mengembalikan tombol-tombolnya.
                        terapkanModeSuntingArsip_(true, d);
                        showToast('Menyunting isi ' + (d.nomorDokumen || 'laporan') +
                            '. Ubah seperlunya lalu tekan Simpan Perubahan.');
                    }, 60);
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat laporan.'); })
                .dinasan_getSatu(currentSessionToken, id);
        }

        function isiFormulirDariDinasan_(d, diamSaja) {
            resetFormSerah();
            serahEditingId = d.id;
            serahNomorDok_ = d.nomorDokumen || '';
            serahStatus_ = d.status || 'draft';

            const setEl = function (idEl, nilai) { const el = document.getElementById(idEl); if (el) el.value = nilai || ''; };

            shiftDipilihManual_ = true;
            petugasDariManual_ = true;
            setEl('serah-tanggal', d.tanggal);
            isiHariSerah_();
            shiftDipilihManual_ = true;
            petugasDariManual_ = true;
            setEl('serah-dari-dinas', d.dariDinas);
            terapkanJamShift_();
            setEl('serah-keadaan', d.keadaan);
            ubahKeadaanSerah_();
            setEl('serah-keadaan-catatan', d.keadaanCatatan);
            setEl('serah-perka-acuan', d.perkaAcuan);
            setEl('serah-alat-lain', d.alatLain);
            setEl('serah-catatan', d.catatan);

            LINTAS_CETAK.forEach(function (l) {
                const besar = l.k.charAt(0).toUpperCase() + l.k.slice(1);
                const gabung = String(d['ka' + besar] || '');
                const cocok = gabung.match(/^\s*(.*?)\s*KA\s*\/\s*(.*?)\s*TS\s*$/i);
                setEl('serah-ka-' + l.k, cocok ? (cocok[1] === '-' ? '' : cocok[1]) : '');
                setEl('serah-ts-' + l.k, cocok ? (cocok[2] === '-' ? '' : cocok[2]) : '');
                setEl('serah-lintas-' + l.huruf, d['lintas' + besar] || '');
            });

            catatanPeralatan_ = {};
            (d.peralatan || []).forEach(function (a) { if (a.catatan) catatanPeralatan_[a.no] = a.catatan; });
            renderPeralatanSerah_();
            (d.peralatan || []).forEach(function (a) {
                const radio = document.querySelector('input[name="serah-alat-' + a.no + '"][value="' + a.kondisi + '"]');
                if (radio) radio.checked = true;
            });
            perbaruiRingkasAlat_();

            serahSarana = (d.sarana || []).map(function (s) {
                return { depo: s.depo || '', ts: s.ts || '', keterangan: s.keterangan || '' };
            });
            if (!serahSarana.length) serahSarana = [{}, {}];
            renderSarana_();

            // Ketiga tabel perjalanan ikut dimuat - inilah bedanya dengan
            // "Lanjutkan Pengisian", yang justru mengosongkannya.
            barisPerjalanan_.jalan = (d.klbJalan || []).map(function (x) { return Object.assign({}, x); });
            barisPerjalanan_.rekayasa = (d.rekayasa || []).map(function (x) { return Object.assign({}, x); });
            barisPerjalanan_.batal = (d.pembatalan || []).map(function (x) { return Object.assign({}, x); });
            ['jalan', 'rekayasa', 'batal'].forEach(function (j) { renderKlb_(j); });

            isiPetugasDari_({ nama: d.menyerahkanNama, nipp: d.menyerahkanNipp, jabatan: d.menyerahkanJabatan });
            setEl('serah-ke-nama', d.menerimaNama);
            setEl('serah-ke-nipp', d.menerimaNipp);
            setEl('serah-ke-jabatan', d.menerimaJabatan);
            const pKe = (personilStruktur_ || []).find(function (x) {
                return String(x.nik || '').trim() === String(d.menerimaNipp || '').trim();
            });
            if (pKe) {
                const sel = document.getElementById('serah-ke-pilih');
                if (sel) sel.value = pKe.id;
                gambarQrPetugas_('ke', pKe);
            }

            gambarStatusSerah_();
            // Saat siklus dimuat ulang (tiap kali menu dibuka, tiap kali
            // tahap berpindah) pesan ini tidak perlu - yang menyunting sengaja
            // hanya Super Admin lewat tombol Sunting.
            if (!diamSaja) {
                loncatKeLangkah_(1);
                showToast('Menyunting ' + (d.nomorDokumen || 'serah terima') + '. Simpan untuk menimpa baris ini.');
            }
        }

        function hapusDinasan_(id) {
            const d = (dinasanCache_ || []).find(function (x) { return x.id === id; });
            if (!d) return;

            // ═══ KENAPA BUKAN confirm() BAWAAN BROWSER ═══
            // Kotak bawaan menampilkan alamat mentah aplikasi di atas pesannya:
            // "An embedded page at n-qkebjeheokfkpv...script.googleusercontent.com
            // says". Bagi petugas itu terbaca seperti peringatan dari situs
            // asing, bukan konfirmasi dari aplikasi yang sedang dipakai.
            //
            // Pada tindakan sepenting menghapus laporan, keraguan itu justru
            // berbahaya: orang menekan OK tanpa membaca, atau membatalkan hal
            // yang sebenarnya benar. konfirmasi_ memakai modal aplikasi
            // sendiri - tanpa alamat mentah, & menegaskan apa yang akan hilang.
            const teruskan = function () {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res.success) { showToast('Gagal menghapus: ' + (res.message || '')); return; }
                        showToast('Serah terima ' + (d.nomorDokumen || '') + ' dihapus.');
                        loadLaporanDinasan(true);
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat menghapus.'); })
                    .dinasan_delete(currentSessionToken, id);
            };

            konfirmasi_({

        /** Export Laporan Dinasan ke Excel mengikuti filter aktif. */
        function exportLaporanDinasan() {
            const hasil = hitungLaporanDinasan_();
            if (!hasil.length) { showToast('Tidak ada data untuk diexport.'); return; }
            try {
                const headers = ['NO', 'NOMOR DOKUMEN', 'TANGGAL', 'HARI', 'JAM', 'DARI DINAS', 'KE DINAS',
                    'KEADAAN', 'MENYERAHKAN', 'NIPP', 'MENERIMA', 'NIPP', 'JUMLAH KLB', 'ALAT BERMASALAH', 'CATATAN'];
                const rows = hasil.map(function (d, i) {
                    return [i + 1, d.nomorDokumen, d.tanggal, d.hari, d.jam, d.dariDinas, d.keDinas, d.keadaan,
                        d.menyerahkan.nama, d.menyerahkan.nipp, d.menerima.nama, d.menerima.nipp,
                        (d.jumlahKlbJalan || 0) + (d.jumlahRekayasa || 0) + (d.jumlahKlbBatal || 0), d.jumlahGangguanAlat || 0, d.catatan || ''];
                });
                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                ws['!cols'] = headers.map(function (h) { return { wch: h === 'CATATAN' ? 45 : (h === 'NO' ? 5 : 18) }; });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Laporan Dinasan');
                XLSX.writeFile(wb, 'Laporan_Dinasan_KCI_' + hariIniIso_() + '.xlsx');
                showToast(hasil.length + ' serah terima diexport.');
            } catch (err) {
                console.log('exportLaporanDinasan error:', err);
                showToast('Gagal membuat berkas export.');
            }
        }

        // ════════════════════════════════════════════════════════════════
        // PERAPI CATATAN DINAS (23 Oktober 2026)
        // ════════════════════════════════════════════════════════════════
        //
        // ═══ MASALAHNYA ═══
        // Isian Catatan diketik petugas di sebuah textarea - biasanya rapi,
        // bernomor 1..7 dengan sub-poin bertanda "*". Tapi lembar cetak
        // menyisipkannya lewat escapeHtml() saja. escapeHtml tidak mengenal
        // baris baru, & HTML memperlakukan baris baru sebagai spasi biasa -
        // jadi laporan serapi apa pun keluar sebagai SATU PARAGRAF padat
        // yang praktis tidak terbaca. Itulah keluhan "poin 4 tidak rapi".
        //
        // ═══ KENAPA TIDAK CUKUP MENGGANTI \n JADI <br> ═══
        // Karena sebagian catatan memang tersimpan tanpa baris baru sama
        // sekali - diketik menyatu, atau disalin dari sumber lain. Mengganti
        // \n saja tidak memperbaiki apa pun untuk catatan semacam itu.
        //
        // Maka penyusunnya bekerja dua arah:
        //   - ada baris baru  -> dihormati apa adanya;
        //   - menyatu         -> dipecah ulang berdasarkan DERET NOMORNYA.
        //
        // Pemecahan deret nomor memakai syarat ketat supaya tidak merusak
        // isi: nomor berikutnya hanya diterima bila MELANJUTKAN urutan (atau
        // memulai deret baru dari 1), & titiknya harus diikuti spasi. Dua
        // syarat itu yang membuat "Jam 18.30" & "4 KA andil 37 menit" tetap
        // utuh - keduanya pernah jadi contoh nyata di laporan gangguan pintu
        // KA 1382.

        /** Memecah teks yang memuat deret nomor menyatu. null bila bukan deret. */
        function pecahNomorSebaris_(teks) {
            const re = /(^|[\s(])(\d{1,2})\.(?=\s)/g;
            const potong = [];
            let harap = null, m;
            while ((m = re.exec(teks)) !== null) {
                const n = Number(m[2]);
                if (harap === null) { harap = n; }
                else if (n !== harap && !(n === 1 && harap > 2)) { continue; }
                potong.push({ mulai: m.index + m[1].length, no: n });
                harap = n + 1;
            }
            if (potong.length < 2) return null;     // satu nomor saja bukan daftar

            const bagian = [];
            const kepala = teks.slice(0, potong[0].mulai).trim();
            if (kepala) bagian.push({ jenis: 'judul', teks: kepala });
            potong.forEach(function (p, i) {
                const habis = (i + 1 < potong.length) ? potong[i + 1].mulai : teks.length;
                bagian.push({
                    jenis: 'nomor', no: p.no,
                    teks: teks.slice(p.mulai, habis).replace(/^\d{1,2}\.\s*/, '').trim()
                });
            });
            return bagian;
        }

        /** Memecah sub-poin bertanda * atau • di tengah kalimat. */
        function pecahBulletSebaris_(teks) {
            const idx = teks.search(/\s[*•]\s/);
            if (idx === -1) return null;
            const butir = teks.slice(idx).split(/\s[*•]\s/)
                .map(function (s) { return s.trim(); })
                .filter(function (s) { return s; });
            if (!butir.length) return null;
            return { kepala: teks.slice(0, idx).trim(), butir: butir };
        }

        /**
         * "Hari/tanggal : Rabu" -> labelnya ditebalkan.
         * Teks yang masuk HARUS sudah lolos escapeHtml.
         */
        function tebalkanLabelCatatan_(aman) {
            const m = aman.match(/^([^:]{2,34}?)\s*:\s*(.+)$/);
            if (!m) return aman;
            if (/^\/\//.test(m[2])) return aman;    // "http://..." bukan label
            return '<b>' + m[1].trim() + '</b> : ' + m[2];
        }

        /** Satu sub-poin, menjorok dengan penanda bulatan. */
        function butirBulletCatatan_(isi) {
            return '<div style="padding-left:30px;text-indent:-11px;margin:0 0 2px">' +
                '<span style="color:#64748b">&bull;</span> ' +
                tebalkanLabelCatatan_(escapeHtml(String(isi).trim())) + '</div>';
        }

        /** Satu butir bernomor, berikut sub-poin yang menempel di belakangnya. */
        function butirNomorCatatan_(no, isi) {
            const sub = pecahBulletSebaris_(isi);
            let html = '<div style="padding-left:16px;text-indent:-16px;margin:0 0 2px">' +
                '<b>' + no + '.</b> ' +
                tebalkanLabelCatatan_(escapeHtml(sub ? sub.kepala : isi)) + '</div>';
            if (sub) html += sub.butir.map(butirBulletCatatan_).join('');
            return html;
        }

        /**
         * Menyusun isian bebas petugas jadi HTML yang terbaca: penomoran
         * menggantung, sub-poin menjorok, & jarak antar blok gangguan.
         * Dipakai untuk Catatan & Catatan Keadaan Dinas.
         */
        function catatanDinasHtml_(teks) {
            const asli = String(teks == null ? '' : teks).replace(/\r\n?/g, '\n').trim();
            if (!asli) return '<span style="color:#94a3b8">Tiada</span>';

            // Baris yang masih memuat deret nomor menyatu dipecah dulu,
            // supaya laporan yang setengah rapi pun ikut terurai.
            const baris = [];
            asli.split('\n').forEach(function (b) {
                const t = b.trim();
                if (!t) { baris.push(''); return; }
                const pecah = pecahNomorSebaris_(t);
                if (!pecah) { baris.push(t); return; }
                pecah.forEach(function (x) {
                    baris.push(x.jenis === 'nomor' ? x.no + '. ' + x.teks : x.teks);
                });
            });

            const keluar = [];
            let nomorTerakhir = 0;
            baris.forEach(function (t) {
                if (!t) { keluar.push('<div style="height:5px"></div>'); return; }

                const mNomor = t.match(/^(\d{1,2})\.\s*(.*)$/);
                const mBullet = t.match(/^[*•\-]\s+(.*)$/);

                if (mNomor) {
                    const n = Number(mNomor[1]);
                    // Nomor mundur ke 1 = blok gangguan baru, beri pemisah.
                    if (n === 1 && nomorTerakhir > 1) keluar.push('<div style="height:7px"></div>');
                    nomorTerakhir = n;
                    keluar.push(butirNomorCatatan_(n, mNomor[2]));
                } else if (mBullet) {
                    keluar.push(butirBulletCatatan_(mBullet[1]));
                } else {
                    const sub = pecahBulletSebaris_(t);
                    if (sub) {
                        if (sub.kepala) {
                            keluar.push('<div style="margin:0 0 2px">' +
                                tebalkanLabelCatatan_(escapeHtml(sub.kepala)) + '</div>');
                        }
                        keluar.push(sub.butir.map(butirBulletCatatan_).join(''));
                    } else {
                        keluar.push('<div style="margin:0 0 2px">' +
                            tebalkanLabelCatatan_(escapeHtml(t)) + '</div>');
                    }
                }
            });
            return keluar.join('');
        }

        /** Judul satu poin Catatan Dinas, dengan penomoran menggantung. */
        function poinCatatan_(no, isi) {
            return '<div style="padding-left:15px;text-indent:-15px;margin:0 0 2px">' +
                '<b>' + no + '.</b> ' + isi + '</div>';
        }

        /** Baris anak di bawah sebuah poin Catatan Dinas. */
        function anakCatatan_(penanda, isi) {
            return '<div style="padding-left:30px;text-indent:-13px;margin:0 0 1px">' +
                penanda + ' ' + isi + '</div>';
        }

        /**
         * Seluruh blok CATATAN DINAS (poin 1 s.d. 5).
         *
         * Dulu kelimanya dirangkai sebagai satu untaian teks dengan &nbsp;
         * sebagai "indentasi" & <br> sebagai pemisah. Cara itu tidak punya
         * konsep baris: begitu isi sebuah poin lebih panjang dari satu baris,
         * sambungannya kembali rata kiri & struktur nomornya hilang. Sekarang
         * tiap poin jadi blok sendiri dengan indentasi menggantung, sehingga
         * teks sepanjang apa pun tetap sejajar di bawah nomornya.
         */
        function blokCatatanDinas_(d) {
            const sarana = d.sarana || [];
            const bagian = [];

            bagian.push(poinCatatan_(1, 'PERKA mengacu ' + escapeHtml(d.perkaAcuan || '-')) +
                LINTAS_CETAK.map(function (l) {
                    return anakCatatan_('-', escapeHtml(l.label) + ' : ' +
                        escapeHtml((d.jumlahKa || {})[l.k] || '-'));
                }).join(''));

            bagian.push(poinCatatan_(2, 'Cadangan/SO Sarana : ' +
                    (sarana.length ? sarana.length + ' TS' : 'Tiada')) +
                sarana.map(function (s, i) {
                    // Nama depo sering sudah diketik lengkap dengan kata
                    // "Depo", & menambahkannya lagi menghasilkan "Depo Depo
                    // Bogor". Keterangan "-" juga dilewati: tanda hubung di
                    // dalam kurung hanya menambah ramai tanpa memberi arti.
                    const depo = String(s.depo || '-').trim();
                    const ket = String(s.keterangan || '').trim();
                    return anakCatatan_((i + 1) + '.',
                        (/^depo\b/i.test(depo) ? '' : 'Depo ') + escapeHtml(depo) + ' : ' +
                        escapeHtml(s.ts || '-') +
                        (ket && ket !== '-' ? ' (' + escapeHtml(ket) + ')' : ''));
                }).join(''));

            bagian.push(poinCatatan_(3, 'Situasi Lintas :') +
                LINTAS_CETAK.map(function (l, i) {
                    return anakCatatan_(String.fromCharCode(65 + i) + '.',
                        escapeHtml(l.label) + ' : ' +
                        escapeHtml((d.situasiLintas || {})[l.k] || '-'));
                }).join(''));

            // Poin 4 & 5 adalah isian bebas - inilah yang lewat perapi.
            bagian.push(poinCatatan_(4, 'Catatan :') +
                '<div style="padding-left:15px;margin-top:2px">' +
                catatanDinasHtml_(d.catatan) + '</div>');

            if (String(d.keadaanCatatan || '').trim()) {
                bagian.push(poinCatatan_(5, 'Catatan Keadaan Dinas :') +
                    '<div style="padding-left:15px;margin-top:2px">' +
                    catatanDinasHtml_(d.keadaanCatatan) + '</div>');
            }

            return '<div class="judul-bagian">CATATAN DINAS</div><div class="kotak">' +
                bagian.map(function (b) {
                    return '<div style="margin-bottom:6px">' + b + '</div>';
                }).join('') + '</div>';
        }

        /**
         * Mencetak lembar serah terima.
         *
         * Penyusun HTML-nya dipisah ke susunLembarDinasan_ supaya PRATINJAU
         * menampilkan berkas yang persis sama dengan yang keluar di kertas.
         * Dua penyusun terpisah pasti berbeda cepat atau lambat, & perbedaan
         * antara yang dilihat & yang dicetak adalah jenis kesalahan yang baru
         * ketahuan setelah dokumennya beredar.
         */
        function cetakDinasanDariData_(d) {
            const html = susunLembarDinasan_(d);
            const win = window.open('', '_blank');
            if (!win) { showToast('Popup diblokir browser - izinkan popup untuk mencetak.'); return; }
            win.document.write(html);
            win.document.close();
            win.onload = function () { win.focus(); win.print(); };
        }

        function susunLembarDinasan_(d) {
            // QR pengesahan di TENGAH sudah tidak dipakai lagi (6 September

            const barisKlb = function (daftar) {

                '</tr></table>' +

                '<div class="kotak" style="margin-top:8px">' +
                    '<b>Hari</b> : ' + escapeHtml(d.hari) + ' &nbsp;&nbsp; <b>Tanggal</b> : ' + escapeHtml(d.tanggal) +

                    escapeHtml(d.keDinas) + ' &nbsp;&nbsp; <b>Dalam Keadaan</b> : ' + escapeHtml(d.keadaan) +
                    // Penanda pergantian - hanya ada pada lembar yang dibuka

                    (d._tahapLabel

                // Laporan yang pergantiannya terjadi sebelum arsip per

                '<div class="judul-bagian">A. PERALATAN KERJA MONITORING</div><table>' +

                ((d._riwayatTtd && d._riwayatTtd.length)

        // ================================================================
        // RANTAI DINASAN & PELENGKAPAN PETUGAS (30 Agustus 2026)
        // ================================================================
        //
        // Mengikuti rancangan v2: satu hari terdiri dari TIGA serah terima
        // berantai (Pagi -> Siang -> Malam -> Pagi hari berikutnya). Panel
        // rantai memperlihatkan sudah sampai mana hari itu, sehingga petugas
        // tahu apakah dinas sebelumnya benar-benar sudah menyerahkan.

        const SERAH_JAM = { Pagi: '06.00 - 14.00', Siang: '14.00 - 22.00', Malam: '22.00 - 06.00' };
        const SERAH_BERIKUT = { Pagi: 'Siang', Siang: 'Malam', Malam: 'Pagi' };
        const SERAH_URUTAN = ['Pagi', 'Siang', 'Malam'];

        let daftarPetugas_ = [];

        /**
         * Jam dinas & dinas tujuan MENGIKUTI shift yang dipilih, tidak diisi
         * sendiri. Di formulir aslinya ketiganya memang selalu sepasang -
         * membiarkannya bebas hanya membuka peluang salah isi.
         */
        /**
         * Ditandai true begitu petugas mengubah sendiri pilihan shift atau
         * memilih sendiri "yang menyerahkan". Sejak itu, pengisian otomatis
         * dari rantai berhenti menimpanya - orang yang sedang membetulkan
         * laporan tertinggal tidak boleh dipaksa kembali ke tebakan sistem.
         * Keduanya dinolkan lagi setiap kali TANGGAL berganti.
         */
        let shiftDipilihManual_ = false;
        let petugasDariManual_ = false;

        function ubahShiftSerah_(manual) {
            if (manual) shiftDipilihManual_ = true;
            terapkanJamShift_();
            muatRantaiDinasan_();
        }

        /**
         * Jam dinas & dinas tujuan mengikuti shift. Dipisah dari
         * ubahShiftSerah_ supaya pengisian otomatis bisa memakainya TANPA
         * memicu pembacaan rantai lagi - kalau tidak, keduanya saling
         * memanggil tanpa henti.
         */
        function terapkanJamShift_() {
            const shift = document.getElementById('serah-dari-dinas').value;
            document.getElementById('serah-jam').value = SERAH_JAM[shift] || '';
            document.getElementById('serah-ke-dinas').value = SERAH_BERIKUT[shift] || '';
            perbaruiLabelSerah_(SERAH_BERIKUT[shift] || '');
        }

        /**
         * Tombol kirim menyebutkan dinas TUJUAN, bukan kata "penerima".
         *
         * "Serahkan ke Dinas Siang" mengatakan apa yang akan terjadi;
         * "Kirim ke Penerima" menyerahkan tebakan itu kepada pembacanya.
         * Pada formulir yang dipakai bergiliran tiga shift, perbedaan itu
         * menentukan - petugas tahu seketika apakah ia sedang di giliran yang
         * benar.
         */
        function perbaruiLabelSerah_(keDinas) {
            const teks = keDinas ? 'Serahkan ke Dinas ' + keDinas : 'Serahkan Laporan';
            const toolbar = document.querySelector('#btn-add-tc-serah span:last-child');
            if (toolbar) toolbar.textContent = teks;
            const bawah = document.querySelector('#btn-serah-kirim span:last-child');
            if (bawah) bawah.textContent = teks;
        }

        /** Mengambil status rantai untuk tanggal yang sedang dipilih. */
        /**
         * ═══ DIPENSIUNKAN 7 Oktober 2026 ═══
         * Fungsi ini menggambar rantai PER HARI dari tiga dokumen terpisah -
         * model sebelum satu laporan per siklus. Ia menulis ke elemen yang
         * sama dengan bilah tahap (#rantai-alur, #rantai-tutup) & ke tombol
         * Closing, sehingga hasilnya menimpa gambaran yang benar beberapa
         * ratus milidetik setelah laporan dimuat.
         *
         * Dibiarkan ada karena masih dipanggil beberapa tempat lama, tapi
         * badannya dikosongkan. Menghapusnya sekalian berisiko memutus
         * pemanggil yang belum sempat saya telusuri.
         */
        function muatRantaiDinasan_() { return; }

        function muatRantaiDinasanLama_() {
            const wadah = document.getElementById('rantai-alur');
            if (!wadah) return;
            const tanggal = document.getElementById('serah-tanggal').value;
            if (!tanggal) { wadah.innerHTML = ''; return; }

            // Dibungkus try/catch: panel rantai hanyalah PELENGKAP. Kalau
            // fungsi servernya belum tersedia - misalnya Module_Dinasan.gs
            // belum ikut diperbarui - formulirnya harus tetap bisa diisi &
            // disimpan, bukan ikut macet karena panel tambahan ini.
            try {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) { wadah.innerHTML = ''; return; }
                        const r = res.data;
                        gambarRantaiDinasan_(r);

                        // Dinas PAGI menerima tongkat dari dinas MALAM TANGGAL
                        // KEMARIN, bukan dari shift mana pun di hari ini - jadi
                        // rantai kemarin perlu dibaca terpisah. Hanya dilakukan
                        // bila memang dibutuhkan, supaya tidak ada permintaan
                        // tambahan untuk shift Siang & Malam.
                        const perluKemarin = !r.isi.Pagi && !petugasDariManual_;
                        if (!perluKemarin) { terapkanRantaiKeForm_(r, null); return; }

                        google.script.run
                            .withSuccessHandler(function (res2) {
                                terapkanRantaiKeForm_(r, (res2 && res2.success) ? res2.data : null);
                            })
                            .withFailureHandler(function () { terapkanRantaiKeForm_(r, null); })
                            .dinasan_getRantai(currentSessionToken, geserTanggalSerah_(tanggal, -1));
                    })
                    .withFailureHandler(function () { wadah.innerHTML = ''; })
                    .dinasan_getRantai(currentSessionToken, tanggal);
            } catch (err) {
                console.log('[dinasan] panel rantai dilewati:', err);
                wadah.innerHTML = '';
            }
        }

        /**
         * Tombol Tutup Laporan Harian - hanya untuk petugas dinas Malam.
         *
         * ═══ KENAPA BUKAN OTOMATIS ═══
         * Ketiga serah terima selesai secara teknis bisa dipakai sebagai
         * tanda "hari ini rampung", & menutupnya sendiri memang lebih cepat.
         * Tapi yang dinyatakan di sini bukan fakta teknis melainkan
         * TANGGUNG JAWAB: bahwa catatan hari itu sudah diperiksa & tidak akan
         * diubah lagi. Pernyataan seperti itu harus ada orangnya, & orang itu
         * adalah petugas dinas Malam - dialah yang terakhir memegang hari itu.
         *
         * Tombolnya tetap ditampilkan kepada siapa pun, tapi mati & menyebutkan
         * alasannya. Menyembunyikannya sama sekali membuat petugas lain
         * mengira fitur ini tidak ada.
         */
        /** Tanggal yang sedang dipegang tombol Close Laporan di toolbar. */
        let tanggalSiklusAktif_ = '';

        /**
         * Mengatur keadaan tombol Close Laporan di toolbar & keterangan di
         * panel Rantai Dinasan.
         *
         * Tombolnya TIDAK disembunyikan saat tidak bisa dipakai. Tombol yang
         * hilang-timbul membuat orang mengira fiturnya rusak; tombol yang mati
         * dengan judul penjelas mengatakan apa yang kurang.
         */
        function gambarTombolTutupSiklus_(r) {
            tanggalSiklusAktif_ = r.tanggal || '';
            const btn = document.getElementById('btn-tutup-siklus');
            const wadah = document.getElementById('rantai-tutup');

            const sudah = !!r.siklusDitutup;
            const bisa = !sudah && !!r.bolehTutup;

            if (btn) {
                btn.disabled = !bisa;
                btn.title = sudah
                    ? 'Laporan hari ini sudah ditutup oleh ' + (r.ditutupOleh || '-')
                    : (bisa
                        ? 'Tutup laporan ' + formatTanggalDinasan_(r.tanggal) + ' & mulai siklus baru'
                        : (r.alasanTidakBolehTutup || 'Belum bisa ditutup.'));
                btn.className = bisa
                    ? 'px-3 py-2 bg-[#d4af37] hover:bg-amber-400 text-[#0c1d37] border border-amber-500/40 font-bold text-[11px] rounded-lg flex items-center gap-1.5 shadow-sm transition'
                    : 'px-3 py-2 bg-slate-100 text-slate-400 border border-slate-200 font-bold text-[11px] rounded-lg flex items-center gap-1.5 shadow-sm transition cursor-not-allowed';
                btn.innerHTML =
                    '<span class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] ' +
                        (bisa ? 'bg-[#0c1d37]/15 text-[#0c1d37]' : 'bg-slate-200 text-slate-400') + '">' +
                        '<i class="fa-solid ' + (sudah ? 'fa-circle-check' : 'fa-flag-checkered') + '"></i></span>' +
                    '<span>' + (sudah ? 'Sudah Ditutup' : 'Close Laporan') + '</span>';
            }

            if (!wadah) return;
            if (sudah) {
                wadah.innerHTML =
                    '<div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-between gap-3 flex-wrap">' +
                        '<div><p class="text-[11px] font-black text-emerald-800">' +
                            '<i class="fa-solid fa-circle-check mr-1.5"></i>Laporan harian sudah ditutup</p>' +
                        '<p class="text-[10px] font-bold text-emerald-700 mt-0.5">Oleh ' +
                            escapeHtml(r.ditutupOleh || '-') +
                            (r.ditutupPada ? ' &middot; ' + escapeHtml(formatTanggalDinasan_(tanggalDariCapWaktu_(r.ditutupPada))) : '') +
                            '</p></div>' +
                        '<button onclick="lihatLaporanHarian_(\'' + r.tanggal + '\')" ' +
                            'class="px-4 py-2 bg-white hover:bg-emerald-100 border border-emerald-300 text-emerald-800 font-bold text-[11px] rounded-lg transition flex items-center gap-1.5">' +
                            '<i class="fa-solid fa-file-lines"></i><span>Lihat Laporan Harian</span></button>' +
                    '</div>';
            } else if (bisa) {
                wadah.innerHTML =
                    '<p class="text-[11px] font-bold text-[#0c1d37] bg-amber-50 border border-amber-300 rounded-xl p-3">' +
                        '<i class="fa-solid fa-flag-checkered mr-1.5 text-amber-600"></i>' +
                        'Seluruh serah terima ' + escapeHtml(formatTanggalDinasan_(r.tanggal)) +
                        ' sudah ditutup. Tekan <strong>Close Laporan</strong> di kanan atas untuk menutup hari ini &amp; memulai siklus baru.' +
                        (r.mewakiliTutup ? ' <span class="text-amber-700">Anda menutup MEWAKILI ' + escapeHtml(r.petugasMalam || '-') + '.</span>' : '') +
                    '</p>';
            } else {
                wadah.innerHTML =
                    '<p class="text-[10px] font-semibold text-slate-400 px-1">' +
                        '<i class="fa-solid fa-circle-info mr-1"></i>' + escapeHtml(r.alasanTidakBolehTutup || '') + '</p>';
            }
        }

        function tutupSiklusDariToolbar_() { closingSiklusAktif_(); }

        function tutupSiklusHarian_(tanggal) {
            const kirim = function (catatan) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) { showToast('Gagal menutup laporan: ' + ((res && res.message) || '')); return; }
                        showToast('Laporan harian ' + formatTanggalDinasan_(tanggal) + ' ditutup.' +
                            (res.mewakili ? ' Dicatat sebagai MEWAKILI petugas dinas Malam.' : '') +
                            ' Formulir dikosongkan - siklus baru dimulai dari dinas Pagi.');
                        dinasanCache_ = null;

                        // ═══ SIKLUS BARU LANGSUNG SIAP DIISI ═══
                        // Menutup laporan berarti hari itu selesai. Meninggalkan
                        // isian hari kemarin di layar hanya membuka peluang
                        // serah terima berikutnya tertulis di atas data lama.
                        //
                        // Tanggalnya dimajukan ke HARI BERIKUTNYA: siklus yang
                        // baru saja ditutup sudah lengkap, jadi isian berikutnya
                        // pasti milik hari sesudahnya - dimulai dari dinas Pagi,
                        // yang menerima tongkat dari dinas Malam yang baru saja
                        // menutup.
                        serahEditingId = null;
                        serahNomorDok_ = '';
                        resetFormSerah();
                        const el = document.getElementById('serah-tanggal');
                        if (el) { el.value = geserTanggalSerah_(tanggal, 1); isiHariSerah_(); }

                        muatNotifikasiDinasan_();
                        lihatLaporanHarian_(tanggal);
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat menutup laporan harian.'); })
                    .dinasan_tutupSiklus(currentSessionToken, tanggal, catatan || '');
            };

            if (typeof konfirmasi_ === 'function') {
                konfirmasi_({
                    judul: 'Tutup laporan ' + formatTanggalDinasan_(tanggal) + '?',
                    pesan: 'Anda menyatakan catatan hari ini sudah lengkap & tidak akan diubah lagi. ' +
                           'Setelah ditutup, hari ini masuk ke rekapitulasi resmi dan siklus baru dimulai.',
                    rincian: 'Hanya Administrator yang bisa membukanya kembali.',
                    ya: 'Tutup Laporan', ikonYa: 'fa-flag-checkered', ikon: 'fa-lock'
                }).then(function (ya) { if (ya) kirim(''); });
            } else { kirim(''); }
        }

        /**
         * Mengisi sendiri Identitas Dinas dari rantai hari itu.
         *
         * ═══ APA YANG DISIMPULKAN, DAN DARI MANA ═══
         * Satu hari berisi tiga serah terima berantai: Pagi -> Siang -> Malam.
         * Shift yang BELUM ada serah terimanya adalah yang sedang berjalan,
         * jadi itulah yang dipilih. Dari situ, jam dinas & dinas tujuan
         * mengikuti dengan sendirinya.
         *
         * Petugas "yang menyerahkan" pun bisa disimpulkan: orang yang MENERIMA
         * dinas sebelumnya adalah orang yang sekarang bertugas, dan dialah yang
         * akan menyerahkan. Untuk dinas Pagi, "sebelumnya" berarti dinas Malam
         * TANGGAL KEMARIN - shift malam menyeberangi tengah malam - jadi rantai
         * hari kemarin ikut dibaca (lihat muatRantaiDinasan_).
         *
         * Semua ini hanya SARAN yang mengisi kolom kosong. Begitu petugas
         * mengubahnya sendiri, pengisian otomatis berhenti menyentuhnya.
         */
        function terapkanRantaiKeForm_(r, dariKemarin) {
            const lencana = document.getElementById('serah-shift-otomatis');

            // Shift pertama yang belum diserahkan = yang sedang berjalan.
            const belum = SERAH_URUTAN.filter(function (s) { return !r.isi[s]; });
            const shiftBerjalan = belum.length ? belum[0] : null;

            if (shiftBerjalan && !shiftDipilihManual_) {
                const sel = document.getElementById('serah-dari-dinas');
                if (sel && sel.value !== shiftBerjalan) {
                    sel.value = shiftBerjalan;
                    terapkanJamShift_();   // TANPA memuat rantai lagi
                }
                if (lencana) lencana.classList.remove('hidden');
            } else if (lencana) {
                lencana.classList.add('hidden');
            }

            if (petugasDariManual_) return;

            // Siapa yang menyerahkan: penerima dinas SEBELUM shift berjalan.
            const shift = shiftBerjalan || document.getElementById('serah-dari-dinas').value;
            let sebelumnya = null;
            if (shift === 'Siang') sebelumnya = r.isi.Pagi;
            else if (shift === 'Malam') sebelumnya = r.isi.Siang;
            else if (shift === 'Pagi') sebelumnya = dariKemarin && dariKemarin.isi ? dariKemarin.isi.Malam : null;

            if (!sebelumnya || !sebelumnya.menerima) return;

            isiPetugasDari_({
                nama: sebelumnya.menerima,
                nipp: sebelumnya.menerimaNipp || '',
                jabatan: sebelumnya.menerimaJabatan || ''
            });
        }

        /**
         * ADMIN_TRAFFIC selalu menyerahkan atas nama DIRINYA SENDIRI.
         *
         * Role itu memang hanya boleh mengisi Serah Terima (lihat
         * MENU_INPUT_TRAFFIC di Service_Session.gs) - ia petugas monitoring
         * yang melaporkan dinasnya sendiri, bukan penyusun laporan orang lain.
         * Karena itu kolomnya diisi dari akunnya dan pilihannya dikunci:
         * membiarkannya bisa menulis nama orang lain di kolom "yang
         * menyerahkan" berarti membiarkan satu orang menandatangani serah
         * terima atas nama rekannya.
         *
         * Role lain (Administrator, Super Admin) tidak dikunci - merekalah
         * yang membetulkan laporan tertinggal milik siapa pun.
         */
        function terapkanPetugasAkun_() {
            const role = String((typeof currentUser !== 'undefined' && currentUser && currentUser.roleId) || '').toUpperCase();
            if (role !== 'ADMIN_TRAFFIC') return;

            const sel = document.getElementById('serah-dari-pilih');
            const nipp = String((currentUser && currentUser.username) || '').trim();
            const nama = String((currentUser && currentUser.nama) || '').trim();

            // Dicocokkan ke Struktur Organisasi supaya jabatan & QR-nya ikut.
            const p = (personilStruktur_ || []).find(function (x) {
                return (nipp && String(x.nik || '').trim() === nipp) ||
                       (nama && String(x.nama || '').trim().toUpperCase() === nama.toUpperCase());
            });

            isiPetugasDari_(p
                ? { nama: p.nama, nipp: p.nik, jabatan: p.jabatan }
                : { nama: nama, nipp: nipp, jabatan: '' });
            petugasDariManual_ = true;   // rantai tidak boleh menimpanya lagi

            if (sel) {
                sel.disabled = true;
                sel.classList.add('bg-slate-100', 'cursor-not-allowed');
                sel.title = 'Terkunci - Anda hanya bisa menyerahkan dinas atas nama sendiri.';
            }
            // Peringatan HANYA setelah daftar personil benar-benar ada.
            // Fungsi ini juga dipanggil dari resetFormSerah, saat daftarnya
            // masih kosong - memperingatkan di titik itu berarti menuduh data
            // tidak lengkap padahal ia hanya belum sempat dimuat.
            if (!p && (personilStruktur_ || []).length) {
                showToast('Nama Anda belum terdaftar di Struktur Organisasi, jadi QR petugas belum bisa dibuat.');
            }
        }

        /**
         * Mengisi kolom "yang menyerahkan" beserta QR-nya.
         *
         * Pencocokan ke Struktur Organisasi memakai NIPP lebih dulu, baru nama:
         * NIPP unik, sedangkan nama yang sama bukan hal langka di daftar
         * pegawai. Kalau tidak ketemu, kolomnya tetap terisi & hanya QR-nya
         * yang tidak bisa dibuat - lebih baik daripada mengosongkan semuanya.
         */
        function isiPetugasDari_(orang) {
            const setEl = function (id, nilai) { const el = document.getElementById(id); if (el) el.value = nilai || ''; };
            setEl('serah-dari-nama', orang.nama);
            setEl('serah-dari-nipp', orang.nipp);
            setEl('serah-dari-jabatan', orang.jabatan);

            const nipp = String(orang.nipp || '').trim();
            const nama = String(orang.nama || '').trim().toUpperCase();
            const p = (personilStruktur_ || []).find(function (x) {
                return (nipp && String(x.nik || '').trim() === nipp) ||
                       (!nipp && nama && String(x.nama || '').trim().toUpperCase() === nama);
            });

            const sel = document.getElementById('serah-dari-pilih');
            if (p) {
                if (sel) sel.value = p.id;
                if (!orang.jabatan && p.jabatan) setEl('serah-dari-jabatan', p.jabatan);
                gambarQrPetugas_('dari', p);
            } else {
                if (sel) sel.value = '';
                kosongkanQrPetugas_('dari');
            }
            gambarQrSerah_();
        }

        function gambarRantaiDinasan_(r) {
            const shiftAktif = document.getElementById('serah-dari-dinas').value;
            document.getElementById('rantai-tanggal').textContent = formatTanggalDinasan_(r.tanggal);

            const status = document.getElementById('rantai-status');
            if (r.lengkap) {
                status.className = 'px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-[10px] font-black text-emerald-700';
                status.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i>Laporan Harian Tutup';
            } else {
                status.className = 'px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-[10px] font-black text-amber-700';
                status.innerHTML = '<i class="fa-solid fa-hourglass-half mr-1"></i>Berjalan &middot; ' + r.terisi + '/3 dinas';
            }

            const simpul = SERAH_URUTAN.map(function (s) {
                const a = r.isi[s];
                const sedangDiisi = !a && s === shiftAktif;
                const gaya = a ? 'bg-emerald-50 border-emerald-200'
                    : (sedangDiisi ? 'bg-[#0c1d37] border-[#0c1d37] text-white' : 'bg-white border-slate-200');
                const lencana = a
                    ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[9px] font-black">Diserahkan</span>'
                    : (sedangDiisi ? '<span class="px-2 py-0.5 rounded-full bg-[#d4af37] text-white text-[9px] font-black">Sedang Diisi</span>'
                                   : '<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 text-[9px] font-black">Menunggu</span>');
                return '<div class="p-3 rounded-xl border ' + gaya + '">' +
                    '<div class="text-[9px] font-black uppercase tracking-wider ' + (sedangDiisi ? 'text-slate-300' : 'text-slate-400') + '">Dinas ' + s + '</div>' +
                    '<div class="text-[11px] font-bold mt-0.5 truncate ' + (sedangDiisi ? 'text-white' : 'text-slate-700') + '">' +
                        escapeHtml(a ? a.menyerahkan : (sedangDiisi ? 'Sedang diisi' : 'Menunggu')) + '</div>' +
                    '<div class="text-[9px] font-bold ' + (sedangDiisi ? 'text-slate-400' : 'text-slate-400') + ' mt-0.5">' + escapeHtml(SERAH_JAM[s]) + '</div>' +
                    '<div class="mt-1.5">' + lencana + '</div></div>';
            }).join('');

            // Simpul penutup: dinas Malam menyerahkan ke Pagi hari berikutnya.
            const penutup = '<div class="p-3 rounded-xl border ' + (r.lengkap ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-dashed border-slate-300') + '">' +
                '<div class="text-[9px] font-black uppercase tracking-wider text-slate-400">Penutup</div>' +
                '<div class="text-[11px] font-bold text-slate-700 mt-0.5">Pagi hari berikutnya</div>' +
                '<div class="text-[9px] font-bold text-slate-400 mt-0.5">Serah terima penutup</div>' +
                '<div class="mt-1.5">' + (r.lengkap
                    ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[9px] font-black">Laporan Tertutup</span>'
                    : '<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 text-[9px] font-black">Menunggu Dinas Malam</span>') + '</div></div>';

            document.getElementById('rantai-alur').innerHTML = simpul + penutup;
            gambarTombolTutupSiklus_(r);
        }

        /** Menggeser tanggal 'YYYY-MM-DD' sebanyak n hari. */
        function geserTanggalSerah_(tanggal, n) {
            const d = new Date(String(tanggal) + 'T00:00:00');
            if (isNaN(d.getTime())) return tanggal;
            d.setDate(d.getDate() + n);
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        /** Memuat daftar petugas sekali, untuk pelengkapan otomatis nama & NIPP. */
        function muatDaftarPetugas_() {
            if (daftarPetugas_.length) return;
            // Sama seperti panel rantai: pelengkapan otomatis tidak boleh
            // menghalangi pengisian manual kalau servernya belum siap.
            try {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) return;
                    daftarPetugas_ = res.data || [];
                    const dl = document.getElementById('datalist-petugas');
                    if (dl) {
                        dl.innerHTML = daftarPetugas_.map(function (p) {
                            return '<option value="' + escapeHtml(p.nama) + '">' + escapeHtml(p.nipp) + '</option>';
                        }).join('');
                    }
                })
                .withFailureHandler(function () { /* pelengkapan otomatis bukan syarat - formulir tetap bisa diisi manual */ })
                .dinasan_getPetugas(currentSessionToken);
            } catch (err) { console.log('[dinasan] daftar petugas dilewati:', err); }
        }

        /** Mengisi NIPP otomatis begitu nama petugas dikenali. */
        function lengkapiNipp_(sisi) {
            setTimeout(gambarQrSerah_, 50);   // QR ikut berubah saat petugas diisi
            const nama = document.getElementById('serah-' + sisi + '-nama').value.trim().toUpperCase();
            const cocok = daftarPetugas_.find(function (p) { return String(p.nama).toUpperCase() === nama; });
            if (cocok) document.getElementById('serah-' + sisi + '-nipp').value = cocok.nipp;
        }


        // ================================================================
        // SUMMARY LAPORAN DINASAN - rekap per HARI (30 Agustus 2026)
        // ================================================================

        let summaryHarian_ = null;

        function muatSummaryHarian_() {
            const wadah = document.getElementById('lapdin-harian');
            if (!wadah) return;
            const dari = (document.getElementById('lapdin-mulai') || {}).value || '';
            const sampai = (document.getElementById('lapdin-akhir') || {}).value || '';

            try {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res.success) { wadah.innerHTML = '<p class="text-[11px] text-red-500 font-bold py-6 text-center">Gagal menyusun laporan harian.</p>'; return; }
