<!--
  Script_TrainControl.html
  Logic untuk modul Train Control (Serah Terima Dinasan, Prog & Real
  Roster, Buku Raport Staf). SUDAH tersambung ke backend nyata (Google
  Sheets, lewat Module_TrainControl.gs).

  Daftar staf (staffList) dimuat sekali dari server & dipakai bersama oleh
  Raport dan Roster Dinasan (persis seperti desain awal, tidak ada form
  tambah/edit staf).
-->
<script>
        // ─── FUNGSI DASAR (cadangan mandiri) ─────────────────────────────
        // Definisi cadangan fungsi umum yang dipakai file ini. Ditanam di
        // SETIAP Script_*.html dengan pola idempotent (window.x = window.x
        // || ...) supaya file ini TETAP BERFUNGSI walau SharedScripts.html
        // kebetulan belum ter-update ke versi terbaru. Ini mencegah satu
        // file yang ketinggalan versi merusak seluruh modul lain.
        window.escapeHtml = window.escapeHtml || function (val) {
            if (val === null || val === undefined) return '';
            return String(val)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        };
        window.startLoadingWatchdog = window.startLoadingWatchdog || function () { return null; };


        // Cache data dari server - BUKAN dummy lagi.
        let serahTerimaData = [];
        let raportData = [];
        let staffList = [];
        let dinasanShiftRoster = {};

        let currentMonthDays = 30;
        let dinasanEditMode = false;

        // Data referensi hari libur - tidak ada form kelola di desain awal,
        // tetap sebagai konfigurasi statis (bukan data transaksional).
        const holidayCalendars = {
            "5": [{ tgl: 1, desc: "Senin, 1 Juni 2026: Libur Nasional Hari Lahir Pancasila" },
            { tgl: 16, desc: "Selasa, 16 Juni 2026: Libur Nasional Tahun Baru Islam 1448 H" }],
            "6": [{ tgl: 17, desc: "Jumat, 17 Juli 2026: Cuti Bersama KCI" }],
            "7": [{ tgl: 17, desc: "Senin, 17 Agustus 2026: Hari Kemerdekaan RI" }]
        };

        // ─── CLOCK ──────────────────────────────────────────────────────
        setInterval(() => {
            const now = new Date();
            const el = document.getElementById('real-clock');
            if (el) el.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit',
                    second: '2-digit' }) + " WIB";
        }, 1000);

        // ─── STAF (dimuat sekali, dipakai Raport & Roster) ───────────────

        /**
         * Memuat daftar staf dari server sekali saja (dipakai ulang oleh
         * Raport & Roster Dinasan tanpa perlu memuat berkali-kali).
         * @param {Function} [afterLoad] Dipanggil setelah selesai.
         */
        function loadStaffList(afterLoad) {
            if (staffList.length > 0) { if (afterLoad) afterLoad(); return; }
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) staffList = res.data;
                    else showToast('Gagal memuat data staf: ' + (res.message || ''));
                    if (afterLoad) afterLoad();
                })
                .withFailureHandler(function () {
                    showToast('Terjadi kesalahan saat memuat data staf.');
                    if (afterLoad) afterLoad();
                })
                .tc_getStaffList(currentSessionToken);
        }

        // ─── SERAH TERIMA ─────────────────────────────────────────────

        function loadSerahTerima() {
            const tbody = document.getElementById('serah-terima-tbody');
            if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 font-bold">Memuat data...</td></tr>';
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { serahTerimaData = res.data; renderSerahTerimaTable(); }
                    else { showToast('Gagal memuat data: ' + (res.message || '')); if (tbody) tbody.innerHTML = ''; }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat data.'); })
                .tc_getSerahTerima(currentSessionToken);
        }

        function renderSerahTerimaTable() {
            const tbody = document.getElementById('serah-terima-tbody');
            if (!tbody) return;
            tbody.innerHTML = '';
            serahTerimaData.forEach(item => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 transition h-14">
                        <td class="px-6 py-4">${escapeHtml(item.shift)}</td>
                        <td class="px-6 py-4 font-black">${escapeHtml(item.lepas)}</td>
                        <td class="px-6 py-4 font-black">${escapeHtml(item.terima)}</td>
                        <td class="px-6 py-4 font-normal text-slate-500 leading-normal max-w-xs">${escapeHtml(item.catatan)}</td>
                        <td class="px-6 py-4 text-center"><span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-[9px] uppercase font-black">${escapeHtml(item.status)}</span></td>
                    </tr>
                `);
            });
            if (serahTerimaData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-400 font-bold">Belum ada catatan serah terima.</td></tr>';
            }
        }

        function openSerahTerimaModal() { document.getElementById('modal-input-serah').classList.remove('hidden'); }

        function closeSerahTerimaModal() { document.getElementById('modal-input-serah').classList.add('hidden'); }

        function handleSerahTerimaSubmit(e) {
            e.preventDefault();
            const item = {
                shift: document.getElementById('s-shift').value,
                lepas: document.getElementById('s-lepas').value,
                terima: document.getElementById('s-terima').value,
                catatan: document.getElementById('s-catatan').value
            };

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        closeSerahTerimaModal();
                        showToast("Catatan serah terima berhasil disimpan!");
                        loadSerahTerima();
                    } else {
                        showToast('Gagal menyimpan: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menyimpan catatan.'); })
                .tc_addSerahTerima(currentSessionToken, item);
        }

        // ─── RAPORT ─────────────────────────────────────────────────────

        function loadRaportDashboard() {
            loadStaffList(function () {
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (res.success) { raportData = res.data; renderRaportDashboard(); }
                        else { showToast('Gagal memuat data raport: ' + (res.message || '')); }
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat data raport.'); })
                    .tc_getRaport(currentSessionToken);
            });
        }

        function renderRaportDashboard() {
            const container = document.getElementById('raport-cards-container');
            if (!container) return;
            container.innerHTML = '';
            raportData.forEach(item => {
                const staff = staffList.find(s => s.nip === item.stafNip) || { nama: "Staff Umum", jabatan: "Operator" };
                const avg = Number(item.average) || 0;
                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 animate-fade-in">
                        <div class="flex items-center space-x-3 border-b border-slate-200 pb-3">
                            <div class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold">ST</div>
                            <div>
                                <h5 class="text-xs font-extrabold text-[#0c1d37]">${escapeHtml(staff.nama)}</h5>
                                <p class="text-[9px] text-slate-400 font-bold">${escapeHtml(staff.jabatan)}</p>
                            </div>
                        </div>
                        <div class="space-y-2 text-[10px]">
                            <div class="flex justify-between items-center"><span>Ketepatan OTP</span><span class="font-bold">${escapeHtml(item.otp)}</span></div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full" style="width: ${item.otp}%"></div></div>
                            <div class="flex justify-between items-center"><span>Kepatuhan Regulasi</span><span class="font-bold">${escapeHtml(item.reg)}</span></div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden"><div class="bg-blue-500 h-full" style="width: ${item.reg}%"></div></div>
                            <div class="flex justify-between items-center"><span>Audit Keselamatan</span><span class="font-bold">${escapeHtml(item.safety)}</span></div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden"><div class="bg-red-500 h-full" style="width: ${item.safety}%"></div></div>
                        </div>
                        <div class="pt-3 border-t border-slate-200 flex justify-between items-center text-xs font-black">
                            <span>NILAI RATA-RATA</span>
                            <span class="text-emerald-600">${avg.toFixed(1)}</span>
                        </div>
                    </div>
                `);
            });
            if (raportData.length === 0) {
                container.innerHTML = '<p class="text-center py-6 text-slate-400 font-bold col-span-full">Belum ada nilai raport.</p>';
            }
            const sel = document.getElementById('rp-staf');
            if (sel) { sel.innerHTML = '';
                staffList.forEach(s => sel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(s.nip)}">${escapeHtml(s.nama)}</option>`)); }
        }

        function openAddRaportModal() { document.getElementById('modal-input-raport').classList.remove('hidden'); }

        function closeAddRaportModal() { document.getElementById('modal-input-raport').classList.add('hidden'); }

        function handleRaportSubmit(e) {
            e.preventDefault();
            const nip = document.getElementById('rp-staf').value;
            const otp = parseInt(document.getElementById('rp-otp').value) || 0;
            const reg = parseInt(document.getElementById('rp-reg').value) || 0;
            const siap = parseInt(document.getElementById('rp-siap').value) || 0;
            const safety = parseInt(document.getElementById('rp-safety').value) || 0;
            const avg = (otp + reg + siap + safety) / 4;
            const entry = { stafNip: nip, otp: otp, reg: reg, siap: siap, safety: safety, average: avg };

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        closeAddRaportModal();
                        showToast("Nilai raport staf diperbarui!");
                        loadRaportDashboard();
                    } else {
                        showToast('Gagal menyimpan: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menyimpan nilai raport.'); })
                .tc_saveRaport(currentSessionToken, entry);
        }

        // ─── ROSTER DINASAN ───────────────────────────────────────────

        /**
         * Memuat kerangka kalender bulan aktif. Memastikan daftar staf
         * sudah ada, lalu mengambil roster bulan tsb dari server.
         */
        function generateDinasanCalendarGrid() {
            // ═══ KALENDER LAMA SUDAH TIDAK ADA DI HALAMAN ═══
            // Elemen #dinasan-month-filter milik kalender roster generasi awal
            // sudah lama dilepas (roster kini di menu Prog & Real). Dulu baris
            // di bawah tetap membaca .value dari null & MELEMPAR galat - dan
            // karena dipanggil dari enterDashboard(), sisa proses masuk
            // (membuka tab awal, pemantau sesi, label versi) ikut terhenti
            // untuk setiap role yang boleh melihat menu Dinasan.
            const pilihBulan = document.getElementById('dinasan-month-filter');
            if (!pilihBulan) return;
            const monthIdx = parseInt(pilihBulan.value);
            loadStaffList(function () { loadDinasanRoster(monthIdx); });
        }

        function loadDinasanRoster(monthIdx) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        dinasanShiftRoster = {};
                        res.data.forEach(r => { dinasanShiftRoster[`${r.monthIdx}_${r.day}_${r.nip}`] = r.shift; });
                        renderDinasanCalendarShell(monthIdx);
                    } else {
                        showToast('Gagal memuat roster: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat memuat roster.'); })
                .tc_getDinasanRoster(currentSessionToken, monthIdx);
        }

        function renderDinasanCalendarShell(monthIdx) {
            const year = 2026;
            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September"];
            const monthName = monthNames[monthIdx];
            currentMonthDays = new Date(year, monthIdx + 1, 0).getDate();

            const header1 = document.getElementById('dinasan-header-row-1');
            const header2 = document.getElementById('dinasan-header-row-2');
            header1.innerHTML =
                `<th rowspan="2" class="px-4 py-4 border-r border-slate-300 w-12 text-center">NO</th><th rowspan="2" class="px-4 py-4 border-r border-slate-300 w-44 text-left">NAMA STAFF</th><th rowspan="2" class="px-4 py-4 border-r border-slate-300 w-52 text-left">JABATAN</th>`;
            header2.innerHTML = '';
            const dayNames = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            for (let d = 1; d <= currentMonthDays; d++) {
                const dayObj = new Date(year, monthIdx, d);
                const dayName = dayNames[dayObj.getDay()];
                const isWeekend = (dayObj.getDay() === 0 || dayObj.getDay() === 6);
                const isHoliday = (holidayCalendars[monthIdx] || []).some(h => h.tgl === d);
                const cl1 = (isWeekend || isHoliday) ? "text-[#e11d48] bg-[#fef2f2] font-black" : "text-slate-800";
                const cl2 = (isWeekend || isHoliday) ? "text-[#e11d48] bg-[#fef2f2] font-black" : "text-slate-500";
                header1.insertAdjacentHTML('beforeend',
                    `<th class="px-2 py-2 border-r border-slate-200 w-12 text-center ${cl1}">${d < 10 ? '0'+d : d}-${monthName.substring(0,3)}</th>`
                    );
                header2.insertAdjacentHTML('beforeend',
                    `<th class="px-2 py-1 border-r border-slate-200 w-12 text-center ${cl2}">${dayName.substring(0,3)}</th>`
                    );
            }

            const holContainer = document.getElementById('dinasan-holidays-list');
            if (holContainer) {
                holContainer.innerHTML = '';
                const holidays = holidayCalendars[monthIdx] || [];
                if (holidays.length === 0) holContainer.innerHTML =
                    '<p class="text-slate-400 italic text-[10px]">Tidak ada hari libur nasional pada bulan ini.</p>';
                else holidays.forEach(h => holContainer.insertAdjacentHTML('beforeend',
                    `<p class="flex items-center text-[10px]"><i class="fa-solid fa-circle text-[4px] text-red-500 mr-2"></i> ${h.desc}</p>`
                    ));
            }
            renderDinasanTableBody(monthIdx);
        }

        function renderDinasanTableBody(monthIdx) {
            const tbody = document.getElementById('dinasan-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            const groups = ["KANTOR OPERASI DEPOK", "OCC MANGGARAI"];
            let globalNo = 1;
            groups.forEach(group => {
                const groupStaff = staffList.filter(s => s.group === group);
                const colspan = currentMonthDays + 3;
                tbody.insertAdjacentHTML('beforeend',
                    `<tr class="bg-slate-50 border-y border-slate-200 text-slate-800 text-[10px] font-black uppercase text-left"><td colspan="${colspan}" class="px-4 py-2 tracking-wider">${group}</td></tr>`
                    );
                groupStaff.forEach(staff => {
                    let cells = '';
                    for (let d = 1; d <= currentMonthDays; d++) {
                        const key = `${monthIdx}_${d}_${staff.nip}`;
                        if (!dinasanShiftRoster[key]) {
                            const dayObj = new Date(2026, monthIdx, d);
                            dinasanShiftRoster[key] = (dayObj.getDay() === 0 || dayObj.getDay() === 6) ? "L" : "N";
                        }
                        const shift = dinasanShiftRoster[key];
                        let bg = "bg-white text-slate-800";
                        if (shift === "DP41") bg = "bg-emerald-100 text-emerald-800 border border-emerald-500 rounded-sm";
                        else if (shift === "DS52") bg = "bg-blue-100 text-blue-800 border border-blue-500 rounded-sm";
                        else if (shift === "DM4") bg = "bg-amber-100 text-amber-800 border border-amber-500 rounded-sm";
                        else if (shift === "DP82") bg = "bg-cyan-100 text-cyan-800 border border-cyan-500 rounded-sm";
                        else if (shift === "L") bg = "bg-slate-100 text-slate-400";

                        let content = `<span class="px-1.5 py-0.5 inline-block font-black text-[9px] w-8 ${bg}">${shift}</span>`;
                        if (dinasanEditMode) {
                            content = `
                                <select onchange="updateDinasanCell('${monthIdx}', ${d}, '${staff.nip}', this.value)" class="bg-white border border-slate-300 font-black text-[9px] p-0.5 rounded cursor-pointer">
                                    <option value="N" ${shift==='N'?'selected':''}>N</option>
                                    <option value="DP82" ${shift==='DP82'?'selected':''}>DP82</option>
                                    <option value="DP41" ${shift==='DP41'?'selected':''}>DP41</option>
                                    <option value="DS52" ${shift==='DS52'?'selected':''}>DS52</option>
                                    <option value="DM4" ${shift==='DM4'?'selected':''}>DM4</option>
                                    <option value="L" ${shift==='L'?'selected':''}>L</option>
                                </select>
                            `;
                        }
                        cells += `<td class="px-1 py-2 border-r border-slate-200 text-center">${content}</td>`;
                    }
                    tbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-slate-50 transition-colors text-[10px]">
                            <td class="px-2 py-2 border-r border-slate-200 text-center font-extrabold text-slate-400 font-mono">${globalNo++}</td>
                            <td class="px-4 py-2 border-r border-slate-200 text-left font-black text-slate-900 truncate max-w-[150px]">${escapeHtml(staff.nama)}</td>
                            <td class="px-4 py-2 border-r border-slate-200 text-left font-bold text-slate-500 truncate max-w-[160px]" title="${escapeHtml(staff.jabatan)}">${escapeHtml(staff.jabatan)}</td>
                            ${cells}
                        </tr>
                    `);
                });
            });
        }

        /**
         * Mengubah satu sel shift: tampilan diupdate langsung (optimistic),
         * lalu disimpan ke server di belakang layar.
         */
        function updateDinasanCell(monthIdx, day, nip, newShift) {
            const key = `${monthIdx}_${day}_${nip}`;
            dinasanShiftRoster[key] = newShift;
            google.script.run
                .withFailureHandler(function () { showToast('Gagal menyimpan perubahan shift ke server.'); })
                .tc_saveDinasanCell(currentSessionToken, monthIdx, day, nip, newShift);
        }

        function toggleDinasanEditMode() {
            dinasanEditMode = !dinasanEditMode;
            const btn = document.getElementById('btn-dinasan-edit');
            const label = document.getElementById('label-dinasan-edit');
            if (dinasanEditMode) {
                btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs px-5 py-2.5 rounded-xl flex items-center space-x-1.5 shadow uppercase transition";
                label.innerText = "SIMPAN EDIT";
            } else {
                btn.className = "bg-[#e67e22] hover:bg-[#d35400] text-white font-black text-xs px-5 py-2.5 rounded-xl flex items-center space-x-1.5 shadow uppercase transition";
                label.innerText = "EDIT";
            }
            const monthIdx = parseInt(document.getElementById('dinasan-month-filter').value);
            renderDinasanCalendarShell(monthIdx); // render ulang tampilan tabel dari cache (tidak perlu fetch ulang)
        }

        function toggleDinasanExportDropdown() {
            document.getElementById('export-dinasan-dropdown-menu').classList.toggle('hidden');
        }

        function exportDinasan(format) {
            const mode = document.getElementById('dinasan-tab-filter').value;
            const monthIdx = document.getElementById('dinasan-month-filter').value;
            const mNames = ["Juni", "Juli", "Agustus"];
            const mName = mNames[parseInt(monthIdx) - 5] || "Juni";
            if (format === 'excel') {
                let csv = [];
                let headers = ["No", "Nama", "Jabatan"];
                for (let d = 1; d <= currentMonthDays; d++) headers.push(`${d}-${mName.substring(0,3)}`);
                csv.push(headers.join(","));
                staffList.forEach((s, idx) => {
                    let row = [idx + 1, s.nama, `"${s.jabatan.replace(/"/g,'""')}"`];
                    for (let d = 1; d <= currentMonthDays; d++) {
                        const key = `${monthIdx}_${d}_${s.nip}`;
                        row.push(dinasanShiftRoster[key] || "N");
                    }
                    csv.push(row.join(","));
                });
                const blob = new Blob([csv.join("\n")], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(blob));
                link.setAttribute("download", `Roster_${mode}_COTP_${mName}_2026.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast(`Roster ${mode} diexport ke CSV!`);
            } else {
                window.print();
            }
            document.getElementById('export-dinasan-dropdown-menu').classList.add('hidden');
        }

        function openDinasanUploadModal() {
            document.getElementById('modal-upload-dinasan').classList.remove('hidden');
            const sel = document.getElementById('m-dinasan-staff');
            if (sel) { sel.innerHTML = '';
                staffList.forEach(s => sel.insertAdjacentHTML('beforeend',
                    `<option value="${escapeHtml(s.nip)}">${escapeHtml(s.nama)} (${escapeHtml(s.nip)})</option>`)); }
        }

        function closeDinasanUploadModal() { document.getElementById('modal-upload-dinasan').classList.add('hidden'); }

        function switchDinasanInputTab(tab) {
            const btnExcel = document.getElementById('btn-dinasan-tab-excel');
            const btnManual = document.getElementById('btn-dinasan-tab-manual');
            const zoneExcel = document.getElementById('dinasan-upload-excel-zone');
            const formManual = document.getElementById('dinasan-manual-form');
            if (tab === 'excel') {
                btnExcel.className = "flex-1 py-2 font-bold border-b-2 border-amber-500 text-slate-900 transition-all";
                btnManual.className = "flex-1 py-2 font-bold text-slate-400 border-b-2 border-transparent transition-all";
                zoneExcel.classList.remove('hidden');
                formManual.classList.add('hidden');
            } else {
                btnManual.className = "flex-1 py-2 font-bold border-b-2 border-amber-500 text-slate-900 transition-all";
                btnExcel.className = "flex-1 py-2 font-bold text-slate-400 border-b-2 border-transparent transition-all";
                zoneExcel.classList.add('hidden');
                formManual.classList.remove('hidden');
            }
        }

        /**
         * Simulasi upload Excel (sama seperti desain awal - hanya
         * menampilkan nama file & toast sukses, TIDAK benar-benar
         * mem-parsing/menyimpan isi Excel; desain awal juga begitu).
         */
        function handleDinasanExcelUploadSim(e) {
            const file = e.target.files[0];
            const label = document.getElementById('label-dinasan-excel-import');
            if (file) {
                label.innerText = `Terunggah: ${file.name}`;
                label.classList.add('text-emerald-600');
                setTimeout(() => { showToast("Sukses mengimpor seluruh roster dari Excel!");
                    closeDinasanUploadModal(); }, 1000);
            }
        }

        function handleManualDinasanSubmit(e) {
            e.preventDefault();
            const nip = document.getElementById('m-dinasan-staff').value;
            const tgl = document.getElementById('m-dinasan-tgl').value;
            const shift = document.getElementById('m-dinasan-shift').value;
            if (!tgl) return;
            const parts = tgl.split('-');
            const day = parseInt(parts[2]);
            const monthIdx = parseInt(parts[1]) - 1;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        closeDinasanUploadModal();
                        showToast("Dinasan manual tersimpan.");
                        const activeMonthIdx = parseInt(document.getElementById('dinasan-month-filter').value);
                        if (activeMonthIdx === monthIdx) loadDinasanRoster(monthIdx);
                    } else {
                        showToast('Gagal menyimpan: ' + (res.message || ''));
                    }
                })
                .withFailureHandler(function () { showToast('Terjadi kesalahan saat menyimpan dinasan.'); })

        function terapkanModeSuntingArsip_(nyala, d) {
            modeSuntingArsip_ = !!nyala;

            const bilah = document.getElementById('serah-mode-arsip');
            if (bilah) {
                bilah.classList.toggle('hidden', !nyala);
                if (nyala) {
                    const ket = document.getElementById('serah-mode-arsip-ket');

            ['btn-terima-tahap', 'btn-terima-mewakili', 'btn-tutup-siklus', 'btn-add-tc-serah']
                .forEach(function (idTombol) {

                    if (!el) return;
                    if (nyala) {
                        el.dataset.sembunyiArsip = '1';

                    } else if (el.dataset.sembunyiArsip === '1') {
                        delete el.dataset.sembunyiArsip;

            const ket = document.getElementById('rantai-tutup');

            // ── Tombol ──

                btnSerah.disabled = !d.bolehSerahkan;

                    : (d.alasanClosing || 'Belum bisa di-closing.');
                btnTutup.className = d.bolehClosing
                    ? 'px-3 py-2 bg-[#d4af37] hover:bg-amber-400 text-[#0c1d37] border border-amber-500/40 font-bold text-[11px] rounded-lg flex items-center gap-1.5 shadow-sm transition'

            // ═══ MENGUNCI FORMULIR TANPA MERUSAK KUNCI BAWAANNYA ═══

                        el.disabled = true;
                        el.setAttribute('data-dikunci-siklus', '1');
                    });
                } else {
                    form.querySelectorAll('[data-dikunci-siklus]').forEach(function (el) {
                        el.disabled = false;

        /**
         * Kotak "Menunggu Tindakan Anda" - digambar dari SIKLUS AKTIF.

         * Kotak versi lama membaca daftar serah terima per-dokumen & memasang
         * tombol "Lanjutkan Pengisian" yang MEMUAT CATATAN LAMA ke formulir.
         * Akibatnya layar menampilkan satu laporan sementara tombol Serahkan

         * yang rusak.

         * Sekarang kotak ini, bilah tahap, & keadaan tombol semuanya berasal

         * kebenaran di satu layar.
         */
        function gambarKotakTindakanSiklus_(d) {
            const wadah = document.getElementById('serah-notifikasi');
            if (!wadah) return;

            const kartu = function (warna, ikon, judul, rincian, tombol) {
                return '<div class="p-3 rounded-xl border ' + warna + ' flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">' +
                    '<div class="min-w-0">' +
                        '<p class="text-[11px] font-black flex items-center gap-1.5"><i class="fa-solid ' + ikon + '"></i>' + judul + '</p>' +
                        '<p class="text-[10px] font-bold opacity-80 mt-0.5">' + rincian + '</p></div>' +
                    (tombol || '') + '</div>';
            };

            let isi = '';
            if (d.bolehTerima) {
                isi = kartu('bg-amber-50 border-amber-300 text-amber-900', 'fa-inbox',
                    'Menunggu Anda menerima laporan',
                    escapeHtml(d.nomorDokumen || '') + ' &middot; dari ' + escapeHtml(d.menyerahkanNama || '-') +
                    ' &middot; ' + escapeHtml(d.tahapLabel || ''),
                    // ═══ TOMBOLNYA HANYA SATU ═══
                    // Dulu ada dua Terima Laporan sekaligus: hijau di bilah
                    // tombol atas & kuning di kartu ini. Dua tombol dengan
                    // tulisan sama pada satu layar membuat orang ragu apakah
                    // keduanya melakukan hal yang sama - & keraguan itu
                    // memperlambat justru pada tindakan yang harus cepat.
                    //
                    // Yang dipertahankan tombol di bilah atas, sebaris dengan
                    // Serahkan & Close Laporan; kartu ini kembali ke tugas
                    // aslinya: menjelaskan APA yang menunggu.
                    '<span class="shrink-0 px-3 py-2 bg-white border border-amber-300 text-amber-800 font-bold text-[10px] rounded-lg">' +
                    'Tekan <strong>Terima Laporan</strong> di atas</span>');
            } else if (d.status === 'terkirim') {
                isi = kartu('bg-slate-50 border-slate-200 text-slate-700', 'fa-hourglass-half',
                    'Menunggu ' + escapeHtml(d.menerimaNama || 'dinas berikutnya') + ' menerima',
                    'Selama ini Anda belum bisa logout. Laporan tetap bisa dilihat &amp; dicetak.',

            } else if (d.bolehClosing) {
                isi = kartu('bg-[#0c1d37]/[0.04] border-[#0c1d37]/20 text-[#0c1d37]', 'fa-flag-checkered',

                    'Laporan sudah kembali ke dinas Malam. Closing Report menutup siklus ini &amp; membuka siklus berikutnya.', '');
            } else if (!d.bolehEdit) {

                    'Anda bisa melihatnya, tapi belum bisa mengubah sampai menerima serah terimanya.', '');

            wadah.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2.5';
            wadah.innerHTML =
                '<div class="flex items-center justify-between gap-2">' +
                    '<p class="text-[11px] font-black text-[#0c1d37] uppercase tracking-wider flex items-center gap-2">' +
                        '<span class="w-6 h-6 rounded-lg bg-[#0c1d37] text-[#d4af37] inline-flex items-center justify-center text-[10px]"><i class="fa-solid fa-bell"></i></span>' +

        /** Memuat isi siklus ke formulir - dipakai ulang isiFormulirDariDinasan_. */

        function serahkanTahapSiklus_() {
            // Pesan lama berbunyi "Belum bisa diserahkan." saja - tidak
            // mengatakan apa pun tentang sebabnya, & itulah yang membuat
            // keadaan ini terasa seperti tombol rusak.
            if (!siklusAktif_) {
                showToast('Laporan siklus belum termuat. Sedang dimuat ulang - coba lagi sebentar.');
                muatSiklusAktif_();
                return;
            }
            if (!siklusAktif_.bolehSerahkan) {
                const d = siklusAktif_;
                showToast(
                    d.status === 'terkirim'
                        ? 'Laporan ini sudah diserahkan & sedang menunggu ' + (d.menerimaNama || 'dinas berikutnya') + ' menekan Terima.'
                    : !d.tahapBerikut
                        ? 'Ini tahap terakhir siklus - yang tersedia adalah Closing Report, bukan serah terima.'
                    : !d.bolehEdit
                        ? 'Laporan sedang dipegang ' + (d.pemegangNama || 'dinas lain') + '. Anda baru bisa menyerahkannya setelah menerima serah terimanya.'
                    : 'Belum bisa diserahkan pada tahap ' + (d.tahapLabel || d.tahap) + '.');
                return;
            }
            const data = kumpulkanFormSerah_();
            const kurang = periksaKelengkapanSerah_(data);
            if (kurang.length) { tampilkanKurangSerah_(kurang); return; }

            const tujuan = siklusAktif_.tahapBerikutShift || 'berikutnya';
            konfirmasi_({
                judul: 'Serahkan ke Dinas ' + tujuan + '?',
                pesan: 'Laporan berpindah ke ' + (data.menerima.nama || 'petugas penerima') +
                       '. Anda belum bisa logout sampai ia menekan Terima Laporan.',
                ya: 'Serahkan', ikonYa: 'fa-paper-plane', ikon: 'fa-paper-plane'
            }).then(function (ya) {
                if (!ya) return;
                google.script.run
                    .withSuccessHandler(function (res) {
                        if (!res || !res.success) { showToast('Gagal menyerahkan: ' + ((res && res.message) || '')); return; }
                        showToast('Laporan diserahkan ke ' + (res.menerima || 'dinas berikutnya') + '.');
                        muatSiklusAktif_();
                    })
                    .withFailureHandler(function () { showToast('Terjadi kesalahan saat menyerahkan laporan.'); })
                    .dinasan_serahkanTahap(currentSessionToken, data);
            });
        }

        /**
         * @param {boolean} [mewakili] true bila ditekan dari tombol
         *        "Terima Mewakili" - dimintai penegasan lebih dulu, karena
         *        menerima atas nama orang lain memindahkan tanggung jawab
         *        laporan & tercatat permanen di Riwayat Aktivitas.
         */
        function terimaTahapSiklus_(mewakili) {
            if (mewakili) {

            konfirmasi_({

        /**
         * Penanda langkah ikut berpindah saat digulir.
         *
         * IntersectionObserver dipakai, bukan menghitung posisi pada tiap
         * kejadian gulir: perhitungan manual dijalankan puluhan kali per detik
         * dan membuat formulir sepanjang ini terasa berat pada perangkat lama.
         */
        let pengamatLangkah_ = null;
        function pasangPengamatLangkah_() {
            if (pengamatLangkah_ || typeof IntersectionObserver === 'undefined') return;
            const bagian = [];
            for (let i = 1; i <= 5; i++) {
                const el = document.getElementById('langkah-' + i);
                if (el) bagian.push(el);
            }
            if (!bagian.length) return;

            pengamatLangkah_ = new IntersectionObserver(function (entri) {
                const terlihat = entri.filter(function (e) { return e.isIntersecting; });
                if (!terlihat.length) return;
                // Yang paling dekat ke atas layar yang dianggap sedang dibaca.
                terlihat.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
                const n = Number(String(terlihat[0].target.id).replace('langkah-', ''));
                if (n) tandaiLangkahAktif_(n);
            }, { rootMargin: '-96px 0px -70% 0px', threshold: 0 });

            bagian.forEach(function (el) { pengamatLangkah_.observe(el); });
        }

        /**
         * Menyeragamkan nilai jam apa pun menjadi "HH:mm".
         *
         * Diperlukan karena <input type="time"> MENOLAK DIAM-DIAM nilai yang
         * bentuknya tidak persis HH:mm - kolomnya lalu tampil "--:--" seolah
         * tidak pernah diisi, padahal datanya ada.
         *
         * Baris lama bisa tersimpan sebagai "10:15:00", "8.05", atau bahkan
         * "29-12-1899 22:15" (lihat catatan KOLOM_TEKS_MURNI di
         * Service_Sheets.gs). Semuanya diselamatkan di sini, jadi data yang
         * terlanjur tersimpan tidak perlu diperbaiki satu per satu.
         */
        function jamHHMM_(nilai) {
            const s = String(nilai === undefined || nilai === null ? '' : nilai).trim();
            if (!s) return '';
            // Titik dua didahulukan. Kalau dot dicari lebih dulu, tanggal
            // bertitik seperti "30.12.1899 10:15" akan terbaca "30:12".
            let m = s.match(/(\d{1,2}):(\d{2})/);
            if (!m) m = s.match(/(?:^|\s)(\d{1,2})\.(\d{2})(?:\s|$)/);
            if (!m) {
                const empat = s.match(/^(\d{2})(\d{2})$/);      // "0815"
                if (empat) m = [null, empat[1], empat[2]];
            }
            if (!m) return '';
            const j = Number(m[1]), n = Number(m[2]);
            if (isNaN(j) || isNaN(n) || j > 23 || n > 59) return '';
            return String(j).padStart(2, '0') + ':' + String(n).padStart(2, '0');
        }

            const daftar = barisPerjalanan_[jenis] || [];
            daftar.splice(idx, 1);
            if (!daftar.length) daftar.push({});   // sisakan satu baris agar tabel tidak kosong
            renderKlb_(jenis);
        }

        function ubahKlb_(jenis, idx, kolom, nilai) {
            const daftar = barisPerjalanan_[jenis] || [];
            if (daftar[idx]) daftar[idx][kolom] = nilai;
